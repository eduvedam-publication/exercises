<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#e4f9fd;font-family:Arial,sans-serif}
.exercise{max-width:1120px;min-height:500px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:28px 38px;display:flex;flex-direction:column}
h1{margin:0 0 25px;color:#00a3dc;font-size:25px}.content{flex:1}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;min-width:34px;font:20px Georgia}.frac span:first-child{border-bottom:1.5px solid #222;padding:0 5px 3px}.frac span:last-child{padding-top:3px}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:27px 38px}.eqrow{display:flex;align-items:center;gap:10px;font:20px Georgia}
.finput{width:58px;height:58px;border:2px solid #d83291;border-radius:10px;font-size:16px;text-align:center;padding:3px}
.markgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 38px}.markrow{display:flex;align-items:center;gap:14px;font:20px Georgia}
.mark{width:72px;height:43px;border:2px solid #d83291;border-radius:10px;background:#fff;font-size:24px;cursor:pointer}.mark.sel{background:#fff0f8}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}
.series{display:flex;flex-direction:column;gap:20px}.srow{display:flex;align-items:center;gap:12px;font:20px Georgia;flex-wrap:wrap}.boxfrac{border:2px solid #d83291;border-radius:10px;padding:4px 12px}.sinput{width:70px;height:48px;border:2px solid red;border-radius:7px;font-size:16px;text-align:center}
.controls{margin-top:auto;padding-top:28px;display:flex;justify-content:center;gap:14px}.controls button{border:0;border-radius:24px;background:#ff7d00;color:white;font-weight:bold;padding:12px 22px;cursor:pointer}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:13px}
@media(max-width:800px){.exercise{padding:22px}.eqgrid,.markgrid{grid-template-columns:1fr}.srow{gap:8px}}
</style></head><body>
<main class="exercise"><h1>Write three equivalent fractions of each.</h1><section class="content"><div class="eqgrid"><div class="eqrow"><b>a.</b><span class="frac"><span>2</span><span>3</span></span><input class="finput" id="a0" placeholder=" / "><input class="finput" id="a1" placeholder=" / "><input class="finput" id="a2" placeholder=" / "></div><div class="eqrow"><b>b.</b><span class="frac"><span>3</span><span>5</span></span><input class="finput" id="a3" placeholder=" / "><input class="finput" id="a4" placeholder=" / "><input class="finput" id="a5" placeholder=" / "></div><div class="eqrow"><b>c.</b><span class="frac"><span>15</span><span>19</span></span><input class="finput" id="a6" placeholder=" / "><input class="finput" id="a7" placeholder=" / "><input class="finput" id="a8" placeholder=" / "></div><div class="eqrow"><b>d.</b><span class="frac"><span>4</span><span>7</span></span><input class="finput" id="a9" placeholder=" / "><input class="finput" id="a10" placeholder=" / "><input class="finput" id="a11" placeholder=" / "></div><div class="eqrow"><b>e.</b><span class="frac"><span>5</span><span>11</span></span><input class="finput" id="a12" placeholder=" / "><input class="finput" id="a13" placeholder=" / "><input class="finput" id="a14" placeholder=" / "></div><div class="eqrow"><b>f.</b><span class="frac"><span>7</span><span>9</span></span><input class="finput" id="a15" placeholder=" / "><input class="finput" id="a16" placeholder=" / "><input class="finput" id="a17" placeholder=" / "></div><div class="eqrow"><b>g.</b><span class="frac"><span>4</span><span>23</span></span><input class="finput" id="a18" placeholder=" / "><input class="finput" id="a19" placeholder=" / "><input class="finput" id="a20" placeholder=" / "></div><div class="eqrow"><b>h.</b><span class="frac"><span>6</span><span>13</span></span><input class="finput" id="a21" placeholder=" / "><input class="finput" id="a22" placeholder=" / "><input class="finput" id="a23" placeholder=" / "></div><div class="eqrow"><b>i.</b><span class="frac"><span>5</span><span>8</span></span><input class="finput" id="a24" placeholder=" / "><input class="finput" id="a25" placeholder=" / "><input class="finput" id="a26" placeholder=" / "></div></div></section><div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div class="score" id="score">Score: 0 / 27</div></main><script>const A=['4/6', '6/9', '8/12', '6/10', '9/15', '12/20', '30/38', '45/57', '60/76', '8/14', '12/21', '16/28', '10/22', '15/33', '20/44', '14/18', '21/27', '28/36', '8/46', '12/69', '16/92', '12/26', '18/39', '24/52', '10/16', '15/24', '20/32'];function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById('a'+i),g=e.value.replace(/\s/g,'')===a;e.classList.remove('ok','bad');e.classList.add(g?'ok':'bad');if(g)s++});score.textContent='Score: '+s+' / 27'}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});score.textContent='Score: 0 / 27'}</script></body></html>
