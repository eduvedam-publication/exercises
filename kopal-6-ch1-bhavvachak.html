<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>दिए गए शब्दों से भाववाचक संज्ञाएँ बनाइए—</title><style>*{box-sizing:border-box}body{margin:0;background:#ccfbff;font-family:"Noto Sans Devanagari",Mangal,Arial,sans-serif;color:#202a35}.wrap{max-width:1050px;margin:18px auto;background:white;border:3px solid #00aaf0;border-radius:22px;padding:24px}h2{color:#00a9ed;margin:0 0 18px;font-size:25px}.q{background:#e9faff;border:1px solid #00b6ff;border-radius:12px;padding:14px;margin:10px 0;font-size:18px;line-height:1.9}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.opt{background:white;border:1px solid #7cdcff;border-radius:9px;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}.opt.selected{background:#b6f7eb;border:2px solid #00a7e8}.opt.correct,.slot.correct,input.correct{border-color:#17a34a;background:#e7ffed}.opt.wrong,.slot.wrong,input.wrong{border-color:#e44242;background:#fff0f0}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:22px}button{background:#ff7900;border:0;border-radius:25px;color:white;padding:11px 19px;font-weight:700;cursor:pointer}.marks{text-align:center;color:#045bc6;font-size:20px;font-weight:bold;margin:12px}.bank{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;background:#d8f8ff;padding:14px;border-radius:10px}.chip{border:1px solid #00aaff;background:white;color:#222;border-radius:8px;padding:8px 13px;cursor:grab;font-size:17px}.chip.used{opacity:.4}.slot{display:inline-flex;min-width:105px;min-height:39px;align-items:center;justify-content:center;border:2px dashed #ff8064;border-radius:7px;padding:3px 8px;vertical-align:middle;cursor:pointer;background:white}.slot.active{background:#fff2cf}.txt{border:1px solid #ff765b;border-radius:5px;padding:8px;font-size:18px;max-width:100%;font-family:inherit}.word{min-width:120px;display:inline-block}.line{margin:6px 0}.feedback{font-size:14px;color:#525252;text-align:center}@media(max-width:650px){.wrap{margin:5px;padding:12px}.opts{grid-template-columns:1fr}.q{font-size:16px}h2{font-size:21px}}</style></head><body><main class="wrap"><h2>दिए गए शब्दों से भाववाचक संज्ञाएँ बनाइए—</h2><div id="questions"></div><div class="controls"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div id="marks" class="marks">Marks: 0 / 4</div></main><script>const DATA=[{"q": "सुंदर", "a": "सुंदरता"}, {"q": "लघु", "a": "लघुता|लघुत्व"}, {"q": "मधुर", "a": "मधुरता|माधुर्य"}, {"q": "अमर", "a": "अमरत्व"}], TYPE="bhavvachak",KEY='exercise-kopal-6-ch1-'+TYPE;let answers={},revealed=false,active=null;const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];try{answers=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(answers));}function norm(x){return String(x||'').replace(/[।.,\s]/g,'').trim()}function valid(v,expected){return String(expected).split('|').some(x=>norm(x)===norm(v))}function draw(){const root=$('#questions');root.innerHTML='';if(TYPE==='mcq'){DATA.forEach((q,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<div>'+q.q+'</div><div class="opts">'+q.opts.map((o,j)=>'<div class="opt '+(answers[i]===j?'selected':'')+'" data-i="'+i+'" data-j="'+j+'"><span>'+'( '+['i','ii','iii'][j]+' ) '+o+'</span><span>□</span></div>').join('')+'</div>';root.append(d)});$$('.opt').forEach(el=>el.onclick=()=>{answers[el.dataset.i]=+el.dataset.j;save();draw()})}else if(TYPE==='poem'){let bank=document.createElement('div');bank.className='bank';bank.innerHTML=DATA.bank.map((w,j)=>'<button class="chip" draggable="true" data-word="'+j+'">'+w+'</button>').join('');root.append(bank);let d=document.createElement('div');d.className='q';d.innerHTML=DATA.lines.map((line,i)=>'<div class="line">'+line.replace('___','<span class="slot" data-i="'+i+'">'+(answers[i]??'')+'</span>')+'</div>').join('');root.append(d);$$('.chip').forEach(c=>{c.onclick=()=>{if(active!==null){answers[active]=DATA.bank[c.dataset.word];active=null;save();draw()}else{window.selectedWord=DATA.bank[c.dataset.word];$$('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active')}};c.ondragstart=e=>e.dataTransfer.setData('text/plain',DATA.bank[c.dataset.word])});$$('.slot').forEach(s=>{s.onclick=()=>{if(window.selectedWord){answers[s.dataset.i]=window.selectedWord;window.selectedWord=null;save();draw()}else{active=+s.dataset.i;s.classList.add('active')}};s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();answers[s.dataset.i]=e.dataTransfer.getData('text/plain');save();draw()}})}else{DATA.forEach((q,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<span class="word">'+q.q+'</span> '+(TYPE==='sentences'?'— ':'× ')+'<input class="txt" data-i="'+i+'" value="'+(answers[i]||'').replace(/"/g,'&quot;')+'" placeholder="उत्तर लिखिए">';root.append(d)});$$('input').forEach(el=>el.oninput=()=>{answers[el.dataset.i]=el.value;save()})}if(revealed)mark()};function mark(){let n=0;(TYPE==='poem'?DATA.lines:DATA).forEach((q,i)=>{let expected=TYPE==='poem'?DATA.correct[i]:q.a;let ok=TYPE==='mcq'?answers[i]===q.a:valid(answers[i],expected);if(ok)n++;let el=TYPE==='mcq'?$$('.q')[i]?.querySelectorAll('.opt')[answers[i]]:TYPE==='poem'?$$('.slot')[i]:$$('input')[i];if(el)el.classList.add(ok?'correct':'wrong')});$('#marks').textContent='Marks: '+n+' / '+(TYPE==='poem'?DATA.lines.length:DATA.length)}$('#submit').onclick=()=>{revealed=true;draw()};$('#show').onclick=()=>{(TYPE==='poem'?DATA.lines:DATA).forEach((q,i)=>answers[i]=TYPE==='mcq'?q.a:TYPE==='poem'?DATA.correct[i]:q.a.split('|')[0]);save();revealed=true;draw()};$('#reset').onclick=()=>{answers={};revealed=false;save();$('#marks').textContent='Marks: 0 / '+(TYPE==='poem'?DATA.lines.length:DATA.length);draw()};draw();</script></body></html>
