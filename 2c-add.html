<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add the following</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1050px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 20px;color:#009ed2;font-size:27px}
.grid{display:grid;grid-template-columns:repeat(4,150px);justify-content:space-between;column-gap:18px;row-gap:24px;padding:0 12px}
.item{display:grid;grid-template-columns:27px 126px;align-items:start}
.num{font-family:Georgia,serif;font-size:19px;padding-top:7px}
.sum{width:126px;height:136px;background:#e0eff9;padding:7px 8px}
.place{height:32px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;color:#ff4050;font-family:Georgia,serif;font-size:20px}
.row{height:30px;display:grid;grid-template-columns:24px repeat(3,1fr);align-items:center;text-align:center;font-family:Georgia,serif;font-size:20px}
.add{border-bottom:2px solid #222}
.answer{display:block;width:110px;height:34px;margin:3px 0 0;border:2px solid #ff3b30;background:#fff;padding:3px 6px;font-size:18px;outline:none}
.answer.ok{background:#dcf8df;border-color:#009b8e}.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,150px);justify-content:space-around}}
@media(max-width:390px){.exercise{margin:0;border-radius:0;padding:14px}.grid{grid-template-columns:150px;justify-content:center;padding:0}h1{font-size:22px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Add the following:</h1>
<div class="grid" id="grid"></div>
<div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div>
<div id="result">Score: 0 / 8</div>
</main>
<script>
const data=[
 [1,[4,5,3],[0,0,6],459],
 [2,[2,5,0],[0,0,9],259],
 [3,[4,1,2],[0,4,6],458],
 [4,[3,6,5],[0,3,4],399],
 [5,[2,6,6],[1,2,3],389],
 [6,[2,0,8],[1,4,1],349],
 [7,[3,4,3],[1,3,4],477],
 [8,[1,3,0],[3,3,0],460]
];
const grid=document.getElementById("grid");
data.forEach((x,i)=>{
 const second=x[2];
 grid.insertAdjacentHTML("beforeend",`
 <div class="item">
  <div class="num">${x[0]}.</div>
  <div class="sum">
   <div class="place"><span>H</span><span>T</span><span>O</span></div>
   <div class="row"><span></span><span>${x[1][0]}</span><span>${x[1][1]}</span><span>${x[1][2]}</span></div>
   <div class="row add"><span>+</span><span>${second[0]||""}</span><span>${second[1]||""}</span><span>${second[2]}</span></div>
   <input id="a${i}" class="answer" inputmode="numeric">
  </div>
 </div>`);
});
function checkAnswers(){
 let score=0;
 data.forEach((x,i)=>{
  const e=document.getElementById("a"+i),ok=e.value.trim()===String(x[3]);
  e.className="answer "+(ok?"ok":"bad"); if(ok)score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 8`;
}
function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{e.value="";e.className="answer"});
 document.getElementById("result").textContent="Score: 0 / 8";
}
</script>
</body>
</html>
