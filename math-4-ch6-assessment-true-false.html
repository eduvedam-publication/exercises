<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>State true or false.</title><style>*{box-sizing:border-box}body{margin:0;background:#defaff;font-family:Georgia,"Times New Roman",serif;color:#17212d}.exercise{max-width:980px;margin:22px auto;background:white;border:3px solid #00aee3;border-radius:25px;padding:24px 28px}h1{color:#00a6df;font-size:25px;margin:0 0 20px}.question{background:#ecfaff;border:1px solid #00b7ee;border-radius:12px;padding:12px;margin:10px 0;font-size:19px}.options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.opt{border:1px solid #a6dcf5;border-radius:7px;background:white;padding:9px;display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:pointer;min-width:0}.opt.selected{background:#d6f1ff;border-color:#009ee1}.square{display:inline-grid;place-items:center;border:2px solid #00b8ed;width:25px;height:25px;flex-shrink:0;color:#0078b8}.opt.good,.answer.good{border-color:#13a45a;background:#dff8e9}.opt.bad,.answer.bad{border-color:#f43d45;background:#ffe3e4;animation:blink .45s 3}.answer{width:185px;max-width:100%;height:38px;border:2px solid #ff5360;background:white;font:18px Georgia;padding:4px 8px}.statement{display:flex;align-items:center;justify-content:space-between;gap:12px}.tf{display:flex;gap:8px}.tf button{background:#fff;color:#16465c;border:1px solid #00aee3;border-radius:8px;padding:8px 13px;font:18px Georgia;cursor:pointer}.tf button.selected{background:#bdeaff}.tf button.good{background:#dff8e9;border-color:#13a45a}.tf button.bad{background:#ffe3e4;border-color:#f43d45;animation:blink .45s 3}.actions{display:flex;justify-content:center;gap:12px;margin-top:24px}.actions button{background:#ff8000;border:0;color:#fff;border-radius:24px;padding:11px 19px;font-weight:bold;cursor:pointer}#result{text-align:center;color:#0050b8;font:bold 22px Arial;margin-top:16px}@keyframes blink{50%{background:#ff8e98}}@media(max-width:700px){.exercise{margin:6px;padding:14px}.options{grid-template-columns:repeat(2,minmax(0,1fr))}.question{font-size:17px}.statement{align-items:flex-start;flex-direction:column}}</style></head><body><main class="exercise"><h1>State true or false.</h1><div class="question statement"><span><b>a.</b> 54 is a multiple of 6.</span><div class="tf"><button data-i="0" data-v="true" onclick="choose(0,true)">True ✓</button><button data-i="0" data-v="false" onclick="choose(0,false)">False ✗</button></div></div><div class="question statement"><span><b>b.</b> 34 is a multiple of 4.</span><div class="tf"><button data-i="1" data-v="true" onclick="choose(1,true)">True ✓</button><button data-i="1" data-v="false" onclick="choose(1,false)">False ✗</button></div></div><div class="question statement"><span><b>c.</b> 200 is a multiple of 20.</span><div class="tf"><button data-i="2" data-v="true" onclick="choose(2,true)">True ✓</button><button data-i="2" data-v="false" onclick="choose(2,false)">False ✗</button></div></div><div class="question statement"><span><b>d.</b> 68 is a multiple of 8.</span><div class="tf"><button data-i="3" data-v="true" onclick="choose(3,true)">True ✓</button><button data-i="3" data-v="false" onclick="choose(3,false)">False ✗</button></div></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div id="result">Score: 0 / 4</div></main><script>const key="math-4-ch6-assessment-true-false-v1",correct=[true,false,true,false];let selected=JSON.parse(localStorage.getItem(key)||"[null,null,null,null]");function render(){document.querySelectorAll('.tf button').forEach(e=>{let i=+e.dataset.i,v=e.dataset.v==='true';e.className=selected[i]===v?'selected':''})}function choose(i,v){selected[i]=v;localStorage.setItem(key,JSON.stringify(selected));render();document.getElementById('result').textContent='Score: 0 / 4'}function checkAnswers(){let n=0;render();selected.forEach((v,i)=>{if(v===null)return;let e=document.querySelector(`.tf button[data-i="${i}"][data-v="${v}"]`);e.classList.add(v===correct[i]?'good':'bad');if(v===correct[i])n++});document.getElementById('result').textContent=`Score: ${n} / 4`}function resetExercise(){selected=[null,null,null,null];localStorage.removeItem(key);render();document.getElementById('result').textContent='Score: 0 / 4'}render();</script></body></html>
