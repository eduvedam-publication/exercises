<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chapter 13 Assessment Patterns</title><style>*{box-sizing:border-box}body{margin:0;background:#d3faff;font-family:Georgia,'Times New Roman',serif;color:#182332}.wrap{max-width:1050px;margin:25px auto;background:white;border:3px solid #00aeeb;border-radius:22px;padding:24px 28px}h2{color:#00a7df;margin:0 0 17px;font-size:25px}.q{background:#eafaff;border:1px solid #00b7f4;border-radius:12px;padding:13px;margin:10px 0;font-size:17px}.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:10px}.opt{border:1px solid #9adcf6;border-radius:7px;background:white;padding:9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:5px}.opt.selected{border:2px solid #00a5e4;background:#dff7ff}.opt.correct,.q.correct{background:#d8ffe8!important;border-color:#25b86a!important}.opt.wrong,.q.wrong{background:#ffe1e1!important;border-color:#ed5050!important;animation:flash .6s 2}@keyframes flash{50%{opacity:.48}}.actions{text-align:center;margin-top:23px}button{border:0;background:#ff8000;color:white;padding:11px 19px;border-radius:30px;font-weight:bold;margin:4px;cursor:pointer}.inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.blank{width:105px;max-width:100%;border:2px solid #ff6654;border-radius:3px;padding:6px;font:inherit;background:white}.blank.correct{background:#d8ffe8;border-color:#25b86a}.blank.wrong{background:#ffe1e1;border-color:#ed5050;animation:flash .6s 2}.choice{border:1px solid #00aeeb;border-radius:8px;background:white;padding:7px 14px;cursor:pointer}.choice.selected{background:#bdeeff}.choice.correct{background:#d8ffe8}.choice.wrong{background:#ffe1e1;animation:flash .6s 2}.statement{flex:1;min-width:200px}@media(max-width:720px){.wrap{margin:8px;padding:16px}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}h2{font-size:22px}}</style></head><body><main class="wrap"><h2>Complete the following patterns.</h2><section id="questions"></section><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAnswers()">Reset</button></div></main><script>const questions=[["81, 83, 86, 90,", "95, 101"], ["25, 29, 33, 37,", "41, 45"], ["3, 9, 27, 81,", "243, 729"], ["67, 78, 100,", "133, 177"], ["3, 6, 12,", "24, 48"]],key='math-4-ch13-assessment-patterns';let answers=JSON.parse(localStorage.getItem(key)||'{}');const root=document.getElementById('questions');function save(){localStorage.setItem(key,JSON.stringify(answers))}function render(){root.innerHTML='';questions.forEach((q,i)=>{let c=document.createElement('div');c.className='q inline';let p=document.createElement('span');p.textContent=String.fromCharCode(97+i)+'. '+q[0];let inp=document.createElement('input');inp.className='blank';inp.style.width='155px';inp.placeholder='__, __';inp.value=answers[i]||'';inp.oninput=()=>{answers[i]=inp.value;save();inp.classList.remove('correct','wrong')};c.append(p,inp);root.append(c)})}function norm(s){return String(s).replace(/\s/g,'').toLowerCase()}function checkAnswers(){root.querySelectorAll('input').forEach((inp,i)=>{inp.classList.remove('correct','wrong');if(inp.value.trim())inp.classList.add(norm(inp.value)===norm(questions[i][1])?'correct':'wrong')})}function showAnswers(){questions.forEach((q,i)=>answers[i]=q[1]);save();render();checkAnswers()}function resetAnswers(){answers={};save();render()}render();</script></body></html>
