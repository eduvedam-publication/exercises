<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>काल परिवर्तन – Drag & Drop</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:450px;display:flex;flex-direction:column}h2{font-size:23px;color:#00a9e5;margin:0 0 18px}.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;background:#e7f8fc;border-radius:12px;padding:13px;margin-bottom:15px}.chip{background:#fff;border:1.5px solid #00a9e5;border-radius:8px;padding:8px 12px;font-size:17px;cursor:grab;font-family:inherit}.chip.selected{background:#d8f0ff;border-color:#007ac4}.chip.used{opacity:.35}.q{border:1.5px solid #00c7ee;border-radius:12px;background:#f0fbfe;padding:12px;margin:7px 0;line-height:1.7}.answerline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:7px}.slot{display:inline-flex;align-items:center;justify-content:center;min-height:40px;min-width:230px;max-width:100%;padding:5px 12px;border:2px dashed #ff5656;border-radius:7px;background:white;cursor:pointer;font-size:17px}.slot.fixed{background:#d9f9dc;border:2px solid #0a9b55;cursor:default}.ok{background:#d9f9dc!important;border-color:#0a9b55!important}.bad{background:#ffe3e3!important;border-color:#e32b2b!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff6666}}.actions{display:flex;gap:9px;justify-content:center;margin-top:auto;padding-top:24px}.actions button{background:#ff8500;color:white;border:0;border-radius:20px;padding:10px 19px;cursor:pointer}#result{text-align:center;color:#0061b4;font-weight:bold;margin:12px}@media(max-width:600px){.wrap{margin:0;border-radius:0;padding:14px;min-height:100vh}h2{font-size:20px}.slot{min-width:180px}}</style></head><body><main class="wrap"><h2>आइए, कुछ काल परिवर्तन करें–</h2><div class="bank" id="bank"></div><section id="questions"></section><div class="actions"><button onclick="submitAnswers()">Submit</button><button onclick="resetAll()">Reset</button></div><div id="result" aria-live="polite"></div></main><script>
const data=[['(क)','बच्चा बहुत शैतान है।','भूतकाल में','बच्चा बहुत शैतान था।'],['(ख)','हम कल विद्यालय गए थे।','भविष्यत् काल में','हम कल विद्यालय जाएँगे।'],['(ग)','पिछले माह बहुत गरमी थी।','वर्तमान काल में','इस माह बहुत गरमी है।'],['(घ)','यहाँ बहुत से अतिथि आए हैं।','भविष्यत् काल में','यहाँ बहुत से अतिथि आएँगे।']];
const key='kopal-2-ch5-tense-drag-drop';let answers=[null,null,null,null],selected=null;const bank=document.getElementById('bank'),questions=document.getElementById('questions');
function persist(){localStorage.setItem(key,JSON.stringify(answers))}
function render(){bank.innerHTML='';for(let i=1;i<data.length;i++){const b=document.createElement('button');b.className='chip'+(selected===i?' selected':'')+(answers.includes(i)?' used':'');b.textContent=data[i][3];b.draggable=true;b.disabled=answers.includes(i);b.onclick=()=>{selected=selected===i?null:i;render()};b.ondragstart=e=>{selected=i;e.dataTransfer.setData('text/plain',String(i))};bank.appendChild(b)}questions.innerHTML='';data.forEach((d,i)=>{const q=document.createElement('div');q.className='q';const label=document.createElement('div');label.innerHTML='<b>'+d[0]+'</b> '+d[1]+' ('+d[2]+')';q.appendChild(label);const row=document.createElement('div');row.className='answerline';const slot=document.createElement('div');slot.className='slot'+(i===0?' fixed':'');slot.textContent=i===0?d[3]:(answers[i]===null?'यहाँ उत्तर रखें':data[answers[i]][3]);if(i!==0){slot.onclick=()=>{if(selected!==null){answers[i]=selected;selected=null;persist();render()}else if(answers[i]!==null){answers[i]=null;persist();render()}};slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();let v=Number(e.dataTransfer.getData('text/plain'));if(v>=1&&v<=3){answers[i]=v;selected=null;persist();render()}}}row.appendChild(slot);if(i===0){const note=document.createElement('small');note.textContent='उदाहरण';note.style.color='#087b41';row.appendChild(note)}q.appendChild(row);questions.appendChild(q)})}
function submitAnswers(){persist();document.querySelectorAll('.q .slot').forEach((el,i)=>{if(i===0)return;el.classList.remove('ok','bad');el.classList.add(answers[i]===i?'ok':'bad')});document.getElementById('result').textContent='उत्तर सुरक्षित हैं।'}
function resetAll(){answers=[null,null,null,null];selected=null;localStorage.removeItem(key);document.getElementById('result').textContent='';render()}
try{let saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.length===4)answers=saved.map((v,i)=>i===0?null:([1,2,3].includes(v)?v:null))}catch(e){}render();
</script></body></html>
