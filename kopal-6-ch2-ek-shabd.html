<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>दिए गए वाक्यांशों के लिए एक शब्द बनाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#cffaff;font-family:Georgia,"Noto Sans Devanagari",serif;color:#18242a}.wrap{max-width:1050px;margin:20px auto;background:white;border:3px solid #00aeef;border-radius:22px;padding:25px}h2{color:#00a7ed;margin:0 0 17px}.q{background:#e7faff;border:1px solid #00b8ff;border-radius:12px;padding:13px;margin:9px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.opt{background:white;border:1px solid #7bd7ff;border-radius:8px;padding:10px;cursor:pointer}.opt.selected{background:#c7f5ed;border:2px solid #00a5bc}.bank{display:flex;flex-wrap:wrap;gap:10px;background:#dbf8ff;padding:14px;border-radius:10px;margin-bottom:12px}.chip{border:1px solid #00aeef;background:white;border-radius:7px;padding:8px 12px;cursor:grab;font-size:18px}.chip.used{opacity:.4}.slot{display:inline-flex;min-width:135px;min-height:39px;vertical-align:middle;border:2px dashed #ff7858;border-radius:7px;align-items:center;justify-content:center;background:white;padding:4px 10px;cursor:pointer;color:#133d48}.actions{text-align:center;margin-top:24px}button.action{border:0;background:#ff7900;color:white;border-radius:22px;padding:12px 19px;margin:4px;cursor:pointer;font-weight:bold}.marks{text-align:center;color:#004cc8;font-size:22px;font-weight:bold;margin:12px}.correct{border-color:#20ad66!important}.wrong{border-color:#f44747!important}@media(max-width:650px){.wrap{margin:6px;padding:12px}.opts{grid-template-columns:1fr}.q{font-size:17px}}</style></head><body><main class="wrap"><h2>दिए गए वाक्यांशों के लिए एक शब्द बनाइए–</h2><p>उत्तर को खींचकर सही स्थान पर रखें या पहले उत्तर चुनें और फिर रिक्त स्थान पर क्लिक करें।</p><section id="questions"></section><div class="actions"><button class="action" onclick="check()">Submit</button><button class="action" onclick="show()">Show Answer</button><button class="action" onclick="reset()">Reset</button></div><div class="marks" id="marks">Marks: 0 / 4</div></main><script>const DATA=[["(क) जो नया-नया आया हो —", "नवागंतुक"], ["(ख) जो चिड़ियों को मारने का काम करता हो —", "चिड़ीमार"], ["(ग) जिसमें चूहे बंद किए जाते हैं —", "चूहादानी"], ["(घ) हिंसा करने वाला —", "हिंसक"]],TYPE="drag",KEY='kopal6ch2_'+TYPE;let answers=JSON.parse(localStorage.getItem(KEY)||'{}');const root=document.getElementById('questions');function save(){localStorage.setItem(KEY,JSON.stringify(answers))}function render(){root.innerHTML='';if(TYPE==='mcq'){DATA.forEach((q,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<div>'+q[0]+'</div><div class="opts">'+q[1].map((o,j)=>'<div class="opt '+(answers[i]===j?'selected':'')+'" data-i="'+i+'" data-j="'+j+'">'+['(i)','(ii)','(iii)'][j]+' '+o+'</div>').join('')+'</div>';root.append(d)});root.querySelectorAll('.opt').forEach(e=>e.onclick=()=>{answers[e.dataset.i]=+e.dataset.j;save();render()})}else{let bank=document.createElement('div');bank.className='bank';bank.innerHTML=DATA.map((q,i)=>'<button class="chip" draggable="true" data-a="'+i+'">'+q[1]+'</button>').join('');root.append(bank);DATA.forEach((q,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<span>'+q[0]+'</span> <span class="slot" data-i="'+i+'">'+(answers[i]===undefined?'उत्तर यहाँ रखें':DATA[answers[i]][1])+'</span>';root.append(d)});let chosen=null;root.querySelectorAll('.chip').forEach(c=>{c.onclick=()=>{chosen=+c.dataset.a;c.style.outline='3px solid orange'};c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.a)});root.querySelectorAll('.slot').forEach(s=>{s.onclick=()=>{if(chosen!==null){answers[s.dataset.i]=chosen;save();render()}else{delete answers[s.dataset.i];save();render()}};s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();answers[s.dataset.i]=+e.dataTransfer.getData('text/plain');save();render()}})}}function check(){let n=0;root.querySelectorAll('.q').forEach((el,i)=>{let ok=TYPE==='mcq'?answers[i]===DATA[i][2]:answers[i]===i;if(ok)n++;el.classList.toggle('correct',ok);el.classList.toggle('wrong',!ok)});document.getElementById('marks').textContent='Marks: '+n+' / '+DATA.length}function show(){DATA.forEach((q,i)=>answers[i]=TYPE==='mcq'?q[2]:i);save();render();check()}function reset(){answers={};save();render();document.getElementById('marks').textContent='Marks: 0 / '+DATA.length}render();</script></body></html>
