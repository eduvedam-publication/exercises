<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{margin:0 0 26px;color:#00a5dc;font-size:25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:700px){body{padding:0}.ex{border-radius:0;padding:16px}}.sequences{display:grid;gap:17px}.seq{display:grid;grid-template-columns:35px repeat(3,minmax(130px,1fr));align-items:center;gap:20px;font:20px Georgia,serif}.seq input{width:125px;height:40px;border:2px solid #ff3b30;font-size:18px;padding:5px 7px}.seq input.ok{background:#dcf8df}.seq input.bad{background:#ffe1e1}@media(max-width:700px){.seq{grid-template-columns:25px repeat(3,minmax(80px,1fr));gap:6px}.seq input{width:100%}}</style></head><body><main class="ex"><h1>Fill in the blanks.</h1><div class="sequences"><div class="seq"><span>a.</span><span>Tuesday</span><input id="a0"><span>Thursday</span></div><div class="seq"><span>b.</span><input id="a1"><span>February</span><span>March</span></div><div class="seq"><span>c.</span><span>June</span><input id="a2"><span>August</span></div><div class="seq"><span>d.</span><span>October</span><span>November</span><input id="a3"></div><div class="seq"><span>e.</span><span>Saturday</span><span>Sunday</span><input id="a4"></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 5</div></main><script>const ans=['Wednesday', 'January', 'July', 'December', 'Monday'];function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=e.value.trim().toLowerCase()===a.toLowerCase();e.className=ok?"ok":"bad";if(ok)s++});score.textContent=`Score: ${s} / 5`}function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.className=""});score.textContent="Score: 0 / 5"}</script></body></html>
