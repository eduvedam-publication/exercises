<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही (✓) या गलत (✗) का चिह्न लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#cef9ff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#142434}.wrap{max-width:1000px;margin:22px auto;padding:25px;border:3px solid #00aeeb;border-radius:22px;background:white}h1{color:#00a8e6;font-size:27px;margin:0 0 20px}.q{background:#e9faff;border:1.5px solid #00b5f8;border-radius:12px;padding:13px 16px;margin:9px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px solid #8cdfff;border-radius:9px;padding:10px;cursor:pointer;min-height:48px}.opt input{accent-color:#00a8e6;width:19px;height:19px}.opt.good,.good{background:#d9fbe7!important;border-color:#21ad58!important}.opt.bad,.bad{background:#ffe0e0!important;border-color:#f44336!important}.actions{text-align:center;margin-top:25px}button{background:#ff8000;color:white;border:0;border-radius:22px;padding:11px 20px;margin:4px;cursor:pointer;font-weight:bold;font-size:15px}.marks{text-align:center;color:#0049be;font-weight:bold;font-size:19px;margin-top:10px}.bank{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;background:#dcf7ff;padding:16px;border-radius:12px;margin-bottom:14px}.chip{background:white;border:1.5px solid #00b7f9;border-radius:9px;padding:8px 15px;font-size:19px;cursor:grab}.chip.used{opacity:.35}.blank{display:inline-flex;min-width:125px;min-height:40px;vertical-align:middle;border:2px dashed #ff684b;border-radius:7px;align-items:center;justify-content:center;padding:4px 9px;cursor:pointer;color:#12426c}.blank:empty:before{content:' ';white-space:pre}.truth{display:flex;gap:8px;margin-left:auto}.truth button{border:2px solid #00b5f8;border-radius:7px;background:white;color:#006a94;padding:5px 12px;font-size:22px;margin:0}.truth button.selected{background:#c9efff}.qline{display:flex;align-items:center;gap:14px}.qline span{flex:1}@media(max-width:620px){.wrap{margin:8px;padding:14px}h1{font-size:22px}.q{font-size:16px}.opts{grid-template-columns:1fr}.truth button{padding:4px 8px}}</style></head><body><main class="wrap"><h1>सही (✓) या गलत (✗) का चिह्न लगाइए–</h1><section class="q qline"><span>(क) विशेषण के स्थान पर सर्वनाम शब्दों का प्रयोग किया जाता है।</span><div class="truth"><button id="t01" onclick="choose(0,1)">✓</button><button id="t00" onclick="choose(0,0)">✗</button></div></section><section class="q qline"><span>(ख) सर्वनाम शब्दों के प्रयोग से भाषा सुंदर बन जाती है।</span><div class="truth"><button id="t11" onclick="choose(1,1)">✓</button><button id="t10" onclick="choose(1,0)">✗</button></div></section><section class="q qline"><span>(ग) सर्वनाम शब्दों के आठ भेद हैं।</span><div class="truth"><button id="t21" onclick="choose(2,1)">✓</button><button id="t20" onclick="choose(2,0)">✗</button></div></section><section class="q qline"><span>(घ) सर्वनाम शब्दों का वचन भी परिवर्तित होता है।</span><div class="truth"><button id="t31" onclick="choose(3,1)">✓</button><button id="t30" onclick="choose(3,0)">✗</button></div></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswer()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="marks" class="marks">Marks: 0 / 4</div></main><script>const KEY="gyandhara-4-ch10-tick";const answers=[0,1,0,1];let state={};function save(){localStorage.setItem(KEY,JSON.stringify(state))}function restore(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object')state=v}catch(e){}}function score(correct){document.getElementById('marks').textContent='Marks: '+correct+' / 4'}function choose(i,v){state[i]=v;save();paint()}function paint(){for(let i=0;i<4;i++)for(let v=0;v<=1;v++){let el=document.getElementById('t'+i+v);el.classList.toggle('selected',state[i]===v)}}function check(){let n=0;for(let i=0;i<4;i++)for(let v=0;v<=1;v++){let el=document.getElementById('t'+i+v);el.classList.remove('good','bad');if(state[i]===v){let ok=v===answers[i];el.classList.add(ok?'good':'bad');if(ok)n++}}score(n)}function showAnswer(){answers.forEach((v,i)=>state[i]=v);save();paint();check()}function resetAll(){state={};localStorage.removeItem(KEY);paint();document.querySelectorAll('.truth button').forEach(x=>x.classList.remove('good','bad'));score(0)}restore();paint();</script></body></html>
