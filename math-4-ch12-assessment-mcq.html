<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 Chapter 12 Assessment - MCQ</title><style>
:root{--cyan:#00adeb;--blue:#0051b7;--light:#eafaff;--orange:#ff8000}*{box-sizing:border-box}body{margin:0;background:#d4faff;font-family:Georgia,'Times New Roman',serif;color:#182433}.sheet{max-width:1030px;margin:20px auto;padding:24px 28px;background:#fff;border:3px solid var(--cyan);border-radius:22px}h1{color:#00a8e8;font-size:26px;margin:0 0 18px}.questions{display:grid;gap:12px}.question{background:#ebfaff;border:1.5px solid #00b6ff;border-radius:12px;padding:12px 14px}.prompt{font-size:17px;line-height:1.5;margin-bottom:9px}.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.opt{border:1px solid #9cddf5;border-radius:8px;background:#fff;min-height:47px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;cursor:pointer;text-align:left;font:16px Georgia,serif;color:#17283d}.opt:hover{border-color:#00a8e8}.opt.selected{background:#d8f2ff;border:2px solid #009fdf}.check{width:23px;height:23px;border:2px solid #00a8e8;flex-shrink:0;display:grid;place-items:center;font-weight:bold;color:#0087bb}.opt.selected .check:after{content:'✓'}.opt.correct{background:#d6f9e0;border-color:#14a24b;color:#096a2d}.opt.wrong{background:#ffe0e0;border-color:#ed3030;color:#b30000;animation:blink .7s 2}@keyframes blink{50%{background:#fff}}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:23px}button.action{background:var(--orange);color:white;border:0;border-radius:25px;padding:11px 21px;font-weight:bold;cursor:pointer;font-family:inherit;font-size:15px}.note{font-size:13px;color:#556b7c;text-align:center;margin:12px 0 0}@media(max-width:760px){.sheet{margin:8px;padding:17px 12px}h1{font-size:22px}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}.opt{font-size:15px}}@media(max-width:420px){.opts{grid-template-columns:1fr}}
</style></head><body><main class="sheet"><h1>Choose the correct option.</h1><section class="questions" id="questions"></section><div class="actions"><button class="action" id="check">Check Answers</button><button class="action" id="show">Show Answer</button><button class="action" id="reset">Reset</button></div></main><script>
const data=[{"q": "The distance from the ________ to the curved line of a circle is same.", "options": ["radius", "diameter", "centre", "periphery"], "answer": 2}, {"q": "How many lines can be drawn through two points.", "options": ["1", "2", "3", "4"], "answer": 0}, {"q": "________ is a rectangle with all 4 sides equal.", "options": ["rhombus", "parallelogram", "trapezium", "square"], "answer": 3}, {"q": "The radius of a circle is 3 cm. Its diameter will be ________.", "options": ["6 cm", "5 cm", "8 cm", "3 cm"], "answer": 0}, {"q": "________ points are in one line.", "options": ["1", "2", "3", "4"], "answer": 1}];const KEY='math-4-ch12-assessment-mcq-v1';let selected=Array(data.length).fill(null);try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved)&&saved.length===data.length)selected=saved.map(v=>Number.isInteger(v)&&v>=0&&v<4?v:null)}catch(e){}let checked=false;const letters=['a','b','c','d','e'];const roman=['i','ii','iii','iv'];const root=document.getElementById('questions');function save(){try{localStorage.setItem(KEY,JSON.stringify(selected))}catch(e){}}function render(){root.innerHTML='';data.forEach((item,i)=>{const wrap=document.createElement('div');wrap.className='question';const p=document.createElement('div');p.className='prompt';p.innerHTML='<b>'+letters[i]+'.</b> '+item.q;wrap.appendChild(p);const opts=document.createElement('div');opts.className='opts';item.options.forEach((opt,j)=>{const b=document.createElement('button');b.type='button';b.className='opt'+(selected[i]===j?' selected':'')+(checked&&selected[i]===j?(j===item.answer?' correct':' wrong'):'');b.setAttribute('aria-pressed',selected[i]===j?'true':'false');const t=document.createElement('span');t.textContent=roman[j]+'. '+opt;const c=document.createElement('span');c.className='check';b.append(t,c);b.onclick=()=>{selected[i]=j;checked=false;save();render()};opts.appendChild(b)});wrap.appendChild(opts);root.appendChild(wrap)})}document.getElementById('check').onclick=()=>{checked=true;render()};document.getElementById('show').onclick=()=>{selected=data.map(x=>x.answer);checked=true;save();render()};document.getElementById('reset').onclick=()=>{selected=Array(data.length).fill(null);checked=false;save();render()};render();
</script></body></html>
