<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>दिए गए प्रश्नों के सही विकल्प चुनिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#b9f9fc;font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;color:#183243;font-size:18px}.sheet{max-width:1040px;margin:24px auto;background:#fff;border:3px solid #03a9f4;border-radius:20px;padding:22px 25px}h1{font-size:27px;color:#00a5ee;margin:0 0 18px}.item{background:#e0f8ff;border:1.5px solid #00aeff;border-radius:12px;margin:9px 0;padding:12px 14px}.q{margin-bottom:9px;line-height:1.7}.opts,.bank{display:flex;flex-wrap:wrap;gap:9px}.choice,.chip,.slot{font:inherit;background:#fff;border:1.5px solid #1eb9ff;border-radius:9px;color:#183243;padding:7px 13px;cursor:pointer;min-height:40px}.choice.selected,.chip.selected,.slot.selected{background:#b0edff;border-color:#008be5}.choice.correct,.slot.correct{background:#d6f9df;border-color:#21a957;color:#146b31}.choice.wrong,.slot.wrong{background:#ffe0e0;border-color:#e33;color:#a00}.slot{border-style:dashed;border-color:#ff716c;min-width:135px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin:0 4px}.bank{background:#d4f8ff;padding:10px;border-radius:10px;margin:8px 0 12px}.chip.used{opacity:.4}.footer{text-align:center;margin-top:22px}.action{border:0;border-radius:25px;padding:11px 20px;margin:3px;background:#ff7900;color:white;font-weight:700;cursor:pointer}.score{font-size:21px;color:#003cdb;font-weight:bold;margin-top:9px}.note{font-size:15px;color:#526978;margin-bottom:10px}.answer{font-size:15px;color:#167037;margin-top:7px}.sentence{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.word{font:inherit;border:1px solid #19b4fc;border-radius:7px;background:#fff;padding:6px 10px;cursor:pointer}.word.used{opacity:.35}.built{min-height:44px;padding:7px;border:1px dashed #ff8278;border-radius:8px;display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.built .word{background:#b9ecff}@media(max-width:600px){body{font-size:16px}.sheet{margin:6px;padding:12px;border-radius:12px}h1{font-size:21px}.choice,.chip,.slot{padding:7px 9px}.action{padding:10px 13px}}</style></head><body><main class="sheet"><h1>दिए गए प्रश्नों के सही विकल्प चुनिए–</h1><div class="note"></div><div id="questions"></div><div class="footer"><button class="action" id="submit">Submit</button><button class="action" id="show">Show Answer</button><button class="action" id="reset">Reset</button><div class="score" id="score">Marks: 0 / 4</div></div></main><script>const TYPE="mcq";const DATA=[{"q": "पंडित शादाराम कौन थे?", "opts": ["एक मेहमान", "लाला जी के पुरोहित", "लाला जी के अतिथि"], "a": 1}, {"q": "बीमार कौन हो गए थे?", "opts": ["पंडित शादाराम", "लाला सदानंद", "दोनों"], "a": 1}, {"q": "यदि ‘बेखुद’ का अर्थ है ‘बिना होश के’ तो ‘बेहिचक’ का अर्थ होगा–", "opts": ["बिना हिचकी लिए", "बिना हिसाब लिए", "बिना संकोच के"], "a": 2}, {"q": "‘शादाराम के हृदय पर बरछियाँ चल जाती थीं।’ इसमें ‘पर’ क्या है?", "opts": ["सर्वनाम", "संबंधबोधक", "समुच्चयबोधक"], "a": 1}];const KEY='kopal6ch9-'+TYPE;let answers={};try{answers=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};const root=document.getElementById('questions');const score=document.getElementById('score');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(answers))}catch(e){}};const safe=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function mark(n){score.textContent='Marks: '+n+' / '+DATA.length}function reset(){answers={};save();render();mark(0)}function show(){DATA.forEach((d,i)=>answers[i]=d.a);save();render();mark(DATA.length)}document.getElementById('reset').onclick=reset;document.getElementById('show').onclick=show;function render(){root.innerHTML=DATA.map((d,i)=>`<section class="item"><div class="q">(${['क','ख','ग','घ'][i]}) ${safe(d.q)}</div><div class="opts">${d.opts.map((o,j)=>`<button class="choice ${answers[i]===j?'selected':''}" data-i="${i}" data-j="${j}">(${['i','ii','iii'][j]}) ${safe(o)}</button>`).join('')}</div></section>`).join('');root.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{answers[b.dataset.i]=+b.dataset.j;save();render()})}document.getElementById('submit').onclick=()=>{let n=0;root.querySelectorAll('.item').forEach((el,i)=>{const d=DATA[i],a=answers[i];if(a===d.a)n++;el.querySelectorAll('.choice').forEach((b,j)=>{b.classList.toggle('correct',j===d.a);b.classList.toggle('wrong',j===a&&a!==d.a)})});mark(n)}
render();</script></body></html>
