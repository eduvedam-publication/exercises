n load(){sc=0;x.innerHTML='';s.textContent='Score: 0 / '+Q.length;Q.forEach(z=>{let c=document.createElement('div');c.className='c r';let t=document.createElement('div');t.className='g';t.textContent=z[0];c.append(t);C.forEach(v=>{let k=document.createElement('button');k.className='b';k.textContent=v;k.onclick=()=>{if(c.dataset.d)return;c.dataset.d=1;c.querySelectorAll('button').forEach(y=>{y.disabled=true;if(y.textContent===z[1])y.classList.add('ok')});if(v===z[1])sc++;else k.classList.add('bad');s.textContent='Score: '+sc+' / '+Q.length};c.append(k)});x.append(c)})}load();</script></body></html>
