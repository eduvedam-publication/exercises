<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 - Chapter 6 - HCF</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;color:#222;font-family:Georgia,'Times New Roman',serif}.exercise{max-width:980px;margin:20px auto;padding:25px 30px;background:white;border:3px solid #00afe2;border-radius:25px}h2{margin:0 0 22px;color:#00a7db;font-size:25px}.questions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.q{background:#ebfaff;border:1.5px solid #00b7ef;border-radius:11px;padding:14px 10px;display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:19px}.q label{flex-shrink:0}.q input{min-width:0;width:78px;height:38px;border:2px solid #ff5361;background:#fff;text-align:center;font:19px Georgia;outline:0}.q input.correct{border-color:#16a34a;background:#e2f9e7}.q input.wrong{border-color:#ef334e;background:#ffe2e6;animation:blink .45s 3}@keyframes blink{50%{background:#ff8799}}.actions{display:flex;justify-content:center;gap:12px;margin-top:30px}button{background:#ff8200;border:0;border-radius:22px;color:#fff;padding:11px 20px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0049b8;font:bold 21px Arial;margin:16px 0 0}@media(max-width:850px){.questions{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.exercise{margin:7px;padding:17px 12px}.questions{grid-template-columns:1fr}h2{font-size:21px}}</style></head><body><main class="exercise"><h2>2. &nbsp; Find the HCF of the following numbers.</h2><div class="questions"><div class="q"><label for="a">a. &nbsp;35, 41</label><input id="a" inputmode="numeric" aria-label="HCF of 35 and 41"></div><div class="q"><label for="b">b. &nbsp;18, 24</label><input id="b" inputmode="numeric" aria-label="HCF of 18 and 24"></div><div class="q"><label for="c">c. &nbsp;15, 35</label><input id="c" inputmode="numeric" aria-label="HCF of 15 and 35"></div><div class="q"><label for="d">d. &nbsp;7, 91</label><input id="d" inputmode="numeric" aria-label="HCF of 7 and 91"></div></div><div class="actions"><button type="button" onclick="checkAnswers()">Check Answers</button><button type="button" onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 4</div></main><script>const key='math-4-ch6-6a-hcf-v1';const ids=['a','b','c','d'],answers=['1','6','5','7'];function save(){try{localStorage.setItem(key,JSON.stringify({values:ids.map(id=>document.getElementById(id).value),score:document.getElementById('score').textContent}))}catch(e){}}function checkAnswers(){let count=0;ids.forEach((id,i)=>{let el=document.getElementById(id),ok=el.value.trim()===answers[i];el.classList.remove('correct','wrong');void el.offsetWidth;el.classList.add(ok?'correct':'wrong');if(ok)count++});document.getElementById('score').textContent=`Score: ${count} / 4`;save()}function resetExercise(){ids.forEach(id=>{let el=document.getElementById(id);el.value='';el.classList.remove('correct','wrong')});document.getElementById('score').textContent='Score: 0 / 4';save()}ids.forEach(id=>document.getElementById(id).addEventListener('input',e=>{e.target.classList.remove('correct','wrong');save()}));try{let s=JSON.parse(localStorage.getItem(key)||'null');if(s){ids.forEach((id,i)=>document.getElementById(id).value=s.values?.[i]||'');document.getElementById('score').textContent=s.score||'Score: 0 / 4'}}catch(e){}</script></body></html>
