<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solve the following.</title><style>*{box-sizing:border-box}body{margin:0;padding:24px 16px;background:#b9fbff;color:#172735;font-family:Georgia,'Times New Roman',serif}.sheet{width:min(1120px,100%);margin:auto;padding:28px;background:#fff;border:3px solid #00a9f4;border-radius:20px}h1{margin:0 0 24px;color:#009ff0;font:700 clamp(25px,3vw,30px)/1.3 Arial,sans-serif}.questions{display:grid;grid-template-columns:1fr;gap:16px}.word-question{display:flex;align-items:center;gap:24px;padding:20px 22px;background:#eafaff;border:1.5px solid #8ed9f1;border-radius:12px}.problem{flex:1;min-width:0}.problem label{display:flex;align-items:baseline;gap:12px;font-size:clamp(19px,2.2vw,23px);line-height:1.6}.qnum{flex:0 0 24px;font-weight:700;color:#007da7}.answer-row{display:flex;align-items:center;gap:12px;margin:14px 0 0 36px;font-size:20px}.answer-row input{display:block;width:128px;height:48px;min-width:0;padding:7px 10px;border:2px solid #ff685d;border-radius:6px;background:#fff;color:#17333b;text-align:center;font:24px Georgia,serif}.answer-row input.correct{background:#e8fff0;border-color:#20a953}.answer-row input.wrong{background:#fff0f0;border-color:#e62c38}.worked{flex:0 0 94px;background:#fffde8;border:1px solid #eadca1;border-radius:10px;padding:10px 16px;text-align:right;font:24px/1.4 Georgia,serif}.worked .total{border-top:1px solid #a79a68;letter-spacing:0}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}button{border:0;border-radius:24px;background:#ff7000;color:#fff;font:700 15px Arial,sans-serif;padding:13px 22px;cursor:pointer}button:hover{background:#e96000}button:focus-visible,input:focus-visible{outline:3px solid #006bff;outline-offset:3px}@media(max-width:620px){body{padding:10px}.sheet{padding:20px 14px}.word-question{padding:16px 12px;gap:12px}.problem label{gap:6px}.qnum{flex-basis:20px}.answer-row{margin-left:26px;font-size:18px;gap:8px}.answer-row input{width:100px;height:44px}.worked{flex-basis:65px;font-size:21px;padding:8px}h1{margin-bottom:18px}}@media(max-width:400px){.word-question:first-child{flex-wrap:wrap}.worked{margin-left:26px;flex-basis:70px}.actions{gap:6px}button{padding:12px 15px}}</style></head><body><main class="sheet"><h1>Solve the following.</h1><section class="questions word-problems"><div class="question word-question"><div class="problem"><label for="a0"><span class="qnum">a.</span><span>There are 5 pencils in a box. How many pencils will be there in 2 such boxes?</span></label><div class="answer-row"><span>Ans.</span><input id="a0" aria-label="Answer a" inputmode="numeric" autocomplete="off" spellcheck="false"></div></div><div class="worked" aria-label="Worked multiplication example: 5 times 2 equals 10"><div>5</div><div>× &nbsp;2</div><div class="total">10</div></div></div><div class="question word-question"><div class="problem"><label for="a1"><span class="qnum">b.</span><span>4 boys have 6 toffees each. How many toffees do they have in all?</span></label><div class="answer-row"><span>Ans.</span><input id="a1" aria-label="Answer b" inputmode="numeric" autocomplete="off" spellcheck="false"></div></div></div><div class="question word-question"><div class="problem"><label for="a2"><span class="qnum">c.</span><span>A car has 4 wheels. Find the total number of wheels in 5 cars.</span></label><div class="answer-row"><span>Ans.</span><input id="a2" aria-label="Answer c" inputmode="numeric" autocomplete="off" spellcheck="false"></div></div></div><div class="question word-question"><div class="problem"><label for="a3"><span class="qnum">d.</span><span>There are 5 books in a bag. How many books will be there in 6 such bags?</span></label><div class="answer-row"><span>Ans.</span><input id="a3" aria-label="Answer d" inputmode="numeric" autocomplete="off" spellcheck="false"></div></div></div></section><div class="actions"><button type="button" id="submit">Submit</button><button type="button" id="show">Show Answer</button><button type="button" id="reset">Reset</button></div></main><script>const questions=[{"answer": "10"}, {"answer": "24"}, {"answer": "20"}, {"answer": "30"}],key='exercise:math-1-ch8-assessment-word-problems.html';const fields=questions.map((_,i)=>document.getElementById('a'+i));function norm(v){return String(v).trim().replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c))}function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}catch(e){}}function clear(){fields.forEach(x=>x.classList.remove('correct','wrong'))}fields.forEach(x=>x.addEventListener('input',()=>{clear();save()}));try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))fields.forEach((x,i)=>{if(typeof a[i]==='string')x.value=a[i]})}catch(e){}document.getElementById('submit').addEventListener('click',()=>{fields.forEach((x,i)=>{const ok=norm(x.value)===questions[i].answer;x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok)});save();const detail={exerciseType:'FILL_BLANK',exerciseId:'math-1-ch8-assessment-word-problems.html',response:Object.fromEntries(fields.map((x,i)=>['question'+(i+1),x.value]))};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')});document.getElementById('show').addEventListener('click',()=>{fields.forEach((x,i)=>x.value=questions[i].answer);clear();save()});document.getElementById('reset').addEventListener('click',()=>{fields.forEach(x=>x.value='');clear();save()});</script></body></html>
