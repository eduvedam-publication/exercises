<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>सही विकल्प पर सही निशान लगाएँ</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px 12px; background: #e2f8fc; color: #263746; font-family: "Noto Sans Devanagari", Mangal, Arial, sans-serif; }
  .worksheet { max-width: 980px; margin: 0 auto; background: #fff; border: 3px solid #00bfe8; border-radius: 18px; padding: 24px; }
  h1 { margin: 0 0 8px; color: #ff3485; font-size: clamp(22px, 3vw, 30px); font-weight: 700; }
  .question { background: #effbfe; border: 1px solid #8be5f7; border-radius: 12px; padding: 15px 16px; margin: 13px 0; }
  .prompt { font-size: 19px; line-height: 1.7; margin-bottom: 10px; }
  .options { display: flex; flex-wrap: wrap; gap: 10px 22px; }
  label.option { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid #d5e8ed; border-radius: 8px; background: #fff; cursor: pointer; font-size: 17px; min-width: 150px; }
  input[type="radio"] { accent-color: #ff3485; width: 17px; height: 17px; }
  .correct { border-color: #0aaf74 !important; background: #e5fff3 !important; }
  .incorrect { border-color: #ef476f !important; background: #fff0f3 !important; }
  .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
  button { border: 0; border-radius: 25px; padding: 12px 22px; color: white; background: #ff3485; font-weight: 700; font-size: 16px; cursor: pointer; }
  button:hover { filter: brightness(.95); }
  button.secondary { background: #0787b3; }
  .score { text-align: center; color: #007da7; font-size: 22px; font-weight: 700; margin: 18px 0 2px; }
  .feedback { margin-top: 8px; font-size: 16px; }
  @media (max-width: 520px) { .worksheet { padding: 15px; } label.option { min-width: 100%; } .prompt { font-size: 17px; } }
</style>
</head>
<body>
<main class="worksheet">
  <h1>सही विकल्प पर सही (✓) का निशान लगाएँ—</h1>
  <form id="quiz">
    <section class="question" data-q="0">
      <div class="prompt">(क) ‘आपको बाबूजी बुला रहे हैं।’ किसने कहा—</div>
      <div class="options">
        <label class="option"><input type="radio" name="q0" value="0"> (i) नारद जी</label>
        <label class="option"><input type="radio" name="q0" value="1"> (ii) लड़का</label>
        <label class="option"><input type="radio" name="q0" value="2"> (iii) लाला</label>
      </div><div class="feedback" aria-live="polite"></div>
    </section>
    <section class="question" data-q="1">
      <div class="prompt">(ख) ‘मुझे रुपये-पैसों से कोई सरोकार नहीं है।’ किसने कहा—</div>
      <div class="options">
        <label class="option"><input type="radio" name="q1" value="0"> (i) नारद जी</label>
        <label class="option"><input type="radio" name="q1" value="1"> (ii) लड़का</label>
        <label class="option"><input type="radio" name="q1" value="2"> (iii) लाला</label>
      </div><div class="feedback" aria-live="polite"></div>
    </section>
    <section class="question" data-q="2">
      <div class="prompt">(ग) ‘आप इस वीणा को लेकर वाराणसी से वापस नहीं जा सकते।’ किसने कहा—</div>
      <div class="options">
        <label class="option"><input type="radio" name="q2" value="0"> (i) नारद जी</label>
        <label class="option"><input type="radio" name="q2" value="1"> (ii) लड़का</label>
        <label class="option"><input type="radio" name="q2" value="2"> (iii) लाला</label>
      </div><div class="feedback" aria-live="polite"></div>
    </section>
    <section class="question" data-q="3">
      <div class="prompt">(घ) ‘विचरण’ करते समय यह नहीं होता—</div>
      <div class="options">
        <label class="option"><input type="radio" name="q3" value="0"> (i) चलना</label>
        <label class="option"><input type="radio" name="q3" value="1"> (ii) देखना</label>
        <label class="option"><input type="radio" name="q3" value="2"> (iii) सोना</label>
      </div><div class="feedback" aria-live="polite"></div>
    </section>
    <section class="question" data-q="4">
      <div class="prompt">(ङ) ‘देवलोक’ को यह भी कहते हैं—</div>
      <div class="options">
        <label class="option"><input type="radio" name="q4" value="0"> (i) स्वर्ग</label>
        <label class="option"><input type="radio" name="q4" value="1"> (ii) नर्क</label>
        <label class="option"><input type="radio" name="q4" value="2"> (iii) मृत्युलोक</label>
      </div><div class="feedback" aria-live="polite"></div>
    </section>
    <div class="controls">
      <button type="button" id="submit">Submit</button>
      <button type="button" class="secondary" id="show">Show Answer</button>
      <button type="button" id="reset">Reset</button>
    </div>
    <div class="score" id="score" aria-live="polite">प्राप्तांक: 0 / 5</div>
  </form>
</main>
<script>
  // Answers inferred from the supplied page/story context; verify the dialogue answers against the textbook.
  const answers = [1, 0, 2, 2, 0];
  const answerLabels = [
    "लड़का",
    "नारद जी",
    "लाला",
    "सोना",
    "स्वर्ग"
  ];
  const sections = [...document.querySelectorAll(".question")];
  function grade(showAnswers = false) {
    let score = 0;
    sections.forEach((section, i) => {
      const chosen = section.querySelector('input[type="radio"]:checked');
      const labels = [...section.querySelectorAll("label.option")];
      labels.forEach(label => label.classList.remove("correct", "incorrect"));
      const feedback = section.querySelector(".feedback");
      if (chosen && Number(chosen.value) === answers[i]) {
        score++;
        chosen.closest("label").classList.add("correct");
        feedback.textContent = "सही उत्तर ✓";
        feedback.style.color = "#087d52";
      } else if (chosen) {
        chosen.closest("label").classList.add("incorrect");
        feedback.textContent = showAnswers ? "सही उत्तर: " + answerLabels[i] : "गलत उत्तर";
        feedback.style.color = "#c62b50";
      } else if (showAnswers) {
        labels[answers[i]].classList.add("correct");
        feedback.textContent = "सही उत्तर: " + answerLabels[i];
        feedback.style.color = "#087d52";
      } else {
        feedback.textContent = "उत्तर चुनें";
        feedback.style.color = "#8b6570";
      }
    });
    document.getElementById("score").textContent = "प्राप्तांक: " + score + " / 5";
  }
  document.getElementById("submit").addEventListener("click", () => grade(false));
  document.getElementById("show").addEventListener("click", () => grade(true));
  document.getElementById("reset").addEventListener("click", () => {
    document.getElementById("quiz").reset();
    sections.forEach(s => {
      s.querySelectorAll("label.option").forEach(l => l.classList.remove("correct", "incorrect"));
      s.querySelector(".feedback").textContent = "";
    });
    document.getElementById("score").textContent = "प्राप्तांक: 0 / 5";
  });
</script>
</body>
</html>
