<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का निशान लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#bdfaff;color:#263541;font-family:"Noto Sans Devanagari",Mangal,Arial,sans-serif}.wrap{max-width:1020px;width:94%;margin:25px auto;background:white;border:3px solid #00aeef;border-radius:21px;padding:24px}h2{color:#00a9ee;font-size:26px;margin:0 0 18px}.q{background:#e1faff;border:1.5px solid #00aaff;border-radius:11px;margin:10px 0;padding:13px;font-size:19px}.opts{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.opt,.chip{background:white;border:1px solid #00aeef;border-radius:9px;padding:10px 13px;font:inherit;color:inherit;cursor:pointer}.opt.selected,.chip.selected{background:#a9eaff;border:2px solid #0097e8}.good{background:#d9f9dd!important;border-color:#27b34d!important}.bad{background:#ffe0e0!important;border-color:#e93e45!important}.bank{display:flex;flex-wrap:wrap;gap:10px;background:#d1f8ff;border-radius:12px;padding:12px;margin-bottom:14px}.slot{min-width:135px;min-height:42px;display:inline-flex;vertical-align:middle;justify-content:center;align-items:center;padding:5px 12px;border:2px dashed #fa7568;border-radius:8px;background:#fff;cursor:pointer}.slot:focus{outline:2px solid #008af0}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:25px}.actions button{background:#ff7900;border:0;border-radius:23px;color:white;padding:12px 20px;font-weight:bold;cursor:pointer}.marks{text-align:center;color:#004fd0;font-size:21px;font-weight:bold;margin-top:13px}@media(max-width:650px){.wrap{padding:14px}h2{font-size:21px}.q{font-size:17px}}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाइए–</h2><div id="questions"></div><div class="actions"><button onclick="submitAnswers()">Submit</button><button onclick="showAnswer()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div class="marks" id="marks"></div></main><script>const questions=["कैनेडी ने कहाँ का दौरा किया था?", "मदर टेरेसा के मन में सेवा करने की भावना कब उत्पन्न हुई?", "वर्ष 1948 में किसने मदर टेरेसा को स्कूल छोड़ने की आज्ञा दी?", "‘बुढ़िया’ और ‘बढ़िया’ में क्या अंतर है?"],options=[["शिविरों का", "शरणार्थी शिविरों का", "दिल्ली का"], ["14वें वर्ष में", "10वें वर्ष में", "12वें वर्ष में"], ["अंग्रेजी शासन ने", "कलकत्ता प्रशासन ने", "पोप ने"], ["बुढ़िया = संज्ञा, बढ़िया = क्रिया", "बुढ़िया = सर्वनाम, बढ़िया = विशेषण", "बुढ़िया = संज्ञा, बढ़िया = विशेषण"]],correct=[1, 0, 2, 2],key='kopal-4-ch11-mcq-v2';let picks;try{picks=JSON.parse(localStorage.getItem(key))}catch(e){}if(!Array.isArray(picks)||picks.length!==questions.length)picks=Array(questions.length).fill(null);function save(){localStorage.setItem(key,JSON.stringify(picks))}function render(){document.getElementById('questions').innerHTML=questions.map((q,i)=>`<div class="q" id="q${i}"><div>(${['क','ख','ग','घ'][i]}) ${q}</div><div class="opts">${options[i].map((o,k)=>`<button class="opt ${picks[i]===k?'selected':''}" onclick="pick(${i},${k})">(${['i','ii','iii'][k]}) ${o} ${picks[i]===k?'☑':'□'}</button>`).join('')}</div></div>`).join('')}function pick(i,k){picks[i]=k;save();render()}function submitAnswers(){render();let n=0;picks.forEach((v,i)=>{if(v!==null){const ok=v===correct[i];if(ok)n++;document.getElementById('q'+i).classList.add(ok?'good':'bad')}});document.getElementById('marks').textContent=`Marks: ${n} / ${questions.length}`}function showAnswer(){picks=correct.slice();save();submitAnswers()}function resetAll(){picks=Array(questions.length).fill(null);save();render();document.getElementById('marks').textContent=`Marks: 0 / ${questions.length}`}render();document.getElementById('marks').textContent=`Marks: 0 / ${questions.length}`;</script></body></html>
