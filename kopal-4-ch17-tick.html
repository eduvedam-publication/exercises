<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>निम्नलिखित कथनों के सामने सही (✓) या गलत (✗) का चिह्न लगाइए।</title><style>*{box-sizing:border-box}body{margin:0;background:#cbfaff;color:#18313b;font-family:Georgia,"Noto Serif Devanagari",serif}.wrap{max-width:1050px;margin:16px auto;background:#fff;border:3px solid #00aceb;border-radius:22px;padding:24px}h2{font-size:25px;color:#00a8e7;margin:0 0 18px}.q{background:#e8faff;border:1px solid #00aeeb;border-radius:12px;padding:13px;margin:9px 0;font-size:19px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.choice{font:inherit;text-align:left;cursor:pointer;background:white;border:1px solid #8ddafa;border-radius:8px;padding:11px;min-height:46px}.choice.selected{background:#cbf6e8;border:2px solid #00a8e7}.choice.good,.drop.good{background:#d3f7da;border-color:#2ca44e}.choice.bad,.drop.bad{background:#ffe0e0;border-color:#e54848}.bank{background:#daf8ff;border-radius:10px;padding:13px;display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}.chip{font:inherit;background:white;border:1px solid #00aeeb;border-radius:8px;padding:8px 12px;cursor:grab}.chip.active{outline:3px solid #ff8500}.chip.used{opacity:.45}.line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.drop{font:inherit;background:#fff;border:2px dashed #ff805b;border-radius:8px;min-width:145px;min-height:42px;padding:7px 10px;cursor:pointer}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:24px}.actions button{background:#ff8000;color:#fff;border:0;border-radius:22px;padding:12px 19px;font-weight:bold;cursor:pointer}#marks{text-align:center;color:#004bb8;font-size:20px;font-weight:bold;margin:14px 0 0}@media(max-width:650px){.wrap{margin:5px;padding:14px}.options{grid-template-columns:1fr}.q{font-size:17px}h2{font-size:21px}}</style></head><body><main class="wrap"><h2>निम्नलिखित कथनों के सामने सही (✓) या गलत (✗) का चिह्न लगाइए।</h2><section id="area"></section><div class="actions"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div id="marks"></div></main><script>const TYPE="tick",ROWS=[["पृथ्वी सूर्य के चारों ओर परिक्रमा करती है।", "सही"], ["पृथ्वी एक वर्ष में सूर्य की परिक्रमा कई बार करती है।", "गलत"], ["पृथ्वी के घूमने से दिन और रात होते हैं।", "सही"], ["ऋतुओं के बदलने से त्योहार भी आते हैं।", "सही"], ["चाँद हमेशा एक ही आकार में दिखाई देता है।", "गलत"], ["पृथ्वी हमें निरंतर आगे बढ़ने का संदेश देती है।", "सही"]],KEY='kopal-4-ch17-'+TYPE+'-corrected';let values=Array(ROWS.length).fill(''),active='',checked=false;try{const old=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(old)&&old.length===values.length)values=old}catch(e){}const letters=['क','ख','ग','घ','ङ','च'];function save(){localStorage.setItem(KEY,JSON.stringify(values))}function set(i,v){if(TYPE==='drag'&&v){let p=values.indexOf(v);if(p>=0&&p!==i)values[p]=''}values[i]=v;checked=false;save();draw()}function draw(){const root=document.getElementById('area');root.replaceChildren();if(TYPE==='drag'){const bank=document.createElement('div');bank.className='bank';ROWS.forEach(r=>{const b=document.createElement('button');b.className='chip'+(active===r[1]?' active':'')+(values.includes(r[1])?' used':'');b.textContent=r[1];b.draggable=true;b.onclick=()=>{active=r[1];draw()};b.ondragstart=e=>e.dataTransfer.setData('text/plain',r[1]);bank.append(b)});root.append(bank)}ROWS.forEach((r,i)=>{const q=document.createElement('div');q.className='q';const text=document.createElement('div');text.textContent='('+letters[i]+') '+r[0]+(TYPE==='drag'?'  '+(location.pathname.includes('pratyay')?'+ ____ =':' ×'):'');q.append(text);if(TYPE==='drag'){const d=document.createElement('button');d.className='drop'+(checked?(values[i]===r[1]?' good':' bad'):'');d.textContent=values[i]||'________';d.onclick=()=>{if(active){set(i,active);active=''}else if(values[i])set(i,'')};d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();set(i,e.dataTransfer.getData('text/plain'));active=''};q.append(d)}else{const opts=document.createElement('div');opts.className='options';let options=TYPE==='mcq'?r[1]:['✓ सही','✗ गलत'];options.forEach((v,j)=>{const b=document.createElement('button');b.className='choice'+(values[i]===String(j)?' selected':'');if(checked&&values[i]===String(j))b.className+=String(j)===(TYPE==='mcq'?String(r[2]):String(r[1]==='सही'?0:1))?' good':' bad';b.textContent=TYPE==='mcq'?['(i) ','(ii) ','(iii) '][j]+v:v;b.onclick=()=>set(i,String(j));opts.append(b)});q.append(opts)}root.append(q)});document.getElementById('marks').textContent='Marks: '+(checked?ROWS.reduce((n,r,i)=>n+(values[i]===answer(r)?1:0),0):0)+' / '+ROWS.length}function answer(r){return TYPE==='drag'?r[1]:TYPE==='tick'?String(r[1]==='सही'?0:1):String(r[2])}document.getElementById('submit').onclick=()=>{checked=true;draw()};document.getElementById('show').onclick=()=>{values=ROWS.map(answer);checked=true;save();draw()};document.getElementById('reset').onclick=()=>{values=Array(ROWS.length).fill('');checked=false;active='';save();draw()};draw();</script></body></html>
