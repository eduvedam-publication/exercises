<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gyandhara-2-ch12-drag-drop.html</title><style>*{box-sizing:border-box}body{margin:0;background:#d9f8ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#182b35}.wrap{width:min(880px,96vw);margin:15px auto;background:white;border:3px solid #00acd7;border-radius:19px;padding:18px 22px;min-height:360px}h2{font-size:23px;color:#00a8e3;margin:0 0 18px}.item{background:#effbff;border:1.5px solid #00c4e9;border-radius:11px;padding:12px;margin:9px 0;font-size:19px}.choices{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px}.opt{border:1.5px solid #ff2682;background:#fff;border-radius:8px;padding:7px 13px;font-size:17px;cursor:pointer;color:#24323b}.opt.sel{background:#cceff7;border-color:#007ec2}.opt.ok{background:#dcf8e2}.opt.bad{background:#ffdddd}.blank{display:inline-flex;vertical-align:middle;min-width:105px;min-height:37px;border:2px dashed #ff634b;border-radius:6px;align-items:center;justify-content:center;padding:3px 7px;cursor:pointer;background:#fff;margin:0 4px}.blank.filled{background:#e4f9ee;border-style:solid}.bank{background:#e4f8ff;padding:10px;border-radius:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:14px}.word{padding:7px 12px;border:1.5px solid #00b1e8;border-radius:8px;background:white;cursor:grab;font-size:18px}.word.used{opacity:.35}.textin{width:170px;max-width:45vw;padding:8px;border:2px solid #ff634b;border-radius:5px;font-size:19px}.actions{display:flex;justify-content:center;gap:10px;margin-top:23px}button.action{border:0;border-radius:20px;background:#ff8200;color:white;padding:10px 19px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0060b5;font-weight:bold;font-size:19px;margin:10px}.correct{border-color:green!important;background:#e0fae4!important}.incorrect{border-color:#f33!important;background:#ffe6e6!important}@media(max-width:600px){.wrap{padding:12px}.item{font-size:17px}h2{font-size:20px}}</style></head><body><main class="wrap"><h2>रिक्त स्थान पूर्ति कीजिए–</h2><section id="app"></section><div class="actions"><button class="action" onclick="submitExercise()">Submit</button><button class="action" onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 6</div></main><script>const KEY=location.pathname+':answers';function store(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}function setScore(n,total){document.getElementById('score').textContent=`Score: ${n} / ${total}`;}const questions=["अठारह से पहले ________ आता है।", "पाठ में आइस्क्रीम ________ हैं।", "पाठ में ________ तक संख्याएँ सिखाई गई हैं।", "दस के बाद ________ आता है।", "पाठ के अनुसार केले ________ हैं।", "पाठ के अनुसार मुर्गे ________ हैं।"], answers=["सत्रह", "तीन", "बीस", "ग्यारह", "पंद्रह", "सोलह"];let state=load();let selected=null;const app=document.getElementById('app');function render(){let words=[...new Set(answers)];app.innerHTML='<div class="bank">'+words.map(w=>`<button class="word" draggable="true" data-word="${w}">${w}</button>`).join('')+'</div>'+questions.map((q,i)=>`<div class="item">(${'कखगघङच'[i]}) ${q.replace('________',`<span class="blank ${state[i]?'filled':''}" data-i="${i}">${state[i]||'यहाँ छोड़ें'}</span>`)}</div>`).join('');document.querySelectorAll('.word').forEach(el=>{el.onclick=()=>{selected=el.dataset.word;document.querySelectorAll('.word').forEach(e=>e.classList.toggle('sel',e===el))};el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.word)});document.querySelectorAll('.blank').forEach(el=>{el.onclick=()=>{let i=+el.dataset.i;if(selected)state[i]=selected;else delete state[i];store();render()};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();state[+el.dataset.i]=e.dataTransfer.getData('text/plain');store();render()}})}function submitExercise(){let score=0;document.querySelectorAll('.blank').forEach((el,i)=>{let ok=state[i]===answers[i];if(ok)score++;el.classList.add(ok?'correct':'incorrect')});setScore(score,6);window.parent.postMessage({exerciseType:'DRAG_DROP',response:{answers:state,score}},'*')}function resetExercise(){state={};store();render();setScore(0,6)}render();</script></body></html>
