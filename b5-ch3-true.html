<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write ‘True’ or ‘False’.</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;font-family:Arial,sans-serif;background:#eaf8ff;color:#292929}.wrap{max-width:1000px;margin:auto;background:#fff;border:5px solid #08b6e8;border-radius:24px;padding:20px}h1{color:#ff0878;font-size:24px;margin:0 0 16px}.card{background:#f9fcff;border:2px solid #c9efff;border-radius:17px;padding:14px 17px;margin:10px 0}.q{font-size:17px;font-weight:600;margin-bottom:8px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.opt,.choice{padding:10px;border:2px solid #ff4fa0;border-radius:13px;background:#fff;font-size:15px;cursor:pointer}.correct{background:#dff7df!important;border-color:#27843a!important}.wrong{background:#ffdede!important;border-color:#c62828!important}.score{text-align:center;color:#064bad;font-size:21px;font-weight:bold;margin:13px}.actions{text-align:center}.btn{padding:10px 22px;border:0;border-radius:22px;background:#ff7b00;color:white;font-weight:bold;margin:4px;cursor:pointer}.row{font-size:17px;line-height:2}.ans{padding:7px;border:2px solid #ff4fa0;border-radius:7px;font-size:15px}.tf{display:flex;gap:8px;flex-wrap:wrap}.sentence{width:100%;padding:8px;border:2px solid #ff4fa0;border-radius:8px;font-size:15px}@media(max-width:650px){.wrap{padding:10px;border-width:3px}.opts{grid-template-columns:1fr}h1{font-size:20px}.q,.row{font-size:15px}}</style></head><body><div class="wrap"><h1>Write ‘True’ or ‘False’.</h1><div id="x"></div><div id="score" class="score"></div><div class="actions"><button class="btn" onclick="load()">Reset</button></div></div><script>const Q=[["1. The teacher wanted to teach Sakshi a lesson about words.", "True"], ["2. Sakshi collected all the cotton balls easily.", "False"], ["3. We should not speak badly about others.", "True"], ["4. The cotton balls flew away because of the wind.", "True"], ["5. The teacher wanted Sakshi to understand the importance of kind words.", "True"], ["6. Gossiping is a good habit that everyone should follow.", "False"], ["7. Words spoken once can always be taken back easily.", "False"], ["8. A teacher helps students overcome their weaknesses.", "True"], ["9. Sakshi never learned any lesson from her teacher.", "False"], ["10. A teacher plays an important role in shaping a student's future.", "True"]],C=["True", "False"];let s=0;function load(){s=0;x.innerHTML='';score.textContent='Score: 0 / '+Q.length;Q.forEach(z=>{let c=document.createElement('div');c.className='card';c.innerHTML='<div class="q">'+z[0]+'</div>';let d=document.createElement('div');d.className='tf';C.forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>{if(d.dataset.d)return;d.dataset.d=1;d.querySelectorAll('button').forEach(k=>{k.disabled=true;if(k.textContent===z[1])k.classList.add('correct')});if(v===z[1])s++;else b.classList.add('wrong');score.textContent='Score: '+s+' / '+Q.length};d.append(b)});c.append(d);x.append(c)})}load();</script></body></html>
