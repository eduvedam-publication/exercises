<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fill in the blanks.</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;font-family:Arial,Helvetica,sans-serif;background:#eaf8ff;color:#292929}
.wrap{max-width:1000px;margin:auto;background:#fff;border:5px solid #08b6e8;border-radius:25px;padding:22px}
h1{margin:0 0 18px;color:#ff0878;font-size:25px}
.card{background:#f9fcff;border:2px solid #c9efff;border-radius:18px;padding:15px 18px;margin:11px 0}
.q{font-size:18px;font-weight:600;line-height:1.45;margin-bottom:9px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 13px}
.opt{padding:10px 13px;border:2px solid #ff4fa0;border-radius:14px;background:#fff;text-align:left;font-size:16px;cursor:pointer}
.correct{background:#d8f6d8!important;border-color:#27843a!important;color:#176325!important}
.wrong{background:#ffdadd!important;border-color:#c62828!important;color:#a81616!important}
.score{text-align:center;color:#064bad;font-size:22px;font-weight:bold;margin:15px}
.actions{text-align:center}
.btn{padding:11px 24px;margin:4px;border:0;border-radius:24px;background:#ff7b00;color:#fff;font-weight:bold;cursor:pointer}
.btn:hover{opacity:0.92}
.row{display:flex;align-items:center;gap:12px;font-size:17px;line-height:1.5}
.grow{flex:1}
input.ans{padding:8px;border:2px solid #ff4fa0;border-radius:8px;font-size:16px;max-width:180px;margin:0 4px}
.sel{padding:8px;border:2px solid #ff4fa0;border-radius:9px;background:white;font-size:15px;max-width:320px}
.bank{padding:14px;margin:10px 0 18px;border-radius:14px;background:#efffc5;font-size:17px;line-height:1.7;text-align:center}
.dropzone{min-height:44px;border:2px dashed #ff4fa0;border-radius:12px;padding:8px;margin:6px 0;background:#fff}
.word{display:inline-block;padding:7px 12px;margin:5px;border:2px solid #ff4fa0;border-radius:999px;background:#fff;cursor:grab}
.colwrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col h2{text-align:center;font-size:18px}
@media(max-width:650px){
  .wrap{padding:12px}
  .opts,.colwrap{grid-template-columns:1fr}
  h1{font-size:20px}
  .q,.row{font-size:15px}
  .btn{width:100%}
  input.ans{max-width:130px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fill in the blanks.</h1>
  <div id="x"></div>
  <div id="score" class="score"></div>
  <div class="actions">
    <button class="btn" onclick="check()">Check Answers</button>
    <button class="btn" onclick="load()">Reset</button>
  </div>
</div>

<script>
const R = [
  ["1. You must ", "trust", " yourself."],
  ["2. You should use your own ", "power", " of ", "judgement", "."],
  ["3. You may ask for ", "advice", " from your ", "parents", " and your ", "teachers", "."],
  ["4. At times you have to ", "decide", " yourself."],
  ["5. If you listen to your ", "conscience", " you shall never go ", "wrong", "."]
];

let questionsData = [];

function load() {
  questionsData = [];
  const x = document.getElementById('x');
  const scoreElem = document.getElementById('score');
  x.innerHTML = '';
  let blankCounter = 0;

  R.forEach((sentenceParts) => {
    const card = document.createElement('div');
    card.className = 'card row';
    const textContainer = document.createElement('div');
    textContainer.className = 'grow';

    const currentQuestionBlanks = [];

    sentenceParts.forEach((part, index) => {
      if (index % 2 === 0) {
        textContainer.append(document.createTextNode(part));
      } else {
        const input = document.createElement('input');
        input.className = 'ans';
        input.id = 'i' + blankCounter;
        currentQuestionBlanks.push({ id: input.id, answer: part });
        blankCounter++;
        textContainer.append(input);
      }
    });

    questionsData.push(currentQuestionBlanks);
    card.append(textContainer);
    x.append(card);
  });

  // Display initial score out of 5 (1 point per question)
  scoreElem.textContent = 'Score: 0 / ' + R.length;
}

function check() {
  let scoreCount = 0;

  questionsData.forEach((blanksInQuestion) => {
    let isQuestionFullyCorrect = true;

    blanksInQuestion.forEach(({ id, answer }) => {
      const inputElem = document.getElementById(id);
      inputElem.classList.remove('correct', 'wrong');

      if (inputElem.value.trim().toLowerCase() === answer.toLowerCase()) {
        inputElem.classList.add('correct');
      } else {
        inputElem.classList.add('wrong');
        isQuestionFullyCorrect = false;
      }
    });

    // 1 point awarded per question if all blanks in that sentence are answered correctly
    if (isQuestionFullyCorrect && blanksInQuestion.length > 0) {
      scoreCount++;
    }
  });

  const scoreElem = document.getElementById('score');
  scoreElem.textContent = 'Score: ' + scoreCount + ' / ' + R.length;
}

load();
</script>
</body>
</html>
