<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B3 Ch8 Assignment 1 Fill</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e2f8fc;font-family:Georgia,"Times New Roman",serif}
.card{width:min(1080px,calc(100% - 24px));min-height:440px;margin:14px auto;background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:34px 42px;display:flex;flex-direction:column}
h1{font:700 25px Arial,sans-serif;color:#00a1db;margin:0 0 30px}.qs{display:grid;gap:20px;flex:1}
.q{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:21px;line-height:1.65}.letter{width:28px;flex:0 0 28px}
input{height:38px;border:2px solid #ff2b22;background:#fff;color:#111;padding:4px 7px;font:18px Arial,sans-serif}
.small{width:72px}.medium{width:105px}
input.ok{background:#dff7df;border-color:#198c3d}input.bad{background:#ffe1e1;border-color:#d92c2c}
.footer{margin-top:auto;text-align:center;padding-top:28px}
.footer button{border:0;border-radius:25px;background:#ff7b00;color:#fff;padding:13px 22px;margin:0 6px;font:bold 14px Arial;cursor:pointer}
.score{margin-top:14px;color:#064bb4;font:bold 22px Arial}
@media(max-width:700px){.card{padding:24px 18px}.q{font-size:18px}}
</style></head><body>
<main class="card"><h1>Fill in the blanks.</h1><div class="qs">
<div class="q"><span class="letter">a.</span><span>The minute hand takes</span><input class="small" id="a0"><span>minutes to move from 4 to 7.</span></div>
<div class="q"><span class="letter">b.</span><span>2:15 is read as</span><input class="medium" id="a1"><span>past</span><input class="small" id="a2"><span>.</span></div>
<div class="q"><span class="letter">c.</span><span>In one day, the hour hand goes</span><input class="small" id="a3"><span>round of the clock.</span></div>
<div class="q"><span class="letter">d.</span><span>The</span><input class="medium" id="a4"><span>hand of the clock is the minute hand, while the</span><input class="medium" id="a5"><span>hand is the hour hand.</span></div>
</div>
<div class="footer"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button><div class="score" id="score">Score: 0 / 6</div></div></main>
<script>
const A=["3","quarter","2","2","long","short"];
const norm=v=>v.trim().toLowerCase();
function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=norm(e.value)===a;e.classList.remove("ok","bad");e.classList.add(ok?"ok":"bad");if(ok)s++});score.textContent=`Score: ${s} / 6`}
function resetAll(){A.forEach((_,i)=>{let e=document.getElementById("a"+i);e.value="";e.classList.remove("ok","bad")});score.textContent="Score: 0 / 6"}
</script></body></html>
