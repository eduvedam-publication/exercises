<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{margin:0 0 26px;color:#00a5dc;font-size:25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:700px){body{padding:0}.ex{border-radius:0;padding:16px}}
.clock{width:82px;height:82px;border:5px solid var(--rim,#a9a889);border-radius:50%;position:relative;background:#fff;margin:auto;box-shadow:inset 0 0 0 2px #ddd}
.clock:before,.clock:after{content:"";position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:#444;border-radius:2px}
.clock:before{width:3px;height:27px;transform:translateX(-50%) rotate(var(--min))}
.clock:after{width:4px;height:21px;transform:translateX(-50%) rotate(var(--hour))}
.dot{position:absolute;width:7px;height:7px;background:#444;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.n12,.n3,.n6,.n9{position:absolute;font:10px Arial}.n12{top:3px;left:50%;transform:translateX(-50%)}.n3{right:4px;top:50%;transform:translateY(-50%)}.n6{bottom:3px;left:50%;transform:translateX(-50%)}.n9{left:4px;top:50%;transform:translateY(-50%)}
.q{font:20px Georgia,serif;margin-bottom:24px}.qt{margin-bottom:10px}.opts{display:flex;flex-wrap:wrap;gap:12px 20px;margin-left:22px}.opts button{border:2px solid #ff1680;border-radius:11px;background:#fff;color:#111;cursor:pointer}.textopts button{padding:9px 20px;min-width:110px;font-size:17px}.clockopts{justify-content:space-between}.clockopts button{padding:7px 12px;min-width:185px;display:flex;align-items:center;gap:10px;font:17px Georgia,serif}.sel{background:#fff0f6!important}</style></head><body><main class="ex"><h1>Choose the correct option.</h1>
<div class="q" data-a="2"><div class="qt">a. How many hours does the hour hand complete in one round of the clock?</div>
<div class="opts textopts"><button data-v="0">i. 1</button><button data-v="1">ii. 2</button><button data-v="2">iii. 12</button><button data-v="3">iv. 24</button></div></div>
<div class="q" data-a="3"><div class="qt">b. Which of these clocks show the time 12:45?</div>
<div class="opts clockopts">
<button data-v="0"><b>i.</b><div class="clock" style="--min:240deg;--hour:50.0deg;--rim:#aaa98a"><span class="n12">12</span><span class="n3">3</span><span class="n6">6</span><span class="n9">9</span><span class="dot"></span></div></button>
<button data-v="1"><b>ii.</b><div class="clock" style="--min:270deg;--hour:352.5deg;--rim:#c88f9e"><span class="n12">12</span><span class="n3">3</span><span class="n6">6</span><span class="n9">9</span><span class="dot"></span></div></button>
<button data-v="2"><b>iii.</b><div class="clock" style="--min:90deg;--hour:277.5deg;--rim:#8eb89c"><span class="n12">12</span><span class="n3">3</span><span class="n6">6</span><span class="n9">9</span><span class="dot"></span></div></button>
<button data-v="3"><b>iv.</b><div class="clock" style="--min:270deg;--hour:22.5deg;--rim:#9990ae"><span class="n12">12</span><span class="n3">3</span><span class="n6">6</span><span class="n9">9</span><span class="dot"></span></div></button>
</div></div>
<div class="q" data-a="2"><div class="qt">c. Which of these clocks show the time six o’clock?</div>
<div class="opts clockopts">
<button data-v="0"><b>i.</b><div class="clock" style="--min:0deg;--hour:90.0deg;--rim:#9990ae"><span class="n12">12</span><span class="n3">3</span><span class="n6">6</span><span class="n9">9</span><span class="dot"></span></div></button>
<button data-v="1"><b>ii.</b><div class="clock" style="--min:0deg;--hour:150.0deg;--rim:#aaa98a"><span class="n12">12</span><span class="n3">3</span><span class="n6">6</span><span class="n9">9</span><span class="dot"></span></div></button>
<button data-v="2"><b>iii.</b><div class="clock" style="--min:0deg;--hour:180.0deg;--rim:#8eb89c"><span class="n12">12</span><span class="n3">3</span><span class="n6">6</span><span class="n9">9</span><span class="dot"></span></div></button>
<button data-v="3"><b>iv.</b><div class="clock" style="--min:0deg;--hour:330.0deg;--rim:#c88f9e"><span class="n12">12</span><span class="n3">3</span><span class="n6">6</span><span class="n9">9</span><span class="dot"></span></div></button>
</div></div>
<div class="q" data-a="2"><div class="qt">d. How many days are there in a week?</div>
<div class="opts textopts"><button data-v="0">i. 1</button><button data-v="1">ii. 6</button><button data-v="2">iii. 7</button><button data-v="3">iv. 12</button></div></div>
<div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div></main><script>document.querySelectorAll(".q").forEach(q=>q.querySelectorAll("button").forEach(b=>b.onclick=()=>{q.querySelectorAll("button").forEach(x=>x.classList.remove("sel","ok","bad"));b.classList.add("sel");q.dataset.p=b.dataset.v}));function check(){let s=0;document.querySelectorAll(".q").forEach(q=>{let p=q.dataset.p;q.querySelectorAll("button").forEach(b=>{b.classList.remove("ok","bad");if(b.dataset.v===p)b.classList.add(p===q.dataset.a?"ok":"bad")});if(p===q.dataset.a)s++});score.textContent=`Score: ${s} / 4`}function resetAll(){document.querySelectorAll(".q").forEach(q=>{delete q.dataset.p;q.querySelectorAll("button").forEach(b=>b.className="")});score.textContent="Score: 0 / 4"}</script></body></html>
