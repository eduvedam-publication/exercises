<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का चिह्न लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#17333b}.wrap{max-width:1000px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a7dd;margin:0 0 20px;font-size:26px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:13px;margin:10px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.opt{border:1px solid #93dcf5;background:white;border-radius:8px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}.opt.sel{background:#d8f3ff;border-color:#009be0}.opt.correct,.q.correct{background:#dcfce5!important;border-color:#22aa55!important}.opt.wrong,.q.wrong{background:#ffe3e3!important;border-color:#ff4545!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}@media(max-width:620px){.wrap{margin:7px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h2><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div></main><script>
const data=[
["वर्णों के सार्थक समूह को कहते हैं–",["स्वर","वर्णमाला","शब्द"],2],
["शब्दों को बाँटा गया है आधारों पर–",["तीन","चार","दो"],1],
["विशेष अर्थ देने वाले योगिक शब्दों को कहते हैं–",["योगरूढ़","तत्सम","विदेशज"],0],
["‘नदी’ शब्द है–",["योगरूढ़","रूढ़","योगिक"],1]
],key='gyandhara-4-ch3-mcq';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const root=document.getElementById('questions');
function render(){root.innerHTML=data.map((q,i)=>`<div class="q" id="q${i}"><b>${'कखगघ'[i]}. ${q[0]}</b><div class="opts">${q[1].map((o,j)=>`<div class="opt ${answers[i]===j?'sel':''}" id="o${i}-${j}" role="button" tabindex="0" onclick="pick(${i},${j})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(${i},${j})}"><span>(${'अबस'[j]}) ${o}</span><span>${answers[i]===j?'☑':'□'}</span></div>`).join('')}</div></div>`).join('')}
function pick(i,j){answers[i]=j;localStorage.setItem(key,JSON.stringify(answers));render()}
function check(){data.forEach((q,i)=>{document.querySelectorAll(`#q${i} .opt`).forEach(el=>el.classList.remove('correct','wrong'));const el=document.getElementById('o'+i+'-'+answers[i]);if(el)el.classList.add(answers[i]===q[2]?'correct':'wrong')})}
function showAnswers(){data.forEach((q,i)=>answers[i]=q[2]);localStorage.setItem(key,JSON.stringify(answers));render();check()}
function resetAll(){answers={};localStorage.removeItem(key);render()}render();</script></main></body></html>
