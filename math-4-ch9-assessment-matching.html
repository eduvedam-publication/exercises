<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#d2faff;font-family:Georgia,serif;color:#18344a}.sheet{max-width:1040px;margin:16px auto;padding:24px 28px;border:3px solid #00a9df;border-radius:22px;background:white}h2{color:#00a9df;margin:0 0 18px}.q{background:#eafaff;border:1px solid #00b9ef;border-radius:12px;padding:13px;margin:10px 0}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.choice{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;background:white;border:1px solid #91d8f2;border-radius:8px;padding:8px;cursor:pointer}.choice img{max-width:125px;max-height:72px;object-fit:contain}.choice input{accent-color:#00a9df;width:20px;height:20px;flex-shrink:0}.good{background:#d8ffe8!important;border-color:#21ad5d!important}.bad{background:#ffe3e3!important;border-color:#f44!important;animation:blink .35s 4}@keyframes blink{50%{background:#ffaaaa}}.actions{text-align:center;margin-top:24px}.actions button{border:0;border-radius:30px;background:#ff8000;color:white;font-weight:bold;padding:12px 20px;margin:4px;cursor:pointer}.status{text-align:center;color:#0056a6;font-weight:bold;margin-top:10px}.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(45px,12vw,150px);margin-top:20px}.matchcol{display:grid;gap:12px}.matchcol button{position:relative;z-index:2;width:100%;min-height:60px;background:#ecfaff;border:1px solid #00b9ef;border-radius:9px;font:18px Georgia;cursor:pointer}.matchcol button.sel{outline:3px solid #0099d7}.matchcol button.paired{background:#e5fff0}.matchcol button.bad{background:#ffe2e2}.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.hint{font-size:15px}@media(max-width:600px){.sheet{padding:15px;margin:6px}.options{grid-template-columns:1fr}.match{gap:38px}.matchcol button{font-size:14px;padding:5px}}</style></head><body><main class="sheet"><h2>Match the following.</h2><div id="exercise"></div><div class="actions"><button id="check">Check Answers</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div id="status" class="status" aria-live="polite"></div></main><script>const left=['a. 1 hm','b. 6 km 7 hm','c. 1 mm','d. 1 km'],right=['i. 1000 m','ii. 1/1000 m','iii. 100 m','iv. 6700 m'],answers=[2,3,1,0],KEY='math4ch9assessmentmatching';let pairs={},selected=null;try{pairs=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}const ex=document.getElementById('exercise'),status=document.getElementById('status');function save(){localStorage.setItem(KEY,JSON.stringify(pairs))}function render(){ex.innerHTML='<p class="hint">Click a left item, then its matching item on the right to draw a line.</p><div class="match" id="match"><svg class="lines" id="lines"></svg><div class="matchcol">'+left.map((s,i)=>`<button id="l${i}" data-side="l" data-i="${i}">${s}</button>`).join('')+'</div><div class="matchcol">'+right.map((s,i)=>`<button id="r${i}" data-side="r" data-i="${i}">${s}</button>`).join('')+'</div></div>';ex.querySelectorAll('.matchcol button').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.i);if(b.dataset.side==='l'){selected=i;ex.querySelectorAll('.sel').forEach(n=>n.classList.remove('sel'));b.classList.add('sel')}else if(selected!==null){Object.keys(pairs).forEach(k=>{if(pairs[k]===i)delete pairs[k]});pairs[selected]=i;selected=null;save();draw()}});draw()}function draw(){let wrap=document.getElementById('match'),svg=document.getElementById('lines'),r=wrap.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.innerHTML='';ex.querySelectorAll('.matchcol button').forEach(b=>b.classList.remove('paired','bad'));Object.keys(pairs).forEach(k=>{let a=document.getElementById('l'+k),b=document.getElementById('r'+pairs[k]);if(!a||!b)return;a.classList.add('paired');b.classList.add('paired');let ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),x1=ar.right-r.left,y1=ar.top+ar.height/2-r.top,x2=br.left-r.left,y2=br.top+br.height/2-r.top;let line=document.createElementNS('http://www.w3.org/2000/svg','line');for(let [key,val] of Object.entries({x1,y1,x2,y2,stroke:'#00a6d6','stroke-width':3,'stroke-linecap':'round'}))line.setAttribute(key,val);svg.appendChild(line)})}function check(){let n=0;answers.forEach((a,i)=>{if(pairs[i]===a)n++;else if(pairs[i]!==undefined)document.getElementById('l'+i).classList.add('bad')});status.textContent=n+' of 4 correct';save();window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',exerciseType:'MATCHING',response:{matches:pairs,correct:n}},'*')}function show(){pairs={0:2,1:3,2:1,3:0};save();draw();check()}function reset(){pairs={};selected=null;save();render();status.textContent=''}render();window.addEventListener('resize',draw);document.getElementById('check').onclick=check;document.getElementById('show').onclick=show;document.getElementById('reset').onclick=reset;</script></body></html>
