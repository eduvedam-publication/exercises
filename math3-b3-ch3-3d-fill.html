<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1080px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:30px 38px}
h1{margin:0 0 26px;color:#00a3dc;font-size:25px}
.questions{display:grid;gap:22px 60px;width:100%}
.two{grid-template-columns:repeat(2,1fr)}
.four{grid-template-columns:repeat(4,1fr)}
.q{display:flex;align-items:center;gap:8px;font:21px Georgia,"Times New Roman",serif;white-space:nowrap}
.ans{width:105px;height:38px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:4px 7px}
.controls{display:flex;justify-content:center;gap:14px;width:100%;margin-top:38px}
.controls button{border:0;border-radius:24px;background:#ff7d00;color:#fff;font-weight:bold;padding:12px 22px;cursor:pointer}
.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px;width:100%}
.ok{background:#dcf8df!important;border-color:#009b8e!important}
.bad{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:900px){.four{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){body{padding:0}.exercise{border-radius:0;padding:18px}.two,.four{grid-template-columns:1fr}}
</style></head>
<body><main class="exercise"><h1>Fill the blanks.</h1><div class="questions two"><div class="q"><span>a. &nbsp; 652 − 0 =</span><input id="a0" class="ans" inputmode="numeric"></div><div class="q"><span>b. &nbsp; 3658 − 258 =</span><input id="a1" class="ans" inputmode="numeric"></div><div class="q"><span>c. &nbsp; 4286 − 1 =</span><input id="a2" class="ans" inputmode="numeric"></div><div class="q"><span>d. &nbsp; 969 − 969 =</span><input id="a3" class="ans" inputmode="numeric"></div></div>
<div class="controls"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetAll()">Reset</button></div>
<div class="score" id="score">Score: 0 / 4</div></main>
<script>
const answers=['652', '3400', '4285', '0'];
function checkAnswers(){let s=0;answers.forEach((a,i)=>{const e=document.getElementById('a'+i),ok=e.value.trim()===a;e.classList.remove('ok','bad');e.classList.add(ok?'ok':'bad');if(ok)s++});document.getElementById('score').textContent='Score: '+s+' / 4';}
function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});document.getElementById('score').textContent='Score: 0 / 4';}
</script></body></html>
