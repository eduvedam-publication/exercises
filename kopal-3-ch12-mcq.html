<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-2-ch12-mcq.html</title><style>*{box-sizing:border-box}body{margin:0;background:#ddf9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#173045}.exercise{max-width:850px;margin:16px auto;background:white;border:3px solid #04a9d6;border-radius:22px;padding:20px 24px;min-height:350px;display:flex;flex-direction:column}h1{color:#ff0066;font-size:23px;margin:0 0 15px;font-weight:600}.q{border:1.5px solid #00c9e8;background:#f1fbfe;border-radius:13px;padding:11px 14px;margin:7px 0;font-size:18px}.opts{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}.opt{border:1.5px solid #ff0071;border-radius:9px;background:white;padding:7px 11px;font-size:16px;cursor:pointer;color:#222}.opt.selected{background:#d9efff;border-color:#0084d8}.opt.ok,.drop.ok{background:#d8f8df;border-color:#13a05c}.opt.bad,.drop.bad{background:#ffe4e4;border-color:#ed3333;animation:blink .45s 3}@keyframes blink{50%{background:#ff5c5c;color:white}}.actions{display:flex;justify-content:center;gap:9px;margin-top:auto;padding-top:25px}button{border:1.5px solid #ff0071;border-radius:9px;background:#fff;padding:8px 16px;cursor:pointer;font-size:15px}#result{text-align:center;color:#0074bd;font-weight:bold;margin:12px 0 0}.bank{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;padding:13px;background:#e3f9ff;border-radius:12px;margin-bottom:14px}.word{border:1.5px solid #00a9e0;background:#fff;border-radius:8px;padding:7px 13px;cursor:grab;font-size:18px}.drop{display:inline-flex;min-width:120px;min-height:35px;border:2px dashed #ff6b52;border-radius:6px;align-items:center;justify-content:center;padding:3px 9px;vertical-align:middle;cursor:pointer}.entry{width:100%;border:1.5px solid #ff745c;border-radius:7px;padding:9px;font-size:18px;margin-top:7px}.small{font-size:14px;color:#456}.matching{display:grid;grid-template-columns:1fr 1fr;gap:10px 25px;position:relative}.matchitem{min-height:88px;display:flex;align-items:center;gap:10px;border:1.5px solid #00c9e8;background:#f1fbfe;border-radius:10px;padding:10px;cursor:pointer;position:relative;z-index:1}.matchitem.active{border-color:#f06;background:#ffeaf2}.matchitem.linked{background:#e0fae5}.matchitem .dot{width:14px;height:14px;border:2px solid #f06;border-radius:50%;flex-shrink:0}.matchcanvas{position:absolute;inset:0;pointer-events:none;z-index:2;width:100%;height:100%}@media(max-width:650px){.exercise{margin:0;border-radius:0;padding:14px}.q{font-size:16px}.matchitem{font-size:14px;min-height:115px}.matching{gap:7px}}</style></head><body><main class="exercise"><h1>सही विकल्प पर सही (✓) का निशान लगाएँ–</h1><div class="q">(क) चाँद माता से क्या सिलवाने को कह रहा है?<div class="opts"><button class="opt" data-q="0" data-a="0" onclick="choose(0,0)">(i) पायजामा</button><button class="opt" data-q="0" data-a="1" onclick="choose(0,1)">(ii) झिंगोला</button><button class="opt" data-q="0" data-a="2" onclick="choose(0,2)">(iii) धोती</button></div></div><div class="q">(ख) कविता के अनुसार मौसम कैसा है?<div class="opts"><button class="opt" data-q="1" data-a="0" onclick="choose(1,0)">(i) गरम</button><button class="opt" data-q="1" data-a="1" onclick="choose(1,1)">(ii) बरसाती</button><button class="opt" data-q="1" data-a="2" onclick="choose(1,2)">(iii) ठंडा</button></div></div><div class="q">(ग) इनमें से कौन सा विलोम शब्दों का जोड़ा है–<div class="opts"><button class="opt" data-q="2" data-a="0" onclick="choose(2,0)">(i) सन-सन</button><button class="opt" data-q="2" data-a="1" onclick="choose(2,1)">(ii) ठिठुर-ठिठुर</button><button class="opt" data-q="2" data-a="2" onclick="choose(2,2)">(iii) घटता-बढ़ता</button></div></div><div class="q">(घ) यात्रा का बहुवचन होगा–<div class="opts"><button class="opt" data-q="3" data-a="0" onclick="choose(3,0)">(i) यात्री</button><button class="opt" data-q="3" data-a="1" onclick="choose(3,1)">(ii) यात्राएँ</button><button class="opt" data-q="3" data-a="2" onclick="choose(3,2)">(iii) यात्रियों</button></div></div><div class="actions"><button onclick="submitExercise()">Submit</button><button onclick="resetExercise()">Reset</button></div><div id="result">Score: 0 / 4</div></main><script>const key='kopal-2-ch12-mcq';const answers=[1,2,2,1];let selected=JSON.parse(localStorage.getItem(key)||'{}');function render(){document.querySelectorAll('.opt').forEach(e=>e.classList.toggle('selected',selected[e.dataset.q]==e.dataset.a))}function choose(q,a){selected[q]=a;localStorage.setItem(key,JSON.stringify(selected));document.querySelectorAll('.opt').forEach(e=>e.classList.remove('ok','bad'));render()}function submitExercise(){let score=0;answers.forEach((a,i)=>{let e=document.querySelector(`.opt[data-q="${i}"][data-a="${selected[i]}"]`);if(e){let ok=Number(selected[i])===a;e.classList.add(ok?'ok':'bad');if(ok)score++}});document.getElementById('result').textContent=`Score: ${score} / 4`;}function resetExercise(){selected={};localStorage.removeItem(key);document.querySelectorAll('.opt').forEach(e=>e.classList.remove('ok','bad'));render();document.getElementById('result').textContent='Score: 0 / 4'}render();</script></body></html>
