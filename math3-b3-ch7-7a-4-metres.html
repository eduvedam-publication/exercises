<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convert the following into metres.</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e2f8fc;font-family:Georgia,"Times New Roman",serif}
.card{width:min(1080px,calc(100% - 24px));min-height:420px;margin:14px auto;background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:30px 42px;display:flex;flex-direction:column}
h1{font:700 25px Arial,sans-serif;color:#00a1db;margin:0 0 30px}
.content{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 70px;flex:1;align-content:start}
.q{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:21px;line-height:1.6}
.letter{min-width:26px}input{width:86px;height:38px;border:2px solid #ff2b22;padding:4px 7px;font:18px Arial;background:#fff}
input.ok{background:#dff6df;border-color:#159447}input.bad{background:#ffe2e2;border-color:#d62d2d}
.footer{margin-top:auto;text-align:center;padding-top:28px}button{border:0;border-radius:24px;background:#ff7b00;color:#fff;font:bold 14px Arial;padding:13px 22px;margin:0 6px;cursor:pointer}
#score{margin-top:14px;color:#064bb4;font:bold 22px Arial}
@media(max-width:700px){.card{padding:24px 20px}.content{grid-template-columns:1fr;gap:15px}}
</style></head><body>
<main class="card"><h1>Convert the following into metres.</h1><div class="content"><div class="q"><span class="letter">a.</span><span>3 km =</span><input id="a0" inputmode="numeric" autocomplete="off"><span>m</span></div><div class="q"><span class="letter">b.</span><span>8 km =</span><input id="a1" inputmode="numeric" autocomplete="off"><span>m</span></div><div class="q"><span class="letter">c.</span><span>4 km 536 m =</span><input id="a2" inputmode="numeric" autocomplete="off"><span>m</span></div><div class="q"><span class="letter">d.</span><span>3 km 266 m =</span><input id="a3" inputmode="numeric" autocomplete="off"><span>m</span></div></div>
<div class="footer"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button><div id="score">Score: 0 / 4</div></div></main>
<script>
const answers=['3000', '8000', '4536', '3266'];
function check(){let s=0;answers.forEach((a,i)=>{let e=document.getElementById('a'+i),ok=e.value.trim().toLowerCase()===a.toLowerCase();e.classList.remove('ok','bad');e.classList.add(ok?'ok':'bad');if(ok)s++});document.getElementById('score').textContent=`Score: ${s} / 4`}
function resetAll(){answers.forEach((_,i)=>{let e=document.getElementById('a'+i);e.value='';e.classList.remove('ok','bad')});document.getElementById('score').textContent='Score: 0 / 4'}
</script></body></html>
