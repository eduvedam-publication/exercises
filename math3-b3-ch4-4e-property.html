<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#e8faff;font-family:Arial,sans-serif}.exercise{max-width:1080px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:30px 38px}h1{margin:0 0 28px;color:#00a3dc;font-size:25px}.qs{display:grid;gap:20px}.q{display:flex;align-items:center;gap:10px;font:20px Georgia,serif}.q .expr{min-width:260px}.ans{height:38px;border:2px solid red;font-size:17px;padding:4px 7px}.wide{width:300px}.small{width:90px}.four{grid-template-columns:repeat(4,1fr);gap:24px}.four .q{white-space:nowrap}.controls{display:flex;justify-content:center;gap:14px;margin-top:38px}.controls button{border:0;border-radius:24px;background:#ff7d00;color:#fff;font-weight:bold;padding:12px 22px}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:850px){.four{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.four{grid-template-columns:1fr}.q{flex-wrap:wrap}.q .expr{min-width:0}}</style></head><body><main class="exercise"><h1>Write the name of property is used in the following:</h1><div class="qs"><div class="q"><span>a.</span><span class="expr">8 × (2 × 6) = (8 × 2) × 6</span><input class="ans wide" id="a0"></div><div class="q"><span>b.</span><span class="expr">22 × 8 = 8 × 22</span><input class="ans wide" id="a1"></div><div class="q"><span>c.</span><span class="expr">1 × 8 = 8</span><input class="ans wide" id="a2"></div><div class="q"><span>d.</span><span class="expr">82 × 0 = 0</span><input class="ans wide" id="a3"></div></div><div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div class="score" id="score">Score: 0 / 4</div></main><script>const A=['Grouping property', 'Ordering property', 'Multiplicative property of 1', 'Multiplicative property of zero'];function norm(s){return s.trim().toLowerCase().replace(/\s+/g,' ')}function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById('a'+i),g=norm(e.value)===norm(a);e.classList.remove('ok','bad');e.classList.add(g?'ok':'bad');if(g)s++});score.textContent='Score: '+s+' / 4'}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});score.textContent='Score: 0 / 4'}</script></body></html>
