<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write the place value of the highlighted digits of the following numbers.</title><style>*{box-sizing:border-box}body{margin:0;background:#d9f8ff;font-family:Georgia,'Times New Roman',serif;color:#252525}.sheet{width:min(930px,calc(100% - 28px));margin:18px auto;padding:24px 28px 20px;background:white;border:3px solid #00a9dc;border-radius:22px}h2{color:#00a9e5;font-size:22px;margin:0 0 20px;line-height:1.4}.tag{float:right;background:#00afe3;color:white;border-radius:5px;padding:6px 12px;font:12px Arial}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}.item{display:flex;align-items:center;gap:9px;min-height:49px;font-size:20px}.item.wide{grid-column:1/-1}.n{width:22px;flex-shrink:0}.number{white-space:nowrap}.answer{border:2px solid #ff4b54;width:110px;height:38px;font:19px Georgia;text-align:center;background:white;outline:none;min-width:0}.answer.correct{border-color:#16a34a;background:#e3fae8}.answer.incorrect{border-color:#e53935;background:#ffe3e3;animation:blink .45s 2}@keyframes blink{50%{background:#fff;border-color:#ff4b54}}.actions{display:flex;justify-content:center;gap:12px;margin-top:28px}.actions button{border:0;border-radius:22px;background:#ff8400;color:white;padding:10px 20px;font:bold 14px Arial;cursor:pointer}.score{text-align:center;color:#0454b9;font:bold 20px Arial;margin-top:13px}.note{font-size:14px;color:#666}.triple{display:grid;grid-template-columns:25px minmax(70px,1fr) minmax(70px,1fr) minmax(70px,1fr);align-items:center;gap:12px;margin-bottom:14px;font-size:19px}.triple input{width:100%;max-width:120px}.given{border:1px solid #777;background:#f4f4f4;padding:8px 10px;text-align:center;min-width:95px;justify-self:start}.small{font-size:17px}@media(max-width:640px){.sheet{padding:16px 12px}.items{grid-template-columns:1fr}.item{font-size:17px}.answer{width:100px;font-size:16px}h2{font-size:19px}.tag{float:none;display:table;margin-bottom:8px}.triple{gap:6px;font-size:15px}.given{min-width:0;padding:7px 4px}} </style></head><body><main class="sheet"><span class="tag">Understanding</span><h2>Write the place value of the highlighted digits of the following numbers.</h2><div class="items"><div class="item"><span class="n">a.</span><span class="number">65<span style="color:red">7</span>835</span><input class="answer" inputmode="numeric" aria-label="Answer a"></div><div class="item"><span class="n">b.</span><span class="number">57<span style="color:red">6</span>23</span><input class="answer" inputmode="numeric" aria-label="Answer b"></div><div class="item"><span class="n">c.</span><span class="number">4123<span style="color:red">5</span>6</span><input class="answer" inputmode="numeric" aria-label="Answer c"></div><div class="item"><span class="n">d.</span><span class="number">9<span style="color:red">8</span>7512</span><input class="answer" inputmode="numeric" aria-label="Answer d"></div></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div class="score" id="score">Score: 0 / 4</div></main><script>const answers=["7000", "600", "50", "80000"],key="exercise:math-4-ch2-1b-place-value.html";const inputs=[...document.querySelectorAll('input.answer')];function save(){localStorage.setItem(key,JSON.stringify(inputs.map(x=>x.value)))}inputs.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('correct','incorrect');save()}));try{const a=JSON.parse(localStorage.getItem(key)||'[]');inputs.forEach((x,i)=>x.value=a[i]||'')}catch(e){}function norm(v){return v.trim().toLowerCase().replace(/[,\s-]/g,'')}function checkAnswers(){let score=0;inputs.forEach((x,i)=>{const ok=norm(x.value)===norm(answers[i]);x.classList.toggle('correct',ok);x.classList.toggle('incorrect',!ok);if(ok)score++});document.getElementById('score').textContent=`Score: ${score} / ${answers.length}`;save();window.parent.postMessage({exerciseType:'FILL_BLANK',response:{answers:inputs.map(x=>x.value),score,total:answers.length}},'*')}function resetExercise(){inputs.forEach(x=>{x.value='';x.classList.remove('correct','incorrect')});document.getElementById('score').textContent=`Score: 0 / ${answers.length}`;localStorage.removeItem(key)}</script></body></html>
