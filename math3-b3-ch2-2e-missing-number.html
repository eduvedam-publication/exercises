<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}.ex{max-width:1100px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{margin:0 0 25px;color:#00a5dc;font-size:25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}.actions button{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:700px){body{padding:0}.ex{padding:15px;border-radius:0}}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:35px}.problem{display:grid;grid-template-columns:25px auto;align-items:start;font:19px Georgia,serif}.card{background:#fdecef;padding:9px;width:190px}.cols{display:grid;text-align:center}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.head{color:#ff1680;border-bottom:1px solid #63d5ef;padding:5px 0}.row{min-height:42px;border-bottom:1px solid #63d5ef;align-items:center;position:relative}.plus:before{content:"+";position:absolute;left:-3px}.cell{display:flex;align-items:center;justify-content:center}.cell input{width:42px;height:35px;border:2px solid #ff3b30;font-size:17px;text-align:center}.result{padding-top:5px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="ex"><h1>Fill the missing numbers.</h1><div class="grid"><div class="problem"><span>a.</span><div class="card">
<div class="cols c3 head"><span class="cell">H</span><span class="cell">T</span><span class="cell">O</span></div>
<div class="cols c3 row"><span class="cell"><input id="a0" inputmode="numeric"></span><span class="cell">1</span><span class="cell"><input id="a1" inputmode="numeric"></span></div>
<div class="cols c3 row plus"><span class="cell">3</span><span class="cell">1</span><span class="cell">0</span></div>
<div class="cols c3 row result"><span class="cell">7</span><span class="cell"><input id="a2" inputmode="numeric"></span><span class="cell">3</span></div>
</div></div><div class="problem"><span>b.</span><div class="card">
<div class="cols c4 head"><span class="cell">Th</span><span class="cell">H</span><span class="cell">T</span><span class="cell">O</span></div>
<div class="cols c4 row"><span class="cell">3</span><span class="cell">1</span><span class="cell">0</span><span class="cell">0</span></div>
<div class="cols c4 row plus"><span class="cell">6</span><span class="cell"><input id="a3" inputmode="numeric"></span><span class="cell"><input id="a4" inputmode="numeric"></span><span class="cell">5</span></div>
<div class="cols c4 row result"><span class="cell"><input id="a5" inputmode="numeric"></span><span class="cell">8</span><span class="cell">2</span><span class="cell">5</span></div>
</div></div><div class="problem"><span>c.</span><div class="card">
<div class="cols c3 head"><span class="cell">H</span><span class="cell">T</span><span class="cell">O</span></div>
<div class="cols c3 row"><span class="cell"><input id="a6" inputmode="numeric"></span><span class="cell">4</span><span class="cell">7</span></div>
<div class="cols c3 row plus"><span class="cell">4</span><span class="cell"><input id="a7" inputmode="numeric"></span><span class="cell"><input id="a8" inputmode="numeric"></span></div>
<div class="cols c3 row result"><span class="cell">6</span><span class="cell">6</span><span class="cell">8</span></div>
</div></div></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 3</div></main><script>const ans=['4', '3', '2', '7', '2', '9', '2', '2', '1'];function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=e.value.trim()===a;e.className=ok?"ok":"bad";if(ok)s++});score.textContent=`Score: ${s} / 9`}function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.className=""});score.textContent="Score: 0 / 9"}</script></body></html>
