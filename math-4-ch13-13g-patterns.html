<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Complete the following patterns.</title><style>*{box-sizing:border-box}body{margin:0;background:#d5faff;font-family:Georgia,"Times New Roman",serif;color:#172536}.wrap{width:min(980px,96vw);margin:24px auto;background:white;border:3px solid #00ade4;border-radius:22px;padding:24px}h2{font-size:25px;color:#00a6df;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.q{border:1.5px solid #19b7ec;background:#ebfbff;border-radius:11px;padding:15px;font-size:19px;line-height:2}.q strong{color:#0068ac}.blank{width:66px;height:36px;border:2px solid #ff695c;border-radius:5px;background:#fff;text-align:center;font:19px Georgia;color:#172536;margin:0 3px;vertical-align:middle}.blank:focus{outline:2px solid #00a9e7}.blank.ok{background:#d8f8e4;border-color:#25b75a}.blank.bad{background:#ffe4e4;border-color:#e33;animation:blink 0.7s 2}@keyframes blink{50%{background:#fff}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}button{background:#ff8200;color:white;border:0;border-radius:24px;padding:12px 20px;font-weight:bold;cursor:pointer}button:hover{background:#e96d00}.pattern{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.pattern .q{font-size:17px}.line{white-space:nowrap;margin:5px 0}.hint{font-size:14px;color:#48616b;margin-bottom:12px}@media(max-width:650px){.grid,.pattern{grid-template-columns:1fr}.wrap{padding:16px}.q{font-size:17px}.blank{width:60px}}</style></head><body><main class="wrap"><h2>Complete the following patterns.</h2><div class="pattern"><section class="q"><strong>a.</strong> <div class="line"><input class="blank" inputmode="numeric" aria-label="a. row 1"> ÷ 8 = 1</div><div class="line"><input class="blank" inputmode="numeric" aria-label="a. row 2"> ÷ 8 = 10</div><div class="line"><input class="blank" inputmode="numeric" aria-label="a. row 3"> ÷ 8 = 100</div><div class="line"><input class="blank" inputmode="numeric" aria-label="a. row 4"> ÷ 8 = 1000</div></section><section class="q"><strong>b.</strong> <div class="line"><input class="blank" inputmode="numeric" aria-label="b. row 1"> ÷ 3 = 1</div><div class="line"><input class="blank" inputmode="numeric" aria-label="b. row 2"> ÷ 3 = 10</div><div class="line"><input class="blank" inputmode="numeric" aria-label="b. row 3"> ÷ 3 = 100</div><div class="line"><input class="blank" inputmode="numeric" aria-label="b. row 4"> ÷ 3 = 1000</div></section><section class="q"><strong>c.</strong> <div class="line">5 ÷ <input class="blank" inputmode="numeric" aria-label="c. row 1"> = 1</div><div class="line">50 ÷ <input class="blank" inputmode="numeric" aria-label="c. row 2"> = 10</div><div class="line">500 ÷ <input class="blank" inputmode="numeric" aria-label="c. row 3"> = 100</div><div class="line">5000 ÷ <input class="blank" inputmode="numeric" aria-label="c. row 4"> = 1000</div></section></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div></main><script>const answers=["8", "80", "800", "8000", "3", "30", "300", "3000", "5", "5", "5", "5"];const key='exercise:'+location.pathname;const fields=[...document.querySelectorAll('.blank')];function persist(){localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}function restore(){try{const a=JSON.parse(localStorage.getItem(key)||'[]');fields.forEach((f,i)=>f.value=a[i]||'')}catch(e){}}fields.forEach(f=>f.addEventListener('input',()=>{f.classList.remove('ok','bad');persist()}));function normalized(s){return String(s).trim().replace(/\s+/g,'')}function check(){fields.forEach((f,i)=>{f.classList.remove('ok','bad');void f.offsetWidth;if(f.value.trim())f.classList.add(normalized(f.value)===normalized(answers[i])?'ok':'bad')});persist()}function showAnswers(){fields.forEach((f,i)=>{f.value=answers[i];f.classList.remove('bad');f.classList.add('ok')});persist()}function resetAll(){fields.forEach(f=>{f.value='';f.classList.remove('ok','bad')});localStorage.removeItem(key)}restore();</script></body></html>
