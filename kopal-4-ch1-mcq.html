<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kopal Hindi 4 Chapter 1 MCQ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8f8ff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#20343c}.wrap{max-width:1000px;margin:22px auto;background:#fff;border:3px solid #36bce7;border-radius:18px;padding:24px}h2{color:#e84b8a;margin:0 0 8px;font-size:25px}.meta{color:#55727b;margin:0 0 18px}.q{background:#f2fbff;border:1px solid #9bdff2;border-radius:12px;padding:14px;margin:12px 0;font-size:18px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:11px}.opt{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fff;border:1px solid #ff91b9;border-radius:8px;padding:9px;cursor:pointer}.opt.sel{background:#ffe5ef;border-color:#e84b8a}.opt.correct{background:#dff9e7!important;border-color:#22a653!important}.opt.wrong{background:#ffe1e1!important;border-color:#ed3434!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.5}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}.actions button{border:0;border-radius:22px;padding:11px 20px;background:#e84b8a;color:white;font-weight:bold;cursor:pointer;font-size:15px}#score{text-align:center;color:#087da8;font-weight:bold;font-size:19px;margin-top:15px}@media(max-width:650px){.wrap{margin:7px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}
</style></head><body><main class="wrap">
<h2>सही विकल्प पर सही (✓) का निशान लगाइए–</h2><p class="meta">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 5</p><section id="questions"></section>
<div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 5</div></main>
<script>
const data=[
["हिमालय पर्वत किससे डरने की बात नहीं कर रहा है?",["आँधी से","पानी से","दोनों से"],0],
["कवि किस प्रकार खड़े रहने की बात कह रहे हैं?",["विचलित होकर","अविचलित होकर","अस्थिर रहकर"],1],
["सफलता कैसे मिलती है?",["मुसीबत आने पर","खुशी आने पर","मुसीबत में भी अटल रहने पर"],2],
["यह ‘अचल’ है–",["पृथ्वी","पर्वत","नदी"],1],
["‘जग’ का अर्थ यह नहीं है–",["संसार","एक बरतन","कलश"],1]
],key='kopal-4-ch1-mcq';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const root=document.getElementById('questions');
function render(){root.innerHTML=data.map((q,i)=>`<div class="q" id="q${i}"><b>(${'कखगघङ'[i]}) ${q[0]}</b><div class="opts">${q[1].map((o,j)=>`<div class="opt ${answers[i]===j?'sel':''}" id="o${i}-${j}" role="button" tabindex="0" onclick="pick(${i},${j})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(${i},${j})}"><span>(${'i ii iii'.split(' ')[j]}) ${o}</span><span>${answers[i]===j?'☑':'□'}</span></div>`).join('')}</div></div>`).join('')}
function pick(i,j){answers[i]=j;localStorage.setItem(key,JSON.stringify(answers));render()}
function check(){let score=0;data.forEach((q,i)=>{document.querySelectorAll(`#q${i} .opt`).forEach(el=>el.classList.remove('correct','wrong'));if(answers[i]!==undefined){let el=document.getElementById('o'+i+'-'+answers[i]);let ok=answers[i]===q[2];el.classList.add(ok?'correct':'wrong');if(ok)score++}});document.getElementById('score').textContent=`प्राप्तांक: ${score} / 5`}
function showAnswers(){data.forEach((q,i)=>answers[i]=q[2]);localStorage.setItem(key,JSON.stringify(answers));render();check()}
function resetAll(){answers={};localStorage.removeItem(key);render();document.getElementById('score').textContent='प्राप्तांक: 0 / 5'}render();
</script></body></html>
