<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}
.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}
.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}
input{height:38px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:4px 7px;outline:none}
.mathbox{width:145px;background:#dff1fb;padding:9px}.place,.digits{display:grid;grid-template-columns:30px 30px 30px;justify-content:end;text-align:center;font-family:Georgia,serif}
.place{color:#ff4050;font-size:20px;margin-bottom:10px}.digits{font-size:21px;line-height:1.45}.line{border-top:2px solid #08a9dc;margin:2px 0 5px}
@media(max-width:700px){body{padding:0}.exercise{border-radius:0;padding:16px}}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px}.problem{display:flex;gap:10px;align-items:flex-start;min-width:0}.lab{font:20px Georgia,serif;margin-top:8px}.problem .mathbox{width:145px;min-width:145px}.problem .mathbox input{display:block;width:100%;max-width:100%;margin:0}
</style></head><body><main class="exercise"><h1>Subtract the following:</h1><div class="grid"><div class="problem"><span class="lab">a.</span><div class="mathbox"><div class="place"><span></span><span>T</span><span>O</span></div><div class="digits"><span></span><span>2</span><span>4</span></div><div class="digits"><span>−</span><span>1</span><span>2</span></div><div class="line"></div><input id="a0" inputmode="numeric"></div></div><div class="problem"><span class="lab">b.</span><div class="mathbox"><div class="place"><span></span><span>T</span><span>O</span></div><div class="digits"><span></span><span>6</span><span>4</span></div><div class="digits"><span>−</span><span>3</span><span>3</span></div><div class="line"></div><input id="a1" inputmode="numeric"></div></div><div class="problem"><span class="lab">c.</span><div class="mathbox"><div class="place"><span></span><span>T</span><span>O</span></div><div class="digits"><span></span><span>4</span><span>6</span></div><div class="digits"><span>−</span><span>3</span><span>9</span></div><div class="line"></div><input id="a2" inputmode="numeric"></div></div><div class="problem"><span class="lab">d.</span><div class="mathbox"><div class="place"><span></span><span>T</span><span>O</span></div><div class="digits"><span></span><span>8</span><span>2</span></div><div class="digits"><span>−</span><span>6</span><span>4</span></div><div class="line"></div><input id="a3" inputmode="numeric"></div></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div><script>const ans=["12","31","7","18"];function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=e.value.trim()===a;e.className=ok?"ok":"bad";if(ok)s++});score.textContent=`Score: ${s} / 4`}function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.className=""});score.textContent="Score: 0 / 4"}</script></main></body></html>
