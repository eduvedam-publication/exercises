<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Express as fractions.</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;font-family:Arial,sans-serif}.exercise{max-width:1050px;margin:22px auto;padding:26px 30px;background:#fff;border:3px solid #00ade0;border-radius:25px}h1{font:700 25px Georgia,serif;color:#00a9dc;margin:0 0 22px}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 22px}.question{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:19px Georgia,serif}.letter{min-width:22px}.fraction{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;min-width:33px}.fraction .top{border-bottom:1.5px solid #222;padding:0 5px 3px}.fraction .bottom{padding:3px 5px 0}.mixed{display:inline-flex;align-items:center;gap:5px}.answer{width:110px;border:2px solid #ff5260;background:white;padding:7px 6px;font:18px Arial;outline:none}.answer.correct{background:#dff9e8;border-color:#14a351}.answer.incorrect{background:#ffe1e5;border-color:#e22d3a;animation:blink .3s linear 3}@keyframes blink{50%{background:#ff98a5}}.actions{display:flex;justify-content:center;gap:12px;margin-top:32px}button{background:#ff8200;color:white;border:0;border-radius:24px;padding:11px 21px;font-weight:bold;cursor:pointer}.score{text-align:center;color:#0755b6;font:bold 21px Arial;margin-top:14px}@media(max-width:720px){.questions{grid-template-columns:1fr}.exercise{padding:18px;margin:8px}h1{font-size:22px}}</style></head><body><main class="exercise"><h1>Express as fractions.</h1><div class="questions"><label class="question"><span class="letter">a.</span><span>40 + 5 + 0.2 + 0.05</span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="45.25" aria-label="Answer a"></label><label class="question"><span class="letter">b.</span><span>100 + 50 + 6 + 0.6 + 0.08 + 0.002</span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="156.682" aria-label="Answer b"></label><label class="question"><span class="letter">c.</span><span>200 + 30 + 5 + 0.3 + 0.05 + 0.001</span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="235.351" aria-label="Answer c"></label><label class="question"><span class="letter">d.</span><span>500 + 80 + 9 + 0.7 + 0.009</span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="589.709" aria-label="Answer d"></label><label class="question"><span class="letter">e.</span><span>800 + 40 + 6 + 0.9 + 0.002</span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="846.902" aria-label="Answer e"></label></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div id="score" class="score">Score: 0 / 5</div></main><script>const inputs=[...document.querySelectorAll('.answer')],KEY="math-4-ch8-8c-express-fractions-v1";function save(){try{localStorage.setItem(KEY,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}function restore(){try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');inputs.forEach((x,i)=>x.value=v[i]||'')}catch(e){}}inputs.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('correct','incorrect');save()}));function checkAnswers(){let score=0;inputs.forEach(x=>{let ok=x.value.trim()===x.dataset.answer;x.classList.remove('correct','incorrect');void x.offsetWidth;x.classList.add(ok?'correct':'incorrect');if(ok)score++});document.getElementById('score').textContent=`Score: ${score} / ${inputs.length}`;save()}function resetExercise(){inputs.forEach(x=>{x.value='';x.classList.remove('correct','incorrect')});document.getElementById('score').textContent=`Score: 0 / ${inputs.length}`;save()}restore();</script></body></html>
