<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-4-ch16-mcq.html</title><style>*{box-sizing:border-box}body{margin:0;background:#ccfaff;color:#24303b;font-family:"Noto Sans Devanagari","Mangal",sans-serif}.wrap{width:min(1060px,95vw);margin:22px auto;padding:25px;background:white;border:3px solid #00afea;border-radius:24px}h2{font-size:25px;color:#00a8e5;margin:0 0 18px}.q{background:#e8faff;border:1.5px solid #00b8f7;border-radius:12px;padding:13px;margin:9px 0;font-size:19px}.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.bank{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;background:#d9f8ff;padding:15px;border-radius:12px;margin:10px 0 16px}.chip{background:white;border:1.5px solid #00a9f9;border-radius:8px;padding:9px 13px;font:inherit;cursor:grab}.chip.chosen{background:#b9efff;outline:2px solid #0097e6}.chip.used{opacity:.4}.slot{display:inline-flex;min-width:125px;min-height:43px;padding:6px 10px;justify-content:center;align-items:center;background:white;border:2px dashed #f36e59;border-radius:8px;cursor:pointer}.good{background:#d7f8dc!important;border-color:#21aa45!important}.bad{background:#ffe0e0!important;border-color:#e72e3a!important}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:23px}.action{background:#ff8200;color:white;border:0;border-radius:24px;padding:12px 20px;font-weight:bold;cursor:pointer}.marks{text-align:center;color:#0052c6;font-size:20px;font-weight:bold;margin-top:14px}.opt{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border:1px solid #9edcff;background:white;border-radius:9px;cursor:pointer;font-size:18px}.opt.selected{border:2px solid #008fef;background:#d8f5ff}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.field{min-width:170px;flex:1;border:2px solid #ff6056;border-radius:5px;font:inherit;padding:9px;background:white}.example{color:#5b6873;font-size:15px}@media(max-width:720px){.wrap{padding:14px}.rows,.opts{grid-template-columns:1fr}h2{font-size:21px}}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ–</h2><div id="questions"></div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="showAnswer()">Show Answer</button><button class="action" onclick="resetAll()">Reset</button></div><div class="marks" id="marks"></div></main><script>const questions=["‘प्रोत्साहित’ का शुद्ध शब्द है–", "बाबा जी दिन भर बाग में क्यों रहते थे?", "बाबा जी की गाय का क्या नाम था?", "‘तुम नवयुवक और शक्तिशाली हो’ में रेखांकित शब्द है–"],options=[["परोत्साहित", "प्रोत्साहित", "प्रोतसहित"], ["पानी देने के लिए", "ताजी हवा के लिए", "रखवाली के लिए"], ["नलिनी", "नंदिनी", "मंगला"], ["संज्ञा", "विशेषण", "विशेष्य"]],correct=[1, 2, 1, 1],key="kopal-4-ch16-mcq.html-v1";let picks;try{picks=JSON.parse(localStorage.getItem(key))}catch(e){}if(!Array.isArray(picks)||picks.length!==questions.length)picks=Array(questions.length).fill(null);function save(){localStorage.setItem(key,JSON.stringify(picks))}function render(){document.getElementById('questions').innerHTML=questions.map((q,i)=>`<div class="q"><strong>(${'क ख ग घ ङ'.split(' ')[i]}) ${q}</strong><div class="opts">${options[i].map((o,k)=>`<button class="opt ${picks[i]===k?'selected':''}" onclick="pick(${i},${k})"><span>(${['i','ii','iii'][k]}) ${o}</span><span>${picks[i]===k?'☑':'□'}</span></button>`).join('')}</div></div>`).join('')}function pick(i,k){picks[i]=k;save();render()}function submit(){render();let n=0;document.querySelectorAll('.q').forEach((q,i)=>{if(picks[i]!==null){let ok=picks[i]===correct[i];if(ok)n++;q.classList.add(ok?'good':'bad')}});document.getElementById('marks').textContent=`Marks: ${n} / ${questions.length}`}function showAnswer(){picks=correct.slice();save();submit()}function resetAll(){picks=Array(questions.length).fill(null);save();render();document.getElementById('marks').textContent=`Marks: 0 / ${questions.length}`}render();document.getElementById('marks').textContent=`Marks: 0 / ${questions.length}`;</script></body></html>
