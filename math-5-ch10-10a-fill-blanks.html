<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fill in the blanks.</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;background:#b9fbff;color:#172735;font-family:Georgia,'Times New Roman',serif}.sheet{width:min(1050px,100%);padding:22px 24px;background:white;border:3px solid #00a9f4;border-radius:20px}h1{font:700 clamp(23px,3vw,32px) Arial,sans-serif;color:#009ff0;margin:0 0 17px}.bar{height:20px;border-radius:30px;background:#bff5fb;margin:0 0 12px}.question{background:#d9f8ff;border:1.5px solid #00a9ff;border-radius:11px;padding:12px 14px;margin:9px 0;font-size:clamp(16px,1.7vw,20px)}.prompt{margin:0 0 9px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{background:white;border:1.5px solid #00a9ff;border-radius:9px;padding:9px 12px;font:inherit;color:#172735;cursor:pointer;min-height:44px}.choice:hover{background:#eafdff}.choice.selected{background:#9deaf7;border-color:#008ed0;box-shadow:inset 0 0 0 1px #008ed0}.choice.correct{background:#e4ffed;border-color:#20a953}.choice.wrong{background:#fff0f0;border-color:#e62c38}.choice:focus-visible,button:focus-visible{outline:3px solid #005ac0;outline-offset:2px}.feedback{display:inline-block;font:700 14px Arial,sans-serif;margin-top:8px}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:21px}.actions button{background:#ff7000;color:white;border:0;border-radius:24px;padding:11px 19px;font-weight:700;cursor:pointer}#score{text-align:center;color:#003bea;font:700 21px Arial,sans-serif;margin:11px 0 0}.note{font:13px Arial;color:#565d65;margin:10px 0 0}@media(max-width:620px){.sheet{padding:16px 12px}.question{padding:10px}.choice{padding:8px 10px}}@media(max-height:700px) and (min-width:800px){.sheet{padding:16px 20px}.question{padding:9px 12px;margin:7px 0}.bar{height:13px}.actions{margin-top:13px}} .items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.item{background:#d9f8ff;border:1.5px solid #00a9ff;border-radius:11px;padding:12px;font-size:19px;min-width:0}.item label{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.item input{min-width:0;width:128px;max-width:100%;padding:8px;border:2px solid #ff685d;border-radius:5px;font:inherit;background:white;color:#173c4d}.item input.correct{border-color:#20a953;background:#e8fff0}.item input.wrong{border-color:#e62c38;background:#fff0f0}.item .feedback{display:block}.blanks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.blanks .item{min-height:80px}.blanks .item input{width:116px}@media(max-width:850px){.items{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.items,.blanks{grid-template-columns:repeat(2,minmax(0,1fr))}.item{font-size:16px;padding:9px}.item input{width:110px}}@media(max-width:400px){.items,.blanks{grid-template-columns:1fr}}body{display:block}.sheet{margin:0 auto}.items,.blanks{display:grid;grid-template-columns:1fr;gap:6px}.item,.blanks .item{min-height:0;padding:8px 12px;font-size:18px}.item label{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.item input,.blanks .item input{width:145px}.item .feedback{display:inline-block;margin:3px 0 0 8px}@media(max-width:620px){.items,.blanks{grid-template-columns:1fr}.item,.blanks .item{font-size:16px;padding:8px}.item input,.blanks .item input{width:115px}}.blanks .item{display:flex;align-items:center;flex-wrap:wrap;gap:5px 8px}.blanks .item label{display:inline-flex;align-items:center;flex-wrap:wrap}</style></head><body><main class="sheet"><h1>Fill in the blanks.</h1><div class="bar" aria-hidden="true"></div><div class="blanks"><div class="item"><label for="a0">a. Temperature is measured by a <input id="a0" aria-label="a. Temperature is measured by a" autocomplete="off" inputmode="text" placeholder="Answer"> </label><span class="feedback" id="f0" aria-live="polite"></span></div><div class="item"><label for="a1">b. Normal human body temperature is <input id="a1" aria-label="b. Normal human body temperature is" autocomplete="off" inputmode="decimal" placeholder="Answer"> °C</label><span class="feedback" id="f1" aria-live="polite"></span><label for="a2">or <input id="a2" aria-label="or" autocomplete="off" inputmode="decimal" placeholder="Answer"> °F</label><span class="feedback" id="f2" aria-live="polite"></span></div><div class="item"><label for="a3">c. Freezing point of water is <input id="a3" aria-label="c. Freezing point of water is" autocomplete="off" inputmode="decimal" placeholder="Answer"> °C</label><span class="feedback" id="f3" aria-live="polite"></span><label for="a4">or <input id="a4" aria-label="or" autocomplete="off" inputmode="decimal" placeholder="Answer"> °F</label><span class="feedback" id="f4" aria-live="polite"></span></div><div class="item"><label for="a5">d. Boiling point of water is <input id="a5" aria-label="d. Boiling point of water is" autocomplete="off" inputmode="decimal" placeholder="Answer"> °C</label><span class="feedback" id="f5" aria-live="polite"></span><label for="a6">or <input id="a6" aria-label="or" autocomplete="off" inputmode="decimal" placeholder="Answer"> °F</label><span class="feedback" id="f6" aria-live="polite"></span></div></div><div class="actions"><button id="submit" type="button">Submit</button><button id="show" type="button">Show Answer</button><button id="reset" type="button">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 7</p></main><script>const answers=[{"answer": "thermometer"}, {"answer": "37"}, {"answer": "98.6"}, {"answer": "0"}, {"answer": "32"}, {"answer": "100"}, {"answer": "212"}],key="exercise:math-5-ch10-10a-fill-blanks.html",inputs=[...document.querySelectorAll('.item input')],score=document.getElementById('score');function norm(v){return String(v).toLowerCase().replace(/thermometer/g,'thermometer').replace(/[°º\s]/g,'').replace(/[₹,]/g,'')}function good(x,a){let v=norm(x.value);return [a.answer,...(a.accept||[])].some(z=>v===norm(z))}function save(){try{localStorage.setItem(key,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}function clearMarks(){inputs.forEach((x,i)=>{x.classList.remove('correct','wrong');let f=document.getElementById('f'+i);f.textContent='';f.className='feedback'});score.textContent='Marks: 0 / '+answers.length}try{let old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old))old.forEach((v,i)=>{if(inputs[i]&&typeof v==='string')inputs[i].value=v})}catch(e){}inputs.forEach(x=>x.addEventListener('input',()=>{clearMarks();save()}));document.getElementById('submit').onclick=()=>{let marks=0;inputs.forEach((x,i)=>{let ok=good(x,answers[i]);marks+=ok;x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok);let f=document.getElementById('f'+i);f.textContent=ok?'✓ Correct':'✗ Wrong';f.className='feedback '+(ok?'ok':'no')});score.textContent=`Marks: ${marks} / ${answers.length}`;save();const detail={exerciseType:'FILL_BLANK',exerciseId:"math-5-ch10-10a-fill-blanks.html",response:Object.fromEntries(inputs.map((x,i)=>['question'+(i+1),x.value])),marks,total:answers.length};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'V"math-5-ch10-10a-fill-blanks.html"YALAYA_EXERCISE_SUBMIT',...detail},'*')};document.getElementById('show').onclick=()=>{inputs.forEach((x,i)=>x.value=answers[i].answer);save();clearMarks()};document.getElementById('reset').onclick=()=>{inputs.forEach(x=>x.value='');save();clearMarks()};</script></body></html>
