<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add the following.</title><style>
*{box-sizing:border-box}body{margin:0;background:#d6faff;color:#152d42;font-family:Georgia,'Times New Roman',serif}.sheet{max-width:1030px;margin:18px auto;background:white;border:3px solid #00a9df;border-radius:22px;padding:23px 27px}h2{margin:0 0 18px;color:#00a9df;font-size:25px}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.q{border:1.5px solid #00b9f5;background:#ecfaff;border-radius:12px;padding:13px;font-size:18px;line-height:1.65;min-width:0}.q.wide{grid-column:1/-1}.q strong{color:#0076af}input{font:inherit;color:#152d42;border:2px solid #ff5858;border-radius:3px;background:white;min-height:34px;padding:3px 6px;max-width:100%;width:160px;vertical-align:middle}input.small{width:82px}input.medium{width:116px}.inline{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px}.choice{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;background:white;border:1px solid #9cddf4;border-radius:8px;padding:8px 10px;min-height:44px}.choice input{width:20px;height:20px;min-height:20px;accent-color:#00a9df;flex-shrink:0}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.choice.good,.q.good{border-color:#18a85b;background:#eafff0}.choice.bad,.q.bad{border-color:#f04444;background:#fff1f1;animation:blink .4s 3}@keyframes blink{50%{background:#ffbdbd}}.feedback{font:14px Arial,sans-serif;margin-top:6px;min-height:18px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.actions button{border:0;border-radius:22px;background:#ff8000;color:white;font:bold 14px Arial;padding:11px 20px;cursor:pointer}.actions button:hover{background:#e76f00}.status{text-align:center;margin:13px 0 0;font:bold 16px Arial;color:#0053a4}.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}.matchcol{display:grid;gap:8px}.match button{border:1px solid #65c8ec;background:white;padding:12px;border-radius:8px;cursor:pointer;text-align:left;font:18px Georgia}.match button.sel{background:#d5f6ff;border:2px solid #008bcc}.match button.paired{background:#e0ffed}.match button.bad{border:2px solid #ed3b3b}.pic{width:100%;max-width:440px;display:block;margin:6px 0}@media(max-width:650px){.sheet{margin:6px;padding:14px;border-radius:13px}h2{font-size:21px}.questions,.options{grid-template-columns:1fr}.q{font-size:17px}.match button{font-size:15px}} </style></head><body><main class="sheet"><h2>Add the following.</h2><div id="exercise"></div><div class="actions"><button id="check">Check Answers</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div id="status" class="status" aria-live="polite"></div></main><script>
const TYPE="fill", ITEMS=[{"label": "a", "q": "15 m 35 cm and 24 m 20 cm", "answer": "39 m 55 cm"}, {"label": "b", "q": "773 kg 532 g and 225 kg 512 g", "answer": "999 kg 44 g"}], KEY='eduvedam:'+location.pathname.split('/').pop()+':math4ch9assessment';
const el=document.getElementById('exercise'),status=document.getElementById('status');let values={},pairs={},pending=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function normalize(s){return String(s).toLowerCase().replace(/,/g,'').replace(/\s+/g,'').replace(/\./g,'').trim()}
function save(){try{localStorage.setItem(KEY,JSON.stringify({values,pairs}))}catch(e){}}
function render(){let content='';if(TYPE==='mcq'){content='<div class="questions">'+ITEMS.map((x,i)=>`<section class="q wide" id="q${i}"><strong>${x.label}.</strong> ${esc(x.q)} ${i===0?'<img class="pic" src="" alt="Three different weighing scales">':''}<div class="options">${x.options.map((o,j)=>`<label class="choice" id="o${i}_${j}"><span>${['i','ii','iii','iv'][j]}. ${esc(o)}</span><input type="radio" name="q${i}" value="${j}" ${String(values[i])===String(j)?'checked':''}></label>`).join('')}</div><div class="feedback" id="f${i}"></div></section>`).join('')+'</div>'}else if(TYPE==='tf'){content='<div class="questions">'+ITEMS.map((x,i)=>`<section class="q" id="q${i}"><strong>${x.label}.</strong> ${esc(x.q)}<div class="options"><label class="choice">True <input type="radio" name="q${i}" value="true" ${values[i]==='true'?'checked':''}></label><label class="choice">False <input type="radio" name="q${i}" value="false" ${values[i]==='false'?'checked':''}></label></div><div class="feedback" id="f${i}"></div></section>`).join('')+'</div>'}else if(TYPE==='matching'){content='<p>Click one item on the left and its matching answer on the right.</p><div class="match"><div class="matchcol">'+ITEMS.left.map((s,i)=>`<button type="button" data-side="left" data-i="${i}" id="left${i}">${esc(s)}</button>`).join('')+'</div><div class="matchcol">'+ITEMS.right.map((s,i)=>`<button type="button" data-side="right" data-i="${i}" id="right${i}">${esc(s)}</button>`).join('')+'</div></div>'}else{content='<div class="questions">'+ITEMS.map((x,i)=>`<section class="q" id="q${i}"><strong>${x.label}.</strong> <span class="inline">${esc(x.q)} ${x.units?'<span>('+esc(x.units)+')</span>':''} <input aria-label="Answer ${x.label}" data-i="${i}" value="${esc(values[i]||'')}" placeholder="Your answer" autocomplete="off"></span><div class="feedback" id="f${i}"></div></section>`).join('')+'</div>'}el.innerHTML=content;el.querySelectorAll('input[data-i]').forEach(n=>n.addEventListener('input',()=>{values[n.dataset.i]=n.value;save()}));el.querySelectorAll('input[type=radio]').forEach(n=>n.addEventListener('change',()=>{values[n.name.slice(1)]=n.value;save()}));el.querySelectorAll('.match button').forEach(n=>n.addEventListener('click',()=>{let side=n.dataset.side,i=Number(n.dataset.i);if(side==='left'){pending=i;el.querySelectorAll('.match button').forEach(b=>b.classList.remove('sel'));n.classList.add('sel')}else if(pending!==null){for(let k in pairs)if(Number(pairs[k])===i)delete pairs[k];pairs[pending]=i;pending=null;save();paintPairs()}}));paintPairs()}
function paintPairs(){if(TYPE!=='matching')return;el.querySelectorAll('.match button').forEach(b=>b.classList.remove('paired','bad'));for(let k in pairs){document.getElementById('left'+k)?.classList.add('paired');document.getElementById('right'+pairs[k])?.classList.add('paired')}}
function correct(i){let a=ITEMS[i].answer;return Array.isArray(a)?a.some(v=>normalize(v)===normalize(values[i]||'')):normalize(a)===normalize(values[i]||'')}
function check(){let n=0;if(TYPE==='matching'){ITEMS.answers.forEach((a,i)=>{let ok=Number(pairs[i])===a;if(ok)n++;else if(pairs[i]!==undefined)document.getElementById('left'+i).classList.add('bad')})}else ITEMS.forEach((x,i)=>{let ok=correct(i);if(ok)n++;let q=document.getElementById('q'+i);q.classList.remove('good','bad');q.classList.add(ok?'good':'bad');let f=document.getElementById('f'+i);f.textContent=ok?'✓ Correct':(values[i]===undefined||values[i]===''?'Please answer':'✗ Try again');f.style.color=ok?'#138c49':'#d52c2c';if(TYPE==='mcq')x.options.forEach((_,j)=>document.getElementById('o'+i+'_'+j).classList.toggle('good',ok&&Number(values[i])===j))});status.textContent=`${n} of ${TYPE==='matching'?ITEMS.answers.length:ITEMS.length} correct`;save();try{window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',exerciseType:TYPE==='mcq'?'OPTION':TYPE==='matching'?'MATCHING':TYPE==='tf'?'TICK':'FILL_BLANK',response:{answers:values,matches:pairs,correct:n}},'*')}catch(e){}}
function show(){if(TYPE==='matching'){pairs={};ITEMS.answers.forEach((v,i)=>pairs[i]=v)}else ITEMS.forEach((x,i)=>values[i]=String(Array.isArray(x.answer)?x.answer[0]:x.answer));render();check();status.textContent='Correct answers filled automatically.';save()}
function reset(){values={};pairs={};pending=null;save();render();status.textContent=''}
try{let saved=JSON.parse(localStorage.getItem(KEY)||'{}');values=saved.values||{};pairs=saved.pairs||{}}catch(e){}render();document.getElementById('check').onclick=check;document.getElementById('show').onclick=show;document.getElementById('reset').onclick=reset;
</script></body></html>
