in><script>const questions=[{"answer": "50"}, {"answer": "20"}, {"answer": "10"}, {"answer": "80"}, {"answer": "20"}, {"answer": "10"}, {"answer": "5"}, {"answer": "2"}, {"answer": "37"}, {"answer": "200"}, {"answer": "20"}, {"answer": "1"}, {"answer": "221"}],key='exercise:math-1-ch10-assessment-total-amount.html';const fields=questions.map((_,i)=>document.getElementById('a'+i));function norm(v){return String(v).trim().toLowerCase().replace(/\s+/g,'').replace(/[×xX*]/g,'*').replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c))}function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}catch(e){}}function clear(){fields.forEach(x=>x.classList.remove('correct','wrong'))}fields.forEach(x=>x.addEventListener('input',()=>{clear();save()}));try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))fields.forEach((x,i)=>{if(typeof a[i]==='string')x.value=a[i]})}catch(e){}document.getElementById('submit').addEventListener('click',()=>{fields.forEach((x,i)=>{const ok=norm(x.value)===questions[i].answer;x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok)});save();const detail={exerciseType:'FILL_BLANK',exerciseId:'math-1-ch10-assessment-total-amount.html',response:Object.fromEntries(fields.map((x,i)=>['question'+(i+1),x.value]))};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')});document.getElementById('show').addEventListener('click',()=>{fields.forEach((x,i)=>x.value=questions[i].answer);clear();save()});document.getElementById('reset').addEventListener('click',()=>{fields.forEach(x=>x.value='');clear();save()});</script></body></html>
