<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find the LCM of the following:</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;color:#222;font-family:Georgia,'Times New Roman',serif}.exercise{max-width:980px;margin:20px auto;padding:25px 30px;background:white;border:3px solid #00afe2;border-radius:25px}h2{margin:0 0 20px;color:#00a7db;font-size:23px}.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 22px}.question{font-size:19px;display:flex;align-items:center;gap:8px;white-space:nowrap}.answer{width:85px;height:34px;border:2px solid #ff5665;background:white;text-align:center;font:19px Georgia;outline:none}.answer.correct,.choice.correct{border-color:#15a64b;background:#d9f8e1}.answer.wrong,.choice.wrong{border-color:#e32b39;background:#ffe3e6;animation:blink .55s 3}@keyframes blink{50%{background:#ff9098}}.actions{display:flex;justify-content:center;gap:12px;margin-top:30px}button{border:0;border-radius:22px;background:#ff8300;color:white;padding:11px 22px;font-weight:bold;cursor:pointer}#result{text-align:center;color:#064bb4;font:bold 21px Arial;margin-top:15px}.line{font-size:19px;line-height:2.6}.line .answer{width:58px;vertical-align:middle}.choices{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.choice{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid #92dcf6;border-radius:9px;background:#edfbff;cursor:pointer;font-size:19px}.choice input{accent-color:#00a9df;width:19px;height:19px}.choice.selected{border-color:#00a9df;background:#d6f5ff}@media(max-width:700px){.exercise{margin:8px;padding:18px 14px}.questions{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 8px}.question{font-size:16px}.answer{width:65px}h2{font-size:20px}}</style></head><body><main class="exercise"><h2>Find the LCM of the following:</h2><div class="questions"><label class="question"><span>a. &nbsp;2 and 4</span><input class="answer" inputmode="numeric" aria-label="LCM of 2 and 4"></label><label class="question"><span>b. &nbsp;5 and 10</span><input class="answer" inputmode="numeric" aria-label="LCM of 5 and 10"></label><label class="question"><span>c. &nbsp;12 and 15</span><input class="answer" inputmode="numeric" aria-label="LCM of 12 and 15"></label><label class="question"><span>d. &nbsp;6 and 9</span><input class="answer" inputmode="numeric" aria-label="LCM of 6 and 9"></label><label class="question"><span>e. &nbsp;3, 6 and 9</span><input class="answer" inputmode="numeric" aria-label="LCM of 3, 6 and 9"></label><label class="question"><span>f. &nbsp;10, 15 and 20</span><input class="answer" inputmode="numeric" aria-label="LCM of 10, 15 and 20"></label></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div id="result">Score: 0 / 6</div></main><script>const answers=['4','10','60','18','18','60'];function checkAnswers(){let score=0;document.querySelectorAll('.answer').forEach((e,i)=>{let ok=e.value.trim()===answers[i];e.className='answer '+(ok?'correct':'wrong');if(ok)score++});document.getElementById('result').textContent='Score: '+score+' / 6';save()}const key='math4-ch6-6e-'+location.pathname.split('/').pop();function save(){localStorage.setItem(key,JSON.stringify({values:[...document.querySelectorAll('.answer')].map(e=>e.value),selected:document.querySelector('input[name="lcm"]:checked')?.value||'',score:document.getElementById('result').textContent}))}function restore(){try{let x=JSON.parse(localStorage.getItem(key)||'{}');(x.values||[]).forEach((v,i)=>{let e=document.querySelectorAll('.answer')[i];if(e)e.value=v});if(x.selected){let e=document.querySelector('input[name="lcm"][value="'+x.selected+'"]');if(e)e.checked=true}if(x.score)document.getElementById('result').textContent=x.score}catch(e){}}function resetExercise(){document.querySelectorAll('.answer').forEach(e=>{e.value='';e.className='answer'});document.querySelectorAll('.choice').forEach(e=>e.className='choice');document.querySelectorAll('input[name="lcm"]').forEach(e=>e.checked=false);document.getElementById('result').textContent='Score: 0 / 6';localStorage.removeItem(key)}document.querySelectorAll('.answer').forEach(e=>e.addEventListener('input',()=>{e.className='answer';save()}));document.querySelectorAll('input[name="lcm"]').forEach(e=>e.addEventListener('change',()=>{document.querySelectorAll('.choice').forEach(c=>c.className='choice'+(c.querySelector('input').checked?' selected':''));save()}));restore();</script></body></html>
