<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#e4f9fd;font-family:Arial,sans-serif}
.exercise{max-width:1120px;min-height:500px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:28px 38px;display:flex;flex-direction:column}
h1{margin:0 0 25px;color:#00a3dc;font-size:25px}.content{flex:1}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;min-width:34px;font:20px Georgia}.frac span:first-child{border-bottom:1.5px solid #222;padding:0 5px 3px}.frac span:last-child{padding-top:3px}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:27px 38px}.eqrow{display:flex;align-items:center;gap:10px;font:20px Georgia}
.finput{width:58px;height:58px;border:2px solid #d83291;border-radius:10px;font-size:16px;text-align:center;padding:3px}
.markgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 38px}.markrow{display:flex;align-items:center;gap:14px;font:20px Georgia}
.mark{width:72px;height:43px;border:2px solid #d83291;border-radius:10px;background:#fff;font-size:24px;cursor:pointer}.mark.sel{background:#fff0f8}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}
.series{display:flex;flex-direction:column;gap:20px}.srow{display:flex;align-items:center;gap:12px;font:20px Georgia;flex-wrap:wrap}.boxfrac{border:2px solid #d83291;border-radius:10px;padding:4px 12px}.sinput{width:70px;height:48px;border:2px solid red;border-radius:7px;font-size:16px;text-align:center}
.controls{margin-top:auto;padding-top:28px;display:flex;justify-content:center;gap:14px}.controls button{border:0;border-radius:24px;background:#ff7d00;color:white;font-weight:bold;padding:12px 22px;cursor:pointer}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:13px}
@media(max-width:800px){.exercise{padding:22px}.eqgrid,.markgrid{grid-template-columns:1fr}.srow{gap:8px}}
</style></head><body>
<main class="exercise"><h1>Complete the series.</h1><section class="content"><div class="series"><div class="srow"><b>a.</b><span class="boxfrac"><span class="frac"><span>1</span><span>5</span></span></span><span>,</span><span class="boxfrac"><span class="frac"><span>2</span><span>10</span></span></span><span>,</span><span class="boxfrac"><span class="frac"><span>3</span><span>15</span></span></span><span>,</span><input id="a0" class="sinput" placeholder=" / "><span>,</span><input id="a1" class="sinput" placeholder=" / "><span>,</span><input id="a2" class="sinput" placeholder=" / "></div><div class="srow"><b>b.</b><span class="boxfrac"><span class="frac"><span>2</span><span>3</span></span></span><span>,</span><span class="boxfrac"><span class="frac"><span>4</span><span>6</span></span></span><span>,</span><span class="boxfrac"><span class="frac"><span>6</span><span>9</span></span></span><span>,</span><input id="a3" class="sinput" placeholder=" / "><span>,</span><input id="a4" class="sinput" placeholder=" / "><span>,</span><input id="a5" class="sinput" placeholder=" / "></div><div class="srow"><b>c.</b><span class="boxfrac"><span class="frac"><span>1</span><span>8</span></span></span><span>,</span><span class="boxfrac"><span class="frac"><span>2</span><span>16</span></span></span><span>,</span><span class="boxfrac"><span class="frac"><span>3</span><span>24</span></span></span><span>,</span><input id="a6" class="sinput" placeholder=" / "><span>,</span><input id="a7" class="sinput" placeholder=" / "><span>,</span><input id="a8" class="sinput" placeholder=" / "></div><div class="srow"><b>d.</b><span class="boxfrac"><span class="frac"><span>4</span><span>5</span></span></span><span>,</span><span class="boxfrac"><span class="frac"><span>8</span><span>10</span></span></span><span>,</span><span class="boxfrac"><span class="frac"><span>12</span><span>15</span></span></span><span>,</span><input id="a9" class="sinput" placeholder=" / "><span>,</span><input id="a10" class="sinput" placeholder=" / "><span>,</span><input id="a11" class="sinput" placeholder=" / "></div></div></section><div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div class="score" id="score">Score: 0 / 12</div></main><script>const A=['4/20', '5/25', '6/30', '8/12', '10/15', '12/18', '4/32', '5/40', '6/48', '16/20', '20/25', '24/30'];function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById('a'+i),g=e.value.replace(/\s/g,'')===a;e.classList.remove('ok','bad');e.classList.add(g?'ok':'bad');if(g)s++});score.textContent='Score: '+s+' / 12'}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});score.textContent='Score: 0 / 12'}</script></body></html>
