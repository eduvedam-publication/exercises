<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 – Chapter 1 – Fill in the blanks</title><style>*{box-sizing:border-box}body{margin:0;background:#d8f8ff;font-family:Arial,sans-serif;color:#18243c}.exercise{width:min(94vw,940px);margin:20px auto;background:white;border:3px solid #00a7d8;border-radius:23px;padding:22px 26px}h2{font-size:23px;color:#00a7dc;margin:0 0 15px}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed;font-family:Georgia,serif}th{background:#618fc5;color:white;font-size:17px}th,td{border:1.5px solid #293b87;padding:7px 8px;text-align:center}th:first-child{width:75px}th:nth-child(2){width:145px}td{font-size:17px}.answer{width:100%;min-height:37px;border:2px solid #ff515e;border-radius:3px;padding:5px 8px;font-size:16px;color:#222}.answer.ok{background:#dff9e4;border-color:#21a34b}.answer.bad{background:#ffe4e4;border-color:#e12626;animation:blink .35s 3}@keyframes blink{50%{background:#ffaaaa}}.actions{display:flex;justify-content:center;gap:12px;margin-top:22px}button{border:0;border-radius:20px;background:#ff8500;color:white;padding:10px 22px;font-weight:700;cursor:pointer}#score{text-align:center;font-weight:700;color:#0051b4;font-size:20px;margin-top:12px}@media(max-width:600px){.exercise{padding:15px 10px;margin:8px auto}h2{font-size:20px}th:first-child{width:49px}th:nth-child(2){width:88px}td,th{padding:5px 3px;font-size:14px}.answer{font-size:14px}}</style></head><body><main class="exercise"><h2>Fill in the blanks.</h2><div class="wrap"><table><thead><tr><th>S. No.</th><th>Numeral</th><th>Number Name</th></tr></thead><tbody><tr><td>a.</td><td>76534</td><td><input class="answer" data-key="a" aria-label="Number name for 76534" autocomplete="off"></td></tr><tr><td>b.</td><td>558</td><td><input class="answer" data-key="b" aria-label="Number name for 558" autocomplete="off"></td></tr><tr><td>c.</td><td>45465</td><td><input class="answer" data-key="c" aria-label="Number name for 45465" autocomplete="off"></td></tr><tr><td>d.</td><td>988622</td><td><input class="answer" data-key="d" aria-label="Number name for 988622" autocomplete="off"></td></tr></tbody></table></div><div class="actions"><button id="check">Check Answers</button><button id="reset">Reset</button></div><div id="score">Score: 0 / 4</div></main><script>const KEY='math-4-ch1-1a-fill-v1',answers={a:['seventy six thousand five hundred thirty four'],b:['five hundred fifty eight'],c:['forty five thousand four hundred sixty five'],d:['nine lakh eighty eight thousand six hundred twenty two','nine hundred eighty eight thousand six hundred twenty two']};const inputs=[...document.querySelectorAll('.answer')];function norm(s){return s.toLowerCase().replace(/\band\b/g,'').replace(/[-,]/g,' ').replace(/\s+/g,' ').trim()}function save(){localStorage.setItem(KEY,JSON.stringify(Object.fromEntries(inputs.map(e=>[e.dataset.key,e.value]))))}try{let old=JSON.parse(localStorage.getItem(KEY)||'{}');inputs.forEach(e=>{e.value=old[e.dataset.key]||''})}catch{}inputs.forEach(e=>e.addEventListener('input',()=>{e.classList.remove('ok','bad');save()}));document.getElementById('check').onclick=()=>{let n=0;inputs.forEach(e=>{let ok=answers[e.dataset.key].some(a=>norm(a)===norm(e.value));e.classList.toggle('ok',ok);e.classList.toggle('bad',!ok);if(ok)n++});document.getElementById('score').textContent=`Score: ${n} / 4`;save();if(window.parent!==window)window.parent.postMessage({exerciseType:'FILL_BLANK',response:Object.fromEntries(inputs.map(e=>[e.dataset.key,e.value]))},'*')};document.getElementById('reset').onclick=()=>{inputs.forEach(e=>{e.value='';e.classList.remove('ok','bad')});document.getElementById('score').textContent='Score: 0 / 4';localStorage.removeItem(KEY)};</script></body></html>
