<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gyandhara-4-ch2-mcq.html</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#17333b}.wrap{max-width:1000px;margin:18px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{margin:0 0 16px;color:#00a7dd;font-size:25px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:12px 15px;margin:10px 0;font-size:19px;line-height:1.8}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:7px}.opt{border:1px solid #a4ddf3;background:white;border-radius:8px;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font:inherit;font-size:18px;text-align:left}.opt.selected{background:#d2efff;border-color:#0089d4}.opt.correct,.slot.correct{background:#dcfce5!important;border-color:#22a552!important}.opt.wrong,.slot.wrong{background:#ffe0e0!important;border-color:#f33!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.slot{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:38px;border:2px dashed #ff674b;border-radius:7px;background:#fff;vertical-align:middle;cursor:pointer;padding:2px 10px}.slot.filled{border-style:solid}.bank{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#ddf7ff;padding:12px;border-radius:12px;margin-bottom:14px}.word{border:1px solid #00aee8;border-radius:8px;background:#fff;padding:8px 14px;font:inherit;font-size:18px;cursor:grab}.word.used{opacity:.35}.word.selected{outline:2px solid #008dc7;background:#bdeeff}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}.hint{text-align:center;font-size:14px;color:#47717e}.binary{display:flex;gap:12px;margin-top:8px}.binary button{border:1px solid #00b9f3;border-radius:8px;background:white;padding:6px 18px;font-size:20px;cursor:pointer}.binary button.selected{background:#c9edff}.binary button.correct{background:#dcfce5;border-color:#22a552}.binary button.wrong{background:#ffe0e0;border-color:#f33;animation:blink .6s 2}@media(max-width:650px){.wrap{margin:7px;padding:14px}h2{font-size:21px}.q{font-size:17px}.options{grid-template-columns:1fr}.opt{font-size:17px}.slot{min-width:90px}}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h2><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div></main><script>const key="gyandhara-4-ch2-mcq";let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(answers))}const data=[["भाषा की सबसे छोटी इकाई है–", ["शब्द", "वर्ण", "वाक्य"], 1], ["स्वर वर्णों की संख्या है–", ["13", "11", "9"], 1], ["संयुक्त व्यंजन वर्ण हैं–", ["2", "4", "6"], 1], ["हिंदी वर्णमाला में कुल वर्ण हैं–", ["52", "48", "54"], 0]];function render(){document.getElementById('questions').innerHTML=data.map((q,i)=>`<div class="q">(${['क','ख','ग','घ'][i]}) ${q[0]}<div class="options">${q[1].map((o,j)=>`<button class="opt ${answers[i]===j?'selected':''}" id="o${i}_${j}" onclick="choose(${i},${j})"><span>(${['अ','ब','स'][j]}) &nbsp;${o}</span><span>${answers[i]===j?'☑':'□'}</span></button>`).join('')}</div></div>`).join('')}function choose(i,j){answers[i]=j;save();render()}function check(){data.forEach((q,i)=>{if(answers[i]!==undefined)document.getElementById(`o${i}_${answers[i]}`).classList.add(answers[i]===q[2]?'correct':'wrong')})}function showAnswers(){data.forEach((q,i)=>answers[i]=q[2]);save();render();check()}function resetAll(){answers={};save();render()}render();</script></body></html>
