<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 Chapter 13 – Observe the Figure</title><style>*{box-sizing:border-box}body{margin:0;background:#d4faff;font-family:Georgia,'Times New Roman',serif;color:#16202c}.sheet{width:min(960px,calc(100% - 24px));margin:20px auto;background:white;border:3px solid #00ade7;border-radius:21px;padding:24px 27px}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:25px;color:#00a5df;margin:0 0 16px}.tag{font:13px Arial;background:#00ade7;color:white;padding:6px 16px;border-radius:6px}.workspace{display:flex;align-items:center;justify-content:space-between;gap:20px}.questions{display:grid;grid-template-columns:repeat(2,minmax(190px,1fr));gap:17px 22px;flex:1}.question{display:flex;align-items:center;gap:9px;white-space:nowrap;font-size:19px}.question input{width:135px;max-width:100%;padding:8px 10px;border:2px solid #ff5b49;border-radius:5px;font:18px Georgia;outline:none;background:#fff}.question input:focus{border-color:#00aeec}.question input.correct{border-color:#22b365;background:#e6fff0}.question input.wrong{border-color:#e53935;background:#ffe9e9;animation:blink .6s 2}@keyframes blink{50%{background:#fff}}.figure{width:225px;flex-shrink:0}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}button{border:0;border-radius:25px;background:#ff8000;color:white;padding:11px 20px;font-weight:bold;cursor:pointer}button:hover{background:#e36d00}.hint{font:13px Arial;color:#5e6b77;text-align:center;margin:12px 0 0}@media(max-width:620px){.sheet{padding:17px 14px}.workspace{flex-direction:column-reverse}.questions{width:100%;grid-template-columns:1fr 1fr;gap:13px 7px}.question{font-size:16px;gap:5px}.question input{width:95px;font-size:15px;padding:7px 5px}.figure{width:180px}h1{font-size:20px}.tag{font-size:11px;padding:5px 8px}}@media(max-width:390px){.questions{grid-template-columns:1fr}.question input{width:150px}}</style></head><body><main class="sheet"><div class="heading"><h1>1. Observe the figure and fill the blanks.</h1><span class="tag">Observation</span></div><div class="workspace"><section class="questions" id="questions"><label class="question">a. &nbsp; OA = <input aria-label="OA" data-answer="radius" autocomplete="off" placeholder=""></label><label class="question">b. &nbsp; AB = <input aria-label="AB" data-answer="diameter" autocomplete="off"></label><label class="question">c. &nbsp; OB = <input aria-label="OB" data-answer="radius" autocomplete="off"></label><label class="question">d. &nbsp; O = <input aria-label="O" data-answer="centre|center" autocomplete="off"></label></section><svg class="figure" viewBox="0 0 230 190" role="img" aria-label="Circle with A and B at opposite ends of a diameter and O at the centre"><circle cx="115" cy="92" r="72" fill="none" stroke="#fa2b7b" stroke-width="2.4"/><line x1="43" y1="92" x2="187" y2="92" stroke="#fa2b7b" stroke-width="2"/><circle cx="115" cy="92" r="3.4" fill="#00a5df"/><text x="25" y="98" font-size="20" font-family="Georgia">A</text><text x="192" y="98" font-size="20" font-family="Georgia">B</text><text x="109" y="115" font-size="20" font-family="Georgia">O</text></svg></div><div class="controls"><button type="button" id="check">Check Answers</button><button type="button" id="show">Show Answer</button><button type="button" id="reset">Reset</button></div><p class="hint" id="feedback" aria-live="polite"></p></main><script>const inputs=[...document.querySelectorAll('input[data-answer]')],key='math-4-ch13-13b-fill-v1';function save(){localStorage.setItem(key,JSON.stringify(inputs.map(i=>i.value)))}function clean(){inputs.forEach(i=>i.classList.remove('correct','wrong'));document.getElementById('feedback').textContent=''}inputs.forEach(i=>i.addEventListener('input',()=>{i.classList.remove('correct','wrong');save()}));try{let old=JSON.parse(localStorage.getItem(key)||'[]');inputs.forEach((i,n)=>i.value=old[n]||'')}catch(e){}document.getElementById('check').onclick=()=>{let right=0;inputs.forEach(i=>{let ok=i.dataset.answer.split('|').includes(i.value.trim().toLowerCase());i.classList.toggle('correct',ok);i.classList.toggle('wrong',!ok);if(ok)right++});document.getElementById('feedback').textContent=right===inputs.length?'All answers are correct!':'Review the highlighted answers.';save()};document.getElementById('show').onclick=()=>{inputs.forEach(i=>{i.value=i.dataset.answer.split('|')[0];i.classList.remove('wrong');i.classList.add('correct')});document.getElementById('feedback').textContent='Correct answers filled in.';save()};document.getElementById('reset').onclick=()=>{inputs.forEach(i=>i.value='');clean();localStorage.removeItem(key)};</script></body></html>
