<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find the LCM and HCF</title><style>
*{box-sizing:border-box}body{margin:0;background:#b9fbff;font-family:Georgia,'Times New Roman',serif;color:#172735;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px}.sheet{width:min(1050px,100%);background:white;border:3px solid #00a9f4;border-radius:20px;padding:22px 24px}h1{font:700 clamp(23px,3vw,32px) Arial,sans-serif;color:#009ff0;margin:0 0 18px}.question{background:#e0f9ff;border:1.5px solid #00a9ff;border-radius:11px;margin:9px 0;padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:clamp(16px,1.7vw,20px)}.qnum{min-width:26px}.question label{flex:0 1 auto}.question input{width:190px;max-width:100%;padding:9px;border:2px solid #ff685d;border-radius:5px;font:inherit;color:#173c4d;background:white}.question input.correct{border-color:#20a953;background:#e8fff0}.question input.wrong{border-color:#e62c38;background:#fff0f0}.feedback{font:700 14px Arial,sans-serif}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:12px 19px;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #006bff;outline-offset:2px}#score{text-align:center;color:#003bea;font:700 21px Arial,sans-serif;margin:13px 0 2px}@media(max-width:620px){.sheet{padding:16px 12px}.question{align-items:flex-start}.question label{width:calc(100% - 40px)}.question input{margin-left:35px;width:min(260px,calc(100% - 35px))}}
 .question{padding:11px 14px;align-items:center}.pair{display:flex;gap:16px 32px;align-items:center;flex-wrap:wrap;width:100%;padding-left:36px}.pair label{display:flex;align-items:center;gap:8px}.pair input{width:120px}.question>strong{font-weight:normal}@media(max-width:620px){.question{align-items:center}.pair{padding-left:0}.pair label{width:auto}.pair input{margin:0;width:110px}}@media(max-height:700px) and (min-width:800px){.sheet{padding:17px 22px}.question{margin:7px 0;padding:9px 13px}h1{margin-bottom:13px}.actions{margin-top:14px}}</style></head><body><main class="sheet"><h1>Find the LCM and HCF of the following pairs of numbers.</h1><section><div class="question"><span class="qnum">a.</span><strong>36 and 132</strong><div class="pair"><label for="l0">LCM = <input id="l0" inputmode="numeric" autocomplete="off" aria-label="LCM of 36 and 132" placeholder="Answer"></label><label for="h0">HCF = <input id="h0" inputmode="numeric" autocomplete="off" aria-label="HCF of 36 and 132" placeholder="Answer"></label></div><span class="feedback" id="f0" aria-live="polite"></span></div><div class="question"><span class="qnum">b.</span><strong>24 and 60</strong><div class="pair"><label for="l1">LCM = <input id="l1" inputmode="numeric" autocomplete="off" aria-label="LCM of 24 and 60" placeholder="Answer"></label><label for="h1">HCF = <input id="h1" inputmode="numeric" autocomplete="off" aria-label="HCF of 24 and 60" placeholder="Answer"></label></div><span class="feedback" id="f1" aria-live="polite"></span></div><div class="question"><span class="qnum">c.</span><strong>74 and 111</strong><div class="pair"><label for="l2">LCM = <input id="l2" inputmode="numeric" autocomplete="off" aria-label="LCM of 74 and 111" placeholder="Answer"></label><label for="h2">HCF = <input id="h2" inputmode="numeric" autocomplete="off" aria-label="HCF of 74 and 111" placeholder="Answer"></label></div><span class="feedback" id="f2" aria-live="polite"></span></div><div class="question"><span class="qnum">d.</span><strong>108 and 162</strong><div class="pair"><label for="l3">LCM = <input id="l3" inputmode="numeric" autocomplete="off" aria-label="LCM of 108 and 162" placeholder="Answer"></label><label for="h3">HCF = <input id="h3" inputmode="numeric" autocomplete="off" aria-label="HCF of 108 and 162" placeholder="Answer"></label></div><span class="feedback" id="f3" aria-live="polite"></span></div></section><div class="actions"><button id="submit" type="button">Submit</button><button id="show" type="button">Show Answer</button><button id="reset" type="button">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 8</p></main><script>const answers=[{"lcm": 396, "hcf": 12}, {"lcm": 120, "hcf": 12}, {"lcm": 222, "hcf": 37}, {"lcm": 324, "hcf": 54}],key='exercise:math-5-ch2-2d.html',inputs=[...document.querySelectorAll('.pair input')],score=document.getElementById('score');function norm(s){return String(s).replace(/[,s]/g,'').replace(/[०-९]/g,c=>String('०१२३४५६७८९'.indexOf(c))).replace(/^0+(?=d)/,'')}function save(){try{localStorage.setItem(key,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}function clearMarks(){inputs.forEach(x=>x.classList.remove('correct','wrong'));answers.forEach((_,i)=>{const f=document.getElementById('f'+i);f.textContent='';f.className='feedback'});score.textContent='Marks: 0 / 8'}inputs.forEach(x=>x.addEventListener('input',()=>{save();clearMarks()}));try{const old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old))old.forEach((v,i)=>{if(inputs[i]&&typeof v==='string')inputs[i].value=v})}catch(e){}document.getElementById('submit').onclick=()=>{let marks=0;answers.forEach((a,i)=>{let correct=0;for(const [kind,value] of [['lcm',a.lcm],['hcf',a.hcf]]){const x=document.getElementById((kind==='lcm'?'l':'h')+i),ok=norm(x.value)===norm(value);if(ok){marks++;correct++}x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok)}const f=document.getElementById('f'+i);f.textContent=correct===2?'✓ Correct':correct===1?'1 of 2 correct':'✗ Wrong';f.className='feedback '+(correct===2?'ok':'no')});score.textContent=`Marks: ${marks} / 8`;save();const detail={exerciseType:'FILL_BLANK',exerciseId:'math-5-ch2-2d.html',response:Object.fromEntries(answers.map((_,i)=>['question'+(i+1),{lcm:document.getElementById('l'+i).value,hcf:document.getElementById('h'+i).value}])),marks,total:8};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')};document.getElementById('show').onclick=()=>{answers.forEach((a,i)=>{document.getElementById('l'+i).value=a.lcm;document.getElementById('h'+i).value=a.hcf});save();clearMarks()};document.getElementById('reset').onclick=()=>{inputs.forEach(x=>x.value='');save();clearMarks()};</script></body></html>
