<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rewrite and Solve</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1050px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 22px;color:#00a5dc;font-size:25px}
.grid{display:grid;grid-template-columns:repeat(4,155px);justify-content:space-between;gap:22px;padding:0 15px}
.item{text-align:center}
.problem{font-family:Georgia,"Times New Roman",serif;font-size:20px;margin-bottom:6px}
.work{width:128px;height:128px;margin:auto;background:#dceefa;padding:5px 7px}
.place{height:30px;display:grid;grid-template-columns:28px 28px 28px 28px;justify-content:center;align-items:center;color:#ff4050;font-family:Georgia,serif;font-size:20px;border-bottom:1px solid #00aee8}
.place span{height:30px;display:flex;align-items:center;justify-content:center;border-right:1px solid #00aee8}
.place span:first-child{border-left:1px solid #00aee8}
.blankrow{height:30px;border-bottom:1px solid #00aee8}
.minusrow{height:27px;display:flex;align-items:center;border-bottom:1px solid #00aee8;font-family:Georgia,serif;font-size:20px;padding-left:7px}
.answer{width:116px;height:30px;margin-top:2px;border:2px solid #ff3b30;background:#fff;font-size:17px;padding:2px 5px;outline:none;text-align:left}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,155px);justify-content:space-around}}
@media(max-width:400px){.exercise{margin:0;border-radius:0;padding:14px}.grid{grid-template-columns:155px;justify-content:center}h1{font-size:21px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Rewrite in the correct places and then solve.</h1>

<div class="grid">
 <div class="item">
  <div class="problem">a. &nbsp;365 − 53</div>
  <div class="work">
   <div class="place"><span></span><span>H</span><span>T</span><span>O</span></div>
   <div class="blankrow"></div>
   <div class="minusrow">−</div>
   <input id="a0" class="answer" inputmode="numeric">
  </div>
 </div>

 <div class="item">
  <div class="problem">b. &nbsp;486 − 76</div>
  <div class="work">
   <div class="place"><span></span><span>H</span><span>T</span><span>O</span></div>
   <div class="blankrow"></div>
   <div class="minusrow">−</div>
   <input id="a1" class="answer" inputmode="numeric">
  </div>
 </div>

 <div class="item">
  <div class="problem">c. &nbsp;453 − 42</div>
  <div class="work">
   <div class="place"><span></span><span>H</span><span>T</span><span>O</span></div>
   <div class="blankrow"></div>
   <div class="minusrow">−</div>
   <input id="a2" class="answer" inputmode="numeric">
  </div>
 </div>

 <div class="item">
  <div class="problem">d. &nbsp;168 − 27</div>
  <div class="work">
   <div class="place"><span></span><span>H</span><span>T</span><span>O</span></div>
   <div class="blankrow"></div>
   <div class="minusrow">−</div>
   <input id="a3" class="answer" inputmode="numeric">
  </div>
 </div>
</div>

<div class="actions">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetExercise()">Reset</button>
</div>
<div id="result">Score: 0 / 4</div>
</main>

<script>
const answers=["312","410","411","141"];
function checkAnswers(){
 let score=0;
 answers.forEach((v,i)=>{
  const e=document.getElementById("a"+i);
  const ok=e.value.trim()===v;
  e.className="answer "+(ok?"ok":"bad");
  if(ok)score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 4`;
}
function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{e.value="";e.className="answer"});
 document.getElementById("result").textContent="Score: 0 / 4";
}
</script>
</body>
</html>
