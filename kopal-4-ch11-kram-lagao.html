<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOPAL Hindi 4 Chapter 11 क्रम में लगाइए</title><style>
*{box-sizing:border-box}body{margin:0;background:#e3f8ff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#263b44}.wrap{max-width:1000px;margin:22px auto;background:#fff;border:3px solid #00bde8;border-radius:18px;padding:24px}h2{margin:0 0 8px;color:#ff3988;font-size:25px}.meta{color:#527783;margin:0 0 18px}.q{background:#effbff;border:1px solid #8cdef4;border-radius:12px;padding:15px;margin:12px 0;font-size:18px}.q select{font:inherit;width:100%;margin-top:12px;padding:9px;border:1.5px solid #00bde8;border-radius:8px;background:#fff}.correct{background:#dcf8e5!important;border-color:#20a653!important}.wrong{background:#ffe0e0!important;border-color:#e43d3d!important}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button{border:0;border-radius:24px;padding:11px 21px;background:#ff3988;color:white;font-weight:bold;cursor:pointer;font-size:15px}#score{text-align:center;color:#087fa7;font-weight:bold;font-size:19px;margin-top:15px}@media(max-width:650px){.wrap{margin:8px;padding:14px}.q{font-size:17px}}

.sequence{list-style:none;padding:0;margin:0}.sequence li{background:#effbff;border:1px solid #8cdef4;border-radius:10px;padding:12px;margin:9px 0;display:flex;gap:10px;align-items:center}.sequence select{margin:0;width:76px;padding:8px;border:1px solid #00bde8;border-radius:7px}.note{background:#fff8df;padding:12px;border-radius:8px;color:#6b5a20}
</style></head><body><main class="wrap"><h2>नीचे लिखे कथनों को क्रम में लगाइए–</h2><p class="meta">कुल अंक: 4</p><p class="note">हर कथन के सामने 1 से 4 तक अलग क्रम संख्या चुनें। दिए गए स्रोत में सही क्रम की उत्तर-कुंजी नहीं है, इसलिए यह अभ्यास सही उत्तर का स्कोर नहीं देता।</p><ol class="sequence" id="seq"></ol><div class="actions"><button onclick="validate()">क्रम जाँचें</button><button onclick="resetAll()">Reset</button></div><div id="score">चारों कथनों को क्रम दें।</div></main><script>
const statements=["वाराणसी में कब तक रहने का विचार है?","आप नारद हों या कोई और, मुझे इससे कोई मतलब नहीं।","मेरे बच्चे के मन में यह वीणा बस गई है।","वाराणसी के हिसाब से तुम्हारा नाम कड़ौड़ी लाल होना चाहिए था।"];
function render(){document.getElementById('seq').innerHTML=statements.map((s,i)=>`<li><select id="n${i}"><option value="">क्रम</option>${[1,2,3,4].map(n=>`<option value="${n}">${n}</option>`).join('')}</select><span>${s}</span></li>`).join('')}
function validate(){let vals=statements.map((_,i)=>document.getElementById('n'+i).value);let ok=vals.every(Boolean)&&new Set(vals).size===4;document.getElementById('score').textContent=ok?'सभी कथनों को अलग-अलग क्रम संख्या दी गई है। सही कथानक-क्रम की पुष्टि पुस्तक से करें।':'कृपया सभी कथनों को 1 से 4 तक अलग-अलग क्रम संख्या दें।'}
function resetAll(){render();document.getElementById('score').textContent='चारों कथनों को क्रम दें।'}render();
</script></body></html>
