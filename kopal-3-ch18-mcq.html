<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का निशान लगाएँ–</title><style>*{box-sizing:border-box}body{margin:0;background:#d9f8ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#162b35}.exercise{width:min(900px,96vw);margin:16px auto;padding:20px 24px;background:white;border:3px solid #00a8d8;border-radius:20px;min-height:430px;display:flex;flex-direction:column}h1{color:#ff0064;font-size:25px;font-weight:600;margin:0 0 16px}.item{border:1.5px solid #00c5ec;border-radius:12px;background:#f1fbfe;margin:6px 0;padding:12px 14px;font-size:19px}.options{display:flex;flex-wrap:wrap;gap:9px;margin:9px 0 0 28px}.option{background:white;border:1.5px solid #ff0064;border-radius:9px;padding:7px 13px;cursor:pointer;font-size:17px;color:#172c34}.option.selected{background:#d9f6fc}.option.ok,.blank.ok{background:#dcf7dd;border-color:#0c9b50}.option.bad,.blank.bad{background:#ffdede;border-color:#e02c35;animation:blink .45s 3}@keyframes blink{50%{background:#ff6a6a}}.actions{display:flex;justify-content:center;gap:10px;margin-top:auto;padding-top:24px}button.action{border:0;border-radius:20px;padding:10px 19px;background:#ff8200;color:white;font-weight:bold;cursor:pointer}#score{text-align:center;font-size:18px;font-weight:bold;color:#0754af;margin:10px 0 0}.bank{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:#e4f7ff;border-radius:12px;padding:13px;margin:0 0 14px}.word{border:1.5px solid #00b5e8;background:white;padding:8px 12px;border-radius:8px;font-size:19px;cursor:grab}.word.used{opacity:.35}.blank{display:inline-flex;min-width:125px;min-height:37px;border:2px dashed #ff6b42;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;padding:3px 7px;background:white;cursor:pointer}.blank:empty:after{content:' ';white-space:pre}.hint{color:#647481;font-size:13px;margin-top:9px}@media(max-width:600px){.exercise{padding:15px;min-height:95vh}.item{font-size:17px}.options{margin-left:0}h1{font-size:22px}}</style></head><body><main class="exercise"><h1>सही विकल्प पर सही (✓) का निशान लगाएँ–</h1><div id="questions"></div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score">Score: 0 / 4</div><script>const qs=[["गाँव में किस चीज ने बच्चे का मन मोह लिया था?", ["ऊँची इमारतों ने", "हरे-भरे वातावरण ने", "शोर ने"], 1], ["बच्चे ने बाजार में किसे देखा?", ["खरगोश को", "तोते को", "कबूतर को"], 1], ["‘तोता’ शब्द का बहुवचन क्या होगा?", ["तोते", "तोतों", "तोताएँ"], 0], ["‘हरा वातावरण’ में विशेषण शब्द कौन-सा है?", ["वातावरण", "में", "हरा"], 2]],key='kopal-2-ch18-mcq';let selected=JSON.parse(localStorage.getItem(key)||'[null,null,null,null]');const labels=['(i)','(ii)','(iii)'];function save(){localStorage.setItem(key,JSON.stringify(selected))}function render(){document.getElementById('questions').innerHTML=qs.map((q,i)=>`<div class="item"><div>${['(क)','(ख)','(ग)','(घ)'][i]} ${q[0]}</div><div class="options">${q[1].map((o,j)=>`<button class="option ${selected[i]===j?'selected':''}" onclick="choose(${i},${j})">${labels[j]} ${o}</button>`).join('')}</div></div>`).join('')}function choose(i,j){selected[i]=j;save();render()}function submit(){let score=0;document.querySelectorAll('.item').forEach((row,i)=>{const buttons=row.querySelectorAll('.option');if(selected[i]===qs[i][2])score++;if(selected[i]!==null)buttons[selected[i]].classList.add(selected[i]===qs[i][2]?'ok':'bad')});document.getElementById('score').textContent=`Score: ${score} / 4`;save()}function resetAll(){selected=[null,null,null,null];save();render();document.getElementById('score').textContent='Score: 0 / 4'}render();</script></main></body></html>
