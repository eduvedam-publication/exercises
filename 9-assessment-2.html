<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}
.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}
.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:700px){body{padding:0}.ex{border-radius:0;padding:16px}}.fills{display:grid;gap:18px}.fill{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font:20px Georgia,"Times New Roman",serif}.fill input{width:105px;height:40px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:5px 8px;outline:none}</style></head><body><main class="ex"><h1>Fill in the blanks.</h1><div class="fills"><div class="fill"><span>a. One rupee = </span><input id="a0" inputmode="numeric"><span> p</span></div><div class="fill"><span>b. Three twenty-paise coins = </span><input id="a1" inputmode="numeric"><span> paise</span></div><div class="fill"><span>c. Four fifty-paise coins = ₹ </span><input id="a2" inputmode="numeric"><span></span></div><div class="fill"><span>d. Six ten-paise coins = </span><input id="a3" inputmode="numeric"><span> paise</span></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div></main><script>const ans=["100","60","200","60"];function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=e.value.trim()===a;e.className=ok?"ok":"bad";if(ok)s++});score.textContent=`Score: ${s} / 4`}function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.className=""});score.textContent="Score: 0 / 4"}</script></body></html>
