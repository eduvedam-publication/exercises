<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match number names</title><style>*{box-sizing:border-box}body{margin:0;background:#b9fbff;font-family:Georgia,serif;color:#172735;padding:16px}.sheet{width:min(1120px,100%);margin:auto;background:white;border:3px solid #00a9f4;border-radius:20px;padding:24px}h1{font:700 clamp(22px,3vw,29px) Arial;color:#009ff0;margin:0 0 20px;line-height:1.4}.viewport{overflow-x:auto;padding:2px}.board{position:relative;margin:0 auto 15px;max-width:100%}.board img{display:block;width:100%;height:auto}.answer{position:absolute;box-sizing:border-box;background:white;border:1.5px solid #ff685d;border-radius:0;padding:0 2px;text-align:center;color:#17333b;font-family:Georgia;line-height:1}.answer.correct{border-color:#20a953;background:#e8fff0}.answer.wrong{border-color:#e62c38;background:#fff0f0}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:12px 19px;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #006bff;outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:620px){.sheet{padding:16px 12px}body{padding:8px}}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.question{background:#eafaff;border:1px solid #00b9ed;border-radius:11px;padding:18px;font-size:24px;line-height:1.6}.question label{display:block;margin-bottom:10px}.question input{width:100%;min-height:48px;border:2px solid #ff685d;border-radius:5px;padding:8px 12px;font:23px Georgia;color:#17333b;background:white}.question input.correct{background:#e8fff0;border-color:#20a953}.question input.wrong{background:#fff0f0;border-color:#e62c38}.example{background:#f0fbea;border:1px solid #a7d998;border-radius:10px;padding:16px 18px;font-size:24px;margin:0 0 18px}.short label{display:inline;margin:0 8px 0 0}.short input{width:90px;max-width:100%;text-align:center}.example-tag{font:14px Arial;color:#426b38;display:block;margin-bottom:6px}@media(max-width:650px){.questions{grid-template-columns:1fr}.question{font-size:22px;padding:15px}.example{font-size:21px}}.match-viewport{overflow-x:auto;padding:2px}.match-board{position:relative;width:820px;max-width:100%;min-width:560px;aspect-ratio:4/3;margin:auto}.match-board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.item{position:absolute;border:2px solid #00a9f4;border-radius:8px;background:white;padding:3px;color:#17333b;cursor:pointer}.left{left:0;width:66%;height:14%}.left img{display:block;width:100%;height:100%;object-fit:contain}.right{left:89%;width:10%;height:9%;font:26px Georgia}.item.selected{outline:3px solid #ff9600;outline-offset:2px}.item.correct{border-color:#20a953;background:#e8fff0}.item.wrong{border-color:#e62c38;background:#fff0f0}.match-board{width:760px;aspect-ratio:1/1}.left{width:46%;height:18%}.right{left:75%;width:24%;height:7%;font-size:25px}.match-board{width:850px;aspect-ratio:4/3}.left{left:0;width:66%;height:23%}.right{left:89%;width:10%;height:10%;font-size:26px}.match-board{width:800px;aspect-ratio:4/3}.left{left:0;width:46%;height:12%;font:24px Georgia;text-align:left;padding:12px}.right{left:80%;width:18%;height:12%;font:26px Georgia}</style></head><body><main class="sheet"><h1>Match the following number names.</h1><section class="match-viewport"><div class="match-board"><svg viewBox="0 0 100 100" preserveAspectRatio="none" id="lines" aria-hidden="true"></svg><button type="button" class="item left" id="l0" style="top:4%" onclick="pickLeft(0)" aria-pressed="false">a. &nbsp; Fifty-eight</button><button type="button" class="item left" id="l1" style="top:23%" onclick="pickLeft(1)" aria-pressed="false">b. &nbsp; Seventy-two</button><button type="button" class="item left" id="l2" style="top:42%" onclick="pickLeft(2)" aria-pressed="false">c. &nbsp; Sixty-four</button><button type="button" class="item left" id="l3" style="top:61%" onclick="pickLeft(3)" aria-pressed="false">d. &nbsp; Eighty</button><button type="button" class="item left" id="l4" style="top:80%" onclick="pickLeft(4)" aria-pressed="false">e. &nbsp; Ninety-five</button><button type="button" class="item right" id="r0" style="top:4%" onclick="pickRight(0)">72</button><button type="button" class="item right" id="r1" style="top:23%" onclick="pickRight(1)">95</button><button type="button" class="item right" id="r2" style="top:42%" onclick="pickRight(2)">80</button><button type="button" class="item right" id="r3" style="top:61%" onclick="pickRight(3)">64</button><button type="button" class="item right" id="r4" style="top:80%" onclick="pickRight(4)">58</button></div></section><div class="actions"><button type="button" id="submit" onclick="check()">Submit</button><button type="button" id="show" onclick="showAnswers()">Show Answer</button><button type="button" id="reset" onclick="resetAll()">Reset</button></div></main><script>const target=[4,0,3,2,1],key='exercise:math-1-ch6-6a.html';let matches={},active=null,evaluated=false;try{const saved=JSON.parse(localStorage.getItem(key)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved)){const used=new Set();for(let i=0;i<5;i++){const v=saved[i];if(Number.isInteger(v)&&v>=0&&v<5&&!used.has(v)){matches[i]=v;used.add(v)}}}}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(matches))}catch(e){}}function render(){let lines='';for(let i=0;i<5;i++){const b=document.getElementById('l'+i);b.classList.remove('selected','correct','wrong');b.setAttribute('aria-pressed',active===i?'true':'false');if(active===i)b.classList.add('selected');if(evaluated)b.classList.add(matches[i]===target[i]?'correct':'wrong');const j=matches[i];if(j!==undefined){const color=evaluated?(j===target[i]?'#20a953':'#e62c38'):'#008ddd';lines+='<line x1="46" y1="'+(10+i*19)+'" x2="80" y2="'+(10+j*19)+'" stroke="'+color+'" stroke-width="0.45"/>'}}document.getElementById('lines').innerHTML=lines}function pickLeft(i){active=active===i?null:i;evaluated=false;render()}function pickRight(j){if(active!==null){Object.keys(matches).forEach(i=>{if(matches[i]===j)delete matches[i]});matches[active]=j;active=null}else{Object.keys(matches).forEach(i=>{if(matches[i]===j)delete matches[i]})}evaluated=false;save();render()}function check(){evaluated=true;active=null;render();const detail={exerciseType:'MATCHING',exerciseId:'math-1-ch6-6a.html',response:{...matches}};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')}function showAnswers(){matches=Object.fromEntries(target.map((v,i)=>[i,v]));active=null;evaluated=false;save();render()}function resetAll(){matches={};active=null;evaluated=false;save();render()}render();</script></body></html>
