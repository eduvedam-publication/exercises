<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-2-ch12-drag-drop.html</title><style>*{box-sizing:border-box}body{margin:0;background:#ddf9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#173045}.exercise{max-width:850px;margin:16px auto;background:white;border:3px solid #04a9d6;border-radius:22px;padding:20px 24px;min-height:350px;display:flex;flex-direction:column}h1{color:#ff0066;font-size:23px;margin:0 0 15px;font-weight:600}.q{border:1.5px solid #00c9e8;background:#f1fbfe;border-radius:13px;padding:11px 14px;margin:7px 0;font-size:18px}.opts{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}.opt{border:1.5px solid #ff0071;border-radius:9px;background:white;padding:7px 11px;font-size:16px;cursor:pointer;color:#222}.opt.selected{background:#d9efff;border-color:#0084d8}.opt.ok,.drop.ok{background:#d8f8df;border-color:#13a05c}.opt.bad,.drop.bad{background:#ffe4e4;border-color:#ed3333;animation:blink .45s 3}@keyframes blink{50%{background:#ff5c5c;color:white}}.actions{display:flex;justify-content:center;gap:9px;margin-top:auto;padding-top:25px}button{border:1.5px solid #ff0071;border-radius:9px;background:#fff;padding:8px 16px;cursor:pointer;font-size:15px}#result{text-align:center;color:#0074bd;font-weight:bold;margin:12px 0 0}.bank{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;padding:13px;background:#e3f9ff;border-radius:12px;margin-bottom:14px}.word{border:1.5px solid #00a9e0;background:#fff;border-radius:8px;padding:7px 13px;cursor:grab;font-size:18px}.drop{display:inline-flex;min-width:120px;min-height:35px;border:2px dashed #ff6b52;border-radius:6px;align-items:center;justify-content:center;padding:3px 9px;vertical-align:middle;cursor:pointer}.entry{width:100%;border:1.5px solid #ff745c;border-radius:7px;padding:9px;font-size:18px;margin-top:7px}.small{font-size:14px;color:#456}.matching{display:grid;grid-template-columns:1fr 1fr;gap:10px 25px;position:relative}.matchitem{min-height:88px;display:flex;align-items:center;gap:10px;border:1.5px solid #00c9e8;background:#f1fbfe;border-radius:10px;padding:10px;cursor:pointer;position:relative;z-index:1}.matchitem.active{border-color:#f06;background:#ffeaf2}.matchitem.linked{background:#e0fae5}.matchitem .dot{width:14px;height:14px;border:2px solid #f06;border-radius:50%;flex-shrink:0}.matchcanvas{position:absolute;inset:0;pointer-events:none;z-index:2;width:100%;height:100%}@media(max-width:650px){.exercise{margin:0;border-radius:0;padding:14px}.q{font-size:16px}.matchitem{font-size:14px;min-height:115px}.matching{gap:7px}}</style></head><body><main class="exercise"><h1>पर्यायवाची शब्द लिखिए–</h1><div class="bank"><button class="word" draggable="true" data-word="चंद्रमा" ondragstart="drag(event)" onclick="pick('चंद्रमा')">चंद्रमा</button><button class="word" draggable="true" data-word="पवन" ondragstart="drag(event)" onclick="pick('पवन')">पवन</button><button class="word" draggable="true" data-word="निशा" ondragstart="drag(event)" onclick="pick('निशा')">निशा</button></div><div class="q">(क) चाँद – <span class="drop" data-i="0" ondragover="event.preventDefault()" ondrop="drop(event,0)" onclick="place(0)"></span></div><div class="q">(ख) हवा – <span class="drop" data-i="1" ondragover="event.preventDefault()" ondrop="drop(event,1)" onclick="place(1)"></span></div><div class="q">(ग) रात – <span class="drop" data-i="2" ondragover="event.preventDefault()" ondrop="drop(event,2)" onclick="place(2)"></span></div><div class="actions"><button onclick="submitExercise()">Submit</button><button onclick="resetExercise()">Reset</button></div><div id="result">Score: 0 / 3</div></main><script>const key='kopal-2-ch12-synonyms';const correct=['चंद्रमा','पवन','निशा'];let state=JSON.parse(localStorage.getItem(key)||'{}'),picked=null;function drag(e){e.dataTransfer.setData('text/plain',e.target.dataset.word)}function pick(w){picked=w;document.querySelectorAll('.word').forEach(x=>x.style.background=x.dataset.word===w?'#cef5ff':'white')}function drop(e,i){e.preventDefault();set(i,e.dataTransfer.getData('text/plain'))}function place(i){if(picked)set(i,picked);else if(state[i])set(i,'')}function set(i,w){state[i]=w;localStorage.setItem(key,JSON.stringify(state));render()}function render(){document.querySelectorAll('.drop').forEach(e=>e.textContent=state[e.dataset.i]||'')}function submitExercise(){let n=0;document.querySelectorAll('.drop').forEach((e,i)=>{let ok=state[i]===correct[i];e.classList.remove('ok','bad');if(state[i])e.classList.add(ok?'ok':'bad');if(ok)n++});document.getElementById('result').textContent=`Score: ${n} / 3`}function resetExercise(){state={};picked=null;localStorage.removeItem(key);document.querySelectorAll('.drop').forEach(e=>e.classList.remove('ok','bad'));render();document.getElementById('result').textContent='Score: 0 / 3'}render();</script></body></html>
