<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#e8faff;font-family:Arial,sans-serif}.ex{max-width:1100px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:26px;padding:28px}h1{color:#00a5dc;font-size:24px;margin:0 0 22px}.actions{text-align:center;margin-top:28px}.actions button{border:0;border-radius:22px;padding:11px 20px;margin:5px;background:#ff8200;color:#fff;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:21px;font-weight:bold;margin-top:12px}.ans{border:2px solid #ff3b30;height:36px;font-size:17px;padding:4px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:700px){body{padding:0}.ex{padding:15px;border-radius:0}}.mathgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 42px}.problem{display:flex;gap:8px;align-items:flex-start;font:19px Georgia,serif}.card{background:#dff3dc;padding:8px;width:205px}.cols{display:grid;text-align:center}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.head{color:#ff1680;border-bottom:1px solid #63d5ef;padding:5px}.row{padding:7px;border-bottom:1px solid #63d5ef;position:relative;min-height:35px}.minus:before{content:"−";position:absolute;left:-2px}.card .ans{width:100%;margin-top:4px}@media(max-width:800px){.mathgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.mathgrid{grid-template-columns:1fr}}</style></head><body><main class="ex"><h1>Subtract the following:</h1><div class="mathgrid"><div class="problem"><span>a.</span><div class="card"><div class="cols c3 head"><span>H</span><span>T</span><span>O</span></div><div class="cols c3 row ><span>9</span><span>8</span><span>2</span></div><div class="cols c3 row minus><span>6</span><span>6</span><span>1</span></div><input class="ans" id="a0" inputmode="numeric"></div></div><div class="problem"><span>b.</span><div class="card"><div class="cols c3 head"><span>H</span><span>T</span><span>O</span></div><div class="cols c3 row ><span>6</span><span>7</span><span>4</span></div><div class="cols c3 row minus><span>1</span><span>3</span><span>1</span></div><input class="ans" id="a1" inputmode="numeric"></div></div><div class="problem"><span>c.</span><div class="card"><div class="cols c3 head"><span>H</span><span>T</span><span>O</span></div><div class="cols c3 row ><span>4</span><span>6</span><span>7</span></div><div class="cols c3 row minus><span>3</span><span>5</span><span>5</span></div><input class="ans" id="a2" inputmode="numeric"></div></div><div class="problem"><span>d.</span><div class="card"><div class="cols c4 head"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="cols c4 row ><span>7</span><span>9</span><span>8</span><span>4</span></div><div class="cols c4 row minus><span>5</span><span>7</span><span>6</span><span>2</span></div><input class="ans" id="a3" inputmode="numeric"></div></div><div class="problem"><span>e.</span><div class="card"><div class="cols c4 head"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="cols c4 row ><span>8</span><span>2</span><span>1</span><span>9</span></div><div class="cols c4 row minus><span>7</span><span>0</span><span>0</span><span>7</span></div><input class="ans" id="a4" inputmode="numeric"></div></div><div class="problem"><span>f.</span><div class="card"><div class="cols c4 head"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="cols c4 row ><span>9</span><span>0</span><span>4</span><span>8</span></div><div class="cols c4 row minus><span>8</span><span>0</span><span>3</span><span>6</span></div><input class="ans" id="a5" inputmode="numeric"></div></div></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 6</div></main><script>const ans=['321', '543', '112', '2222', '1212', '1012'];function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById('a'+i),ok=e.value.trim()===a;e.className='ans '+(ok?'ok':'bad');if(ok)s++});score.textContent=`Score: ${s} / 6`}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.className='ans'});score.textContent='Score: 0 / 6'}</script></body></html>
