<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biggest to Smallest</title><style>
*{box-sizing:border-box}body{margin:0;background:#b9fbff;font-family:Georgia,'Times New Roman',serif;color:#172735;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px}.sheet{width:min(1050px,100%);background:white;border:3px solid #00a9f4;border-radius:20px;padding:22px 24px}h1{font:700 clamp(23px,3vw,32px) Arial,sans-serif;color:#009ff0;margin:0 0 18px}.question{background:#e0f9ff;border:1.5px solid #00a9ff;border-radius:11px;margin:9px 0;padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:clamp(16px,1.7vw,20px)}.qnum{min-width:26px}.question label{flex:0 1 auto}.question input{width:190px;max-width:100%;padding:9px;border:2px solid #ff685d;border-radius:5px;font:inherit;color:#173c4d;background:white}.question input.correct{border-color:#20a953;background:#e8fff0}.question input.wrong{border-color:#e62c38;background:#fff0f0}.feedback{font:700 14px Arial,sans-serif}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:12px 19px;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #006bff;outline-offset:2px}@media(max-width:620px){.sheet{padding:16px 12px}.question{align-items:flex-start}.question label{width:calc(100% - 40px)}.question input{margin-left:35px;width:min(260px,calc(100% - 35px))}}

.instruction{font-size:21px;line-height:1.5;margin-bottom:22px}.rocket-row{display:flex;align-items:center;gap:12px;margin:20px 0;flex-wrap:wrap}.rocket{display:flex;align-items:center;position:relative;background:#ed2424;border-radius:0 45% 45% 0;padding:8px 24px 8px 8px;margin:0 30px;gap:5px;max-width:calc(100% - 60px)}.rocket:before{content:'';position:absolute;right:100%;border-top:22px solid transparent;border-bottom:22px solid transparent;border-right:30px solid #343434}.rocket:after{content:'';position:absolute;left:100%;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:28px solid #ff9c00}.rocket input,.rocket .fixed{font:inherit;font-size:clamp(16px,3vw,24px);text-align:center;width:clamp(58px,17vw,155px);min-width:0;padding:8px 2px;border:2px solid #ff685d;border-radius:3px;background:white}.rocket .given{background:#89cf83;border-color:#4ea24b}.rocket input.correct,.leaf input.correct{background:#e8fff0;border-color:#20a953}.rocket input.wrong,.leaf input.wrong{background:#fff0f0;border-color:#e62c38}.example{font:14px Arial;color:#52606d}.plants{display:grid;grid-template-columns:1fr 1fr;gap:30px;max-width:650px;margin:auto}.plant{position:relative;display:flex;flex-direction:column;gap:10px;padding:10px 0}.plant:before{content:'';position:absolute;left:50%;height:100%;width:6px;background:#4e8c44;border-radius:100%;transform:rotate(-3deg)}.leaf-pair{display:flex;position:relative;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}.leaf{width:80px;min-height:54px;display:flex;justify-content:center;align-items:center;background:#d9eec9;border:2px solid #80bc76;border-radius:2px 35px 2px 35px;font-size:25px}.leaf.answer{border-radius:35px 2px 35px 2px}.leaf input{width:58px;max-width:85%;padding:4px;border:2px solid #ff685d;border-radius:4px;font:inherit;text-align:center;background:white}.leaf-pair .feedback{width:100%;text-align:center;min-height:16px;font-size:12px}.feedback{min-height:17px}@media(max-width:500px){.sheet{padding:16px 10px}.plants{gap:10px}.leaf{width:60px;min-height:48px}.leaf input{width:45px}.leaf-pair{gap:4px}.rocket-row{gap:4px}.rocket{margin:0 24px;padding-right:14px}.instruction{font-size:18px}}

.compare-row{display:grid;grid-template-columns:24px minmax(0,1fr) 64px minmax(0,1fr);gap:14px;align-items:center;margin:16px 0}.object-box{border:1.5px solid #ff685d;border-radius:12px;min-width:0;background:white;display:flex;justify-content:center;padding:8px}.object-box img{width:100%;max-width:230px;height:auto;object-fit:contain}.compare-row select,.example-symbol{border:2px solid #ff685d;background:white;border-radius:5px;text-align:center;font:26px Georgia;padding:8px 0;width:64px;min-height:48px}.compare-row .feedback{grid-column:2 / 5}.compare-row select.correct{border-color:#20a953;background:#e8fff0}.compare-row select.wrong{border-color:#e62c38;background:#fff0f0}.order-card{background:#e0f9ff;border:1.5px solid #00a9ff;border-radius:11px;margin:16px 0;padding:20px}.number-list{display:flex;gap:16px;flex-wrap:wrap;font-size:26px;margin:10px 0 20px}.order-inputs{display:flex;gap:12px;flex-wrap:wrap}.order-inputs input{width:75px;min-height:50px;border:2px solid #ff685d;border-radius:5px;text-align:center;font:25px Georgia}.order-card .feedback{display:inline-block;margin:12px 8px 0 0}.flowers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}.flower-card{text-align:center;background:#f5fcff;border:1px solid #bde7f3;border-radius:12px;padding:12px}.flower{width:220px;height:220px;max-width:100%;margin:auto;position:relative;font-size:25px}.petal{position:absolute;left:calc(50% - 32px);top:calc(50% - 32px);width:64px;height:64px;border-radius:50%;background:var(--petal);display:flex;justify-content:center;align-items:center;transform:rotate(var(--angle)) translateY(-65px) rotate(calc(-1 * var(--angle)))}.flower input{position:absolute;left:calc(50% - 30px);top:calc(50% - 25px);width:60px;height:50px;border:2px solid #ff685d;border-radius:5px;background:#fff;text-align:center;font:25px Georgia}.flower input.correct,.order-inputs input.correct{background:#e8fff0;border-color:#20a953}.flower input.wrong,.order-inputs input.wrong{background:#fff0f0;border-color:#e62c38}@media(max-width:500px){.compare-row{grid-template-columns:18px minmax(0,1fr) 48px minmax(0,1fr);gap:6px}.compare-row select,.example-symbol{width:48px}.object-box{padding:3px}.flowers{grid-template-columns:1fr}.order-inputs{gap:8px}.order-inputs input{width:58px}}
.simple-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.simple-card{background:#eafaff;border:1px solid #00b9ed;border-radius:11px;padding:16px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center;align-items:center}.three input,.next-pair input,.order-new input{width:100%;min-width:0;border:2px solid #ff685d;border-radius:5px;background:white;padding:10px 4px;font:22px Georgia;text-align:center}.three .given{padding:10px 4px;background:#d1efca;border-radius:6px;font-size:23px}.three .hint{font:14px Arial;color:#52606d}.three .feedback{font-size:12px}.next-pair{display:grid;grid-template-columns:1fr 30px 1fr;gap:10px;align-items:center;text-align:center;font-size:26px}.next-pair .feedback{grid-column:1/4}.order-new{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.source-numbers{font-size:26px;word-spacing:20px;margin-bottom:20px}.new-input.correct{background:#e8fff0;border-color:#20a953}.new-input.wrong{background:#fff0f0;border-color:#e62c38}h1{font-size:clamp(22px,3vw,29px);line-height:1.4}body{align-items:flex-start}.sheet{margin:14px 0}@media(max-width:560px){.simple-grid{grid-template-columns:1fr}.three{gap:6px}.three input{font-size:18px}.order-new{gap:7px}.order-new input{font-size:21px}}.picture-viewport{overflow-x:auto;margin:20px 0 12px;padding:2px}.picture-board{position:relative;margin:auto;isolation:isolate}.source-picture{display:block;width:100%;height:auto}.picture-answer{position:absolute;z-index:1;box-sizing:border-box;background:#fff!important;border:1.5px solid #ff685d!important;border-radius:0!important;min-width:0!important;margin:0!important;padding:0 2px!important;text-align:left;font-family:Georgia,serif!important;color:#17333b!important;line-height:1!important;box-shadow:none;appearance:none}.picture-answer.correct{border-color:#20a953!important;background:#e8fff0!important}.picture-answer.wrong{border-color:#e62c38!important;background:#fff0f0!important}.
