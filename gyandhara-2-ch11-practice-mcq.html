<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का चिह्न लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf8ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#172b3a}.exercise{width:min(92vw,850px);margin:18px auto;background:white;border:4px solid #05a9d4;border-radius:23px;padding:22px 26px;min-height:440px;display:flex;flex-direction:column}h2{font-size:24px;color:#00a8df;margin:0 0 20px}.items{flex:1}.item{background:#effbff;border:2px solid #00c7ed;border-radius:14px;padding:13px 16px;margin-bottom:11px;font-size:19px}.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.option,.word{background:white;border:2px solid #ff4080;border-radius:9px;padding:7px 13px;font-size:17px;cursor:pointer;color:#222}.option.selected{background:#d3f8e2;border-color:#06a88a}.option.good,.slot.good{background:#d9f7dc;border-color:green}.option.bad,.slot.bad{background:#ffe1e1;border-color:red}.slot{display:inline-flex;vertical-align:middle;min-width:105px;min-height:34px;border:2px dashed #ff5a4c;border-radius:5px;align-items:center;justify-content:center;padding:3px 8px;cursor:pointer;background:#fff;font-size:17px}.wordbank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px;margin-bottom:15px;background:#e1f8ff;border-radius:12px}.word.used{opacity:.35}.actions{display:flex;gap:10px;justify-content:center;margin-top:18px}button{background:#ff8500;border:0;color:white;border-radius:20px;padding:10px 18px;font-weight:bold;cursor:pointer}#result{text-align:center;color:#0061bb;font-weight:bold;font-size:20px;margin-top:10px}@media(max-width:600px){.exercise{width:100%;margin:0;padding:15px;border-radius:0}.item{font-size:17px}.opts{gap:5px}.option{font-size:15px;padding:7px}h2{font-size:21px}}</style></head><body><main class="exercise"><h2>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h2><div id="items" class="items"></div><div class="actions"><button onclick="checkAnswers()">Submit</button><button onclick="resetExercise()">Reset</button></div><div id="result">Score: 0 / 4</div></main><script>const TYPE="mcq";const items=[["बहुत बोलने वाले को कहते हैं–", ["आज्ञाकारी", "अल्पभाषी", "वाचाल"]], ["खेती करने वाले को कहते हैं–", ["माली", "किसान", "परिश्रमी"]], ["पढ़ाने का काम करने वाली होती हैं–", ["शिक्षिका", "चिकित्सक", "शिक्षक"]], ["कपड़े सिलने का काम करता है–", ["मोची", "दरजी", "धोबी"]]];const answers=[2, 1, 0, 1];const key='gyandhara-2-ch11-practice-'+TYPE;let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(state))}function resetExercise(){state={};save();render();document.getElementById('result').textContent='Score: 0 / '+answers.length}function render(){document.getElementById('items').innerHTML=items.map((q,i)=>`<div class="item">${'('+'कखगघ'[i]+')'} ${q[0]}<div class="opts">${q[1].map((o,j)=>`<button type="button" class="option ${state[i]===j?'selected':''}" onclick="choose(${i},${j})">${['(अ)','(ब)','(स)'][j]} ${o}</button>`).join('')}</div></div>`).join('')}function choose(i,j){state[i]=j;save();render()}function checkAnswers(){let n=0;answers.forEach((a,i)=>{if(state[i]===a)n++});document.getElementById('result').textContent=`Score: ${n} / ${answers.length}`}render();</script></body></html>
