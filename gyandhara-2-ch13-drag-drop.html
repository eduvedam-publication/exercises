<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gyandhara 2 Chapter 13 - Drag Drop</title><style>*{box-sizing:border-box}body{margin:0;background:#dcfaff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#152c3a}.wrap{max-width:900px;margin:16px auto;background:white;border:3px solid #06a9d7;border-radius:22px;padding:22px 26px;min-height:340px}h2{font-size:23px;color:#00a8e0;margin:0 0 20px}.q{background:#effbff;border:1.5px solid #00c9ef;border-radius:13px;padding:13px 16px;margin:12px 0;font-size:20px;line-height:2.1}.blank{min-width:125px;width:150px;display:inline-block;vertical-align:middle;border:2px dashed #ff654b;border-radius:7px;padding:4px 7px;min-height:38px;background:white;text-align:center;color:#123}.blank:empty:before{content:'________';color:#9daab0}.wordbank{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;background:#e2f8ff;padding:12px;border-radius:12px;margin:10px 0 18px}.word{font-size:19px;border:1.5px solid #00a9e7;border-radius:8px;padding:6px 14px;background:white;cursor:grab}.word.selected{background:#b6f1db}.actions{display:flex;gap:12px;justify-content:center;margin-top:26px}button.action{background:#ff8700;color:white;border:0;border-radius:20px;padding:10px 18px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0652bb;font-size:19px;font-weight:bold;margin:12px}.line{width:100%;font:19px 'Noto Sans Devanagari',Arial,sans-serif;padding:8px;border:1px solid #ff795e;border-radius:6px;min-height:42px}.note{color:#51646d;text-align:center;font-size:14px}@media(max-width:600px){.wrap{margin:5px;padding:15px;border-radius:15px}.q{font-size:17px}h2{font-size:20px}.blank{width:125px}}</style></head><body><main class="wrap"><h2>रिक्त स्थान पूर्ति कीजिए–</h2><div class="wordbank" id="bank"></div><div class="q">(क) सप्ताह में <span class="blank" data-i="0"></span> दिन होते हैं।</div><div class="q">(ख) मंगलवार के बाद <span class="blank" data-i="1"></span> आता है।</div><div class="q">(ग) छुट्टी वाला दिन <span class="blank" data-i="2"></span> होता है।</div><div class="q">(घ) एक वर्ष में <span class="blank" data-i="3"></span> महीने होते हैं।</div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score">Score: 0 / 4</div></main><script>function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}const key='gyandhara-2-ch13-drag-drop',answers=['सात','बुधवार','रविवार','बारह'];let values=load(key)||[null,null,null,null],selected=null;function render(){document.querySelectorAll('.blank').forEach((e,i)=>{e.textContent=values[i]||'';e.style.borderColor=values[i]?'#00a9e7':'#ff654b'});document.getElementById('bank').innerHTML='';answers.forEach(w=>{if(values.includes(w))return;let b=document.createElement('button');b.className='word'+(selected===w?' selected':'');b.textContent=w;b.draggable=true;b.onclick=()=>{selected=w;render()};b.ondragstart=e=>{selected=w;e.dataTransfer.setData('text/plain',w)};document.getElementById('bank').appendChild(b)})}document.querySelectorAll('.blank').forEach((e,i)=>{e.onclick=()=>{if(selected){let old=values[i];values=values.map((v,j)=>j!==i&&v===selected?null:v);values[i]=selected;selected=old;save(key,values);render()}else if(values[i]){values[i]=null;save(key,values);render()}};e.ondragover=ev=>ev.preventDefault();e.ondrop=ev=>{ev.preventDefault();selected=ev.dataTransfer.getData('text/plain');e.click()}});function submit(){let n=answers.filter((a,i)=>values[i]===a).length;document.getElementById('score').textContent=`Score: ${n} / 4`;save(key,values)}function resetAll(){values=[null,null,null,null];selected=null;save(key,values);document.getElementById('score').textContent='Score: 0 / 4';render()}render();</script></body></html>
