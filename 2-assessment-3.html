<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 Assessment 3</title><style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}
.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}
.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}
.mathbox{width:150px;background:#dff1fb;padding:10px 8px 8px}
.place-grid,.num-grid{display:grid;grid-template-columns:28px 28px 28px;justify-content:end;text-align:center;font-family:Georgia,"Times New Roman",serif}
.place-grid{color:#ff4050;font-size:20px;margin-bottom:10px}
.num-grid{font-size:21px;line-height:1.45}
.math-line{border-top:2px solid #05a9df;margin:2px 0 5px}
.mathbox input{width:100%;height:38px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:4px;outline:none}
@media(max-width:700px){body{padding:0}.exercise{border-radius:0;padding:16px}}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 75px}
.problem{display:flex;align-items:flex-start;gap:12px}.label{font:20px Georgia,serif;margin-top:8px}
.addrow .plus{text-align:left} 
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:22px}}
</style></head><body><main class="exercise"><h1>Find the sum of the following:</h1><div class="grid"><div class="problem"><span class="label">a.</span><div class="mathbox">
<div class="place-grid"><span></span><span>T</span><span>O</span></div>
<div class="num-grid"><span></span><span>2</span><span>7</span></div>
<div class="num-grid addrow"><span class="plus">+</span><span>6</span><span>4</span></div>
<div class="math-line"></div><input id="a0" inputmode="numeric"></div></div><div class="problem"><span class="label">b.</span><div class="mathbox">
<div class="place-grid"><span>H</span><span>T</span><span>O</span></div>
<div class="num-grid"><span></span><span>8</span><span>4</span></div>
<div class="num-grid addrow"><span class="plus">+</span><span>3</span><span>6</span></div>
<div class="math-line"></div><input id="a1" inputmode="numeric"></div></div><div class="problem"><span class="label">c.</span><div class="mathbox">
<div class="place-grid"><span>H</span><span>T</span><span>O</span></div>
<div class="num-grid"><span></span><span>9</span><span>4</span></div>
<div class="num-grid addrow"><span class="plus">+</span><span>2</span><span>9</span></div>
<div class="math-line"></div><input id="a2" inputmode="numeric"></div></div><div class="problem"><span class="label">d.</span><div class="mathbox">
<div class="place-grid"><span>H</span><span>T</span><span>O</span></div>
<div class="num-grid"><span>2</span><span>1</span><span>3</span></div>
<div class="num-grid addrow"><span class="plus">+</span><span>4</span><span>2</span></div>
<div class="math-line"></div><input id="a3" inputmode="numeric"></div></div><div class="problem"><span class="label">e.</span><div class="mathbox">
<div class="place-grid"><span>H</span><span>T</span><span>O</span></div>
<div class="num-grid"><span>3</span><span>6</span><span>4</span></div>
<div class="num-grid addrow"><span class="plus">+</span><span>2</span><span>2</span></div>
<div class="math-line"></div><input id="a4" inputmode="numeric"></div></div><div class="problem"><span class="label">f.</span><div class="mathbox">
<div class="place-grid"><span>H</span><span>T</span><span>O</span></div>
<div class="num-grid"><span>1</span><span>0</span><span>2</span></div>
<div class="num-grid addrow"><span class="plus">+</span><span>4</span><span>0</span></div>
<div class="math-line"></div><input id="a5" inputmode="numeric"></div></div></div>
<div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div class="score" id="score">Score: 0 / 6</div>
<script>
const ans=["91","120","123","255","486","442"];
function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=e.value.trim()===a;e.className=ok?"ok":"bad";if(ok)s++});score.textContent=`Score: ${s} / 6`}
function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.className=""});score.textContent="Score: 0 / 6"}
</script></main></body></html>
