<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-2-ch3-tense</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf8ff;font-family:"Noto Sans Devanagari","Mangal",sans-serif;color:#24313a}.sheet{width:min(920px,96vw);margin:12px auto;background:#fff;border:3px solid #08a9d2;border-radius:22px;padding:18px 24px;min-height:min(560px,94vh);display:flex;flex-direction:column}h1{font-size:clamp(21px,2.6vw,29px);color:#ff0065;margin:0 0 15px}.content{flex:1}.q{background:#f1fbff;border:2px solid #00c8ea;border-radius:12px;padding:11px 14px;margin:9px 0;font-size:19px}.opts{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:9px}.opt,.word{border:1.5px solid #ff0069;background:#fff;border-radius:9px;padding:7px 11px;font:inherit;cursor:pointer}.opt.selected,.word.selected{background:#c9f4dc}.slot{display:inline-flex;min-width:140px;min-height:37px;border:2px dashed #ff684b;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;cursor:pointer;padding:3px 8px;background:#fff}.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;background:#e1f8ff;border-radius:12px;padding:12px;margin-bottom:15px}.word{border-color:#00aee5}.actions{text-align:center;margin-top:15px}.actions button{border:1.5px solid #ff0069;border-radius:9px;background:#fff;padding:7px 16px;font-size:15px;cursor:pointer}.score{text-align:center;color:#0074ba;font-size:19px;font-weight:bold;margin-top:8px}.good{background:#d9f8e1!important}.bad{background:#ffe3e3!important;border-color:#ff284e!important;animation:wrongBlink .48s ease-in-out 4}@keyframes wrongBlink{0%,100%{background:#ffe3e3;box-shadow:none}50%{background:#ff506a;box-shadow:0 0 0 3px #ffb1c0;color:#fff}}@media(max-width:600px){.sheet{padding:12px;min-height:95vh}.q{font-size:16px}.slot{min-width:100px}}textarea{width:100%;min-height:43px;resize:vertical;border:1.5px solid #ff0069;border-radius:8px;padding:8px;font:inherit;margin-top:8px}.hint{font-size:15px;color:#576473;margin-top:5px}.q{font-size:18px}.score{font-size:17px}</style></head><body><main class="sheet"><h1>आइए, कुछ काल परिवर्तन करें–</h1><div id="content" class="content"></div><div class="actions"><button onclick="submitAnswers()">Submit</button> <button onclick="resetAnswers()">Reset</button></div><div class="score" id="status"></div></main><script>
const D=[['बच्चा बहुत शैतान है।','भूतकाल में'],['हम कल विद्यालय गए थे।','भविष्यत् काल में'],['पिछले माह बहुत गर्मी थी।','वर्तमान काल में'],['यहाँ बहुत से अतिथि आए हैं।','भविष्यत् काल में']];const K='kopal-2-ch3-tense';let A={};try{A=JSON.parse(localStorage.getItem(K))||{}}catch{};function save(){localStorage.setItem(K,JSON.stringify(A))}function render(){document.getElementById('content').innerHTML=D.map((q,i)=>`<div class="q"><b>${['(क)','(ख)','(ग)','(घ)'][i]}</b> ${q[0]} <div class="hint">(${q[1]})</div><textarea data-i="${i}" placeholder="यहाँ उत्तर लिखिए"></textarea></div>`).join('');document.querySelectorAll('textarea').forEach(t=>{t.value=A[t.dataset.i]||'';t.addEventListener('input',()=>{A[t.dataset.i]=t.value;save()})})}function submitAnswers(){save();document.getElementById('status').textContent='उत्तर सुरक्षित हैं।';parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:{exerciseType:'FILL_BLANK',response:Object.fromEntries(D.map((q,i)=>['question'+(i+1),A[i]||'']))}},'*')}function resetAnswers(){A={};save();render();document.getElementById('status').textContent=''}render();
</script></body></html>
