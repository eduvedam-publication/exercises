<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiple choice questions.</title><style>*{box-sizing:border-box}body{margin:0;background:#dff6ff;font-family:Arial;color:#171717}.w{max-width:1000px;margin:auto;min-height:100vh;background:#fff;border:5px solid #08a9dc;border-radius:24px;padding:24px}h1{font-size:25px;color:#ff0072}.q{background:#f6fbfe;border:2px solid #a8eaff;border-radius:17px;padding:13px 16px;margin:10px 0;font-size:17px;font-weight:600}.o{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}.b,button{border:2px solid #ff2581;background:#fff;border-radius:11px;padding:8px 12px;font-size:16px;cursor:pointer}.sel{background:#ffe4f0}.ok{background:#dcf8df!important}.bad{background:#ffe0e0!important}input{border:2px solid #ff5a3d;padding:7px;font-size:16px}.a{display:flex;gap:10px;margin-top:18px}#result{font-weight:bold;margin-top:12px}@media(max-width:650px){.w{border-width:3px;border-radius:0;padding:14px}}</style></head><body><main class="w"><h1>Multiple choice questions.</h1><div class="q">1. Archana was a ______ girl.<div class="o"><button class="b" data-q="0" data-v="0" onclick="pick(this)">i. Lazy</button><button class="b" data-q="0" data-v="1" onclick="pick(this)">ii. Intelligent</button><button class="b" data-q="0" data-v="2" onclick="pick(this)">iii. Naughty</button></div></div><div class="q">2. Why did Archana not play with Abha?<div class="o"><button class="b" data-q="1" data-v="0" onclick="pick(this)">i. She was late</button><button class="b" data-q="1" data-v="1" onclick="pick(this)">ii. She had a dark complexion</button><button class="b" data-q="1" data-v="2" onclick="pick(this)">iii. She was new</button></div></div><div class="q">3. Who explained the right thing to Archana?<div class="o"><button class="b" data-q="2" data-v="0" onclick="pick(this)">i. Her teacher</button><button class="b" data-q="2" data-v="1" onclick="pick(this)">ii. Her friend</button><button class="b" data-q="2" data-v="2" onclick="pick(this)">iii. Her mother</button></div></div><div class="q">4. What did Archana learn from her mistake?<div class="o"><button class="b" data-q="3" data-v="0" onclick="pick(this)">i. We should judge people by their looks</button><button class="b" data-q="3" data-v="1" onclick="pick(this)">ii. We should treat everyone equally</button><button class="b" data-q="3" data-v="2" onclick="pick(this)">iii. We should avoid making friends</button></div></div><div class="q">5. We should be ______ to everyone.<div class="o"><button class="b" data-q="4" data-v="0" onclick="pick(this)">i. Rude</button><button class="b" data-q="4" data-v="1" onclick="pick(this)">ii. Kind</button><button class="b" data-q="4" data-v="2" onclick="pick(this)">iii. Proud</button></div></div><div class="a"><button onclick="check()">Submit</button><button onclick="location.reload()">Reset</button></div><div id="result"></div></main><script>const A=[1, 1, 2, 1, 1],S={};function pick(e){document.querySelectorAll(`[data-q="${e.dataset.q}"]`).forEach(x=>x.classList.remove('sel'));e.classList.add('sel');S[e.dataset.q]=+e.dataset.v}function check(){let n=0;A.forEach((a,i)=>{document.querySelectorAll(`[data-q="${i}"]`).forEach(x=>{x.classList.remove('ok','bad');if(+x.dataset.v===a)x.classList.add('ok');else if(x.classList.contains('sel'))x.classList.add('bad')});if(S[i]===a)n++});result.textContent=`Score: ${n} / ${A.length}`}</script></body></html>
