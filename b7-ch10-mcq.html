<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#dff8ff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:5px solid #08a6d1;border-radius:22px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;color:#ff0072;font-size:clamp(22px,3vw,30px);font-weight:800}.content{flex:1}.question{margin:12px 0;padding:13px 16px;border:2px solid #69dfff;border-radius:16px;background:#f3fbfe;font-size:clamp(16px,2vw,19px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option{border:2px solid #ff0072;background:#fff;border-radius:10px;padding:8px 13px;font-size:16px;cursor:pointer}.option.selected{background:#ffe7f1}.option.correct,.answer.correct{background:#dff7e4!important}.option.wrong,.answer.wrong{background:#ffe2e2!important}.answer{border:2px solid #ff4c39;border-radius:5px;background:#fff;padding:6px 8px;font-size:17px;min-width:130px;max-width:190px;margin:2px 4px}.bottom{text-align:center;margin-top:22px}.btn{border:2px solid #ff0072;border-radius:10px;background:#fff;color:#111;font-size:16px;padding:8px 14px;margin:4px;cursor:pointer}.score{margin-top:9px;color:#087fc2;font-weight:800;font-size:18px}@media(max-width:650px){body{padding:7px}.exercise{padding:15px 11px}.options{flex-direction:column}.option{width:100%;text-align:left}.answer{min-width:105px;max-width:145px}}</style><main class=exercise><h1 class=title>Multiple choice questions.</h1><div class=content id=content></div><div class=bottom><button class=btn onclick=check()>Submit</button><button class=btn onclick=resetEx()>Reset</button><div class=score id=score>Score: 0 / 5</div></div></main><script>function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function save(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){const p={exerciseType:t,response:r};try{parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}try{window.ReactNativeWebView&&window.ReactNativeWebView.postMessage(JSON.stringify({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p}))}catch(e){}}const K='b7-ch10-mcq',D=[['Shankar and Raja were ______.', ['brothers', 'close friends', 'cousins'], 1], ['Why did Shankar begin to hate Raja?', ['Raja had insulted him', 'Raja had cheated him', "He overheard something about Raja's father"], 2], ['Raja was standing on a ladder to ______.', ['repair the roof', 'put up decorations', 'clean the hall'], 1], ['Why did Shankar fail to react quickly when the ladder tilted?', ['He did not notice it.', 'His mind was filled with resentment.', 'He was outside the hall.'], 1], ['Which quality did Raja show by forgiving Shankar?', ['revenge', 'jealousy', 'Forgiveness'], 2]];let s=load(K);s.a=s.a||{};s.score=s.score||0;function draw(){content.innerHTML=D.map((q,i)=>`<div class=question><b>${i+1}.</b> ${q[0]}<div class=options>${q[1].map((o,j)=>`<button class="option ${s.a[i]===j?'selected':''}" onclick="pick(${i},${j})">${['i.','ii.','iii.'][j]} ${o}</button>`).join('')}</div></div>`).join('');score.textContent=`Score: ${s.score} / 5`}function pick(i,j){s.a[i]=j;save(K,s);draw()}function check(){let n=0;document.querySelectorAll('.question').forEach((r,i)=>{r.querySelectorAll('.option').forEach((b,j)=>{b.classList.remove('correct','wrong');if(j===D[i][2])b.classList.add('correct');if(s.a[i]===j&&j!==D[i][2])b.classList.add('wrong')});if(s.a[i]===D[i][2])n++});s.score=n;save(K,s);score.textContent=`Score: ${n} / 5`;send('OPTION',{answers:s.a,score:n,total:5,completed:Object.keys(s.a).length===5})}function resetEx(){s={a:{},score:0};save(K,s);draw()}draw()</script>
