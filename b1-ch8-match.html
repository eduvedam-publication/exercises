<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture Matching Exercise</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);padding:14px;color:#333}
.game{width:min(100%,1050px);margin:auto;background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:22px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.heading{font-size:27px;font-weight:700;color:#00a6d6;margin-bottom:8px;line-height:1.35}
.note{font-size:14px;text-align:center;color:#666;margin-bottom:15px}
.match-area{position:relative;display:grid;grid-template-columns:250px 1fr;gap:120px;align-items:start;padding:4px 30px}
.image-column,.sentence-column{display:flex;flex-direction:column;gap:12px}
.picture{height:112px;background:#f9fcff;border:2px solid #c9efff;border-radius:18px;padding:5px;display:flex;align-items:center;justify-content:center;position:relative;z-index:3;cursor:pointer}
.picture img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.picture.selected{outline:4px solid #00b8f0}
.picture.matched{border-color:#2e7d32;background:#effff1}
.sentence{min-height:112px;background:#fff;border:2px solid #ff4fa0;border-radius:18px;padding:12px 16px;display:flex;align-items:center;font-size:18px;font-weight:600;line-height:1.4;position:relative;z-index:3;cursor:pointer}
.sentence:hover{background:#fff4f9}
.sentence.correct{background:#d4f8d4;border-color:#2e7d32;color:#1b5e20}
.sentence.wrong{background:#ffd9dd;border-color:#c62828;color:#b71c1c}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.result{text-align:center;margin:18px 0 12px;font-size:24px;font-weight:700;color:#0047ab}
.buttons{text-align:center}
.reset{border:0;border-radius:32px;padding:12px 30px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9800,#ff6f00);cursor:pointer}
@media(max-width:700px){
 .game{padding:15px 9px}.heading{font-size:20px}
 .match-area{grid-template-columns:42% 58%;gap:8px;padding:2px}
 .image-column,.sentence-column{gap:9px}
 .picture,.sentence{height:92px;min-height:92px}
 .sentence{font-size:13px;padding:7px}
 .picture{padding:3px}.result{font-size:20px}.reset{width:100%}
}
</style>
</head>
<body>

     <div class="sentence" data-id="v">v. The dove helped the ant.</div>
   </div>
   <svg id="lines"></svg>
 </div>

 <div class="result" id="result">Score: 0 / 5</div>
 <div class="buttons"><button class="reset" onclick="resetGame()">Reset</button></div>
</div>

<script>
let selected=null, score=0, matched=0;
const area=document.getElementById("area"), svg=document.getElementById("lines");

document.querySelectorAll(".picture").forEach(p=>{
 p.onclick=()=>{
   if(p.dataset.done) return;
   document.querySelectorAll(".picture").forEach(x=>x.classList.remove("selected"));
   selected=p;p.classList.add("selected");
 };
});

document.querySelectorAll(".sentence").forEach(s=>{
 s.onclick=()=>{
   if(!selected || s.dataset.done) return;
   if(selected.dataset.answer===s.dataset.id){
     score++;matched++;
     selected.dataset.done="1";s.dataset.done="1";
     selected.classList.remove("selected");selected.classList.add("matched");
     s.classList.add("correct");
     drawLine(selected,s);
     selected=null;
   }else{
     s.classList.add("wrong");
     setTimeout(()=>s.classList.remove("wrong"),500);
   }
   document.getElementById("result").textContent=`Score: ${score} / 5`;
 };
});

function drawLine(a,b){
 const ar=area.getBoundingClientRect(), ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
 const line=document.createElementNS("http://www.w3.org/2000/svg","line");
 line.setAttribute("x1",ra.right-ar.left);
 line.setAttribute("y1",ra.top-ar.top+ra.height/2);
 line.setAttribute("x2",rb.left-ar.left);
 line.setAttribute("y2",rb.top-ar.top+rb.height/2);
 line.setAttribute("stroke","#2e7d32");
 line.setAttribute("stroke-width","3");
 line.setAttribute("stroke-linecap","round");
 svg.appendChild(line);
}

function redraw(){
 svg.innerHTML="";
 document.querySelectorAll(".picture[data-done]").forEach(p=>{
   const s=document.querySelector('.sentence[data-id="'+p.dataset.answer+'"]');
   if(s) drawLine(p,s);
 });
}

function resetGame(){
 score=0;matched=0;selected=null;svg.innerHTML="";
 document.querySelectorAll(".picture").forEach(p=>{delete p.dataset.done;p.classList.remove("selected","matched")});
 document.querySelectorAll(".sentence").forEach(s=>{delete s.dataset.done;s.classList.remove("correct","wrong")});
 document.getElementById("result").textContent="Score: 0 / 5";
}
window.addEventListener("resize",redraw);
</script>
</body>
</html>
