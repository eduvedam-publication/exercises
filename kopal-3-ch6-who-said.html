<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>किसने-किससे कहा?</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:450px;display:flex;flex-direction:column}h2{font-size:23px;color:#00a9e5;margin:0 0 18px}.q{border:1.5px solid #00c7ee;border-radius:12px;background:#f0fbfe;padding:12px;margin:7px 0}.opts{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}.opt,.chip{border:1.5px solid #ff0070;border-radius:9px;background:white;padding:7px 12px;font-size:17px;cursor:pointer;color:#222}.opt.selected,.chip.selected{background:#d7efff;border-color:#007fdb}.ok{background:#d9f9dc!important;border-color:#0a9b55!important}.bad{background:#ffe3e3!important;border-color:#e32b2b!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff5d5d}}.actions{display:flex;gap:9px;justify-content:center;margin-top:auto;padding-top:24px}.actions button{background:#ff8500;color:white;border:0;border-radius:20px;padding:10px 19px;cursor:pointer}#result{text-align:center;color:#0061b4;font-weight:bold;margin:12px}.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;background:#e7f8fc;border-radius:12px;margin-bottom:14px}.chip{border-color:#00a9e5}.slot{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:110px;min-height:38px;border:2px dashed #ff5656;border-radius:6px;background:#fff;cursor:pointer;padding:5px 8px}.line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.wordrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0}.field{border:1.5px solid #ff5b5b;border-radius:5px;padding:7px;font-size:18px;max-width:220px} @media(max-width:600px){.wrap{margin:0;border-radius:0;padding:14px;min-height:100vh}.opts{gap:5px}.opt{font-size:15px;padding:6px}}.gridhead,.tableline{display:grid;grid-template-columns:minmax(200px,1fr) 115px 115px;gap:12px;align-items:center;padding:7px 0}.gridhead{text-align:center;color:#00a9d6}.tableline .field{width:100%;min-width:0}.tableline span{line-height:1.6}@media(max-width:650px){.gridhead,.tableline{grid-template-columns:minmax(120px,1fr) 75px 75px;gap:5px}.field{padding:5px}}</style></head><body><main class="wrap"><h2>किसने-किससे कहा?</h2><div class="q"><div class="gridhead"><b>वाक्य</b><b>किसने</b><b>किससे</b></div><div class="tableline"><span>(क) इस हंस को मैंने मारा है।</span><input class="field" aria-label="किसने 1"><input class="field" aria-label="किससे 1"></div><div class="tableline"><span>(ख) मैंने इस हंस को बचाया है।</span><input class="field" aria-label="किसने 2"><input class="field" aria-label="किससे 2"></div><div class="tableline"><span>(ग) महाराज! मुझे न्याय चाहिए।</span><input class="field" aria-label="किसने 3"><input class="field" aria-label="किससे 3"></div><div class="tableline"><span>(घ) मारने वाले से ज्यादा हक बचाने वाले का है।</span><input class="field" aria-label="किसने 4"><input class="field" aria-label="किससे 4"></div></div><div class="actions"><button onclick="submit()">Submit</button><button onclick="resetAll()">Reset</button></div><div id="result"></div></main><script>const key='kopal-2-ch5-who-said';const fields=[...document.querySelectorAll('.field')];let old=JSON.parse(localStorage.getItem(key)||'[]');fields.forEach((e,i)=>{e.value=old[i]||'';e.addEventListener('input',save)});function save(){localStorage.setItem(key,JSON.stringify(fields.map(e=>e.value)))}function submit(){save();document.getElementById('result').textContent='उत्तर सुरक्षित हैं।'}function resetAll(){fields.forEach(e=>e.value='');localStorage.removeItem(key);document.getElementById('result').textContent=''}</script></body></html>
