<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fill in the blanks.</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #eaf8ff;
      color: #292929;
    }
    .w {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      border: 5px solid #08b6e8;
      border-radius: 25px;
      padding: 24px;
    }
    h1 {
      color: #ff0878;
      font-size: 25px;
    }
    .c {
      background: #f9fcff;
      border: 2px solid #c9efff;
      border-radius: 18px;
      padding: 15px;
      margin: 11px 0;
    }
    .r {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      line-height: 1.55;
    }
    .g {
      flex: 1;
    }
    .s {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #064bad;
      margin: 15px;
    }
    .a {
      text-align: center;
    }
    .b {
      padding: 11px 25px;
      border: 0;
      border-radius: 25px;
      background: #ff7b00;
      color: #fff;
      font-weight: bold;
      margin: 4px;
      cursor: pointer;
    }
    input {
      padding: 8px;
      border: 2px solid #ff4fa0;
      border-radius: 8px;
      font-size: 16px;
      max-width: 190px;
    }
    .ok {
      background: #d8f6d8 !important;
      border-color: #27843a !important;
    }
    .bad {
      background: #ffdadd !important;
      border-color: #c62828 !important;
    }
    .ch {
      display: inline-block;
      padding: 5px 11px;
      border: 2px solid #ff4fa0;
      border-radius: 999px;
      margin: 3px;
      cursor: pointer;
      font-weight: bold;
    }
    .off {
      pointer-events: none;
    }
    @media (max-width: 650px) {
      .w {
        padding: 12px;
      }
      h1 {
        font-size: 20px;
      }
      .r {
        font-size: 15px;
        align-items: flex-start;
      }
      .b {
        width: 100%;
      }
      input {
        max-width: 130px;
      }
    }
  </style>
</head>
<body>
  <div class="w">
    <h1>Fill in the blanks.</h1>
    <div id="x"></div>
    <div id="s" class="s"></div>
    <div class="a">
      <button class="b" onclick="check()">Check Answers</button>
      <button class="b" onclick="load()">Reset</button>
    </div>
  </div>

  <script>
    const R = [
      ["1. You must respect and ", "obey", " your teachers. You will not read a single book on the ", "life", " of any great men without finding some ", "incident", "."],
      ["2. This love and ", "respect", " for one\u2019s teachers is something based on the ", "belief", "."],
      ["3. Teachers sacrifice their ", "time", " and ", "comfort", " to frame your future."],
      ["4. They have to do that in order to ", "educate", " you."],
      ["5. Never try to dodge or ", "evade", " your teachers."]
    ];

    let Q = [];

    function load() {
      Q = [];
      const x = document.getElementById('x');
      const s = document.getElementById('s');
      x.innerHTML = '';
      let n = 0;

      R.forEach((parts, qIndex) => {
        let c = document.createElement('div');
        c.className = 'c r';
        let d = document.createElement('div');
        d.className = 'g';
        let qInputs = [];

        parts.forEach((p, i) => {
          if (i % 2 === 0) {
            d.append(document.createTextNode(p));
          } else {
            let z = document.createElement('input');
            z.id = 'i' + n;
            qInputs.push([z.id, p]);
            n++;
            d.append(z);
          }
        });

        Q.push(qInputs);
        c.append(d);
        x.append(c);
      });

      // Total score displayed out of 5 (1 point for each completed question)
      s.textContent = 'Score: 0 / ' + R.length;
    }

    function check() {
      let sc = 0;
      const s = document.getElementById('s');

      Q.forEach(qInputs => {
        let questionAllCorrect = true;
        
        qInputs.forEach(([id, answer]) => {
          let z = document.getElementById(id);
          z.classList.remove('ok', 'bad');
          
          if (z.value.trim().toLowerCase() === answer.toLowerCase()) {
            z.classList.add('ok');
          } else {
            z.classList.add('bad');
            questionAllCorrect = false;
          }
        });

        // Award 1 point when all blanks in a question are answered correctly
        if (questionAllCorrect) {
          sc++;
        }
      });

      s.textContent = 'Score: ' + sc + ' / ' + R.length;
    }

    // Initial render
    load();
  </script>
</body>
</html>
