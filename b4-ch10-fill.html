');c.className='c r';let d=document.createElement('div');d.className='g';p.forEach((v,i)=>{if(i%2===0)d.append(document.createTextNode(v));else{let z=document.createElement('input');z.id='i'+n;A.push([z.id,v]);n++;d.append(z)}});c.append(d);x.append(c)});s.textContent='Score: 0 / '+A.length}function check(){let sc=0;A.forEach(([id,a])=>{let z=document.getElementById(id);z.classList.remove('ok','bad');if(z.value.trim().toLowerCase()===a.toLowerCase()){z.classList.add('ok');sc++}else z.classList.add('bad')});s.textContent='Score: '+sc+' / '+A.length}load();</script></body></html>
