<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का निशान लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#bafaff;font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;color:#152b35}.sheet{max-width:1020px;width:calc(100% - 28px);margin:20px auto;background:white;border:3px solid #00a8f6;border-radius:20px;padding:23px}h1{font-size:clamp(21px,2.6vw,29px);color:#00a5f5;margin:0 0 18px}.q{background:#dff8ff;border:1.5px solid #00adff;border-radius:11px;padding:13px 15px;margin:9px 0;font-size:18px;line-height:1.9}.opts{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}.opt,.chip{background:white;border:1px solid #4dc7ff;border-radius:8px;padding:7px 12px;color:#172c37;font:inherit;font-size:17px;cursor:pointer}.opt.sel,.chip.active{background:#b7ecff;border-color:#008fe5}.opt.correct,.slot.correct,.field.correct{background:#d8f8e1;border:2px solid #20a950}.opt.wrong,.slot.wrong,.field.wrong{background:#ffe1e1;border:2px solid #e64747}.bank{background:#d0f7ff;border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{cursor:grab}.slot{display:inline-flex;vertical-align:middle;min-width:140px;min-height:42px;padding:5px 12px;align-items:center;justify-content:center;border:2px dashed #ff7474;border-radius:8px;background:white;color:#173442;cursor:pointer}.slot:empty:after{content:'________';color:#138bb4}.field{width:min(100%,650px);min-height:45px;border:2px dashed #ff7474;border-radius:8px;padding:8px;font:inherit;font-size:17px;color:#163243}.actions{text-align:center;margin-top:25px}.actions button{background:#ff7100;color:white;border:0;border-radius:30px;padding:11px 18px;margin:3px;cursor:pointer;font-weight:bold}.marks{text-align:center;font-size:20px;font-weight:bold;color:#003fff;margin-top:9px}.hint{font-size:14px;color:#345}button:focus-visible,.slot:focus-visible,.field:focus-visible{outline:3px solid #126aff} @media(max-width:650px){.sheet{padding:14px;margin:10px auto}.q{font-size:16px}.opt,.chip{font-size:15px}.slot{min-width:100px}}</style></head><body><main class="sheet"><h1>सही विकल्प पर सही (✓) का निशान लगाइए–</h1><div id="questions"></div><div class="actions"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div class="marks" id="marks">Marks: 0 / 5</div></main><script>const DATA=[["स्त्रियाँ किस उद्देश्य से एक स्थान पर एकत्र हुई थीं?", ["घूमने के लिए", "पानी भरने के लिए", "खेल देखने के लिए"], 1], ["पहली स्त्री अपने बेटे की किस विशेषता की प्रशंसा कर रही थी?", ["उसके बल की", "उसके मधुर गायन की", "उसके ज्ञान की"], 1], ["चौथी स्त्री के बेटे ने अपनी माँ की किस प्रकार सहायता की?", ["पानी भरकर", "घड़ा उठाकर", "गीत गाकर"], 1], ["सच्चा हीरा किसे कहा गया?", ["मधुर गाने वाले को", "शक्तिशाली युवक को", "माँ की सहायता करने वाले पुत्र को"], 2], ["‘बलवान’ का विलोम शब्द है–", ["शक्तिशाली", "साहसी", "निर्बल"], 2]];const TYPE="mcq";const KEY='kopal-6-ch17-'+TYPE+'-v1';let state=[];let active=null;try{state=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){};const root=document.getElementById('questions');const bank=document.getElementById('bank');const letters=['क','ख','ग','घ','ङ','च'];function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function clearMarks(){document.querySelectorAll('.correct,.wrong').forEach(e=>e.classList.remove('correct','wrong'));document.getElementById('marks').textContent='Marks: 0 / '+DATA.length}function make(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function render(){root.innerHTML='';if(bank)bank.innerHTML='';DATA.forEach((d,i)=>{let q=make('div','q');if(TYPE==='mcq'||TYPE==='true-false'){q.append(make('div','',`(${letters[i]}) ${d[0]}`));let opts=make('div','opts');(TYPE==='mcq'?d[1]:['सही (✓)','गलत (✗)']).forEach((o,j)=>{let b=make('button','opt'+(state[i]===j?' sel':''),o);b.type='button';b.onclick=()=>{state[i]=j;save();clearMarks();render()};opts.append(b)});q.append(opts)}else if(TYPE==='order'){q.append(make('div','',`(${letters[i]}) ${d[0]}`));let input=make('input','field');input.value=state[i]||'';input.setAttribute('aria-label',d[0]);input.placeholder='शुद्ध वाक्य लिखिए';input.oninput=()=>{state[i]=input.value;save();clearMarks()};q.append(input)}else{let label=make('span','',`(${letters[i]}) ${d[0]} `);q.append(label);let slot=make('button','slot',state[i]||'');slot.type='button';slot.dataset.index=i;slot.draggable=!!state[i];slot.onclick=()=>{if(active!==null){state[i]=active;active=null;save();render();clearMarks()}else if(state[i]){state[i]='';save();render();clearMarks()}};slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();let value=e.dataTransfer.getData('text/plain');if(value){state[i]=value;active=null;save();render();clearMarks()}};q.append(slot)}root.append(q)});if(bank){let words=[...new Set(DATA.flatMap(d=>d[2]||[]))];words.forEach(w=>{let chip=make('button','chip'+(active===w?' active':''),w);chip.type='button';chip.draggable=true;chip.ondragstart=e=>e.dataTransfer.setData('text/plain',w);chip.onclick=()=>{active=w;render()};bank.append(chip)})}}function norm(s){return String(s||'').replace(/[।,.!?\s‌‍]/g,'').toLowerCase()}function check(show){let score=0;document.querySelectorAll('.q').forEach((q,i)=>{let d=DATA[i],correct=TYPE==='mcq'?d[2]:TYPE==='true-false'?d[1]:d[1];let val=state[i];if(show){state[i]=correct;val=correct}let ok=TYPE==='mcq'||TYPE==='true-false'?val===correct:norm(val)===norm(correct);if(ok)score++;let el=(TYPE==='mcq'||TYPE==='true-false')?q.querySelectorAll('.opt')[val]:q.querySelector('.slot,.field');if(el&&val!==undefined&&val!=='')el.classList.add(ok?'correct':'wrong');if(show&&TYPE==='order')q.querySelector('.field').value=correct});if(show){save();render();document.querySelectorAll('.q').forEach((q,i)=>{let el=(TYPE==='mcq'||TYPE==='true-false')?q.querySelectorAll('.opt')[state[i]]:q.querySelector('.slot,.field');if(el)el.classList.add('correct')});score=DATA.length}document.getElementById('marks').textContent='Marks: '+score+' / '+DATA.length}document.getElementById('submit').onclick=()=>{clearMarks();check(false)};document.getElementById('show').onclick=()=>{clearMarks();check(true)};document.getElementById('reset').onclick=()=>{state=[];active=null;save();render();clearMarks()};render();</script></body></html>
