<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fill in the Blanks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);display:flex;justify-content:center;align-items:center;padding:18px;color:#333}
.quiz-box{width:min(100%,950px);background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.heading{font-size:27px;font-weight:700;color:#00a6d6;margin-bottom:18px}
.help-box{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;background:linear-gradient(135deg,#fff,#d8f36b,#fff);padding:12px 18px;border-radius:16px;margin-bottom:22px}
.help-word{font-size:19px;font-weight:700;padding:5px 13px}
.question-box{background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:17px 20px;margin-bottom:14px}
.question{font-size:20px;line-height:1.8}
.blank-input{width:180px;border:none;border-bottom:3px solid #888;background:transparent;font-size:19px;font-weight:700;color:#d81b60;text-align:center;outline:none;padding:4px;margin:0 5px}
.blank-input:focus{border-color:#00b8f0}
.blank-input.correct{border-color:#2e7d32;color:#1b5e20}
.blank-input.wrong{border-color:#c62828;color:#b71c1c}
.buttons{text-align:center;margin-top:20px}
button{border:0;border-radius:32px;padding:12px 28px;margin:6px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9800,#ff6f00);cursor:pointer}
.result{text-align:center;margin-top:15px;font-size:24px;font-weight:700;color:#0047ab}
@media(max-width:650px){
body{padding:8px;align-items:flex-start}.quiz-box{padding:16px 12px;border-radius:20px}.heading{font-size:21px}
.help-box{gap:5px}.help-word{font-size:15px;padding:5px 8px}.question-box{padding:13px}.question{font-size:16px;line-height:1.7}
.blank-input{width:130px;font-size:16px}button{width:100%;margin:6px 0}.result{font-size:21px}
}
</style>
</head>
<body>
<div class="quiz-box">
 <div class="heading">Fill in the blanks by using help box.</div>

 <div class="help-box">
  <span class="help-word">leaf</span>
  <span class="help-word">current</span>
  <span class="help-word">dove</span>
  <span class="help-word">thrust</span>
  <span class="help-word">river</span>
 </div>

 <div class="question-box"><div class="question">1. The ant lived near a <input id="q1" class="blank-input" type="text">.</div></div>
 <div class="question-box"><div class="question">2. The ant went to the river to quench her <input id="q2" class="blank-input" type="text">.</div></div>
 <div class="question-box"><div class="question">3. The ant was carried away by the <input id="q3" class="blank-input" type="text"> of the stream.</div></div>
 <div class="question-box"><div class="question">4. A <input id="q4" class="blank-input" type="text"> saw the ant drowning.</div></div>
 <div class="question-box"><div class="question">5. The dove dropped a <input id="q5" class="blank-input" type="text"> near the ant.</div></div>

 <div class="buttons">
  <button onclick="checkAnswers()">Check Answers</button>
  <button onclick="resetQuiz()">Reset</button>
 </div>
 <div class="result" id="result">Score: 0 / 5</div>
</div>

<script>
const answers={q1:"river",q2:"thrust",q3:"current",q4:"dove",q5:"leaf"};

function checkAnswers(){
 let score=0;
 Object.entries(answers).forEach(([id,answer])=>{
  const input=document.getElementById(id);
  const value=input.value.trim().toLowerCase();
  input.classList.remove("correct","wrong");
  if(value===answer){input.classList.add("correct");score++}
  else input.classList.add("wrong");
 });
 document.getElementById("result").textContent=`Score: ${score} / 5`;
}
function resetQuiz(){
 Object.keys(answers).forEach(id=>{
  const input=document.getElementById(id);
  input.value="";
  input.classList.remove("correct","wrong");
 });
 document.getElementById("result").textContent="Score: 0 / 5";
}
</script>
</body>
</html>
