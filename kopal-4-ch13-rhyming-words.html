<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>कविता में से समान तुकवाले शब्दों को चुनकर लिखिए</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#e3f8ff;color:#17354a;font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif}
.sheet{max-width:1000px;margin:auto;background:#fff;border:3px solid #00bde8;border-radius:18px;padding:24px}
h1{margin:0 0 8px;color:#ff3284;font-size:clamp(21px,3vw,30px)}
.meta{color:#236a86;margin-bottom:18px}
.question{padding:15px;margin:13px 0;border:1px solid #77dcf5;border-radius:13px;background:#f0fbff}
.qtext{font-size:18px;font-weight:600;margin-bottom:10px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
.option{display:flex;align-items:flex-start;gap:9px;border:1px solid #d5e9ef;background:#fff;padding:10px 12px;border-radius:9px;cursor:pointer}
.option:hover{border-color:#00bde8}
input[type=radio]{accent-color:#ff3284;margin-top:5px}
select,input[type=text]{font:inherit;border:1px solid #7acfe6;border-radius:7px;padding:8px;background:white;max-width:100%;min-width:145px}
.answerline{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}
.correct{border-color:#1a9b62!important;background:#e7fff2!important}
.wrong{border-color:#e7475d!important;background:#fff0f1!important}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:22px 0 12px}
button{border:0;border-radius:30px;padding:12px 22px;color:white;background:#ff3284;font-weight:700;font-size:15px;cursor:pointer}
button.secondary{background:#078db6}button.reset{background:#687d89}
#score{text-align:center;color:#007ca5;font-weight:800;font-size:21px;margin:16px 0 4px}
#feedback{text-align:center;min-height:24px;font-weight:600}
@media(max-width:520px){body{padding:8px}.sheet{padding:14px}.question{padding:12px}}
</style></head><body><main class="sheet"><h1>कविता में से समान तुकवाले शब्दों को चुनकर लिखिए</h1><form id="quiz"><section class="question" data-answer="रेल"><div class="qtext">(क) मेल —</div><div class="answerline"><label>समान तुकवाला शब्द:</label><select name="q1"><option value="">— विकल्प चुनें —</option><option value="रेल">रेल</option><option value="जोड़">जोड़</option><option value="हरूँ">हरूँ</option><option value="नाम">नाम</option></select></div><div class="shown-answer"></div></section><section class="question" data-answer="स्थान"><div class="qtext">(ख) विज्ञान —</div><div class="answerline"><label>समान तुकवाला शब्द:</label><select name="q2"><option value="">— विकल्प चुनें —</option><option value="हरूँ">हरूँ</option><option value="स्थान">स्थान</option><option value="मोद">मोद</option><option value="जोड़">जोड़</option></select></div><div class="shown-answer"></div></section><section class="question" data-answer="औलाद"><div class="qtext">(ग) फ़ौलाद —</div><div class="answerline"><label>समान तुकवाला शब्द:</label><select name="q3"><option value="">— विकल्प चुनें —</option><option value="जोड़">जोड़</option><option value="नाम">नाम</option><option value="औलाद">औलाद</option><option value="डगर">डगर</option></select></div><div class="shown-answer"></div></section><section class="question" data-answer="जोड़ने"><div class="qtext">(घ) तोड़ने —</div><div class="answerline"><label>समान तुकवाला शब्द:</label><select name="q4"><option value="">— विकल्प चुनें —</option><option value="मोद">मोद</option><option value="हरूँ">हरूँ</option><option value="जोड़">जोड़</option><option value="जोड़ने">जोड़ने</option></select></div><div class="shown-answer"></div></section><section class="question" data-answer="मजबूरियाँ"><div class="qtext">(ङ) दूरियाँ —</div><div class="answerline"><label>समान तुकवाला शब्द:</label><select name="q5"><option value="">— विकल्प चुनें —</option><option value="डगर">डगर</option><option value="जोड़">जोड़</option><option value="मजबूरियाँ">मजबूरियाँ</option><option value="हरूँ">हरूँ</option></select></div><div class="shown-answer"></div></section><section class="question" data-answer="डगर"><div class="qtext">(च) जिधर —</div><div class="answerline"><label>समान तुकवाला शब्द:</label><select name="q6"><option value="">— विकल्प चुनें —</option><option value="रेल">रेल</option><option value="डगर">डगर</option><option value="स्थान">स्थान</option><option value="औलाद">औलाद</option></select></div><div class="shown-answer"></div></section><section class="question" data-answer="मोद"><div class="qtext">(छ) गोद —</div><div class="answerline"><label>समान तुकवाला शब्द:</label><select name="q7"><option value="">— विकल्प चुनें —</option><option value="मोद">मोद</option><option value="औलाद">औलाद</option><option value="जोड़ने">जोड़ने</option><option value="मजबूरियाँ">मजबूरियाँ</option></select></div><div class="shown-answer"></div></section><section class="question" data-answer="नाम"><div class="qtext">(ज) काम —</div><div class="answerline"><label>समान तुकवाला शब्द:</label><select name="q8"><option value="">— विकल्प चुनें —</option><option value="जोड़ने">जोड़ने</option><option value="नाम">नाम</option><option value="रेल">रेल</option><option value="स्थान">स्थान</option></select></div><div class="shown-answer"></div></section><section class="question" data-answer="हरूँ"><div class="qtext">(झ) करूँ —</div><div class="answerline"><label>समान तुकवाला शब्द:</label><select name="q9"><option value="">— विकल्प चुनें —</option><option value="मजबूरियाँ">मजबूरियाँ</option><option value="स्थान">स्थान</option><option value="हरूँ">हरूँ</option><option value="डगर">डगर</option></select></div><div class="shown-answer"></div></section><section class="question" data-answer="जोड़"><div class="qtext">(ञ) तोड़ —</div><div class="answerline"><label>समान तुकवाला शब्द:</label><select name="q10"><option value="">— विकल्प चुनें —</option><option value="रेल">रेल</option><option value="औलाद">औलाद</option><option value="जोड़ने">जोड़ने</option><option value="जोड़">जोड़</option></select></div><div class="shown-answer"></div></section></form><div class="actions"><button type="button" onclick="submitQuiz()">Submit</button><button type="button" class="secondary" onclick="showAnswers()">Show Answer</button><button type="button" class="reset" onclick="resetQuiz()">Reset</button></div><div id="score">प्राप्तांक: 0 / 10</div><div id="feedback" aria-live="polite"></div></main><script>
function clearStyles(){document.querySelectorAll('.option,.question').forEach(el=>el.classList.remove('correct','wrong'))}
function getChoice(q){let r=q.querySelector('input[type=radio]:checked');if(r)return r.value;let s=q.querySelector('select');if(s && s.value!=='')return s.value;let t=q.querySelector('input[type=text]');if(t)return t.value.trim();return ''}
function markAnswers(showAll){
 clearStyles();let score=0,answered=0;
 document.querySelectorAll('.question').forEach(q=>{
  const answer=q.dataset.answer;const chosen=getChoice(q);
  const control=q.querySelector('input[type=radio]:checked')||q.querySelector('select')||q.querySelector('input[type=text]');
  if(chosen!==''){answered++;if(chosen===answer){score++;if(control)control.classList.add('correct')}else{if(control)control.classList.add('wrong')}}
  if(showAll){q.querySelectorAll('input[type=radio]').forEach(r=>{if(r.value===answer)r.closest('.option').classList.add('correct')});let s=q.querySelector('select');if(s){s.classList.add('correct');let out=q.querySelector('.shown-answer');if(out)out.textContent='सही उत्तर: '+answer;}}
 });
 document.getElementById('score').textContent='प्राप्तांक: '+score+' / 10';
 document.getElementById('feedback').textContent=showAll?'सही उत्तर हरे रंग में दिखाए गए हैं।':(answered<10?'आपने '+answered+' प्रश्नों के उत्तर दिए हैं।':(score===10?'बहुत अच्छे! सभी उत्तर सही हैं।':'उत्तर जाँच लिए गए हैं। सही उत्तर हरे और गलत उत्तर लाल रंग में हैं।'));
}
function submitQuiz(){markAnswers(false)}
function showAnswers(){markAnswers(true)}
function resetQuiz(){document.getElementById('quiz').reset();clearStyles();document.querySelectorAll('.shown-answer').forEach(e=>e.textContent='');document.getElementById('score').textContent='प्राप्तांक: 0 / 10';document.getElementById('feedback').textContent=''}
</script></body></html>
