<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>King Midas Tick Correct Statements</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);display:flex;justify-content:center;align-items:center;padding:18px;color:#333}
.quiz-box{width:min(100%,950px);background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.heading{font-size:27px;font-weight:700;color:#00a6d6;margin-bottom:20px}
.question-box{background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:17px 20px;margin-bottom:14px}
.result{text-align:center;margin:20px 0 14px;font-size:24px;font-weight:700;color:#0047ab}
.buttons{text-align:center}
button.action{border:0;border-radius:32px;padding:12px 28px;margin:5px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9800,#ff6f00);cursor:pointer}

.statement{display:flex;align-items:center;justify-content:space-between;gap:18px;background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:16px 20px;margin-bottom:13px}
.text{font-size:20px;line-height:1.5;font-weight:500}.options{display:flex;gap:9px;flex-shrink:0}
.choice{width:52px;height:45px;border:2px solid #ff4fa0;border-radius:12px;background:#fff;font-size:22px;font-weight:700;cursor:pointer}
.choice.correct{background:#d4f8d4;border-color:#2e7d32;color:#1b5e20}.choice.wrong{background:#ffd9dd;border-color:#c62828;color:#b71c1c}.choice:disabled{cursor:default}
@media(max-width:650px){body{padding:8px;align-items:flex-start}.quiz-box{padding:16px 12px}.heading{font-size:21px}.statement{padding:13px}.text{font-size:16px}.choice{width:44px;height:40px}button.action{width:100%}}
</style></head><body><div class="quiz-box">
<div class="heading">Tick (✓) the correct statements.</div><div id="quiz"></div>
<div class="result" id="result">Score: 0 / 5</div><div class="buttons"><button class="action" onclick="resetQuiz()">Reset Quiz</button></div></div>
<script>
const qs=[
{t:"1. King Midas was happy with the wealth he had.",a:false},
{t:"2. King Midas wanted more wealth.",a:true},
{t:"3. God granted King Midas a magical boon.",a:true},
{t:"4. Everything King Midas touched turned into gold.",a:true},
{t:"5. King Midas could eat his food happily.",a:false}
];let score=0;
function load(){let q=document.getElementById("quiz");q.innerHTML="";qs.forEach(x=>{let row=document.createElement("div");row.className="statement";let txt=document.createElement("div");txt.className="text";txt.textContent=x.t;let o=document.createElement("div");o.className="options";let y=document.createElement("button");y.className="choice";y.textContent="✓";let n=document.createElement("button");n.className="choice";n.textContent="✕";y.onclick=()=>answer(y,true,x.a,o);n.onclick=()=>answer(n,false,x.a,o);o.append(y,n);row.append(txt,o);q.append(row)})}
function answer(btn,val,correct,o){let bs=o.querySelectorAll("button");bs.forEach(b=>b.disabled=true);if(val===correct){btn.classList.add("correct");score++}else{btn.classList.add("wrong");(correct?bs[0]:bs[1]).classList.add("correct")}document.getElementById("result").textContent=`Score: ${score} / 5`;}
function resetQuiz(){score=0;document.getElementById("result").textContent="Score: 0 / 5";load()}load();
</script></body></html>
