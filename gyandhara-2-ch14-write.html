<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gyandhara-2-ch14-write</title><style>*{box-sizing:border-box}body{margin:0;background:#e1faff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#152c3c}.wrap{max-width:920px;margin:16px auto;background:white;border:3px solid #05a9d5;border-radius:22px;padding:20px 25px}h1{font-size:25px;color:#00a8e2;margin:0 0 18px}.card{background:#f0fbff;border:2px solid #08c7ee;border-radius:13px;padding:15px;margin:12px 0;font-size:19px}.btns{display:flex;justify-content:center;gap:12px;margin-top:25px}button{cursor:pointer;background:#ff8300;border:0;border-radius:22px;padding:10px 22px;color:white;font-weight:bold}button:focus-visible,.item:focus-visible{outline:3px solid #fb597e}#score{text-align:center;color:#0064b5;font-weight:bold;font-size:20px;margin-top:10px}@media(max-width:600px){.wrap{margin:4px;padding:13px}h1{font-size:21px}.card{font-size:16px}}textarea{width:100%;min-height:72px;margin-top:10px;border:1.5px solid #ff6079;border-radius:8px;padding:10px;font:18px inherit;resize:vertical}</style></head><body><main class="wrap"><h1>सोचिए और लिखिए–</h1><section class="card"><label for="q0">(क) किसी पाँच लाल रंग के फूलों के नाम लिखिए।</label><textarea id="q0" aria-label="उत्तर 1"></textarea></section><section class="card"><label for="q1">(ख) आपको कौन-सा फूल पसंद है? और क्यों?</label><textarea id="q1" aria-label="उत्तर 2"></textarea></section><div class="btns"><button onclick="save()">Submit</button><button onclick="resetAll()">Reset</button></div><div id="score" aria-live="polite"></div></main><script>const key="gyandhara-2-ch14-write";const els=[...document.querySelectorAll("textarea")];function save(){localStorage.setItem(key,JSON.stringify(els.map(e=>e.value)));document.getElementById("score").textContent="उत्तर सुरक्षित हैं।"}function resetAll(){els.forEach(e=>e.value="");localStorage.removeItem(key);document.getElementById("score").textContent=""}els.forEach(e=>e.addEventListener("input",()=>localStorage.setItem(key,JSON.stringify(els.map(x=>x.value)))));try{const a=JSON.parse(localStorage.getItem(key));if(Array.isArray(a))els.forEach((e,i)=>e.value=a[i]||"")}catch(e){}</script></body></html>
