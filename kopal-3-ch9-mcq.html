<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-2-ch9-mcq.html</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:440px;display:flex;flex-direction:column}h2{font-size:23px;color:#ff0066;margin:0 0 16px}.q{background:#effaff;border:1.5px solid #00c4ed;border-radius:12px;padding:12px 15px;margin:6px 0;font-size:18px;line-height:1.9}.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#e2f8ff;padding:12px;border-radius:10px;margin-bottom:14px}.chip{border:1.5px solid #00a9dc;border-radius:7px;background:#fff;padding:6px 12px;font-size:18px;cursor:grab;font-family:inherit}.chip.sel{background:#c8eaff}.chip.used{opacity:.4}.blank{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:125px;min-height:35px;border:2px dashed #ff5b52;border-radius:6px;padding:2px 7px;cursor:pointer;background:#fff}.ok{background:#d9f8dc!important;border-color:#24ad54!important}.bad{background:#ffe2e2!important;border-color:#f33!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff8080}}.options{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.opt{font:inherit;font-size:16px;border:1.5px solid #ff0066;background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}.opt.selected{background:#dcefff}.actions{display:flex;justify-content:center;gap:12px;margin-top:auto;padding-top:24px}button.action{background:#ff8700;color:white;border:0;border-radius:18px;padding:9px 21px;font-weight:bold;cursor:pointer}#result{text-align:center;color:#0755af;font-weight:bold;margin-top:12px}.answer{border:1.5px solid #ff6b59;border-radius:7px;padding:7px;font:18px Arial,"Noto Sans Devanagari",sans-serif;width:100%;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:16px;color:#555}@media(max-width:650px){.wrap{margin:4px;padding:14px;min-height:calc(100vh - 8px)}h2{font-size:21px}.q{font-size:16px}.two{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ–</h2><div class="q">(क) क्रिकेट की टीम में होते हैं–<div class="options"><button class="opt" data-q="0" data-o="0">(i) दस खिलाड़ी</button><button class="opt" data-q="0" data-o="1">(ii) ग्यारह खिलाड़ी</button><button class="opt" data-q="0" data-o="2">(iii) बारह खिलाड़ी</button></div></div><div class="q">(ख) फील्डर्स का कार्य है–<div class="options"><button class="opt" data-q="1" data-o="0">(i) गेंद को पकड़ना</button><button class="opt" data-q="1" data-o="1">(ii) रन बनाने से रोकना</button><button class="opt" data-q="1" data-o="2">(iii) दोनों</button></div></div><div class="q">(ग) ‘क्षेत्ररक्षक’ शब्द बना है–<div class="options"><button class="opt" data-q="2" data-o="0">(i) क्षेत्र + रक्षक</button><button class="opt" data-q="2" data-o="1">(ii) क्षेत्र + अरक्षक</button><button class="opt" data-q="2" data-o="2">(iii) क्षेत्र + आरक्षक</button></div></div><div class="q">(घ) ‘क्रिकेट का खेल बड़ा शानदार होता है’ में विशेषण शब्द है–<div class="options"><button class="opt" data-q="3" data-o="0">(i) क्रिकेट</button><button class="opt" data-q="3" data-o="1">(ii) खेल</button><button class="opt" data-q="3" data-o="2">(iii) बड़ा शानदार</button></div></div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="resetExercise()">Reset</button></div><div id="result">Score: 0 / 4</div></main><script>const key='kopal-2-ch9-mcq',answers=[1,2,0,2],chosen=[null,null,null,null];function save(){localStorage.setItem(key,JSON.stringify(chosen))}function paint(){document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('selected',chosen[+b.dataset.q]===+b.dataset.o))}document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{chosen[+b.dataset.q]=+b.dataset.o;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('ok','bad'));paint();save()});function submit(){let score=0;answers.forEach((a,i)=>{let b=document.querySelector(`.opt[data-q="${i}"][data-o="${chosen[i]}"]`);if(b){let ok=chosen[i]===a;b.classList.remove('ok','bad');void b.offsetWidth;b.classList.add(ok?'ok':'bad');if(ok)score++}});document.getElementById('result').textContent=`Score: ${score} / 4`;save()}function resetExercise(){chosen.fill(null);document.querySelectorAll('.opt').forEach(b=>b.classList.remove('ok','bad'));paint();document.getElementById('result').textContent='Score: 0 / 4';save()}try{let a=JSON.parse(localStorage.getItem(key)||'[]');a.forEach((v,i)=>{if(i<4)chosen[i]=v});paint()}catch(e){}</script></body></html>
