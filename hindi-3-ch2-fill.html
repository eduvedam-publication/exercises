<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>हिंदी 3 • पाठ 2 • रिक्त स्थान पूर्ति कीजिए–</title>
  
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #dff6ff, #fff, #e8f5e9);
      font-family: Arial, "Nirmala UI", sans-serif;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .quiz-box {
      width: min(100%, 950px);
      background: #fff;
      border: 5px solid #00b8f0;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 12px 35px #0002;
    }
    h1 {
      font-size: 27px;
      color: #00a6d6;
      margin: 0 0 22px;
    }
    .question-box {
      background: #f9fcff;
      border: 2px solid #c9efff;
      border-radius: 20px;
      padding: 17px 20px;
      margin-bottom: 14px;
      font-size: 21px;
      line-height: 1.8;
    }
    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }
    button {
      font: inherit;
      cursor: pointer;
    }
    .option, .word, .blank {
      border: 2px solid #ff4fa0;
      border-radius: 12px;
      background: white;
      padding: 8px 18px;
      font-size: 20px;
      color: #333;
    }
    .selected {
      background: #fff0f7;
      outline: 3px solid #ff4fa0;
    }
    .correct {
      background: #d4f8d4 !important;
      border-color: #2e7d32 !important;
      color: #1b5e20;
    }
    .wrong {
      background: #ffd9dd !important;
      border-color: #c62828 !important;
      color: #b71c1c;
    }
    .actions {
      text-align: center;
      margin-top: 20px;
    }
    .actions button {
      border: 0;
      border-radius: 32px;
      padding: 12px 28px;
      margin: 6px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #ff9800, #ff6f00);
      box-shadow: 0 4px 12px rgba(255, 111, 0, 0.3);
      transition: transform 0.15s ease;
    }
    .actions button:active {
      transform: scale(0.97);
    }
    #result {
      text-align: center;
      margin: 18px 0 0;
      font-size: 24px;
      font-weight: bold;
      color: #0047ab;
    }
    .help-box {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      background: linear-gradient(135deg, #fff, #d8f36b, #fff);
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 20px;
      min-height: 75px;
    }
    .word {
      touch-action: none;
      user-select: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: all 0.2s ease;
    }
    .blank {
      min-width: 150px;
      min-height: 48px;
      border-style: dashed;
      margin: 4px;
      vertical-align: middle;
      color: #d81b60;
      transition: all 0.2s ease;
    }
    .hint {
      font-size: 16px;
      margin: 0 0 18px;
      color: #555;
    }
    button:focus-visible {
      outline: 3px solid #0047ab;
      outline-offset: 3px;
    }
    .dragging {
      opacity: 0.55;
    }
    .hover {
      outline: 3px solid #00b8f0;
      background-color: #e0f7fa;
    }
    @media (max-width: 650px) {
      body {
        padding: 8px;
        align-items: flex-start;
      }
      .quiz-box {
        padding: 16px 12px;
        border-radius: 20px;
      }
      h1 {
        font-size: 22px;
      }
      .question-box {
        padding: 13px;
        font-size: 18px;
      }
      .option, .word, .blank {
        font-size: 18px;
      }
      .actions button {
        width: 100%;
        margin: 6px 0;
      }
    }
  </style>
</head>
<body>
  <main class="quiz-box">
    <h1>रिक्त स्थान पूर्ति कीजिए–</h1>
    <p class="hint">शब्द खींचकर रिक्त स्थान में रखें या शब्द चुनकर रिक्त स्थान पर टैप करें। शब्द हटाने के लिए भरे हुए स्थान पर टैप करें।</p>
    
    <div class="help-box" id="bank" aria-label="सहायता शब्द"></div>
    <div id="quiz"></div>
    
    <div class="actions">
      <button onclick="check()">उत्तर जाँचें</button>
      <button onclick="reset()">फिर से करें</button>
    </div>
    
    <div id="result" role="status" aria-live="polite"></div>
  </main>

  <script>
    const words = ["अनुनासिक", "उनतालीस", "वर्ण", "ही", "आगत"];
    const answers = [2, 4, 0, 1, 3];
    const sentences = [
      ["भाषा की सबसे छोटी इकाई", "है।"],
      ["विदेशी भाषा के शब्द जो हिंदी में आ गए हैं, उन्हें", "ध्वनियाँ कहा जाता है।"],
      ["चंद्रबिंदु को", "कहते हैं।"],
      ["हिंदी में कुल", "व्यंजन हैं।"],
      ["व्यंजन वर्णों का उच्चारण स्वर वर्णों से होता", "है।"]
    ];
    const letters = ['क', 'ख', 'ग', 'घ', 'ङ'];
    
    let slots = Array(answers.length).fill(null);
    let chosen = null;
    let drag = null;
    let suppress = false;

    const bank = document.querySelector('#bank');
    const quiz = document.querySelector('#quiz');
    const result = document.querySelector('#result');

    function put(w, i) {
      slots = slots.map(x => x === w ? null : x);
      slots[i] = w;
      chosen = null;
      render();
    }

    function render() {
      bank.innerHTML = '';
      quiz.innerHTML = '';

      words.forEach((w, k) => {
        if (slots.includes(k)) return;
        const b = document.createElement('button');
        b.className = 'word' + (chosen === k ? ' selected' : '');
        b.textContent = w;
        b.dataset.word = k;
        b.setAttribute('aria-pressed', chosen === k);
        b.onclick = () => {
          chosen = chosen === k ? null : k;
          render();
        };
        bank.append(b);
      });

      sentences.forEach((s, i) => {
        const row = document.createElement('div');
        row.className = 'question-box';
        row.append(`(${letters[i]}) ${s[0]} `);

        const b = document.createElement('button');
        b.className = 'blank';
        b.dataset.slot = i;
        b.textContent = slots[i] === null ? 'यहाँ रखें' : words[slots[i]];
        b.setAttribute('aria-label', `रिक्त स्थान ${i + 1}: ${b.textContent}`);
        b.onclick = () => {
          if (chosen !== null) {
            put(chosen, i);
          } else if (slots[i] !== null) {
            slots[i] = null;
            render();
          }
        };

        row.append(b, ' ' + s[1]);
        quiz.append(row);
      });

      // Updated score display denominator from 5 to 4
      result.textContent = 'अंक: — / 4';
    }

    document.addEventListener('pointerdown', e => {
      const b = e.target.closest('.word');
      if (!b) return;
      drag = {
        word: +b.dataset.word,
        x: e.clientX,
        y: e.clientY,
        moved: false,
        el: b
      };
      b.setPointerCapture(e.pointerId);
    });

    document.addEventListener('pointermove', e => {
      if (!drag) return;
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
        drag.moved = true;
        drag.el.classList.add('dragging');
        document.querySelectorAll('.hover').forEach(x => x.classList.remove('hover'));
        document.elementFromPoint(e.clientX, e.clientY)?.closest('.blank')?.classList.add('hover');
      }
    });

    document.addEventListener('pointerup', e => {
      if (!drag) return;
      const d = drag;
      drag = null;
      d.el.classList.remove('dragging');
      document.querySelectorAll('.hover').forEach(x => x.classList.remove('hover'));

      if (d.moved) {
        const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.blank');
        if (target) {
          put(d.word, +target.dataset.slot);
        }
        suppress = true;
        setTimeout(() => suppress = false, 0);
      }
    });

    document.addEventListener('click', e => {
      if (suppress) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);

    document.addEventListener('pointercancel', () => {
      drag = null;
      document.querySelectorAll('.dragging, .hover').forEach(x => x.classList.remove('dragging', 'hover'));
    });

    function check() {
      let n = 0;
      quiz.querySelectorAll('.blank').forEach((b, i) => {
        b.classList.remove('correct', 'wrong');
        const ok = slots[i] === answers[i];
        b.classList.add(ok ? 'correct' : 'wrong');
        b.setAttribute('aria-label', `रिक्त स्थान ${i + 1}: ${b.textContent}, ${ok ? 'सही' : 'गलत'}`);
        if (ok) n++;
      });
      // Updated maximum score display from 5 to 4
      result.textContent = `अंक: ${n} / 4`;
    }

    function reset() {
      slots.fill(null);
      chosen = null;
      render();
    }

    // Initial render
    render();
  </script>
</body>
</html>
