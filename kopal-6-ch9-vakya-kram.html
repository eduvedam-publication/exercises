<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>शब्दों को उचित क्रम देकर शुद्ध वाक्य की संरचना कीजिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#b9f9fc;font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;color:#183243;font-size:18px}.sheet{max-width:1040px;margin:24px auto;background:#fff;border:3px solid #03a9f4;border-radius:20px;padding:22px 25px}h1{font-size:27px;color:#00a5ee;margin:0 0 18px}.item{background:#e0f8ff;border:1.5px solid #00aeff;border-radius:12px;margin:9px 0;padding:12px 14px}.q{margin-bottom:9px;line-height:1.7}.opts,.bank{display:flex;flex-wrap:wrap;gap:9px}.choice,.chip,.slot{font:inherit;background:#fff;border:1.5px solid #1eb9ff;border-radius:9px;color:#183243;padding:7px 13px;cursor:pointer;min-height:40px}.choice.selected,.chip.selected,.slot.selected{background:#b0edff;border-color:#008be5}.choice.correct,.slot.correct{background:#d6f9df;border-color:#21a957;color:#146b31}.choice.wrong,.slot.wrong{background:#ffe0e0;border-color:#e33;color:#a00}.slot{border-style:dashed;border-color:#ff716c;min-width:135px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin:0 4px}.bank{background:#d4f8ff;padding:10px;border-radius:10px;margin:8px 0 12px}.chip.used{opacity:.4}.footer{text-align:center;margin-top:22px}.action{border:0;border-radius:25px;padding:11px 20px;margin:3px;background:#ff7900;color:white;font-weight:700;cursor:pointer}.score{font-size:21px;color:#003cdb;font-weight:bold;margin-top:9px}.note{font-size:15px;color:#526978;margin-bottom:10px}.answer{font-size:15px;color:#167037;margin-top:7px}.sentence{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.word{font:inherit;border:1px solid #19b4fc;border-radius:7px;background:#fff;padding:6px 10px;cursor:pointer}.word.used{opacity:.35}.built{min-height:44px;padding:7px;border:1px dashed #ff8278;border-radius:8px;display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.built .word{background:#b9ecff}@media(max-width:600px){body{font-size:16px}.sheet{margin:6px;padding:12px;border-radius:12px}h1{font-size:21px}.choice,.chip,.slot{padding:7px 9px}.action{padding:10px 13px}}</style></head><body><main class="sheet"><h1>शब्दों को उचित क्रम देकर शुद्ध वाक्य की संरचना कीजिए–</h1><div class="note">शब्दों पर सही क्रम में क्लिक करें। चुने गए शब्द पर दोबारा क्लिक करके हटाएँ।</div><div id="questions"></div><div class="footer"><button class="action" id="submit">Submit</button><button class="action" id="show">Show Answer</button><button class="action" id="reset">Reset</button><div class="score" id="score">Marks: 0 / 4</div></div></main><script>const TYPE="order";const DATA=[{"q": "बीमार सदानंद थे लाला।", "a": "लाला सदानंद बीमार थे।", "words": ["बीमार", "सदानंद", "थे", "लाला"]}, {"q": "होश आया देर बाद कुछ सदानंद लाला को।", "a": "कुछ देर बाद लाला सदानंद को होश आया।", "words": ["होश", "आया", "देर", "बाद", "कुछ", "सदानंद", "लाला", "को"]}, {"q": "भरी साँस ठंडी उन्होंने एक।", "a": "उन्होंने एक ठंडी साँस भरी।", "words": ["भरी", "साँस", "ठंडी", "उन्होंने", "एक"]}, {"q": "बोल रहे झूठ आप हैं।", "a": "आप झूठ बोल रहे हैं।", "words": ["बोल", "रहे", "झूठ", "आप", "हैं"]}];const KEY='kopal6ch9-'+TYPE;let answers={};try{answers=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};const root=document.getElementById('questions');const score=document.getElementById('score');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(answers))}catch(e){}};const safe=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function mark(n){score.textContent='Marks: '+n+' / '+DATA.length}function reset(){answers={};save();render();mark(0)}function show(){DATA.forEach((d,i)=>answers[i]=d.a);save();render();mark(DATA.length)}document.getElementById('reset').onclick=reset;document.getElementById('show').onclick=show;function norm(s){return s.replace(/[।,?]/g,'').trim().replace(/\s+/g,' ')}function render(){root.innerHTML=DATA.map((d,i)=>{const chosen=answers[i]||[];return `<section class="item"><div class="q">(${['क','ख','ग','घ'][i]}) ${safe(d.q)}</div><div class="built" data-built="${i}">${chosen.map((idx,k)=>`<button class="word" data-remove="${i}" data-pos="${k}">${safe(d.words[idx])}</button>`).join('')}</div><div class="sentence">${d.words.map((w,j)=>`<button class="word ${chosen.includes(j)?'used':''}" data-add="${i}" data-word="${j}" ${chosen.includes(j)?'disabled':''}>${safe(w)}</button>`).join('')}</div></section>`}).join('');root.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const i=+b.dataset.add;answers[i]=[...(answers[i]||[]),+b.dataset.word];save();render()});root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{answers[b.dataset.remove].splice(+b.dataset.pos,1);save();render()})}document.getElementById('submit').onclick=()=>{let n=0;root.querySelectorAll('[data-built]').forEach((b,i)=>{const got=(answers[i]||[]).map(j=>DATA[i].words[j]).join(' ');const good=norm(got)===norm(DATA[i].a);if(good)n++;b.style.borderColor=good?'#21a957':'#e33'});mark(n)};document.getElementById('show').onclick=()=>{DATA.forEach((d,i)=>{const correct=norm(d.a).split(' ');const used=[];answers[i]=correct.map(w=>{let idx=d.words.findIndex((v,j)=>!used.includes(j)&&norm(v)===norm(w));if(idx<0)idx=d.words.findIndex((v,j)=>!used.includes(j));used.push(idx);return idx})});save();render();mark(DATA.length)}
render();</script></body></html>
