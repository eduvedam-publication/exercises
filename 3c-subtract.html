<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subtract the following</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1050px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 22px;color:#00a5dc;font-size:25px}
.grid{display:grid;grid-template-columns:repeat(4,155px);justify-content:space-between;gap:22px;padding:0 15px}
.item{width:155px;display:grid;grid-template-columns:26px 128px;align-items:start}
.letter{font-family:Georgia,"Times New Roman",serif;font-size:19px;padding-top:7px}
.sum{width:128px;height:142px;background:#dceefa;padding:7px 8px}
.place{height:35px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;align-items:center;color:#ff4050;font-family:Georgia,serif;font-size:20px}
.row{height:32px;display:grid;grid-template-columns:24px repeat(3,1fr);align-items:center;text-align:center;font-family:Georgia,serif;font-size:20px}
.minus{border-bottom:2px solid #00aee8}
.answer{display:block;width:112px;height:31px;margin:2px auto 0;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:2px 5px;outline:none}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,155px);justify-content:space-around}}
@media(max-width:400px){.exercise{margin:0;border-radius:0;padding:14px}.grid{grid-template-columns:155px;justify-content:center}h1{font-size:21px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Subtract the following:</h1>
<div class="grid" id="grid"></div>

<div class="actions">
<button onclick="checkAnswers()">Check Answers</button>
<button onclick="resetExercise()">Reset</button>
</div>
<div id="result">Score: 0 / 4</div>
</main>

<script>
const data=[
 ["a",[4,6,3],[1,2,3],340],
 ["b",[2,8,9],[1,1,4],175],
 ["c",[3,4,5],[3,4,3],2],
 ["d",[1,6,7],[1,0,7],60]
];

const grid=document.getElementById("grid");
data.forEach((x,i)=>{
 grid.insertAdjacentHTML("beforeend",`
 <div class="item">
  <div class="letter">${x[0]}.</div>
  <div class="sum">
   <div class="place"><span>H</span><span>T</span><span>O</span></div>
   <div class="row"><span></span><span>${x[1][0]}</span><span>${x[1][1]}</span><span>${x[1][2]}</span></div>
   <div class="row minus"><span>−</span><span>${x[2][0]}</span><span>${x[2][1]}</span><span>${x[2][2]}</span></div>
   <input id="ans${i}" class="answer" inputmode="numeric">
  </div>
 </div>`);
});

function checkAnswers(){
 let score=0;
 data.forEach((x,i)=>{
  const e=document.getElementById("ans"+i);
  const ok=e.value.trim()===String(x[3]);
  e.className="answer "+(ok?"ok":"bad");
  if(ok)score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 4`;
}
function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{e.value="";e.className="answer"});
 document.getElementById("result").textContent="Score: 0 / 4";
}
</script>
</body>
</html>
