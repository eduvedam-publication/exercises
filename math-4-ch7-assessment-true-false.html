<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>State true or false.</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;font-family:Georgia,serif;color:#18232b}.exercise{max-width:980px;margin:20px auto;padding:26px;border:3px solid #00afe0;border-radius:25px;background:white}h2{color:#00a9df;margin:0 0 18px;font-size:24px}.question{padding:12px 14px;margin:10px 0;border:1.5px solid #00baff;border-radius:12px;background:#eafaff;font-size:19px}.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.opt{border:1px solid #9bdff1;background:#fff;border-radius:8px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;font-size:17px}.opt input{accent-color:#00a7d9;width:20px;height:20px}.opt.selected{border:2px solid #00a6db;background:#ddf5ff}.answer{width:66px;border:2px solid #ff4c64;background:white;height:38px;text-align:center;font:19px Georgia}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;align-items:center;line-height:1.2;min-width:35px}.frac>*{padding:2px 5px}.frac>*:first-child{border-bottom:1.5px solid #222}.frac .answer{width:58px;height:34px}.rowq{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.actions{display:flex;justify-content:center;gap:14px;margin-top:22px}button{border:0;background:#ff8000;color:#fff;border-radius:22px;padding:11px 21px;font-weight:bold;cursor:pointer}.status{text-align:center;color:#0758ae;font:17px Arial;margin-top:12px;min-height:22px}.correct{border-color:#1aaf63!important;background:#e0f8e9!important}.wrong{border-color:#f13246!important;background:#ffe6e8!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff858d}}@media(max-width:700px){.exercise{margin:5px;padding:14px}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}.question{font-size:17px}}</style></head><body data-kind="tf"><main class="exercise"><h2>State true or false.</h2><div class="question"><div class="rowq"><b>a.</b> The denominator of a unit fraction is 1. <span style="margin-left:auto"><div class="opts" data-group="0"><label class="opt"><span>i. True</span><input type="radio" name="q0" id="q0o0" data-answer="false"></label><label class="opt"><span>ii. False</span><input type="radio" name="q0" id="q0o1" data-answer="true"></label></div></span></div></div><div class="question"><div class="rowq"><b>b.</b> <span class="frac"><span>4</span><span>7</span></span> and <span class="frac"><span>28</span><span>49</span></span> are equivalent fractions. <span style="margin-left:auto"><div class="opts" data-group="1"><label class="opt"><span>i. True</span><input type="radio" name="q1" id="q1o0" data-answer="true"></label><label class="opt"><span>ii. False</span><input type="radio" name="q1" id="q1o1" data-answer="false"></label></div></span></div></div><div class="question"><div class="rowq"><b>c.</b> <span class="frac"><span>1</span><span>11</span></span> < <span class="frac"><span>3</span><span>11</span></span> <span style="margin-left:auto"><div class="opts" data-group="2"><label class="opt"><span>i. True</span><input type="radio" name="q2" id="q2o0" data-answer="true"></label><label class="opt"><span>ii. False</span><input type="radio" name="q2" id="q2o1" data-answer="false"></label></div></span></div></div><div class="question"><div class="rowq"><b>d.</b> <span class="frac"><span>1</span><span>7</span></span> and <span class="frac"><span>1</span><span>9</span></span> are like fractions. <span style="margin-left:auto"><div class="opts" data-group="3"><label class="opt"><span>i. True</span><input type="radio" name="q3" id="q3o0" data-answer="false"></label><label class="opt"><span>ii. False</span><input type="radio" name="q3" id="q3o1" data-answer="true"></label></div></span></div></div><div class="actions"><button onclick="mark()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="status" class="status" aria-live="polite"></div></main><script>const KEY='math4-ch7-assessment-'+document.body.dataset.kind;const inputs=[...document.querySelectorAll('[data-answer]')];function save(){let data={};inputs.forEach(e=>{data[e.id]=e.type==='radio'?e.checked:e.value});localStorage.setItem(KEY,JSON.stringify(data))}function restore(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');inputs.forEach(e=>{if(d[e.id]!==undefined){if(e.type==='radio')e.checked=d[e.id];else e.value=d[e.id]}})}catch(e){}}function clearFeedback(){document.querySelectorAll('.correct,.wrong,.selected').forEach(e=>e.classList.remove('correct','wrong','selected'))}function mark(){clearFeedback();let good=0,total=0;document.querySelectorAll('[data-group]').forEach(g=>{total++;let checked=g.querySelector('input:checked');if(checked){let ok=checked.dataset.answer==='true';checked.closest('.opt').classList.add(ok?'correct':'wrong');if(ok)good++}});document.querySelectorAll('input.answer').forEach(e=>{total++;let ok=e.value.trim().replace(/\s/g,'').toLowerCase()===e.dataset.answer.toLowerCase();e.classList.add(ok?'correct':'wrong');if(ok)good++});document.getElementById('status').textContent=good===total?'All answers are correct!':'Answers checked. Correct answers are green; incorrect answers are red.';save()}function resetAll(){inputs.forEach(e=>{if(e.type==='radio')e.checked=false;else e.value=''});clearFeedback();document.getElementById('status').textContent='';localStorage.removeItem(KEY)}inputs.forEach(e=>e.addEventListener('change',()=>{clearFeedback();save()}));document.querySelectorAll('.opt').forEach(e=>e.addEventListener('click',()=>{setTimeout(()=>{clearFeedback();document.querySelectorAll('.opt input:checked').forEach(x=>x.closest('.opt').classList.add('selected'));save()},0)}));restore();document.querySelectorAll('.opt input:checked').forEach(x=>x.closest('.opt').classList.add('selected'));</script></body></html>
