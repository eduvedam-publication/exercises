<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial;color:#111}.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{color:#00a5dc;font-size:25px;margin:0 0 25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:28px}.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:white;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}input,select{border:2px solid #ff3b30;background:#fff;height:40px;font-size:18px;padding:5px 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 45px}.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font:20px Georgia}.row input{width:125px}</style></head><body><main class="ex"><h1>Fill in the empty boxes:</h1><div class="grid"><div class="row"><span>a. 16 ÷ 1 =</span><input id="a0"><span></span></div><div class="row"><span>b. </span><input id="a1"><span> ÷ 25 = 0</span></div><div class="row"><span>c. 49 ÷ 1 =</span><input id="a2"><span></span></div><div class="row"><span>d. 0 ÷ 63 =</span><input id="a3"><span></span></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score"></div><script>const ans=['16', '0', '49', '0'];score.textContent="Score: 0 / "+ans.length;function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),o=e.value.trim().toLowerCase()===a.toLowerCase();e.className=o?"ok":"bad";if(o)s++});score.textContent=`Score: ${s} / ${ans.length}`}function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.className=""});score.textContent="Score: 0 / "+ans.length}</script></main></body></html>
