<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find the quotient and remainder</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#222}
.exercise{max-width:950px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 28px;color:#00a5dc;font-size:25px}
.questions{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.q{border:1px solid #aee8f8;border-radius:18px;padding:20px;background:#f8fdff}
.sum{font-family:Georgia,"Times New Roman",serif;font-size:24px;text-align:center;margin-bottom:18px}
.fields{display:flex;flex-direction:column;gap:10px}
.field{display:flex;align-items:center;gap:8px;font-size:17px}
.field label{width:92px}
.answer{width:100%;min-width:0;height:37px;border:2px solid #ff3b30;background:#fff;font-size:17px;padding:4px 7px;outline:none}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:700px){.questions{grid-template-columns:1fr}.exercise{margin:0;border-radius:0;padding:16px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Find the quotient and the remainder.</h1>

<div class="questions">
 <div class="q">
  <div class="sum">a. &nbsp;46 ÷ 3</div>
  <div class="fields">
   <div class="field"><label>Quotient</label><input id="a0" class="answer" inputmode="numeric"></div>
   <div class="field"><label>Remainder</label><input id="a1" class="answer" inputmode="numeric"></div>
  </div>
 </div>

 <div class="q">
  <div class="sum">b. &nbsp;89 ÷ 8</div>
  <div class="fields">
   <div class="field"><label>Quotient</label><input id="a2" class="answer" inputmode="numeric"></div>
   <div class="field"><label>Remainder</label><input id="a3" class="answer" inputmode="numeric"></div>
  </div>
 </div>

 <div class="q">
  <div class="sum">c. &nbsp;73 ÷ 6</div>
  <div class="fields">
   <div class="field"><label>Quotient</label><input id="a4" class="answer" inputmode="numeric"></div>
   <div class="field"><label>Remainder</label><input id="a5" class="answer" inputmode="numeric"></div>
  </div>
 </div>
</div>

<div class="actions">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetExercise()">Reset</button>
</div>
<div id="result">Score: 0 / 3</div>
</main>

<script>
const answers=["15","1","11","1","12","1"];

function checkAnswers(){
 let score=0;
 answers.forEach((v,i)=>{
  const e=document.getElementById("a"+i);
  const ok=e.value.trim()===v;
  e.className="answer "+(ok?"ok":"bad");
  if(ok)score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 3`;
}

function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{
  e.value="";
  e.className="answer";
 });
 document.getElementById("result").textContent="Score: 0 / 3";
}
</script>
</body>
</html>
