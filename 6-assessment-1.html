<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6 Assessment 1</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}
.q{font-family:Georgia,"Times New Roman",serif;font-size:20px;margin:0 0 23px}
.qt{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;margin:11px 0 0 25px}
.opt{min-width:115px;border:2px solid #ff1680;border-radius:11px;background:#fff;color:#111;padding:9px 15px;font-size:17px;cursor:pointer}
.opt.sel{background:#fff0f6}
.ok{background:#dcf8df!important;border-color:#009b8e!important}
.bad{background:#ffe1e1!important;border-color:#e43d30!important}
.frac{display:inline-grid;grid-template-rows:auto auto;text-align:center;vertical-align:middle;line-height:1.05;margin:0 3px}
.frac span:first-child{border-bottom:1.5px solid #111;padding:0 3px 2px}
.frac span:last-child{padding-top:2px}
.figure{display:inline-block;width:40px;height:40px;border:1px solid #777;position:relative;background:#fff;margin:0 8px;vertical-align:middle;overflow:hidden}
.figure:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#f1a54b 0 2px,transparent 2px 4px);clip-path:polygon(0 0,100% 0,100% 100%)}
.figure:after{content:"";position:absolute;inset:0;border-bottom:1px solid #777;transform:rotate(45deg) scale(1.42)}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}
.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}
@media(max-width:700px){body{padding:0}.exercise{border-radius:0;padding:16px}.opt{min-width:100px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Choose the correct option.</h1>

<div class="q" data-a="0">
 <div class="qt">a. The numerator of the fraction <span class="frac"><span>4</span><span>5</span></span> is.</div>
 <div class="opts">
  <button class="opt" data-v="0">i. 4</button><button class="opt" data-v="1">ii. 5</button>
  <button class="opt" data-v="2">iii. 10</button><button class="opt" data-v="3">iv. 12</button>
 </div>
</div>

<div class="q" data-a="2">
 <div class="qt">b. The numerator and the denominator are the same in.</div>
 <div class="opts">
  <button class="opt" data-v="0">i. Odd number</button><button class="opt" data-v="1">ii. Fraction</button>
  <button class="opt" data-v="2">iii. Whole number</button><button class="opt" data-v="3">iv. New number</button>
 </div>
</div>

<div class="q" data-a="2">
 <div class="qt">c. The fraction <span class="frac"><span>3</span><span>4</span></span> means ______ parts out of 4.</div>
 <div class="opts">
  <button class="opt" data-v="0">i. 1</button><button class="opt" data-v="1">ii. 2</button>
  <button class="opt" data-v="2">iii. 3</button><button class="opt" data-v="3">iv. 4</button>
 </div>
</div>

<div class="q" data-a="1">
 <div class="qt">d. The figure <span class="figure"></span> shows.</div>
 <div class="opts">
  <button class="opt" data-v="0">i. <span class="frac"><span>1</span><span>2</span></span></button>
  <button class="opt" data-v="1">ii. <span class="frac"><span>1</span><span>3</span></span></button>
  <button class="opt" data-v="2">iii. <span class="frac"><span>1</span><span>4</span></span></button>
  <button class="opt" data-v="3">iv. 1</button>
 </div>
</div>

<div class="q" data-a="1">
 <div class="qt">e. If you divide a cake into three equal parts, each part is equal to.</div>
 <div class="opts">
  <button class="opt" data-v="0">i. <span class="frac"><span>1</span><span>2</span></span></button>
  <button class="opt" data-v="1">ii. <span class="frac"><span>1</span><span>3</span></span></button>
  <button class="opt" data-v="2">iii. <span class="frac"><span>1</span><span>4</span></span></button>
  <button class="opt" data-v="3">iv. <span class="frac"><span>1</span><span>5</span></span></button>
 </div>
</div>

<div class="actions">
<button class="action" onclick="check()">Check Answers</button>
<button class="action" onclick="resetAll()">Reset</button>
</div>
<div id="score" class="score">Score: 0 / 5</div>
</main>

<script>
document.querySelectorAll(".q").forEach(q=>{
 q.querySelectorAll(".opt").forEach(b=>{
  b.onclick=()=>{
   q.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel","ok","bad"));
   b.classList.add("sel"); q.dataset.pick=b.dataset.v;
  };
 });
});
function check(){
 let s=0;
 document.querySelectorAll(".q").forEach(q=>{
  const p=q.dataset.pick;
  q.querySelectorAll(".opt").forEach(b=>{
   b.classList.remove("ok","bad");
   if(b.dataset.v===p) b.classList.add(p===q.dataset.a?"ok":"bad");
  });
  if(p===q.dataset.a)s++;
 });
 score.textContent=`Score: ${s} / 5`;
}
function resetAll(){
 document.querySelectorAll(".q").forEach(q=>{
  delete q.dataset.pick;
  q.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel","ok","bad"));
 });
 score.textContent="Score: 0 / 5";
}
</script>
</body>
</html>
