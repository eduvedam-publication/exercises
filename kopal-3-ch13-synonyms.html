<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-2-ch13-synonyms</title><style>
*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#172a36}.exercise{max-width:900px;margin:14px auto;background:#fff;border:3px solid #05a9d5;border-radius:20px;padding:20px 25px;min-height:440px;display:flex;flex-direction:column}h2{color:#ff0062;font-size:23px;margin:0 0 14px;font-weight:600}.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:#e4faff;border-radius:10px;padding:12px;margin-bottom:14px}.chip{border:1.5px solid #00a8dc;border-radius:8px;background:white;padding:7px 11px;font-size:17px;cursor:grab;touch-action:manipulation}.chip.selected{background:#b9efff;outline:2px solid #008dc2}.chip.used{opacity:.4}.line{border:1px solid #00c8ee;background:#f3fcfe;border-radius:9px;padding:9px 12px;margin:5px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:18px}.word{min-width:100px}.blank{display:inline-flex;min-width:128px;min-height:37px;align-items:center;justify-content:center;border:2px dashed #ff644b;border-radius:7px;padding:4px 9px;cursor:pointer;background:white;font-size:17px}.blank.empty:after{content:'________';color:#aaa}.blank.ok{background:#d2f5d7;border-color:#15a344}.blank.bad{background:#ffdddd;border-color:red;animation:blink .45s 3}@keyframes blink{50%{background:#ff5555}}.actions{display:flex;justify-content:center;gap:8px;margin-top:auto;padding-top:20px}button{background:white;border:2px solid #ff0062;border-radius:9px;padding:8px 16px;cursor:pointer;font-size:15px}.score{text-align:center;color:#0072b9;font-weight:bold;margin-top:9px}@media(max-width:650px){.exercise{margin:0;border-radius:0;padding:14px;min-height:100vh}.line{font-size:16px}.blank{min-width:100px}.chip{font-size:15px}}
</style></head><body><main class="exercise"><h2>शब्दों के पर्यायवाची शब्द ढूँढ़कर लिखिए–</h2><div class="bank" id="bank"></div><div id="rows"></div><div class="actions"><button onclick="submitAnswers()">Submit</button><button onclick="resetAll()">Reset</button></div><div class="score" id="result">Score: 0 / 12</div></main><script>
const words=['अभिलाषा','मनुज','वेदना','अभिमान','आदमी','वदन','कामना','निदान','दुख','घमंड','हल','चेहरा'];
const questions=[['(क)','मनुष्य',['मनुज','आदमी']],['(ख)','कष्ट',['वेदना','दुख']],['(ग)','मुख',['वदन','चेहरा']],['(घ)','समाधान',['निदान','हल']],['(ङ)','गर्व',['अभिमान','घमंड']],['(च)','इच्छा',['अभिलाषा','कामना']]];
const key='kopal-2-ch13-synonyms-drag-v1';let slots=Array(12).fill(null),selected=null;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(saved)&&saved.length===12)slots=saved.map(v=>words.includes(v)?v:null)}catch(e){}
function save(){localStorage.setItem(key,JSON.stringify(slots))}
function render(){const bank=document.getElementById('bank');bank.innerHTML='';words.forEach(w=>{const b=document.createElement('button');b.className='chip'+(selected===w?' selected':'')+(slots.includes(w)?' used':'');b.textContent=w;b.draggable=!slots.includes(w);b.onclick=()=>{if(slots.includes(w))return;selected=selected===w?null:w;render()};b.ondragstart=e=>{selected=w;e.dataTransfer.setData('text/plain',w)};bank.appendChild(b)});const rows=document.getElementById('rows');rows.innerHTML='';questions.forEach((q,i)=>{const row=document.createElement('div');row.className='line';const label=document.createElement('span');label.className='word';label.textContent=q[0]+' '+q[1]+' —';row.appendChild(label);for(let j=0;j<2;j++){const idx=i*2+j;const blank=document.createElement('span');blank.className='blank'+(slots[idx]?'':' empty');blank.textContent=slots[idx]||'';blank.setAttribute('role','button');blank.setAttribute('tabindex','0');blank.setAttribute('aria-label',q[1]+' पर्यायवाची '+(j+1));blank.onclick=()=>{if(selected){const old=slots.indexOf(selected);if(old!==-1)slots[old]=null;slots[idx]=selected;selected=null}else slots[idx]=null;save();render()};blank.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();blank.click()}};blank.ondragover=e=>e.preventDefault();blank.ondrop=e=>{e.preventDefault();const w=e.dataTransfer.getData('text/plain');if(words.includes(w)){const old=slots.indexOf(w);if(old!==-1)slots[old]=null;slots[idx]=w;selected=null;save();render()}};row.appendChild(blank)}rows.appendChild(row)})}
function submitAnswers(){let score=0;document.querySelectorAll('.line').forEach((row,i)=>{row.querySelectorAll('.blank').forEach((b,j)=>{const val=slots[i*2+j],ok=questions[i][2].includes(val)&&val!==null;if(ok)score++;b.classList.remove('ok','bad');void b.offsetWidth;b.classList.add(ok?'ok':'bad')})});document.getElementById('result').textContent='Score: '+score+' / 12';save()}
function resetAll(){slots=Array(12).fill(null);selected=null;localStorage.removeItem(key);document.getElementById('result').textContent='Score: 0 / 12';render()}
render();
</script></body></html>
