<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOPAL Hindi 4 Chapter 10 MCQ</title><style>
*{box-sizing:border-box}body{margin:0;background:#e4f8ff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#263b44}.wrap{max-width:1000px;margin:22px auto;background:#fff;border:3px solid #00bde8;border-radius:18px;padding:24px}h2{margin:0 0 8px;color:#ff3988;font-size:25px}.meta{color:#527783;margin:0 0 18px}.q{background:#effbff;border:1px solid #8cdef4;border-radius:12px;padding:15px;margin:12px 0;font-size:18px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid #ff8bb7;border-radius:8px;padding:10px;cursor:pointer}.opt.sel{background:#ffe5ef;border-color:#ff3988}.correct{background:#dcf8e5!important;border-color:#20a653!important}.wrong{background:#ffe0e0!important;border-color:#e43d3d!important}.q select{font:inherit;width:100%;margin-top:12px;padding:10px;border:1.5px solid #00bde8;border-radius:8px;background:#fff}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button{border:0;border-radius:24px;padding:11px 21px;background:#ff3988;color:white;font-weight:bold;cursor:pointer;font-size:15px}#score{text-align:center;color:#087fa7;font-weight:bold;font-size:19px;margin-top:15px}@media(max-width:650px){.wrap{margin:8px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}
</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ–</h2><p class="meta">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 5</p><section id="questions"></section><script>
const data=[["पाठ में किसकी आत्मकथा का वर्णन किया गया है?", ["हिमालय", "गंगा", "नदी"], 2], ["नदी ने अपना पिता किसे बताया है?", ["पर्वत", "हिमालय", "राजा"], 1], ["पिता का घर छोड़ते समय नदी थी—", ["खुश", "दुखी", "घबराई हुई"], 1], ["नदी से बिजली का क्या संबंध है?", ["पानी में बिजली मिली होती है।", "नदी का बाँध बनाकर बिजली बनती है।", "बिजली ही नदी का प्राण होती है।"], 1], ["‘आज वे ही कृतघ्न हो गए हैं’ इसमें ‘कृतघ्न’ का अर्थ क्या है?", ["जो उपकार को न माने", "जो उपकार करे", "जो उपकार को माने"], 0]];let answers={};const root=document.getElementById('questions');
function render(){root.innerHTML=data.map((q,i)=>`<div class="q" id="q${i}"><b>(${'कखगघङ'[i]}) ${q[0]}</b><div class="opts">${q[1].map((o,j)=>`<div class="opt ${answers[i]===j?'sel':''}" id="o${i}-${j}" role="button" tabindex="0" onclick="pick(${i},${j})"><span>(${'i ii iii'.split(' ')[j]}) ${o}</span><span>${answers[i]===j?'☑':'□'}</span></div>`).join('')}</div></div>`).join('')}
function pick(i,j){answers[i]=j;render()}
function check(){let s=0;data.forEach((q,i)=>{document.querySelectorAll('#q'+i+' .opt').forEach(e=>e.classList.remove('correct','wrong'));if(answers[i]!==undefined){let e=document.getElementById('o'+i+'-'+answers[i]),ok=answers[i]===q[2];e.classList.add(ok?'correct':'wrong');if(ok)s++}});document.getElementById('score').textContent=`प्राप्तांक: ${s} / 5`}
function showAnswers(){answers={};data.forEach((q,i)=>answers[i]=q[2]);render();check()}
function resetAll(){answers={};render();document.getElementById('score').textContent='प्राप्तांक: 0 / 5'}render();
</script><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 5</div></main></body></html>
