<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOPAL Class 7 Chapter 16 varn-vichhed — 2026–27</title><style>
*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#172a36}.exercise{max-width:900px;margin:14px auto;background:#fff;border:3px solid #05a9d5;border-radius:20px;padding:20px 25px;min-height:440px;display:flex;flex-direction:column}h2{color:#ff0062;font-size:23px;margin:0 0 14px;font-weight:600}.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:#e4faff;border-radius:10px;padding:12px;margin-bottom:14px}.chip{border:1.5px solid #00a8dc;border-radius:8px;background:white;padding:7px 11px;font-size:17px;cursor:grab;touch-action:manipulation}.chip.selected{background:#b9efff;outline:2px solid #008dc2}.chip.used{opacity:.4}.line{border:1px solid #00c8ee;background:#f3fcfe;border-radius:9px;padding:9px 12px;margin:5px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:18px}.word{min-width:100px}.blank{display:inline-flex;min-width:128px;min-height:37px;align-items:center;justify-content:center;border:2px dashed #ff644b;border-radius:7px;padding:4px 9px;cursor:pointer;background:white;font-size:17px}.blank.empty:after{content:'________';color:#aaa}.blank.ok{background:#d2f5d7;border-color:#15a344}.blank.bad{background:#ffdddd;border-color:red;animation:blink .45s 3}@keyframes blink{50%{background:#ff5555}}.actions{display:flex;justify-content:center;gap:8px;margin-top:auto;padding-top:20px}button{background:white;border:2px solid #ff0062;border-radius:9px;padding:8px 16px;cursor:pointer;font-size:15px}@media(max-width:650px){.exercise{margin:0;border-radius:0;padding:14px;min-height:100vh}.line{font-size:16px}.blank{min-width:100px}.chip{font-size:15px}}
.blank{min-width:55px}.blank.empty:after{content:"____"}.word{min-width:85px}</style></head><body><main class="exercise"><h2>निम्नलिखित शब्दों के वर्ण-विच्छेद कीजिए–</h2><div class="bank" id="bank"></div><p>शब्द-खंड को खींचकर या चुनकर सही बॉक्स में रखें। एक खंड का दोबारा उपयोग कर सकते हैं।</p><p class="example">(क) राज्य = र् + आ + ज् + य् + अ</p><div id="rows"></div><div class="actions"><button onclick="submitAnswers()">Submit</button><button onclick="resetAll()">Reset</button></div></main><script>const questions=[["(ख)", "मनोरंजन", ["म्", "अ", "न्", "ओ", "र्", "अं", "ज्", "अ", "न्", "अ"]], ["(ग)", "ब्राह्मण", ["ब्", "र्", "आ", "ह्", "म्", "अ", "ण्", "अ"]], ["(घ)", "तेलुगु", ["त्", "ए", "ल्", "उ", "ग्", "उ"]], ["(ङ)", "संकट", ["स्", "अं", "क्", "अ", "ट्", "अ"]], ["(च)", "धन्य", ["ध्", "अ", "न्", "य्", "अ"]], ["(छ)", "ठहरा", ["ठ्", "अ", "ह्", "अ", "र्", "आ"]]];
const words=["म्", "अ", "न्", "ओ", "र्", "अं", "ज्", "ब्", "आ", "ह्", "ण्", "त्", "ए", "ल्", "उ", "ग्", "स्", "क्", "ट्", "ध्", "य्", "ठ्"];
const key="kopal-7-ch16-varn-vichhed-v1";const total=questions.reduce((n,q)=>n+q[2].length,0);let slots=Array(total).fill(null),selected=null;
try{const s=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(s)&&s.length===total)slots=s.map(v=>words.includes(v)?v:null)}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(slots))}catch(e){}}
function render(){const bank=document.getElementById('bank');bank.innerHTML='';words.forEach(w=>{const b=document.createElement('button');b.className='chip'+(selected===w?' selected':'');b.textContent=w;b.draggable=true;b.onclick=()=>{selected=selected===w?null:w;render()};b.ondragstart=e=>e.dataTransfer.setData('text/plain',w);bank.appendChild(b)});let offset=0;const rows=document.getElementById('rows');rows.innerHTML='';questions.forEach(q=>{const row=document.createElement('div');row.className='line';const label=document.createElement('span');label.className='word';label.textContent=q[0]+' '+q[1]+' —';row.appendChild(label);q[2].forEach((answer,j)=>{const idx=offset+j;const blank=document.createElement('span');blank.className='blank'+(slots[idx]?'':' empty');blank.textContent=slots[idx]||'';blank.setAttribute('role','button');blank.tabIndex=0;blank.setAttribute('aria-label',q[1]+' उत्तर '+(j+1));blank.onclick=()=>{slots[idx]=selected;selected=null;save();render()};blank.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();blank.click()}};blank.ondragover=e=>e.preventDefault();blank.ondrop=e=>{e.preventDefault();const w=e.dataTransfer.getData('text/plain');if(words.includes(w)){slots[idx]=w;selected=null;save();render()}};if(j&&true){const plus=document.createElement('span');plus.textContent='+';row.appendChild(plus)}row.appendChild(blank)});offset+=q[2].length;rows.appendChild(row)})}
function submitAnswers(){let offset=0;document.querySelectorAll('.line').forEach((row,i)=>{const seen=new Set();row.querySelectorAll('.blank').forEach((b,j)=>{const v=slots[offset+j];const ok=true?v===questions[i][2][j]:questions[i][2].includes(v)&&!seen.has(v);seen.add(v);b.classList.remove('ok','bad');void b.offsetWidth;b.classList.add(ok?'ok':'bad')});offset+=questions[i][2].length});save()}
function resetAll(){slots=Array(total).fill(null);selected=null;try{localStorage.removeItem(key)}catch(e){}render()}
render();</script></body></html>
