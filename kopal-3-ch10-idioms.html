<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-2-ch10-idioms.html</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:440px;display:flex;flex-direction:column}h2{font-size:23px;color:#ff0066;margin:0 0 16px}.q{background:#effaff;border:1.5px solid #00c4ed;border-radius:12px;padding:11px 15px;margin:6px 0;font-size:18px;line-height:1.7}.options{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px}.opt{font:inherit;font-size:16px;border:1.5px solid #ff0066;background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}.opt.selected{background:#dcefff}.ok{background:#d9f8dc!important;border-color:#24ad54!important}.bad{background:#ffe2e2!important;border-color:#f33!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff8080}}.actions{display:flex;justify-content:center;gap:12px;margin-top:auto;padding-top:24px}button.action{background:#ff8700;color:white;border:0;border-radius:18px;padding:9px 21px;font-weight:bold;cursor:pointer}#result{text-align:center;color:#0755af;font-weight:bold;margin-top:12px}.answer{border:1.5px solid #ff6b59;border-radius:7px;padding:8px;font:18px Arial,"Noto Sans Devanagari",sans-serif;width:100%;margin-top:7px} @media(max-width:650px){.wrap{margin:4px;padding:14px;min-height:calc(100vh - 8px)}h2{font-size:21px}.q{font-size:16px}}</style></head><body><main class="wrap"><h2>मुहावरों का अपने वाक्यों में प्रयोग कीजिए–</h2><div class="q" style="color:#ff0066">मुहावरों से भाषा अधिक प्रभावशाली हो जाती है। मुहावरों का शाब्दिक अर्थ न लेकर उनका विशेष अर्थ लिया जाता है। नीचे दिए मुहावरों का अपने वाक्यों में प्रयोग कीजिए–</div><div class="q">(क) नौ-दो ग्यारह होना<textarea class="answer" rows="2" data-i="0" placeholder="अपना वाक्य लिखिए..."></textarea></div><div class="q">(ख) पेट में चूहे कूदना<textarea class="answer" rows="2" data-i="1" placeholder="अपना वाक्य लिखिए..."></textarea></div><div class="q">(ग) आँखों से शोले बरसना<textarea class="answer" rows="2" data-i="2" placeholder="अपना वाक्य लिखिए..."></textarea></div><div class="actions"><button class="action" onclick="submitAnswers()">Submit</button><button class="action" onclick="resetExercise()">Reset</button></div><div id="result"></div></main><script>const key='kopal-2-ch10-idioms';const inputs=[...document.querySelectorAll('.answer')];const old=JSON.parse(localStorage.getItem(key)||'[]');inputs.forEach((el,i)=>{el.value=old[i]||'';el.addEventListener('input',save)});function save(){localStorage.setItem(key,JSON.stringify(inputs.map(e=>e.value)))}function submitAnswers(){save();document.getElementById('result').textContent='उत्तर सुरक्षित हैं।'}function resetExercise(){inputs.forEach(e=>e.value='');localStorage.removeItem(key);document.getElementById('result').textContent=''}</script></body></html>
