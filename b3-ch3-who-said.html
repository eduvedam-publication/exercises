<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who said it?</title><style>*{box-sizing:border-box}body{margin:0;background:#dff6ff;font-family:Arial;color:#171717}.w{max-width:1000px;margin:auto;min-height:100vh;background:#fff;border:5px solid #08a9dc;border-radius:24px;padding:24px}h1{font-size:25px;color:#ff0072}.q{background:#f6fbfe;border:2px solid #a8eaff;border-radius:17px;padding:13px 16px;margin:10px 0;font-size:17px;font-weight:600}.o{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}.b,button{border:2px solid #ff2581;background:#fff;border-radius:11px;padding:8px 12px;font-size:16px;cursor:pointer}.sel{background:#ffe4f0}.ok{background:#dcf8df!important}.bad{background:#ffe0e0!important}input{border:2px solid #ff5a3d;padding:7px;font-size:16px}.a{display:flex;gap:10px;margin-top:18px}#result{font-weight:bold;margin-top:12px}@media(max-width:650px){.w{border-width:3px;border-radius:0;padding:14px}}</style></head><body><main class="w"><h1>Who said it?</h1><div class="q" style="display:flex;flex-wrap:wrap;align-items:center;gap:12px"><span style="flex:1 1 500px">1. &quot;Bring me something from your home when no one is watching.&quot;</span><input id="x0"></div><div class="q" style="display:flex;flex-wrap:wrap;align-items:center;gap:12px"><span style="flex:1 1 500px">2. &quot;We have, but someone was watching me all the time.&quot;</span><input id="x1"></div><div class="q" style="display:flex;flex-wrap:wrap;align-items:center;gap:12px"><span style="flex:1 1 500px">3. &quot;Don&#x27;t you have anything at home for me?&quot;</span><input id="x2"></div><div class="q" style="display:flex;flex-wrap:wrap;align-items:center;gap:12px"><span style="flex:1 1 500px">4. &quot;Who was watching you?&quot;</span><input id="x3"></div><div class="a"><button onclick="check()">Submit</button><button onclick="location.reload()">Reset</button></div><div id="result"></div></main><script>const A=["The teacher", "The boy", "The teacher", "The teacher"];function check(){let n=0;A.forEach((a,i)=>{let e=document.getElementById('x'+i),v=e.value.trim().toLowerCase()===a.toLowerCase();e.className=v?'ok':'bad';if(v)n++});result.textContent=`Score: ${n} / 4`}</script></body></html>
