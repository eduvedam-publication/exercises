<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gyandhara-2-ch15-special-drag-drop</title><style>*{box-sizing:border-box}body{margin:0;background:#dff9ff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#20313b}.wrap{max-width:900px;margin:14px auto;padding:20px 24px;border:3px solid #00a9d8;border-radius:22px;background:#fff}h1{margin:0 0 16px;font-size:23px;color:#00a9db}.card{padding:11px 14px;border:1.5px solid #00c7ed;border-radius:12px;background:#f1fbff;margin:9px 0;font-size:18px}.bank{background:#e3f8ff;border-radius:12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 18px}.word{background:white;border:1.5px solid #00a9db;border-radius:8px;padding:7px 12px;cursor:grab;font-size:18px}.word.selected{background:#b8f2ff}.blank{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:125px;min-height:36px;padding:3px 9px;border:2px dashed #ff6b50;border-radius:6px;background:white;cursor:pointer;font-size:18px}.blank.filled{border-style:solid;border-color:#08b7cb}.actions{display:flex;justify-content:center;gap:12px;margin-top:18px}.actions button{border:0;background:#ff8500;color:white;border-radius:22px;padding:10px 22px;font-weight:bold;cursor:pointer}.status{text-align:center;color:#0066b6;font-weight:bold;margin:10px 0 0}.note{font-size:13px;color:#576a74;text-align:center}.picture{width:84px;height:77px;object-fit:contain}.picrow{display:grid;grid-template-columns:32px 90px 1fr;align-items:center;gap:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{border:1.5px solid #ff715b;border-radius:6px;padding:8px;font-size:17px;width:min(100%,320px)}.fields{display:flex;flex-direction:column;gap:8px}.fields label{display:flex;gap:8px;align-items:center}.fields label input{flex:1}@media(max-width:600px){.wrap{margin:4px;padding:13px}.pair{grid-template-columns:1fr}h1{font-size:20px}.card{font-size:16px}}</style></head><body><main class="wrap"><h1>चार विशाल वृक्षों के नाम लिखिए–</h1><div class="bank"><button type="button" class="word">बरगद</button><button type="button" class="word">पीपल</button><button type="button" class="word">नीम</button><button type="button" class="word">आम</button><button type="button" class="word">अशोक</button><button type="button" class="word">शीशम</button><button type="button" class="word">साल</button><button type="button" class="word">देवदार</button></div><div class="pair"><div class="card">(क) <span class="blank" aria-label="उत्तर क"></span></div><div class="card">(ख) <span class="blank" aria-label="उत्तर ख"></span></div><div class="card">(ग) <span class="blank" aria-label="उत्तर ग"></span></div><div class="card">(घ) <span class="blank" aria-label="उत्तर घ"></span></div></div><p class="note">शब्द चुनकर रिक्त स्थान में रखें। </p><div class="actions"><button onclick="save()">Submit</button><button onclick="resetAll()">Reset</button></div><div class="status" aria-live="polite"></div></main><script>const KEY=location.pathname.split('/').pop();let chosen=null;const blanks=[...document.querySelectorAll('.blank')],inputs=[...document.querySelectorAll('input')];function persist(){localStorage.setItem(KEY,JSON.stringify({blanks:blanks.map(b=>b.textContent),inputs:inputs.map(x=>x.value)}))}function put(b,v){if(!b||!v)return;b.textContent=v;b.classList.add('filled');chosen=null;document.querySelectorAll('.word').forEach(w=>w.classList.remove('selected'));persist()}document.querySelectorAll('.word').forEach(w=>{w.draggable=true;w.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',w.textContent));w.addEventListener('click',()=>{chosen=w.textContent;document.querySelectorAll('.word').forEach(x=>x.classList.toggle('selected',x===w))})});blanks.forEach(b=>{b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();put(b,e.dataTransfer.getData('text/plain'))});b.addEventListener('click',()=>{if(chosen)put(b,chosen);else{b.textContent='';b.classList.remove('filled');persist()}})});inputs.forEach(i=>i.addEventListener('input',persist));function save(){persist();document.querySelector('.status').textContent='उत्तर सुरक्षित हैं।'}function resetAll(){blanks.forEach(b=>{b.textContent='';b.classList.remove('filled')});inputs.forEach(i=>i.value='');localStorage.removeItem(KEY);document.querySelector('.status').textContent=''}try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');blanks.forEach((b,i)=>{b.textContent=s.blanks?.[i]||'';b.classList.toggle('filled',!!b.textContent)});inputs.forEach((x,i)=>x.value=s.inputs?.[i]||'')}catch(e){}</script></body></html>
