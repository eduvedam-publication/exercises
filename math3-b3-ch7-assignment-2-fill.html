<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fill in the blanks.</title><style>*{box-sizing:border-box}body{margin:0;background:#e2f8fc;font-family:Georgia,'Times New Roman',serif}
.card{width:min(1080px,calc(100% - 24px));min-height:430px;margin:14px auto;background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:30px 42px;display:flex;flex-direction:column}
h1{font:700 25px Arial;color:#00a1db;margin:0 0 28px}.content{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 55px}
.q{font-size:20px;line-height:1.55}.opts{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 0 25px}
.opt{border:2px solid #ff1680;background:#fff;border-radius:12px;padding:8px 15px;cursor:pointer;font:16px Arial}.opt.sel{background:#fff0f6}.opt.ok{background:#dff7df;border-color:#198c3d}.opt.bad{background:#ffe1e1;border-color:#d92c2c}
input{width:90px;height:36px;border:2px solid #ff2b22;padding:4px 6px;font:17px Arial}input.ok{background:#dff7df;border-color:#198c3d}input.bad{background:#ffe1e1;border-color:#d92c2c}
.footer{margin-top:auto;padding-top:28px;text-align:center}button.action{border:0;border-radius:24px;background:#ff7b00;color:#fff;padding:13px 22px;margin:0 6px;font:bold 14px Arial;cursor:pointer}
.score{margin-top:13px;color:#064bb4;font:bold 22px Arial}@media(max-width:700px){.card{padding:24px 18px}.grid{grid-template-columns:1fr}.q{font-size:18px}}</style></head>
<body><main class="card"><h1>Fill in the blanks.</h1><div class="content"><div class="grid"><div class="q"><b>a.</b> 500 g + <input id="a0" autocomplete="off">g = 1 kg</div><div class="q"><b>b.</b> 300 g + <input id="a1" autocomplete="off">g = 1 kg</div><div class="q"><b>c.</b> <input id="a2" autocomplete="off">ml + 600 ml = 1 l</div><div class="q"><b>d.</b> 350 ml + <input id="a3" autocomplete="off">ml + 200 ml = 1 l</div><div class="q"><b>e.</b> 80 cm + <input id="a4" autocomplete="off">cm = 1 m</div><div class="q"><b>f.</b> 800 m + <input id="a5" autocomplete="off">m = 1 km</div></div></div><div class="footer"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button><div class="score" id="score">Score: 0 / 6</div></div></main><script>const A=['500', '700', '400', '450', '20', '200'];function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById('a'+i),ok=e.value.trim().toLowerCase().replace(/\s+/g,'')===a.toLowerCase().replace(/\s+/g,'');e.className=ok?'ok':'bad';if(ok)s++});score.textContent=`Score: ${s} / 6`}function resetAll(){A.forEach((_,i)=>{let e=document.getElementById('a'+i);e.value='';e.className=''});score.textContent='Score: 0 / 6'}</script></body></html>
