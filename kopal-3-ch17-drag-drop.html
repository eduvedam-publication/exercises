<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>पर्यायवाची शब्द लिखिए</title><style>*{box-sizing:border-box}body{margin:0;background:#d9f8ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#162b35}.exercise{width:min(900px,96vw);margin:16px auto;padding:20px 24px;background:white;border:3px solid #00a8d8;border-radius:20px;min-height:430px;display:flex;flex-direction:column}h1{color:#ff0064;font-size:25px;font-weight:600;margin:0 0 16px}.item{border:1.5px solid #00c5ec;border-radius:12px;background:#f1fbfe;margin:6px 0;padding:12px 14px;font-size:19px}.options{display:flex;flex-wrap:wrap;gap:9px;margin:9px 0 0 28px}.option{background:white;border:1.5px solid #ff0064;border-radius:9px;padding:7px 13px;cursor:pointer;font-size:17px;color:#172c34}.option.selected{background:#d9f6fc}.option.ok,.blank.ok{background:#dcf7dd;border-color:#0c9b50}.option.bad,.blank.bad{background:#ffdede;border-color:#e02c35;animation:blink .45s 3}@keyframes blink{50%{background:#ff6a6a}}.actions{display:flex;justify-content:center;gap:10px;margin-top:auto;padding-top:24px}button.action{border:0;border-radius:20px;padding:10px 19px;background:#ff8200;color:white;font-weight:bold;cursor:pointer}#score{text-align:center;font-size:18px;font-weight:bold;color:#0754af;margin:10px 0 0}.bank{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:#e4f7ff;border-radius:12px;padding:13px;margin:0 0 14px}.word{border:1.5px solid #00b5e8;background:white;padding:8px 12px;border-radius:8px;font-size:19px;cursor:grab}.word.used{opacity:.35}.blank{display:inline-flex;min-width:125px;min-height:37px;border:2px dashed #ff6b42;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;padding:3px 7px;background:white;cursor:pointer}.blank:empty:after{content:' ';white-space:pre}.hint{color:#647481;font-size:13px;margin-top:9px}@media(max-width:600px){.exercise{padding:15px;min-height:95vh}.item{font-size:17px}.options{margin-left:0}h1{font-size:22px}} .line{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.blank{min-width:150px}.blank.example{border:2px solid #13a05a;background:#dcf7dd;cursor:default}.word.active{background:#c8f2ff;border-color:#ff0064}.small{font-size:15px;color:#52626d}.item{padding:14px} </style></head><body><main class="exercise"><h1>पर्यायवाची शब्द लिखिए–</h1><div class="bank" id="bank"></div><div class="item"><div class="line"><b>(क)</b> पानी – <span class="blank example">जल, नीर</span><span class="small">(उदाहरण)</span></div></div><div id="questions"></div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score">Score: 0 / 3</div></main><script>
const rows=[['(ख)','नदी','सरिता, तटिनी'],['(ग)','फूल','पुष्प, सुमन'],['(घ)','सूर्य','रवि, भानु']];const words=rows.map(r=>r[2]);const key='kopal-2-ch17-synonyms';let values=JSON.parse(localStorage.getItem(key)||'[null,null,null]');let active=null;function save(){localStorage.setItem(key,JSON.stringify(values))}function render(){document.getElementById('bank').innerHTML=words.map((w,i)=>`<button class="word ${values.includes(i)?'used':''} ${active===i?'active':''}" draggable="true" ondragstart="drag(event,${i})" onclick="pick(${i})">${w}</button>`).join('');document.getElementById('questions').innerHTML=rows.map((r,i)=>`<div class="item"><div class="line"><b>${r[0]}</b> ${r[1]} – <span class="blank" data-index="${i}" ondragover="event.preventDefault()" ondrop="drop(event,${i})" onclick="place(${i})">${values[i]===null?'':words[values[i]]}</span></div></div>`).join('')}function pick(i){active=i;render()}function drag(e,i){e.dataTransfer.setData('text/plain',i)}function drop(e,i){e.preventDefault();let n=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(n)&&n>=0&&n<words.length){assign(i,n)}}function place(i){if(active!==null)assign(i,active);else if(values[i]!==null){values[i]=null;save();render()}}function assign(i,n){values=values.map((v,j)=>j!==i&&v===n?null:v);values[i]=n;active=null;save();render()}function submit(){let score=0;document.querySelectorAll('.blank[data-index]').forEach((el,i)=>{let good=values[i]===i;if(good)score++;if(values[i]!==null){el.classList.add(good?'ok':'bad')}});document.getElementById('score').textContent=`Score: ${score} / 3`;save()}function resetAll(){values=[null,null,null];active=null;save();render();document.getElementById('score').textContent='Score: 0 / 3'}render();
</script></body></html>
