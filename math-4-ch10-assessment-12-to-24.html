<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change the time given below from 12-hour clock to 24-hour clock time.</title><style>*{box-sizing:border-box}body{margin:0;background:#d0f9ff;font-family:Georgia,'Times New Roman',serif;color:#132437}.wrap{width:min(980px,94vw);margin:24px auto;background:white;border:3px solid #00aee9;border-radius:22px;padding:24px}h1{color:#00a6df;font-size:26px;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.q{background:#ecfbff;border:1px solid #00b8f0;border-radius:12px;padding:13px;font-size:17px}.line{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.ans{width:135px;max-width:100%;font:inherit;padding:8px;border:2px solid #ff7758;border-radius:5px;background:#fff}.ans.correct,.option.correct{background:#d9ffe7;border-color:#21b467}.ans.wrong,.option.wrong{background:#ffe3e3;border-color:#ef354b;animation:blink .55s 3}@keyframes blink{50%{background:#fff}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}button{border:0;border-radius:25px;padding:11px 19px;background:#ff8100;color:white;font-weight:bold;cursor:pointer}.option{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px solid #a4dfff;border-radius:7px;padding:9px;cursor:pointer;min-height:42px}.option.selected{border:2px solid #009ddd;background:#d9f6ff}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.mcq{margin-bottom:12px}.feedback{min-height:22px;text-align:center;margin-top:10px;color:#0067b6;font-weight:bold}@media(max-width:650px){.wrap{padding:15px;margin:10px auto}.grid,.options{grid-template-columns:1fr}h1{font-size:22px}}</style></head><body><main class="wrap"><h1>Change the time given below from 12-hour clock to 24-hour clock time.</h1><div id="questions" class="grid"></div><div class="actions"><button id="check">Check Answers</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div id="feedback" class="feedback" aria-live="polite"></div></main><script>
const questions=["4:45 a.m.", "8:40 p.m.", "12:28 p.m.", "12:00 noon"];const key=["0445 hours", "2040 hours", "1228 hours", "1200 hours"];const storage='math4-ch10-assessment-'+"12to24";let selected={};const root=document.getElementById('questions');
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){if("12to24"==='mcq'){root.innerHTML=questions.map((q,i)=>`<div class="q mcq"><b>${'abcd'[i]}.</b> ${escapeHtml(q.q)}<div class="options">${q.opts.map((o,j)=>`<div class="option" role="button" tabindex="0" data-i="${i}" data-j="${j}"><span>${['i','ii','iii','iv'][j]}. ${escapeHtml(o)}</span><span class="check">☐</span></div>`).join('')}</div></div>`).join('');root.querySelectorAll('.option').forEach(el=>{el.addEventListener('click',()=>choose(+el.dataset.i,+el.dataset.j));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(+el.dataset.i,+el.dataset.j)}})});Object.entries(selected).forEach(([i,j])=>paint(+i,+j));}else{root.innerHTML=questions.map((q,i)=>`<div class="q line"><b>${'abcd'[i]}.</b><span>${escapeHtml(q)}</span><input class="ans" data-i="${i}" autocomplete="off" aria-label="Answer ${i+1}" /></div>`).join('');root.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{el.classList.remove('correct','wrong');save()}));}}
function choose(i,j){selected[i]=j;paint(i,j);save()}function paint(i,j){root.querySelectorAll(`.option[data-i="${i}"]`).forEach(el=>{const yes=+el.dataset.j===j;el.classList.toggle('selected',yes);el.classList.remove('correct','wrong');el.querySelector('.check').textContent=yes?'☑':'☐'})}
function values(){return "12to24"==='mcq'?selected:Object.fromEntries([...root.querySelectorAll('input')].map(el=>[el.dataset.i,el.value]));}
function save(){try{localStorage.setItem(storage,JSON.stringify(values()))}catch(e){}}
function normalize(v){return String(v).toLowerCase().replace(/\s+/g,'').replace(/\./g,'').replace(/hours?|hrs?/g,'').replace(/minutes?|mins?/g,'').replace(/seconds?|secs?/g,'').replace(/a\.?m\.?/g,'am').replace(/p\.?m\.?/g,'pm')}
function check(){let good=0;if("12to24"==='mcq'){questions.forEach((q,i)=>{const v=selected[i];if(v===key[i])good++;root.querySelectorAll(`.option[data-i="${i}"]`).forEach(el=>{el.classList.remove('correct','wrong');if(+el.dataset.j===v)el.classList.add(v===key[i]?'correct':'wrong')})})}else{root.querySelectorAll('input').forEach(el=>{const i=+el.dataset.i;const ok=normalize(el.value)===normalize(key[i]);if(ok)good++;el.classList.remove('correct','wrong');if(el.value.trim())el.classList.add(ok?'correct':'wrong')})}document.getElementById('feedback').textContent=good===questions.length?'All answers are correct!':'Answers checked. Incorrect answers are highlighted in red.';save()}
function show(){if("12to24"==='mcq'){key.forEach((v,i)=>{selected[i]=v;paint(i,v)})}else{root.querySelectorAll('input').forEach(el=>el.value=key[+el.dataset.i])}root.querySelectorAll('.correct,.wrong').forEach(el=>el.classList.remove('correct','wrong'));document.getElementById('feedback').textContent='Correct answers filled in.';save()}
function reset(){selected={};if("12to24"==='mcq')questions.forEach((q,i)=>root.querySelectorAll(`.option[data-i="${i}"]`).forEach(el=>{el.classList.remove('selected','correct','wrong');el.querySelector('.check').textContent='☐'}));else root.querySelectorAll('input').forEach(el=>{el.value='';el.classList.remove('correct','wrong')});document.getElementById('feedback').textContent='';save()}
try{let v=JSON.parse(localStorage.getItem(storage)||'{}');if("12to24"==='mcq')selected=v||{};}catch(e){}render();if("12to24"!=='mcq'){try{const v=JSON.parse(localStorage.getItem(storage)||'{}');root.querySelectorAll('input').forEach(el=>el.value=v[el.dataset.i]||'')}catch(e){}}
document.getElementById('check').onclick=check;document.getElementById('show').onclick=show;document.getElementById('reset').onclick=reset;
</script></body></html>
