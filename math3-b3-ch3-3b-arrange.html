<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1100px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:30px 36px}
h1{margin:0 0 25px;color:#00a3dc;font-size:25px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 48px;width:100%}
.problem{display:flex;align-items:flex-start;gap:8px;font:19px Georgia,serif}.label{min-width:22px;padding-top:5px}
.card{width:205px;min-width:205px;background:#dff2d8;padding:8px}
.cols{display:grid;text-align:center}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.head{color:#ff0870;border-bottom:1px solid #28cbed;padding:5px 0;font-size:19px}
.row{min-height:42px;align-items:center;border-bottom:1px solid #28cbed;font-size:20px;position:relative}
.row.minus:before{content:"−";position:absolute;left:2px}
.answer{display:block;width:100%;height:38px;margin-top:4px;border:2px solid red;background:#fff;font-size:18px;padding:4px 7px}
.simple{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 55px}
.simple .q{display:flex;align-items:center;gap:8px;font:21px Georgia,serif;white-space:nowrap}
.simple input{width:95px;height:36px;border:2px solid red;font-size:18px;padding:4px}
.controls{display:flex;justify-content:center;gap:14px;width:100%;margin-top:36px;clear:both}
.controls button{border:0;border-radius:24px;background:#ff7d00;color:white;font-weight:bold;padding:12px 22px}
.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px;width:100%}
.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){body{padding:0}.exercise{border-radius:0;padding:18px}.grid,.simple{grid-template-columns:1fr}}
</style></head>
<body><main class="exercise"><h1>Arrange in column and find the difference.</h1><div class="simple"><div class="q"><span>a. &nbsp; 4258 − 3785</span><input id="a0" inputmode="numeric"></div><div class="q"><span>b. &nbsp; 3600 − 2985</span><input id="a1" inputmode="numeric"></div><div class="q"><span>c. &nbsp; 8625 − 4721</span><input id="a2" inputmode="numeric"></div><div class="q"><span>d. &nbsp; 4000 − 1880</span><input id="a3" inputmode="numeric"></div></div>
<div class="controls"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetAll()">Reset</button></div>
<div class="score" id="score">Score: 0 / 4</div></main>
<script>const answers=['473', '615', '3904', '2120'];
function checkAnswers(){let s=0;answers.forEach((a,i)=>{let e=document.getElementById('a'+i),ok=e.value.trim()===a;e.classList.remove('ok','bad');e.classList.add(ok?'ok':'bad');if(ok)s++});score.textContent='Score: '+s+' / 4'}
function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});score.textContent='Score: 0 / 4'}</script></body></html>
