<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose the correct option.</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#17333b}.wrap{max-width:1000px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a7dd;margin:0 0 8px;font-size:26px}.marks{color:#47717e;font-size:15px;margin:0 0 18px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:13px;margin:10px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.opt{border:1px solid #93dcf5;background:white;border-radius:8px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}.opt.sel{background:#d8f3ff;border-color:#009be0}.opt.correct{background:#dcfce5!important;border-color:#22aa55!important}.opt.wrong{background:#ffe3e3!important;border-color:#ff4545!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.actions button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}#score{text-align:center;color:#0073bd;font-size:19px;font-weight:bold;margin-top:14px}@media(max-width:620px){.wrap{margin:7px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}.opt{font:inherit;color:inherit;text-align:left;width:100%}.opts{grid-template-columns:repeat(4,minmax(0,1fr))}.feedback{display:block;font:14px Arial;margin-top:7px}.feedback.ok{color:#16833b}.feedback.no{color:#c62634}.statement{flex-wrap:wrap}.statement .feedback{flex-basis:100%}.choice:focus-visible,.opt:focus-visible,button:focus-visible{outline:3px solid #006bff;outline-offset:3px}@media(max-width:620px){.opts{grid-template-columns:1fr 1fr}}.picture-feedback,.feedback{display:none!important}.sheet{width:min(1120px,100%)}.wrap{max-width:1120px}.q{font-size:21px}.opt{font-size:20px}</style></head><body><main class="wrap"><h2>Choose the correct option.</h2><section id="questions"></section><div class="actions buttons"><button type="button" onclick="check()">Submit</button><button type="button" onclick="showAnswers()">Show Answer</button><button type="button" onclick="resetAll()">Reset</button></div></main><script>
const data=[["Which number comes after 88?", ["87", "78", "90", "89"], 3], ["Which of the following is smaller than the number 56?", ["54", "61", "57", "59"], 0]],key='exercise:revised-v2:math-1-ch6-assessment-mcq.html';let answers={};try{const a=JSON.parse(localStorage.getItem(key)||'{}');if(a&&typeof a==='object'&&!Array.isArray(a))answers=a}catch(e){}const root=document.getElementById('questions');
function persist(){try{localStorage.setItem(key,JSON.stringify(answers))}catch(e){}}
function render(){root.innerHTML=data.map((q,i)=>`<div class="q ${"mcq"==='tf'?'statement':''}" id="q${i}"><span>${String.fromCharCode(97+i)}. ${q[0]}</span><div class="${"mcq"==='tf'?'choices':'opts'}">${q[1].map((o,j)=>`<button type="button" class="${"mcq"==='tf'?'choice':'opt'} ${answers[i]===j?'selected sel':''}" id="o${i}-${j}" aria-label="${"mcq"==='tf'?(j===0?'True':'False'):o}" aria-pressed="${answers[i]===j}" onclick="pick(${i},${j})"><span>${o}</span>${"mcq"==='tf'?'':`<span aria-hidden="true">${answers[i]===j?'☑':'□'}</span>`}</button>`).join('')}</div><span class="feedback" id="f${i}" aria-live="polite" hidden hidden></span></div>`).join('')}
function pick(i,j){answers[i]=j;persist();render()}
function check(){data.forEach((q,i)=>{q[1].forEach((_,j)=>document.getElementById('o'+i+'-'+j).classList.remove('correct','wrong'));const el=document.getElementById('o'+i+'-'+answers[i]);const f=document.getElementById('f'+i);const ok=answers[i]===q[2];if(el)el.classList.add(ok?'correct':'wrong');f.textContent='';f.className='feedback '+(ok?'ok':'no')});const detail={exerciseType:"mcq"==='tf'?'TRUE_FALSE':'MCQ',exerciseId:'math-1-ch6-assessment-mcq.html',response:{...answers}};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')}
function showAnswers(){data.forEach((q,i)=>answers[i]=q[2]);persist();render();check()}
function resetAll(){answers={};persist();render()}
render();
</script></body></html>
