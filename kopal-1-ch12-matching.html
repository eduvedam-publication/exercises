<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मिलान कीजिए–</title>
    <style>
        body {
            font-family: 'Noto Sans Devanagari', 'Mukta', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .connection-line {
            transition: stroke-dashoffset 0.3s ease, stroke 0.25s ease;
            cursor: pointer;
        }
        .connection-line:hover {
            stroke-width: 5.5px;
        }
        .dot-indicator {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, border-color 0.2s ease;
        }
        .dot-indicator:hover {
            transform: scale(1.4);
        }
        @media print {
            .no-print {
                display: none !important;
            }
            .print-border {
                border: none !important;
                box-shadow: none !important;
            }
            body {
                background: white !important;
            }
        }
    
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8fafc;color:#1e293b;font-family:'Noto Sans Devanagari',Mukta,Mangal,Arial,sans-serif}main{width:100%;max-width:700px;background:#fff;padding:32px;border-radius:18px;border:1px solid #e2e8f0;box-shadow:0 16px 40px #0f172a16}header{border-bottom:1px solid #f1f5f9;padding-bottom:16px;margin-bottom:24px}header>div{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:30px;line-height:1.4;color:#1a90d9;margin:0;font-weight:700}header p{font-size:14px;color:#64748b;line-height:1.7;margin:10px 0 0}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}#toggle-sound-btn{padding:8px;background:#f1f5f9;border-radius:8px}#board-container{position:relative;width:100%;padding:16px 0;min-height:360px;display:flex;justify-content:space-between}#svg-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible}#col-left,#col-right{width:42%;position:relative;z-index:20;display:flex;flex-direction:column;justify-content:space-between;gap:20px}.group{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:14px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer;min-height:61px;font-size:22px;transition:background .2s}.group:hover{background:#f0f9ff;border-color:#7dd3fc}.group>div:not(.dot-indicator){display:flex;align-items:center;gap:12px}.group[data-right-id]>div:not(.dot-indicator){flex-direction:row-reverse;text-align:right}.group>div>span:first-child{font-size:17px;color:#64748b;font-weight:600}.group>div>span:last-child{font-weight:600;color:#0f172a}.dot-indicator{width:16px;height:16px;border:2px solid #cbd5e1;border-radius:50%;background:#fff;flex-shrink:0}.ring-2{outline:2px solid #0ea5e9;background:#f0f9ff!important}.connection-line{pointer-events:stroke}#feedback-box{min-height:48px;margin:16px 0;padding:12px;text-align:center;border-radius:12px;font-size:16px;line-height:1.6}.evaluation.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}.evaluation.retry{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:16px;border-top:1px solid #f1f5f9}footer>div{display:flex;gap:8px;flex-wrap:wrap}footer button{padding:10px 14px;border-radius:11px;font-size:14px;white-space:nowrap}#check-btn{background:#2563eb;color:white;font-weight:600;box-shadow:0 3px 9px #2563eb25}#reset-btn{background:#f1f5f9;color:#334155}#show-ans-btn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}button[onclick]{background:#f8fafc;color:#475569;border:1px solid #e2e8f0}button:focus-visible,.group:focus-visible{outline:3px solid #0284c7;outline-offset:3px}@media(max-width:540px){body{padding:12px}main{padding:20px 14px}h1{font-size:26px}#board-container{min-height:330px}#col-left,#col-right{width:43%}.group{padding:12px 7px;font-size:18px}.group>div:not(.dot-indicator){gap:5px}.group>div>span:first-child{font-size:14px}.dot-indicator{width:13px;height:13px}footer{justify-content:center}footer button{padding:9px 11px}}
</style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 text-slate-800">
    <main class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-200/80 p-5 sm:p-8 relative print-border overflow-hidden">
        
        <!-- Header Banner -->
        <header class="mb-6 sm:mb-8 border-b border-slate-100 pb-4">
            <div class="flex items-center justify-between flex-wrap gap-2">
                <h1 class="text-2xl sm:text-3xl font-bold text-[#1a90d9] tracking-wide flex items-center gap-2">
                    मिलान कीजिए–
                </h1>
                <div class="no-print flex items-center gap-2">
                    <button id="toggle-sound-btn" title="ध्वनि चालू/बंद करें" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm transition">
                        🔊
                    </button>
                </div>
            </div>
            <p class="text-xs sm:text-sm text-slate-500 mt-1 no-print">
                बाईं ओर की पंक्ति पर क्लिक करें, फिर दाईं ओर की सही पंक्ति पर क्लिक करके मिलान करें।
            </p>
        </header>

        <!-- Matching Board Section -->
        <div id="board-container" class="relative w-full py-4 min-h-[380px] sm:min-h-[420px] flex justify-between select-none">
            
            <!-- Dynamic SVG Canvas for drawing connecting lines -->
            <svg id="svg-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-10 overflow-visible"></svg>

            <!-- Column Left -->
            <div id="col-left" class="flex flex-col justify-between w-[44%] sm:w-[42%] z-20 space-y-4">
                <!-- Row items injected via JS -->
            </div>

            <!-- Column Right -->
            <div id="col-right" class="flex flex-col justify-between w-[44%] sm:w-[42%] z-20 space-y-4">
                <!-- Row items injected via JS -->
            </div>
        </div>

        <!-- Feedback & Evaluation Message -->
        <div role="status" aria-live="polite" id="feedback-box" class="min-h-[48px] my-4 flex items-center justify-center text-center font-medium text-sm sm:text-base transition-all rounded-xl p-2.5"></div>

        <footer class="no-print pt-2 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <button id="check-btn" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold rounded-xl text-sm shadow-md transition flex items-center gap-1.5">
                    <span>✓</span> जाँच करें
                </button>
                <button id="reset-btn" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-semibold rounded-xl text-sm transition flex items-center gap-1.5">
                    <span>↻</span> फिर से करें
                </button>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="show-ans-btn" class="px-3.5 py-2.5 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 active:scale-95 font-medium rounded-xl text-xs sm:text-sm transition">
                    उत्तर देखें
                </button>
                <button onclick="window.print()" class="px-3.5 py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-xl text-xs sm:text-sm transition flex items-center gap-1">
                    🖨️ प्रिंट
                </button>
            </div>
        </footer>
    </main>

    <script>
        // Exact content preserved from image
        const leftItemsData = [{"id": "L1", "code": "(क)", "text": "चंदामामा", "targetId": "R3"}, {"id": "L2", "code": "(ख)", "text": "रात", "targetId": "R4"}, {"id": "L3", "code": "(ग)", "text": "दिन", "targetId": "R1"}, {"id": "L4", "code": "(घ)", "text": "थक कर", "targetId": "R2"}];

        const rightItemsData = [{"id": "R1", "code": "(अ)", "text": "गायब"}, {"id": "R2", "code": "(ब)", "text": "सो जाते"}, {"id": "R3", "code": "(स)", "text": "आसमान"}, {"id": "R4", "code": "(द)", "text": "चमकते"}];

        // State management
        let matches = {}; // key: leftId, value: rightId
        let activeSelectedLeft = null;
        let isEvaluated = false;
        let soundEnabled = true;

        // Line colors palette for visual clarity
        const colorPalette = [
            "#2563eb", // blue
            "#059669", // emerald
            "#d97706", // amber
            "#7c3aed", // purple
            "#db2777"  // pink
        ];

        // Audio synthesizer with Web Audio API (Self-contained, no external assets)
        let audioCtx = null;
        function playChime(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'connect') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(660, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.13);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    osc.frequency.setValueAtTime(1046.50, now + 0.24);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                    osc.start(now);
                    osc.stop(now + 0.46);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(160, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.21);
                }
            } catch (err) {
                // Audio graceful degradation
            }
        }

        const colLeftEl = document.getElementById("col-left");
        const colRightEl = document.getElementById("col-right");
        const svgCanvas = document.getElementById("svg-canvas");
        const feedbackBox = document.getElementById("feedback-box");

        function renderColumns() {
            colLeftEl.innerHTML = "";
            colRightEl.innerHTML = "";

            leftItemsData.forEach((item, index) => {
                const card = document.createElement("div");
                card.id = `card-${item.id}`;
                card.className = "group relative flex items-center justify-between p-2.5 sm:p-3.5 bg-slate-50/80 hover:bg-sky-50 border border-slate-200/90 hover:border-sky-300 rounded-xl cursor-pointer transition-all duration-200 text-base sm:text-xl font-medium";
                card.setAttribute("data-left-id", item.id);
                
                card.innerHTML = `
                    <div class="flex items-center gap-2.5 sm:gap-4 pl-1">
                        <span class="text-slate-500 font-semibold text-sm sm:text-lg min-w-[28px]">${item.code}</span>
                        <span class="text-slate-900 font-semibold tracking-wide">${item.text}</span>
                    </div>
                    <div id="dot-${item.id}" class="dot-indicator w-4 h-4 rounded-full border-2 border-slate-300 bg-white group-hover:border-sky-500 flex items-center justify-center">
                        <div class="w-1.5 h-1.5 rounded-full bg-transparent"></div>
                    </div>
                `;

                card.setAttribute("role", "button");card.tabIndex=0;card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();handleLeftClick(item.id)}});card.addEventListener("click", () => handleLeftClick(item.id));
                colLeftEl.appendChild(card);
            });

            rightItemsData.forEach((item) => {
                const card = document.createElement("div");
                card.id = `card-${item.id}`;
                card.className = "group relative flex items-center justify-between p-2.5 sm:p-3.5 bg-slate-50/80 hover:bg-sky-50 border border-slate-200/90 hover:border-sky-300 rounded-xl cursor-pointer transition-all duration-200 text-base sm:text-xl font-medium";
                card.setAttribute("data-right-id", item.id);

                card.innerHTML = `
                    <div id="dot-${item.id}" class="dot-indicator w-4 h-4 rounded-full border-2 border-slate-300 bg-white group-hover:border-sky-500 flex items-center justify-center">
                        <div class="w-1.5 h-1.5 rounded-full bg-transparent"></div>
                    </div>
                    <div class="flex items-center gap-2.5 sm:gap-4 pr-1 text-right flex-row-reverse">
                        <span class="text-slate-500 font-semibold text-sm sm:text-lg min-w-[28px]">${item.code}</span>
                        <span class="text-slate-900 font-semibold tracking-wide">${item.text}</span>
                    </div>
                `;

                card.setAttribute("role", "button");card.tabIndex=0;card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();handleRightClick(item.id)}});card.addEventListener("click", () => handleRightClick(item.id));
                colRightEl.appendChild(card);
            });
        }

        function handleLeftClick(leftId) {
            if (isEvaluated) clearEvaluationState();

            if (activeSelectedLeft === leftId) {
                // Deselect
                activeSelectedLeft = null;
            } else {
                activeSelectedLeft = leftId;
            }
            updateStyles();
        }

        function handleRightClick(rightId) {
            if (isEvaluated) clearEvaluationState();

            if (activeSelectedLeft) {
                // If this right item is already bound to another left item, remove previous binding
                for (let k in matches) {
                    if (matches[k] === rightId) {
                        delete matches[k];
                    }
                }
                // Connect
                matches[activeSelectedLeft] = rightId;
                playChime('connect');
                activeSelectedLeft = null;
                updateStyles();
                drawLines();
            } else {
                // If user clicks a right item that has an active match, disconnect it
                for (let k in matches) {
                    if (matches[k] === rightId) {
                        delete matches[k];
                        playChime('wrong');
                        break;
                    }
                }
                updateStyles();
                drawLines();
            }
        }

        function clearEvaluationState() {
            isEvaluated = false;
            feedbackBox.innerHTML = "";
            feedbackBox.className = "min-h-[48px] my-4 flex items-center justify-center text-center font-medium text-sm sm:text-base transition-all rounded-xl p-2.5";
            updateStyles();
            drawLines();
        }

        function getDotCenter(dotId) {
            const dot = document.getElementById(dotId);
            if (!dot) return null;
            const containerRect = document.getElementById("board-container").getBoundingClientRect();
            const dotRect = dot.getBoundingClientRect();

            return {
                x: dotRect.left + dotRect.width / 2 - containerRect.left,
                y: dotRect.top + dotRect.height / 2 - containerRect.top
            };
        }

        function drawLines() {
            svgCanvas.innerHTML = "";

            Object.entries(matches).forEach(([leftId, rightId], idx) => {
                const start = getDotCenter(`dot-${leftId}`);
                const end = getDotCenter(`dot-${rightId}`);

                if (!start || !end) return;

                const leftIndex = leftItemsData.findIndex(item => item.id === leftId);
                const color = isEvaluated ? (rightId === leftItemsData[leftIndex].targetId ? "#059669" : "#e11d48") : colorPalette[leftIndex % colorPalette.length];

                // Create SVG curved cubic bezier line
                const dx = (end.x - start.x) * 0.5;
                const pathData = `M ${start.x} ${start.y} C ${start.x + dx} ${start.y}, ${end.x - dx} ${end.y}, ${end.x} ${end.y}`;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathData);
                path.setAttribute("fill", "none");
                path.setAttribute("stroke", color);
                path.setAttribute("stroke-width", "3.5");
                path.setAttribute("stroke-linecap", "round");
                path.classList.add("connection-line", "pointer-events-auto");
                path.title = "क्लिक करके मिलान हटाएं";

                // Click line to remove
                path.addEventListener("click", () => {
                    delete matches[leftId];
                    playChime('wrong');
                    updateStyles();
                    drawLines();
                });

                svgCanvas.appendChild(path);

                // Small start/end decorative rings
                const startCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                startCircle.setAttribute("cx", start.x);
                startCircle.setAttribute("cy", start.y);
                startCircle.setAttribute("r", "5");
                startCircle.setAttribute("fill", color);
                svgCanvas.appendChild(startCircle);

                const endCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                endCircle.setAttribute("cx", end.x);
                endCircle.setAttribute("cy", end.y);
                endCircle.setAttribute("r", "5");
                endCircle.setAttribute("fill", color);
                svgCanvas.appendChild(endCircle);
            });


        }

        function updateStyles() {
            // Update left cards
            leftItemsData.forEach((item, index) => {
                const card = document.getElementById(`card-${item.id}`);
                const dot = document.getElementById(`dot-${item.id}`);
                const isSelected = activeSelectedLeft === item.id;
                const isMatched = !!matches[item.id];
                const color = colorPalette[index % colorPalette.length];

                card.classList.remove("ring-2", "ring-sky-500", "bg-sky-50/90", "border-sky-400");
                dot.style.backgroundColor = "white";
                dot.style.borderColor = "";

                if (isSelected) {
                    card.classList.add("ring-2", "ring-sky-500", "bg-sky-50/90", "border-sky-400");
                    dot.style.borderColor = "#0284c7";
                    dot.style.backgroundColor = "#0284c7";
                } else if (isMatched) {
                    dot.style.borderColor = color;
                    dot.style.backgroundColor = color;
                }
            });

            // Update right cards
            rightItemsData.forEach(item => {
                const dot = document.getElementById(`dot-${item.id}`);
                const matchedLeftId = Object.keys(matches).find(k => matches[k] === item.id);
                
                dot.style.backgroundColor = "white";
                dot.style.borderColor = "";

                if (matchedLeftId) {
                    const leftIdx = leftItemsData.findIndex(l => l.id === matchedLeftId);
                    const color = colorPalette[leftIdx % colorPalette.length];
                    dot.style.borderColor = color;
                    dot.style.backgroundColor = color;
                }
            });
        }

        function checkAnswers() {
            isEvaluated = true;
            const complete = leftItemsData.every(item => matches[item.id]);
            const correct = leftItemsData.every(item => matches[item.id] === item.targetId);
            feedbackBox.className = 'evaluation ' + (correct ? 'success' : 'retry');
            feedbackBox.textContent = correct ? 'बहुत बढ़िया! सभी मिलान सही हैं।' : complete ? 'लाल रेखाओं वाले मिलान फिर से देखिए।' : 'सभी शब्दों का मिलान पूरा कीजिए।';
            drawLines();
            playChime(correct ? 'success' : 'wrong');
        }

        function resetAll() {
            matches = {};
            activeSelectedLeft = null;
            clearEvaluationState();
            playChime('wrong');
        }

        function showSolutions() {
            matches = {};
            leftItemsData.forEach(item => {
                matches[item.id] = item.targetId;
            });
            activeSelectedLeft = null;
            isEvaluated = true;
            updateStyles();
            drawLines();
            feedbackBox.className = "min-h-[48px] my-4 flex items-center justify-center text-center font-semibold text-sm sm:text-base rounded-xl p-2.5 bg-sky-50 text-sky-800 border border-sky-300";
            feedbackBox.innerHTML = "📖 सभी सही उत्तर दिखा दिए गए हैं।";
            playChime('connect');
        }

        document.getElementById("check-btn").addEventListener("click", checkAnswers);
        document.getElementById("reset-btn").addEventListener("click", resetAll);
        document.getElementById("show-ans-btn").addEventListener("click", showSolutions);
        
        document.getElementById("toggle-sound-btn").addEventListener("click", (e) => {
            soundEnabled = !soundEnabled;
            e.currentTarget.textContent = soundEnabled ? "🔊" : "🔇";
            e.currentTarget.title = soundEnabled ? "ध्वनि बंद करें" : "ध्वनि चालू करें";
        });

        window.addEventListener("resize", () => {
            drawLines();
        });

        // Initialize display
        renderColumns();
        updateStyles();
        drawLines();
    </script>
</body>
</html>
