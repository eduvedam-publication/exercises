<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}
.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}
.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:700px){body{padding:0}.ex{border-radius:0;padding:16px}}.tf{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:12px 15px;margin:10px 0;background:#f6fcff;border:1px solid #b8eaff;border-radius:14px;font:20px Georgia,"Times New Roman",serif}.choices{display:flex;gap:10px}.choices button{border:2px solid #ff1680;border-radius:10px;background:#fff;padding:8px 18px;font-size:16px;cursor:pointer}.choices button.sel{background:#fff0f6}</style></head><body><main class="ex"><h1>State true or false.</h1><div class="tf" data-a="T"><span>a. The elements of a pattern follow a definite rule.</span><div class="choices"><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="tf" data-a="F"><span>b. The pictorial pattern consists of numbers.</span><div class="choices"><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="tf" data-a="T"><span>c. An eraser is an example of a rectangle.</span><div class="choices"><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="tf" data-a="F"><span>d. If you push a football from a slope, it will slide.</span><div class="choices"><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div></main><script>document.querySelectorAll(".tf").forEach(q=>q.querySelectorAll("button").forEach(b=>b.onclick=()=>{q.querySelectorAll("button").forEach(x=>x.className="");b.className="sel";q.dataset.p=b.dataset.v}));function check(){let s=0;document.querySelectorAll(".tf").forEach(q=>{let p=q.dataset.p;q.querySelectorAll("button").forEach(b=>{b.classList.remove("ok","bad");if(b.dataset.v===p)b.classList.add(p===q.dataset.a?"ok":"bad")});if(p===q.dataset.a)s++});score.textContent=`Score: ${s} / 4`}function resetAll(){document.querySelectorAll(".tf").forEach(q=>{delete q.dataset.p;q.querySelectorAll("button").forEach(b=>b.className="")});score.textContent="Score: 0 / 4"}</script></body></html>
