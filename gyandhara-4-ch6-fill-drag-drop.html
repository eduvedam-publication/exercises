<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GyanDhara 4 Chapter 6 Fill in the Blanks</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#17333b}.wrap{max-width:1000px;margin:20px auto;background:#fff;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a7dd;margin:0 0 8px;font-size:26px}.marks{color:#47717e;font-size:15px;margin:0 0 15px}.bank{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#ddf7ff;border-radius:12px;padding:13px;margin-bottom:17px}.word{font:inherit;font-size:19px;border:1px solid #00aee8;border-radius:8px;background:#fff;padding:8px 16px;cursor:grab;color:#183944}.word.selected{background:#bdeeff;outline:2px solid #008dc7}.word.used{opacity:.35;cursor:default}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:13px;margin:10px 0;font-size:19px;line-height:2}.slot{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:135px;min-height:39px;padding:3px 10px;margin:0 5px;border:2px dashed #ff654b;border-radius:7px;background:#fff;cursor:pointer;font-size:19px}.slot.filled{border-style:solid;color:#164760}.slot.correct{background:#dcfce5;border-color:#1ea64d}.slot.wrong{background:#ffe1e1;border-color:#f33;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}.actions button{border:0;border-radius:24px;background:#ff8200;color:#fff;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}.hint{text-align:center;font-size:14px;color:#47717e;margin:-4px 0 12px}#score{text-align:center;color:#0073bd;font-size:19px;font-weight:bold;margin-top:14px}@media(max-width:620px){.wrap{margin:7px;padding:14px}h2{font-size:22px}.q{font-size:17px}.slot,.word{font-size:17px}.slot{min-width:105px}}</style></head><body><main class="wrap"><h2>रिक्त स्थान पूर्ति कीजिए–</h2><p class="marks">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 4</p><div class="bank" id="bank"></div><p class="hint">शब्द को खींचकर रिक्त स्थान में छोड़ें, या शब्द और फिर रिक्त स्थान पर क्लिक करें।</p><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 4</div></main><script>
const data=[
['कक्षा में','शोर मचा रहे हैं।','बच्चे'],
['फूलों की','चारों ओर फैली है।','सुगंध'],
['','पर्वत भारत की शान है।','हिमालय'],
['दीपों का त्योहार हमें','देता है।','खुशी']
];
const words=['बच्चे','बचपन','पौधा','सुगंध','हिमालय','ऊँची','खुश','खुशी'];const key='gyandhara-4-ch6-fill';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let selected=null;
function save(){localStorage.setItem(key,JSON.stringify(answers))}
function choose(w){if(Object.values(answers).includes(w))return;selected=selected===w?null:w;render()}
function put(i,w){if(!words.includes(w))return;Object.keys(answers).forEach(k=>{if(answers[k]===w)delete answers[k]});answers[i]=w;selected=null;save();render()}
function place(i){if(selected!==null){put(i,selected)}else if(answers[i]){delete answers[i];save();render()}}
function render(){document.getElementById('bank').innerHTML=words.map((w)=>`<button type="button" class="word ${selected===w?'selected':''} ${Object.values(answers).includes(w)?'used':''}" draggable="${!Object.values(answers).includes(w)}" ondragstart="event.dataTransfer.setData('text/plain',${JSON.stringify(w)})" onclick="choose(${JSON.stringify(w)})">${w}</button>`).join('');document.getElementById('questions').innerHTML=data.map((q,i)=>`<div class="q">(${'कखगघ'[i]}) ${q[0]} <span class="slot ${answers[i]?'filled':''}" id="slot${i}" role="button" tabindex="0" onclick="place(${i})" onkeydown="if(event.key==='Enter'||event.key===' ')place(${i})" ondragover="event.preventDefault()" ondrop="event.preventDefault();put(${i},event.dataTransfer.getData('text/plain'))">${answers[i]||'________'}</span> ${q[1]}</div>`).join('')}
function check(){let score=0;data.forEach((q,i)=>{const el=document.getElementById('slot'+i);el.classList.remove('correct','wrong');if(answers[i]){const ok=answers[i]===q[2];el.classList.add(ok?'correct':'wrong');if(ok)score++}});document.getElementById('score').textContent=`प्राप्तांक: ${score} / 4`}
function showAnswers(){answers={0:'बच्चे',1:'सुगंध',2:'हिमालय',3:'खुशी'};selected=null;save();render();check()}
function resetAll(){answers={};selected=null;localStorage.removeItem(key);render();document.getElementById('score').textContent='प्राप्तांक: 0 / 4'}render();</script></main></body></html>
