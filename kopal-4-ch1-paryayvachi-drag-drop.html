<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kopal Hindi 4 Chapter 1 Paryayvachi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8f8ff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#20343c}.wrap{max-width:1000px;margin:22px auto;background:#fff;border:3px solid #36bce7;border-radius:18px;padding:24px}h2{color:#e84b8a;margin:0 0 8px;font-size:25px}.meta{color:#55727b;margin:0 0 18px}.bank{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#fff6c9;border-radius:12px;padding:13px;margin-bottom:17px}.word{font:inherit;font-size:18px;background:#fff;border:1px solid #e4ca63;border-radius:8px;padding:8px 15px;cursor:grab}.word.selected{background:#ffe5ef;outline:2px solid #e84b8a}.word.used{opacity:.4}.q{background:#f2fbff;border:1px solid #9bdff2;border-radius:12px;padding:14px;margin:12px 0;font-size:19px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.slot{min-width:145px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;border:2px dashed #ff91b9;border-radius:8px;background:white;padding:5px 12px;cursor:pointer}.slot.filled{border-style:solid}.slot.correct{background:#dff9e7;border-color:#22a653}.slot.wrong{background:#ffe1e1;border-color:#ed3434;animation:blink .6s 2}@keyframes blink{50%{opacity:.5}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}.actions button{border:0;border-radius:22px;padding:11px 20px;background:#e84b8a;color:white;font-weight:bold;cursor:pointer;font-size:15px}.hint{text-align:center;color:#55727b;font-size:14px}#score{text-align:center;color:#087da8;font-weight:bold;font-size:19px;margin-top:15px}@media(max-width:650px){.wrap{margin:7px;padding:14px}.q{font-size:17px}}
</style></head><body><main class="wrap"><h2>निम्नलिखित शब्दों के पर्यायवाची शब्द पाठ में से ढूँढ़कर लिखिए–</h2><p class="meta">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 4</p><div class="bank" id="bank"></div><p class="hint">शब्द को खींचकर खाली स्थान पर छोड़ें, या शब्द और फिर खाली स्थान पर क्लिक करें।</p><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 4</div></main>
<script>
const data=[["गिरिराज","हिमालय"],["आकाश","नभ"],["रास्ता","पथ"],["संसार","जग"]];
const words=["हिमालय","जग","नभ","पथ","पर्वत","आकाश"];const key='kopal-4-ch1-synonyms';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let selected=null;
function save(){localStorage.setItem(key,JSON.stringify(answers))}
function choose(w){if(Object.values(answers).includes(w))return;selected=selected===w?null:w;render()}
function put(i,w){if(!words.includes(w))return;Object.keys(answers).forEach(k=>{if(answers[k]===w)delete answers[k]});answers[i]=w;selected=null;save();render()}
function place(i){if(selected!==null)put(i,selected);else if(answers[i]){delete answers[i];save();render()}}
function render(){document.getElementById('bank').innerHTML=words.map(w=>`<button class="word ${selected===w?'selected':''} ${Object.values(answers).includes(w)?'used':''}" draggable="${!Object.values(answers).includes(w)}" ondragstart="event.dataTransfer.setData('text/plain',${JSON.stringify(w)})" onclick="choose(${JSON.stringify(w)})">${w}</button>`).join('');document.getElementById('questions').innerHTML=data.map((q,i)=>`<div class="q">(${'कखगघ'[i]}) <b>${q[0]}</b> — <span id="slot${i}" class="slot ${answers[i]?'filled':''}" onclick="place(${i})" ondragover="event.preventDefault()" ondrop="event.preventDefault();put(${i},event.dataTransfer.getData('text/plain'))">${answers[i]||'रिक्त स्थान'}</span></div>`).join('')}
function check(){let score=0;data.forEach((q,i)=>{let el=document.getElementById('slot'+i);el.classList.remove('correct','wrong');if(answers[i]){let ok=answers[i]===q[1];el.classList.add(ok?'correct':'wrong');if(ok)score++}});document.getElementById('score').textContent=`प्राप्तांक: ${score} / 4`}
function showAnswers(){answers={0:'हिमालय',1:'नभ',2:'पथ',3:'जग'};selected=null;save();render();check()}
function resetAll(){answers={};selected=null;localStorage.removeItem(key);render();document.getElementById('score').textContent='प्राप्तांक: 0 / 4'}render();
</script></body></html>
