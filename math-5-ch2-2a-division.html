<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 5 Chapter 2 Exercise 2A — Write the prime factorisation of the following numbers using division method.</title><style>
*{box-sizing:border-box}body{margin:0;background:#bafaff;font-family:Arial,sans-serif;color:#172b42}.wrap{max-width:1030px;margin:18px auto;padding:24px;border:3px solid #00aeef;border-radius:20px;background:white}h1{color:#00a8ed;font-size:clamp(20px,2.4vw,29px);margin:0 0 20px}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{background:#e0f9ff;border:1.5px solid #00b0f9;border-radius:12px;padding:18px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:19px}.letter{font-weight:bold;color:#047ab0}.answer{width:100%;min-width:0;max-width:210px;border:2px solid #ff7777;border-radius:6px;font-size:18px;padding:10px;color:#173a55;background:white}.item.correct{border-color:#25a05b;background:#e9fff0}.item.wrong{border-color:#e34545;background:#fff0f0}.item.correct .answer{border-color:#25a05b}.item.wrong .answer{border-color:#e34545}.feedback{font-size:14px;width:100%;min-height:17px}.controls{text-align:center;margin-top:25px}.controls button{border:0;border-radius:22px;padding:12px 19px;background:#ff7300;color:white;font-weight:bold;cursor:pointer;margin:3px}.controls button:hover{background:#e46200}.score{font-size:22px;color:#0649d8;font-weight:bold;margin:10px} .hint{text-align:center;color:#52707d;font-size:14px;margin-top:6px}@media(max-width:720px){.wrap{margin:8px;padding:15px}.items{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){.items{grid-template-columns:1fr}.answer{max-width:100%}}</style></head><body><main class="wrap"><h1>2. Write the prime factorisation of the following numbers using division method.</h1><div class="items" id="items"></div><div class="controls"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button><div class="score" id="score">Marks: 0 / 6</div><div class="hint">Use × or * between prime factors. Exponents (e.g. 2³) are also accepted.</div></div></main><script>
const data=[{"n": 78, "factors": ["2", "3", "13"]}, {"n": 63, "factors": ["3", "3", "7"]}, {"n": 54, "factors": ["2", "3", "3", "3"]}, {"n": 165, "factors": ["3", "5", "11"]}, {"n": 144, "factors": ["2", "2", "2", "2", "3", "3"]}, {"n": 270, "factors": ["2", "3", "3", "3", "5"]}];const storageKey='math-5-ch2-2a-division';let responses=[];try{responses=JSON.parse(localStorage.getItem(storageKey))||[]}catch(e){};const items=document.getElementById('items');
const supers={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
function factors(s){s=String(s).replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+[...m].map(c=>supers[c]).join('')).replace(/×|✕|·|\*/g,'x').replace(/\s+/g,'');if(!/^\d+(?:\^\d+)?(?:x\d+(?:\^\d+)?)*$/.test(s))return null;let a=[];for(const part of s.split('x')){const [v,e='1']=part.split('^');const exp=Number(e);if(exp<1||exp>20)return null;for(let j=0;j<exp;j++)a.push(Number(v))}return a.sort((a,b)=>a-b)}
function correct(s,expected){const f=factors(s);return f!==null&&JSON.stringify(f)===JSON.stringify(expected.map(Number).sort((a,b)=>a-b))}
function save(){localStorage.setItem(storageKey,JSON.stringify(responses));}
function render(){items.innerHTML='';data.forEach((q,i)=>{const d=document.createElement('div');d.className='item';const l=document.createElement('span');l.className='letter';l.textContent='abcdef'[i]+'.';const num=document.createElement('span');num.textContent=q.n+' =';const inp=document.createElement('input');inp.className='answer';inp.type='text';inp.autocomplete='off';inp.setAttribute('aria-label','Prime factorisation of '+q.n);inp.value=responses[i]||'';const fb=document.createElement('div');fb.className='feedback';inp.addEventListener('input',()=>{responses[i]=inp.value;save();d.classList.remove('correct','wrong');fb.textContent='';});d.append(l,num,inp,fb);items.append(d)})}
function evaluate(show){let score=0;[...items.children].forEach((d,i)=>{const inp=d.querySelector('input'),fb=d.querySelector('.feedback');const ok=correct(inp.value,data[i].factors);if(ok)score++;d.classList.toggle('correct',ok);d.classList.toggle('wrong',!ok);fb.textContent=ok?'✓ Correct':show?'Correct answer: '+data[i].factors.join(' × '):'✗ Incorrect';fb.style.color=ok?'#15803d':'#d22';});document.getElementById('score').textContent='Marks: '+score+' / '+data.length;return score}
document.getElementById('submit').onclick=()=>{const score=evaluate(false);const payload={exerciseType:'FILL_BLANK',response:Object.fromEntries(data.map((q,i)=>['question'+(i+1),responses[i]||''])),score,total:data.length};window.dispatchEvent(new CustomEvent('VIDYALAYA_EXERCISE_SUBMIT',{detail:payload}));if(typeof window.submitExercise==='function')window.submitExercise(payload)};
document.getElementById('show').onclick=()=>evaluate(true);
document.getElementById('reset').onclick=()=>{responses=[];localStorage.removeItem(storageKey);document.getElementById('score').textContent='Marks: 0 / '+data.length;render()};render();
</script></body></html>
