<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kopal 4 Chapter 14 MCQ</title><style>*{box-sizing:border-box}body{margin:0;background:#c9faff;font-family:"Noto Sans Devanagari","Mangal",sans-serif;color:#202b35}.wrap{width:min(1050px,95vw);margin:24px auto;background:#fff;border:3px solid #00aeed;border-radius:23px;padding:25px}h2{margin:0 0 18px;color:#00a8e6;font-size:25px}.q{background:#e9faff;border:1.5px solid #00b7fa;border-radius:12px;padding:14px;margin:10px 0}.prompt{font-size:18px;margin-bottom:10px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.opt{background:#fff;border:1px solid #8adcf9;border-radius:9px;padding:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:49px}.opt.sel{border:2px solid #008ff0;background:#d5f4ff}.opt.good,.slot.good{border:2px solid #22aa55!important;background:#e0ffe9!important}.opt.bad,.slot.bad{border:2px solid #f04747!important;background:#ffe2e2!important}.square{border:1.5px solid #00a9fa;border-radius:3px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:#0068d9;font-weight:800}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:23px 0 10px}button.action{border:0;border-radius:28px;background:#ff8000;color:#fff;padding:12px 20px;cursor:pointer;font-weight:bold}.marks{text-align:center;color:#0058bd;font-size:19px;font-weight:bold}.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#def8ff;padding:15px;border-radius:12px;margin-bottom:12px}.chip{background:#fff;border:1px solid #00a9ff;border-radius:8px;padding:9px 15px;cursor:grab;font-size:18px}.chip.chosen{background:#b6eefe;outline:2px solid #008cdb}.chip.used{opacity:.45}.slot{display:inline-flex;min-width:135px;min-height:43px;border:2px dashed #f87c62;border-radius:8px;background:#fff;align-items:center;justify-content:center;padding:5px 10px;cursor:pointer;font-size:18px}.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:700px){.wrap{padding:15px}.opts,.rows{grid-template-columns:1fr}h2{font-size:21px}}</style><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ–</h2><div id="questions"></div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="showAnswer()">Show Answer</button><button class="action" onclick="resetAll()">Reset</button></div><div class="marks" id="marks">Marks: 0 / 4</div></main><script>const questions=[["तेनालीरामन के घर का बगीचा __________ कहाँ था।", ["आगे", "पिछवाड़े", "बगल में"]], ["तेनालीरामन की बात सुनकर चोरों के क्या खड़े हो गए?", ["पाँव", "हाथ", "कान"]], ["तेनालीरामन और उसकी पत्नी ने कुएँ में क्या फेंका?", ["लकड़ी का बक्सा", "लोहे की संदूक", "झोला"]], ["कहा गया है कि मुसीबत के समय __________ से काम लेना चाहिए।", ["दिल", "नफ़रत", "बुद्धि"]]],correct=[1, 2, 0, 2],key='kopal-4-ch14-mcq-v1';let chosen=JSON.parse(localStorage.getItem(key)||'null')||Array(questions.length).fill(null);function save(){localStorage.setItem(key,JSON.stringify(chosen))}function render(){document.getElementById('questions').innerHTML=questions.map((q,i)=>`<div class="q"><div class="prompt">(${['क','ख','ग','घ'][i]}) ${q[0]}</div><div class="opts">${q[1].map((v,j)=>`<div class="opt ${chosen[i]===j?'sel':''}" onclick="choose(${i},${j})"><span>(${['i','ii','iii'][j]}) ${v}</span><span class="square">${chosen[i]===j?'✓':''}</span></div>`).join('')}</div></div>`).join('')}function choose(i,j){chosen[i]=j;save();render()}function submit(){render();let n=0;document.querySelectorAll('.q').forEach((q,i)=>{if(chosen[i]===correct[i])n++;q.querySelectorAll('.opt').forEach((o,j)=>{if(chosen[i]===j)o.classList.add(j===correct[i]?'good':'bad')})});document.getElementById('marks').textContent=`Marks: ${n} / ${questions.length}`}function showAnswer(){chosen=[...correct];save();submit()}function resetAll(){chosen=Array(questions.length).fill(null);save();render();document.getElementById('marks').textContent=`Marks: 0 / ${questions.length}`}render();</script></html>
