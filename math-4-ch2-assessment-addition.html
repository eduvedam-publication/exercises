<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add the following.</title><style>*{box-sizing:border-box}body{margin:0;background:#e3faff;font-family:Arial;color:#222}.wrap{max-width:920px;margin:18px auto;background:white;border:3px solid #00a9d7;border-radius:23px;padding:22px}h2{font:700 24px Georgia;color:#00a9d7;margin:0 0 16px}.question{background:#fff0f2;border:1px solid #ffc0c9;border-radius:10px;padding:11px;margin:10px 0;font:17px Georgia;line-height:1.45}.options{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.option{background:white;border:1px solid #78cfe5;border-radius:7px;padding:8px;text-align:left;cursor:pointer;font:16px Georgia}.option.selected{background:#d7f5ff;border:2px solid #00a5d7}.ok{background:#d9f7dd!important;border-color:#13a354!important}.bad{background:#ffe0e3!important;border-color:#ed3349!important;animation:blink .35s 3}@keyframes blink{50%{background:#ff9da6}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.sum{background:#fff1e6;border:1px solid #ffc28d;border-radius:12px;padding:13px}.sum table{border-collapse:collapse;margin:0 auto;font:20px Georgia}.sum th{font:700 14px Georgia;color:#f05b91}.sum td,.sum th{border:1px solid #ffcea1;min-width:35px;height:32px;text-align:center}.sum .result td{border-top:2px solid #f80}.answer{width:100%;border:2px solid #ff515e;font-size:19px;padding:6px;margin-top:10px}.actions{display:flex;justify-content:center;gap:12px;margin-top:24px}.actions button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:white;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0054b7;font-weight:bold;font-size:21px;margin-top:14px}@media(max-width:650px){.wrap{margin:7px;padding:12px}.grid,.options{grid-template-columns:1fr}h2{font-size:20px}}</style></head><body><main class="wrap"><h2>Add the following.</h2><div class="grid"><section class="sum"><b>a.</b><table><tr><th></th><th>TTh</th><th>Th</th><th>H</th><th>T</th><th>O</th></tr><tr><td></td><td>6</td><td>3</td><td>4</td><td>4</td><td>8</td></tr><tr><td></td><td>1</td><td>0</td><td>4</td><td>7</td><td>9</td></tr><tr><td>+</td><td>2</td><td>1</td><td>8</td><td>6</td><td>6</td></tr></table><input class="answer" inputmode="numeric" aria-label="Sum a" placeholder="Write the sum"></section><section class="sum"><b>b.</b><table><tr><th></th><th>L</th><th>TTh</th><th>Th</th><th>H</th><th>T</th><th>O</th></tr><tr><td></td><td>·</td><td>8</td><td>9</td><td>6</td><td>4</td><td>5</td></tr><tr><td></td><td>·</td><td>2</td><td>7</td><td>4</td><td>9</td><td>8</td></tr><tr><td>+</td><td>·</td><td>2</td><td>3</td><td>7</td><td>6</td><td>1</td></tr></table><input class="answer" inputmode="numeric" aria-label="Sum b" placeholder="Write the sum"></section><section class="sum"><b>c.</b><table><tr><th></th><th>TL</th><th>L</th><th>TTh</th><th>Th</th><th>H</th><th>T</th><th>O</th></tr><tr><td></td><td>·</td><td>2</td><td>1</td><td>0</td><td>5</td><td>0</td><td>3</td></tr><tr><td></td><td>·</td><td>·</td><td>9</td><td>5</td><td>6</td><td>8</td><td>7</td></tr><tr><td></td><td>·</td><td>7</td><td>8</td><td>0</td><td>3</td><td>7</td><td>6</td></tr><tr><td>+</td><td>·</td><td>·</td><td>·</td><td>6</td><td>7</td><td>5</td><td>6</td></tr></table><input class="answer" inputmode="numeric" aria-label="Sum c" placeholder="Write the sum"></section><section class="sum"><b>d.</b><table><tr><th></th><th>L</th><th>TTh</th><th>Th</th><th>H</th><th>T</th><th>O</th></tr><tr><td></td><td>3</td><td>6</td><td>5</td><td>8</td><td>4</td><td>4</td></tr><tr><td></td><td>1</td><td>1</td><td>6</td><td>5</td><td>4</td><td>2</td></tr><tr><td></td><td>·</td><td>·</td><td>·</td><td>·</td><td>·</td><td>6</td></tr><tr><td>+</td><td>·</td><td>2</td><td>5</td><td>0</td><td>0</td><td>5</td></tr></table><input class="answer" inputmode="numeric" aria-label="Sum d" placeholder="Write the sum"></section></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="reset()">Reset</button></div><div id="score">Score: 0 / 4</div></main><script>const ANSWERS=[95793, 140904, 1093322, 507397],MODE='fill',KEY='math-4-ch2-assessment-addition',chosen={};const inputs=[...document.querySelectorAll('.answer')],score=document.getElementById('score');function save(){localStorage.setItem(KEY,JSON.stringify({chosen,values:inputs.map(x=>x.value),score:score.textContent}))}function choose(q,v){chosen[q]=v;document.querySelectorAll(`[data-q="${q}"]`).forEach(b=>{b.classList.toggle('selected',+b.dataset.v===v);b.classList.remove('ok','bad')});save()}function check(){let n=0;if(MODE==='mcq'){ANSWERS.forEach((a,i)=>{const good=chosen[i]===a;if(good)n++;document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>{b.classList.remove('ok','bad');if(+b.dataset.v===chosen[i])b.classList.add(good?'ok':'bad')})})}else{inputs.forEach((e,i)=>{const good=e.value.replace(/[\s,]/g,'')===String(ANSWERS[i]);e.classList.toggle('ok',good);e.classList.toggle('bad',!good);if(good)n++})}score.textContent=`Score: ${n} / ${ANSWERS.length}`;save()}function reset(){inputs.forEach(x=>{x.value='';x.classList.remove('ok','bad')});Object.keys(chosen).forEach(k=>delete chosen[k]);document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected','ok','bad'));score.textContent=`Score: 0 / ${ANSWERS.length}`;localStorage.removeItem(KEY)}inputs.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('ok','bad');save()}));try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){inputs.forEach((x,i)=>x.value=d.values?.[i]||'');Object.entries(d.chosen||{}).forEach(([q,v])=>choose(+q,+v));if(d.score)score.textContent=d.score}}catch(e){}</script></body></html>
