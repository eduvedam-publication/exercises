<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1120px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px 34px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}
.math-grid{display:grid;width:100%;clear:both;grid-template-columns:repeat(3,minmax(230px,1fr));gap:34px 55px}
.problem{display:flex;align-items:flex-start;gap:8px;font:19px Georgia,"Times New Roman",serif}
.label{width:24px;padding-top:6px}
.card{width:190px;min-width:190px;background:#fdecef;padding:8px}
.place{display:grid;text-align:center;color:#ff1670;font-size:18px;border-bottom:1px solid #52d2ef;padding:4px 0 6px}
.c3{grid-template-columns:repeat(3,1fr)} .c4{grid-template-columns:repeat(4,1fr)}
.numrow{display:grid;text-align:center;align-items:center;font-size:20px;min-height:36px;border-bottom:1px solid #52d2ef;position:relative}
.numrow.add:before{content:"+";position:absolute;left:2px;font-size:21px}
.answer{display:block;width:100%;height:39px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:4px 7px;margin-top:5px}
.cell-input{width:43px;height:35px;border:2px solid #ff3b30;background:#fff;font-size:18px;text-align:center;margin:auto}
.actions{display:flex!important;justify-content:center!important;align-items:center!important;gap:14px!important;margin:36px auto 0!important;width:100%!important;clear:both!important;grid-column:1/-1!important}
.actions button{border:0;border-radius:23px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:bold;cursor:pointer}
.score{display:block!important;text-align:center!important;color:#064bb4;font-size:22px;font-weight:bold;margin:16px auto 0!important;width:100%!important;clear:both!important;grid-column:1/-1!important}
.ok{background:#dcf8df!important;border-color:#009b8e!important}
.bad{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:850px){.math-grid{grid-template-columns:repeat(2,minmax(230px,1fr))}}
@media(max-width:570px){body{padding:0}.exercise{border-radius:0;padding:18px}.math-grid{grid-template-columns:1fr}}
</style></head><body><main class="exercise"><h1>Add the following:</h1><div class="math-grid"><div class="problem"><span class="label">a.</span><div class="card"><div class="place c3"><span>H</span><span>T</span><span>O</span></div><div class="numrow c3 ><span>2</span><span>6</span><span>4</span></div><div class="numrow c3 add><span>5</span><span>4</span><span>7</span></div><input id="a0" class="answer" inputmode="numeric"></div></div><div class="problem"><span class="label">b.</span><div class="card"><div class="place c4"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="numrow c4 ><span>9</span><span>2</span><span>9</span><span>8</span></div><div class="numrow c4 add><span></span><span>1</span><span>8</span><span>2</span></div><input id="a1" class="answer" inputmode="numeric"></div></div><div class="problem"><span class="label">c.</span><div class="card"><div class="place c4"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="numrow c4 ><span>4</span><span>3</span><span>2</span><span>9</span></div><div class="numrow c4 add><span>3</span><span>8</span><span>2</span><span>6</span></div><input id="a2" class="answer" inputmode="numeric"></div></div><div class="problem"><span class="label">d.</span><div class="card"><div class="place c3"><span>H</span><span>T</span><span>O</span></div><div class="numrow c3 ><span>5</span><span>8</span><span>4</span></div><div class="numrow c3 add><span>2</span><span>3</span><span>6</span></div><input id="a3" class="answer" inputmode="numeric"></div></div><div class="problem"><span class="label">e.</span><div class="card"><div class="place c4"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="numrow c4 ><span></span><span>7</span><span>9</span><span>2</span></div><div class="numrow c4 ><span>4</span><span>2</span><span>6</span><span>7</span></div><div class="numrow c4 add><span></span><span>6</span><span>8</span><span>4</span></div><input id="a4" class="answer" inputmode="numeric"></div></div><div class="problem"><span class="label">f.</span><div class="card"><div class="place c4"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="numrow c4 ><span>6</span><span>0</span><span>1</span><span>7</span></div><div class="numrow c4 ><span></span><span>9</span><span>2</span><span>7</span></div><div class="numrow c4 ><span></span><span>1</span><span>8</span><span>9</span></div><div class="numrow c4 add><span>2</span><span>4</span><span>1</span><span>3</span></div><input id="a5" class="answer" inputmode="numeric"></div></div></div>
<div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div>
<div id="score" class="score">Score: 0 / 6</div></main><script>
const answers=['811', '9480', '8155', '820', '5743', '9546'];
function check(){
 let s=0;
 answers.forEach((a,i)=>{
   const e=document.getElementById('a'+i);
   const ok=e.value.trim()===a;
   e.classList.remove('ok','bad'); e.classList.add(ok?'ok':'bad');
   if(ok)s++;
 });
 document.getElementById('score').textContent=`Score: ${s} / 6`;
}
function resetAll(){
 document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});
 document.getElementById('score').textContent='Score: 0 / 6';
}
</script></body></html>
