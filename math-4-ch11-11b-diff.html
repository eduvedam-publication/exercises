<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find the difference.</title><style>
*{box-sizing:border-box}body{margin:0;background:#d5fbff;font-family:Georgia,'Times New Roman',serif;color:#172536}.wrap{width:min(1100px,96%);margin:22px auto;padding:24px 28px;background:white;border:3px solid #00a9e9;border-radius:23px}h1{font-size:27px;color:#00a9e9;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 24px}.problem{background:#eafaff;border:1px solid #1bbaf4;border-radius:12px;padding:12px 16px;display:flex;align-items:flex-start;gap:10px;min-width:0}.letter{font-weight:bold;padding-top:8px}.stack{min-width:0;width:100%;max-width:190px;margin:auto}.num{display:flex;justify-content:flex-end;align-items:center;gap:7px;font-size:19px;min-height:28px;font-variant-numeric:tabular-nums}.num .symbol{margin-right:auto}.rule{border-bottom:2px solid #263f52;margin:4px 0 7px}.answer{width:100%;height:37px;border:2px solid #ff5a45;background:white;border-radius:4px;padding:5px 8px;font-size:18px;font-family:inherit;color:#222}.answer.correct{border-color:#19a55d;background:#e2ffe9}.answer.wrong{border-color:#ed3042;background:#fff0f0;animation:blink .6s 2}@keyframes blink{50%{background:#ffc7cc}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}button{border:0;background:#ff8100;color:white;border-radius:25px;padding:11px 19px;font-size:15px;font-weight:bold;cursor:pointer}button:hover{background:#e86f00}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:16px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.problem{padding:10px}.wrap{width:98%}h1{font-size:23px}}</style></head><body><main class="wrap"><h1>Find the difference.</h1><div class="grid" id="questions"></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAnswers()">Reset</button></div></main><script>
const data=[{"id": "a", "nums": ["4137.98", "2643.56"], "answer": "1494.42"}, {"id": "b", "nums": ["5238.46", "2845.28"], "answer": "2393.18"}, {"id": "c", "nums": ["6826.03", "4978.78"], "answer": "1847.25"}, {"id": "d", "nums": ["7355.37", "2593.49"], "answer": "4761.88"}, {"id": "e", "nums": ["5388.26", "1987.39"], "answer": "3400.87"}, {"id": "f", "nums": ["8239.62", "7968.73"], "answer": "270.89"}, {"id": "g", "nums": ["8436.25", "5298.38"], "answer": "3137.87"}, {"id": "h", "nums": ["9263.34", "6754.92"], "answer": "2508.42"}, {"id": "i", "nums": ["7325.49", "7255.68"], "answer": "69.81"}, {"id": "j", "nums": ["4895.97", "2906.45"], "answer": "1989.52"}, {"id": "k", "nums": ["3829.17", "2945.09"], "answer": "884.08"}, {"id": "l", "nums": ["9393.80", "7996.93"], "answer": "1396.87"}];const op="\u2212";const key='exercise-'+"math-4-ch11-11b.html";const root=document.getElementById('questions');
for(const q of data){const card=document.createElement('div');card.className='problem';const rows=q.nums.map((n,i)=>'<div class="num"><span class="symbol">'+(i===q.nums.length-1?op:'')+'</span><span>₹ '+n+'</span></div>').join('');card.innerHTML='<span class="letter">'+q.id+'.</span><div class="stack">'+rows+'<div class="rule"></div><input class="answer" id="a-'+q.id+'" aria-label="Answer '+q.id+'" inputmode="decimal" autocomplete="off" placeholder="Enter amount"></div>';root.appendChild(card)}
function save(){const a={};for(const q of data)a[q.id]=document.getElementById('a-'+q.id).value;try{localStorage.setItem(key,JSON.stringify(a))}catch(e){}}
try{const old=JSON.parse(localStorage.getItem(key)||'{}');for(const q of data)if(old[q.id]!==undefined)document.getElementById('a-'+q.id).value=old[q.id]}catch(e){}
root.addEventListener('input',e=>{if(e.target.matches('input')){e.target.classList.remove('correct','wrong');save()}});
function normal(v){return v.trim().replace(/[₹,\s]/g,'').replace(/^Rs\.?/i,'')}
function checkAnswers(){for(const q of data){const e=document.getElementById('a-'+q.id);e.classList.remove('correct','wrong');if(!e.value.trim())continue;void e.offsetWidth;e.classList.add(Number(normal(e.value))===Number(q.answer)?'correct':'wrong')}save()}
function showAnswers(){for(const q of data){const e=document.getElementById('a-'+q.id);e.value=q.answer;e.classList.remove('wrong');e.classList.add('correct')}save()}
function resetAnswers(){for(const q of data){const e=document.getElementById('a-'+q.id);e.value='';e.classList.remove('correct','wrong')}save()}
</script></body></html>
