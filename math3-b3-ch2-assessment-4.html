<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#e8faff;font-family:Arial,sans-serif}.ex{max-width:1100px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:26px;padding:28px}h1{color:#00a5dc;font-size:24px;margin:0 0 22px}.actions{text-align:center;margin-top:28px}.actions button{border:0;border-radius:22px;padding:11px 20px;margin:5px;background:#ff8200;color:white;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:21px;font-weight:bold;margin-top:12px}.ans{border:2px solid #ff3b30;height:36px;font-size:17px;padding:4px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}.qs{display:grid;gap:18px}.q{font:19px Georgia,serif}.opts{display:flex;flex-wrap:wrap;gap:10px 20px;margin:9px 0 0 24px}.opt{border:2px solid #ff1680;border-radius:10px;background:#fff;padding:8px 14px;cursor:pointer}.opt.sel{background:#ffe1ee}.opt.ok{background:#dcf8df}.opt.bad{background:#ffe1e1}.binary{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.binary .choices{display:flex;gap:8px}.binary button{border:2px solid #ff1680;background:#fff;border-radius:8px;padding:7px 14px}.selected{background:#ffe1ee!important}.cols{display:grid;text-align:center}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.card{background:#fdecef;padding:8px;width:170px}.head{color:#ff1680;border-bottom:1px solid #63d5ef;padding:5px}.row{border-bottom:1px solid #63d5ef;padding:6px;position:relative;min-height:34px}.plus:before{content:"+";position:absolute;left:-5px}.mathgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}.problem{display:flex;gap:7px;align-items:flex-start}.card .ans{width:100%;margin-top:4px}@media(max-width:750px){.mathgrid{grid-template-columns:1fr}.ex{padding:15px}body{padding:0}}</style></head><body><main class="ex"><h1>State true or false.</h1><div class="qs"><div class="q binary"><span>a. The sum is always greater than any of the addends.</span><span class="choices"><button onclick="sel(0,'T',this)">True</button><button onclick="sel(0,'F',this)">False</button></span></div><div class="q binary"><span>b. The digit in the ones place of the sum 3423 + 6255 is 7.</span><span class="choices"><button onclick="sel(1,'T',this)">True</button><button onclick="sel(1,'F',this)">False</button></span></div><div class="q binary"><span>c. In the sum of 452, 7155 and 1625, the number at thousands place is 9.</span><span class="choices"><button onclick="sel(2,'T',this)">True</button><button onclick="sel(2,'F',this)">False</button></span></div><div class="q binary"><span>d. 200 + 500 + 800 = 700 + 100</span><span class="choices"><button onclick="sel(3,'T',this)">True</button><button onclick="sel(3,'F',this)">False</button></span></div></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div></main><script>let picks={};const ans=['T', 'F', 'T', 'F'];function sel(i,v,e){picks[i]=v;e.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));e.classList.add('selected')}function check(){let s=0;ans.forEach((a,i)=>{let bs=document.querySelectorAll('.binary')[i].querySelectorAll('button');bs.forEach(x=>x.classList.remove('ok','bad'));if(picks[i]){let k=picks[i]=='T'?0:1;bs[k].classList.add(picks[i]===a?'ok':'bad');if(picks[i]===a)s++}});score.textContent=`Score: ${s} / 4`}function resetAll(){picks={};document.querySelectorAll('.binary button').forEach(x=>x.className='');score.textContent='Score: 0 / 4'}</script></body></html>
