<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही या गलत</title><style>*{box-sizing:border-box}body{margin:0;background:#cff9ff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#19212b}.wrap{max-width:980px;margin:24px auto;padding:24px;border:3px solid #00aeed;border-radius:22px;background:white}h2{color:#00a5e6;margin:0 0 20px;font-size:26px}.q{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#ebfaff;border:1.5px solid #00b7ff;border-radius:12px;margin:9px 0;padding:14px;font-size:19px}.choices{display:flex;gap:8px;flex-shrink:0}.choice{border:2px solid #00b5f5;border-radius:7px;background:white;color:#145b85;min-width:43px;height:41px;font-size:23px;cursor:pointer}.choice.selected{background:#cdefff;border-color:#007bca}.choice.correct{background:#d9ffe8;border-color:#19a65a}.choice.wrong{background:#ffe4e4;border-color:#f34d4d}.controls{text-align:center;margin-top:24px}button.action{border:0;border-radius:24px;background:#ff7900;color:white;font-weight:bold;padding:11px 19px;margin:3px;cursor:pointer}.marks{text-align:center;color:#0048bf;font-weight:bold;font-size:19px;margin-top:10px}@media(max-width:650px){.wrap{margin:6px;padding:13px}.q{font-size:16px}h2{font-size:22px}.choice{min-width:36px;height:37px}}</style></head><body><main class="wrap"><h2>सही (✓) या गलत (✗) का निशान लगाएँ–</h2><div id="questions"></div><div class="controls"><button class="action" onclick="check()">Submit</button><button class="action" onclick="showAnswer()">Show Answer</button><button class="action" onclick="resetAll()">Reset</button></div><div class="marks" id="marks">Marks: 0 / 4</div></main><script>
const KEY='kopal-4-ch9-tick.html';const data=[['झूरी की पत्नी के भाई का नाम राधेश्याम था।',false],['पशु भी प्यार का भूखा होता है।',true],['गयाप्रसाद हीरा-मोती का बहुत ध्यान रखता था।',false],['नीलामी में ऊँची बोली बोलकर एक व्यापारी ने हीरा-मोती को खरीद लिया।',true]];let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function render(){const el=document.getElementById('questions');el.innerHTML='';data.forEach((q,i)=>{let row=document.createElement('div');row.className='q';let txt=document.createElement('span');txt.textContent='('+['क','ख','ग','घ'][i]+') '+q[0];row.append(txt);let group=document.createElement('div');group.className='choices';[true,false].forEach(v=>{let b=document.createElement('button');b.type='button';b.className='choice'+(state[i]===v?' selected':'');b.textContent=v?'✓':'✗';b.setAttribute('aria-label',v?'सही':'गलत');b.onclick=()=>{state[i]=v;save();render()};group.append(b)});row.append(group);el.append(row)})}function check(){let score=0;document.querySelectorAll('.q').forEach((row,i)=>{row.querySelectorAll('.choice').forEach((btn,j)=>{let v=j===0;btn.classList.remove('correct','wrong');if(state[i]===v){let ok=v===data[i][1];btn.classList.add(ok?'correct':'wrong');if(ok)score++}})});document.getElementById('marks').textContent='Marks: '+score+' / 4'}function showAnswer(){data.forEach((q,i)=>state[i]=q[1]);save();render();check()}function resetAll(){state={};save();render();document.getElementById('marks').textContent='Marks: 0 / 4'}render();
</script></body></html>
