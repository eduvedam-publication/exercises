<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solve Division by Estimating the Quotient</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#e5f9fd;font-family:Arial,sans-serif}
.exercise{
  max-width:1080px;min-height:400px;margin:auto;background:#fff;
  border:4px solid #08a8d8;border-radius:28px;padding:30px 42px;
  display:flex;flex-direction:column
}
h1{margin:0 0 34px;color:#00a3dc;font-size:24px}
.content{flex:1}
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  column-gap:65px;row-gap:42px
}
.item{
  display:flex;align-items:center;gap:9px;
  font:20px Georgia,serif;white-space:nowrap
}
.ans{
  width:90px;height:38px;border:2px solid red;
  font-size:18px;text-align:center;padding:4px
}
.ok{background:#dcf8df;border-color:#009b8e}
.bad{background:#ffe1e1;border-color:#e43d30}
.controls{
  margin-top:auto;padding-top:36px;
  display:flex;justify-content:center;gap:14px
}
.controls button{
  border:0;border-radius:24px;background:#ff7d00;color:#fff;
  font-weight:bold;padding:12px 22px;cursor:pointer
}
.score{
  text-align:center;color:#064bb4;font-size:22px;
  font-weight:bold;margin-top:15px
}
@media(max-width:760px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .exercise{padding:22px}
}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="exercise">
<h1>Solve the following division by estimating the quotient.</h1>

<section class="content">
<div class="grid">
  <div class="item"><b>a.</b>239 ÷ 3 <input class="ans" id="a0" inputmode="numeric"></div>
  <div class="item"><b>b.</b>5637 ÷ 4 <input class="ans" id="a1" inputmode="numeric"></div>
  <div class="item"><b>c.</b>632 ÷ 6 <input class="ans" id="a2" inputmode="numeric"></div>
  <div class="item"><b>d.</b>4276 ÷ 4 <input class="ans" id="a3" inputmode="numeric"></div>
  <div class="item"><b>e.</b>585 ÷ 2 <input class="ans" id="a4" inputmode="numeric"></div>
  <div class="item"><b>f.</b>6956 ÷ 8 <input class="ans" id="a5" inputmode="numeric"></div>
</div>
</section>

<div class="controls">
  <button onclick="check()">Check Answers</button>
  <button onclick="resetAll()">Reset</button>
</div>
<div class="score" id="score">Score: 0 / 6</div>
</main>

<script>
const answers=["80","1410","105","1070","295","870"];

function check(){
  let s=0;
  answers.forEach((a,i)=>{
    const e=document.getElementById("a"+i);
    const good=e.value.trim()===a;
    e.classList.remove("ok","bad");
    e.classList.add(good?"ok":"bad");
    if(good)s++;
  });
  document.getElementById("score").textContent="Score: "+s+" / 6";
}
function resetAll(){
  document.querySelectorAll("input").forEach(e=>{
    e.value="";
    e.classList.remove("ok","bad");
  });
  document.getElementById("score").textContent="Score: 0 / 6";
}
</script>
</body>
</html>
