ton onclick="check()">Submit</button><button onclick="location.reload()">Reset</button></div><div id="result"></div></main><script>const A=[["Thought"], ["youth"], ["Reading", "wisdom"], ["music", "soul"], ["Prayer", "union", "God"]];function check(){let n=0,t=0;A.forEach((r,i)=>r.forEach((a,j)=>{t++;let e=document.getElementById(`f${i}_${j}`),ok=e.value.trim().toLowerCase()===a.toLowerCase();e.className=ok?'ok':'bad';if(ok)n++}));result.textContent=`Score: ${n} / ${t}`;}</script></body></html>
