<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiple choice questions.</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;font-family:Arial,sans-serif;background:#eaf8ff;color:#292929}.wrap{max-width:1000px;margin:auto;background:#fff;border:5px solid #08b6e8;border-radius:24px;padding:20px}h1{color:#ff0878;font-size:24px;margin:0 0 16px}.card{background:#f9fcff;border:2px solid #c9efff;border-radius:17px;padding:14px 17px;margin:10px 0}.q{font-size:17px;font-weight:600;margin-bottom:8px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.opt,.choice{padding:10px;border:2px solid #ff4fa0;border-radius:13px;background:#fff;font-size:15px;cursor:pointer}.correct{background:#dff7df!important;border-color:#27843a!important}.wrong{background:#ffdede!important;border-color:#c62828!important}.score{text-align:center;color:#064bad;font-size:21px;font-weight:bold;margin:13px}.actions{text-align:center}.btn{padding:10px 22px;border:0;border-radius:22px;background:#ff7b00;color:white;font-weight:bold;margin:4px;cursor:pointer}.row{font-size:17px;line-height:2}.ans{padding:7px;border:2px solid #ff4fa0;border-radius:7px;font-size:15px}.tf{display:flex;gap:8px;flex-wrap:wrap}.sentence{width:100%;padding:8px;border:2px solid #ff4fa0;border-radius:8px;font-size:15px}@media(max-width:650px){.wrap{padding:10px;border-width:3px}.opts{grid-template-columns:1fr}h1{font-size:20px}.q,.row{font-size:15px}}</style></head><body><div class="wrap"><h1>Multiple choice questions.</h1><div id="quiz"></div><div id="score" class="score"></div><div class="actions"><button class="btn" onclick="load()">Reset</button></div></div><script>const Q=[{"q": "1. Where did Job live?", "o": ["i. Damaskas", "ii. Jerusalem", "iii. Egypt"], "a": "i. Damaskas"}, {"q": "2. Why did Satan think Job worshipped God?", "o": ["i. Job was afraid of God", "ii. God had blessed and protected him", "iii. Job wanted to become rich"], "a": "ii. God had blessed and protected him"}, {"q": "3. What did Satan challenge God to do?", "o": ["i. Give Job more wealth", "ii. Take away everything Job had", "iii. Make Job a king"], "a": "ii. Take away everything Job had"}, {"q": "4. What happened to Job's wealth and property?", "o": ["i. They increased", "ii. They were stolen", "iii. He lost everything"], "a": "iii. He lost everything"}, {"q": "5. How did God reward Job for his faithfulness?", "o": ["i. He made him a king", "ii. He restored his household and blessed him", "iii. He gave him a new kingdom"], "a": "ii. He restored his household and blessed him"}];let sc=0;function load(){sc=0;quiz.innerHTML='';score.textContent='Score: 0 / '+Q.length;Q.forEach(z=>{let c=document.createElement('div');c.className='card';c.innerHTML='<div class="q">'+z.q+'</div>';let o=document.createElement('div');o.className='opts';z.o.forEach(v=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>{if(o.dataset.d)return;o.dataset.d=1;o.querySelectorAll('button').forEach(k=>{k.disabled=true;if(k.textContent===z.a)k.classList.add('correct')});if(v===z.a)sc++;else b.classList.add('wrong');score.textContent='Score: '+sc+' / '+Q.length};o.append(b)});c.append(o);quiz.append(c)})}load();</script></body></html>
