<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 – Chapter 8 – 8(h) Find the Product</title><style>
*{box-sizing:border-box}body{margin:0;background:#d7faff;font-family:Georgia,'Times New Roman',serif;color:#20232b}.sheet{max-width:1060px;margin:12px auto;background:white;border:3px solid #00a9df;border-radius:22px;padding:22px 25px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:25px;color:#00a8d9;margin:0 0 20px}.tag{background:#00ade3;color:white;border-radius:5px;padding:6px 17px;font:13px Arial;align-self:flex-start}.questions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 12px}.question{background:#ecfaff;border:1px solid #02b4f1;border-radius:10px;min-height:75px;padding:12px 10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:17px}.letter{font-weight:bold;min-width:21px}.expression{white-space:nowrap}.answer{width:90px;min-width:0;height:36px;border:2px solid #ff6060;border-radius:4px;background:white;font:17px Georgia;padding:4px 6px;outline:none}.answer.correct{border-color:#18b767;background:#eaffef;color:#087d3c}.answer.wrong{border-color:#f23d4a;background:#fff0f0;color:#bf1725;animation:blink .6s ease-in-out 3}@keyframes blink{50%{box-shadow:0 0 0 4px #ff9999}}footer{text-align:center;margin-top:25px}button{border:0;border-radius:25px;background:#ff8000;color:white;font:bold 15px Georgia;padding:11px 21px;margin:0 4px;cursor:pointer}button:hover{background:#e97400}.score{font:bold 20px Arial;color:#0055bd;margin-top:15px}@media(max-width:850px){.questions{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.sheet{margin:5px;padding:15px 11px}.questions{grid-template-columns:1fr}.question{min-height:58px}h1{font-size:21px}.tag{font-size:11px;padding:5px 8px}}
</style></head><body><main class="sheet"><header><h1>Find the product.</h1><span class="tag">Analysing</span></header><section class="questions" id="questions"></section><footer><button id="check">Check Answers</button><button id="reset">Reset</button><div class="score" id="score">Score: 0 / 20</div></footer></main><script>
const data=[["3.45", "6"], ["5.98", "8"], ["9.63", "7"], ["58.23", "4"], ["28.82", "8"], ["907.98", "5"], ["14.16", "12"], ["28.03", "15"], ["49.38", "17"], ["55.17", "18"], ["67.27", "12"], ["36.18", "14"], ["97.28", "11"], ["37.12", "19"], ["84.07", "13"], ["54.32", "13"], ["24.28", "16"], ["96.07", "15"], ["36.12", "13"], ["76.18", "12"]];const key='math-4-ch8-8h-find-product-v1';const letters='abcdefghijklmnopqrst';const box=document.getElementById('questions');let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};data.forEach(([a,b],i)=>{let el=document.createElement('div');el.className='question';el.innerHTML=`<span class="letter">${letters[i]}.</span><span class="expression">${a} × ${b} =</span><input class="answer" inputmode="decimal" aria-label="Answer ${letters[i]}" data-i="${i}" autocomplete="off">`;box.appendChild(el);let input=el.querySelector('input');input.value=saved[i]||'';input.addEventListener('input',()=>{saved[i]=input.value;localStorage.setItem(key,JSON.stringify(saved));input.classList.remove('correct','wrong')})});document.getElementById('check').onclick=()=>{let n=0;document.querySelectorAll('.answer').forEach(input=>{let i=+input.dataset.i;let expected=Math.round(Number(data[i][0])*Number(data[i][1])*1000)/1000;let valid=input.value.trim()!==''&&Number.isFinite(Number(input.value))&&Math.abs(Number(input.value)-expected)<1e-7;input.classList.remove('correct','wrong');if(valid){n++;input.classList.add('correct')}else if(input.value.trim()) {void input.offsetWidth;input.classList.add('wrong')}});document.getElementById('score').textContent=`Score: ${n} / ${data.length}`};document.getElementById('reset').onclick=()=>{saved={};localStorage.removeItem(key);document.querySelectorAll('.answer').forEach(e=>{e.value='';e.classList.remove('correct','wrong')});document.getElementById('score').textContent='Score: 0 / 20'};
</script></body></html>
