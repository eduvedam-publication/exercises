<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiply and simplify.</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;background:#b9fbff;color:#172735;font-family:Georgia,'Times New Roman',serif}.sheet{width:min(1050px,100%);padding:18px 22px;background:white;border:3px solid #00a9f4;border-radius:20px}h1{font:700 clamp(22px,3vw,31px) Arial,sans-serif;color:#009ff0;margin:0 0 12px}.bar{height:14px;border-radius:30px;background:#bff5fb;margin-bottom:10px}.row{background:#d9f8ff;border:1.5px solid #00a9ff;border-radius:11px;padding:9px 12px;margin:7px 0;font-size:clamp(17px,1.7vw,20px);width:100%;line-height:1.65}.row label{display:block}.row input,.row select{border:1.5px solid #009ff0;border-radius:7px;background:white;padding:6px 9px;font:inherit;width:clamp(75px,14vw,145px);max-width:80%;height:40px;vertical-align:middle;margin:2px 4px}.row select{width:auto;max-width:100%}.row input.correct,.choice.correct,.row select.correct{background:#e4ffed;border-color:#20a953}.row input.wrong,.choice.wrong,.row select.wrong{background:#fff0f0;border-color:#e62c38}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{background:#fff;border:1.5px solid #00a9ff;border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer;min-height:40px}.choice.selected{background:#9deaf7;border-color:#008ed0}.feedback{font:700 13px Arial,sans-serif;margin-left:8px}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px}.actions button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:10px 18px;font-weight:700;cursor:pointer}#score{text-align:center;color:#003bea;font:700 20px Arial,sans-serif;margin:9px 0 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #005ac0;outline-offset:2px}@media(max-width:620px){.sheet{padding:13px 10px}.row{padding:8px}.choice{padding:6px}}</style></head><body><main class="sheet"><h1>Multiply and simplify.</h1><div class="bar" aria-hidden="true"></div><div class="row"><label for="a0">a. 4/7 × ₹63 = <input id="a0" inputmode="text" autocomplete="off" aria-label="Answer a blank 1"><span class="feedback" id="f0" aria-live="polite"></span></label></div><div class="row"><label for="a1">b. 3/8 × 56 km = <input id="a1" inputmode="text" autocomplete="off" aria-label="Answer b blank 2"><span class="feedback" id="f1" aria-live="polite"></span></label></div><div class="row"><label for="a2">c. 8/5 × 90 paise = <input id="a2" inputmode="text" autocomplete="off" aria-label="Answer c blank 3"><span class="feedback" id="f2" aria-live="polite"></span></label></div><div class="row"><label for="a3">d. 1/10 × 550 ml = <input id="a3" inputmode="text" autocomplete="off" aria-label="Answer d blank 4"><span class="feedback" id="f3" aria-live="polite"></span></label></div><div class="actions"><button id="submit" type="button">Submit</button><button id="show" type="button">Show Answer</button><button id="reset" type="button">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 4</p></main><script>const answers=["₹36", "21 km", "144 paise", "55 ml"],key='exercise:math-5-ch4-4d-units.html',inputs=[...document.querySelectorAll('.row input,.row select')],score=document.getElementById('score');function norm(v){return String(v).trim().toLowerCase().replace(/\s+/g,' ').replace(/[−–]/g,'-').replace(/[₹°]/g,'')}function fraction(v){v=norm(v).replace(/,/g,'');if(/^[-+]?\d+\s+\d+\/\d+$/.test(v)){let [w,f]=v.split(/\s+/),[n,d]=f.split('/').map(Number);return Number(w)+Math.sign(Number(w))*n/d}if(/^[-+]?\d+(\/\d+)?$/.test(v)){let [n,d=1]=v.split('/').map(Number);return d? n/d:NaN}return NaN}function valid(v,a){if(Array.isArray(a))return a.some(x=>valid(v,x));if(norm(v)===norm(a))return true;let x=fraction(v),y=fraction(a);return Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<1e-9}function save(){try{localStorage.setItem(key,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}function clear(){inputs.forEach(x=>x.classList.remove('correct','wrong'));document.querySelectorAll('.feedback').forEach(f=>{f.textContent='';f.className='feedback'});score.textContent='Marks: 0 / '+answers.length}try{let old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old))old.forEach((v,i)=>{if(inputs[i]&&typeof v==='string')inputs[i].value=v})}catch(e){}inputs.forEach(x=>x.addEventListener('input',()=>{save();clear()}));document.getElementById('submit').onclick=()=>{let marks=0;inputs.forEach((x,i)=>{let ok=valid(x.value,answers[i]);marks+=ok;x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok);let f=document.getElementById('f'+i);f.textContent=ok?'✓ Correct':'✗ Wrong';f.className='feedback '+(ok?'ok':'no')});score.textContent=`Marks: ${marks} / ${answers.length}`;save();let detail={exerciseType:'FILL_BLANK',exerciseId:'math-5-ch4-4d-units.html',response:Object.fromEntries(inputs.map((x,i)=>['question'+(i+1),x.value])),marks,total:answers.length};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')};document.getElementById('show').onclick=()=>{inputs.forEach((x,i)=>x.value=Array.isArray(answers[i])?answers[i][0]:answers[i]);save();clear()};document.getElementById('reset').onclick=()=>{inputs.forEach(x=>x.value='');save();clear()};</script></body></html>
