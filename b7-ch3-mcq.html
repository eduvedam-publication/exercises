<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#dff8ff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:5px solid #08a6d1;border-radius:22px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;color:#ff0072;font-size:clamp(22px,3vw,30px);font-weight:800}.content{flex:1}.question{margin:12px 0;padding:13px 16px;border:2px solid #69dfff;border-radius:16px;background:#f3fbfe;font-size:clamp(16px,2vw,19px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option{border:2px solid #ff0072;background:#fff;border-radius:10px;padding:8px 13px;font-size:16px;cursor:pointer}.option.selected{background:#ffe7f1}.option.correct,.answer.correct,.choice.correct{background:#dff7e4!important}.option.wrong,.answer.wrong,.choice.wrong{background:#ffe2e2!important}.answer{border:2px solid #ff4c39;border-radius:5px;background:#fff;padding:6px 8px;font-size:17px;min-width:130px;max-width:190px;margin:2px 4px}.bottom{text-align:center;margin-top:22px}.btn{border:2px solid #ff0072;border-radius:10px;background:#fff;color:#111;font-size:16px;padding:8px 14px;margin:4px;cursor:pointer}.score{margin-top:9px;color:#087fc2;font-weight:800;font-size:18px}.tfrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.choices{display:flex;gap:8px}.choice{width:48px;height:42px;border:2px solid #ff0072;background:#fff;border-radius:9px;font-size:20px;cursor:pointer}.choice.selected{background:#ffe7f1}@media(max-width:650px){body{padding:7px}.exercise{padding:15px 11px}.options{flex-direction:column}.option{width:100%;text-align:left}.answer{min-width:105px;max-width:145px}.tfrow{align-items:flex-start}}</style><main class=exercise><h1 class=title>Multiple choice questions.</h1><div class=content id=content></div><div class=bottom><button class=btn onclick=check()>Submit</button><button class=btn onclick=resetEx()>Reset</button><div class=score id=score>Score: 0 / 5</div></div></main><script>function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function save(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){const p={exerciseType:t,response:r};try{parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}try{window.ReactNativeWebView&&window.ReactNativeWebView.postMessage(JSON.stringify({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p}))}catch(e){}}
const K='b7-ch3-mcq',D=[['What does the father want his son to learn about people?', ['Everyone is selfish', 'Everyone is not always good or truthful', 'Everyone is perfect'], 1], ['What does the father say is more honourable than cheating?', ['Winning', 'Failing honestly', 'Losing money'], 1], ['What should the child learn to do when everyone follows the crowd?', ['Follow them', 'Avoid thinking', 'Have the courage to be different'], 2], ['What should the child never put a price tag on?', ['His books', 'His heart and soul', 'His clothes'], 1], ['According to the passage, what does a teacher dispel?', ['Happiness', 'Darkness and ignorance', 'Courage'], 1]];let s=load(K);s.answers=s.answers||{};s.score=s.score||0;
function draw(){content.innerHTML=D.map((q,i)=>`<div class=question><b>${i+1}.</b> ${q[0]}<div class=options>${q[1].map((o,j)=>`<button class="option ${s.answers[i]===j?'selected':''}" onclick="pick(${i},${j})">${['i.','ii.','iii.'][j]} ${o}</button>`).join('')}</div></div>`).join('');score.textContent=`Score: ${s.score} / 5`}
function pick(i,j){s.answers[i]=j;save(K,s);draw()}function check(){let n=0;document.querySelectorAll('.question').forEach((r,i)=>{r.querySelectorAll('.option').forEach((b,j)=>{b.classList.remove('correct','wrong');if(j===D[i][2])b.classList.add('correct');if(s.answers[i]===j&&j!==D[i][2])b.classList.add('wrong')});if(s.answers[i]===D[i][2])n++});s.score=n;save(K,s);score.textContent=`Score: ${n} / 5`;send('OPTION',{answers:s.answers,score:n,total:5,completed:Object.keys(s.answers).length===5})}function resetEx(){s={answers:{},score:0};save(K,s);draw()}draw()</script>
