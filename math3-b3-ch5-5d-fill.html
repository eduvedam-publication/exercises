<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#e5f9fd;font-family:Arial,sans-serif}
.exercise{max-width:1080px;min-height:390px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:30px 42px;display:flex;flex-direction:column}
h1{margin:0 0 32px;color:#00a3dc;font-size:25px}.content{flex:1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:30px 55px}
.item{display:flex;align-items:center;gap:8px;font:20px Georgia,serif;line-height:1.5;white-space:nowrap}
.ans{width:78px;height:38px;border:2px solid red;font-size:18px;text-align:center;padding:4px}
.ok{background:#dcf8df;border-color:#009b8e}.bad{background:#ffe1e1;border-color:#e43d30}
.controls{margin-top:auto;padding-top:36px;display:flex;justify-content:center;gap:14px}
.controls button{border:0;border-radius:24px;background:#ff7d00;color:#fff;font-weight:bold;padding:12px 22px;cursor:pointer}
.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:15px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.exercise{padding:22px}.item{white-space:normal;flex-wrap:wrap}}
</style></head><body><main class="exercise">
<h1>Fill in the blanks.</h1>
<section class="content"><div class="grid">
<div class="item"><b>a.</b><span>If 6 × 9 = 54, then 54 ÷ 6 = 9.</span></div>
<div class="item"><b>b.</b><span>If 21 × 4 = 84, then 84 ÷ 4 = <input class="ans" id="a0" inputmode="numeric"></span></div>
<div class="item"><b>c.</b><span>If 82 × 5 = <input class="ans" id="a1" inputmode="numeric">, then 410 ÷ 5 = <input class="ans" id="a2" inputmode="numeric"></span></div>
<div class="item"><b>d.</b><span>If 972 × 6 = <input class="ans" id="a3" inputmode="numeric">, then 5832 ÷ 6 = <input class="ans" id="a4" inputmode="numeric"></span></div>
</div></section>
<div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div>
<div class="score" id="score">Score: 0 / 5</div>
</main>
<script>
const A=["21","410","82","5832","972"];
function check(){let s=0;A.forEach((a,i)=>{const e=document.getElementById("a"+i),g=e.value.trim()===a;e.classList.remove("ok","bad");e.classList.add(g?"ok":"bad");if(g)s++});score.textContent="Score: "+s+" / 5"}
function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.classList.remove("ok","bad")});score.textContent="Score: 0 / 5"}
</script></body></html>
