<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiply the following numbers</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#222}
.exercise{max-width:1050px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}
.questions{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 42px;padding:0 12px}
.q{display:flex;align-items:center;gap:8px;font-family:Georgia,"Times New Roman",serif;font-size:21px;white-space:nowrap}
.no{min-width:22px}
.answer{width:56px;height:38px;border:2px solid #ff3b30;background:#fff;font-size:18px;text-align:center;outline:none}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:32px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:850px){.questions{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.questions{grid-template-columns:1fr}.exercise{margin:0;border-radius:0;padding:16px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Multiply the following numbers.</h1>

<div class="questions">
 <div class="q"><span class="no">1.</span><span>42 × 10</span><input id="a0" class="answer" inputmode="numeric"></div>
 <div class="q"><span class="no">2.</span><span>3 × 100</span><input id="a1" class="answer" inputmode="numeric"></div>
 <div class="q"><span class="no">3.</span><span>21 × 10</span><input id="a2" class="answer" inputmode="numeric"></div>
 <div class="q"><span class="no">4.</span><span>2 × 100</span><input id="a3" class="answer" inputmode="numeric"></div>

 <div class="q"><span class="no">5.</span><span>99 × 0</span><input id="a4" class="answer" inputmode="numeric"></div>
 <div class="q"><span class="no">6.</span><span>340 × 0</span><input id="a5" class="answer" inputmode="numeric"></div>
 <div class="q"><span class="no">7.</span><span>280 × 1</span><input id="a6" class="answer" inputmode="numeric"></div>
 <div class="q"><span class="no">8.</span><span>400 × 1</span><input id="a7" class="answer" inputmode="numeric"></div>
</div>

<div class="actions">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetExercise()">Reset</button>
</div>
<div id="result">Score: 0 / 8</div>
</main>

<script>
const answers=["420","300","210","200","0","0","280","400"];

function checkAnswers(){
 let score=0;
 answers.forEach((v,i)=>{
  const e=document.getElementById("a"+i);
  const ok=e.value.trim()===v;
  e.className="answer "+(ok?"ok":"bad");
  if(ok) score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 8`;
}

function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{
  e.value="";
  e.className="answer";
 });
 document.getElementById("result").textContent="Score: 0 / 8";
}
</script>
</body>
</html>
