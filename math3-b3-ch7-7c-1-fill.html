<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fill in the blanks.</title><style>
*{box-sizing:border-box}body{margin:0;background:#e2f8fc;font-family:Georgia,"Times New Roman",serif}
.box{width:min(1080px,calc(100% - 24px));min-height:400px;margin:14px auto;background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:34px 42px;display:flex;flex-direction:column}
h1{font:700 25px Arial;color:#00a1db;margin:0 0 38px}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 75px;flex:1;align-content:start}
.q{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:22px;line-height:1.6}.letter{min-width:27px}
input{width:88px;height:39px;border:2px solid #ff2b22;padding:4px 7px;font:18px Arial;background:white}
input.ok{background:#dff7df;border-color:#198c3d}input.bad{background:#ffe1e1;border-color:#d92c2c}
.controls{margin-top:auto;padding-top:35px;text-align:center}button{border:0;border-radius:25px;background:#ff7b00;color:#fff;padding:13px 22px;margin:0 6px;font:bold 14px Arial}
#score{margin-top:14px;color:#064bb4;font:bold 22px Arial}
@media(max-width:700px){.box{padding:25px 20px}.questions{grid-template-columns:1fr;gap:18px}.q{font-size:19px}}
</style></head><body><main class="box"><h1>Fill in the blanks.</h1><div class="questions"><div class="q"><span class="letter">a.</span><span>1 l =</span><input id="a0" inputmode="numeric"><span>ml</span></div><div class="q"><span class="letter">b.</span><span>5 l =</span><input id="a1" inputmode="numeric"><span>ml</span></div><div class="q"><span class="letter">c.</span><span>2004 l =</span><input id="a2" inputmode="numeric"><span>l</span><input id="a3" inputmode="numeric"><span>ml</span></div><div class="q"><span class="letter">d.</span><span>5408 l =</span><input id="a4" inputmode="numeric"><span>l</span><input id="a5" inputmode="numeric"><span>ml</span></div></div>
<div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button><div id="score">Score: 0 / 6</div></div></main>
<script>const answers=['1000', '5000', '2', '4', '5', '408'];
function check(){let s=0;answers.forEach((a,i)=>{let e=document.getElementById('a'+i),ok=e.value.trim().toLowerCase()===a.toLowerCase();e.classList.remove('ok','bad');e.classList.add(ok?'ok':'bad');if(ok)s++});score.textContent=`Score: ${s} / 6`}
function resetAll(){answers.forEach((a,i)=>{let e=document.getElementById('a'+i);e.value='';e.classList.remove('ok','bad')});score.textContent='Score: 0 / 6'}</script></body></html>
