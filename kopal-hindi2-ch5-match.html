<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#dff8ff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:5px solid #08a6d1;border-radius:22px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;color:#ff0072;font-size:clamp(22px,3vw,30px)}.content{flex:1}.question{margin:12px 0;padding:13px 16px;border:2px solid #69dfff;border-radius:16px;background:#f3fbfe;font-size:clamp(16px,2vw,19px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option,.btn{border:2px solid #ff0072;background:#fff;border-radius:10px;padding:8px 13px;font-size:16px;cursor:pointer}.option.selected{background:#ffe7f1}.option.correct,.answer.correct,.order.correct{background:#dff7e4}.option.wrong,.answer.wrong,.order.wrong{background:#ffe2e2}.answer{border:2px solid #ff4c39;border-radius:5px;padding:6px 8px;font-size:17px;min-width:125px;max-width:205px;margin:2px 4px}.orderrow{display:flex;justify-content:space-between;align-items:center;gap:15px}.order{width:58px;border:2px solid #ff0072;border-radius:7px;padding:7px;text-align:center;font-size:17px}.bottom{text-align:center;margin-top:22px}.score{margin-top:9px;color:#087fc2;font-weight:800;font-size:18px}@media(max-width:650px){body{padding:7px}.exercise{padding:15px 11px}.options{flex-direction:column}.option{width:100%;text-align:left}.answer{min-width:100px;max-width:145px}}
.matcharea{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px 110px;margin:25px 30px 20px;padding:5px 20px}
.col{display:flex;flex-direction:column;gap:18px;z-index:2}
.matchitem{border:2px solid #00c5e8;background:#f2fbfe;border-radius:12px;padding:12px 16px;font-size:21px;cursor:pointer;min-height:28px}
.matchitem.sel{border-color:#ff0060;background:#fff0f6}
.matchitem.used{background:#eafff0}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
</style>
<main class=exercise><h1 class=title>मिलान कीजिए–</h1>
<div class=matcharea id=area><svg id=lines></svg><div class=col id=Lc></div><div class=col id=Rc></div></div>
<div class=bottom><button class=btn onclick=check()>Submit</button><button class=btn onclick=reset()>Reset</button><div class=score id=sc></div></div></main>
<script>function L(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function S(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){let p={exerciseType:t,response:r};try{parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}}
const K='kopal-hindi2-ch5-match',LFT=["चिड़िया", "शेर", "लंगूर", "मछली"],RGT=["नदी में", "घोंसले में", "वृक्ष पर", "जंगल में"],ANS=[1, 3, 2, 0];let s=L(K);s.a=s.a||{};s.score=s.score||0;let selected=null;
function draw(){Lc.innerHTML=LFT.map((x,i)=>`<div id="l${i}" class="matchitem ${selected===i?'sel':''}" onclick="pickL(${i})">${['(क)','(ख)','(ग)','(घ)'][i]} &nbsp; ${x}</div>`).join('');
Rc.innerHTML=RGT.map((x,i)=>`<div id="r${i}" class="matchitem" onclick="pickR(${i})">${['(अ)','(ब)','(स)','(द)'][i]} &nbsp; ${x}</div>`).join('');
sc.textContent=`Score: ${s.score} / 4`;requestAnimationFrame(lines)}
function pickL(i){selected=i;draw()}
function pickR(j){if(selected===null)return;s.a[selected]=j;selected=null;S(K,s);draw()}
function lines(){let svg=document.getElementById('lines'),a=area.getBoundingClientRect();svg.innerHTML='';Object.entries(s.a).forEach(([i,j])=>{let x=document.getElementById('l'+i).getBoundingClientRect(),y=document.getElementById('r'+j).getBoundingClientRect();let line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',x.right-a.left);line.setAttribute('y1',x.top+x.height/2-a.top);line.setAttribute('x2',y.left-a.left);line.setAttribute('y2',y.top+y.height/2-a.top);line.setAttribute('stroke','#ff0060');line.setAttribute('stroke-width','2.5');svg.appendChild(line)})}
function check(){let n=0;LFT.forEach((_,i)=>{let el=document.getElementById('l'+i);el.classList.remove('correct','wrong');if(s.a[i]===ANS[i]){n++;el.classList.add('correct')}else if(s.a[i]!=null)el.classList.add('wrong')});s.score=n;S(K,s);sc.textContent=`Score: ${n} / 4`;let paths=[];LFT.forEach((x,i)=>paths.push({pathId:'q'+(i+1),completed:s.a[i]!=null,strokes:[]}));send('MATCHING',{matches:s.a,paths})}
function reset(){s={a:{},score:0};selected=null;S(K,s);draw()}window.addEventListener('resize',lines);draw()</script>
