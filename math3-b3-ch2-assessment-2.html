<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#e8faff;font-family:Arial,sans-serif}.ex{max-width:1100px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:26px;padding:28px}h1{color:#00a5dc;font-size:24px;margin:0 0 22px}.actions{text-align:center;margin-top:28px}.actions button{border:0;border-radius:22px;padding:11px 20px;margin:5px;background:#ff8200;color:white;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:21px;font-weight:bold;margin-top:12px}.ans{border:2px solid #ff3b30;height:36px;font-size:17px;padding:4px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}.qs{display:grid;gap:18px}.q{font:19px Georgia,serif}.opts{display:flex;flex-wrap:wrap;gap:10px 20px;margin:9px 0 0 24px}.opt{border:2px solid #ff1680;border-radius:10px;background:#fff;padding:8px 14px;cursor:pointer}.opt.sel{background:#ffe1ee}.opt.ok{background:#dcf8df}.opt.bad{background:#ffe1e1}.binary{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.binary .choices{display:flex;gap:8px}.binary button{border:2px solid #ff1680;background:#fff;border-radius:8px;padding:7px 14px}.selected{background:#ffe1ee!important}.cols{display:grid;text-align:center}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.card{background:#fdecef;padding:8px;width:170px}.head{color:#ff1680;border-bottom:1px solid #63d5ef;padding:5px}.row{border-bottom:1px solid #63d5ef;padding:6px;position:relative;min-height:34px}.plus:before{content:"+";position:absolute;left:-5px}.mathgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}.problem{display:flex;gap:7px;align-items:flex-start}.card .ans{width:100%;margin-top:4px}@media(max-width:750px){.mathgrid{grid-template-columns:1fr}.ex{padding:15px}body{padding:0}}</style></head><body><main class="ex"><h1>Complete the following by using the appropriate property. Also, write the name of property.</h1><div class="qs">
<div class="q">a. 3263 + 3652 = 3652 + <input class="ans" id="a0"> &nbsp; <input class="ans" id="a1" style="width:230px" placeholder="Name of property"></div>
<div class="q">b. (4254 + 45) + <input class="ans" id="a2"> = 4254 + (<input class="ans" id="a3"> + 4526) &nbsp; <input class="ans" id="a4" style="width:230px" placeholder="Name of property"></div>
<div class="q">c. 0 + <input class="ans" id="a5"> = 8647 + <input class="ans" id="a6"> &nbsp; <input class="ans" id="a7" style="width:230px" placeholder="Name of property"></div></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 8</div></main><script>const ans=['3263', 'Commutative property', '4526', '45', 'Associative property', '8647', '0', 'Additive property for zero'];function norm(s){return s.trim().toLowerCase()}function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById('a'+i),ok=norm(e.value)===norm(a);e.className='ans '+(ok?'ok':'bad');if(ok)s++});score.textContent=`Score: ${s} / 8`}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.className='ans'});score.textContent='Score: 0 / 8'}</script></body></html>
