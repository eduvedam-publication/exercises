<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#222}
.exercise{max-width:1000px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
.score{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
input{border:2px solid #ff3b30;height:40px;font-size:18px;padding:5px 8px;outline:none}
.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:650px){.exercise{margin:0;border-radius:0;padding:16px}}

.area{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:90px;min-height:330px}.col{display:flex;flex-direction:column;gap:14px;z-index:2}
.item{height:52px;border:2px solid #a8e8fa;border-radius:16px;background:#f8fdff;padding:0 16px;display:flex;align-items:center;position:relative;cursor:pointer;font-size:18px}
.right .item{justify-content:flex-end}.item.sel{border-color:#ff3b8d;background:#fff0f6}.dot{width:16px;height:16px;border:4px solid #ff3b8d;transform:rotate(45deg);position:absolute;background:#fff}
.left .dot{right:13px}.right .dot{left:13px}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
</style></head><body><main class="exercise"><h1>Match the following:</h1><div class="area" id="area"><svg id="svg"></svg>
<div class="col left"><div class="item" data-id="96">a. Ninety-six<span class="dot"></span></div><div class="item" data-id="108">b. One hundred eight<span class="dot"></span></div><div class="item" data-id="160">c. One hundred sixty<span class="dot"></span></div><div class="item" data-id="128">d. One hundred twenty-eight<span class="dot"></span></div><div class="item" data-id="326">e. Three hundred twenty-six<span class="dot"></span></div></div>
<div class="col right"><div class="item" data-id="128"><span class="dot"></span>i. 128</div><div class="item" data-id="326"><span class="dot"></span>ii. 326</div><div class="item" data-id="108"><span class="dot"></span>iii. 108</div><div class="item" data-id="160"><span class="dot"></span>iv. 160</div><div class="item" data-id="96"><span class="dot"></span>v. 96</div></div></div>
<div class="actions"><button onclick="check()">Check Answers</button><button onclick="reset()">Reset</button></div><div id="score" class="score">Score: 0 / 5</div>
<script>
let selected=null,m={};const area=document.getElementById("area"),svg=document.getElementById("svg");
document.querySelectorAll(".left .item").forEach(x=>x.onclick=()=>{document.querySelectorAll(".left .item").forEach(y=>y.classList.remove("sel"));selected=x;x.classList.add("sel")});
document.querySelectorAll(".right .item").forEach(x=>x.onclick=()=>{if(!selected)return;Object.keys(m).forEach(k=>{if(m[k]===x.dataset.id)delete m[k]});m[selected.dataset.id]=x.dataset.id;selected.classList.remove("sel");selected=null;draw(false)});
function pt(el){let a=area.getBoundingClientRect(),d=el.querySelector(".dot").getBoundingClientRect();return [d.left-a.left+d.width/2,d.top-a.top+d.height/2]}
function draw(mark){svg.innerHTML="";Object.entries(m).forEach(([l,r])=>{let L=document.querySelector(`.left [data-id="${l}"]`),R=document.querySelector(`.right [data-id="${r}"]`),a=pt(L),b=pt(R),ln=document.createElementNS("http://www.w3.org/2000/svg","line");["x1","y1","x2","y2"].forEach((z,i)=>ln.setAttribute(z,[a[0],a[1],b[0],b[1]][i]));ln.setAttribute("stroke",mark?(l===r?"#009b8e":"#e43d30"):"#009b8e");ln.setAttribute("stroke-width","4");svg.appendChild(ln)})}
function check(){let s=Object.entries(m).filter(([a,b])=>a===b).length;draw(true);score.textContent=`Score: ${s} / 5`}
function reset(){m={};selected=null;svg.innerHTML="";document.querySelectorAll(".item").forEach(x=>x.classList.remove("sel"));score.textContent="Score: 0 / 5"}
addEventListener("resize",()=>draw(false));
</script></main></body></html>
