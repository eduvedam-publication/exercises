<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{margin:0;background:#e2f8fc;font-family:Georgia,"Times New Roman",serif}
.card{width:min(1080px,calc(100% - 24px));min-height:520px;margin:14px auto;background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:34px 42px;display:flex;flex-direction:column}
h1{font:700 25px Arial;color:#00a1db;margin:0 0 25px}
.intro{font-size:20px;line-height:1.5;margin-bottom:18px}
.graph{display:block;max-width:520px;width:100%;margin:0 auto 22px;border:1px solid #00aeef}
.qs{display:grid;gap:18px;flex:1}.q{font-size:20px;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;margin:8px 0 0 28px}
.opt{border:2px solid #ff1680;border-radius:11px;background:#fff;color:#111;padding:8px 14px;font:18px Georgia;cursor:pointer}
.opt.sel{background:#fff0f7}.opt.correct{background:#dff7df;border-color:#198c3d}.opt.wrong{background:#ffe1e1;border-color:#d92c2c}
.tfrow{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.tfrow .statement{flex:1;min-width:300px}
.footer{margin-top:auto;text-align:center;padding-top:30px}.footer button{border:0;border-radius:25px;background:#ff7b00;color:#fff;padding:13px 22px;margin:0 6px;font:bold 14px Arial;cursor:pointer}
.score{margin-top:14px;color:#064bb4;font:bold 22px Arial}
@media(max-width:650px){.card{padding:24px 18px}.q,.intro{font-size:18px}.opts{margin-left:0}.tfrow .statement{min-width:100%}}
</style></head><body>
<main class="card"><h1>State true or false.</h1><div class="qs"><div class="q tfrow"><span class="statement">a. Gap between the rectangles of bar graph is not equal.</span>
    <div class="opts" style="margin:0"><button class="opt" data-q="0" data-v="1" onclick="pick(this)">True</button>
    <button class="opt" data-q="0" data-v="0" onclick="pick(this)">False</button></div></div><div class="q tfrow"><span class="statement">b. A pictograph is a way of showing numerical data using picture symbols.</span>
    <div class="opts" style="margin:0"><button class="opt" data-q="1" data-v="1" onclick="pick(this)">True</button>
    <button class="opt" data-q="1" data-v="0" onclick="pick(this)">False</button></div></div><div class="q tfrow"><span class="statement">c. The bars of a bar graph are of different heights and unequal widths.</span>
    <div class="opts" style="margin:0"><button class="opt" data-q="2" data-v="1" onclick="pick(this)">True</button>
    <button class="opt" data-q="2" data-v="0" onclick="pick(this)">False</button></div></div><div class="q tfrow"><span class="statement">d. Data is a collection of facts and figures.</span>
    <div class="opts" style="margin:0"><button class="opt" data-q="3" data-v="1" onclick="pick(this)">True</button>
    <button class="opt" data-q="3" data-v="0" onclick="pick(this)">False</button></div></div></div>
<div class="footer"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button><div class="score" id="score">Score: 0 / 4</div></div></main>
<script>
const A=[0, 1, 0, 1];
function pick(e){document.querySelectorAll('[data-q="'+e.dataset.q+'"]').forEach(x=>x.classList.remove('sel','correct','wrong'));e.classList.add('sel')}
function check(){let s=0;A.forEach((a,q)=>{let e=document.querySelector('[data-q="'+q+'"].sel');if(e){let ok=+e.dataset.v===a;e.classList.add(ok?'correct':'wrong');if(ok)s++}});score.textContent='Score: '+s+' / 4'}
function resetAll(){document.querySelectorAll('.opt').forEach(e=>e.classList.remove('sel','correct','wrong'));score.textContent='Score: 0 / 4'}
</script></body></html>
