<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}
.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}
.ok{background:#dcf8df!important;border-color:#009b8e!important}
.bad{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:700px){body{padding:0}.exercise{border-radius:0;padding:16px}}

.q{font:20px Georgia,"Times New Roman",serif;margin-bottom:23px}
.qt{margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;margin-left:25px}
.opt{min-width:130px;border:2px solid #ff1680;border-radius:11px;background:#fff;color:#111;padding:9px 15px;font-size:17px;cursor:pointer}
.opt.sel{background:#fff0f6}
</style></head><body><main class="exercise"><h1>Choose the correct option.</h1><div class="q" data-a="1"><div class="qt">a. The place value of the digit 6 in 3658 is ________.</div><div class="opts"><button class="opt" data-v="0">i. 60</button><button class="opt" data-v="1">ii. 600</button><button class="opt" data-v="2">iii. 6</button><button class="opt" data-v="3">iv. 6000</button></div></div><div class="q" data-a="0"><div class="qt">b. The smallest 4-digit number is ________.</div><div class="opts"><button class="opt" data-v="0">i. 1000</button><button class="opt" data-v="1">ii. 1100</button><button class="opt" data-v="2">iii. 9999</button><button class="opt" data-v="3">iv. 9000</button></div></div><div class="q" data-a="2"><div class="qt">c. The place value of 0 in 4503 is ________.</div><div class="opts"><button class="opt" data-v="0">i. 1</button><button class="opt" data-v="1">ii. 10</button><button class="opt" data-v="2">iii. 0</button><button class="opt" data-v="3">iv. 100</button></div></div><div class="q" data-a="3"><div class="qt">d. 5000 + 5 = ________.</div><div class="opts"><button class="opt" data-v="0">i. 5050</button><button class="opt" data-v="1">ii. 5500</button><button class="opt" data-v="2">iii. 5055</button><button class="opt" data-v="3">iv. 5005</button></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div></main><script>
document.querySelectorAll(".q").forEach(q=>q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
 q.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel","ok","bad"));
 b.classList.add("sel"); q.dataset.pick=b.dataset.v;
}));
function check(){
 let s=0;
 document.querySelectorAll(".q").forEach(q=>{
  const p=q.dataset.pick;
  q.querySelectorAll(".opt").forEach(b=>{
   b.classList.remove("ok","bad");
   if(b.dataset.v===p)b.classList.add(p===q.dataset.a?"ok":"bad");
  });
  if(p===q.dataset.a)s++;
 });
 score.textContent=`Score: ${s} / 4`;
}
function resetAll(){
 document.querySelectorAll(".q").forEach(q=>{
  delete q.dataset.pick;
  q.querySelectorAll(".opt").forEach(b=>b.className="opt");
 });
 score.textContent="Score: 0 / 4";
}
</script></body></html>
