<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-2-ch1-mcq</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf8ff;font-family:"Noto Sans Devanagari","Mangal",sans-serif;color:#24313a}.sheet{width:min(920px,96vw);margin:12px auto;background:#fff;border:3px solid #08a9d2;border-radius:22px;padding:18px 24px;min-height:min(560px,94vh);display:flex;flex-direction:column}h1{font-size:clamp(21px,2.6vw,29px);color:#ff0065;margin:0 0 15px}.content{flex:1}.q{background:#f1fbff;border:2px solid #00c8ea;border-radius:12px;padding:11px 14px;margin:9px 0;font-size:19px}.opts{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:9px}.opt,.word{border:1.5px solid #ff0069;background:#fff;border-radius:9px;padding:7px 11px;font:inherit;cursor:pointer}.opt.selected,.word.selected{background:#c9f4dc}.slot{display:inline-flex;min-width:140px;min-height:37px;border:2px dashed #ff684b;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;cursor:pointer;padding:3px 8px;background:#fff}.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;background:#e1f8ff;border-radius:12px;padding:12px;margin-bottom:15px}.word{border-color:#00aee5}.actions{text-align:center;margin-top:15px}.actions button{border:1.5px solid #ff0069;border-radius:9px;background:#fff;padding:7px 16px;font-size:15px;cursor:pointer}.score{text-align:center;color:#0074ba;font-size:19px;font-weight:bold;margin-top:8px}.good{background:#d9f8e1!important}.bad{background:#ffe3e3!important;border-color:#ff284e!important;animation:wrongBlink .48s ease-in-out 4}@keyframes wrongBlink{0%,100%{background:#ffe3e3;box-shadow:none}50%{background:#ff506a;box-shadow:0 0 0 3px #ffb1c0;color:#fff}}@media(max-width:600px){.sheet{padding:12px;min-height:95vh}.q{font-size:16px}.slot{min-width:100px}}</style></head><body><main class="sheet"><h1>सही विकल्प पर सही (✓) का निशान लगाएँ–</h1><div id="content" class="content"></div><div class="actions"><button onclick="submitAnswers()">Submit</button> <button onclick="resetAnswers()">Reset</button></div><div class="score" id="score">Score: 0 / 4</div></main><script>const D=[["कवि किसकी निराली बात की चर्चा कर रहे हैं?", ["दूसरों की", "भारत की", "विदेश की"], 0], ["कथा कौन बाँचेता है?", ["कोयल", "मोर", "तोता"], 1], ["ऋतुएँ का एकवचन होगा–", ["ऋतू", "ऋतु", "रितु"], 1], ["निम्न में से संज्ञा शब्द है–", ["भारत", "यहाँ", "देते"], 0]],K='kopal-2-ch1-mcq';let A;try{A=JSON.parse(localStorage.getItem(K))||{}}catch{A={}}function save(){localStorage.setItem(K,JSON.stringify(A))}function draw(){content.innerHTML=D.map((q,i)=>`<div class="q"><b>${['(क)','(ख)','(ग)','(घ)'][i]}</b> ${q[0]}<div class="opts">${q[1].map((v,k)=>`<button class="opt ${A[i]===k?'selected':''}" onclick="choose(${i},${k})">${['(अ)','(ब)','(स)'][k]} ${v}</button>`).join('')}</div></div>`).join('')}function choose(i,k){A[i]=k;save();draw()}function submitAnswers(){let n=D.filter((q,i)=>A[i]===q[2]).length;document.querySelectorAll('.q').forEach((el,i)=>{if(A[i]!==undefined){const opts=el.querySelectorAll('.opt');opts[A[i]].classList.add(A[i]===D[i][2]?'good':'bad')}});score.textContent=`Score: ${n} / 4`;parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:{exerciseType:'OPTION',response:Object.fromEntries(D.map((q,i)=>['question'+(i+1),A[i]===undefined?'':q[1][A[i]]]))}},'*')}function resetAnswers(){A={};save();score.textContent='Score: 0 / 4';draw()}draw();</script></body></html>
