<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#e7faff;font-family:Arial,sans-serif}
.exercise{max-width:1080px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:32px 38px}
h1{margin:0 0 28px;color:#009fda;font-size:25px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 58px;width:100%}
.problem{display:flex;align-items:flex-start;gap:9px;font-family:Georgia,serif;font-size:18px}
.lbl{padding-top:7px;min-width:22px}.card{width:190px;min-width:190px;background:#fdebed;padding:8px}
.cols{display:grid;text-align:center}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.head{color:#ff0870;border-bottom:1px solid #22cbea;padding:5px 0;font-size:18px}
.row{min-height:37px;align-items:center;border-bottom:1px solid #22cbea;font-size:20px;position:relative}
.row.plus:before{content:'+';position:absolute;left:1px}
.answer{width:100%;height:39px;margin-top:5px;border:2px solid red;background:white;font-size:18px;padding:4px}
.cell{width:43px;height:36px;border:2px solid red;background:white;text-align:center;font-size:18px;margin:auto}
.controls{width:100%;display:flex;justify-content:center;gap:14px;margin-top:38px;clear:both}
.controls button{background:#ff7d00;color:white;border:0;border-radius:24px;padding:12px 22px;font-weight:bold;cursor:pointer}
.score{width:100%;text-align:center;color:#064ab3;font-weight:bold;font-size:22px;margin-top:16px}
.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){body{padding:0}.exercise{border-radius:0;padding:18px}.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="exercise"><h1>Find the sum of the following:</h1><div class="grid"><div class="problem"><span class="lbl">a.</span><div class="card"><div class="cols c3 head"><span>H</span><span>T</span><span>O</span></div><div class="cols c3 row><span>6</span><span>3</span><span>3</span></div><div class="cols c3 row plus><span>1</span><span>2</span><span>5</span></div><input id="a0" class="answer" inputmode="numeric"></div></div><div class="problem"><span class="lbl">b.</span><div class="card"><div class="cols c4 head"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="cols c4 row><span>7</span><span>5</span><span>1</span><span>3</span></div><div class="cols c4 row plus><span>1</span><span>3</span><span>6</span><span>4</span></div><input id="a1" class="answer" inputmode="numeric"></div></div><div class="problem"><span class="lbl">c.</span><div class="card"><div class="cols c4 head"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="cols c4 row><span>6</span><span>4</span><span>0</span><span>9</span></div><div class="cols c4 row plus><span>1</span><span>5</span><span>8</span><span>0</span></div><input id="a2" class="answer" inputmode="numeric"></div></div><div class="problem"><span class="lbl">d.</span><div class="card"><div class="cols c3 head"><span>H</span><span>T</span><span>O</span></div><div class="cols c3 row><span>7</span><span>0</span><span>3</span></div><div class="cols c3 row plus><span>2</span><span>8</span><span>3</span></div><input id="a3" class="answer" inputmode="numeric"></div></div><div class="problem"><span class="lbl">e.</span><div class="card"><div class="cols c4 head"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="cols c4 row><span>2</span><span>3</span><span>5</span><span>4</span></div><div class="cols c4 row><span>4</span><span>1</span><span>0</span><span>0</span></div><div class="cols c4 row plus><span></span><span>1</span><span>1</span><span>4</span></div><input id="a4" class="answer" inputmode="numeric"></div></div><div class="problem"><span class="lbl">f.</span><div class="card"><div class="cols c4 head"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="cols c4 row><span>2</span><span>4</span><span>1</span><span>3</span></div><div class="cols c4 row><span>1</span><span>5</span><span>3</span><span>6</span></div><div class="cols c4 row plus><span>3</span><span>0</span><span>4</span><span>0</span></div><input id="a5" class="answer" inputmode="numeric"></div></div></div>
<div class="controls"><button type="button" onclick="checkAnswers()">Check Answers</button><button type="button" onclick="resetAll()">Reset</button></div>
<div class="score" id="score">Score: 0 / 6</div></main>
<script>
const answers=['758', '8877', '7989', '986', '6568', '6989'];
function checkAnswers(){let s=0;answers.forEach((a,i)=>{const e=document.getElementById('a'+i);const ok=e.value.trim()===a;e.classList.remove('ok','bad');e.classList.add(ok?'ok':'bad');if(ok)s++;});document.getElementById('score').textContent='Score: '+s+' / 6';}
function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});document.getElementById('score').textContent='Score: 0 / 6';}
</script></body></html>
