<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>b3-ch8-8b-fill-1</title><style>
*{box-sizing:border-box}
body{margin:0;background:#e2f8fc;font-family:Georgia,"Times New Roman",serif}
.card{width:min(1080px,calc(100% - 24px));min-height:420px;margin:14px auto;background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:34px 42px;display:flex;flex-direction:column}
h1{font:700 25px Arial,sans-serif;color:#00a1db;margin:0 0 30px}
.qs{display:grid;gap:18px;flex:1}.q{display:flex;align-items:center;gap:12px;font-size:21px;line-height:1.5}.letter{width:28px;flex:0 0 28px}.text{flex:1}
input{height:39px;border:2px solid #ff2b22;padding:4px 8px;font:18px Arial,sans-serif;background:#fff}
input.ok{background:#dff7df;border-color:#198c3d}input.bad{background:#ffe1e1;border-color:#d92c2c}
.footer{margin-top:auto;text-align:center;padding-top:30px}button{border:0;border-radius:25px;background:#ff7b00;color:#fff;padding:13px 22px;margin:0 6px;font:bold 14px Arial,sans-serif;cursor:pointer}
.score{margin-top:14px;color:#064bb4;font:bold 22px Arial,sans-serif}
@media(max-width:700px){.card{padding:24px 18px}.q{font-size:18px;flex-wrap:wrap}.text{min-width:calc(100% - 45px)}}
</style></head>
<body><main class="card"><h1>Fill in the blanks.</h1><div class="qs"><div class="q"><span class="letter">a.</span><span class="text">The year 2013 has _____ days.</span><input id="a0" style="width:90px" autocomplete="off"></div>
<div class="q"><span class="letter">b.</span><span class="text">The last leap year was _____.</span><input id="a1" style="width:100px" autocomplete="off"></div>
<div class="q"><span class="letter">c.</span><span class="text">A month has _____ full weeks.</span><input id="a2" style="width:80px" autocomplete="off"></div>
<div class="q"><span class="letter">d.</span><span class="text">A decade has _____ years.</span><input id="a3" style="width:80px" autocomplete="off"></div></div>
<div class="footer"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button><div class="score" id="score">Score: 0 / 4</div></div></main>
<script>
const A=["365", "2016", "4", "10"]; const norm=v=>v.trim().toLowerCase().replace(/\s+/g," ");
function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=norm(e.value)===norm(a);e.classList.remove("ok","bad");e.classList.add(ok?"ok":"bad");if(ok)s++});document.getElementById("score").textContent=`Score: ${s} / 4`}
function resetAll(){A.forEach((_,i)=>{let e=document.getElementById("a"+i);e.value="";e.classList.remove("ok","bad")});document.getElementById("score").textContent="Score: 0 / 4"}
</script></body></html>
