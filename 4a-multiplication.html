<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiplication Form</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#222}
.exercise{max-width:1000px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}
.questions{display:grid;grid-template-columns:1fr 1fr;gap:26px 60px;padding:0 18px}
.q{font-family:Georgia,"Times New Roman",serif;font-size:20px}
.statement{display:flex;align-items:center;gap:7px;white-space:nowrap}
.form{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:14px}
.answer{width:48px;height:38px;border:2px solid #ff3b30;background:#fff;font-size:18px;text-align:center;outline:none}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:32px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:700px){.questions{grid-template-columns:1fr;gap:20px}.statement{white-space:normal}}
@media(max-width:430px){.exercise{margin:0;border-radius:0;padding:15px}h1{font-size:21px}.q{font-size:18px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Write the following in multiplication form.</h1>

<div class="questions">
 <div class="q">
  <div class="statement"><span>a.</span><span>2 + 2 + 2 + 2 + 2 + 2 + 2 = 14</span></div>
  <div class="form"><input id="a0" class="answer" inputmode="numeric"><span>×</span><input id="a1" class="answer" inputmode="numeric"><span>=</span><input id="a2" class="answer" inputmode="numeric"></div>
 </div>

 <div class="q">
  <div class="statement"><span>b.</span><span>6 + 6 + 6 + 6 + 6 = 30</span></div>
  <div class="form"><input id="a3" class="answer" inputmode="numeric"><span>×</span><input id="a4" class="answer" inputmode="numeric"><span>=</span><input id="a5" class="answer" inputmode="numeric"></div>
 </div>

 <div class="q">
  <div class="statement"><span>c.</span><span>4 + 4 + 4 + 4 + 4 + 4 = 24</span></div>
  <div class="form"><input id="a6" class="answer" inputmode="numeric"><span>×</span><input id="a7" class="answer" inputmode="numeric"><span>=</span><input id="a8" class="answer" inputmode="numeric"></div>
 </div>

 <div class="q">
  <div class="statement"><span>d.</span><span>7 + 7 + 7 + 7 = 28</span></div>
  <div class="form"><input id="a9" class="answer" inputmode="numeric"><span>×</span><input id="a10" class="answer" inputmode="numeric"><span>=</span><input id="a11" class="answer" inputmode="numeric"></div>
 </div>
</div>

<div class="actions">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetExercise()">Reset</button>
</div>
</main>

<script>
const answers=["2","7","14","6","5","30","4","6","24","7","4","28"];

function checkAnswers(){
 let score=0;
 answers.forEach((v,i)=>{
  const e=document.getElementById("a"+i);
  const ok=e.value.trim()===v;
  e.className="answer "+(ok?"ok":"bad");
  if(ok)score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 12`;
}

function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{
  e.value="";
  e.className="answer";
 });
 document.getElementById("result").textContent="Score: 0 / 12";
}
</script>
</body>
</html>
