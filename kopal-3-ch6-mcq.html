<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का निशान लगाएँ–</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:450px;display:flex;flex-direction:column}h2{font-size:23px;color:#00a9e5;margin:0 0 18px}.q{border:1.5px solid #00c7ee;border-radius:12px;background:#f0fbfe;padding:12px;margin:7px 0}.opts{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}.opt,.chip{border:1.5px solid #ff0070;border-radius:9px;background:white;padding:7px 12px;font-size:17px;cursor:pointer;color:#222}.opt.selected,.chip.selected{background:#d7efff;border-color:#007fdb}.ok{background:#d9f9dc!important;border-color:#0a9b55!important}.bad{background:#ffe3e3!important;border-color:#e32b2b!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff5d5d}}.actions{display:flex;gap:9px;justify-content:center;margin-top:auto;padding-top:24px}.actions button{background:#ff8500;color:white;border:0;border-radius:20px;padding:10px 19px;cursor:pointer}#result{text-align:center;color:#0061b4;font-weight:bold;margin:12px}.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;background:#e7f8fc;border-radius:12px;margin-bottom:14px}.chip{border-color:#00a9e5}.slot{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:110px;min-height:38px;border:2px dashed #ff5656;border-radius:6px;background:#fff;cursor:pointer;padding:5px 8px}.line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.wordrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0}.field{border:1.5px solid #ff5b5b;border-radius:5px;padding:7px;font-size:18px;max-width:220px} @media(max-width:600px){.wrap{margin:0;border-radius:0;padding:14px;min-height:100vh}.opts{gap:5px}.opt{font-size:15px;padding:6px}}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ–</h2><section class="q"><div><b>(क)</b> बंदरों का एक ______ जंगल से गुजरा।</div><div class="opts"><button class="opt" data-q="0" data-v="0" onclick="choose(0,0)">(i) झोंका</button><button class="opt" data-q="0" data-v="1" onclick="choose(0,1)">(ii) झुंड</button><button class="opt" data-q="0" data-v="2" onclick="choose(0,2)">(iii) नेता</button></div></section><section class="q"><div><b>(ख)</b> बंदरों ने जगनू को क्या समझा?</div><div class="opts"><button class="opt" data-q="1" data-v="0" onclick="choose(1,0)">(i) कीड़ा</button><button class="opt" data-q="1" data-v="1" onclick="choose(1,1)">(ii) दीपक</button><button class="opt" data-q="1" data-v="2" onclick="choose(1,2)">(iii) अंगारा</button></div></section><section class="q"><div><b>(ग)</b> ‘सरदी’ का विलोम शब्द होगा–</div><div class="opts"><button class="opt" data-q="2" data-v="0" onclick="choose(2,0)">(i) गरमी</button><button class="opt" data-q="2" data-v="1" onclick="choose(2,1)">(ii) सर्दियाँ</button><button class="opt" data-q="2" data-v="2" onclick="choose(2,2)">(iii) ठंडक</button></div></section><section class="q"><div><b>(घ)</b> ‘मूर्ख’ शब्द है–</div><div class="opts"><button class="opt" data-q="3" data-v="0" onclick="choose(3,0)">(i) संज्ञा</button><button class="opt" data-q="3" data-v="1" onclick="choose(3,1)">(ii) सर्वनाम</button><button class="opt" data-q="3" data-v="2" onclick="choose(3,2)">(iii) विशेषण</button></div></section><div class="actions"><button onclick="submit()">Submit</button><button onclick="resetAll()">Reset</button></div><div id="result"></div></main><script>const key='kopal-2-ch5-mcq',answers=[1,2,0,2];let selected=JSON.parse(localStorage.getItem(key)||'[null,null,null,null]');function draw(){document.querySelectorAll('.opt').forEach(e=>e.classList.toggle('selected',selected[+e.dataset.q]===+e.dataset.v))}function choose(i,j){selected[i]=j;localStorage.setItem(key,JSON.stringify(selected));document.querySelectorAll('.opt').forEach(e=>e.classList.remove('ok','bad'));draw()}function submit(){let n=0;document.querySelectorAll('.opt').forEach(e=>{let i=+e.dataset.q,j=+e.dataset.v;e.classList.remove('ok','bad');if(selected[i]===j){if(j===answers[i]){e.classList.add('ok');n++}else e.classList.add('bad')}});document.getElementById('result').textContent=`Score: ${n} / 4`;}function resetAll(){selected=[null,null,null,null];localStorage.removeItem(key);document.querySelectorAll('.opt').forEach(e=>e.classList.remove('ok','bad'));document.getElementById('result').textContent='';draw()}draw();</script></body></html>
