<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial;color:#111}.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{color:#00a5dc;font-size:25px;margin:0 0 25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:28px}.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:white;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}input,select{border:2px solid #ff3b30;background:#fff;height:40px;font-size:18px;padding:5px 8px}.tf{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;padding:12px;margin:10px 0;background:#f6fcff;border:1px solid #b8eaff;border-radius:14px;font:20px Georgia}.tf button{border:2px solid #ff1680;border-radius:10px;background:white;padding:8px 17px;margin-left:8px}.sel{background:#fff0f6!important}</style></head><body><main class="ex"><h1>State true or false.</h1><div class="tf" data-a="T"><span>a. Division means splitting into equal parts or groups.</span><div><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="tf" data-a="F"><span>b. When a non-zero number is divided by 1, then the quotient is 1.</span><div><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="tf" data-a="T"><span>c. The remainder is always smaller than the divisor.</span><div><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="tf" data-a="T"><span>d. 45 ÷ 0 = 0</span><div><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score"></div><script>score.textContent="Score: 0 / 4";document.querySelectorAll(".tf").forEach(q=>q.querySelectorAll("button").forEach(b=>b.onclick=()=>{q.querySelectorAll("button").forEach(x=>x.className="");b.className="sel";q.dataset.p=b.dataset.v}));function check(){let s=0;document.querySelectorAll(".tf").forEach(q=>{let p=q.dataset.p;q.querySelectorAll("button").forEach(b=>{b.classList.remove("ok","bad");if(b.dataset.v===p)b.classList.add(p===q.dataset.a?"ok":"bad")});if(p===q.dataset.a)s++});score.textContent=`Score: ${s} / 4`}function resetAll(){document.querySelectorAll(".tf").forEach(q=>{delete q.dataset.p;q.querySelectorAll("button").forEach(b=>b.className="")});score.textContent="Score: 0 / 4"}</script></main></body></html>
