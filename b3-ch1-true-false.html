<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write 'True' or 'False' in the given boxes.</title><style>*{box-sizing:border-box}body{margin:0;background:#dff6ff;font-family:Arial;color:#171717}.w{max-width:1000px;margin:auto;min-height:100vh;background:#fff;border:5px solid #08a9dc;border-radius:24px;padding:24px}h1{font-size:25px;color:#ff0072}.q{background:#f6fbfe;border:2px solid #a8eaff;border-radius:17px;padding:13px 16px;margin:10px 0;font-size:17px;font-weight:600}.o{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}.b,button{border:2px solid #ff2581;background:#fff;border-radius:11px;padding:8px 12px;font-size:16px;cursor:pointer}.sel{background:#ffe4f0}.ok{background:#dcf8df!important}.bad{background:#ffe0e0!important}input{border:2px solid #ff5a3d;padding:7px;font-size:16px}.a{display:flex;gap:10px;margin-top:18px}#result{font-weight:bold;margin-top:12px}@media(max-width:650px){.w{border-width:3px;border-radius:0;padding:14px}}</style></head><body><main class="w"><h1>Write 'True' or 'False' in the given boxes.</h1><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:12px"><span style="flex:1 1 430px">1. We should thank God for everything.</span><div class="o"><button class="b" data-q="0" data-v="1" onclick="pick(this)">True</button><button class="b" data-q="0" data-v="0" onclick="pick(this)">False</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:12px"><span style="flex:1 1 430px">2. We should be proud of our good qualities.</span><div class="o"><button class="b" data-q="1" data-v="1" onclick="pick(this)">True</button><button class="b" data-q="1" data-v="0" onclick="pick(this)">False</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:12px"><span style="flex:1 1 430px">3. We should laugh at others for their shortcomings.</span><div class="o"><button class="b" data-q="2" data-v="1" onclick="pick(this)">True</button><button class="b" data-q="2" data-v="0" onclick="pick(this)">False</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:12px"><span style="flex:1 1 430px">4. We should always be humble.</span><div class="o"><button class="b" data-q="3" data-v="1" onclick="pick(this)">True</button><button class="b" data-q="3" data-v="0" onclick="pick(this)">False</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:12px"><span style="flex:1 1 430px">5. We should discriminate between an intelligent student and a weak student.</span><div class="o"><button class="b" data-q="4" data-v="1" onclick="pick(this)">True</button><button class="b" data-q="4" data-v="0" onclick="pick(this)">False</button></div></div><div class="a"><button onclick="check()">Submit</button><button onclick="location.reload()">Reset</button></div><div id="result"></div></main><script>const A=[1, 1, 0, 1, 0],S={};function pick(e){document.querySelectorAll(`[data-q="${e.dataset.q}"]`).forEach(x=>x.classList.remove('sel'));e.classList.add('sel');S[e.dataset.q]=+e.dataset.v}function check(){let n=0;A.forEach((a,i)=>{if(S[i]===a)n++});result.textContent=`Score: ${n} / 5`}</script></body></html>
