<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 Chapter 12 – Tick the Correct Statements</title><style>:root{font-family:Georgia,'Times New Roman',serif;color:#16202b}*{box-sizing:border-box}body{margin:0;background:#d5faff;padding:22px 12px}.sheet{max-width:1040px;margin:auto;background:white;border:3px solid #00ace3;border-radius:22px;padding:24px 28px}h2{font-size:25px;color:#00a9e4;margin:0 0 18px}.item{display:flex;align-items:center;gap:12px;background:#ecfaff;border:1px solid #00b5ed;border-radius:10px;margin:7px 0;padding:10px 13px;font-size:17px}.letter{font-weight:bold;min-width:23px}.statement{flex:1}.choice{display:flex;gap:8px}.choice button{width:39px;height:36px;background:white;border:2px solid #00b6e9;border-radius:8px;font-size:22px;cursor:pointer;color:#344}.choice button.active{background:#e0f4ff;border-color:#087cc7;color:#075d9a}.item.correct{border-color:#20ad59;background:#e9fff0}.item.incorrect{border-color:#ef3c3c;background:#fff0f0;animation:flash .7s 2}.item.incorrect .choice button.active{border-color:#e33;color:#d22}@keyframes flash{50%{background:#ffd5d5}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:23px}.actions button{background:#ff8200;border:0;border-radius:24px;color:white;padding:11px 19px;font-size:15px;font-weight:bold;cursor:pointer}.actions button:hover{background:#eb7200}.note{text-align:center;font-size:13px;color:#536477;margin:10px 0 0}@media(max-width:600px){.sheet{padding:17px 12px}h2{font-size:21px}.item{font-size:15px;gap:6px;padding:8px}.choice{gap:4px}.choice button{width:32px;height:33px;font-size:19px}}</style></head><body><main class="sheet"><h2>Tick (✓) the correct statements.</h2><section id="questions"></section><div class="actions"><button id="check">Check Answers</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><p class="note">Select ✓ for true and ✗ for false.</p></main><script>
const questions=[
['A right angled triangle has a right angle.',true],
['The sum of angles of a triangle is 360°.',false],
['In an obtuse angled triangle, all angles are always equal.',false],
['An acute angled triangle has all its angles less than 90°.',true],
['An isosceles triangle has opposite sides equal.',false],
['An equilateral triangle has all the sides equal.',true],
['A triangle that has all the sides unequal is called a scalene triangle.',true],
['The sum of angles of a quadrilateral is 360°.',true],
['A parallelogram has opposite sides equal and parallel but opposite angles unequal.',false],
['A rhombus is not a parallelogram.',false]
];
const key='math-4-ch12-12d-tick-v1';let selections=Array(questions.length).fill(null);try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.length===questions.length)selections=saved}catch(e){}
const root=document.getElementById('questions');function render(){root.innerHTML='';questions.forEach(([q,answer],i)=>{const el=document.createElement('div');el.className='item';el.innerHTML='<span class="letter">'+String.fromCharCode(97+i)+'.</span><span class="statement"></span><div class="choice"><button type="button" aria-label="True">✓</button><button type="button" aria-label="False">✗</button></div>';el.querySelector('.statement').textContent=q;el.querySelectorAll('button').forEach((b,j)=>{let val=j===0;b.classList.toggle('active',selections[i]===val);b.setAttribute('aria-pressed',String(selections[i]===val));b.addEventListener('click',()=>{selections[i]=val;localStorage.setItem(key,JSON.stringify(selections));render()})});root.appendChild(el)})}
document.getElementById('check').addEventListener('click',()=>{root.querySelectorAll('.item').forEach((el,i)=>{el.classList.remove('correct','incorrect');el.classList.add(selections[i]===questions[i][1]?'correct':'incorrect')})});document.getElementById('show').addEventListener('click',()=>{selections=questions.map(q=>q[1]);localStorage.setItem(key,JSON.stringify(selections));render();root.querySelectorAll('.item').forEach(el=>el.classList.add('correct'))});document.getElementById('reset').addEventListener('click',()=>{selections=Array(questions.length).fill(null);localStorage.removeItem(key);render()});render();
</script></body></html>
