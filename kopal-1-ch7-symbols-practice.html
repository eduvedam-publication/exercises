const board=document.getElementById('sheet'),bank=document.getElementById('bank'),feedback=document.getElementById('feedback');let selected=null;let values=Array(boxes.length).fill('');
function setSelected(value){selected=value;document.querySelectorAll('.chip').forEach(el=>{el.classList.toggle('active',el.dataset.value===value);el.setAttribute('aria-pressed',String(el.dataset.value===value))})}
function place(i,value){if(!choices.includes(value))return;values[i]=value;const el=document.getElementById('slot'+i);el.textContent=value;el.className='slot filled';el.setAttribute('aria-label','उत्तर '+(i+1)+': '+value);feedback.textContent='';setSelected(null)}
boxes.forEach((b,i)=>{const el=document.createElement('button');el.type='button';el.id='slot'+i;el.className='slot';el.style.left=(b[0]/width*100)+'%';el.style.top=(b[1]/height*100)+'%';el.style.width=(b[2]/width*100)+'%';el.style.height=(b[3]/height*100)+'%';el.setAttribute('aria-label','उत्तर '+(i+1)+' यहाँ रखिए');el.addEventListener('click',()=>{if(selected!==null)place(i,selected);else if(values[i]){values[i]='';el.textContent='';el.className='slot';el.setAttribute('aria-label','उत्तर '+(i+1)+' यहाँ रखिए');feedback.textContent=''}});el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';el.classList.add('over')});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');place(i,e.dataTransfer.getData('text/plain'))});board.appendChild(el)});
choices.forEach(value=>{const el=document.createElement('button');el.type='button';el.className='chip';el.textContent=value;el.dataset.value=value;el.draggable=true;el.setAttribute('aria-pressed','false');el.addEventListener('click',()=>setSelected(selected===value?null:value));el.addEventListener('dragstart',e=>{setSelected(value);e.dataTransfer.setData('text/plain',value);e.dataTransfer.effectAllowed='copy'});bank.appendChild(el)});
function check(){let missing=false,wrong=false;boxes.forEach((b,i)=>{const el=document.getElementById('slot'+i);el.className='slot';if(!values[i]){missing=true;el.classList.add('missing')}else if(values[i]===b[4])el.classList.add('correct');else{wrong=true;el.classList.add('wrong')}});feedback.textContent=missing?'सभी खाली स्थान पूरे कीजिए।':wrong?'लाल घेरे वाले उत्तर फिर से देखिए।':'बहुत अच्छे! सभी उत्तर सही हैं।'}
function showAnswers(){boxes.forEach((b,i)=>place(i,b[4]));check()}
function resetAll(){values.fill('');boxes.forEach((b,i)=>{const el=document.getElementById('slot'+i);el.textContent='';el.className='slot';el.setAttribute('aria-label','उत्तर '+(i+1)+' यहाँ रखिए')});setSelected(null);feedback.textContent=''}
document.getElementById('submit').addEventListener('click',check);document.getElementById('show').addEventListener('click',showAnswers);document.getElementById('reset').addEventListener('click',resetAll);
</script></body></html>
