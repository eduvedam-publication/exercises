<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>निम्नलिखित मुहावरों को उनके अर्थ से मिलाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#bafaff;color:#173044;font-family:Arial,"Noto Sans Devanagari",sans-serif}.wrap{max-width:1020px;margin:14px auto;padding:24px;background:#fff;border:3px solid #00aeff;border-radius:20px}h1{color:#00a5ed;font-size:clamp(21px,3vw,29px);margin:0 0 16px}.q{background:#e0f9ff;border:1.5px solid #00aeff;border-radius:12px;padding:12px 14px;margin:9px 0;font-size:19px;line-height:1.9}.opts,.bank{display:flex;flex-wrap:wrap;gap:9px}.opts{margin-top:6px}.bank{background:#d1f7ff;padding:12px;border-radius:11px;margin-bottom:12px}.opt,.chip,.slot,.match{font:inherit;border:1px solid #00aeff;border-radius:9px;background:white;padding:8px 13px;color:#173044;cursor:pointer;min-height:40px}.opt.sel,.chip.sel,.match.sel{background:#9feaff}.slot{border:2px dashed #ff867b;min-width:125px;vertical-align:middle;white-space:normal}.good{background:#d6f8df!important;border-color:#16a34a!important;color:#176534!important}.bad{background:#ffe0e0!important;border-color:#e03131!important;color:#a11!important}.controls{text-align:center;margin-top:24px}.controls button{border:0;background:#ff7300;color:white;border-radius:25px;padding:11px 18px;margin:3px;cursor:pointer;font-weight:bold}.score{text-align:center;color:#0039dc;font-weight:bold;font-size:22px;margin-top:10px}.matchgrid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px 25%;padding:5px}.matchcol{display:flex;flex-direction:column;gap:10px;z-index:1}.match{min-height:52px;text-align:left}.matchsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.hint{font-size:15px;color:#456}@media(max-width:600px){.wrap{margin:5px;padding:12px}.q{font-size:17px}.slot{min-width:90px}.matchgrid{gap:10px 10%}}</style></head><body><main class="wrap"><h1>निम्नलिखित मुहावरों को उनके अर्थ से मिलाइए–</h1><section id="questions"></section><div class="controls"><button id="submit">Submit</button><button id="answer">Show Answer</button><button id="reset">Reset</button></div><div class="score" id="score">Marks: 0 / 5</div></main><script>const TYPE="muhavare-matching";const TOTAL=5;const root=document.getElementById('questions'), score=document.getElementById('score');const key='KOPAL_6_CH14_'+TYPE;let answers=[];try{answers=JSON.parse(localStorage.getItem(key))||[]}catch(e){};function save(){localStorage.setItem(key,JSON.stringify(answers))}function mark(el,correct){el.classList.remove('good','bad');el.classList.add(correct?'good':'bad')}function clearMarks(){document.querySelectorAll('.good,.bad').forEach(x=>x.classList.remove('good','bad'))}function controls(check,show,reset){document.getElementById('submit').onclick=check;document.getElementById('answer').onclick=show;document.getElementById('reset').onclick=()=>{answers=[];save();reset();score.textContent='Marks: 0 / '+TOTAL}}function result(n){score.textContent='Marks: '+n+' / '+TOTAL}const letters=['क','ख','ग','घ','ङ','च'];const LEFT=['भेंट चढ़ना','पर लगना','अरमान निकालना','रंग जमाना','सहारा होना'];const RIGHT=['प्रभाव होना','इच्छाएँ उमड़ना','रक्षा करना','मृत्यु होना','इच्छा पूरी करना'];const CORRECT=[3,1,4,0,2];let chosen=null;function render(){root.innerHTML=`<div class="q"><div class="hint">बाईं ओर मुहावरा चुनें, फिर दाईं ओर उसका अर्थ चुनें। रेखाएँ स्वतः जुड़ेंगी।</div><div class="matchgrid" id="mg"><svg class="matchsvg" id="lines"></svg><div class="matchcol">${LEFT.map((x,i)=>`<button class="match left ${chosen===i?'sel':''}" data-i="${i}">(${letters[i]}) ${x}</button>`).join('')}</div><div class="matchcol">${RIGHT.map((x,j)=>`<button class="match right" data-j="${j}">(${['i','ii','iii','iv','v'][j]}) ${x}</button>`).join('')}</div></div></div>`;root.querySelectorAll('.left').forEach(b=>b.onclick=()=>{chosen=+b.dataset.i;render()});root.querySelectorAll('.right').forEach(b=>b.onclick=()=>{if(chosen!==null){answers[chosen]=+b.dataset.j;chosen=null;save();render()}});draw()}function draw(){const grid=document.getElementById('mg'),svg=document.getElementById('lines'),r=grid.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.innerHTML='';answers.forEach((j,i)=>{if(j===undefined||j===null)return;const a=root.querySelectorAll('.left')[i].getBoundingClientRect(),b=root.querySelectorAll('.right')[j].getBoundingClientRect();const x1=a.right-r.left,y1=(a.top+a.bottom)/2-r.top,x2=b.left-r.left,y2=(b.top+b.bottom)/2-r.top;const line=document.createElementNS('http://www.w3.org/2000/svg','line');for(const [k,v] of Object.entries({x1,y1,x2,y2,stroke:'#009ddd','stroke-width':'3'}))line.setAttribute(k,v);svg.appendChild(line)})}window.addEventListener('resize',draw);controls(()=>{let n=0;CORRECT.forEach((v,i)=>{if(answers[i]===v)n++;if(answers[i]!==undefined)mark(root.querySelectorAll('.left')[i],answers[i]===v)});result(n)},()=>{answers=[...CORRECT];save();render();root.querySelectorAll('.left').forEach(x=>mark(x,true));result(TOTAL)},()=>{chosen=null;render()});render();</script></body></html>
