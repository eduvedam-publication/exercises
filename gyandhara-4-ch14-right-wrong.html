<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GyanDhara 4 Chapter 14 Right Wrong</title><style>
*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#17333b}.wrap{max-width:1000px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a7dd;margin:0 0 8px;font-size:26px}.marks{color:#47717e;font-size:15px;margin:0 0 18px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:13px;margin:10px 0;font-size:19px}.tf{display:flex;gap:8px;margin-top:8px}.tf button{background:white;border:1px solid #00aeec;color:#333;border-radius:8px;padding:7px 19px;cursor:pointer;font:inherit}.tf button.sel{background:#c8eeff}.tf button.correct{background:#d9fbe3;border-color:#13a34c}.tf button.wrong{background:#ffdada;border-color:red;animation:blink .6s 2}.q.correct{background:#dcfce5!important;border-color:#22aa55!important}.q.wrong{background:#ffe3e3!important;border-color:#ff4545!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.actions button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}#score{text-align:center;color:#0073bd;font-size:19px;font-weight:bold;margin-top:14px}@media(max-width:620px){.wrap{margin:7px;padding:14px}.q{font-size:17px}}</style></head><body><main class="wrap"><h2>सही (✓) या गलत (✗) का चिह्न लगाइए–</h2><p class="marks">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 4</p><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 4</div></main><script>
const data=[
["पूर्ण विराम का प्रयोग सबसे अधिक किया जाता है।",true],
["प्रश्नवाचक चिह्न वाक्य के प्रारंभ में लगता है।",false],
["विराम चिह्नों के प्रयोग से भाषा का अर्थ स्पष्ट होता है।",true],
["घृणा, शोक, आश्चर्य मन के भावों को प्रकट करने के लिए योजक चिह्न लगाया जाता है।",false]
],key='gyandhara-4-ch14-tick';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const root=document.getElementById('questions');
function render(){root.innerHTML=data.map((q,i)=>`<div class="q" id="q${i}"><div>(${'कखगघ'[i]}) ${q[0]}</div><div class="tf"><button id="t${i}" class="${answers[i]===true?'sel':''}" onclick="pick(${i},true)">✓ सही</button><button id="f${i}" class="${answers[i]===false?'sel':''}" onclick="pick(${i},false)">✗ गलत</button></div></div>`).join('')}
function pick(i,v){answers[i]=v;localStorage.setItem(key,JSON.stringify(answers));render()}
function check(){let score=0;data.forEach((q,i)=>{const box=document.getElementById('q'+i);box.classList.remove('correct','wrong');if(answers[i]===undefined)return;const btn=document.getElementById((answers[i]?'t':'f')+i);const ok=answers[i]===q[1];btn.classList.add(ok?'correct':'wrong');box.classList.add(ok?'correct':'wrong');if(ok)score++});document.getElementById('score').textContent=`प्राप्तांक: ${score} / 4`}
function showAnswers(){data.forEach((q,i)=>answers[i]=q[1]);localStorage.setItem(key,JSON.stringify(answers));render();check()}
function resetAll(){answers={};localStorage.removeItem(key);render();document.getElementById('score').textContent='प्राप्तांक: 0 / 4'}render();</script></main></body></html>
