<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1080px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:30px 38px}
h1{margin:0 0 26px;color:#00a3dc;font-size:25px}.questions{display:grid;width:100%;gap:22px 55px}.two{grid-template-columns:repeat(2,1fr)}.four{grid-template-columns:repeat(4,1fr)}
.q{display:flex;align-items:center;gap:8px;font:20px Georgia,serif}.nowrap{white-space:nowrap}.ans{width:95px;height:37px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:4px 7px}
.mcq{margin-bottom:24px;font:19px Georgia,serif}.prompt{margin-bottom:10px}.opts{display:flex;flex-wrap:wrap;gap:10px 20px;margin-left:28px}.opt{border:2px solid #ff1680;background:#fff;border-radius:11px;padding:9px 16px;font:17px Georgia,serif;cursor:pointer}.opt.sel{background:#ffe2ef}.opt.ok{background:#dcf8df;border-color:#009b8e}.opt.bad{background:#ffe1e1;border-color:#e43d30}
.controls{display:flex;justify-content:center;gap:14px;width:100%;margin-top:38px}.controls button{border:0;border-radius:24px;background:#ff7d00;color:#fff;font-weight:bold;padding:12px 22px;cursor:pointer}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}
.okI{background:#dcf8df!important;border-color:#009b8e!important}.badI{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:900px){.four{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){body{padding:0}.exercise{border-radius:0;padding:18px}.two,.four{grid-template-columns:1fr}}
</style></head><body><main class="exercise"><h1>Fill the empty boxes.</h1><div class="questions two"><div class="q nowrap"><span>a. &nbsp; 8690 − 10 =</span><input id="a0" class="ans"></div><div class="q nowrap"><span>b. &nbsp; 5699 −</span><input id="a1" class="ans"></div><div class="q nowrap"><span>c. &nbsp; 5592 −</span><input id="a2" class="ans"></div><div class="q nowrap"><span>d. &nbsp; 8142 −</span><input id="a3" class="ans"></div></div><div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div></main><script>const A=['8680', '0', '10', '1000'];function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById('a'+i),o=e.value.trim()===a;e.classList.remove('okI','badI');e.classList.add(o?'okI':'badI');if(o)s++});score.textContent='Score: '+s+' / 4'}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('okI','badI')});score.textContent='Score: 0 / 4'}</script></body></html>
