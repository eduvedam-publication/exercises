<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#e8faff;font-family:Arial,sans-serif}.exercise{max-width:1080px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:30px 38px}h1{margin:0 0 28px;color:#00a3dc;font-size:25px}.grid{display:grid;gap:24px 40px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.q{display:flex;align-items:center;gap:6px;font:20px Georgia,serif;white-space:nowrap}.ans{width:88px;height:37px;border:2px solid red;font-size:18px;text-align:center;padding:4px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:35px}.problem{display:flex;gap:8px;justify-content:center;font:19px Georgia,serif}.card{width:180px;background:#d9effb;padding:8px}.cols{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}.head{color:#ff0870;border-bottom:1px solid #22c9e9;padding:6px 0;font-size:19px}.row{min-height:38px;align-items:center;border-bottom:1px solid #22c9e9;font-size:20px}.blank{height:32px;border-bottom:1px solid #22c9e9}.answer{width:100%;height:38px;margin-top:4px;border:2px solid red;font-size:18px;text-align:center}.controls{display:flex;justify-content:center;gap:14px;margin-top:38px}.controls button{border:0;border-radius:24px;background:#ff7d00;color:#fff;font-weight:bold;padding:12px 22px}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:850px){.g4,.g3,.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.g4,.g3,.cards{grid-template-columns:1fr}.exercise{padding:20px}}</style></head><body><main class="exercise"><h1>Solve:</h1><div class="cards"><div class="problem"><span>a.</span><div class="card"><div class="cols head"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="blank"></div><div class="cols row"><span></span><span></span><span>6</span><span>9</span></div><div class="cols row"><span></span><span>×</span><span>5</span><span>0</span></div><input class="answer" id="a0" inputmode="numeric"></div></div><div class="problem"><span>b.</span><div class="card"><div class="cols head"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="blank"></div><div class="cols row"><span></span><span></span><span>8</span><span>0</span></div><div class="cols row"><span></span><span>×</span><span>3</span><span>0</span></div><input class="answer" id="a1" inputmode="numeric"></div></div><div class="problem"><span>c.</span><div class="card"><div class="cols head"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="blank"></div><div class="cols row"><span></span><span></span><span>3</span><span>2</span></div><div class="cols row"><span></span><span>×</span><span>5</span><span>0</span></div><input class="answer" id="a2" inputmode="numeric"></div></div></div><div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div class="score" id="score">Score: 0 / 3</div></main><script>const A=['3450', '2400', '1600'];function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById('a'+i),g=e.value.trim()===a;e.classList.remove('ok','bad');e.classList.add(g?'ok':'bad');if(g)s++});score.textContent='Score: '+s+' / 3'}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});score.textContent='Score: 0 / 3'}</script></body></html>
