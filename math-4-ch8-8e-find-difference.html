<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find the difference.</title><style>
*{box-sizing:border-box}body{margin:0;background:#d8faff;font-family:Georgia,'Times New Roman',serif;color:#142235}.shell{max-width:1100px;margin:16px auto;background:white;border:3px solid #00afe0;border-radius:22px;padding:22px 26px}h2{color:#00a9dd;font-size:26px;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 22px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border:1px solid #6ddafa;background:#edfbff;border-radius:10px;padding:12px;min-width:0}.qline{font-size:19px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.number{font-weight:bold}.stack{font-family:monospace;font-size:21px;letter-spacing:2px;text-align:right;min-width:140px;display:inline-block}.stack div{padding:2px 4px}.stack .last{border-bottom:2px solid #00b4df}.answer{font:18px Georgia;border:2px solid #ff6d56;border-radius:4px;background:#fff;width:100%;padding:8px;outline:none;margin-top:8px}.answer.correct{border-color:#1eaf53;background:#e2f9e9}.answer.wrong{border-color:#f03444;background:#fff0f0;animation:blink .45s 3}@keyframes blink{50%{background:#ffb7bd}}.buttons{display:flex;justify-content:center;gap:12px;margin-top:26px}.buttons button{background:#ff8200;color:white;border:0;border-radius:24px;padding:11px 22px;font-weight:bold;cursor:pointer}.score{text-align:center;color:#0056c5;font: bold 19px Arial;margin-top:12px}.feedback{font:14px Arial;margin-top:5px;min-height:17px}.correct+.feedback{color:#13873c}.wrong+.feedback{color:#e32e41}@media(max-width:750px){.shell{margin:6px;padding:14px}.grid,.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stack{min-width:110px;font-size:17px}}@media(max-width:480px){.grid,.grid.two{grid-template-columns:1fr}.qline{font-size:17px}}</style></head><body><main class="shell"><h2>Find the difference.</h2><section id="questions" class="grid"></section><div class="buttons"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetAnswers()">Reset</button></div><div id="score" class="score">Score: 0 / 9</div></main><script>
const items=[["54.016 − 36.347", "17.669"], ["60.076 − 38.579", "21.497"], ["94.368 − 79.463", "14.905"], ["71.363 − 19.976", "51.387"], ["94.367 − 46.296", "48.071"], ["59.372 − 38.297", "21.075"], ["137.593 − 98.906", "38.687"], ["800.007 − 397.995", "402.012"], ["472.67 − 294.39", "178.28"]];const key='vidyalaya-'+location.pathname.split('/').pop();const root=document.getElementById('questions');const letters='abcdefghijklmnopqrstuvwxyz';
function displayExpr(expr){let parts=expr.split(/\s([+−])\s/);if(parts.length<3)return '<span>'+expr+'</span>';let rows=[];for(let i=0;i<parts.length;i+=2)rows.push((i?parts[i-1]+' ':'')+parts[i]);return '<div class="stack">'+rows.map((r,i)=>'<div class="'+(i===rows.length-1?'last':'')+'">'+r+'</div>').join('')+'</div>'}
items.forEach(([question,answer],i)=>{let card=document.createElement('article');card.className='card';card.innerHTML='<div class="qline"><span class="number">'+letters[i]+'.</span>'+(displayExpr(question))+'</div><input class="answer" aria-label="Answer '+letters[i]+'" inputmode="decimal" autocomplete="off" id="a'+i+'"><div class="feedback" id="f'+i+'"></div>';root.appendChild(card)});
function save(){localStorage.setItem(key,JSON.stringify(items.map((_,i)=>document.getElementById('a'+i).value)))}
function normalize(v){let x=v.trim().replace(/,/g,'');if(!x)return null;return /^[-+]?\d+(\.\d+)?$/.test(x)?Number(x):null}
function checkAnswers(){let score=0;items.forEach((item,i)=>{const el=document.getElementById('a'+i),f=document.getElementById('f'+i);el.classList.remove('correct','wrong');void el.offsetWidth;if(normalize(el.value)===Number(item[1])){score++;el.classList.add('correct');f.textContent='✓ Correct'}else if(el.value.trim()){el.classList.add('wrong');f.textContent='✗ Try again'}else f.textContent='';});document.getElementById('score').textContent='Score: '+score+' / '+items.length;save()}
function resetAnswers(){items.forEach((_,i)=>{let el=document.getElementById('a'+i);el.value='';el.classList.remove('correct','wrong');document.getElementById('f'+i).textContent=''});document.getElementById('score').textContent='Score: 0 / '+items.length;save()}
try{let old=JSON.parse(localStorage.getItem(key)||'[]');old.forEach((v,i)=>{if(document.getElementById('a'+i))document.getElementById('a'+i).value=v||''})}catch(e){}document.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{el.classList.remove('correct','wrong');el.nextElementSibling.textContent='';save()}));
</script></body></html>
