<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 – Chapter 5 Exercise 5(b)</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;color:#222;font-family:Georgia,'Times New Roman',serif}.exercise{max-width:980px;margin:24px auto;background:#fff;border:3px solid #00afe1;border-radius:25px;padding:25px}h1{font-size:25px;color:#00a8df;margin:0 0 22px}.questions{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px}.question{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1.5px solid #00b5e9;border-radius:11px;background:#edfbff;min-width:0}.number{font-weight:bold;min-width:25px}.equation{font-size:20px;white-space:nowrap}.answer-group{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.answer-row{display:flex;align-items:center;gap:6px}.answer-row label{font-size:15px;min-width:80px}.answer-row input{width:100%;min-width:45px;height:35px;border:2px solid #ff5261;padding:3px 7px;font:19px Georgia,serif;outline:none;background:#fff}.answer-row input.good{background:#e3ffe9;border-color:#15985d}.answer-row input.bad{background:#ffe1e1;border-color:#df2636;animation:blink .45s 3}@keyframes blink{50%{background:#ff8686}}.actions{display:flex;justify-content:center;gap:14px;margin-top:27px}button{border:0;border-radius:22px;background:#ff8100;color:white;font-weight:bold;padding:11px 21px;cursor:pointer}#score{text-align:center;font:700 22px Arial,sans-serif;color:#064dc3;margin-top:15px}@media(max-width:740px){.exercise{margin:8px;padding:15px;border-radius:16px}.questions{grid-template-columns:1fr}.equation{font-size:18px}h1{font-size:22px}}</style></head><body><main class="exercise"><h1>Divide and write quotient and remainder.</h1><div class="questions" id="questions"></div><div class="actions"><button type="button" onclick="checkAnswers()">Check Answers</button><button type="button" onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 8</div></main><script>
const data=[[107580,12],[83205,11],[69104,56],[51030,14]];const storageKey='math-4-ch5-5b-divide-v1';const root=document.getElementById('questions');data.forEach(([n,d],i)=>{const card=document.createElement('div');card.className='question';card.innerHTML=`<span class="number">${i+1}.</span><span class="equation">${n} ÷ ${d}</span><div class="answer-group"><div class="answer-row"><label for="q${i}">Quotient:</label><input id="q${i}" inputmode="numeric" autocomplete="off" aria-label="Question ${i+1} quotient"></div><div class="answer-row"><label for="r${i}">Remainder:</label><input id="r${i}" inputmode="numeric" autocomplete="off" aria-label="Question ${i+1} remainder"></div></div>`;root.appendChild(card)});const inputs=[...document.querySelectorAll('input')];function save(){try{localStorage.setItem(storageKey,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}try{const stored=JSON.parse(localStorage.getItem(storageKey)||'null');if(Array.isArray(stored))inputs.forEach((el,i)=>{el.value=stored[i]??''})}catch(e){}inputs.forEach(el=>el.addEventListener('input',()=>{el.classList.remove('good','bad');save()}));function checkAnswers(){let score=0;data.forEach(([n,d],i)=>{[[`q${i}`,Math.floor(n/d)],[`r${i}`,n%d]].forEach(([id,expected])=>{const el=document.getElementById(id);const correct=el.value.trim()!==''&&Number(el.value.trim())===expected;el.classList.remove('good','bad');void el.offsetWidth;el.classList.add(correct?'good':'bad');if(correct)score++})});document.getElementById('score').textContent=`Score: ${score} / 8`;save()}function resetExercise(){inputs.forEach(el=>{el.value='';el.classList.remove('good','bad')});document.getElementById('score').textContent='Score: 0 / 8';try{localStorage.removeItem(storageKey)}catch(e){}}
</script></body></html>
