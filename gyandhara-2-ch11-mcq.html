<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का चिह्न लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#dff9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#172d39}.exercise{max-width:920px;margin:14px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 24px;min-height: min(650px,96vh);display:flex;flex-direction:column}h1{font-size:23px;color:#00a9e0;margin:0 0 15px}.items{flex:1}.item{background:#f1fbff;border:1.5px solid #00c9ee;border-radius:12px;padding:12px 15px;margin:9px 0;font-size:19px}.opts{display:flex;flex-wrap:wrap;gap:9px 18px;margin-top:9px}.opt{background:#fff;border:1.5px solid #ff2780;border-radius:9px;padding:7px 12px;font-size:17px;cursor:pointer;color:#142d38}.opt.selected{background:#d9f8eb;border-color:#00a875}.opt.correct{background:#c9f4d7}.opt.wrong{background:#ffe2e2}.actions{display:flex;gap:10px;justify-content:center;margin-top:15px}.actions button{background:#ff8400;border:0;color:white;border-radius:22px;padding:10px 20px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0070c6;font-size:19px;font-weight:bold;margin:10px 0 0}.bank{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;background:#e3f9ff;border-radius:10px;padding:12px;margin-bottom:15px}.word{border:1.5px solid #00a9e0;border-radius:7px;background:white;padding:6px 13px;font-size:18px;cursor:grab}.word.active{background:#c8f4ed;border-color:#ff3480}.blank{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:110px;min-height:35px;border:2px dashed #ff624d;border-radius:7px;background:white;padding:2px 7px;cursor:pointer;color:#222}.blank.filled{border-style:solid;background:#eafff7}.blank.correct{background:#d9f8e1}.blank.wrong{background:#ffe4e4}.tf{display:flex;align-items:center;justify-content:space-between;gap:15px}.tf .opts{flex-shrink:0;margin:0}@media(max-width:600px){.exercise{margin:0;border-radius:0;padding:13px;min-height:100dvh}h1{font-size:20px}.item{font-size:17px}.opt{font-size:16px}.tf{align-items:flex-start;flex-direction:column}}</style></head><body><main class="exercise"><h1>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h1><section class="items"><div class="item"><b>(</b> समान अर्थ बताने वाले शब्दों को कहते हैं–<div class="opts"><button class="opt" data-q="0" data-v="0" onclick="choose(0,0)">(अ) समानार्थी</button><button class="opt" data-q="0" data-v="1" onclick="choose(0,1)">(ब) विपरीतार्थी</button><button class="opt" data-q="0" data-v="2" onclick="choose(0,2)">(स) विलोम</button></div></div><div class="item"><b>क</b> समानार्थी शब्दों का दूसरा नाम है–<div class="opts"><button class="opt" data-q="1" data-v="0" onclick="choose(1,0)">(अ) अनेकार्थी</button><button class="opt" data-q="1" data-v="1" onclick="choose(1,1)">(ब) पर्यायवाची</button><button class="opt" data-q="1" data-v="2" onclick="choose(1,2)">(स) भिन्नार्थी</button></div></div><div class="item"><b>ख</b> घर को कहते हैं–<div class="opts"><button class="opt" data-q="2" data-v="0" onclick="choose(2,0)">(अ) सदन भी</button><button class="opt" data-q="2" data-v="1" onclick="choose(2,1)">(ब) विद्यालय भी</button><button class="opt" data-q="2" data-v="2" onclick="choose(2,2)">(स) आश्रम भी</button></div></div><div class="item"><b>ग</b> ‘आसमान’ का समानार्थी नहीं है–<div class="opts"><button class="opt" data-q="3" data-v="0" onclick="choose(3,0)">(अ) गगन</button><button class="opt" data-q="3" data-v="1" onclick="choose(3,1)">(ब) आकाश</button><button class="opt" data-q="3" data-v="2" onclick="choose(3,2)">(स) गुरु</button></div></div></section><div class="actions"><button onclick="submit()">Submit</button><button onclick="resetAll()">Reset</button></div><div id="score">Score: 0 / 4</div></main><script>const key="gyandhara-2-ch11-mcq";let state=JSON.parse(localStorage.getItem(key)||"[null,null,null,null]");function save(){localStorage.setItem(key,JSON.stringify(state))}function paint(){document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("selected",state[+b.dataset.q]===+b.dataset.v)))}function choose(q,v){state[q]=v;save();paint()}function submit(){let a=[0,1,0,2],n=0;a.forEach((v,i)=>{if(state[i]===v)n++});document.getElementById("score").textContent=`Score: ${n} / 4`}function resetAll(){state=[null,null,null,null];save();paint();document.getElementById("score").textContent="Score: 0 / 4"}paint();</script></body></html>
