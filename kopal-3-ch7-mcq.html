<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का निशान लगाएँ–</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:460px;display:flex;flex-direction:column}h2{font-size:23px;color:#00a9e5;margin:0 0 18px}.q{border:1.5px solid #00c7ee;border-radius:12px;background:#f0fbfe;padding:12px;margin:7px 0}.opts{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}.opt{border:1.5px solid #ff0070;border-radius:9px;background:white;padding:7px 12px;font-size:17px;cursor:pointer;color:#222}.opt.selected{background:#d7efff;border-color:#007fdb}.ok{background:#d9f9dc!important;border-color:#0a9b55!important}.bad{background:#ffe3e3!important;border-color:#e32b2b!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff5d5d}}.actions{display:flex;gap:9px;justify-content:center;margin-top:auto;padding-top:24px}.actions button{background:#ff8500;color:white;border:0;border-radius:20px;padding:10px 19px;cursor:pointer}#result{text-align:center;color:#0061b4;font-weight:bold;margin:12px}.field{border:1.5px solid #ff5b5b;border-radius:5px;padding:8px;font-size:18px;width:95%;max-width:240px} @media(max-width:600px){.wrap{margin:0;border-radius:0;padding:14px;min-height:100vh}.opts{gap:5px}.opt{font-size:15px;padding:6px}}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ–</h2><section class="q"><div><b>(क)</b> कोयल ने कूक-कूककर क्या किया है?</div><div class="opts"><button class="opt" data-q="0" data-v="0" onclick="choose(0,0)">(i) आम तोड़े हैं</button><button class="opt" data-q="0" data-v="1" onclick="choose(0,1)">(ii) पत्ती तोड़ी है</button><button class="opt" data-q="0" data-v="2" onclick="choose(0,2)">(iii) मिसरी घोली है</button></div></section><section class="q"><div><b>(ख)</b> उड़ना, गाना, मीठा बोलना कोयल को किसने सिखाया है?</div><div class="opts"><button class="opt" data-q="1" data-v="0" onclick="choose(1,0)">(i) कौवे ने</button><button class="opt" data-q="1" data-v="1" onclick="choose(1,1)">(ii) पिता ने</button><button class="opt" data-q="1" data-v="2" onclick="choose(1,2)">(iii) माँ ने</button></div></section><div class="actions"><button onclick="submitAnswers()">Submit</button><button onclick="resetExercise()">Reset</button></div><div id="result">Score: 0 / 2</div></main><script>const key='kopal-2-ch7-mcq',answers=[2,2];let selected=JSON.parse(localStorage.getItem(key)||'[null,null]');function render(){document.querySelectorAll('.opt').forEach(e=>{let q=+e.dataset.q,v=+e.dataset.v;e.classList.toggle('selected',selected[q]===v);e.classList.remove('ok','bad')})}function choose(q,v){selected[q]=v;localStorage.setItem(key,JSON.stringify(selected));render()}function submitAnswers(){let score=0;selected.forEach((v,i)=>{if(v===null)return;let e=document.querySelector(`.opt[data-q="${i}"][data-v="${v}"]`);if(v===answers[i]){score++;e.classList.add('ok')}else{e.classList.add('bad');void e.offsetWidth}});document.getElementById('result').textContent=`Score: ${score} / 2`;}function resetExercise(){selected=[null,null];localStorage.removeItem(key);render();document.getElementById('result').textContent='Score: 0 / 2'}render();</script></body></html>
