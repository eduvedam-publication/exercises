<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#e5f9fd;font-family:Arial,sans-serif}
.exercise{max-width:1080px;min-height:430px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:30px 42px;display:flex;flex-direction:column}
h1{margin:0 0 26px;color:#00a3dc;font-size:25px}
.content{flex:1}
.question{margin:0 0 22px;font:20px Georgia,serif}
.qline{display:flex;gap:10px;align-items:flex-start}
.qtext{line-height:1.35}
.options{display:flex;flex-wrap:wrap;gap:12px 22px;margin:10px 0 0 28px}
.option{border:2px solid #ff0870;background:#fff;border-radius:12px;padding:8px 15px;font:17px Georgia,serif;cursor:pointer;min-width:100px}
.option.selected{background:#fff1f6}
.option.ok,.ans.ok{background:#dcf8df;border-color:#009b8e}
.option.bad,.ans.bad{background:#ffe1e1;border-color:#e43d30}
.grid{display:grid;gap:24px 44px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.item{display:flex;align-items:center;gap:7px;font:20px Georgia,serif;white-space:nowrap}
.ans{height:38px;width:88px;border:2px solid red;font-size:18px;text-align:center;padding:3px 6px}
.choice{display:flex;align-items:center;gap:8px;font:20px Georgia,serif;margin:15px 0}
.tf{margin-left:auto;display:flex;gap:9px}
.tf button{width:48px;height:38px;border:2px solid #ff0870;border-radius:10px;background:#fff;font-weight:bold;cursor:pointer}
.tf button.selected{background:#fff1f6}
.controls{margin-top:auto;padding-top:32px;display:flex;justify-content:center;gap:14px}
.controls button{border:0;border-radius:24px;background:#ff7d00;color:#fff;font-weight:bold;padding:12px 22px;cursor:pointer}
.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:15px}
@media(max-width:760px){.g3,.g2{grid-template-columns:1fr}.exercise{padding:22px}.options{margin-left:0}.choice{flex-wrap:wrap}.tf{margin-left:0}}
</style></head>
<body><main class="exercise"><h1>Put &gt;, &lt; or = in the boxes.</h1><section class="content"><div class="grid g2"><div class="item"><b>a.</b>9 × 8 <input class="ans" id="a0" inputmode="text"> 12 × 6</div><div class="item"><b>b.</b>6 × 9 <input class="ans" id="a1" inputmode="text"> 13 × 4</div><div class="item"><b>c.</b>12 × 3 <input class="ans" id="a2" inputmode="text"> 6 × 6</div><div class="item"><b>d.</b>19 × 6 <input class="ans" id="a3" inputmode="text"> 18 × 8</div><div class="item"><b>e.</b>16 × 6 <input class="ans" id="a4" inputmode="text"> 12 × 8</div><div class="item"><b>f.</b>18 × 5 <input class="ans" id="a5" inputmode="text"> 15 × 8</div></div></section>
<div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div>
<div class="score" id="score">Score: 0 / 6</div></main><script>const A=['=', '>', '=', '<', '=', '<'];function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById('a'+i),g=e.value.trim()===a;e.classList.remove('ok','bad');e.classList.add(g?'ok':'bad');if(g)s++});score.textContent='Score: '+s+' / 6'}
function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});score.textContent='Score: 0 / 6'}</script></body></html>
