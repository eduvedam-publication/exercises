<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>रिक्त स्थान भरिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#d9f8ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#162b35}.exercise{width:min(900px,96vw);margin:16px auto;padding:20px 24px;background:white;border:3px solid #00a8d8;border-radius:20px;min-height:430px;display:flex;flex-direction:column}h1{color:#ff0064;font-size:25px;font-weight:600;margin:0 0 16px}.item{border:1.5px solid #00c5ec;border-radius:12px;background:#f1fbfe;margin:6px 0;padding:12px 14px;font-size:19px}.options{display:flex;flex-wrap:wrap;gap:9px;margin:9px 0 0 28px}.option{background:white;border:1.5px solid #ff0064;border-radius:9px;padding:7px 13px;cursor:pointer;font-size:17px;color:#172c34}.option.selected{background:#d9f6fc}.option.ok,.blank.ok{background:#dcf7dd;border-color:#0c9b50}.option.bad,.blank.bad{background:#ffdede;border-color:#e02c35;animation:blink .45s 3}@keyframes blink{50%{background:#ff6a6a}}.actions{display:flex;justify-content:center;gap:10px;margin-top:auto;padding-top:24px}button.action{border:0;border-radius:20px;padding:10px 19px;background:#ff8200;color:white;font-weight:bold;cursor:pointer}#score{text-align:center;font-size:18px;font-weight:bold;color:#0754af;margin:10px 0 0}.bank{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:#e4f7ff;border-radius:12px;padding:13px;margin:0 0 14px}.word{border:1.5px solid #00b5e8;background:white;padding:8px 12px;border-radius:8px;font-size:19px;cursor:grab}.word.used{opacity:.35}.blank{display:inline-flex;min-width:125px;min-height:37px;border:2px dashed #ff6b42;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;padding:3px 7px;background:white;cursor:pointer}.blank:empty:after{content:' ';white-space:pre}.hint{color:#647481;font-size:13px;margin-top:9px}@media(max-width:600px){.exercise{padding:15px;min-height:95vh}.item{font-size:17px}.options{margin-left:0}h1{font-size:22px}}</style></head><body><main class="exercise"><h1>रिक्त स्थान भरिए–</h1><div class="bank" id="bank"></div><div id="questions"></div><div class="hint">शब्द को खाली स्थान में खींचें या शब्द पर क्लिक करके खाली स्थान चुनें।</div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score">Score: 0 / 4</div><script>const rows=[["परिवार में सभी लोग मिलजुलकर ", " से रहते थे।", "आनंद"], ["दादा जी गाँव के बाहर ", " गए थे।", "आम"], ["दादा जी पुनः पूरे ", " से अपने काम में जुट गए।", "उत्साह"], ["गाँव के चारों ओर ", " लहलहा रहे थे।", "पेड़"]],words=["गुठलियाँ", "उत्साह", "आनंद", "पेड़", "आम"],key='kopal-2-ch15-drag-drop';let chosen=JSON.parse(localStorage.getItem(key)||'[null,null,null,null]'),active=null;function save(){localStorage.setItem(key,JSON.stringify(chosen))}function render(){document.getElementById('bank').innerHTML=words.map((w,i)=>`<button draggable="true" ondragstart="drag(event,${i})" onclick="pick(${i})" class="word ${chosen.includes(i)?'used':''}">${w}</button>`).join('');document.getElementById('questions').innerHTML=rows.map((r,i)=>`<div class="item">${['(क)','(ख)','(ग)','(घ)'][i]} ${r[0]}<span class="blank" ondragover="event.preventDefault()" ondrop="drop(event,${i})" onclick="place(${i})">${chosen[i]===null?'':words[chosen[i]]}</span>${r[1]}</div>`).join('')}function drag(e,i){active=i;e.dataTransfer.setData('text/plain',i)}function pick(i){active=i}function place(i){if(active===null){chosen[i]=null}else{chosen=chosen.map((x,j)=>x===active?null:x);chosen[i]=active;active=null}save();render()}function drop(e,i){e.preventDefault();active=Number(e.dataTransfer.getData('text/plain'));place(i)}function submit(){let score=0;document.querySelectorAll('.blank').forEach((b,i)=>{if(chosen[i]!==null){const ok=words[chosen[i]]===rows[i][2];if(ok)score++;b.classList.add(ok?'ok':'bad')}});document.getElementById('score').textContent=`Score: ${score} / 4`;save()}function resetAll(){chosen=[null,null,null,null];save();render();document.getElementById('score').textContent='Score: 0 / 4'}render();</script></main></body></html>
