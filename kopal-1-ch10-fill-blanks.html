<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>चुनिए और लिखिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#17333b}.wrap{max-width:1000px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a7dd;margin:0 0 8px;font-size:26px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:13px;margin:10px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.opt{border:1px solid #93dcf5;background:white;border-radius:8px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}.opt.sel{background:#d8f3ff;border-color:#009be0}.opt.correct{background:#dcfce5!important;border-color:#22aa55!important}.opt.wrong{background:#ffe3e3!important;border-color:#ff4545!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.actions button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}@media(max-width:620px){.wrap{margin:7px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}.opt{font:inherit;color:inherit;text-align:left;width:100%}.opt:focus-visible,.chip:focus-visible,.slot:focus-visible{outline:3px solid #ff8200;outline-offset:3px}.feedback{display:block;color:#47717e;font-size:16px;min-height:24px;margin-top:10px}.fillrow{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:center}.sentence{line-height:2.2}.row-options{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.chip{font:inherit;color:inherit;border:2px solid #00aee8;border-radius:8px;background:white;padding:8px 13px;cursor:grab}.chip.active{outline:3px solid #ff8200;background:#d8f3ff}.slot{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:110px;min-height:44px;border:2px dashed #00aee8;border-radius:7px;background:white;font:inherit;color:inherit;padding:3px 8px;cursor:pointer}.slot.correct{background:#dcfce5;border-color:#22aa55}.slot.wrong{background:#ffe3e3;border-color:#ff4545}.slot.over{outline:3px solid #ff8200}button{touch-action:manipulation}.hint{color:#47717e;line-height:1.6;font-size:16px}@media(max-width:760px){.fillrow{grid-template-columns:1fr;gap:12px}.row-options{justify-content:flex-start}.slot{min-width:95px}}</style></head><body><main class="wrap"><h2>चुनिए और लिखिए–</h2><p class="hint">दाईं ओर दिए दोनों विकल्पों में से सही शब्द खींचकर खाली स्थान में रखिए।<br>या शब्द पर, फिर खाली स्थान पर टैप कीजिए।</p><section id="questions"></section><div class="actions"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div></main><script>const data=[["हमें गुरु का ", " करना चाहिए।", ["सम्मान", "अपमान"], "सम्मान"], ["हमें ", " के मार्ग पर चलना चाहिए।", ["असत्य", "सत्य"], "सत्य"], ["हमें ", " मन लगाकर पढ़ना चाहिए।", ["कभी-कभी", "सदा"], "सदा"]];let answers=Array(data.length).fill(''),selected=null;const root=document.getElementById('questions');function select(i,value){selected=selected&&selected.row===i&&selected.value===value?null:{row:i,value};document.querySelectorAll('.chip').forEach(el=>{const on=selected&&Number(el.dataset.row)===selected.row&&el.dataset.value===selected.value;el.classList.toggle('active',!!on);el.setAttribute('aria-pressed',String(!!on))})}function place(i,row,value){if(row!==i||!data[i][2].includes(value))return;answers[i]=value;selected=null;render()}function render(){root.innerHTML=data.map((q,i)=>`<article class="q"><div class="fillrow"><div class="sentence">(${'कखग'[i]}) ${q[0]}<button class="slot" id="slot${i}" aria-label="उत्तर ${i+1}">${answers[i]}</button>${q[1]}</div><div class="row-options" role="group" aria-label="प्रश्न ${i+1} के विकल्प">${q[2].map(v=>`<button class="chip" draggable="true" data-row="${i}" data-value="${v}" aria-pressed="false">${v}</button>`).join('')}</div></div><span class="feedback" id="f${i}" role="status"></span></article>`).join('');data.forEach((q,i)=>{const el=document.getElementById('slot'+i);el.onclick=()=>{if(selected)place(i,selected.row,selected.value);else{answers[i]='';render()}};el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();el.classList.remove('over');try{const v=JSON.parse(e.dataTransfer.getData('text/plain'));place(i,v.row,v.value)}catch(err){}}});document.querySelectorAll('.chip').forEach(el=>{const row=Number(el.dataset.row),value=el.dataset.value;el.onclick=()=>select(row,value);el.ondragstart=e=>{selected={row,value};e.dataTransfer.setData('text/plain',JSON.stringify({row,value}));e.dataTransfer.effectAllowed='copy'}})}function check(){render();data.forEach((q,i)=>{const f=document.getElementById('f'+i);if(!answers[i]){f.textContent='कृपया सही शब्द रखिए।';return}const ok=answers[i]===q[3];document.getElementById('slot'+i).classList.add(ok?'correct':'wrong');f.textContent=ok?'✓ सही उत्तर!':'फिर से प्रयास कीजिए।'})}function showAnswers(){answers=data.map(q=>q[3]);selected=null;check()}function resetAll(){answers.fill('');selected=null;render()}document.getElementById('submit').onclick=check;document.getElementById('show').onclick=showAnswers;document.getElementById('reset').onclick=resetAll;render();</script></body></html>
