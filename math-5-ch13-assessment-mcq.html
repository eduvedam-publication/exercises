<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose the correct option.</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;background:#b9fbff;color:#172735;font-family:Georgia,'Times New Roman',serif}.sheet{width:min(1050px,100%);padding:18px 22px;background:white;border:3px solid #00a9f4;border-radius:20px}h1{font:700 clamp(22px,3vw,31px) Arial,sans-serif;color:#009ff0;margin:0 0 12px}.bar{height:14px;border-radius:30px;background:#bff5fb;margin-bottom:10px}.row{background:#d9f8ff;border:1.5px solid #00a9ff;border-radius:11px;padding:9px 12px;margin:7px 0;font-size:clamp(16px,1.6vw,19px);width:100%}.prompt{margin:0 0 7px}.row label{display:block;margin-bottom:5px}.row input,.row select{border:1.5px solid #009ff0;border-radius:7px;background:white;padding:7px 10px;font:inherit;min-width:120px;max-width:100%;height:40px}.row input.correct,.choice.correct,.row select.correct{background:#e4ffed;border-color:#20a953}.row input.wrong,.choice.wrong,.row select.wrong{background:#fff0f0;border-color:#e62c38}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{background:#fff;border:1.5px solid #00a9ff;border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer;min-height:40px}.choice.selected{background:#9deaf7;border-color:#008ed0}.choice svg{height:43px;width:48px;vertical-align:middle}.feedback{font:700 13px Arial,sans-serif;margin-left:8px}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px}.actions button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:10px 18px;font-weight:700;cursor:pointer}#score{text-align:center;color:#003bea;font:700 20px Arial,sans-serif;margin:9px 0 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #005ac0;outline-offset:2px}@media(max-width:620px){.sheet{padding:13px 10px}.row{padding:8px}.choice{padding:6px}}</style></head><body><main class="sheet"><h1>Choose the correct option.</h1><div class="bar" aria-hidden="true"></div><section class="row"><p class="prompt">a. Which of the following is a polygon?</p><div class="choices" role="group" aria-label="Choices for question a"><button class="choice" type="button" data-q="0" data-opt="0" aria-pressed="false">(i) <svg viewBox="0 0 48 43" aria-label="square"><path d="M6 3H42V39H6Z" fill="none" stroke="#009ff0" stroke-width="2"/></svg></button><button class="choice" type="button" data-q="0" data-opt="1" aria-pressed="false">(ii) <svg viewBox="0 0 48 43" aria-label="triangle"><path d="M24 2 45 39H3Z" fill="none" stroke="#009ff0" stroke-width="2"/></svg></button><button class="choice" type="button" data-q="0" data-opt="2" aria-pressed="false">(iii) <svg viewBox="0 0 48 43" aria-label="pentagon"><path d="M24 2 46 16 40 40H8L2 16Z" fill="none" stroke="#009ff0" stroke-width="2"/></svg></button><button class="choice" type="button" data-q="0" data-opt="3" aria-pressed="false">(iv) All of these</button></div><span class="feedback" id="f0" aria-live="polite"></span></section><section class="row"><p class="prompt">b. The radius of a circle with diameter 12 cm is _____.</p><div class="choices" role="group" aria-label="Choices for question b"><button class="choice" type="button" data-q="1" data-opt="0" aria-pressed="false">(i) 6 cm</button><button class="choice" type="button" data-q="1" data-opt="1" aria-pressed="false">(ii) 7 cm</button><button class="choice" type="button" data-q="1" data-opt="2" aria-pressed="false">(iii) 12 cm</button><button class="choice" type="button" data-q="1" data-opt="3" aria-pressed="false">(iv) 10 cm</button></div><span class="feedback" id="f1" aria-live="polite"></span></section><section class="row"><p class="prompt">c. Supplement of angle 108° is _____.</p><div class="choices" role="group" aria-label="Choices for question c"><button class="choice" type="button" data-q="2" data-opt="0" aria-pressed="false">(i) 8°</button><button class="choice" type="button" data-q="2" data-opt="1" aria-pressed="false">(ii) 73°</button><button class="choice" type="button" data-q="2" data-opt="2" aria-pressed="false">(iii) 72°</button><button class="choice" type="button" data-q="2" data-opt="3" aria-pressed="false">(iv) 74°</button></div><span class="feedback" id="f2" aria-live="polite"></span></section><section class="row"><p class="prompt">d. A triangle with all sides equal is called a _____ triangle.</p><div class="choices" role="group" aria-label="Choices for question d"><button class="choice" type="button" data-q="3" data-opt="0" aria-pressed="false">(i) Scalene</button><button class="choice" type="button" data-q="3" data-opt="1" aria-pressed="false">(ii) Equilateral</button><button class="choice" type="button" data-q="3" data-opt="2" aria-pressed="false">(iii) Isosceles</button><button class="choice" type="button" data-q="3" data-opt="3" aria-pressed="false">(iv) None of these</button></div><span class="feedback" id="f3" aria-live="polite"></span></section><div class="actions"><button id="submit" type="button">Submit</button><button id="show" type="button">Show Answer</button><button id="reset" type="button">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 0</p></main><script>const answer=[3, 0, 2, 1],key='exercise:math-5-ch13-assessment-mcq.html',selected=Array(answer.length).fill(null),buttons=[...document.querySelectorAll('.choice')],score=document.getElementById('score');score.textContent='Marks: 0 / '+answer.length;function paint(){buttons.forEach(b=>{const on=selected[+b.dataset.q]===+b.dataset.opt;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on?'true':'false')})}function save(){try{localStorage.setItem(key,JSON.stringify(selected))}catch(e){}}function clear(){buttons.forEach(b=>b.classList.remove('correct','wrong'));answer.forEach((_,i)=>{const f=document.getElementById('f'+i);f.textContent='';f.className='feedback'});score.textContent='Marks: 0 / '+answer.length}try{const old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old)&&old.length===answer.length)old.forEach((v,i)=>{if(v===null||Number.isInteger(v))selected[i]=v})}catch(e){}paint();buttons.forEach(b=>b.onclick=()=>{selected[+b.dataset.q]=+b.dataset.opt;paint();clear();save()});document.getElementById('submit').onclick=()=>{let marks=0;answer.forEach((a,i)=>{const good=selected[i]===a;marks+=good;const f=document.getElementById('f'+i);f.textContent=good?'✓ Correct':'✗ Wrong';f.className='feedback '+(good?'ok':'no');const b=buttons.find(x=>+x.dataset.q===i&&+x.dataset.opt===selected[i]);if(b)b.classList.add(good?'correct':'wrong')});score.textContent=`Marks: ${marks} / ${answer.length}`;save();const detail={exerciseType:'MCQ',exerciseId:'math-5-ch13-assessment-mcq.html',response:Object.fromEntries(selected.map((v,i)=>['question'+(i+1),v===null?'':String(v)])),marks,total:answer.length};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')};document.getElementById('show').onclick=()=>{answer.forEach((v,i)=>selected[i]=v);paint();clear();save()};document.getElementById('reset').onclick=()=>{selected.fill(null);paint();clear();save()};</script></body></html>
