<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 Chapter 10 – 10(d)</title><style>*{box-sizing:border-box}body{margin:0;background:#cffaff;font-family:Georgia,'Times New Roman',serif;color:#152535}.wrap{max-width:1050px;margin:3vh auto;padding:24px 28px;background:#fff;border:3px solid #00aeea;border-radius:22px}h2{color:#00a9e9;margin:0 0 18px;font-size:25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}.q{background:#ebfaff;border:1px solid #00b6ff;border-radius:11px;padding:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:19px}.q label{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.num{font-weight:bold;color:#008acb}input{width:92px;padding:7px;border:2px solid #ff6549;border-radius:5px;font:inherit;text-align:center;outline:none;background:white}input.good{border-color:#13a45a;background:#e4ffe9}input.bad{border-color:#f23c45;background:#fff0f0;animation:blink .4s 3}@keyframes blink{50%{background:#ff8b8b}}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}button{border:0;border-radius:25px;background:#ff8100;color:white;padding:11px 21px;font-weight:bold;cursor:pointer;font-size:15px}button:hover{background:#e36d00}@media(max-width:680px){.wrap{margin:8px;padding:18px 12px}.grid{grid-template-columns:1fr}.q{font-size:17px}h2{font-size:22px}}</style></head><body><main class="wrap"><h2>Fill in the blanks:</h2><div class="grid" id="questions"></div><div class="buttons"><button id="check">Check Answers</button><button id="show">Show Answer</button><button id="reset">Reset</button></div></main><script>
const items=[['4 days =','hours','96'],['24 hours =','minutes','1440'],['16 hours 30 minutes =','minutes','990'],['16 minutes =','seconds','960'],['8 minutes 30 seconds =','seconds','510']];const key='math-4-ch10-10d-fill-blanks-v1';const area=document.getElementById('questions');let saved=[];try{saved=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){};items.forEach((q,i)=>{let row=document.createElement('div');row.className='q';let label=document.createElement('label');let number=document.createElement('span');number.className='num';number.textContent=(i+1)+'.';let before=document.createElement('span');before.textContent=q[0];let field=document.createElement('input');field.type='text';field.inputMode='numeric';field.autocomplete='off';field.setAttribute('aria-label','Answer '+(i+1));field.value=saved[i]||'';field.addEventListener('input',()=>{field.classList.remove('good','bad');store()});let after=document.createElement('span');after.textContent=q[1];label.append(number,before,field,after);row.append(label);area.append(row)});function inputs(){return [...document.querySelectorAll('input')]}function store(){localStorage.setItem(key,JSON.stringify(inputs().map(x=>x.value)))}document.getElementById('check').onclick=()=>{inputs().forEach((x,i)=>{x.classList.remove('good','bad');void x.offsetWidth;x.classList.add(x.value.trim()===items[i][2]?'good':'bad')});store()};document.getElementById('show').onclick=()=>{inputs().forEach((x,i)=>{x.value=items[i][2];x.classList.remove('bad');x.classList.add('good')});store()};document.getElementById('reset').onclick=()=>{inputs().forEach(x=>{x.value='';x.classList.remove('good','bad')});store()};
</script></body></html>
