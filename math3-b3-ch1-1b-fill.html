<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif}.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{color:#00a5dc;font-size:25px;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 32px}.q{display:flex;align-items:center;gap:7px;font:20px Georgia,"Times New Roman",serif;white-space:nowrap}.q select{width:58px;height:40px;border:2px solid #ff3b30;background:#fff;font-size:19px;text-align:center}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}.actions button{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){body{padding:0}.ex{padding:15px;border-radius:0}.grid{grid-template-columns:1fr}}
</style></head><body><main class="ex"><h1>Fill the blanks using symbols &gt;, &lt; or = for comparison.</h1><div class="grid">
<div class="q"><span>a.</span><span>8658</span><select id="a0"><option></option><option>&gt;</option><option>&lt;</option><option>=</option></select><span>9865</span></div>
<div class="q"><span>b.</span><span>235</span><select id="a1"><option></option><option>&gt;</option><option>&lt;</option><option>=</option></select><span>6523</span></div>
<div class="q"><span>c.</span><span>221</span><select id="a2"><option></option><option>&gt;</option><option>&lt;</option><option>=</option></select><span>1043</span></div>
<div class="q"><span>d.</span><span>6524</span><select id="a3"><option></option><option>&gt;</option><option>&lt;</option><option>=</option></select><span>5642</span></div>
<div class="q"><span>e.</span><span>453</span><select id="a4"><option></option><option>&gt;</option><option>&lt;</option><option>=</option></select><span>4532</span></div>
<div class="q"><span>f.</span><span>5342</span><select id="a5"><option></option><option>&gt;</option><option>&lt;</option><option>=</option></select><span>2451</span></div>

</div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 8</div></main>
<script>
const ans=["<","<","<",">","<",">",">","<"];
function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=e.value===a;e.className=ok?"ok":"bad";if(ok)s++});score.textContent=`Score: ${s} / 8`}
function resetAll(){document.querySelectorAll("select").forEach(e=>{e.value="";e.className=""});score.textContent="Score: 0 / 8"}
</script></body></html>
