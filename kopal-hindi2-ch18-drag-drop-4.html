<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-hindi2-ch18-drag-drop-4</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);font-family:Arial,"Nirmala UI",sans-serif;color:#333;display:flex;align-items:center;justify-content:center;padding:18px}.quiz-box{width:min(100%,950px);background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:28px;box-shadow:0 12px 35px #0002}h1{font-size:27px;color:#00a6d6;margin:0 0 22px}.question-box{background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:17px 20px;margin-bottom:14px;font-size:21px;line-height:1.8}.options{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}button{font:inherit;cursor:pointer}.option,.word,.blank{border:2px solid #ff4fa0;border-radius:12px;background:white;padding:8px 18px;font-size:20px;color:#333}.selected{background:#fff0f7;outline:3px solid #ff4fa0}.correct{background:#d4f8d4!important;border-color:#2e7d32!important;color:#1b5e20}.wrong{background:#ffd9dd!important;border-color:#c62828!important;color:#b71c1c}.actions{text-align:center;margin-top:20px}.actions button{border:0;border-radius:32px;padding:12px 28px;margin:6px;font-size:18px;font-weight:bold;color:white;background:linear-gradient(135deg,#ff9800,#ff6f00)}#result{text-align:center;margin:18px 0 0;font-size:24px;font-weight:bold;color:#0047ab}.help-box{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;background:linear-gradient(135deg,#fff,#d8f36b,#fff);padding:15px;border-radius:16px;margin-bottom:20px;min-height:75px}.word{touch-action:none;user-select:none}.blank{min-width:150px;min-height:48px;border-style:dashed;margin:4px;vertical-align:middle;color:#d81b60}.hint{font-size:16px;margin:0 0 18px}.feedback{font-size:16px;margin-left:10px}button:focus-visible{outline:3px solid #0047ab;outline-offset:3px}.dragging{opacity:.55}.hover{outline:3px solid #00b8f0}@media(max-width:650px){body{padding:8px;align-items:flex-start}.quiz-box{padding:16px 12px;border-radius:20px}h1{font-size:22px}.question-box{padding:13px;font-size:18px}.option,.word,.blank{font-size:18px}.actions button{width:100%;margin:6px 0}}</style></head><body><main class="quiz-box"><h1>उचित वर्णों द्वारा शब्द पूर्ण कीजिए–</h1><p class="hint">शब्द खींचकर रिक्त स्थान में रखें या शब्द चुनकर रिक्त स्थान पर टैप करें।</p><div class="help-box" id="bank"></div><div id="quiz"></div><div class="actions"><button onclick="check()">उत्तर जाँचें</button><button onclick="reset()">फिर से करें</button></div><div id="result"></div></main><script>
const rows=[["ज__पनाह", "हाँ"], ["होशि__र", "या"], ["दू__र", "स"], ["प__क्षा", "री"], ["बाजा__", "र"], ["नौ__खा", "ल"]],words=["हाँ", "या", "स", "री", "र", "ल"],KEY="kopal-hindi2-ch18-drag-drop-4",letters=['क','ख','ग','घ','ङ','च'];let slots=JSON.parse(localStorage.getItem(KEY)||JSON.stringify(Array(rows.length).fill(''))),chosen='';const bank=document.querySelector('#bank'),quiz=document.querySelector('#quiz'),result=document.querySelector('#result');
function save(){localStorage.setItem(KEY,JSON.stringify(slots))}function put(i,w){slots[i]=w;chosen='';save();render()}
function blank(i){return `<button class="blank" data-i="${i}" ondragover="event.preventDefault()" ondrop="event.preventDefault();put(${i},event.dataTransfer.getData('text/plain'))" onclick="if(chosen)put(${i},chosen)">${slots[i]||'यहाँ रखें'}</button>`}
function render(){bank.innerHTML=words.map(w=>`<button class="word ${chosen===w?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain',this.textContent)" onclick="chosen=this.textContent;render()">${w}</button>`).join('');quiz.innerHTML=rows.map((r,i)=>`<div class="question-box"><b>(${letters[i]})</b> ${r[0].replace('____',blank(i))}</div>`).join('');result.textContent=`अंक: 0 / ${rows.length}`}
function check(){let n=0;quiz.querySelectorAll('.blank').forEach((b,i)=>{let ok=slots[i]===rows[i][1];b.classList.remove('correct','wrong');b.classList.add(ok?'correct':'wrong');if(ok)n++});result.textContent=`अंक: ${n} / ${rows.length}`;let response={};slots.forEach((v,i)=>response['question'+(i+1)]=v);parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:{exerciseType:'DRAG_DROP',response}},'*')}
function reset(){slots=Array(rows.length).fill('');chosen='';save();render()}render();</script></body></html>
