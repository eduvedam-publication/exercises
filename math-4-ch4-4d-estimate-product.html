<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 Chapter 4 Exercise 4(d)</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,sans-serif}.exercise{max-width:970px;margin:20px auto;background:white;border:3px solid #00a8da;border-radius:24px;padding:22px 27px}h1{font:700 23px Georgia,serif;color:#00a8dc;margin:0 0 15px}.section{margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 16px}.question{display:flex;align-items:center;gap:7px;font:19px Georgia,serif;white-space:nowrap}.question label{flex-shrink:0}.answer{width:125px;min-width:0;height:37px;border:2px solid #ff5360;background:#fff;text-align:center;font:18px Arial;outline:none}.answer.ok{background:#dff8e4;border-color:#1eae56}.answer.bad{background:#ffe2e2;border-color:#e22;animation:blink .38s 3}@keyframes blink{50%{background:#ff9b9b}}.actions{display:flex;justify-content:center;gap:13px;margin-top:28px}button{background:#ff8500;color:white;border:0;border-radius:23px;padding:11px 21px;font-weight:700;cursor:pointer}#score{text-align:center;color:#0050b9;font-size:21px;font-weight:bold;margin-top:14px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.exercise{margin:8px;padding:15px}.grid{grid-template-columns:1fr}h1{font-size:21px}.question{font-size:18px}}</style></head><body><main class="exercise"><section class="section"><h1>Estimate the following products by rounding to the nearest 100.</h1><div class="grid"><div class="question"><label for="a0">a. &nbsp;326 × 425</label><input id="a0" class="answer" inputmode="numeric" autocomplete="off" aria-label="Answer a"></div><div class="question"><label for="a1">b. &nbsp;567 × 122</label><input id="a1" class="answer" inputmode="numeric" autocomplete="off" aria-label="Answer b"></div><div class="question"><label for="a2">c. &nbsp;235 × 236</label><input id="a2" class="answer" inputmode="numeric" autocomplete="off" aria-label="Answer c"></div><div class="question"><label for="a3">d. &nbsp;435 × 925</label><input id="a3" class="answer" inputmode="numeric" autocomplete="off" aria-label="Answer d"></div></div></section><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 4</div></main><script>const key='math-4-ch4-4d-estimate-product.html-v1',answers=[120000, 60000, 40000, 360000];const fields=answers.map((_,i)=>document.getElementById('a'+i)),score=document.getElementById('score');function save(){try{localStorage.setItem(key,JSON.stringify({values:fields.map(f=>f.value),score:score.textContent}))}catch(e){}}function checkAnswers(){let n=0;fields.forEach((f,i)=>{const ok=f.value.trim().replace(/,/g,'')===String(answers[i]);f.classList.toggle('ok',ok);f.classList.toggle('bad',!ok);if(ok)n++});score.textContent=`Score: ${n} / ${answers.length}`;save()}function resetExercise(){fields.forEach(f=>{f.value='';f.classList.remove('ok','bad')});score.textContent=`Score: 0 / ${answers.length}`;save()}fields.forEach(f=>f.addEventListener('input',()=>{f.classList.remove('ok','bad');save()}));try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved){fields.forEach((f,i)=>f.value=saved.values?.[i]||'');score.textContent=saved.score||score.textContent}}catch(e){}</script></body></html>
