<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greatest to Smallest</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Georgia,"Times New Roman",serif;color:#222}
.exercise{max-width:1000px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:32px}
h1{margin:0 0 24px;color:#00a5dc;font:700 25px Arial,sans-serif}
.stage{max-width:660px;margin:0 auto;position:relative;padding-top:4px}
.labels{display:flex;justify-content:space-between;padding:0 14px;margin-bottom:-1px;font-size:20px}
.top{display:flex;align-items:center;justify-content:center;gap:20px;font-size:20px;margin-bottom:8px}
.bottom{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:20px}
.given{font-size:20px}
.circle{width:58px;height:58px;border-radius:50%;border:2px solid #8588c7;background:#dcdaf2;display:flex;align-items:center;justify-content:center;font-size:20px}
.first{background:#b9d3f2;border-color:#4f77bb}
.c2{background:#dddaf3}.c3{background:#ffe0b7;border-color:#ff9d38}.c4{background:#d8f2f7;border-color:#08a9dc}.c5{background:#ffd9df;border-color:#ff697a}.c6{background:#bcd8f2;border-color:#4f77bb}
.circle input{width:46px;border:0;border-bottom:2px solid #ff3b30;background:transparent;text-align:center;color:#111;font-size:17px;outline:none;padding:2px}
.circle.ok{background:#dcf8df!important;border-color:#009b8e!important}
.circle.bad{background:#ffe1e1!important;border-color:#e43d30!important}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font:700 15px Arial;cursor:pointer}
#result{text-align:center;font:700 22px Arial;color:#064bb4;margin-top:18px}
@media(max-width:650px){
 .exercise{margin:0;border-radius:0;padding:16px}h1{font-size:21px}
 .top{gap:10px}.circle{width:52px;height:52px}.circle input{width:40px;font-size:15px}
 .stage{max-width:100%}.labels{font-size:18px}
}
</style>
</head>
<body>
<main class="exercise">
<h1>2. Write the following numbers in the circles, from the greatest to the smallest.</h1>

<div class="stage">
 <div class="labels"><span>Greatest</span><span>Smallest</span></div>

 <div class="top">
   <div class="circle first">467</div>
   <span class="given">186</span>
   <span class="given">245</span>
   <span class="given">209</span>
   <span class="given">196</span>
   <div class="circle"><input id="a5"></div>
 </div>

 <div class="bottom">
   <div class="circle c2"><input id="a0"></div>
   <span class="given">298</span>
   <span class="given">123</span>
   <span class="given">467</span>
   <div class="circle c6"><input id="a4"></div>
   <div style="flex-basis:100%;height:0"></div>
   <div class="circle c3"><input id="a1"></div>
   <div class="circle c4"><input id="a2"></div>
   <div class="circle c5"><input id="a3"></div>
 </div>
</div>

<div class="actions">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetExercise()">Reset</button>
</div>
<div id="result">Score: 0 / 6</div>
</main>

<script>
// 467 is already filled in the first circle, exactly as in the source image.
const A=[298,245,209,196,186,123];
function checkAnswers(){
 let score=0;
 A.forEach((answer,i)=>{
   const input=document.getElementById("a"+i);
   const circle=input.parentElement;
   const correct=input.value.trim()===String(answer);
   circle.classList.remove("ok","bad");
   circle.classList.add(correct?"ok":"bad");
   if(correct) score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 6`;
}
function resetExercise(){
 document.querySelectorAll("input").forEach(e=>e.value="");
 document.querySelectorAll(".circle").forEach(e=>e.classList.remove("ok","bad"));
 document.getElementById("result").textContent="Score: 0 / 6";
}
</script>
</body>
</html>
