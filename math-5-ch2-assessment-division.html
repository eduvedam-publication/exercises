<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find the LCM and HCF of the following using division method.</title><style>*{box-sizing:border-box}body{margin:0;background:#baf9fb;font-family:Georgia,"Times New Roman",serif;color:#162a36}.sheet{max-width:1020px;margin:20px auto;padding:24px;background:#fff;border:3px solid #00aaff;border-radius:20px}h1{font-size:clamp(22px,2.7vw,30px);color:#00a8ef;margin:0 0 18px}.q{background:#def8fc;border:1.5px solid #00aaff;border-radius:12px;padding:13px 15px;margin:10px 0;font-size:19px}.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid #37c5ff;border-radius:8px;padding:9px 13px;background:white;cursor:pointer;font-size:18px;min-height:42px}.opt:has(input:checked){background:#a8ebff;border-color:#00aaff}.opt input{accent-color:#00aaff}.answer{display:inline-block;border:2px dashed #ff7878;background:#fff;border-radius:7px;padding:8px;min-width:120px;font-size:18px;max-width:100%}.answer:focus{outline:2px solid #00aaff}.correct{border-color:#20a55c!important;background:#e2ffe8!important}.wrong{border-color:#e33434!important;background:#ffe5e5!important}.controls{text-align:center;margin:24px auto 5px}.controls button{border:0;border-radius:24px;background:#ff7400;color:white;font-weight:bold;padding:12px 17px;margin:3px;cursor:pointer}.controls button:hover{background:#e56500}#marks{font:700 22px Arial;color:#003ddd;margin-top:9px}.pair{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}.pair label{display:inline-flex;align-items:center;gap:7px}.pair input{width:145px}.hint{color:#586975;font-size:14px;margin-top:7px}@media(max-width:600px){.sheet{margin:5px;padding:14px}.q{font-size:17px}.opt{font-size:16px}.answer{min-width:95px;width:135px}}</style></head><body><main class="sheet"><h1>Find the LCM and HCF of the following using division method.</h1><section class="q" id="q0"><b>a.</b> 48 and 144<div class="pair"><label>LCM = <input class="answer" data-i="0" inputmode="numeric" aria-label="LCM a"></label><label>HCF = <input class="answer" data-i="0" inputmode="numeric" aria-label="HCF a"></label></div></section><section class="q" id="q1"><b>b.</b> 42, 70 and 112<div class="pair"><label>LCM = <input class="answer" data-i="1" inputmode="numeric" aria-label="LCM b"></label><label>HCF = <input class="answer" data-i="1" inputmode="numeric" aria-label="HCF b"></label></div></section><section class="q" id="q2"><b>c.</b> 144, 180 and 192<div class="pair"><label>LCM = <input class="answer" data-i="2" inputmode="numeric" aria-label="LCM c"></label><label>HCF = <input class="answer" data-i="2" inputmode="numeric" aria-label="HCF c"></label></div></section><section class="q" id="q3"><b>d.</b> 270, 945 and 2175<div class="pair"><label>LCM = <input class="answer" data-i="3" inputmode="numeric" aria-label="LCM d"></label><label>HCF = <input class="answer" data-i="3" inputmode="numeric" aria-label="HCF d"></label></div></section><div class="controls"><button id="submit" type="button">Submit</button><button id="show" type="button">Show Answer</button><button id="reset" type="button">Reset</button><div id="marks">Marks: 0 / 4</div></div></main><script>const DATA=[["48 and 144", "144", "48"], ["42, 70 and 112", "1680", "14"], ["144, 180 and 192", "2880", "12"], ["270, 945 and 2175", "274050", "15"]],MODE="pair",KEY='exercise:'+location.pathname;let submitted=false;function $$(s){return [...document.querySelectorAll(s)]}function normalize(s){return String(s??'').trim().toLowerCase().replace(/[–—−]/g,'-').replace(/\s+/g,'').replace(/,/g,'')}function getValues(){return DATA.map((_,i)=>MODE==='mcq'?(document.querySelector('input[name="q'+i+'"]:checked')?.value??''):MODE==='pair'?[$$('input[data-i="'+i+'"]')[0]?.value??'',$$('input[data-i="'+i+'"]')[1]?.value??'']:(document.querySelector('input[data-i="'+i+'"]')?.value??''))}function save(){try{localStorage.setItem(KEY,JSON.stringify(getValues()))}catch(e){}}function clearMarks(){ $$('.q,.opt,.answer').forEach(el=>el.classList.remove('correct','wrong'));document.getElementById('marks').textContent='Marks: 0 / '+DATA.length;submitted=false}function restore(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(!Array.isArray(v))return;v.forEach((x,i)=>{if(MODE==='mcq'){const r=$$('input[name="q'+i+'"]');r.forEach(el=>el.checked=el.value===x)}else if(MODE==='pair'){$$('input[data-i="'+i+'"]').forEach((el,j)=>el.value=x?.[j]??'')}else{const el=document.querySelector('input[data-i="'+i+'"]');if(el)el.value=x??''}})}catch(e){}}function check(){let score=0;DATA.forEach((d,i)=>{const box=document.getElementById('q'+i);let ok=false;if(MODE==='mcq'){const sel=box.querySelector('input:checked');ok=!!sel&&sel.value===d[2];if(sel)sel.closest('.opt').classList.add(ok?'correct':'wrong')}else if(MODE==='pair'){const a=box.querySelectorAll('.answer');ok=normalize(a[0].value)===normalize(d[1])&&normalize(a[1].value)===normalize(d[2]);a.forEach((el,j)=>el.classList.add(normalize(el.value)===normalize(d[j+1])?'correct':'wrong'))}else{const el=box.querySelector('.answer');ok=normalize(el.value)===normalize(d[1]);el.classList.add(ok?'correct':'wrong')}if(ok)score++});document.getElementById('marks').textContent='Marks: '+score+' / '+DATA.length;submitted=true;save();try{window.parent?.postMessage({exerciseType:MODE==='mcq'?'OPTION':'FILL_BLANK',response:{answers:getValues(),score,total:DATA.length}},'*')}catch(e){}}function showAnswer(){DATA.forEach((d,i)=>{const box=document.getElementById('q'+i);if(MODE==='mcq')box.querySelectorAll('input').forEach(el=>el.checked=el.value===d[2]);else if(MODE==='pair')box.querySelectorAll('.answer').forEach((el,j)=>el.value=d[j+1]);else box.querySelector('.answer').value=d[1]});clearMarks();save()}function reset(){DATA.forEach((_,i)=>{const box=document.getElementById('q'+i);box.querySelectorAll('input').forEach(el=>{if(el.type==='radio')el.checked=false;else el.value=''})});clearMarks();save()}document.getElementById('submit').addEventListener('click',check);document.getElementById('show').addEventListener('click',showAnswer);document.getElementById('reset').addEventListener('click',reset);document.querySelector('.sheet').addEventListener('input',()=>{if(submitted)clearMarks();save()});document.querySelector('.sheet').addEventListener('change',()=>{if(submitted)clearMarks();save()});restore();</script></body></html>
