<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही (✓) या गलत (✗) का चिह्न लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#c9faff;font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;color:#222}.wrap{max-width:1030px;margin:3vh auto;background:white;border:3px solid #00aeeb;border-radius:22px;padding:24px 28px}h2{color:#00a6e9;margin:0 0 17px;font-size:25px}.q{background:#e9faff;border:1.5px solid #04b5fa;border-radius:12px;padding:13px;margin:9px 0;font-size:18px}.choices{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}.choice{border:1px solid #59c9f9;background:white;border-radius:8px;padding:9px 14px;cursor:pointer;flex:1;min-width:170px}.choice.sel{background:#c8f6e9;border:2px solid #00a6ed}.choice.correct,.slot.correct{background:#d4f7d7}.choice.wrong,.slot.wrong{background:#ffdbdb}.controls{text-align:center;margin-top:20px}button{background:#ff8000;color:white;border:0;border-radius:24px;padding:11px 20px;font-weight:bold;cursor:pointer;margin:3px}#marks{text-align:center;color:#045ad3;font-weight:bold;font-size:20px;margin:12px}.bank{display:flex;flex-wrap:wrap;gap:9px;background:#dcf8ff;padding:15px;border-radius:12px}.chip{background:white;border:1px solid #08b6ef;border-radius:8px;padding:9px 15px;cursor:grab}.chip.active{outline:3px solid orange}.slot{display:inline-flex;align-items:center;justify-content:center;min-width:125px;min-height:39px;border:2px dashed #f76b4c;border-radius:8px;background:white;cursor:pointer;padding:5px;margin:2px}.tf{display:flex;gap:10px}.tf .choice{min-width:55px;flex:0;text-align:center} @media(max-width:600px){.wrap{margin:5px;padding:14px}.q{font-size:16px}.choice{min-width:115px}h2{font-size:21px}}</style></head><body><main class="wrap"><h2>सही (✓) या गलत (✗) का चिह्न लगाइए–</h2><section class="q" data-q="q0"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>(क) विलोम का अर्थ है समान अर्थ।</span><div class="tf"><div class="choice" data-v="✓" onclick="choose('q0','✓')">✓</div><div class="choice" data-v="✗" onclick="choose('q0','✗')">✗</div></div></div></section><section class="q" data-q="q1"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>(ख) विलोम शब्दों से विपरीत अर्थ का बोध होता है।</span><div class="tf"><div class="choice" data-v="✓" onclick="choose('q1','✓')">✓</div><div class="choice" data-v="✗" onclick="choose('q1','✗')">✗</div></div></div></section><section class="q" data-q="q2"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>(ग) क्रिया शब्द का विलोम शब्द संज्ञा हो सकता है।</span><div class="tf"><div class="choice" data-v="✓" onclick="choose('q2','✓')">✓</div><div class="choice" data-v="✗" onclick="choose('q2','✗')">✗</div></div></div></section><section class="q" data-q="q3"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>(घ) शब्द में ‘अ’ और ‘अन’ लगाकर विलोम शब्द बनाए जा सकते हैं।</span><div class="tf"><div class="choice" data-v="✓" onclick="choose('q3','✓')">✓</div><div class="choice" data-v="✗" onclick="choose('q3','✗')">✗</div></div></div></section><div class="controls"><button onclick="check()">Submit</button><button onclick="show()">Show Answer</button><button onclick="reset()">Reset</button></div><div id="marks"></div></main><script>const answers={"q0": "✗", "q1": "✓", "q2": "✗", "q3": "✓"};const KEY='exercise-'+location.pathname.split('/').pop();let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function render(){document.querySelectorAll('[data-q]').forEach(el=>{let id=el.dataset.q;el.querySelectorAll('[data-v]').forEach(b=>{b.classList.toggle('sel',state[id]===b.dataset.v);b.classList.remove('correct','wrong')});});document.querySelectorAll('.slot').forEach(el=>{el.textContent=state[el.dataset.q]||'________';el.classList.remove('correct','wrong')});document.querySelectorAll('.chip').forEach(el=>el.style.opacity=Object.values(state).includes(el.dataset.v)?'.45':'1');document.getElementById('marks').textContent='Marks: 0 / '+Object.keys(answers).length}function choose(q,v){state[q]=v;save();render()}let active=null;function chip(v){active=v;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.v===v))}function drop(q){if(active){for(let k in state)if(state[k]===active)delete state[k];state[q]=active;active=null;save();render()}else if(state[q]){delete state[q];save();render()}}function check(){let n=0;for(let [q,v] of Object.entries(answers)){let ok=state[q]===v;if(ok)n++;let el=document.querySelector('[data-q="'+q+'"]');if(el){let item=el.classList.contains('slot')?el:el.querySelector('[data-v="'+state[q]+'"]');if(item)item.classList.add(ok?'correct':'wrong')}}document.getElementById('marks').textContent='Marks: '+n+' / '+Object.keys(answers).length}function show(){state={...answers};save();render();check()}function reset(){state={};save();render()}window.addEventListener('DOMContentLoaded',render);</script></body></html>
