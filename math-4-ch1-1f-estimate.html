<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 - Chapter 1 - Exercise 1(f)</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8faff;font-family:Arial,sans-serif;color:#18283a}.exercise{width:min(960px,calc(100% - 24px));margin:20px auto;background:white;border:3px solid #04a8d9;border-radius:22px;padding:22px 26px}h1{font-size:23px;color:#00a7dc;margin:0 0 18px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1.5px solid #33418d;text-align:center;padding:8px 6px}th{background:#5f8fc6;color:white;font:700 17px Georgia,serif}td{font:18px Georgia,serif}th:first-child{width:12%}th:nth-child(2){width:20%}th:nth-child(3),th:nth-child(4){width:34%}input{width:100%;height:37px;border:2px solid #ff4b55;padding:4px 8px;font:18px Arial,sans-serif;outline:none;background:#fff}input.correct{background:#e4f8e8;border-color:#1aaf5b}input.incorrect{background:#ffe5e7;border-color:#f04450;animation:flash .45s 2}@keyframes flash{50%{background:#ff9ca6}}.actions{display:flex;justify-content:center;gap:12px;margin-top:24px}button{background:#ff8400;color:#fff;border:0;border-radius:24px;padding:11px 20px;font-weight:700;cursor:pointer}button:hover{background:#e87500}#score{text-align:center;color:#0756b8;font-size:20px;font-weight:700;margin:14px 0 2px}@media(max-width:550px){.exercise{padding:14px 10px;margin:10px auto}h1{font-size:20px}th,td{padding:5px 3px;font-size:14px}th{font-size:14px}input{font-size:15px;height:34px;padding:3px}}
</style></head><body><main class="exercise"><h1>Estimate the given values.</h1><div class="table-wrap"><table><thead><tr><th>S. No.</th><th>Number</th><th>Nearest 10</th><th>Nearest 100</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button type="button" id="check">Check Answers</button><button type="button" id="reset">Reset</button></div></main><script>
const items=[['a.','956125','956130','956100'],['b.','14526','14530','14500'],['c.','356','360','400'],['d.','56545','56550','56500'],['e.','125432','125430','125400']];const key='math-4-ch1-1f-estimate-v1';const tbody=document.getElementById('rows');items.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${r[0]}</td><td>${r[1]}</td><td><input aria-label="${r[0]} nearest 10" id="v${i*2}" inputmode="numeric" autocomplete="off"></td><td><input aria-label="${r[0]} nearest 100" id="v${i*2+1}" inputmode="numeric" autocomplete="off"></td>`;tbody.appendChild(tr)});const inputs=[...document.querySelectorAll('input')];function save(){try{localStorage.setItem(key,JSON.stringify({values:inputs.map(x=>x.value),score:document.getElementById('score').textContent}))}catch(e){}}function restore(){try{const d=JSON.parse(localStorage.getItem(key)||'null');if(d){inputs.forEach((x,i)=>x.value=d.values?.[i]||'');if(d.score)document.getElementById('score').textContent=d.score}}catch(e){}}inputs.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('correct','incorrect');save()}));document.getElementById('check').addEventListener('click',()=>{let n=0;inputs.forEach((x,i)=>{const expected=items[Math.floor(i/2)][2+i%2];const ok=x.value.trim().replace(/,/g,'')===expected;x.classList.toggle('correct',ok);x.classList.toggle('incorrect',!ok);if(ok)n++});document.getElementById('score').textContent=`Score: ${n} / 10`;save()});document.getElementById('reset').addEventListener('click',()=>{inputs.forEach(x=>{x.value='';x.classList.remove('correct','incorrect')});document.getElementById('score').textContent='Score: 0 / 10';save()});restore();
</script></body></html>
