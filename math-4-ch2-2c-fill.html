<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 - Chapter 2 - 2c</title><style>*{box-sizing:border-box}body{margin:0;background:#d8f8ff;font-family:Arial,sans-serif;color:#18243c}.exercise{width:min(94vw,940px);margin:20px auto;background:white;border:3px solid #00a7d8;border-radius:23px;padding:22px 26px}h2{font:700 23px Georgia,serif;color:#00a7dc;margin:0 0 18px}.question{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:8px 0;background:#f0fbff;border:1.5px solid #39c4ec;border-radius:10px;font:18px Georgia,serif}.num{width:26px;flex:none}.expression{flex:0 1 auto}.eq{font-weight:bold}.answer{width:165px;max-width:45%;min-width:90px;height:36px;border:2px solid #ff515e;padding:5px 8px;font:17px Arial,sans-serif}.answer.ok{background:#dff9e4;border-color:#21a34b}.answer.bad{background:#ffe4e4;border-color:#e12626;animation:blink .35s 3}@keyframes blink{50%{background:#ffaaaa}}.actions{display:flex;justify-content:center;gap:12px;margin-top:22px}button{border:0;border-radius:20px;background:#ff8500;color:white;padding:10px 22px;font-weight:700;cursor:pointer}#score{text-align:center;font-weight:700;color:#0051b4;font-size:20px;margin-top:12px}@media(max-width:600px){.exercise{padding:15px 10px;margin:8px auto}h2{font-size:20px}.question{gap:5px;padding:9px 6px;font-size:15px}.num{width:18px}.answer{min-width:72px;width:100px;font-size:15px}}.expression{display:inline;flex:none}.question{flex-wrap:wrap;justify-content:flex-start}.answer{width:105px;max-width:none;min-width:75px;vertical-align:middle}.expression .answer{margin:0 3px}.question{line-height:2.15}@media(max-width:600px){.answer{width:85px;min-width:70px}}</style></head><body><main class="exercise"><h2>Using the properties of addition on numbers, fill in the blanks.</h2><div class="question"><span class="num">a.</span><span class="expression">0 + 237000 = <input class="answer" inputmode="numeric" data-i="0" aria-label="Answer a" autocomplete="off"></span></div><div class="question"><span class="num">b.</span><span class="expression">(11524 + 18337) + 21053 = 11524 + (18337 + <input class="answer" inputmode="numeric" data-i="1" aria-label="Answer b" autocomplete="off">)</span></div><div class="question"><span class="num">c.</span><span class="expression"><input class="answer" inputmode="numeric" data-i="2" aria-label="Answer c" autocomplete="off"> + 99999 = 99999</span></div><div class="question"><span class="num">d.</span><span class="expression">43484 + 37280 = 37280 + <input class="answer" inputmode="numeric" data-i="3" aria-label="Answer d" autocomplete="off"></span></div><div class="question"><span class="num">e.</span><span class="expression">100001 + 0 = <input class="answer" inputmode="numeric" data-i="4" aria-label="Answer e" autocomplete="off"></span></div><div class="actions"><button id="check">Check Answers</button><button id="reset">Reset</button></div><div id="score">Score: 0 / 5</div></main><script>const KEY='math-4-ch2-2c-addition-properties-v1',answers=['237000','21053','0','43484','100001'];const inputs=[...document.querySelectorAll('.answer')];function save(){try{localStorage.setItem(KEY,JSON.stringify({values:Object.fromEntries(inputs.map(e=>[e.dataset.i,e.value])),score:document.getElementById('score').textContent}))}catch(e){}}try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');inputs.forEach(e=>e.value=old.values?.[e.dataset.i]||'');if(old.score)document.getElementById('score').textContent=old.score}catch(e){}inputs.forEach(e=>e.addEventListener('input',()=>{e.classList.remove('ok','bad');save()}));document.getElementById('check').onclick=()=>{let score=0;inputs.forEach(e=>{const ok=e.value.replace(/[ ,]/g,'')===answers[Number(e.dataset.i)];e.classList.toggle('ok',ok);e.classList.toggle('bad',!ok);if(ok)score++});document.getElementById('score').textContent=`Score: ${score} / 5`;save();if(window.parent!==window)window.parent.postMessage({exerciseType:'FILL_BLANK',response:Object.fromEntries(inputs.map(e=>[e.dataset.i,e.value]))},'*')};document.getElementById('reset').onclick=()=>{inputs.forEach(e=>{e.value='';e.classList.remove('ok','bad')});document.getElementById('score').textContent='Score: 0 / 5';localStorage.removeItem(KEY)};</script></body></html>
