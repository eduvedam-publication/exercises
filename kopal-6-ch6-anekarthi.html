<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>नीचे दिए गए शब्दों के अनेकार्थी शब्द लिखिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#c5faff;color:#202a31;font-family:"Noto Serif Devanagari",Georgia,serif}.wrap{max-width:1020px;margin:20px auto;background:white;border:3px solid #00aeef;border-radius:21px;padding:24px}h2{margin:0 0 18px;color:#00a7e9;font-size:26px}.q{background:#e6f9ff;border:1.5px solid #00adf1;border-radius:11px;padding:13px;margin:10px 0;font-size:18px}.opts{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}.opt,.chip{font:inherit;background:white;border:1px solid #00adf1;border-radius:8px;padding:8px 12px;cursor:pointer}.opt.sel{background:#bcecff}.good{border:2px solid #15a44d!important;background:#e5ffec!important}.bad{border:2px solid #e43e3e!important;background:#ffe9e9!important}.bank{background:#d6f8ff;padding:12px;border-radius:10px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip.used{opacity:.38}.chip.active{background:#aee8ff;border-color:#008bd2}.slot{display:inline-flex;min-width:135px;min-height:39px;border:2px dashed #ff715e;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;padding:5px 12px;background:white;cursor:pointer;margin:0 4px}.slot.active{background:#fff3c7}.actions{text-align:center;margin-top:25px}button.action{background:#ff7900;border:0;border-radius:24px;color:white;padding:11px 18px;margin:4px;font-weight:bold;cursor:pointer}#marks{text-align:center;color:#004bc7;font-size:21px;font-weight:bold;margin-top:10px}.ans{display:none;color:#087d43;font-size:15px;margin-top:8px}@media(max-width:650px){.wrap{margin:7px;padding:13px}h2{font-size:21px}.q{font-size:16px}.slot{min-width:95px}}</style></head><body><main class="wrap"><h2>नीचे दिए गए शब्दों के अनेकार्थी शब्द लिखिए–</h2><div class="bank" id="bank"><button class="chip" draggable="true" data-word="भाग, बचाव" onclick="choose('भाग, बचाव')" ondragstart="drag(event,'भाग, बचाव')">भाग, बचाव</button><button class="chip" draggable="true" data-word="रंग, भेद" onclick="choose('रंग, भेद')" ondragstart="drag(event,'रंग, भेद')">रंग, भेद</button></div><div class="q" id="q0">(क) वर्ण — <span class="slot" data-i="0" onclick="place(0)" ondragover="event.preventDefault()" ondrop="drop(event,0)"></span><div class="ans">उत्तर: रंग, भेद</div></div><div class="q" id="q1">(ख) पक्ष — <span class="slot" data-i="1" onclick="place(1)" ondragover="event.preventDefault()" ondrop="drop(event,1)"></span><div class="ans">उत्तर: भाग, बचाव</div></div><div class="actions"><button class="action" onclick="submitAnswers()">Submit</button><button class="action" onclick="showAnswers()">Show Answer</button><button class="action" onclick="resetAnswers()">Reset</button></div><div id="marks">Marks: 0 / 2</div></main><script>const answers=["रंग, भेद", "भाग, बचाव"];let values=JSON.parse(localStorage.getItem("kopal-6-ch6-anekarthi")||"{}");let chosen=null;function choose(w){chosen=w;document.querySelectorAll(".chip").forEach(e=>e.classList.toggle("active",e.dataset.word===w))}function drag(e,w){e.dataTransfer.setData("text/plain",w)}function drop(e,i){e.preventDefault();let w=e.dataTransfer.getData("text/plain");if(w)set(i,w)}function place(i){if(chosen)set(i,chosen);else if(values[i])set(i,"")}function set(i,w){Object.keys(values).forEach(k=>{if(values[k]===w&&w)delete values[k]});if(w)values[i]=w;else delete values[i];localStorage.setItem("kopal-6-ch6-anekarthi",JSON.stringify(values));render();document.getElementById("q"+i).classList.remove("good","bad")}function render(){document.querySelectorAll(".slot").forEach(e=>{e.textContent=values[e.dataset.i]||"________"});document.querySelectorAll(".chip").forEach(e=>e.classList.toggle("used",Object.values(values).includes(e.dataset.word)))}function submitAnswers(){let n=0;answers.forEach((a,i)=>{let e=document.getElementById("q"+i);e.classList.remove("good","bad");if(values[i]){let ok=values[i]===a;n+=ok;e.classList.add(ok?"good":"bad")}});document.getElementById("marks").textContent="Marks: "+n+" / "+answers.length}function showAnswers(){document.querySelectorAll(".ans").forEach(e=>e.style.display="block")}function resetAnswers(){values={};chosen=null;localStorage.removeItem("kopal-6-ch6-anekarthi");document.querySelectorAll(".q").forEach(e=>e.classList.remove("good","bad"));document.querySelectorAll(".ans").forEach(e=>e.style.display="none");document.getElementById("marks").textContent="Marks: 0 / "+answers.length;render()}render();</script></body></html>
