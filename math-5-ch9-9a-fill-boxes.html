<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fill in the boxes.</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;background:#b9fbff;color:#172735;font-family:Georgia,serif}.sheet{width:min(1050px,100%);padding:18px 22px;background:white;border:3px solid #00a9f4;border-radius:20px}h1{font:700 clamp(22px,2.6vw,29px) Arial,sans-serif;color:#009ff0;margin:0 0 16px}.question{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#e0f9ff;border:1.5px solid #00a9ff;border-radius:11px;margin:7px 0;padding:10px 12px;font-size:clamp(16px,1.5vw,19px)}.letter{min-width:25px}.question label{flex:0 1 auto}.question input{min-width:0;width:145px;max-width:100%;padding:7px 9px;border:2px solid #ff685d;border-radius:5px;font:inherit;background:white;color:#173c4d}.question input.correct{border-color:#20a953;background:#e8fff0}.question input.wrong{border-color:#e62c38;background:#fff0f0}.feedback{font:700 14px Arial,sans-serif}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:16px}button{background:#ff7000;color:white;border:0;border-radius:24px;padding:10px 18px;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #006bff;outline-offset:2px}#score{text-align:center;color:#003bea;font:700 20px Arial,sans-serif;margin:11px 0 0}.note{font:14px/1.4 Arial;color:#565d65;margin:9px 0 0}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:center;font-size:17px}th{background:#d9f8ff}td,th{border:1.5px solid #00a9ff;padding:7px}td:first-child{width:40px}td input{width:120px!important}.options{display:flex;flex-wrap:wrap;gap:8px 18px;width:100%;padding-left:34px}.options label{display:flex;gap:6px;align-items:center;cursor:pointer}.options input{width:18px;height:18px;accent-color:#009ff0}.prompt{width:100%}@media(max-width:650px){.sheet{padding:13px}.question{align-items:flex-start}.question input{width:130px}.options{padding-left:0}table{font-size:14px}td,th{padding:5px}td input{width:88px!important}}</style></head><body><main class="sheet"><h1>Fill in the boxes.</h1><div class="tablewrap"><table><thead><tr><th></th><th>Principal</th><th>Interest</th><th>Amount</th></tr></thead><tbody><tr><td>a.</td><td>₹ 1200</td><td>₹ 75</td><td><input id="a0" aria-label="a Amount" inputmode="decimal" autocomplete="off" placeholder="Answer"><span class="feedback" id="f0" aria-live="polite"></span></td></tr><tr><td>b.</td><td>₹ 900</td><td><input id="a1" aria-label="b Interest" inputmode="decimal" autocomplete="off" placeholder="Answer"><span class="feedback" id="f1" aria-live="polite"></span></td><td>₹ 1150</td></tr><tr><td>c.</td><td><input id="a2" aria-label="c Principal" inputmode="decimal" autocomplete="off" placeholder="Answer"><span class="feedback" id="f2" aria-live="polite"></span></td><td>₹ 125</td><td>₹ 1850</td></tr><tr><td>d.</td><td>₹ 2500</td><td><input id="a3" aria-label="d Interest" inputmode="decimal" autocomplete="off" placeholder="Answer"><span class="feedback" id="f3" aria-live="polite"></span></td><td>₹ 2950</td></tr><tr><td>e.</td><td><input id="a4" aria-label="e Principal" inputmode="decimal" autocomplete="off" placeholder="Answer"><span class="feedback" id="f4" aria-live="polite"></span></td><td>₹ 180</td><td>₹ 4520</td></tr><tr><td>f.</td><td>₹ 850</td><td>₹ 125</td><td><input id="a5" aria-label="f Amount" inputmode="decimal" autocomplete="off" placeholder="Answer"><span class="feedback" id="f5" aria-live="polite"></span></td></tr><tr><td>g.</td><td>₹ 1250</td><td><input id="a6" aria-label="g Interest" inputmode="decimal" autocomplete="off" placeholder="Answer"><span class="feedback" id="f6" aria-live="polite"></span></td><td>₹ 1525</td></tr><tr><td>h.</td><td>₹ 9260</td><td>₹ 609</td><td><input id="a7" aria-label="h Amount" inputmode="decimal" autocomplete="off" placeholder="Answer"><span class="feedback" id="f7" aria-live="polite"></span></td></tr><tr><td>i.</td><td><input id="a8" aria-label="i Principal" inputmode="decimal" autocomplete="off" placeholder="Answer"><span class="feedback" id="f8" aria-live="polite"></span></td><td>₹ 600</td><td>₹ 9697</td></tr><tr><td>j.</td><td>₹ 24100</td><td><input id="a9" aria-label="j Interest" inputmode="decimal" autocomplete="off" placeholder="Answer"><span class="feedback" id="f9" aria-live="polite"></span></td><td>₹ 25000</td></tr></tbody></table></div><div class="actions"><button type="button" id="submit">Submit</button><button type="button" id="show">Show Answer</button><button type="button" id="reset">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 10</p></main><script>const answers=[{"answer": "1275"}, {"answer": "250"}, {"answer": "1725"}, {"answer": "450"}, {"answer": "4340"}, {"answer": "975"}, {"answer": "275"}, {"answer": "9869"}, {"answer": "9097"}, {"answer": "900"}],kind="fill",key="exercise:math-5-ch9-9a-fill-boxes.html",score=document.getElementById('score'),fields=[...document.querySelectorAll('input')];function norm(v){return String(v).replace(/[०-९]/g,c=>String('०१२३४५६७८९'.indexOf(c))).replace(/[₹Rs.,\s%]/gi,'').replace(/^0+(?=\d)/,'')}function value(i){if(kind==='mcq')return document.querySelector('input[name="q'+i+'"]:checked')?.value||'';return document.getElementById('a'+i).value}function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.type==='radio'?x.checked:x.value)))}catch(e){}}function clearMarks(){fields.forEach(x=>x.classList.remove('correct','wrong'));answers.forEach((_,i)=>{let f=document.getElementById('f'+i);f.textContent='';f.className='feedback'});score.textContent='Marks: 0 / '+answers.length}try{const v=JSON.parse(localStorage.getItem(key)||'[]');fields.forEach((x,i)=>{if(x.type==='radio')x.checked=v[i]===true;else x.value=typeof v[i]==='string'?v[i]:''})}catch(e){}fields.forEach(x=>x.addEventListener('input',()=>{clearMarks();save()}));document.getElementById('submit').onclick=()=>{let marks=0;answers.forEach((a,i)=>{const good=[a.answer,...(a.accept||[])].some(z=>norm(value(i))===norm(z));marks+=good;const f=document.getElementById('f'+i);f.textContent=good?'✓ Correct':'✗ Wrong';f.className='feedback '+(good?'ok':'no');if(kind!=='mcq'){const x=document.getElementById('a'+i);x.classList.toggle('correct',good);x.classList.toggle('wrong',!good)}});score.textContent=`Marks: ${marks} / ${answers.length}`;save();const detail={exerciseType:kind==='mcq'?'MCQ':'FILL_BLANK',exerciseId:"math-5-ch9-9a-fill-boxes.html",response:Object.fromEntries(answers.map((_,i)=>['question'+(i+1),value(i)])),marks,total:answers.length};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'V"math-5-ch9-9a-fill-boxes.html"YALAYA_EXERCISE_SUBMIT',...detail},'*')};document.getElementById('show').onclick=()=>{answers.forEach((a,i)=>{if(kind==='mcq')document.querySelectorAll('input[name="q'+i+'"]').forEach(x=>x.checked=x.value===String(a.answer));else document.getElementById('a'+i).value=a.answer});clearMarks();save()};document.getElementById('reset').onclick=()=>{fields.forEach(x=>{if(x.type==='radio')x.checked=false;else x.value=''});clearMarks();save()};</script></body></html>
