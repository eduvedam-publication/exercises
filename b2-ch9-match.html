<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match the following with correct pictures.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);padding:18px;color:#333}
.quiz{width:min(100%,1000px);margin:auto;background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:26px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
h1{font-size:27px;color:#00a6d6;margin-bottom:20px}
.card{background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:17px 20px;margin-bottom:14px}
.q{font-size:20px;font-weight:600;line-height:1.5;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.opt{background:#fff;border:2px solid #ff4fa0;border-radius:16px;padding:11px 16px;text-align:left;font-size:16px;cursor:pointer}
.opt.correct{background:#d4f8d4;border-color:#2e7d32;color:#1b5e20;font-weight:700}.opt.wrong{background:#ffd9dd;border-color:#c62828;color:#b71c1c;font-weight:700}
.score{text-align:center;margin:18px 0;font-size:24px;font-weight:700;color:#0047ab}
.actions{text-align:center}.reset,.check{border:0;border-radius:30px;padding:12px 28px;margin:5px;background:linear-gradient(135deg,#ff9800,#ff6f00);color:#fff;font-weight:700;cursor:pointer}
@media(max-width:650px){body{padding:8px}.quiz{padding:15px 11px}h1{font-size:21px}.q{font-size:16px}.opts{grid-template-columns:1fr}.opt{font-size:15px}.reset,.check{width:100%;margin:5px 0}}

.matcharea{position:relative;display:grid;grid-template-columns:220px 220px;justify-content:space-between;gap:100px;padding:5px 45px}
.left,.right{display:flex;flex-direction:column;gap:14px}.label,.pic{height:120px;position:relative;z-index:3}
.label{display:flex;align-items:center;justify-content:center;border:2px solid #ff8b2b;border-radius:14px;background:#ffd5b3;font-size:19px;cursor:pointer}
.pic{border:2px solid #c9efff;border-radius:14px;background:#fff;padding:3px;cursor:pointer}.pic img{width:100%;height:100%;object-fit:contain}.selected{outline:4px solid #00b8f0}.matched{border-color:#2e7d32!important}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
@media(max-width:650px){.matcharea{grid-template-columns:38% 55%;gap:7%;padding:2px}.label,.pic{height:90px}.label{font-size:15px}}

<div class="score" id="score">Score: 0 / 4</div><div class="actions"><button class="reset" onclick="resetGame()">Reset</button></div></div><script>let selected=null,score=0;const area=document.getElementById('area'),svg=document.getElementById('lines');
document.querySelectorAll('.label').forEach(l=>l.onclick=()=>{if(l.dataset.done)return;document.querySelectorAll('.label').forEach(x=>x.classList.remove('selected'));selected=l;l.classList.add('selected')});
document.querySelectorAll('.pic').forEach(p=>p.onclick=()=>{if(!selected||p.dataset.done)return;if(selected.dataset.a===p.dataset.i){selected.dataset.done='1';p.dataset.done='1';selected.classList.remove('selected');selected.classList.add('matched');p.classList.add('matched');draw(selected,p);selected=null;score++;document.getElementById('score').textContent='Score: '+score+' / 4'}else{p.classList.add('wrong');setTimeout(()=>p.classList.remove('wrong'),450)}});
function draw(a,b){let ar=area.getBoundingClientRect(),ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect(),ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.setAttribute('x1',ra.right-ar.left);ln.setAttribute('y1',ra.top-ar.top+ra.height/2);ln.setAttribute('x2',rb.left-ar.left);ln.setAttribute('y2',rb.top-ar.top+rb.height/2);ln.setAttribute('stroke','#2e7d32');ln.setAttribute('stroke-width','3');svg.appendChild(ln)}
function resetGame(){score=0;selected=null;svg.innerHTML='';document.querySelectorAll('.label,.pic').forEach(x=>{delete x.dataset.done;x.classList.remove('selected','matched','wrong')});document.getElementById('score').textContent='Score: 0 / 4'}
</script></body></html>
