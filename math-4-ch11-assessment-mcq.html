<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 Chapter 11 Assessment MCQ</title><style>*{box-sizing:border-box}body{margin:0;background:#d5faff;font-family:Georgia,'Times New Roman',serif;color:#17242b}.sheet{width:min(1040px,calc(100% - 28px));margin:24px auto;background:white;border:3px solid #00afe3;border-radius:22px;padding:24px 28px}h2{margin:0 0 18px;color:#00a9df;font-size:26px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.q{background:#ebfaff;border:1px solid #00b9ee;border-radius:12px;padding:14px;font-size:18px}.qline{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.q input{border:2px solid #ff655a;border-radius:3px;padding:8px;font-size:17px;min-width:0;width:155px;background:white}.q input.good,.opt.good{border-color:#1fa75b!important;background:#e4ffec}.q input.bad,.opt.bad{border-color:#e33!important;background:#ffe5e5;animation:blink .8s 2}@keyframes blink{50%{background:#fff}}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:24px 0 0}button{border:0;border-radius:25px;background:#ff8100;color:white;padding:11px 19px;font-size:15px;font-weight:700;cursor:pointer}.opt{background:#fff;border:1px solid #80d9fa;border-radius:8px;padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}.opt.selected{background:#d9f4ff;border:2px solid #00a9e5}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.mark{border:2px solid #00b4ef;width:23px;height:23px;flex:none;display:inline-flex;align-items:center;justify-content:center}.opt.selected .mark:after{content:'✓';color:#007db3;font-weight:bold}@media(max-width:650px){.sheet{padding:16px 12px}.grid,.options{grid-template-columns:1fr}.q{font-size:16px}h2{font-size:23px}}</style></head><body><main class="sheet"><h2>Choose the correct option.</h2><section id="questions" style="display:grid;gap:12px"></section><div class="controls"><button onclick="check()">Check Answers</button><button onclick="show()">Show Answer</button><button onclick="reset()">Reset</button></div></main><script>const TYPE='assessment-mcq';const key='math4-ch11-'+TYPE;let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(answers));}function clearFeedback(){document.querySelectorAll('.good,.bad').forEach(e=>e.classList.remove('good','bad'));}function norm(s){return String(s).toLowerCase().replace(/₹|rs\.?|rupees?/g,'').replace(/[,\s]/g,'').trim();}const data=[["25 paise multiplied by 4 is ________.", ["100 rupees", "29 rupees", "1 rupee", "25 rupees"], 2], ["How many 100 rupee notes make a sum of ₹1 lakh?", ["10", "100", "500", "1000"], 3], ["What will be the cost of 1 litre of oil, if the cost of 29 litre of oil is ₹3063.85?", ["105.65", "165.05", "110.35", "150.62"], 0], ["Mohit sold a packet of bread for ₹27.93. What is the cost of 25 breads?", ["756.23", "698.25", "123.65", "568.65"], 1]];const letters=['i','ii','iii','iv'];function render(){let root=document.getElementById('questions');root.innerHTML='';data.forEach((q,i)=>{let div=document.createElement('div');div.className='q';div.innerHTML='<div><b>'+String.fromCharCode(97+i)+'.</b> '+q[0]+'</div><div class="options">'+q[1].map((o,j)=>'<div class="opt '+(answers[i]===j?'selected':'')+'" data-i="'+i+'" data-j="'+j+'"><span>'+letters[j]+'. '+o+'</span><span class="mark"></span></div>').join('')+'</div>';root.appendChild(div)});document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{answers[el.dataset.i]=Number(el.dataset.j);save();render()})}function check(){clearFeedback();document.querySelectorAll('.opt.selected').forEach(el=>el.classList.add(answers[el.dataset.i]===data[el.dataset.i][2]?'good':'bad'))}function show(){data.forEach((q,i)=>answers[i]=q[2]);save();render();check()}function reset(){answers={};save();render()}render();</script></body></html>
