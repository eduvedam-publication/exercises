<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#e4f9fd;font-family:Arial,sans-serif}
.exercise{max-width:1120px;min-height:500px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:28px 38px;display:flex;flex-direction:column}
h1{margin:0 0 25px;color:#00a3dc;font-size:25px}.content{flex:1}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;min-width:34px;font:20px Georgia}.frac span:first-child{border-bottom:1.5px solid #222;padding:0 5px 3px}.frac span:last-child{padding-top:3px}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:27px 38px}.eqrow{display:flex;align-items:center;gap:10px;font:20px Georgia}
.finput{width:58px;height:58px;border:2px solid #d83291;border-radius:10px;font-size:16px;text-align:center;padding:3px}
.markgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 38px}.markrow{display:flex;align-items:center;gap:14px;font:20px Georgia}
.mark{width:72px;height:43px;border:2px solid #d83291;border-radius:10px;background:#fff;font-size:24px;cursor:pointer}.mark.sel{background:#fff0f8}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}
.series{display:flex;flex-direction:column;gap:20px}.srow{display:flex;align-items:center;gap:12px;font:20px Georgia;flex-wrap:wrap}.boxfrac{border:2px solid #d83291;border-radius:10px;padding:4px 12px}.sinput{width:70px;height:48px;border:2px solid red;border-radius:7px;font-size:16px;text-align:center}
.controls{margin-top:auto;padding-top:28px;display:flex;justify-content:center;gap:14px}.controls button{border:0;border-radius:24px;background:#ff7d00;color:white;font-weight:bold;padding:12px 22px;cursor:pointer}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:13px}
@media(max-width:800px){.exercise{padding:22px}.eqgrid,.markgrid{grid-template-columns:1fr}.srow{gap:8px}}
</style></head><body>
<main class="exercise"><h1>Put (✓) for equivalent fractions and (✕) for non-equivalent fractions.</h1><section class="content"><div class="markgrid"><div class="markrow"><b>a.</b><span class="frac"><span>3</span><span>4</span></span><button class="mark" data-i="0" onclick="toggle(this)">?</button><span class="frac"><span>6</span><span>8</span></span></div><div class="markrow"><b>b.</b><span class="frac"><span>5</span><span>7</span></span><button class="mark" data-i="1" onclick="toggle(this)">?</button><span class="frac"><span>20</span><span>28</span></span></div><div class="markrow"><b>c.</b><span class="frac"><span>3</span><span>11</span></span><button class="mark" data-i="2" onclick="toggle(this)">?</button><span class="frac"><span>4</span><span>33</span></span></div><div class="markrow"><b>d.</b><span class="frac"><span>2</span><span>5</span></span><button class="mark" data-i="3" onclick="toggle(this)">?</button><span class="frac"><span>4</span><span>45</span></span></div><div class="markrow"><b>e.</b><span class="frac"><span>3</span><span>8</span></span><button class="mark" data-i="4" onclick="toggle(this)">?</button><span class="frac"><span>30</span><span>80</span></span></div><div class="markrow"><b>f.</b><span class="frac"><span>1</span><span>7</span></span><button class="mark" data-i="5" onclick="toggle(this)">?</button><span class="frac"><span>7</span><span>14</span></span></div><div class="markrow"><b>g.</b><span class="frac"><span>2</span><span>11</span></span><button class="mark" data-i="6" onclick="toggle(this)">?</button><span class="frac"><span>6</span><span>22</span></span></div><div class="markrow"><b>h.</b><span class="frac"><span>3</span><span>8</span></span><button class="mark" data-i="7" onclick="toggle(this)">?</button><span class="frac"><span>15</span><span>24</span></span></div></div></section><div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div class="score" id="score">Score: 0 / 8</div></main><script>const A=['✓', '✓', '✕', '✕', '✓', '✕', '✕', '✕'];function toggle(e){e.textContent=e.textContent==='✓'?'✕':'✓';e.classList.add('sel')}
function check(){let s=0;document.querySelectorAll('.mark').forEach((e,i)=>{let g=e.textContent===A[i];e.classList.remove('ok','bad');e.classList.add(g?'ok':'bad');if(g)s++});score.textContent='Score: '+s+' / 8'}
function resetAll(){document.querySelectorAll('.mark').forEach(e=>{e.textContent='?';e.className='mark'});score.textContent='Score: 0 / 8'}</script></body></html>
