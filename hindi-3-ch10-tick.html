<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#dff8ff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:5px solid #08a6d1;border-radius:22px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;color:#ff0072;font-size:clamp(22px,3vw,30px)}.content{flex:1}.question{margin:12px 0;padding:13px 16px;border:2px solid #69dfff;border-radius:16px;background:#f3fbfe;font-size:clamp(16px,2vw,19px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option,.btn{border:2px solid #ff0072;background:#fff;border-radius:10px;padding:8px 13px;font-size:16px;cursor:pointer}.option.selected{background:#ffe7f1}.option.correct,.answer.correct,.order.correct{background:#dff7e4}.option.wrong,.answer.wrong,.order.wrong{background:#ffe2e2}.answer{border:2px solid #ff4c39;border-radius:5px;padding:6px 8px;font-size:17px;min-width:125px;max-width:205px;margin:2px 4px}.orderrow{display:flex;justify-content:space-between;align-items:center;gap:15px}.order{width:58px;border:2px solid #ff0072;border-radius:7px;padding:7px;text-align:center;font-size:17px}.bottom{text-align:center;margin-top:22px}.score{margin-top:9px;color:#087fc2;font-weight:800;font-size:18px}@media(max-width:650px){body{padding:7px}.exercise{padding:15px 11px}.options{flex-direction:column}.option{width:100%;text-align:left}.answer{min-width:100px;max-width:145px}}.tfrow{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:13px 0;padding:15px;border:2px solid #65dcf5;border-radius:14px;background:#f3fbfe;font-size:21px}.tfopts{display:flex;gap:10px}.tf{border:2px solid #ff0072;background:white;border-radius:10px;padding:8px 15px;font-size:18px}.tf.selected{background:#dff7e4}</style><main class=exercise><h1 class=title>सही (✓) या गलत (✕) का चिह्न लगाइए–</h1><div id=c></div><div class=bottom><button class=btn onclick=check()>Submit</button><button class=btn onclick=reset()>Reset</button><div class=score id=sc></div></div></main>
<script>function L(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function S(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){let p={exerciseType:t,response:r};try{parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}}

const K='hindi-3-ch10-tick',D=[["क्रिया वाक्य के प्रारंभ में आती है।", false], ["क्रिया का संबंध काल से होता है।", true], ["क्रिया अपने आप होती हैं।", false], ["क्रिया के बिना वाक्य अधूरा रहता है।", true]];let s=L(K);s.a=s.a||{};s.score=s.score||0;
function draw(){c.innerHTML=D.map((r,i)=>`<div class=tfrow><div><b>${['(क)','(ख)','(ग)','(घ)'][i]}</b> &nbsp;${r[0]}</div><div class=tfopts><button class="tf ${s.a[i]===true?'selected':''}" onclick="pick(${i},true)">✓</button><button class="tf ${s.a[i]===false?'selected':''}" onclick="pick(${i},false)">✕</button></div></div>`).join('');sc.textContent=`Score: ${s.score} / 4`}
function pick(i,v){s.a[i]=v;S(K,s);draw()}function check(){let n=0;D.forEach((r,i)=>{if(s.a[i]===r[1])n++});s.score=n;S(K,s);sc.textContent=`Score: ${n} / 4`;let x={};D.forEach((_,i)=>x['question'+(i+1)]=s.a[i]===undefined?[]:[s.a[i]?'✓':'✕']);send('TICK',x)}function reset(){s={a:{},score:0};S(K,s);draw()}draw()</script>
