<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tick the Correct Statement</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);display:flex;justify-content:center;align-items:center;padding:18px;color:#333}
.quiz-box{width:min(100%,950px);background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.heading{font-size:27px;font-weight:700;color:#00a6d6;margin-bottom:22px}
.statement{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:17px 20px;margin-bottom:14px}
.text{font-size:20px;line-height:1.5;font-weight:500}
.choice{display:flex;gap:10px;flex-shrink:0}
.choice button{width:52px;height:45px;border:2px solid #ff4fa0;border-radius:12px;background:#fff;font-size:22px;font-weight:700;cursor:pointer;transition:.2s}
.choice button:hover{background:#fff0f7;transform:scale(1.04)}
.choice button.correct{background:#d4f8d4;border-color:#2e7d32;color:#1b5e20}
.choice button.wrong{background:#ffd9dd;border-color:#c62828;color:#b71c1c}
.choice button:disabled{cursor:default}
.result{text-align:center;margin:20px 0 14px;font-size:25px;font-weight:700;color:#0047ab}
.buttons{text-align:center}
.reset{border:0;border-radius:32px;padding:12px 30px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9800,#ff6f00);cursor:pointer}
@media(max-width:650px){
body{padding:8px;align-items:flex-start}.quiz-box{padding:16px 12px;border-radius:20px}.heading{font-size:21px}
.statement{padding:13px;gap:10px}.text{font-size:16px}.choice{gap:6px}.choice button{width:44px;height:40px;font-size:19px}
.result{font-size:21px}.reset{width:100%}
}
</style>
</head>
<body>
<div class="quiz-box">
 <div class="heading">Tick (✓) the correct statement.</div>
 <div id="quiz"></div>
 <div class="result" id="result">Score: 0 / 4</div>
 <div class="buttons"><button class="reset" onclick="resetQuiz()">Reset Quiz</button></div>
</div>
<script>
const statements=[
 {text:"1. I should wake up early.",answer:true},
 {text:"2. I should keep myself neat and clean.",answer:true},
 {text:"3. I should leave my homework incomplete.",answer:false},
 {text:"4. I should obey my parents and teachers.",answer:true}
];
let score=0;
function loadQuiz(){
 const quiz=document.getElementById("quiz");quiz.innerHTML="";
 statements.forEach(s=>{
  const row=document.createElement("div");row.className="statement";
  const text=document.createElement("div");text.className="text";text.textContent=s.text;
  const choice=document.createElement("div");choice.className="choice";
  const tick=document.createElement("button");tick.textContent="✓";tick.title="Correct statement";
  const cross=document.createElement("button");cross.textContent="✕";cross.title="Incorrect statement";
  tick.onclick=()=>answer(tick,true,s.answer,choice);
  cross.onclick=()=>answer(cross,false,s.answer,choice);
  choice.append(tick,cross);row.append(text,choice);quiz.appendChild(row);
 });
}
function answer(button,selected,correct,container){
 const buttons=container.querySelectorAll("button");
 buttons.forEach(b=>b.disabled=true);
 if(selected===correct){button.classList.add("correct");score++}
 else{
  button.classList.add("wrong");
  const correctButton=correct?buttons[0]:buttons[1];
  correctButton.classList.add("correct");
 }
 document.getElementById("result").textContent=`Score: ${score} / 4`;
}
function resetQuiz(){score=0;document.getElementById("result").textContent="Score: 0 / 4";loadQuiz()}
loadQuiz();
</script>
</body>
</html>
