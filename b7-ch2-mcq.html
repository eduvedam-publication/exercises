<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eefcff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:2px solid #27bddd;border-radius:18px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;text-align:center;color:#08aeca;font-size:clamp(22px,3vw,31px)}.content{flex:1}.question{margin:13px 0;padding:13px 15px;border-radius:13px;background:#fff6f8;font-size:clamp(16px,2vw,20px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option{border:2px solid #28b9dc;background:#fff;border-radius:10px;padding:9px 13px;font-size:16px;cursor:pointer}.selected{background:#dff8ff!important}.correct{background:#dff7e4!important;border-color:#39a95b!important}.wrong{background:#ffe2e2!important;border-color:#e84b4b!important}.bottom{text-align:center;margin-top:22px}.btn{border:0;border-radius:24px;background:#f7941d;color:#fff;font-weight:800;font-size:17px;padding:11px 25px;margin:5px;cursor:pointer}.score{margin-top:8px;color:#087fc2;font-weight:800;font-size:19px}@media(max-width:650px){body{padding:8px}.exercise{padding:16px 12px}.options{flex-direction:column}.option{width:100%;text-align:left}}</style><main class="exercise"><h1 class="title">Multiple choice questions.</h1><div class="content" id="content"></div><div class="bottom"><button class="btn" onclick="check()">Check Answers</button><button class="btn" onclick="resetEx()">Reset</button><div class="score" id="score">Score: 0 / 5</div></div></main><script>function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function save(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){let p={exerciseType:t,response:r};try{window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}try{window.ReactNativeWebView&&window.ReactNativeWebView.postMessage(JSON.stringify({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p}))}catch(e){}}
const K='b7-ch2-mcq',D=[
["Where did Amma live?",["In a village","On a pavement","In a hostel"],1],
["Which schools' students often spoke kindly to Amma?",["St. Xavier's and Loreto Convent","Delhi Public School and Loreto","St. Mary's and St. Xavier's"],1],
["Where had Amma and her husband come from?",["Uttar Pradesh","West Bengal","Bihar"],2],
["What skill did the boutique owner teach Amma?",["Cooking","Stitching","Driving"],1],
["What did Amma do with some of her saved money?",["Bought a house","Saved it for her last rites","Sent it home"],1]];
let s=load(K);s.a=s.a||{};s.score=s.score||0;
function draw(){content.innerHTML=D.map((q,i)=>`<div class="question"><b>${i+1}.</b> ${q[0]}<div class="options">${q[1].map((o,j)=>`<button class="option ${s.a[i]===j?'selected':''}" onclick="pick(${i},${j})">${['i.','ii.','iii.'][j]}&nbsp;${o}</button>`).join('')}</div></div>`).join('');score.textContent=`Score: ${s.score} / 5`}
function pick(i,j){s.a[i]=j;save(K,s);draw()}function check(){let n=0;document.querySelectorAll('.question').forEach((r,i)=>{r.querySelectorAll('.option').forEach((b,j)=>{b.classList.remove('correct','wrong');if(j===D[i][2])b.classList.add('correct');if(s.a[i]===j&&j!==D[i][2])b.classList.add('wrong')});if(s.a[i]===D[i][2])n++});s.score=n;save(K,s);score.textContent=`Score: ${n} / 5`;send('OPTION',{answers:s.a,score:n,total:5,completed:Object.keys(s.a).length===5})}function resetEx(){s={a:{},score:0};save(K,s);draw()}draw()</script>
