<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 Chapter 14 Exercise 14(a)</title><style>*{box-sizing:border-box}body{margin:0;background:#d4faff;font-family:Georgia,'Times New Roman',serif;color:#172334}.sheet{max-width:1050px;margin:24px auto;background:white;border:3px solid #00ade4;border-radius:21px;padding:25px}h2{color:#00a7dc;margin:0 0 20px;font-size:26px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:center}th{background:#fff6bd;font-size:18px}td,th{border:1.5px solid #ff6e9d;padding:12px 9px}td:first-child,th:first-child{text-align:left}input{font:inherit;border:2px solid #ff5b48;border-radius:3px;padding:7px;width:95px;max-width:100%;background:white;color:#222}input.correct{border-color:#1eae65;background:#eafff0}input.wrong{border-color:#e22;background:#ffe5e5;animation:blink .6s 2}@keyframes blink{50%{background:#fff}}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}button{border:0;background:#ff8000;color:white;padding:11px 20px;border-radius:22px;font-weight:bold;cursor:pointer}button:hover{background:#e96f00}.note{font-size:13px;color:#626e77;margin-top:15px;text-align:center}@media(max-width:600px){.sheet{margin:8px;padding:12px}th,td{padding:8px 5px;font-size:14px}input{width:75px;padding:5px}h2{font-size:21px}}</style></head><body><main class="sheet"><h2>Complete the table given below.</h2><div class="table-wrap"><table><thead><tr><th>Perimeter of Rectangle</th><th>Length</th><th>Breadth</th></tr></thead><tbody><tr><td>94 cm</td><td>32 m</td><td><input aria-label="Rectangle row 1 breadth" data-answer="15" inputmode="decimal"> m</td></tr><tr><td><input aria-label="Rectangle row 2 perimeter" data-answer="148" inputmode="decimal"> cm</td><td>27 cm</td><td>47 cm</td></tr><tr><td>168 m</td><td><input aria-label="Rectangle row 3 length" data-answer="54" inputmode="decimal"> m</td><td>30 m</td></tr><tr><th>Perimeter of a Square</th><th colspan="2">Side</th></tr><tr><td>260 m</td><td colspan="2"><input aria-label="Square row 1 side" data-answer="65" inputmode="decimal"> m</td></tr><tr><td><input aria-label="Square row 2 perimeter" data-answer="128" inputmode="decimal"> cm</td><td colspan="2">32 cm</td></tr></tbody></table></div><div class="actions"><button id="check">Check Answers</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><p class="note" id="note" aria-live="polite"></p></main><script>const key='math-4-ch14-14a-v1',fields=[...document.querySelectorAll('input[data-answer]')];function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}catch(e){}}function clearFeedback(){fields.forEach(x=>x.classList.remove('correct','wrong'));document.getElementById('note').textContent=''}fields.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('correct','wrong');save()}));try{const saved=JSON.parse(localStorage.getItem(key)||'[]');fields.forEach((x,i)=>x.value=saved[i]||'')}catch(e){}document.getElementById('check').onclick=()=>{fields.forEach(x=>{x.classList.remove('correct','wrong');x.classList.add(x.value.trim()===x.dataset.answer?'correct':'wrong')})};document.getElementById('show').onclick=()=>{fields.forEach(x=>{x.value=x.dataset.answer;x.classList.remove('wrong');x.classList.add('correct')});save()};document.getElementById('reset').onclick=()=>{fields.forEach(x=>x.value='');clearFeedback();save()};</script></body></html>
