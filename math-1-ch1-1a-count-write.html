const questions=[{"answer": "Nine"}, {"answer": "One"}, {"answer": "Six"}, {"answer": "Three"}, {"answer": "Eight"}, {"answer": "Four"}],key='exercise:revised-v2:math-1-ch1-1a-count-write.html';const fields=questions.map((_,i)=>document.getElementById('a'+i));
function norm(v){return String(v).trim().toLowerCase().replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c))}
function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}catch(e){}}
function clearFeedback(){fields.forEach((x,i)=>{x.classList.remove('correct','wrong');const f=document.getElementById('f'+i);f.textContent='';f.className='feedback'})}
fields.forEach(x=>x.addEventListener('input',()=>{clearFeedback();save()}));
try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))fields.forEach((x,i)=>{if(typeof a[i]==='string')x.value=a[i]})}catch(e){}
document.getElementById('submit').addEventListener('click',()=>{fields.forEach((x,i)=>{const ok=norm(x.value)===norm(questions[i].answer);x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok);const f=document.getElementById('f'+i);f.textContent='';f.className='feedback '+(ok?'ok':'no')});save();const detail={exerciseType:'FILL_BLANK',exerciseId:'math-1-ch1-1a-count-write.html',response:Object.fromEntries(fields.map((x,i)=>['question'+(i+1),x.value]))};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')});
document.getElementById('show').addEventListener('click',()=>{fields.forEach((x,i)=>x.value=questions[i].answer);clearFeedback();save()});document.getElementById('reset').addEventListener('click',()=>{fields.forEach(x=>x.value='');clearFeedback();save()});
