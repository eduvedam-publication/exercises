<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}
.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}
.ok{background:#dcf8df!important;border-color:#009b8e!important}
.bad{background:#ffe1e1!important;border-color:#e43d30!important}
input{border:2px solid #ff3b30;background:#fff;height:40px;font-size:18px;padding:5px 8px;outline:none}
@media(max-width:700px){body{padding:0}.exercise{border-radius:0;padding:16px}}

.tf{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:12px 15px;margin:12px 0;background:#f5fbfe;border:1px solid #b8eaff;border-radius:14px;font:20px Georgia,serif}
.choices{display:flex;gap:10px}.choices button{border:2px solid #ff1680;border-radius:10px;background:#fff;padding:8px 18px;font-size:16px;cursor:pointer}.choices button.sel{background:#fff0f6}
</style></head><body><main class="exercise"><h1>State true or false.</h1><div class="tf" data-a="T"><span>a. In 32 × 3 = 96, 96 is the product.</span><div class="choices"><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="tf" data-a="F"><span>b. 18 × 8 = 162</span><div class="choices"><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="tf" data-a="T"><span>c. 236 is an even number.</span><div class="choices"><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="tf" data-a="T"><span>d. The product of any number and 0 is zero.</span><div class="choices"><button data-v="T">True</button><button data-v="F">False</button></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div>
<script>
document.querySelectorAll(".tf").forEach(q=>q.querySelectorAll("button").forEach(b=>b.onclick=()=>{q.querySelectorAll("button").forEach(x=>x.className="");b.className="sel";q.dataset.pick=b.dataset.v}));
function check(){let s=0;document.querySelectorAll(".tf").forEach(q=>{let p=q.dataset.pick;q.querySelectorAll("button").forEach(b=>{b.classList.remove("ok","bad");if(b.dataset.v===p)b.classList.add(p===q.dataset.a?"ok":"bad")});if(p===q.dataset.a)s++});score.textContent=`Score: ${s} / 4`}
function resetAll(){document.querySelectorAll(".tf").forEach(q=>{delete q.dataset.pick;q.querySelectorAll("button").forEach(b=>b.className="")});score.textContent="Score: 0 / 4"}
</script></main></body></html>
