<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>निम्नलिखित शब्दों के विलोम शब्द लिखिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#cffaff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#17212b}.wrap{width:min(980px,96vw);margin:18px auto;background:white;border:3px solid #00ade7;border-radius:22px;padding:25px}h2{margin:0 0 18px;color:#00a8e5;font-size:27px}.q{background:#eafaff;border:1.5px solid #00b7f5;border-radius:12px;padding:13px;margin:9px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}.opt{background:white;border:1px solid #8ed9ff;border-radius:8px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}.opt.selected{border:2px solid #00a7f2;background:#d4f5ff}.opt.correct,.drop.correct{border:2px solid #25aa51!important;background:#d6ffe3!important}.opt.wrong,.drop.wrong{border:2px solid #f44336!important;background:#ffe3e3!important}.actions{text-align:center;margin-top:22px}button{background:#ff8000;color:white;border:0;border-radius:25px;padding:12px 20px;margin:4px;font-weight:bold;cursor:pointer}.marks{text-align:center;color:#0051c4;font-size:20px;font-weight:bold;margin-top:8px}.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;background:#dcf8ff;padding:15px;border-radius:12px;margin-bottom:12px}.word{background:white;border:1.5px solid #00aeef;border-radius:8px;padding:9px 16px;font-size:19px;cursor:grab}.word.active{background:#fff0c6;border-color:#f90}.word.used{opacity:.4}.drop{display:inline-flex;min-width:150px;min-height:40px;border:2px dashed #ff714e;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;padding:4px 10px;cursor:pointer;margin:0 4px}.prompt{line-height:2.5}.opt:focus,.word:focus,.drop:focus{outline:3px solid #ffb700}@media(max-width:650px){.wrap{padding:14px}.opts{grid-template-columns:1fr}h2{font-size:23px}.q{font-size:17px}}</style></head><body><main class="wrap"><h2>निम्नलिखित शब्दों के विलोम शब्द लिखिए–</h2><div class="bank" id="bank"></div><section class="q prompt">(क) भला — <span class="drop" id="d0" data-i="0" onclick="place(0)" ondragover="event.preventDefault()" ondrop="dropWord(event,0)"></span></section><section class="q prompt">(ख) उधर — <span class="drop" id="d1" data-i="1" onclick="place(1)" ondragover="event.preventDefault()" ondrop="dropWord(event,1)"></span></section><section class="q prompt">(ग) एक — <span class="drop" id="d2" data-i="2" onclick="place(2)" ondragover="event.preventDefault()" ondrop="dropWord(event,2)"></span></section><section class="q prompt">(घ) महल — <span class="drop" id="d3" data-i="3" onclick="place(3)" ondragover="event.preventDefault()" ondrop="dropWord(event,3)"></span></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswer()">Show Answer</button><button onclick="reset()">Reset</button></div><div id="marks" class="marks">Marks: 0 / 4</div></main><script>const KEY="kopal4ch2_kopal-4-ch2-vilom.html",TOTAL=4;let state=JSON.parse(localStorage.getItem(KEY)||'{}');function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function score(n){document.getElementById('marks').textContent='Marks: '+n+' / '+TOTAL}function reset(){localStorage.removeItem(KEY);location.reload()}const answers=["बुरा", "इधर", "अनेक", "झोपड़ी"],labels=["(क)", "(ख)", "(ग)", "(घ)"];let picked=null;function render(){document.getElementById('bank').innerHTML=answers.map((w,i)=>`<span class="word ${picked===i?'active':''} ${Object.values(state).includes(i)?'used':''}" draggable="true" tabindex="0" ondragstart="event.dataTransfer.setData('text/plain',${i})" onclick="pick(${i})" onkeydown="if(event.key==='Enter')pick(${i})">${w}</span>`).join('');answers.forEach((a,i)=>{let d=document.getElementById('d'+i);d.textContent=state[i]===undefined?'':answers[state[i]];d.className='drop'})}function pick(i){picked=i;render()}function place(i){if(picked===null){delete state[i]}else{for(let k in state)if(state[k]===picked)delete state[k];state[i]=picked;picked=null}persist();render()}function dropWord(e,i){e.preventDefault();picked=Number(e.dataTransfer.getData('text/plain'));place(i)}function check(){render();let n=0;answers.forEach((a,i)=>{let d=document.getElementById('d'+i);if(state[i]!==undefined){let ok=answers[state[i]]===a;if(ok)n++;d.classList.add(ok?'correct':'wrong')}});score(n)}function showAnswer(){answers.forEach((a,i)=>state[i]=i);persist();check()}render();</script></body></html>
