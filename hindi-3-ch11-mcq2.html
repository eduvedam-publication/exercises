<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>हिंदी 3 • पाठ 11 • सही विकल्प पर सही (✓) का चिह्न लगाइए–</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #dff6ff, #fff, #e8f5e9);
      font-family: Arial, "Nirmala UI", sans-serif;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .quiz-box {
      width: min(100%, 950px);
      background: #fff;
      border: 5px solid #00b8f0;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }
    h1 {
      font-size: 26px;
      color: #00a6d6;
      margin: 0 0 22px;
    }
    .question-box {
      background: #f9fcff;
      border: 2px solid #c9efff;
      border-radius: 20px;
      padding: 17px 20px;
      margin-bottom: 16px;
      font-size: 20px;
      line-height: 1.8;
    }
    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }
    button {
      font: inherit;
      cursor: pointer;
    }
    .option {
      border: 2px solid #ff4fa0;
      border-radius: 12px;
      background: white;
      padding: 9px 18px;
      font-size: 19px;
      color: #333;
      transition: all 0.2s ease;
    }
    .selected {
      background: #fff0f7;
      outline: 3px solid #ff4fa0;
    }
    .correct {
      background: #d4f8d4 !important;
      border-color: #2e7d32 !important;
      color: #1b5e20 !important;
    }
    .wrong {
      background: #ffd9dd !important;
      border-color: #c62828 !important;
      color: #b71c1c !important;
    }
    .actions {
      text-align: center;
      margin-top: 22px;
    }
    .actions button {
      border: 0;
      border-radius: 32px;
      padding: 12px 28px;
      margin: 6px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #ff9800, #ff6f00);
      box-shadow: 0 4px 10px rgba(255, 111, 0, 0.3);
      transition: transform 0.15s ease;
    }
    .actions button:hover {
      opacity: 0.95;
    }
    .actions button:active {
      transform: scale(0.97);
    }
    #result {
      text-align: center;
      margin: 18px 0 0;
      font-size: 24px;
      font-weight: bold;
      color: #0047ab;
    }
    .feedback {
      font-size: 17px;
      font-weight: bold;
      margin-top: 8px;
      display: inline-block;
    }
    .feedback.ok {
      color: #2e7d32;
    }
    .feedback.bad {
      color: #c62828;
    }
    button:focus-visible {
      outline: 3px solid #0047ab;
      outline-offset: 3px;
    }
    @media (max-width: 650px) {
      body {
        padding: 8px;
        align-items: flex-start;
      }
      .quiz-box {
        padding: 16px 12px;
        border-radius: 20px;
      }
      h1 {
        font-size: 21px;
      }
      .question-box {
        padding: 13px;
        font-size: 18px;
      }
      .option {
        width: 100%;
        text-align: left;
        font-size: 17px;
      }
      .actions button {
        width: 100%;
        margin: 6px 0;
      }
    }
  </style>
</head>
<body>
  <main class="quiz-box">
    <h1>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h1>
    <div id="quiz"></div>
    <div class="actions">
      <button onclick="check()">उत्तर जाँचें</button>
      <button onclick="reset()">फिर से करें</button>
    </div>
    <div id="result" role="status" aria-live="polite"></div>
  </main>

  <script>
    const data = [
      {
        q: "उलटा अर्थ बताने वाले शब्दों को कहते हैं–",
        opts: ["(अ) समानार्थी", "(ब) पर्यायवाची", "(स) विलोम"],
        a: 2
      },
      {
        q: "विलोम शब्दों का दूसरा नाम है–",
        opts: ["(अ) अनेकार्थक", "(ब) विपरीतार्थक", "(स) भिन्नार्थक"],
        a: 1
      },
      {
        q: "तत्सम शब्दों का विलोम होगा–",
        opts: ["(अ) तत्सम शब्द", "(ब) तद्भव शब्द", "(स) विदेशी शब्द"],
        a: 0
      },
      {
        q: "शब्दों को विलोम बनाने के लिए प्रयोग किया जाता है–",
        opts: ["(अ) 'अ' वर्ण", "(ब) 'च' वर्ण", "(स) 'फ' वर्ण"],
        a: 0
      }
    ];

    const quiz = document.querySelector('#quiz');
    const result = document.querySelector('#result');
    const letters = ['क', 'ख', 'ग', 'घ'];
    let selected = Array(data.length).fill(null);

    function render() {
      quiz.innerHTML = '';
      data.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'question-box';

        const label = document.createElement('div');
        label.textContent = `(${letters[i]}) ${item.q}`;
        row.append(label);

        const opts = document.createElement('div');
        opts.className = 'options';

        item.opts.forEach((optText, j) => {
          const b = document.createElement('button');
          b.className = 'option';
          b.textContent = optText;
          b.setAttribute('aria-label', `${letters[i]}: ${optText}`);
          b.setAttribute('aria-pressed', selected[i] === j ? 'true' : 'false');
          if (selected[i] === j) {
            b.classList.add('selected');
          }

          b.onclick = () => {
            selected[i] = j;
            opts.querySelectorAll('button').forEach(x => {
              x.classList.remove('selected');
              x.setAttribute('aria-pressed', 'false');
            });
            b.classList.add('selected');
            b.setAttribute('aria-pressed', 'true');
            result.textContent = 'उत्तर जाँचने के लिए बटन दबाएँ।';
          };
          opts.append(b);
        });

        row.append(opts);
        quiz.append(row);
      });
      result.textContent = `अंक: 0 / ${data.length}`;
    }

    function check() {
      let score = 0;
      quiz.querySelectorAll('.question-box').forEach((row, i) => {
        row.querySelectorAll('.feedback').forEach(x => x.remove());

        row.querySelectorAll('.option').forEach((b, j) => {
          b.classList.remove('correct', 'wrong');
          if (j === data[i].a) {
            b.classList.add('correct');
          } else if (j === selected[i]) {
            b.classList.add('wrong');
          }
        });

        const f = document.createElement('div');
        f.className = 'feedback';
        const isCorrect = selected[i] === data[i].a;
        if (isCorrect) {
          f.textContent = '✓ सही';
          f.classList.add('ok');
          score++;
        } else if (selected[i] === null) {
          f.textContent = '• उत्तर नहीं चुना';
        } else {
          f.textContent = '✕ गलत';
          f.classList.add('bad');
        }
        row.append(f);
      });
      result.textContent = `अंक: ${score} / ${data.length}`;
    }

    function reset() {
      selected.fill(null);
      render();
    }

    render();
  </script>
</body>
</html>
