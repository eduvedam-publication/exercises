<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#e2f8fc;font-family:Georgia,"Times New Roman",serif}
.card{width:min(1080px,calc(100% - 24px));min-height:500px;margin:14px auto;background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:34px 42px;display:flex;flex-direction:column}
h1{font:700 25px Arial;color:#00a1db;margin:0 0 26px}.qs{display:grid;gap:18px;flex:1}.q{font-size:20px;line-height:1.55}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:7px}.letter{width:28px;flex:0 0 28px}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;margin:8px 0 0 28px}.opt{border:2px solid #ff1680;border-radius:11px;background:#fff;color:#111;padding:8px 14px;font:18px Georgia;cursor:pointer}
.opt.sel{background:#fff0f7}.opt.correct{background:#dff7df;border-color:#198c3d}.opt.wrong{background:#ffe1e1;border-color:#d92c2c}
input{height:38px;border:2px solid #ff2b22;padding:4px 8px;font:18px Arial;background:#fff;width:145px}
input.ok{background:#dff7df;border-color:#198c3d}input.bad{background:#ffe1e1;border-color:#d92c2c}
.footer{margin-top:auto;text-align:center;padding-top:30px}.footer button{border:0;border-radius:25px;background:#ff7b00;color:#fff;padding:13px 22px;margin:0 6px;font:bold 14px Arial;cursor:pointer}.score{margin-top:14px;color:#064bb4;font:bold 22px Arial}
.figure{display:inline-flex;align-items:center;margin-right:8px}.figure svg{width:130px;height:55px}
@media(max-width:650px){.card{padding:24px 18px}.q{font-size:18px}.opts{margin-left:0}input{width:115px}}
</style></head><body><main class="card">
<h1>Fill in the blanks using the correct number to continue the patterns.</h1><div class="qs"><div class="q row"><span class="letter">a.</span><span>25, 50,</span><input id="a0" autocomplete="off"><span>, 100,</span><input id="a1" autocomplete="off"><span>, 150</span></div><div class="q row"><span class="letter">b.</span><span>23, 26,</span><input id="a2" autocomplete="off"><span>,</span><input id="a3" autocomplete="off"><span>, 35, 38</span></div><div class="q row"><span class="letter">c.</span><span>40, 50, 60, 70,</span><input id="a4" autocomplete="off"><span>,</span><input id="a5" autocomplete="off"><span>, 100</span></div><div class="q row"><span class="letter">d.</span><span>16, 24, 32,</span><input id="a6" autocomplete="off"><span>,</span><input id="a7" autocomplete="off"><span>, 56</span></div></div>
<div class="footer"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button><div class="score" id="score">Score: 0 / 8</div></div></main>
<script>const A=[["75"], ["125"], ["29"], ["32"], ["80"], ["90"], ["40"], ["48"]];const n=s=>s.trim().toLowerCase().replace(/\s+/g,' ');
function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById('a'+i),v=Array.isArray(a)?a:[a],ok=v.some(x=>n(e.value)==n(x));e.className=ok?'ok':'bad';if(ok)s++});score.textContent='Score: '+s+' / 8'}
function resetAll(){A.forEach((_,i)=>{let e=document.getElementById('a'+i);e.value='';e.className=''});score.textContent='Score: 0 / 8'}</script></body></html>
