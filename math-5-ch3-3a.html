<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 5 Chapter 3 Exercise 3A</title><style>
*{box-sizing:border-box}body{margin:0;background:#bafaff;font-family:Georgia,'Times New Roman',serif;color:#183247}.wrap{width:min(1050px,95vw);margin:18px auto;background:white;border:3px solid #00a7ef;border-radius:21px;padding:24px}h1{color:#00a4ef;font-size:clamp(21px,2.5vw,30px);margin:0 0 17px}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.question{border:1.5px solid #00aaff;border-radius:11px;background:#e1faff;padding:13px;min-height:104px}.line{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:18px}.letter{font-weight:bold;color:#008dcc}.expr{flex:1;min-width:170px}.answer{border:1.5px dashed #ff6868;border-radius:8px;background:white;padding:10px;width:170px;max-width:100%;font:18px Georgia;text-align:center;color:#123}.answer.correct{border:2px solid #16a34a;background:#e6ffe9}.answer.wrong{border:2px solid #e33;background:#ffe7e7}.feedback{font-size:13px;min-height:16px;margin-top:6px;color:#b91c1c}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{background:#ff7100;border:0;color:white;padding:11px 17px;border-radius:24px;font-weight:bold;cursor:pointer}button:hover{background:#df5f00}.marks{text-align:center;color:#003bde;font:bold 21px Arial;margin-top:12px}.note{text-align:center;color:#526579;font:13px Arial;margin-top:8px}@media(max-width:750px){.questions{grid-template-columns:1fr}.wrap{padding:15px}.question{min-height:auto}}
</style></head><body><main class="wrap"><h1>1. Simplify the following expressions.</h1><div id="questions" class="questions"></div><div class="actions"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div class="marks" id="marks">Marks: 0 / 20</div><div class="note">For fractions, enter an integer, a/b, or a mixed number (e.g. 2 1/3).</div></main><script>
const DATA=[{"q": "54 − 3 + 4 + 9 ÷ 3", "a": "58"}, {"q": "62 − 24 ÷ 8 × 3 + 6", "a": "59"}, {"q": "28 − 2 × 6 ÷ 2 + 24 − 17", "a": "30"}, {"q": "48 ÷ 8 + 24 − 3 − 2", "a": "25"}, {"q": "64 + 84 × 6 − 27", "a": "541"}, {"q": "55 − 3 × 6 ÷ 9 + 3", "a": "56"}, {"q": "14 × 5 − 72 ÷ 12 − 8 + 12", "a": "68"}, {"q": "25 × 5 ÷ 25 − 2 + 6", "a": "9"}, {"q": "17 × 4 − 27 ÷ 9 + 25", "a": "90"}, {"q": "8 × 8 ÷ 4 − 2 + 6", "a": "20"}, {"q": "102 × 4 − 7 × 4 ÷ (2/3)", "a": "366"}, {"q": "(2/3) + (5/6) ÷ (1/6) − (1/9) × 2", "a": "49/9"}, {"q": "2 1/4 × 1 3/5 + 2 3/4 ÷ 1/4 − 1 3/4", "a": "257/20"}, {"q": "5 1/7 + 4 1/14 ÷ (2/7) × (2/21) − (1/7)", "a": "89/14"}, {"q": "4 1/6 × (2 3/38) − (2/7) + (5/6) ÷ (1/6)", "a": "21349/1596"}, {"q": "17 2/3 × 1 1/2 ÷ (3/7) − (2/7) + 1 1/3", "a": "2641/42"}, {"q": "3 1/7 × (1 4/39) − (1/7) + (6/6) ÷ (1/7)", "a": "2818/273"}, {"q": "4 1/8 + 5 1/16 ÷ (1/8) × (1/32) − (1/6)", "a": "1003/192"}, {"q": "6 1/9 × 2 1/27 − 1 1/6 + 3 1/9 ÷ (1/3)", "a": "10019/486"}, {"q": "6 2/5 × (3/35) ÷ (1/7) + 4 5/6 ÷ (1/6)", "a": "821/25"}];const KEY='math-5-ch3-3a-v1';const qs=document.getElementById('questions');
DATA.forEach((it,i)=>{let d=document.createElement('div');d.className='question';let row=document.createElement('div');row.className='line';let letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(97+i)+'.';let exp=document.createElement('span');exp.className='expr';exp.textContent=it.q;let input=document.createElement('input');input.className='answer';input.type='text';input.autocomplete='off';input.setAttribute('aria-label','Answer '+(i+1));input.dataset.index=i;let fb=document.createElement('div');fb.className='feedback';d.append(row,fb);row.append(letter,exp,input);qs.append(d);input.addEventListener('input',()=>{input.classList.remove('correct','wrong');fb.textContent='';save()})});
const inputs=[...document.querySelectorAll('.answer')];function save(){try{localStorage.setItem(KEY,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}function restore(){try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');inputs.forEach((x,i)=>x.value=a[i]||'')}catch(e){}}function parseNum(s){s=s.trim().replace(/−/g,'-');if(!s)return NaN;let mixed=s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mixed){let whole=Number(mixed[1]),n=Number(mixed[2]),d=Number(mixed[3]);return d?whole+Math.sign(whole||1)*n/d:NaN}let f=s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);if(f)return Number(f[2])?Number(f[1])/Number(f[2]):NaN;return /^-?\d+(?:\.\d+)?$/.test(s)?Number(s):NaN}
function check(){let score=0;inputs.forEach((inp,i)=>{let v=parseNum(inp.value),expected=parseNum(DATA[i].a),good=Number.isFinite(v)&&Math.abs(v-expected)<1e-7;inp.classList.toggle('correct',good);inp.classList.toggle('wrong',!good);inp.closest('.question').querySelector('.feedback').textContent=good?'✓ Correct':inp.value.trim()?'✗ Incorrect':'✗ Not answered';if(good)score++});document.getElementById('marks').textContent='Marks: '+score+' / '+DATA.length;save();try{if(typeof window.submitExercise==='function')window.submitExercise({exerciseType:'FILL_BLANK',response:Object.fromEntries(inputs.map((x,i)=>['question'+(i+1),x.value])),score,total:DATA.length})}catch(e){console.warn(e)}}
document.getElementById('submit').addEventListener('click',check);document.getElementById('show').addEventListener('click',()=>{inputs.forEach((x,i)=>{x.value=DATA[i].a;x.classList.add('correct');x.classList.remove('wrong');x.closest('.question').querySelector('.feedback').textContent='✓ Answer shown'});document.getElementById('marks').textContent='Marks: '+DATA.length+' / '+DATA.length;save()});document.getElementById('reset').addEventListener('click',()=>{inputs.forEach(x=>{x.value='';x.classList.remove('correct','wrong');x.closest('.question').querySelector('.feedback').textContent=''});document.getElementById('marks').textContent='Marks: 0 / '+DATA.length;save()});restore();
</script></body></html>
