<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#e2f8fc;font-family:Georgia,"Times New Roman",serif}
.card{width:min(1080px,calc(100% - 24px));min-height:420px;margin:14px auto;background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:34px 42px;display:flex;flex-direction:column}
h1{font:700 25px Arial;color:#00a1db;margin:0 0 28px}.qs{display:grid;gap:20px;flex:1}.q{font-size:20px;line-height:1.55}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;margin:8px 0 0 28px}.opt{border:2px solid #ff1680;border-radius:11px;background:#fff;color:#111;padding:8px 14px;font:18px Georgia;cursor:pointer}.opt.sel{background:#fff0f7}.opt.correct{background:#dff7df;border-color:#198c3d}.opt.wrong{background:#ffe1e1;border-color:#d92c2c}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:7px}.letter{width:28px;flex:0 0 28px}input{height:38px;border:2px solid #ff2b22;padding:4px 8px;font:18px Arial;color:#111;background:#fff}input.ok{background:#dff7df;border-color:#198c3d}input.bad{background:#ffe1e1;border-color:#d92c2c}
.footer{margin-top:auto;text-align:center;padding-top:30px}.footer button{border:0;border-radius:25px;background:#ff7b00;color:white;padding:13px 22px;margin:0 6px;font:bold 14px Arial;cursor:pointer}.score{margin-top:14px;color:#064bb4;font:bold 22px Arial}
</style></head><body><main class=card><h1>Choose the correct option.</h1><div class=qs><div class=q>a. How many 20-paise coins will make 4 rupees?<div class=opts><button class=opt data-q=0 data-v=0 onclick="pick(this)">i. 20</button><button class=opt data-q=0 data-v=1 onclick="pick(this)">ii. 25</button><button class=opt data-q=0 data-v=2 onclick="pick(this)">iii. 40</button><button class=opt data-q=0 data-v=3 onclick="pick(this)">iv. None of these</button></div></div><div class=q>b. Which of the following Indian currency note does not exist?<div class=opts><button class=opt data-q=1 data-v=0 onclick="pick(this)">i. ₹ 15</button><button class=opt data-q=1 data-v=1 onclick="pick(this)">ii. ₹ 20</button><button class=opt data-q=1 data-v=2 onclick="pick(this)">iii. ₹ 50</button><button class=opt data-q=1 data-v=3 onclick="pick(this)">iv. ₹ 200</button></div></div><div class=q>c. 3 paise is same as ______.<div class=opts><button class=opt data-q=2 data-v=0 onclick="pick(this)">i. ₹ 0.3</button><button class=opt data-q=2 data-v=1 onclick="pick(this)">ii. ₹ 3</button><button class=opt data-q=2 data-v=2 onclick="pick(this)">iii. ₹ 0.03</button><button class=opt data-q=2 data-v=3 onclick="pick(this)">iv. None of these</button></div></div><div class=q>d. 6 rupees 24 paise is the same as ______.<div class=opts><button class=opt data-q=3 data-v=0 onclick="pick(this)">i. ₹ 6.24</button><button class=opt data-q=3 data-v=1 onclick="pick(this)">ii. 624 p</button><button class=opt data-q=3 data-v=2 onclick="pick(this)">iii. Both (a) and (b)</button><button class=opt data-q=3 data-v=3 onclick="pick(this)">iv. None of these</button></div></div></div><div class=footer><button onclick=check()>Check Answers</button><button onclick=resetAll()>Reset</button><div class=score id=score>Score: 0 / 4</div></div></main><script>
const A=[0, 0, 2, 2];function pick(e){document.querySelectorAll('[data-q="'+e.dataset.q+'"]').forEach(x=>x.classList.remove('sel','correct','wrong'));e.classList.add('sel')}
function check(){let s=0;A.forEach((a,q)=>{let x=document.querySelector('[data-q="'+q+'"].sel');if(x){let ok=+x.dataset.v===a;x.classList.add(ok?'correct':'wrong');if(ok)s++}});score.textContent="Score: "+s+" / 4"}function resetAll(){document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel','correct','wrong'));score.textContent="Score: 0 / 4"}</script></body></html>
