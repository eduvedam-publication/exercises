<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrange the following in ascending and descending order.</title><style>*{box-sizing:border-box}body{margin:0;background:#e7faff;font-family:Arial,sans-serif;color:#223}.sheet{max-width:920px;margin:18px auto;padding:24px;background:white;border:3px solid #05a9d8;border-radius:22px}h1{font:700 23px Georgia;color:#00a9da;margin:0 0 18px}.item{padding:12px;margin:9px 0;border:1.5px solid #4ac9ee;border-radius:10px;background:#f0fbff;font:17px Georgia;line-height:1.7}.item>label{display:block;margin-bottom:6px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{border:1px solid #aedfeb;border-radius:8px;background:white;padding:8px;cursor:pointer;text-align:left;font:16px Georgia;color:#223}.choice.selected{border:2px solid #0089d8;background:#ddf4ff}.choice.correct,input.correct{border-color:#15a85d;background:#dcf8e4}.choice.incorrect,input.incorrect{border-color:#f45b69;background:#ffe2e5;animation:blink .4s 2}@keyframes blink{50%{background:#ff9ba4}}input{width:min(100%,360px);min-height:36px;padding:5px 8px;border:2px solid #ff5360;font-size:16px}input.long{width:100%}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.prompt{flex:1;min-width:140px}.actions{display:flex;justify-content:center;gap:12px;margin-top:22px}button.action{background:#ff8500;border:0;border-radius:25px;color:white;padding:11px 20px;font-weight:700;cursor:pointer}#score{text-align:center;color:#0755b7;font-size:21px;font-weight:bold;margin:14px 0 0}.note{font-size:13px;color:#526}@media(max-width:600px){.sheet{padding:13px;margin:8px}.choices{grid-template-columns:1fr}h1{font-size:19px}.item{font-size:15px}}</style></head><body><main class="sheet"><h1>Arrange the following in ascending and descending order.</h1><section class="item"><div class="row"><span class="prompt">a. Ascending: 568658, 558658, 245252, 658755, 668755</span><input class="long" id="a0" aria-label="Answer a" autocomplete="off"></div></section><section class="item"><div class="row"><span class="prompt">b. Descending: 54546, 45556, 54662, 45857, 65526</span><input class="long" id="a1" aria-label="Answer b" autocomplete="off"></div></section><div class="actions"><button class="action" onclick="checkAnswers()">Check Answers</button><button class="action" onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 2</div></main><script>
const expected={"0": "245252, 558658, 568658, 658755, 668755", "1": "65526, 54662, 54546, 45857, 45556"},key="math-4-ch1-assessment-order",mode="input",scored=true,chosen={};
const fields=[...document.querySelectorAll('input')], score=document.getElementById('score');
function norm(s){return String(s).toLowerCase().replace(/[\s,]/g,'').replace(/\+0(?=\+|$)/g,'').trim()}
function selectChoice(i,j){chosen[i]=j;document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>b.classList.toggle('selected',+b.dataset.v===j));save()}
function save(){try{localStorage.setItem(key,JSON.stringify({values:Object.fromEntries(fields.map(x=>[x.id,x.value])),chosen,score:score.textContent}))}catch(e){}}
function checkAnswers(){if(!scored){score.textContent='Answers saved';save();return}let n=0;if(mode==='mcq'){Object.keys(expected).forEach(i=>{let good=chosen[i]===expected[i];if(good)n++;document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>{b.classList.remove('correct','incorrect');if(+b.dataset.v===chosen[i])b.classList.add(good?'correct':'incorrect')})})}else{fields.forEach((f,i)=>{let good=norm(f.value)===norm(expected[i]);f.classList.toggle('correct',good);f.classList.toggle('incorrect',!good);if(good)n++})}score.textContent=`Score: ${n} / ${Object.keys(expected).length}`;save()}
function resetExercise(){fields.forEach(f=>{f.value='';f.classList.remove('correct','incorrect')});Object.keys(chosen).forEach(k=>delete chosen[k]);document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected','correct','incorrect'));score.textContent=scored?`Score: 0 / ${Object.keys(expected).length}`:'Answers not submitted';save()}
fields.forEach(f=>f.addEventListener('input',()=>{f.classList.remove('correct','incorrect');save()}));
try{let d=JSON.parse(localStorage.getItem(key)||'null');if(d){fields.forEach(f=>f.value=d.values?.[f.id]||'');Object.entries(d.chosen||{}).forEach(([i,j])=>selectChoice(+i,+j));score.textContent=d.score||score.textContent}}catch(e){}
</script></body></html>
