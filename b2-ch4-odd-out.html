<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find the Odd One Out</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);padding:18px;color:#333}
.quiz-box{width:min(100%,1000px);margin:auto;background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:26px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.heading{color:#00a6d6;font-size:28px;font-weight:700;margin-bottom:20px}
.question-box{background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:18px 20px;margin-bottom:15px}
.result{text-align:center;margin:20px 0 14px;font-size:25px;font-weight:700;color:#0047ab}
.buttons{text-align:center}
.reset{border:0;border-radius:32px;padding:12px 30px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9800,#ff6f00);cursor:pointer}

.question-box{display:flex;align-items:center;gap:14px}.num{font-size:20px;font-weight:700;min-width:30px}
.options{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:1}
.option{background:#fff;border:2px solid #ff4fa0;border-radius:50px;padding:12px 10px;font-size:17px;font-weight:600;cursor:pointer;text-align:center}
.option:hover{background:#fff0f7}.option.correct{background:#d4f8d4;border-color:#2e7d32;color:#1b5e20}.option.wrong{background:#ffd9dd;border-color:#c62828;color:#b71c1c}.option.disabled{pointer-events:none}
@media(max-width:650px){body{padding:8px}.quiz-box{padding:16px 12px}.heading{font-size:21px}.question-box{align-items:flex-start}.options{grid-template-columns:repeat(2,1fr)}.option{font-size:14px;padding:10px 5px}.reset{width:100%}}
</style></head><body><div class="quiz-box"><div class="heading">Find the odd one out.</div><div id="quiz"></div>
<div class="result" id="result">Score: 0 / 4</div><div class="buttons"><button class="reset" onclick="resetQuiz()">Reset Quiz</button></div></div>
<script>
const qs=[
{o:["Pencil","Eraser","School Bag","Television"],a:"Television"},
{o:["Bed","Cupboard","Chair","Banana"],a:"Banana"},
{o:["Glasses","Bus Pass","Car Keys","Football"],a:"Football"},
{o:["Comb","Soap","Stone","Toothbrush"],a:"Stone"}
];let score=0;
function load(){let q=document.getElementById("quiz");q.innerHTML="";qs.forEach((x,i)=>{let row=document.createElement("div");row.className="question-box";let n=document.createElement("div");n.className="num";n.textContent=(i+1)+".";let os=document.createElement("div");os.className="options";x.o.forEach(v=>{let b=document.createElement("div");b.className="option";b.textContent=v;b.onclick=()=>check(b,v,x.a,os);os.append(b)});row.append(n,os);q.append(row)})}
function check(btn,val,a,c){let all=c.querySelectorAll(".option");all.forEach(x=>{x.classList.add("disabled");if(x.textContent===a)x.classList.add("correct")});if(val===a)score++;else btn.classList.add("wrong");document.getElementById("result").textContent=`Score: ${score} / 4`;}
function resetQuiz(){score=0;document.getElementById("result").textContent="Score: 0 / 4";load()}load();
</script></body></html>
