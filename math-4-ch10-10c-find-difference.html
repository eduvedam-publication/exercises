<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 - Chapter 10 - 10c Find the Difference</title><style>
*{box-sizing:border-box}body{margin:0;background:#d4faff;font-family:Georgia,'Times New Roman',serif;color:#162637}.sheet{max-width:1120px;margin:22px auto;padding:24px 26px 20px;border:3px solid #00ade4;border-radius:22px;background:white}h1{font-size:27px;color:#00a8dc;margin:0 0 18px}.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 22px}.question{border:1px solid #83dafa;border-radius:12px;padding:13px 12px;background:#effaff;display:flex;gap:9px;align-items:flex-start}.letter{font-weight:bold;padding-top:30px}.calc{width:100%;max-width:270px;margin:auto}.heads,.numrow,.answerrow{display:grid;grid-template-columns:26px repeat(3,minmax(0,1fr));align-items:center;text-align:center}.heads{background:#e3e7e9;color:#ff4162;font-weight:bold;padding:6px 0}.numrow{font-size:21px;min-height:31px}.numrow .op{font-weight:bold}.answerrow{border-top:2px solid #00b6ed;padding-top:6px}.answerrow input{width:100%;min-width:0;height:38px;border:2px solid #ff5364;background:#fff;color:#14233a;text-align:center;font:20px Georgia;border-radius:3px;outline:none}.answerrow input:focus{border-color:#00ade4}.answerrow input.good{border-color:#16a34a;background:#e5ffed}.answerrow input.bad{border-color:#ef4444;background:#fff1f1;animation:blink .5s 3}@keyframes blink{50%{background:#ffb8b8}}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}button{background:#ff8000;color:white;border:0;border-radius:24px;padding:12px 18px;font-weight:bold;cursor:pointer}.status{text-align:center;color:#0054b7;font:bold 17px Arial;margin:12px 0 0}.status:empty{display:none}@media(max-width:760px){.questions{grid-template-columns:repeat(2,minmax(0,1fr))}.sheet{margin:10px;padding:15px}}@media(max-width:470px){.questions{grid-template-columns:1fr}.question{padding:12px}.calc{max-width:300px}h1{font-size:23px}}
</style></head><body><main class="sheet"><h1>Find the difference.</h1><div class="questions" id="questions"></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div></main><script>
const data=[{"label":"a","a":[8,37,29],"b":[4,29,18],"answer":[4,8,11]},{"label":"b","a":[10,37,29],"b":[4,29,18],"answer":[6,8,11]},{"label":"c","a":[18,42,36],"b":[11,30,29],"answer":[7,12,7]},{"label":"d","a":[14,48,17],"b":[8,12,29],"answer":[6,35,48]},{"label":"e","a":[28,36,14],"b":[19,18,9],"answer":[9,18,5]},{"label":"f","a":[29,14,57],"b":[14,12,32],"answer":[15,2,25]},{"label":"g","a":[48,19,37],"b":[24,19,28],"answer":[24,0,9]},{"label":"h","a":[19,44,19],"b":[12,36,14],"answer":[7,8,5]},{"label":"i","a":[25,58,36],"b":[17,42,23],"answer":[8,16,13]},{"label":"j","a":[34,56,44],"b":[16,55,40],"answer":[18,1,4]},{"label":"k","a":[24,46,59],"b":[15,32,58],"answer":[9,14,1]},{"label":"l","a":[46,54,56],"b":[25,46,52],"answer":[21,8,4]}];const key='math-4-ch10-10c-find-difference-v1';const letters=['hr.','min.','sec'];const root=document.getElementById('questions');
root.innerHTML=data.map((q,i)=>`<div class="question"><span class="letter">${q.label}.</span><div class="calc"><div class="heads"><span></span>${letters.map(s=>`<span>${s}</span>`).join('')}</div><div class="numrow"><span></span>${q.a.map(v=>`<span>${v}</span>`).join('')}</div><div class="numrow"><span class="op">−</span>${q.b.map(v=>`<span>${v}</span>`).join('')}</div><div class="answerrow"><span>=</span>${q.answer.map((v,j)=>`<input aria-label="${q.label} ${letters[j]}" inputmode="numeric" data-i="${i}" data-j="${j}" autocomplete="off">`).join('')}</div></div></div>`).join('');
const inputs=[...document.querySelectorAll('input')];function save(){localStorage.setItem(key,JSON.stringify(inputs.map(x=>x.value)))}function clearFeedback(){inputs.forEach(x=>x.classList.remove('good','bad'));}inputs.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('good','bad');save()}));try{let old=JSON.parse(localStorage.getItem(key)||'[]');inputs.forEach((x,i)=>x.value=old[i]||'')}catch(e){}
function check(){let correct=0;inputs.forEach(x=>{x.classList.remove('good','bad');let val=x.value.trim();if(!val)return;let target=data[+x.dataset.i].answer[+x.dataset.j];let ok=/^\d+$/.test(val)&&Number(val)===target;x.classList.add(ok?'good':'bad');if(ok)correct++});save()}
function showAnswers(){inputs.forEach(x=>{x.value=data[+x.dataset.i].answer[+x.dataset.j];x.classList.remove('bad');x.classList.add('good')});save()}
function resetAll(){inputs.forEach(x=>x.value='');clearFeedback();localStorage.removeItem(key)}
</script></body></html>
