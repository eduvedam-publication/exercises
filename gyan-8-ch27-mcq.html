<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>अभ्यास</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d0faff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#202020}.wrap{max-width:990px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a9e9;margin:0 0 16px;font-size:25px}.q{background:#ebfaff;border:1px solid #00b9ed;border-radius:11px;padding:13px;margin:9px 0;font-size:18px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:9px}.opt{background:white;border:1px solid #9bdfff;border-radius:7px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;color:inherit;font:inherit;text-align:left}.opt.selected{border:2px solid #008ad1;background:#d7f4ff}.correct{background:#d6ffe5!important;border-color:#0baf54!important}.wrong{background:#ffe0e0!important;border-color:#e33!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.5}}.buttons{text-align:center;margin-top:24px}button.action{background:#ff8000;color:white;border:0;border-radius:22px;padding:11px 19px;margin:3px;cursor:pointer;font-weight:bold}@media(max-width:650px){.wrap{margin:7px;padding:14px}.options{grid-template-columns:1fr}.q{font-size:16px}}
</style>
</head>
<body><main class="wrap">
<h2>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h2>
<div id="questions"></div>
<div class="buttons">
<button class="action" type="button" onclick="check()">Submit</button>
<button class="action" type="button" onclick="showAnswers()">Show Answer</button>
<button class="action" type="button" onclick="resetAll()">Reset</button>
</div>
</main>
<script>
const data=[
["शुद्ध क्या है–",["हम तुम्हें समझा दिए थे","उन्होंने निबंध लिखा","वे कुछ कहे थे"],1],
["‘वह’ और ‘वे ने’ की अशुद्धि करके बनेगा–",["मैंने और हमने","उसने और उन्होंने","दोनों"],1],
["शुद्ध वर्तनी युक्त शब्द है–",["उज्जवल","उजज्वल","उज्ज्वल"],2],
["शुद्ध वाक्य है–",["श्याम ने पानी में पौधे डाले","पानी में पौधे श्याम ने डाले","श्याम ने पौधों में पानी डाला"],2]
];
const key='gyan-8-ch27-mcq-v1';
const labels=['क','ख','ग','घ'];
const optionLabels=['अ','ब','स'];
let answers=Array(data.length).fill(null);
try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.length===data.length)answers=saved}catch{}
const root=document.getElementById('questions');
function save(){try{localStorage.setItem(key,JSON.stringify(answers))}catch{}}
function render(){
 root.innerHTML=data.map(([q,opts],i)=>`<div class="q"><div>(${labels[i]}) ${q}</div><div class="options">${opts.map((o,j)=>`<button type="button" class="opt ${answers[i]===j?'selected':''}" data-i="${i}" data-j="${j}" onclick="pick(${i},${j})"><span>(${optionLabels[j]}) ${o}</span><span>${answers[i]===j?'✓':''}</span></button>`).join('')}</div></div>`).join('');
}
function pick(i,j){answers[i]=j;save();render()}
function check(){document.querySelectorAll('.opt').forEach(b=>b.classList.remove('correct','wrong'));data.forEach((q,i)=>{if(answers[i]===null)return;const b=document.querySelector(`[data-i="${i}"][data-j="${answers[i]}"]`);b.classList.add(answers[i]===q[2]?'correct':'wrong')})}
function showAnswers(){answers=data.map(q=>q[2]);save();render();check()}
function resetAll(){answers=Array(data.length).fill(null);try{localStorage.removeItem(key)}catch{}render()}
render();
</script></body></html>
