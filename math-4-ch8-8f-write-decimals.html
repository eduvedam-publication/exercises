<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write as decimals.</title><style>*{box-sizing:border-box}body{margin:0;background:#d8faff;font-family:Georgia,"Times New Roman",serif;color:#17212b}.sheet{width:min(1100px,96vw);margin:16px auto;background:white;border:3px solid #00aeea;border-radius:22px;padding:22px 25px}h2{margin:0 0 18px;color:#00a6d9;font-size:26px}.tag{float:right;background:#00b5eb;color:white;border-radius:6px;padding:6px 16px;font:13px Arial}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}.question{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:11px;background:#ecfbff;border:1px solid #00b8f0;border-radius:11px;font-size:18px;min-height:70px}.letter{font-weight:bold;margin-right:4px}input{min-width:0;width:105px;border:2px solid #ff695f;border-radius:4px;background:white;padding:7px;font-size:17px;font-family:inherit;outline:none}input:focus{border-color:#00aeea}.correct{border-color:#16a34a!important;background:#e9ffe9!important}.wrong{border-color:#e11d48!important;background:#ffe4e6!important;animation:flash .45s 3}@keyframes flash{50%{background:#ff9ca8}}.actions{text-align:center;margin-top:24px}button{border:0;background:#ff8200;color:white;padding:11px 22px;border-radius:25px;font-weight:bold;cursor:pointer;margin:0 4px}.score{text-align:center;color:#0750bd;font:700 20px Arial;margin:12px 0 0}@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:530px){.grid{grid-template-columns:1fr}.sheet{padding:14px}.tag{float:none;display:inline-block;margin-bottom:12px}h2{font-size:22px}}</style></head><body><main class="sheet"><span class="tag">Understanding</span><h2>Write as decimals.</h2><section class="grid"><div class="question"><span class="letter">a.</span><span>9 rupees 20 paise</span><input aria-label="Answer a" id="ans0" autocomplete="off" placeholder="Answer"></div><div class="question"><span class="letter">b.</span><span>97 rupees 28 paise</span><input aria-label="Answer b" id="ans1" autocomplete="off" placeholder="Answer"></div><div class="question"><span class="letter">c.</span><span>29 m 14 cm</span><input aria-label="Answer c" id="ans2" autocomplete="off" placeholder="Answer"></div><div class="question"><span class="letter">d.</span><span>45 kg 45 g</span><input aria-label="Answer d" id="ans3" autocomplete="off" placeholder="Answer"></div><div class="question"><span class="letter">e.</span><span>78 kg 520 g</span><input aria-label="Answer e" id="ans4" autocomplete="off" placeholder="Answer"></div><div class="question"><span class="letter">f.</span><span>25 rupees 5 paise</span><input aria-label="Answer f" id="ans5" autocomplete="off" placeholder="Answer"></div><div class="question"><span class="letter">g.</span><span>12 m 40 cm</span><input aria-label="Answer g" id="ans6" autocomplete="off" placeholder="Answer"></div><div class="question"><span class="letter">h.</span><span>62 m 29 cm</span><input aria-label="Answer h" id="ans7" autocomplete="off" placeholder="Answer"></div><div class="question"><span class="letter">i.</span><span>28 kg 275 g</span><input aria-label="Answer i" id="ans8" autocomplete="off" placeholder="Answer"></div><div class="question"><span class="letter">j.</span><span>21 l 350 ml</span><input aria-label="Answer j" id="ans9" autocomplete="off" placeholder="Answer"></div><div class="question"><span class="letter">k.</span><span>17 rupees 19 paise</span><input aria-label="Answer k" id="ans10" autocomplete="off" placeholder="Answer"></div><div class="question"><span class="letter">l.</span><span>18 l 4 ml</span><input aria-label="Answer l" id="ans11" autocomplete="off" placeholder="Answer"></div></section><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div class="score" id="score">Score: 0 / 12</div></main><script>const KEY="exercise-math-4-ch8-8f-write-decimals";const answers=["9.20", "97.28", "29.14", "45.045", "78.520", "25.05", "12.40", "62.29", "28.275", "21.350", "17.19", "18.004"];const inputs=[...document.querySelectorAll('input')];function norm(s){return s.toLowerCase().replace(/\s+/g,'').replace(/₹|rs\.?/g,'').replace(/,/g,'').trim()}function numeric(s){let t=norm(s).replace(/(?:rupees?|paise|kg|km|gm|g|ml|cm|m|l|p)$/,'');return /^[-+]?\d*\.?\d+$/.test(t)?Number(t):null}function equal(v,ans){let x=numeric(v),y=numeric(ans);return x!==null&&y!==null?Math.abs(x-y)<1e-9:norm(v)===norm(ans)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(inputs.map(i=>i.value)))}catch(e){}}inputs.forEach(i=>i.addEventListener('input',()=>{i.classList.remove('correct','wrong');persist()}));try{let saved=JSON.parse(localStorage.getItem(KEY)||'[]');saved.forEach((v,i)=>{if(inputs[i])inputs[i].value=v})}catch(e){}function check(){let score=0;inputs.forEach((i,n)=>{i.classList.remove('correct','wrong');if(i.value.trim()){let ok=equal(i.value,answers[n]);i.classList.add(ok?'correct':'wrong');if(ok)score++}});document.getElementById('score').textContent='Score: '+score+' / '+answers.length;persist();let payload={exerciseType:'FILL_BLANK',response:Object.fromEntries(inputs.map((i,n)=>['question'+(n+1),i.value]))};try{window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...payload},'*')}catch(e){}}function resetAll(){inputs.forEach(i=>{i.value='';i.classList.remove('correct','wrong')});document.getElementById('score').textContent='Score: 0 / '+answers.length;persist()}</script></body></html>
