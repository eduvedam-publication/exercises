<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiply</title><style>*{box-sizing:border-box}body{margin:0;background:#d4faff;font-family:Georgia,'Times New Roman',serif;color:#172334}.sheet{max-width:1050px;margin:24px auto;background:white;border:3px solid #00ade4;border-radius:21px;padding:25px}h2{color:#00a7dc;margin:0 0 20px;font-size:26px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:center}th{background:#fff6bd;font-size:18px}td,th{border:1.5px solid #ff6e9d;padding:12px 9px}td:first-child,th:first-child{text-align:left}input{font:inherit;border:2px solid #ff5b48;border-radius:3px;padding:7px;width:95px;max-width:100%;background:white;color:#222}input.correct{border-color:#1eae65;background:#eafff0}input.wrong{border-color:#e22;background:#ffe5e5;animation:blink .6s 2}@keyframes blink{50%{background:#fff}}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}button{border:0;background:#ff8000;color:white;padding:11px 20px;border-radius:22px;font-weight:bold;cursor:pointer}button:hover{background:#e96f00}.note{font-size:13px;color:#626e77;margin-top:15px;text-align:center}@media(max-width:600px){.sheet{margin:8px;padding:12px}th,td{padding:8px 5px;font-size:14px}input{width:75px;padding:5px}h2{font-size:21px}}.row{margin:22px 0;font-size:20px;line-height:1.8}.row input{width:230px;margin:6px;vertical-align:middle}.label{display:block}.sequence{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.sequence input{width:185px}.meta{color:#677785;font:14px Arial;margin-bottom:12px}select{font:inherit;padding:8px;border:2px solid #ff5b48;background:white;border-radius:4px}.correct{background:#eafff0;border-color:#1eae65}.wrong{background:#ffe5e5;border-color:#e22}.correction{font:14px/1.5 Arial;color:#626e77;margin-top:20px}body{padding:14px}.sheet{width:100%;max-width:1200px;margin:0 auto;padding:18px 22px}h2{font-size:25px;line-height:1.25;margin:0 0 16px}.row{font-size:18px;line-height:1.45;margin:12px 0}.label{display:inline}.row input{font-size:18px;line-height:1.2;padding:6px 8px;width:220px;margin:4px 6px;min-height:36px}.actions{margin-top:16px;gap:10px}button{padding:10px 18px}.note{margin:8px 0 0;min-height:16px}.correction{margin:8px 0 0;font-size:12px}.sequence{gap:4px}.sequence input{width:164px;margin:3px;padding:5px;font-size:17px}@media(max-width:650px){body{padding:8px}.sheet{padding:14px}h2{font-size:21px}.row{font-size:16px}.row input{font-size:16px;max-width:100%;margin-left:0}.sequence input{width:145px}button{padding:10px 12px}}@media(min-width:900px) and (max-height:700px){body{padding:8px}.sheet{padding:14px 20px}h2{margin-bottom:10px;font-size:23px}.row{margin:8px 0;font-size:17px}.row input{min-height:32px;padding:4px 7px}.actions{margin-top:10px}}.problems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 28px}.problem{font-size:20px;line-height:1.5;min-width:0}.problem label{display:block;margin-bottom:7px}.problem input{width:100%;font-size:20px;padding:8px}.sheet{max-width:1100px}h2{margin-bottom:24px}.actions{margin-top:24px}@media(max-width:800px){.problems{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.problem,.problem input{font-size:18px}}@media(max-width:420px){.problems{gap:12px}.problem,.problem input{font-size:16px}.problem input{padding:6px}}@media(max-height:650px) and (min-width:801px){.problems{gap:12px 24px}.problem input{padding:5px}h2{margin-bottom:14px}}</style></head><body><main class="sheet"><h2>Multiply</h2><div class="problems"><div class="problem"><label for="answer0">a. &nbsp; 3,15,348 × 6</label><input id="answer0" aria-label="3,15,348 multiplied by 6" inputmode="numeric" autocomplete="off" data-answer="1892088"></div><div class="problem"><label for="answer1">b. &nbsp; 7,14,228 × 8</label><input id="answer1" aria-label="7,14,228 multiplied by 8" inputmode="numeric" autocomplete="off" data-answer="5713824"></div><div class="problem"><label for="answer2">c. &nbsp; 2,105,208 × 49</label><input id="answer2" aria-label="2,105,208 multiplied by 49" inputmode="numeric" autocomplete="off" data-answer="103155192"></div><div class="problem"><label for="answer3">d. &nbsp; 5,429,227 × 236</label><input id="answer3" aria-label="5,429,227 multiplied by 236" inputmode="numeric" autocomplete="off" data-answer="1281297572"></div><div class="problem"><label for="answer4">e. &nbsp; 5,428,048 × 24</label><input id="answer4" aria-label="5,428,048 multiplied by 24" inputmode="numeric" autocomplete="off" data-answer="130273152"></div><div class="problem"><label for="answer5">f. &nbsp; 848,209 × 354</label><input id="answer5" aria-label="848,209 multiplied by 354" inputmode="numeric" autocomplete="off" data-answer="300265986"></div><div class="problem"><label for="answer6">g. &nbsp; 24,21,079 × 19</label><input id="answer6" aria-label="24,21,079 multiplied by 19" inputmode="numeric" autocomplete="off" data-answer="46000501"></div><div class="problem"><label for="answer7">h. &nbsp; 421,719 × 521</label><input id="answer7" aria-label="421,719 multiplied by 521" inputmode="numeric" autocomplete="off" data-answer="219715599"></div></div><div class="actions"><button id="check">Check Answers</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><p id="note" class="note" aria-live="polite"></p></main><script>const fields=[...document.querySelectorAll('[data-answer]')],status=document.querySelector('#note'),key="math-5-ch1-1c.html";const norm=s=>s.replace(/[,\s]/g,'').replace(/−/g,'-');function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}catch(e){}}fields.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('correct','wrong');status.textContent='';save()}));try{const a=JSON.parse(localStorage.getItem(key)||'[]');fields.forEach((x,i)=>x.value=a[i]||'')}catch(e){}document.querySelector('#check').onclick=()=>{let n=0;fields.forEach(x=>{let ok=norm(x.value)===norm(x.dataset.answer);n+=ok;x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok)});status.textContent=n+' / '+fields.length+' correct';};document.querySelector('#show').onclick=()=>{fields.forEach(x=>{x.value=x.dataset.answer;x.classList.remove('wrong');x.classList.add('correct')});status.textContent='Answers shown';save()};document.querySelector('#reset').onclick=()=>{fields.forEach(x=>{x.value='';x.classList.remove('correct','wrong')});status.textContent='';save()};</script></body></html>
