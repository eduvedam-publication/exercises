<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOPAL Hindi 4 Chapter 8 MCQ</title><style>
*{box-sizing:border-box}body{margin:0;background:#e4f8ff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#263b44}.wrap{max-width:1000px;margin:22px auto;background:#fff;border:3px solid #00bde8;border-radius:18px;padding:24px}h2{margin:0 0 8px;color:#ff3988;font-size:25px}.meta{color:#527783;margin:0 0 18px}.q{background:#effbff;border:1px solid #8cdef4;border-radius:12px;padding:15px;margin:12px 0;font-size:18px}.q select{font:inherit;max-width:100%;margin-top:10px;padding:9px 12px;border:1.5px solid #00bde8;border-radius:8px;background:#fff}.correct{background:#dcf8e5!important;border-color:#20a653!important}.wrong{background:#ffe0e0!important;border-color:#e43d3d!important}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.opt{display:flex;justify-content:space-between;gap:8px;background:#fff;border:1px solid #ff8bb7;border-radius:8px;padding:10px;cursor:pointer}.opt.sel{background:#ffe5ef;border-color:#ff3988}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button{border:0;border-radius:24px;padding:11px 21px;background:#ff3988;color:white;font-weight:bold;cursor:pointer;font-size:15px}#score{text-align:center;color:#087fa7;font-weight:bold;font-size:19px;margin-top:15px}@media(max-width:650px){.wrap{margin:8px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}.q select{width:100%}}
</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ–</h2><p class="meta">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 4</p><section id="questions"></section>
<script>
const data=[["‘लेकर सवार उड़ जाता था’ में चेतक का सवार कौन था?", ["महाराणा सांगा", "महाराणा प्रताप", "महाराणा शक्ति"], 1], ["कविता में इस अस्त्र/शस्त्र का वर्णन नहीं है–", ["तलवार", "भाला", "धनुष"], 2], ["‘बढ़ते नद-सा वह लहर गया’ में ‘नद’ का अर्थ है–", ["नदी", "सरोवर", "नांद"], 0], ["‘पुतली’ क्या होती है?", ["आँख का काला भाग", "छोटी मूर्ति", "पतली लड़की"], 0]]; let answers={}; const root=document.getElementById('questions');
function render(){root.innerHTML=data.map((q,i)=>`<div class="q" id="q${i}"><b>(${'कखगघङ'[i]}) ${q[0]}</b><div class="opts">${q[1].map((o,j)=>`<div class="opt ${answers[i]===j?'sel':''}" id="o${i}-${j}" onclick="pick(${i},${j})"><span>(${'i ii iii iv'.split(' ')[j]}) ${o}</span><span>${answers[i]===j?'☑':'□'}</span></div>`).join('')}</div></div>`).join('')}
function pick(i,j){answers[i]=j;render()}
function check(){let s=0;data.forEach((q,i)=>{document.querySelectorAll('#q'+i+' .opt').forEach(e=>e.classList.remove('correct','wrong'));if(answers[i]!==undefined){let e=document.getElementById('o'+i+'-'+answers[i]),ok=answers[i]===q[2];e.classList.add(ok?'correct':'wrong');if(ok)s++}});document.getElementById('score').textContent=`प्राप्तांक: ${s} / 4`}
function showAnswers(){answers={};data.forEach((q,i)=>answers[i]=q[2]);render();check()}
function resetAll(){answers={};render();document.getElementById('score').textContent='प्राप्तांक: 0 / 4'}render();
</script><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 4</div></main></body></html>
