<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match the following.</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;font-family:Arial,sans-serif;background:#eaf8ff;color:#292929}.wrap{max-width:1000px;margin:auto;background:#fff;border:5px solid #08b6e8;border-radius:24px;padding:20px}h1{color:#ff0878;font-size:24px;margin:0 0 16px}.card{background:#f9fcff;border:2px solid #c9efff;border-radius:17px;padding:14px 17px;margin:10px 0}.q{font-size:17px;font-weight:600;margin-bottom:8px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.opt,.choice{padding:10px;border:2px solid #ff4fa0;border-radius:13px;background:#fff;font-size:15px;cursor:pointer}.correct{background:#dff7df!important;border-color:#27843a!important}.wrong{background:#ffdede!important;border-color:#c62828!important}.score{text-align:center;color:#064bad;font-size:21px;font-weight:bold;margin:13px}.actions{text-align:center}.btn{padding:10px 22px;border:0;border-radius:22px;background:#ff7b00;color:white;font-weight:bold;margin:4px;cursor:pointer}.row{font-size:17px;line-height:2}.ans{padding:7px;border:2px solid #ff4fa0;border-radius:7px;font-size:15px}.tf{display:flex;gap:8px;flex-wrap:wrap}.sentence{width:100%;padding:8px;border:2px solid #ff4fa0;border-radius:8px;font-size:15px}@media(max-width:650px){.wrap{padding:10px;border-width:3px}.opts{grid-template-columns:1fr}h1{font-size:20px}.q,.row{font-size:15px}}</style></head><body><div class="wrap"><h1>Match the following.</h1><style>
.board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:120px;padding:10px 30px;min-height:340px}.col{display:flex;flex-direction:column;justify-content:space-around;gap:14px;z-index:2}.mi{position:relative;border:2px solid #ff7b32;border-radius:14px;padding:13px 35px;background:white;cursor:pointer;font-size:17px}.dot{position:absolute;width:18px;height:18px;border:3px solid #08b6e8;background:#fff;border-radius:50%;top:50%;transform:translateY(-50%)}.left .dot{right:-10px}.right .dot{left:-10px}.sel{box-shadow:0 0 0 4px #b9e9ff}.used{background:#f0fbff}svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}line{stroke:#ff3b1f;stroke-width:3;stroke-linecap:round}@media(max-width:650px){.board{gap:40px;padding:5px 8px}.mi{font-size:13px;padding:10px 24px}}</style><div style="text-align:center;color:#666;margin-bottom:8px">Tap an item on the left, then tap its matching item on the right.</div><div class="board" id="board"><svg id="svg"></svg><div class="col left" id="L"></div><div class="col right" id="R"></div></div><div class="score" id="score">Score: 0 / 5</div><div class="actions"><button class="btn" onclick="check()">Check Answers</button><button class="btn" onclick="reset()">Reset</button></div></div><script>const Q=[["1. Job", "iii. Faithful man"], ["2. Satan", "v. Evil being"], ["3. Job's children", "ii. Ten children"], ["4. God", "i. Blessed Job"], ["5. Damaskas", "iv. Land where Job lived"]],O=["i. Blessed Job", "ii. Ten children", "iii. Faithful man", "iv. Land where Job lived", "v. Evil being"];let pick=null,M={};function render(){L.innerHTML='';R.innerHTML='';Q.forEach((p,i)=>{let d=document.createElement('div');d.className='mi';d.dataset.i=i;d.innerHTML=p[0]+'<i class="dot"></i>';d.onclick=()=>left(i);L.append(d)});O.forEach((v,i)=>{let d=document.createElement('div');d.className='mi';d.dataset.i=i;d.innerHTML='<i class="dot"></i>'+v;d.onclick=()=>right(i);R.append(d)});requestAnimationFrame(lines)}function left(i){pick=i;document.querySelectorAll('.left .mi').forEach(x=>x.classList.toggle('sel',+x.dataset.i===i))}function right(j){if(pick===null)return;Object.keys(M).forEach(k=>{if(M[k]===j)delete M[k]});M[pick]=j;pick=null;document.querySelectorAll('.mi').forEach(x=>x.classList.remove('sel','used','correct','wrong'));Object.entries(M).forEach(([a,b])=>{document.querySelector('.left .mi[data-i="'+a+'"]').classList.add('used');document.querySelector('.right .mi[data-i="'+b+'"]').classList.add('used')});lines()}function lines(){svg.innerHTML='';let br=board.getBoundingClientRect();Object.entries(M).forEach(([a,b])=>{let x=document.querySelector('.left .mi[data-i="'+a+'"] .dot').getBoundingClientRect(),y=document.querySelector('.right .mi[data-i="'+b+'"] .dot').getBoundingClientRect(),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',x.left+x.width/2-br.left);l.setAttribute('y1',x.top+x.height/2-br.top);l.setAttribute('x2',y.left+y.width/2-br.left);l.setAttribute('y2',y.top+y.height/2-br.top);svg.append(l)})}function check(){let s=0;Q.forEach((p,i)=>{if(M[i]===undefined)return;let ok=O[M[i]]===p[1],a=document.querySelector('.left .mi[data-i="'+i+'"]'),b=document.querySelector('.right .mi[data-i="'+M[i]+'"]');a.classList.add(ok?'correct':'wrong');b.classList.add(ok?'correct':'wrong');if(ok)s++});score.textContent='Score: '+s+' / '+Q.length}function reset(){pick=null;M={};score.textContent='Score: 0 / '+Q.length;render()}window.addEventListener('resize',lines);render();</script></body></html>
