<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convert into decimals.</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;font-family:Arial,sans-serif}.exercise{max-width:1050px;margin:22px auto;padding:26px 30px;background:#fff;border:3px solid #00ade0;border-radius:25px}h1{font:700 25px Georgia,serif;color:#00a9dc;margin:0 0 22px}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 22px}.question{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:19px Georgia,serif}.letter{min-width:22px}.fraction{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;min-width:33px}.fraction .top{border-bottom:1.5px solid #222;padding:0 5px 3px}.fraction .bottom{padding:3px 5px 0}.mixed{display:inline-flex;align-items:center;gap:5px}.answer{width:110px;border:2px solid #ff5260;background:white;padding:7px 6px;font:18px Arial;outline:none}.answer.correct{background:#dff9e8;border-color:#14a351}.answer.incorrect{background:#ffe1e5;border-color:#e22d3a;animation:blink .3s linear 3}@keyframes blink{50%{background:#ff98a5}}.actions{display:flex;justify-content:center;gap:12px;margin-top:32px}button{background:#ff8200;color:white;border:0;border-radius:24px;padding:11px 21px;font-weight:bold;cursor:pointer}.score{text-align:center;color:#0755b6;font:bold 21px Arial;margin-top:14px}@media(max-width:720px){.questions{grid-template-columns:1fr}.exercise{padding:18px;margin:8px}h1{font-size:22px}}</style></head><body><main class="exercise"><h1>Convert into decimals.</h1><div class="questions"><label class="question"><span class="letter">a.</span><span><span class="fraction"><span class="top">21</span><span class="bottom">25</span></span></span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="0.84" aria-label="Answer a"></label><label class="question"><span class="letter">b.</span><span><span class="fraction"><span class="top">29</span><span class="bottom">200</span></span></span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="0.145" aria-label="Answer b"></label><label class="question"><span class="letter">c.</span><span><span class="fraction"><span class="top">47</span><span class="bottom">50</span></span></span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="0.94" aria-label="Answer c"></label><label class="question"><span class="letter">d.</span><span><span class="fraction"><span class="top">56</span><span class="bottom">250</span></span></span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="0.224" aria-label="Answer d"></label><label class="question"><span class="letter">e.</span><span><span class="mixed"><span>4</span><span class="fraction"><span class="top">1</span><span class="bottom">2</span></span></span></span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="4.5" aria-label="Answer e"></label><label class="question"><span class="letter">f.</span><span><span class="mixed"><span>11</span><span class="fraction"><span class="top">29</span><span class="bottom">200</span></span></span></span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="11.145" aria-label="Answer f"></label><label class="question"><span class="letter">g.</span><span><span class="mixed"><span>121</span><span class="fraction"><span class="top">4</span><span class="bottom">25</span></span></span></span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="121.16" aria-label="Answer g"></label><label class="question"><span class="letter">h.</span><span><span class="mixed"><span>21</span><span class="fraction"><span class="top">3</span><span class="bottom">20</span></span></span></span><input class="answer" inputmode="decimal" autocomplete="off" data-answer="21.15" aria-label="Answer h"></label></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div id="score" class="score">Score: 0 / 8</div></main><script>const inputs=[...document.querySelectorAll('.answer')],KEY="math-4-ch8-8c-convert-decimals-v1";function save(){try{localStorage.setItem(KEY,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}function restore(){try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');inputs.forEach((x,i)=>x.value=v[i]||'')}catch(e){}}inputs.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('correct','incorrect');save()}));function checkAnswers(){let score=0;inputs.forEach(x=>{let ok=x.value.trim()===x.dataset.answer;x.classList.remove('correct','incorrect');void x.offsetWidth;x.classList.add(ok?'correct':'incorrect');if(ok)score++});document.getElementById('score').textContent=`Score: ${score} / ${inputs.length}`;save()}function resetExercise(){inputs.forEach(x=>{x.value='';x.classList.remove('correct','incorrect')});document.getElementById('score').textContent=`Score: 0 / ${inputs.length}`;save()}restore();</script></body></html>
