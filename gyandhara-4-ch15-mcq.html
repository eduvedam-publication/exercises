<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का चिह्न लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#cef9ff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#142434}.wrap{max-width:1000px;margin:22px auto;padding:25px;border:3px solid #00aeeb;border-radius:22px;background:white}h1{color:#00a8e6;font-size:27px;margin:0 0 20px}.q{background:#e9faff;border:1.5px solid #00b5f8;border-radius:12px;padding:13px 16px;margin:9px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px solid #8cdfff;border-radius:9px;padding:10px;cursor:pointer;min-height:48px}.opt input{accent-color:#00a8e6;width:19px;height:19px}.opt.good,.good{background:#d9fbe7!important;border-color:#21ad58!important}.opt.bad,.bad{background:#ffe0e0!important;border-color:#f44336!important}.actions{text-align:center;margin-top:25px}button{background:#ff8000;color:white;border:0;border-radius:22px;padding:11px 20px;margin:4px;cursor:pointer;font-weight:bold;font-size:15px}.marks{text-align:center;color:#0049be;font-weight:bold;font-size:19px;margin-top:10px}.bank{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;background:#dcf7ff;padding:16px;border-radius:12px;margin-bottom:14px}.chip{background:white;border:1.5px solid #00b7f9;border-radius:9px;padding:8px 15px;font-size:19px;cursor:grab}.chip.used{opacity:.35}.blank{display:inline-flex;min-width:125px;min-height:40px;vertical-align:middle;border:2px dashed #ff684b;border-radius:7px;align-items:center;justify-content:center;padding:4px 9px;cursor:pointer;color:#12426c}.blank:empty:before{content:' ';white-space:pre}.truth{display:flex;gap:8px;margin-left:auto}.truth button{border:2px solid #00b5f8;border-radius:7px;background:white;color:#006a94;padding:5px 12px;font-size:22px;margin:0}.truth button.selected{background:#c9efff}.qline{display:flex;align-items:center;gap:14px}.qline span{flex:1}@media(max-width:620px){.wrap{margin:8px;padding:14px}h1{font-size:22px}.q{font-size:16px}.opts{grid-template-columns:1fr}.truth button{padding:4px 8px}}
.opt.selected{border:2px solid #00a8e6;background:#d9f5ff}.truth button{min-width:44px;min-height:40px;font-family:Arial,sans-serif;font-weight:bold}.truth button.good{background:#d9fbe7;color:#087a34}.truth button.bad{background:#ffe0e0;color:#c32424}.chip.selected{outline:3px solid #ff8700}.chip.used{opacity:.45}@media(max-width:650px){.qline{align-items:flex-start}.truth{flex-shrink:0}}</style></head><body><main class="wrap"><h1>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h1><section class="q"><b>(क)</b> बोलते और लिखते समय अक्सर भाषा में हो जाती हैं–<div class="opts"><label class="opt" id="opt0_0"><span>(अ) क्लिष्टता</span><input type="radio" name="q0" onchange="pick(0,0)"></label><label class="opt" id="opt0_1"><span>(ब) अर्थहीनता</span><input type="radio" name="q0" onchange="pick(0,1)"></label><label class="opt" id="opt0_2"><span>(स) अशुद्धियाँ</span><input type="radio" name="q0" onchange="pick(0,2)"></label></div></section><section class="q"><b>(ख)</b> हिंदी भाषा में हम जैसा बोलते हैं वैसा ही–<div class="opts"><label class="opt" id="opt1_0"><span>(अ) लिखते भी हैं</span><input type="radio" name="q1" onchange="pick(1,0)"></label><label class="opt" id="opt1_1"><span>(ब) पढ़ते हैं</span><input type="radio" name="q1" onchange="pick(1,1)"></label><label class="opt" id="opt1_2"><span>(स) पढ़ाते हैं</span><input type="radio" name="q1" onchange="pick(1,2)"></label></div></section><section class="q"><b>(ग)</b> अनेक प्रकार की होती हैं–<div class="opts"><label class="opt" id="opt2_0"><span>(अ) शंकाएँ</span><input type="radio" name="q2" onchange="pick(2,0)"></label><label class="opt" id="opt2_1"><span>(ब) अशुद्धियाँ</span><input type="radio" name="q2" onchange="pick(2,1)"></label><label class="opt" id="opt2_2"><span>(स) भ्रांतियाँ</span><input type="radio" name="q2" onchange="pick(2,2)"></label></div></section><section class="q"><b>(घ)</b> वर्तनी की अशुद्धियों का मुख्य कारण है–<div class="opts"><label class="opt" id="opt3_0"><span>(अ) अशुद्ध उच्चारण</span><input type="radio" name="q3" onchange="pick(3,0)"></label><label class="opt" id="opt3_1"><span>(ब) शुद्ध उच्चारण</span><input type="radio" name="q3" onchange="pick(3,1)"></label><label class="opt" id="opt3_2"><span>(स) अस्पष्ट उच्चारण</span><input type="radio" name="q3" onchange="pick(3,2)"></label></div></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswer()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="marks" class="marks">Marks: 0 / 4</div></main><script>const KEY="gyandhara-4-ch15-mcq",answers=[2, 0, 1, 0];let state={};try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function pick(i,j){state[i]=j;save();draw()}function draw(){for(let i=0;i<4;i++)for(let j=0;j<3;j++){let e=document.getElementById(`opt${i}_${j}`);e.classList.toggle('selected',state[i]===j);e.querySelector('input').checked=state[i]===j}}function check(){let n=0;for(let i=0;i<4;i++)for(let j=0;j<3;j++){let e=document.getElementById(`opt${i}_${j}`);e.classList.remove('good','bad');if(state[i]===j){let ok=j===answers[i];e.classList.add(ok?'good':'bad');if(ok)n++}}document.getElementById('marks').textContent=`Marks: ${n} / 4`}function showAnswer(){answers.forEach((a,i)=>state[i]=a);save();draw();check()}function resetAll(){state={};localStorage.removeItem(KEY);draw();document.querySelectorAll('.opt').forEach(e=>e.classList.remove('good','bad'));document.getElementById('marks').textContent='Marks: 0 / 4'}draw();</script></body></html>
