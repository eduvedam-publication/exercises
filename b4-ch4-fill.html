<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fill in the blanks.</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #eaf8ff;
      color: #292929;
    }
    .w {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      border: 5px solid #08b6e8;
      border-radius: 25px;
      padding: 24px;
    }
    h1 {
      color: #ff0878;
      font-size: 25px;
      margin-top: 0;
    }
    .c {
      background: #f9fcff;
      border: 2px solid #c9efff;
      border-radius: 18px;
      padding: 15px;
      margin: 11px 0;
    }
    .r {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      line-height: 1.55;
      flex-wrap: wrap;
    }
    .g {
      flex: 1;
      line-height: 2;
    }
    .s {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #064bad;
      margin: 15px;
    }
    .a {
      text-align: center;
    }
    .b {
      padding: 11px 25px;
      border: 0;
      border-radius: 25px;
      background: #ff7b00;
      color: #fff;
      font-weight: bold;
      margin: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s ease;
    }
    .b:hover {
      background: #e66f00;
    }
    input {
      padding: 8px;
      border: 2px solid #ff4fa0;
      border-radius: 8px;
      font-size: 16px;
      max-width: 190px;
      margin: 0 4px;
      outline: none;
    }
    input:focus {
      border-color: #08b6e8;
      box-shadow: 0 0 5px rgba(8, 182, 232, 0.4);
    }
    .ok {
      background: #d8f6d8 !important;
      border-color: #27843a !important;
    }
    .bad {
      background: #ffdadd !important;
      border-color: #c62828 !important;
    }
    .ch {
      display: inline-block;
      padding: 5px 11px;
      border: 2px solid #ff4fa0;
      border-radius: 999px;
      margin: 3px;
      cursor: pointer;
      font-weight: bold;
    }
    .off {
      pointer-events: none;
    }
    @media (max-width: 650px) {
      .w {
        padding: 12px;
      }
      h1 {
        font-size: 20px;
      }
      .r {
        font-size: 15px;
        align-items: flex-start;
      }
      .b {
        width: 100%;
      }
      input {
        max-width: 130px;
      }
    }
  </style>
</head>
<body>
  <div class="w">
    <h1>Fill in the blanks.</h1>
    <div id="x"></div>
    <div id="s" class="s"></div>
    <div class="a">
      <button class="b" onclick="check()">Check Answers</button>
      <button class="b" onclick="load()">Reset</button>
    </div>
  </div>

  <script>
    // Sentences with answer blanks (all text preserved)
    const R = [
      ["1. If you have ", "determination", " in you, you can ", "achieve", " anything you need."],
      ["2. Determination is the sign of your ", "mental", " ", "strength", "."],
      ["3. Determination helps you to keep away from ", "temptations", "."],
      ["4. You give in to ", "temptations", " without thinking of the ", "consequences", "."],
      ["5. Use your ", "will power", " and ", "determination", " to control your ", "desires", "."]
    ];

    let A = [];
    const MAX_SCORE = 5;

    function load() {
      A = [];
      const x = document.getElementById('x');
      const s = document.getElementById('s');
      x.innerHTML = '';
      let n = 0;

      R.forEach(parts => {
        let c = document.createElement('div');
        c.className = 'c r';
        let d = document.createElement('div');
        d.className = 'g';

        parts.forEach((p, i) => {
          if (i % 2 === 0) {
            d.append(document.createTextNode(p));
          } else {
            let z = document.createElement('input');
            z.id = 'i' + n;
            z.autocomplete = 'off';
            z.spellcheck = false;
            A.push([z.id, p]);
            n++;
            d.append(z);
          }
        });

        c.append(d);
        x.append(c);
      });

      // Display initial score out of 5
      s.textContent = 'Score: 0 / ' + MAX_SCORE;
    }

    function check() {
      let correctCount = 0;

      A.forEach(([id, a]) => {
        let z = document.getElementById(id);
        z.classList.remove('ok', 'bad');
        if (z.value.trim().toLowerCase() === a.toLowerCase()) {
          z.classList.add('ok');
          correctCount++;
        } else {
          z.classList.add('bad');
        }
      });

      // Scale the score to be out of 5 (each of the 10 blanks is worth 0.5 points)
      let scoreOutOf5 = (correctCount / A.length) * MAX_SCORE;
      // Round to 1 decimal place if fractional, otherwise integer
      let formattedScore = Number.isInteger(scoreOutOf5) ? scoreOutOf5 : scoreOutOf5.toFixed(1);

      document.getElementById('s').textContent = 'Score: ' + formattedScore + ' / ' + MAX_SCORE;
    }

    // Initialize the quiz on load
    load();
  </script>
</body>
</html>
