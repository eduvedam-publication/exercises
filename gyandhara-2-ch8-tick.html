<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gyandhara-2-ch8-tick</title><style>*{box-sizing:border-box}body{margin:0;background:#def8ff;color:#183244;font-family:"Noto Sans Devanagari",Mangal,Arial,sans-serif}.sheet{width:min(860px,96vw);margin:12px auto;padding:18px 23px;background:white;border:3px solid #05a9d3;border-radius:22px;min-height:min(580px,95vh);display:flex;flex-direction:column}h1{font-size:clamp(19px,2.7vw,25px);color:#00a8db;margin:0 0 12px}.content{flex:1}.q{border:1.5px solid #00c5e9;background:#f0fbff;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:18px}.options{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.opt,.word{font:inherit;border:1.5px solid #ff2580;border-radius:8px;padding:6px 10px;background:white;cursor:pointer}.selected{background:#dcf9e6!important}.good{background:#d8f7de!important;border-color:#10a56a!important}.bad{background:#ffe0e0!important;border-color:#ef3939!important}.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;padding:12px;background:#e2f8ff;border-radius:12px;margin-bottom:13px}.word{border-color:#00b7e5}.slot{display:inline-flex;vertical-align:middle;justify-content:center;align-items:center;min-width:100px;min-height:35px;border:2px dashed #ff654b;border-radius:6px;background:white;padding:2px 8px;cursor:pointer}.sentence{line-height:2.3}.tfrow{display:flex;align-items:center;gap:12px}.tfrow .sentence{flex:1;line-height:1.6}.tfopts{display:flex;gap:8px}.actions{display:flex;justify-content:center;gap:8px;margin-top:15px}.actions button{border:1.5px solid #ff007a;background:white;border-radius:9px;padding:8px 17px;cursor:pointer;font-size:15px}.score{text-align:center;color:#0072bb;font-weight:bold;font-size:19px;margin-top:8px}@media(max-width:620px){.sheet{padding:12px;min-height:95vh}.q{font-size:16px;padding:9px}.tfrow{flex-wrap:wrap}.tfopts{margin-left:auto}}</style></head><body><main class="sheet"><h1>सही (✓) या गलत (✗) का चिह्न लगाइए–</h1><div class="content" id="content"></div><div class="actions"><button id="submit">Submit</button><button id="reset">Reset</button></div><div class="score" id="score">Score: 0 / 4</div></main><script>const key="gyandhara-2-ch8-tick";const labels=['(क)','(ख)','(ग)','(घ)'];const content=document.getElementById('content'),score=document.getElementById('score');let a={};try{a=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(a))}const data=[["वचन से स्त्री या पुरुष जाति का बोध होता है।", false], ["वचन से एक या अनेक का बोध होता है।", true], ["हिंदी में वचन के दो भेद हैं।", true], ["‘घड़ी’ शब्द का बहुवचन शब्द है ‘घड़े’।", false]];function render(){content.innerHTML=data.map((q,i)=>`<div class="q tfrow"><div class="sentence">${labels[i]} ${q[0]}</div><div class="tfopts"><button class="opt ${a[i]===true?'selected':''}" onclick="choose(${i},true)">✓</button><button class="opt ${a[i]===false?'selected':''}" onclick="choose(${i},false)">✗</button></div></div>`).join('')}function choose(i,v){a[i]=v;save();render()}submit.onclick=()=>{let n=0;document.querySelectorAll('.q').forEach((q,i)=>{if(a[i]===data[i][1])n++;if(typeof a[i]==='boolean')q.querySelectorAll('.opt')[a[i]?0:1].classList.add(a[i]===data[i][1]?'good':'bad')});score.textContent=`Score: ${n} / 4`};reset.onclick=()=>{a={};save();score.textContent='Score: 0 / 4';render()};render();</script></body></html>
