<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-4-ch18-tick_2</title><style>*{box-sizing:border-box}body{margin:0;background:#bafaff;color:#19323b;font-family:'Noto Sans Devanagari','Mangal',sans-serif}.wrap{width:min(1000px,96vw);margin:16px auto;background:white;border:3px solid #00a9f5;border-radius:20px;padding:24px}h1{font-size:clamp(20px,2.6vw,29px);color:#00a9f5;margin:0 0 18px}.card{background:#dffaff;border:1.5px solid #00a9f5;border-radius:11px;padding:16px;margin:10px 0;font-size:19px}.choices{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.choice{background:white;border:1px solid #00b2ff;border-radius:8px;padding:9px 20px;font:inherit;cursor:pointer}.choice.selected{background:#a4eaff;border-color:#008eea}.choice.correct{background:#c9f5d0;border-color:#19a54c}.choice.wrong{background:#ffd5d5;border-color:#ef3333}.actions{text-align:center;margin-top:25px}.actions button{background:#ff7600;color:white;border:0;border-radius:25px;padding:12px 18px;margin:3px;cursor:pointer;font-weight:bold}#score{text-align:center;color:blue;font-size:20px;font-weight:bold;margin-top:9px}@media(max-width:600px){.wrap{padding:14px}.card{font-size:16px}}</style></head><body><main class="wrap"><h1>निम्नलिखित कथनों के सामने सही (✓) या गलत (×) का चिह्न लगाइए–</h1><div id="questions"></div><div class="actions"><button type="button" onclick="submitAnswers()">Submit</button><button type="button" onclick="showAnswer()">Show Answer</button><button type="button" onclick="resetAll()">Reset</button></div><div id="score">Marks: 0 / 4</div></main><script>
const DATA=[['पृथ्वी सूर्य के चारों ओर परिक्रमा करती है।',true],['पृथ्वी एक वर्ष में सूर्य की परिक्रमा कई बार करती है।',false],['पृथ्वी के घूमने से दिन और रात होते हैं।',true],['ऋतुओं के बदलने से त्योहार भी आते हैं।',true]];
const KEY='kopal-4-ch18-tick_2';let values={};try{values=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}let checked=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(values))}catch(e){}}function render(){const root=document.getElementById('questions');root.replaceChildren();DATA.forEach(([question,answer],i)=>{let card=document.createElement('div');card.className='card';let text=document.createElement('div');text.textContent='('+['क','ख','ग','घ'][i]+') '+question;card.append(text);let choices=document.createElement('div');choices.className='choices';[[true,'सही (✓)'],[false,'गलत (×)']].forEach(([v,label])=>{let btn=document.createElement('button');btn.type='button';btn.className='choice';btn.textContent=label;if(Object.hasOwn(values,i)&&values[i]===v){btn.classList.add('selected');if(checked)btn.classList.add(v===answer?'correct':'wrong')}btn.onclick=()=>{values[i]=v;checked=false;save();render();document.getElementById('score').textContent='Marks: 0 / '+DATA.length};choices.append(btn)});card.append(choices);root.append(card)})}function submitAnswers(){checked=true;let score=DATA.reduce((n,q,i)=>n+(Object.hasOwn(values,i)&&values[i]===q[1]?1:0),0);render();document.getElementById('score').textContent='Marks: '+score+' / '+DATA.length;window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',exerciseType:'TICK',response:{answers:{...values},score,total:DATA.length}},'*')}function showAnswer(){DATA.forEach((q,i)=>values[i]=q[1]);save();submitAnswers()}function resetAll(){values={};checked=false;save();render();document.getElementById('score').textContent='Marks: 0 / '+DATA.length}render();
</script></body></html>
