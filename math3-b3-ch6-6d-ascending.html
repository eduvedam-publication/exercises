<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#e4f9fd;font-family:Arial,sans-serif}
.ex{max-width:1120px;min-height:500px;margin:auto;background:white;border:4px solid #08a8d8;border-radius:28px;padding:28px 40px;display:flex;flex-direction:column}
h1{color:#00a3dc;font-size:24px;margin:0 0 25px}.content{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 55px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:20px Georgia}.frac{display:inline-flex;flex-direction:column;text-align:center;min-width:30px}.frac span:first-child{border-bottom:1.5px solid #222}.inp{height:42px;border:2px solid red;border-radius:7px;font-size:17px;padding:4px 7px;width:78px}.wide{width:330px}
.ok{background:#dcf8df;border-color:#009b8e}.bad{background:#ffe1e1;border-color:#e43d30}
.ctrl{margin-top:auto;padding-top:28px;text-align:center}.ctrl button{border:0;border-radius:24px;background:#ff7d00;color:white;font-weight:bold;padding:12px 22px;margin:0 6px}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:14px}
@media(max-width:750px){.ex{padding:20px}.grid{grid-template-columns:1fr}.wide{width:min(100%,330px)}}
</style></head><body><main class="ex"><h1>Arrange the following fractions in ascending order.</h1><div class="content"><div class="row" style="margin-bottom:22px"><b>a.</b><span class="frac"><span>3</span><span>13</span></span>, <span class="frac"><span>9</span><span>13</span></span>, <span class="frac"><span>12</span><span>13</span></span>, <span class="frac"><span>5</span><span>13</span></span><input id="a0" class="inp wide"></div><div class="row" style="margin-bottom:22px"><b>c.</b><span class="frac"><span>2</span><span>9</span></span>, <span class="frac"><span>7</span><span>9</span></span>, <span class="frac"><span>5</span><span>9</span></span>, <span class="frac"><span>4</span><span>9</span></span><input id="a1" class="inp wide"></div><div class="row" style="margin-bottom:22px"><b>e.</b><span class="frac"><span>4</span><span>15</span></span>, <span class="frac"><span>11</span><span>15</span></span>, <span class="frac"><span>3</span><span>15</span></span>, <span class="frac"><span>14</span><span>15</span></span><input id="a2" class="inp wide"></div><div class="row" style="margin-bottom:22px"><b>d.</b><span class="frac"><span>2</span><span>25</span></span>, <span class="frac"><span>4</span><span>25</span></span>, <span class="frac"><span>3</span><span>25</span></span>, <span class="frac"><span>6</span><span>25</span></span><input id="a3" class="inp wide"></div></div><div class="ctrl"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div></main><script>const A=['3/13,5/13,9/13,12/13', '2/9,4/9,5/9,7/9', '3/15,4/15,11/15,14/15', '2/25,3/25,4/25,6/25'];function norm(x){return x.toLowerCase().replace(/\s/g,'').replace(/×/g,'x')}function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById('a'+i);let ok=norm(e.value)==norm(a);e.classList.remove('ok','bad');e.classList.add(ok?'ok':'bad');if(ok)s++});score.textContent='Score: '+s+' / 4'}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});score.textContent='Score: 0 / 4'}</script></body></html>
