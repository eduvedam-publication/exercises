<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrange the statements in the correct order.</title><style>*{box-sizing:border-box}body{margin:0;background:#dff6ff;font-family:Arial;color:#171717}.w{max-width:1000px;margin:auto;min-height:100vh;background:#fff;border:5px solid #08a9dc;border-radius:24px;padding:24px}h1{font-size:25px;color:#ff0072}.q{background:#f6fbfe;border:2px solid #a8eaff;border-radius:17px;padding:13px 16px;margin:10px 0;font-size:17px;font-weight:600}.o{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}.opt,button{border:2px solid #ff2581;background:#fff;border-radius:11px;padding:8px 12px;font-size:16px;cursor:pointer}.sel{background:#ffe4f0!important}.ok{background:#dcf8df!important}.bad{background:#ffe0e0!important}.actions{display:flex;justify-content:center;gap:10px;margin-top:18px}#result{text-align:center;font-weight:bold;margin-top:12px}input,select{border:2px solid #ff5a3d;padding:7px;border-radius:6px;font-size:16px}@media(max-width:650px){.w{border-width:3px;border-radius:0;padding:14px}}</style></head><body><main class="w"><h1>Arrange the statements in the correct order.</h1><div class="q" style="display:flex;align-items:center;gap:12px"><span style="flex:1">1. Abraham climbed the tree.</span><select id="r0"><option value="">Order</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="q" style="display:flex;align-items:center;gap:12px"><span style="flex:1">2. The bear chased the boys.</span><select id="r1"><option value="">Order</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="q" style="display:flex;align-items:center;gap:12px"><span style="flex:1">3. John lay still on the ground.</span><select id="r2"><option value="">Order</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="q" style="display:flex;align-items:center;gap:12px"><span style="flex:1">4. The bear went away.</span><select id="r3"><option value="">Order</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="q" style="display:flex;align-items:center;gap:12px"><span style="flex:1">5. Abraham and John were walking through the forest.</span><select id="r4"><option value="">Order</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="actions"><button onclick="check()">Submit</button><button onclick="location.reload()">Reset</button></div><div id="result"></div></main><script>const A=[3, 2, 4, 5, 1];function check(){let n=0;A.forEach((a,i)=>{let e=document.getElementById('r'+i),ok=+e.value===a;e.className=ok?'ok':'bad';if(ok)n++});result.textContent=`Score: ${n} / 5`}</script></body></html>
