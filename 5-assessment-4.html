<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial;color:#111}.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{color:#00a5dc;font-size:25px;margin:0 0 25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:28px}.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:white;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}input,select{border:2px solid #ff3b30;background:#fff;height:40px;font-size:18px;padding:5px 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 65px}.cmp{display:flex;align-items:center;gap:8px;font:20px Georgia}.cmp select{width:62px}</style></head><body><main class="ex"><h1>Fill in the blanks with &gt;, &lt; or =.</h1><div class="grid"><div class="cmp"><span>a. 42 ÷ 6</span><select id="a0"><option></option><option>&lt;</option><option>&gt;</option><option>=</option></select><span>54 ÷ 6</span></div><div class="cmp"><span>b. 63 ÷ 9</span><select id="a1"><option></option><option>&lt;</option><option>&gt;</option><option>=</option></select><span>63 ÷ 7</span></div><div class="cmp"><span>c. 25 ÷ 5</span><select id="a2"><option></option><option>&lt;</option><option>&gt;</option><option>=</option></select><span>40 ÷ 8</span></div><div class="cmp"><span>d. 28 ÷ 7</span><select id="a3"><option></option><option>&lt;</option><option>&gt;</option><option>=</option></select><span>42 ÷ 6</span></div><div class="cmp"><span>e. 81 ÷ 9</span><select id="a4"><option></option><option>&lt;</option><option>&gt;</option><option>=</option></select><span>36 ÷ 4</span></div><div class="cmp"><span>f. 82 ÷ 2</span><select id="a5"><option></option><option>&lt;</option><option>&gt;</option><option>=</option></select><span>78 ÷ 3</span></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score"></div><script>const ans=["<","<","=","<","=",">"];score.textContent="Score: 0 / 6";function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),o=e.value===a;e.className=o?"ok":"bad";if(o)s++});score.textContent=`Score: ${s} / 6`}function resetAll(){document.querySelectorAll("select").forEach(e=>{e.value="";e.className=""});score.textContent="Score: 0 / 6"}</script></main></body></html>
