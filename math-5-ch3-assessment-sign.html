<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Put the correct sign (<, >, =).</title><style>*{box-sizing:border-box}body{margin:0;background:#b9f8fb;font-family:Georgia,'Noto Sans Devanagari',serif;color:#17212d}.wrap{max-width:1050px;margin:18px auto;padding:22px 25px;background:white;border:3px solid #00a9f5;border-radius:20px}h1{font-size:clamp(21px,3vw,30px);color:#00a4ef;margin:0 0 20px}.q{background:#def8ff;border:1.5px solid #00a9ff;border-radius:12px;margin:10px 0;padding:13px 16px;font-size:18px}.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.opt,.chip{border:1px solid #00b4ff;background:white;border-radius:8px;padding:9px 15px;font-size:17px;cursor:pointer;color:#17212d}.opt.selected,.chip.selected{background:#a7ebff;border-color:#008fe4}.opt.correct,.chip.correct{background:#b9f3c9;border-color:#159747}.opt.wrong,.chip.wrong{background:#ffc4c4;border-color:#df3333}.actions{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:22px}button.action{border:0;border-radius:24px;background:#ff7100;color:white;padding:12px 17px;font-weight:bold;cursor:pointer}.marks{text-align:center;font:700 21px Arial;color:#0646d5;margin-top:12px}.hint{font-size:14px;color:#555;margin:8px 0}.answer{color:#087f36;font-size:15px;margin-top:6px;display:none}.answer.visible{display:block}@media(max-width:650px){.wrap{margin:5px;padding:14px}.q{padding:10px}.opt{font-size:15px}}</style></head><body><main class="wrap"><h1>Put the correct sign (<, >, =).</h1><div class="q"><b>a.</b> 1 × 2 − 2 × 3 <span class="opts" style="display:inline-flex"><button class="opt" data-q="0" data-v="<">&lt;</button><button class="opt" data-q="0" data-v=">">&gt;</button><button class="opt" data-q="0" data-v="=">=</button></span> 2 × 3 − 2 × 1<div class="answer" id="ans0">Answer: &lt;</div></div><div class="q"><b>b.</b> 2 × 4 ÷ 4 <span class="opts" style="display:inline-flex"><button class="opt" data-q="1" data-v="<">&lt;</button><button class="opt" data-q="1" data-v=">">&gt;</button><button class="opt" data-q="1" data-v="=">=</button></span> 4 × 4 ÷ 4<div class="answer" id="ans1">Answer: &lt;</div></div><div class="q"><b>c.</b> 16 ÷ 8 × 3 <span class="opts" style="display:inline-flex"><button class="opt" data-q="2" data-v="<">&lt;</button><button class="opt" data-q="2" data-v=">">&gt;</button><button class="opt" data-q="2" data-v="=">=</button></span> 16 ÷ 3 × 8<div class="answer" id="ans2">Answer: &lt;</div></div><div class="q"><b>d.</b> 27 × 2 ÷ 1 <span class="opts" style="display:inline-flex"><button class="opt" data-q="3" data-v="<">&lt;</button><button class="opt" data-q="3" data-v=">">&gt;</button><button class="opt" data-q="3" data-v="=">=</button></span> 2 × 27 ÷ 1<div class="answer" id="ans3">Answer: =</div></div><div class="actions"><button class="action" id="submit">Submit</button><button class="action" id="show">Show Answer</button><button class="action" id="reset">Reset</button></div><div class="marks" id="marks">Marks: 0 / 4</div></main><script>const KEY='math-5-ch3-assessment-sign';const correct=['<','<','<','='];let selected=JSON.parse(localStorage.getItem(KEY)||'{}');const store=KEY;const save=()=>localStorage.setItem(store,JSON.stringify(selected));function report(score,total){document.getElementById('marks').textContent=`Marks: ${score} / ${total}`;}function draw(){document.querySelectorAll('.opt').forEach(b=>{b.classList.toggle('selected',selected[b.dataset.q]===b.dataset.v);b.classList.remove('correct','wrong')})}document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{selected[b.dataset.q]=b.dataset.v;save();draw()});document.getElementById('submit').onclick=()=>{let score=0;correct.forEach((a,i)=>{if(selected[i]===a)score++;document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>{b.classList.toggle('correct',b.dataset.v===a);b.classList.toggle('wrong',b.dataset.v===selected[i]&&selected[i]!==a)})});report(score,4)};document.getElementById('show').onclick=()=>{correct.forEach((a,i)=>{document.getElementById('ans'+i).classList.add('visible');document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>b.classList.toggle('correct',b.dataset.v===a))})};document.getElementById('reset').onclick=()=>{selected={};localStorage.removeItem(KEY);draw();document.querySelectorAll('.answer').forEach(a=>a.classList.remove('visible'));report(0,4)};draw();</script></body></html>
