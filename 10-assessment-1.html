<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}
.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}
.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:700px){body{padding:0}.ex{border-radius:0;padding:16px}}.q{font:20px Georgia,"Times New Roman",serif;margin-bottom:23px}.qt{margin-bottom:10px}.opts{display:flex;flex-wrap:wrap;gap:10px 18px;margin-left:25px}.opt{min-width:130px;border:2px solid #ff1680;border-radius:11px;background:#fff;color:#111;padding:9px 15px;font-size:17px;cursor:pointer}.opt.sel{background:#fff0f6}</style></head><body><main class="ex"><h1>Choose the correct option.</h1><div class="q" data-a="1"><div class="qt">a. Which of the following is a plane shape?</div><div class="opts"><button class="opt" data-v="0">i. Cube</button><button class="opt" data-v="1">ii. Triangle</button><button class="opt" data-v="2">iii. Sphere</button><button class="opt" data-v="3">iv. Cylinder</button></div></div><div class="q" data-a="0"><div class="qt">b. Which of the following is not a plane shape?</div><div class="opts"><button class="opt" data-v="0">i. Cone</button><button class="opt" data-v="1">ii. Rectangle</button><button class="opt" data-v="2">iii. Oval</button><button class="opt" data-v="3">iv. Circle</button></div></div><div class="q" data-a="2"><div class="qt">c. 1, 5, 7, ____, 11, 13.</div><div class="opts"><button class="opt" data-v="0">i. 8</button><button class="opt" data-v="1">ii. 10</button><button class="opt" data-v="2">iii. 9</button><button class="opt" data-v="3">iv. 12</button></div></div><div class="q" data-a="3"><div class="qt">d. A sphere has ______ edges.</div><div class="opts"><button class="opt" data-v="0">i. 1</button><button class="opt" data-v="1">ii. 2</button><button class="opt" data-v="2">iii. 3</button><button class="opt" data-v="3">iv. 0</button></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div></main><script>document.querySelectorAll(".q").forEach(q=>q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{q.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel","ok","bad"));b.classList.add("sel");q.dataset.p=b.dataset.v}));function check(){let s=0;document.querySelectorAll(".q").forEach(q=>{let p=q.dataset.p;q.querySelectorAll(".opt").forEach(b=>{b.classList.remove("ok","bad");if(b.dataset.v===p)b.classList.add(p===q.dataset.a?"ok":"bad")});if(p===q.dataset.a)s++});score.textContent=`Score: ${s} / 4`}function resetAll(){document.querySelectorAll(".q").forEach(q=>{delete q.dataset.p;q.querySelectorAll(".opt").forEach(b=>b.className="opt")});score.textContent="Score: 0 / 4"}</script></body></html>
