<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>रिक्त स्थान पूर्ण कीजिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf8ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#172b3a}.exercise{width:min(92vw,850px);margin:18px auto;background:white;border:4px solid #05a9d4;border-radius:23px;padding:22px 26px;min-height:440px;display:flex;flex-direction:column}h2{font-size:24px;color:#00a8df;margin:0 0 20px}.items{flex:1}.item{background:#effbff;border:2px solid #00c7ed;border-radius:14px;padding:13px 16px;margin-bottom:11px;font-size:19px}.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.option,.word{background:white;border:2px solid #ff4080;border-radius:9px;padding:7px 13px;font-size:17px;cursor:pointer;color:#222}.option.selected{background:#d3f8e2;border-color:#06a88a}.option.good,.slot.good{background:#d9f7dc;border-color:green}.option.bad,.slot.bad{background:#ffe1e1;border-color:red}.slot{display:inline-flex;vertical-align:middle;min-width:105px;min-height:34px;border:2px dashed #ff5a4c;border-radius:5px;align-items:center;justify-content:center;padding:3px 8px;cursor:pointer;background:#fff;font-size:17px}.wordbank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px;margin-bottom:15px;background:#e1f8ff;border-radius:12px}.word.used{opacity:.35}.actions{display:flex;gap:10px;justify-content:center;margin-top:18px}button{background:#ff8500;border:0;color:white;border-radius:20px;padding:10px 18px;font-weight:bold;cursor:pointer}#result{text-align:center;color:#0061bb;font-weight:bold;font-size:20px;margin-top:10px}@media(max-width:600px){.exercise{width:100%;margin:0;padding:15px;border-radius:0}.item{font-size:17px}.opts{gap:5px}.option{font-size:15px;padding:7px}h2{font-size:21px}}</style></head><body><main class="exercise"><h2>रिक्त स्थान पूर्ण कीजिए–</h2><div id="bank" class="wordbank"></div><div id="items" class="items"></div><div class="actions"><button onclick="checkAnswers()">Submit</button><button onclick="resetExercise()">Reset</button></div><div id="result">Score: 0 / 4</div></main><script>const TYPE="drag";const items=["महात्मा गाँधी सदैव सत्य बोलते थे, वे ____ थे।", "ईश्वर सब कुछ जानता है, ईश्वर ____ है।", "रवि कविता लिखता है, रवि ____ है।", "बोलने वाले को कहते हैं ____।"];const answers=[0, 1, 2, 3];const key='gyandhara-2-ch11-practice-'+TYPE;let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(state))}function resetExercise(){state={};save();render();document.getElementById('result').textContent='Score: 0 / '+answers.length}const words=["सत्यवादी", "सर्वज्ञ", "कवि", "वक्ता"];function render(){document.getElementById('bank').innerHTML=words.map((w,j)=>`<button class="word ${Object.values(state).includes(j)?'used':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain',${j})" onclick="selectWord(${j})">${w}</button>`).join('');document.getElementById('items').innerHTML=items.map((q,i)=>`<div class="item">(${'कखगघ'[i]}) ${q.replace('____',`<span class="slot" ondragover="event.preventDefault()" ondrop="dropWord(event,${i})" onclick="place(${i})">${state[i]===undefined?'________':words[state[i]]}</span>`)}</div>`).join('')}let selected=null;function selectWord(j){selected=j;document.querySelectorAll('.word').forEach((e,i)=>e.style.outline=i===j?'3px solid #00a8df':'')}function place(i){if(selected!==null){Object.keys(state).forEach(k=>{if(state[k]===selected)delete state[k]});state[i]=selected;selected=null;save();render()}else if(state[i]!==undefined){delete state[i];save();render()}}function dropWord(e,i){e.preventDefault();selected=Number(e.dataTransfer.getData('text/plain'));place(i)}function checkAnswers(){let n=0;answers.forEach((a,i)=>{if(state[i]===a)n++});document.getElementById('result').textContent=`Score: ${n} / ${answers.length}`}render();</script></body></html>
