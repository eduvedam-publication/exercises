<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#dff8ff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:5px solid #08a6d1;border-radius:22px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;color:#ff0072;font-size:clamp(22px,3vw,30px)}.content{flex:1}.question{margin:12px 0;padding:13px 16px;border:2px solid #69dfff;border-radius:16px;background:#f3fbfe;font-size:clamp(16px,2vw,19px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option,.btn{border:2px solid #ff0072;background:#fff;border-radius:10px;padding:8px 13px;font-size:16px;cursor:pointer}.option.selected{background:#ffe7f1}.option.correct,.answer.correct,.order.correct{background:#dff7e4}.option.wrong,.answer.wrong,.order.wrong{background:#ffe2e2}.answer{border:2px solid #ff4c39;border-radius:5px;padding:6px 8px;font-size:17px;min-width:125px;max-width:205px;margin:2px 4px}.orderrow{display:flex;justify-content:space-between;align-items:center;gap:15px}.order{width:58px;border:2px solid #ff0072;border-radius:7px;padding:7px;text-align:center;font-size:17px}.bottom{text-align:center;margin-top:22px}.score{margin-top:9px;color:#087fc2;font-weight:800;font-size:18px}@media(max-width:650px){body{padding:7px}.exercise{padding:15px 11px}.options{flex-direction:column}.option{width:100%;text-align:left}.answer{min-width:100px;max-width:145px}}
.helpbox{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;background:#ffd9cf;padding:14px;border-radius:12px;margin:6px 0 20px}
.word{border:2px solid #ff0072;background:#fff;border-radius:9px;padding:8px 14px;font-size:20px;cursor:grab}
.dragrow{display:grid;grid-template-columns:1fr 240px;gap:20px;align-items:center;margin:16px 0;padding:14px 16px;border:2px solid #65dcf5;border-radius:14px;background:#f3fbfe;font-size:21px}
.drop{min-height:46px;border:2px dashed #ff4b35;border-radius:7px;background:#fff;padding:8px 12px;display:flex;align-items:center;justify-content:center}
.drop.correct{background:#dff7e4}.drop.wrong{background:#ffe2e2}
@media(max-width:700px){.dragrow{grid-template-columns:1fr}.drop{min-width:0}}
</style>
<main class="exercise">
<h1 class="title">चुनिए और लिखिए–</h1>
<div class="helpbox" id="bank"></div><div class="content" id="c"></div>
<div class="bottom"><button class="btn" onclick="check()">Submit</button><button class="btn" onclick="reset()">Reset</button><div class="score" id="sc"></div></div>
</main>
<script>function L(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function S(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){let p={exerciseType:t,response:r};try{parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}}

const K='kopal-hindi2-ch10-drag-drop',D=[["एक बार हवा को अपनी ________ पर घमंड हो गया।", "शक्ति"], ["सूरज बोला, “मैं अधिक ________ हूँ।”", "बलवान"], ["हवा ________ से चलने लगी।", "तेजी"], ["सूरज तेजी से ________ लगा।", "चमकने"]],W=["जीत", "शक्ति", "बलवान", "गतिमान", "धीरे", "तेजी", "चमकने", "अस्त होने"];
let s=L(K);s.a=s.a||{};s.score=s.score||0;let chosen='';
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function draw(){
 bank.innerHTML=W.map(w=>`<span class=word draggable=true data-w="${w}" ondragstart="event.dataTransfer.setData('text/plain',this.dataset.w)" onclick="chosen=this.dataset.w">${w}</span>`).join('');
 c.innerHTML=D.map((r,i)=>`<div class=dragrow><div><b>${['(क)','(ख)','(ग)','(घ)'][i]}</b> &nbsp;${r[0]}</div>
 <div class=drop id=d${i} ondragover="event.preventDefault()" ondrop="dp(event,${i})" onclick="pl(${i})">${esc(s.a[i]||'')}</div></div>`).join('');
 sc.textContent=`Score: ${s.score} / 4`;
}
function setv(i,v){s.a[i]=v;S(K,s);draw()}
function pl(i){if(chosen){setv(i,chosen);chosen=''}}
function dp(e,i){e.preventDefault();setv(i,e.dataTransfer.getData('text/plain'))}
function check(){
 let n=0;
 D.forEach((r,i)=>{let e=document.getElementById('d'+i),ok=(s.a[i]||'')===r[1];e.classList.toggle('correct',ok);e.classList.toggle('wrong',!!s.a[i]&&!ok);if(ok)n++});
 s.score=n;S(K,s);sc.textContent=`Score: ${n} / 4`;
 let x={};D.forEach((_,i)=>x['question'+(i+1)]=s.a[i]||'');send('DRAG_DROP',x);
}
function reset(){s={a:{},score:0};chosen='';S(K,s);draw()}draw();
</script>
