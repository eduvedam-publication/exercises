<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find the product of each of the following:</title><style>*{box-sizing:border-box}body{margin:0;background:#d5faff;font-family:Georgia,'Times New Roman',serif;color:#17242b}.sheet{width:min(1040px,calc(100% - 28px));margin:24px auto;background:white;border:3px solid #00afe3;border-radius:22px;padding:24px 28px}h2{margin:0 0 18px;color:#00a9df;font-size:26px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.q{background:#ebfaff;border:1px solid #00b9ee;border-radius:12px;padding:14px;font-size:18px}.qline{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.q input{border:2px solid #ff655a;border-radius:3px;padding:8px;font-size:17px;min-width:0;width:155px;background:white}.q input.good,.opt.good{border-color:#1fa75b!important;background:#e4ffec}.q input.bad,.opt.bad{border-color:#e33!important;background:#ffe5e5;animation:blink .8s 2}@keyframes blink{50%{background:#fff}}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:24px 0 0}button{border:0;border-radius:25px;background:#ff8100;color:white;padding:11px 19px;font-size:15px;font-weight:700;cursor:pointer}.opt{background:#fff;border:1px solid #80d9fa;border-radius:8px;padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}.opt.selected{background:#d9f4ff;border:2px solid #00a9e5}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.mark{border:2px solid #00b4ef;width:23px;height:23px;flex:none;display:inline-flex;align-items:center;justify-content:center}.opt.selected .mark:after{content:'✓';color:#007db3;font-weight:bold}@media(max-width:650px){.sheet{padding:16px 12px}.grid,.options{grid-template-columns:1fr}.q{font-size:16px}h2{font-size:23px}}</style></head><body><main class="sheet"><h2>Find the product of each of the following:</h2><section class="grid" id="questions"></section><div class="controls"><button onclick="check()">Check Answers</button><button onclick="show()">Show Answer</button><button onclick="reset()">Reset</button></div></main><script>const TYPE='assessment-product';const key='math4-ch11-'+TYPE;let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(answers));}function clearFeedback(){document.querySelectorAll('.good,.bad').forEach(e=>e.classList.remove('good','bad'));}function norm(s){return String(s).toLowerCase().replace(/₹|rs\.?|rupees?/g,'').replace(/[,\s]/g,'').trim();}const data=[["₹44.24 × 23", "₹1017.52"], ["₹23.95 × 42", "₹1005.90"], ["₹93.56 × 32", "₹2993.92"], ["₹67.33 × 76", "₹5117.08"]];function render(){let root=document.getElementById('questions');root.innerHTML='';data.forEach((q,i)=>{let div=document.createElement('div');div.className='q';let line=document.createElement('div');line.className='qline';let label=document.createElement('span');label.textContent=String.fromCharCode(97+i)+'.  '+q[0]+' =';let inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.setAttribute('aria-label','Answer '+String.fromCharCode(97+i));inp.value=answers[i]||'';inp.oninput=()=>{answers[i]=inp.value;inp.classList.remove('good','bad');save()};line.append(label,inp);div.append(line);root.append(div)})}function check(){document.querySelectorAll('input').forEach((inp,i)=>{inp.classList.remove('good','bad');inp.classList.add(norm(inp.value)===norm(data[i][1])?'good':'bad')})}function show(){data.forEach((q,i)=>answers[i]=q[1]);save();render();check()}function reset(){answers={};save();render()}render();</script></body></html>
