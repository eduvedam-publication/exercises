<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>‘ई’ लगाकर नए शब्द बनाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#cff9ff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#19212b}.wrap{max-width:980px;margin:24px auto;padding:24px;border:3px solid #00aeed;border-radius:22px;background:white}h2{color:#00a5e6;margin:0 0 20px;font-size:27px}.q{background:#ebfaff;border:1.5px solid #00b7ff;border-radius:12px;margin:9px 0;padding:14px;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.opt{background:white;border:1px solid #92dfff;border-radius:9px;padding:11px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:18px}.opt.selected{background:#dbf2ff;border:2px solid #00a6ef}.correct{background:#d9ffe8!important;border-color:#19a65a!important}.wrong{background:#ffe4e4!important;border-color:#f34d4d!important}.controls{text-align:center;margin-top:24px}button.action{border:0;border-radius:24px;background:#ff7900;color:white;font-weight:bold;padding:11px 19px;margin:3px;cursor:pointer}.marks{text-align:center;color:#0048bf;font-weight:bold;font-size:19px;margin-top:10px}.bank{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;background:#dff8ff;border-radius:12px;padding:14px;margin-bottom:14px}.chip{background:white;border:1.5px solid #00aaff;border-radius:9px;padding:8px 13px;cursor:grab;font-size:19px}.chip.active{background:#ffe6c2;border-color:#ff7b00}.chip.used{opacity:.35}.blank{display:inline-flex;min-width:140px;min-height:39px;align-items:center;justify-content:center;border:2px dashed #ff704d;border-radius:8px;vertical-align:middle;margin:0 5px;padding:4px 9px;cursor:pointer;background:white;font-size:18px}.example{background:#d6ffea;border:2px solid #13a65e;border-radius:7px;padding:5px 10px}.rowq{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.word{min-width:105px;font-weight:bold}@media(max-width:650px){.wrap{margin:6px;padding:13px}.opts{grid-template-columns:1fr}h2{font-size:23px}.q{font-size:17px}}
.opts{grid-template-columns:repeat(3,minmax(0,1fr))}.opt{font-family:inherit;text-align:left}.opt .square{width:24px;height:24px;border:2px solid #00b5f5;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.opt.selected .square::after{content:'✓';color:#005dc2}.question{font-size:19px;margin-bottom:9px}.sub{font-size:16px;color:#555} @media(max-width:650px){.opts{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h2>‘ई’ लगाकर नए शब्द बनाइए–</h2><div class="bank" id="bank"></div><div class="q rowq"><span>(क) बेटा –</span><span class="blank" data-i="0" onclick="put(0)" ondragover="event.preventDefault()" ondrop="drop(event,0)"></span></div><div class="q rowq"><span>(ख) उनका –</span><span class="blank" data-i="1" onclick="put(1)" ondragover="event.preventDefault()" ondrop="drop(event,1)"></span></div><div class="q rowq"><span>(ग) घंटा –</span><span class="blank" data-i="2" onclick="put(2)" ondragover="event.preventDefault()" ondrop="drop(event,2)"></span></div><div class="q rowq"><span>(घ) अच्छा –</span><span class="blank" data-i="3" onclick="put(3)" ondragover="event.preventDefault()" ondrop="drop(event,3)"></span></div><div class="q rowq"><span>(ङ) सच्चा –</span><span class="blank" data-i="4" onclick="put(4)" ondragover="event.preventDefault()" ondrop="drop(event,4)"></span></div><div class="q rowq"><span>(च) मेरा –</span><span class="blank" data-i="5" onclick="put(5)" ondragover="event.preventDefault()" ondrop="drop(event,5)"></span></div><div class="controls"><button class="action" onclick="check()">Submit</button><button class="action" onclick="showAnswer()">Show Answer</button><button class="action" onclick="resetAll()">Reset</button></div><div class="marks" id="marks">Marks: 0 / 6</div><script>const KEY="kopal-4-ch7-ee.html",words=["बेटी", "उनकी", "घंटी", "अच्छी", "सच्ची", "मेरी"],answers=["बेटी", "उनकी", "घंटी", "अच्छी", "सच्ची", "मेरी"];let state=JSON.parse(localStorage.getItem(KEY)||'{}'),active=null;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function render(){let bank=document.getElementById('bank');bank.innerHTML='';words.forEach((w,j)=>{let b=document.createElement('button');b.type='button';b.className='chip'+(active===j?' active':'')+(Object.values(state).includes(w)?' used':'');b.textContent=w;b.draggable=true;b.onclick=()=>{active=j;render()};b.ondragstart=e=>e.dataTransfer.setData('text/plain',String(j));bank.append(b)});document.querySelectorAll('.blank').forEach(e=>{e.textContent=state[e.dataset.i]||'';e.classList.remove('correct','wrong')})}function place(i,j){let w=words[j];if(w===undefined)return;Object.keys(state).forEach(k=>{if(state[k]===w)delete state[k]});state[i]=w;active=null;save();render()}function put(i){if(active!==null)place(i,active);else if(state[i]){delete state[i];save();render()}}function drop(e,i){e.preventDefault();place(i,Number(e.dataTransfer.getData('text/plain')))}function check(){let n=0;document.querySelectorAll('.blank').forEach(e=>{let ok=state[e.dataset.i]===answers[e.dataset.i];e.classList.add(ok?'correct':'wrong');if(ok)n++});document.getElementById('marks').textContent='Marks: '+n+' / 6'}function showAnswer(){document.querySelectorAll('.blank').forEach(e=>state[e.dataset.i]=answers[e.dataset.i]);save();render();check()}function resetAll(){state={};active=null;save();render();document.getElementById('marks').textContent='Marks: 0 / 6'}render();</script></main></body></html>
