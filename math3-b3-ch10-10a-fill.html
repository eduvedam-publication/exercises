<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B3 Ch10 10a Fill</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e2f8fc;font-family:Georgia,"Times New Roman",serif}
.card{
 width:min(1080px,calc(100% - 24px)); min-height:430px; margin:14px auto;
 background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:34px 42px;
 display:flex;flex-direction:column
}
h1{font:700 25px Arial;color:#00a1db;margin:0 0 28px}
.questions{display:grid;gap:20px;flex:1}
.q{font-size:21px;line-height:1.6;display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.letter{width:30px}
input{width:150px;height:40px;border:2px solid #ff2b22;padding:5px 8px;font:18px Arial;background:#fff}
input.ok{background:#dff7df;border-color:#198c3d}
input.bad{background:#ffe1e1;border-color:#d92c2c}
.footer{margin-top:auto;text-align:center;padding-top:28px}
button{border:0;border-radius:25px;background:#ff7b00;color:#fff;padding:13px 22px;margin:0 6px;font:bold 14px Arial;cursor:pointer}
.score{margin-top:14px;color:#064bb4;font:bold 22px Arial}
@media(max-width:650px){.card{padding:25px 20px}.q{font-size:18px}input{width:125px}}
</style>
</head>
<body>
<main class="card">
<h1>Fill in the blanks.</h1>
<div class="questions">
 <div class="q"><span class="letter">a.</span><span>A line segment has</span><input id="a0" autocomplete="off"><span>end points.</span></div>
 <div class="q"><span class="letter">b.</span><span>A ray has</span><input id="a1" autocomplete="off"><span>end points.</span></div>
 <div class="q"><span class="letter">c.</span><span>A dot (.) represents a</span><input id="a2" autocomplete="off"></div>
 <div class="q"><span class="letter">d.</span><span>A line contains</span><input id="a3" autocomplete="off"><span>points.</span></div>
</div>
<div class="footer">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetAll()">Reset</button>
 <div class="score" id="score">Score: 0 / 4</div>
</div>
</main>
<script>
const answers=[["two","2"],["one","1"],["point"],["infinite"]];
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");
function checkAnswers(){
 let score=0;
 answers.forEach((valid,i)=>{
   const el=document.getElementById("a"+i);
   const ok=valid.includes(norm(el.value));
   el.className=ok?"ok":"bad";
   if(ok) score++;
 });
 document.getElementById("score").textContent=`Score: ${score} / 4`;
}
function resetAll(){
 answers.forEach((_,i)=>{const e=document.getElementById("a"+i);e.value="";e.className=""});
 document.getElementById("score").textContent="Score: 0 / 4";
}
</script>
</body>
</html>
