<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convert rupees to paise</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#222}
.exercise{max-width:950px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 28px;color:#00a5dc;font-size:25px}
.questions{display:grid;grid-template-columns:1fr 1fr;gap:22px 80px;padding:0 25px}
.q{display:grid;grid-template-columns:30px 75px 25px 110px;align-items:center;gap:8px;font-family:Georgia,"Times New Roman",serif;font-size:21px}
.answer{width:105px;height:40px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:5px 8px;outline:none}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:32px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:650px){
 .questions{grid-template-columns:1fr;padding:0}
 .exercise{margin:0;border-radius:0;padding:16px}
}
</style>
</head>
<body>
<main class="exercise">
<h1>Convert rupees to paise.</h1>

<div class="questions">
 <div class="q"><span>a.</span><span>₹ 5</span><span>=</span><input id="a0" class="answer"></div>
 <div class="q"><span>b.</span><span>₹ 8</span><span>=</span><input id="a1" class="answer"></div>
 <div class="q"><span>c.</span><span>₹ 3</span><span>=</span><input id="a2" class="answer"></div>
 <div class="q"><span>d.</span><span>₹ 9</span><span>=</span><input id="a3" class="answer"></div>
 <div class="q"><span>e.</span><span>₹ 6</span><span>=</span><input id="a4" class="answer"></div>
 <div class="q"><span>f.</span><span>₹ 4</span><span>=</span><input id="a5" class="answer"></div>
</div>

<div class="actions">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetExercise()">Reset</button>
</div>
<div id="result">Score: 0 / 6</div>
</main>

<script>
const answers=["500","800","300","900","600","400"];

function clean(v){
 return v.toLowerCase().trim().replace(/\s+/g,"").replace(/paise|p/g,"");
}

function checkAnswers(){
 let score=0;
 answers.forEach((ans,i)=>{
   const e=document.getElementById("a"+i);
   const ok=clean(e.value)===ans;
   e.className="answer "+(ok?"ok":"bad");
   if(ok)score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 6`;
}

function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{
   e.value="";
   e.className="answer";
 });
 document.getElementById("result").textContent="Score: 0 / 6";
}
</script>
</body>
</html>
