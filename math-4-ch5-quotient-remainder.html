<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find the quotient and the remainder.</title><style>*{box-sizing:border-box}body{margin:0;background:#dcfaff;font-family:Georgia,serif;color:#252525}.exercise{max-width:1000px;margin:24px auto;padding:25px 28px;background:white;border:3px solid #00a8dc;border-radius:25px}h2{color:#00a9dd;font-size:25px;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 24px}.q{display:flex;align-items:center;gap:8px;padding:12px;background:#ecfaff;border:1px solid #00b9f0;border-radius:12px;font-size:20px;flex-wrap:wrap}.q b{min-width:24px}.ans{border:2px solid #ff5360;background:white;padding:6px;width:88px;font:19px Georgia,serif;outline:none;border-radius:3px}.ans.good{border-color:#159a43;background:#e5ffe9}.ans.bad{border-color:#e32230;background:#ffe3e3;animation:blink .45s 3}@keyframes blink{50%{background:#ff6d78}}.actions{display:flex;gap:12px;justify-content:center;margin-top:28px}button{background:#ff8500;color:white;border:0;border-radius:24px;padding:11px 21px;font-weight:bold;cursor:pointer}#score{color:#004dc3;text-align:center;font:bold 21px Arial;margin-top:14px}.pair{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pair label{font-size:16px}.pair .ans{width:65px}@media(max-width:650px){.exercise{margin:8px;padding:15px}.grid{grid-template-columns:1fr}.q{font-size:18px}h2{font-size:22px}}</style></head><body><main class="exercise"><h2>Find the quotient and the remainder.</h2><div class="grid"><div class="q"><b>a.</b><span>156 ÷ 8</span><div class="pair"><label>Quotient: <input class="ans" id="a0" inputmode="numeric" autocomplete="off"></label><label>Remainder: <input class="ans" id="a1" inputmode="numeric" autocomplete="off"></label></div></div><div class="q"><b>b.</b><span>365 ÷ 6</span><div class="pair"><label>Quotient: <input class="ans" id="a2" inputmode="numeric" autocomplete="off"></label><label>Remainder: <input class="ans" id="a3" inputmode="numeric" autocomplete="off"></label></div></div><div class="q"><b>c.</b><span>748 ÷ 9</span><div class="pair"><label>Quotient: <input class="ans" id="a4" inputmode="numeric" autocomplete="off"></label><label>Remainder: <input class="ans" id="a5" inputmode="numeric" autocomplete="off"></label></div></div><div class="q"><b>d.</b><span>326 ÷ 10</span><div class="pair"><label>Quotient: <input class="ans" id="a6" inputmode="numeric" autocomplete="off"></label><label>Remainder: <input class="ans" id="a7" inputmode="numeric" autocomplete="off"></label></div></div></div><div class="actions"><button type="button" onclick="checkAnswers()">Check Answers</button><button type="button" onclick="resetExercise()">Reset</button></div></main><script>const expected=["19", "4", "60", "5", "83", "1", "32", "6"];const key='math4:'+location.pathname.split('/').pop();const inputs=[...document.querySelectorAll('.ans')];function save(){try{localStorage.setItem(key,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}function restore(){try{let a=JSON.parse(localStorage.getItem(key)||'[]');inputs.forEach((x,i)=>x.value=a[i]||'')}catch(e){}}function checkAnswers(){let score=0;inputs.forEach((x,i)=>{let good=x.value.trim()!==''&&Number(x.value.trim())===Number(expected[i]);x.classList.remove('good','bad');void x.offsetWidth;x.classList.add(good?'good':'bad');if(good)score++});document.getElementById('score').textContent=`Score: ${score} / ${expected.length}`;save()}function resetExercise(){inputs.forEach(x=>{x.value='';x.classList.remove('good','bad')});document.getElementById('score').textContent=`Score: 0 / ${expected.length}`;try{localStorage.removeItem(key)}catch(e){}}inputs.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('good','bad');save()}));restore();</script></body></html>
