<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divide using the repeated subtraction.</title><style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#222}
.exercise{max-width:950px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}
.q{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:Georgia,'Times New Roman',serif;font-size:21px}
.answer{height:38px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:4px 6px;outline:none}
.answer.ok{background:#dcf8df;border-color:#009b8e}.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:white;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:600px){.exercise{margin:0;border-radius:0;padding:16px}}
</style></head><body><main class="exercise">
<h1>Divide using the repeated subtraction.</h1>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:0 15px">
<div class="q"><span>a.</span><span>24 ÷ 6</span><input id="a0" class="answer" inputmode="numeric" style="width:58px"></div>
<div class="q"><span>b.</span><span>8 ÷ 2</span><input id="a1" class="answer" inputmode="numeric" style="width:58px"></div>
<div class="q"><span>c.</span><span>12 ÷ 4</span><input id="a2" class="answer" inputmode="numeric" style="width:58px"></div>
<div class="q"><span>d.</span><span>18 ÷ 6</span><input id="a3" class="answer" inputmode="numeric" style="width:58px"></div>
</div>
<div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div>
<div id="result">Score: 0 / 4</div></main>
<script>
const answers=['4', '4', '3', '3'];
function checkAnswers(){
 let score=0;
 answers.forEach((v,i)=>{let e=document.getElementById("a"+i);let ok=e.value.trim().toLowerCase()===v.toLowerCase();
 e.className="answer "+(ok?"ok":"bad");if(ok)score++;});
 document.getElementById("result").textContent=`Score: ${score} / 4`;
}
function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{e.value="";e.className="answer"});
 document.getElementById("result").textContent="Score: 0 / 4";
}
</script></body></html>
