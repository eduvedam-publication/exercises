<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-2-ch9-uddeshya-vidheya.html</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:440px;display:flex;flex-direction:column}h2{font-size:23px;color:#ff0066;margin:0 0 16px}.q{background:#effaff;border:1.5px solid #00c4ed;border-radius:12px;padding:12px 15px;margin:6px 0;font-size:18px;line-height:1.9}.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#e2f8ff;padding:12px;border-radius:10px;margin-bottom:14px}.chip{border:1.5px solid #00a9dc;border-radius:7px;background:#fff;padding:6px 12px;font-size:18px;cursor:grab;font-family:inherit}.chip.sel{background:#c8eaff}.chip.used{opacity:.4}.blank{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:125px;min-height:35px;border:2px dashed #ff5b52;border-radius:6px;padding:2px 7px;cursor:pointer;background:#fff}.ok{background:#d9f8dc!important;border-color:#24ad54!important}.bad{background:#ffe2e2!important;border-color:#f33!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff8080}}.options{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.opt{font:inherit;font-size:16px;border:1.5px solid #ff0066;background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}.opt.selected{background:#dcefff}.actions{display:flex;justify-content:center;gap:12px;margin-top:auto;padding-top:24px}button.action{background:#ff8700;color:white;border:0;border-radius:18px;padding:9px 21px;font-weight:bold;cursor:pointer}#result{text-align:center;color:#0755af;font-weight:bold;margin-top:12px}.answer{border:1.5px solid #ff6b59;border-radius:7px;padding:7px;font:18px Arial,"Noto Sans Devanagari",sans-serif;width:100%;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:16px;color:#555}@media(max-width:650px){.wrap{margin:4px;padding:14px;min-height:calc(100vh - 8px)}h2{font-size:21px}.q{font-size:16px}.two{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h2>उद्देश्य तथा विधेय को अलग-अलग कीजिए–</h2><p class="hint">प्रत्येक वाक्य के उद्देश्य और विधेय लिखिए।</p><div class="q">(क) सीता भोजन बनाती है।<div class="two"><label>उद्देश्य<input class="answer" data-i="0" placeholder="उद्देश्य लिखिए"></label><label>विधेय<input class="answer" data-i="1" placeholder="विधेय लिखिए"></label></div></div><div class="q">(ख) वे क्रिकेट खेल रहे हैं।<div class="two"><label>उद्देश्य<input class="answer" data-i="2" placeholder="उद्देश्य लिखिए"></label><label>विधेय<input class="answer" data-i="3" placeholder="विधेय लिखिए"></label></div></div><div class="q">(ग) हवाई जहाज़ आसमान में उड़ रहा है।<div class="two"><label>उद्देश्य<input class="answer" data-i="4" placeholder="उद्देश्य लिखिए"></label><label>विधेय<input class="answer" data-i="5" placeholder="विधेय लिखिए"></label></div></div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="resetExercise()">Reset</button></div><div id="result">उत्तर सुरक्षित नहीं किए गए हैं।</div></main><script>const key='kopal-2-ch9-uddeshya-vidheya',fields=[...document.querySelectorAll('.answer')];function save(){localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}fields.forEach(f=>f.addEventListener('input',save));function submit(){save();document.getElementById('result').textContent='उत्तर सुरक्षित हैं।'}function resetExercise(){fields.forEach(f=>f.value='');save();document.getElementById('result').textContent='उत्तर साफ़ कर दिए गए हैं।'}try{JSON.parse(localStorage.getItem(key)||'[]').forEach((v,i)=>{if(fields[i])fields[i].value=v||''})}catch(e){}</script></body></html>
