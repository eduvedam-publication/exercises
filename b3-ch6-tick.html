<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Put a (✓) against the honest actions and a (×) against the dishonest ones.</title><style>*{box-sizing:border-box}body{margin:0;background:#dff6ff;font-family:Arial;color:#171717}.w{max-width:1000px;margin:auto;min-height:100vh;background:#fff;border:5px solid #08a9dc;border-radius:24px;padding:24px}h1{font-size:25px;color:#ff0072}.q{background:#f6fbfe;border:2px solid #a8eaff;border-radius:17px;padding:13px 16px;margin:10px 0;font-size:17px;font-weight:600}.o{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}.opt,button{border:2px solid #ff2581;background:#fff;border-radius:11px;padding:8px 12px;font-size:16px;cursor:pointer}.sel{background:#ffe4f0!important}.ok{background:#dcf8df!important}.bad{background:#ffe0e0!important}.actions{display:flex;justify-content:center;gap:10px;margin-top:18px}#result{text-align:center;font-weight:bold;margin-top:12px}input,select{border:2px solid #ff5a3d;padding:7px;border-radius:6px;font-size:16px}@media(max-width:650px){.w{border-width:3px;border-radius:0;padding:14px}}</style></head><body><main class="w"><h1>Put a (✓) against the honest actions and a (×) against the dishonest ones.</h1><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:10px"><span style="flex:1 1 400px">1. Returning something that does not belong to you.</span><div class="o" style="margin:0"><button class="opt" data-q="0" data-v="0" onclick="pick(this)">✓</button><button class="opt" data-q="0" data-v="1" onclick="pick(this)">×</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:10px"><span style="flex:1 1 400px">2. Copying a friend&#x27;s answers in a test.</span><div class="o" style="margin:0"><button class="opt" data-q="1" data-v="0" onclick="pick(this)">✓</button><button class="opt" data-q="1" data-v="1" onclick="pick(this)">×</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:10px"><span style="flex:1 1 400px">3. Admitting your mistake.</span><div class="o" style="margin:0"><button class="opt" data-q="2" data-v="0" onclick="pick(this)">✓</button><button class="opt" data-q="2" data-v="1" onclick="pick(this)">×</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:10px"><span style="flex:1 1 400px">4. Hiding the truth to avoid punishment.</span><div class="o" style="margin:0"><button class="opt" data-q="3" data-v="0" onclick="pick(this)">✓</button><button class="opt" data-q="3" data-v="1" onclick="pick(this)">×</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:10px"><span style="flex:1 1 400px">5. Telling the truth even when it is difficult.</span><div class="o" style="margin:0"><button class="opt" data-q="4" data-v="0" onclick="pick(this)">✓</button><button class="opt" data-q="4" data-v="1" onclick="pick(this)">×</button></div></div><div class="actions"><button onclick="check()">Submit</button><button onclick="location.reload()">Reset</button></div><div id="result"></div></main><script>const A=[0, 1, 0, 1, 0],S={};function pick(e){document.querySelectorAll(`[data-q="${e.dataset.q}"]`).forEach(x=>x.classList.remove('sel'));e.classList.add('sel');S[e.dataset.q]=+e.dataset.v}function check(){let n=0;A.forEach((a,i)=>{if(S[i]===a)n++});result.textContent=`Score: ${n} / ${A.length}`}</script></body></html>
