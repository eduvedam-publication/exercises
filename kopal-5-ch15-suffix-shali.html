<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOPAL Class 5 Chapter 15 suffix-shali — 2026–27</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#17333b}.wrap{max-width:1000px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a7dd;margin:0 0 8px;font-size:26px}.marks{color:#47717e;font-size:15px;margin:0 0 18px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:13px;margin:10px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.opt{border:1px solid #93dcf5;background:white;border-radius:8px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}.opt.sel{background:#d8f3ff;border-color:#009be0}.opt.correct{background:#dcfce5!important;border-color:#22aa55!important}.opt.wrong{background:#ffe3e3!important;border-color:#ff4545!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.actions button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}#score{text-align:center;color:#0073bd;font-size:19px;font-weight:bold;margin-top:14px}@media(max-width:620px){.wrap{margin:7px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}.example{background:#eafaff;border-radius:10px;padding:14px;margin:12px 0;font-size:19px}.entry{font:inherit;width:100%;max-width:380px;border:2px dashed #ff724d;border-radius:8px;padding:10px;background:white}.q{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.entry:focus{outline:2px solid #009be0}</style></head><body><main class="wrap"><h2>उदाहरण के अनुसार तीन शब्द बनाइए–</h2><div class="example">शक्ति + शाली = शक्तिशाली</div><p class="marks">‘शाली’ से बने तीन अलग-अलग शब्द लिखिए। कुल अंक: 3</p><div id="questions"></div><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 3</div></main><script>
const key='kopal-5-ch15-suffix-shali';const examples=['बलशाली','धनशाली','प्रभावशाली'];const valid=['बलशाली','धनशाली','प्रभावशाली','गुणशाली','वैभवशाली','प्रतापशाली','तेजशाली','भाग्यशाली','गौरवशाली','यशशाली','कीर्तिशाली','ऐश्वर्यशाली','सौभाग्यशाली','प्रतिभाशाली','संपत्तिशाली'];let answers=['','',''];try{let v=JSON.parse(localStorage.getItem(key));if(Array.isArray(v)&&v.length===3)answers=v.map(x=>typeof x==='string'?x:'')}catch(e){}
function normalize(s){return s.normalize('NFC').replace(/[\s।.,]/g,'')}
function persist(){try{localStorage.setItem(key,JSON.stringify(answers))}catch(e){}}
function render(){document.getElementById('questions').innerHTML=answers.map((_,i)=>`<div class="q"><label for="a${i}">(${'कखग'[i]})</label><input class="entry" id="a${i}" aria-label="शब्द ${i+1}" autocomplete="off" oninput="update(${i},this.value)"></div>`).join('');answers.forEach((a,i)=>document.getElementById('a'+i).value=a)}
function update(i,v){answers[i]=v;persist();for(let j=0;j<3;j++)document.getElementById('a'+j).classList.remove('correct','wrong');document.getElementById('score').textContent='प्राप्तांक: — / 3'}
function check(){const seen=new Set;let n=0;answers.forEach((a,i)=>{let v=normalize(a),ok=valid.includes(v)&&!seen.has(v);if(ok){n++;seen.add(v)}const el=document.getElementById('a'+i);el.classList.remove('correct','wrong');if(v)el.classList.add(ok?'correct':'wrong')});document.getElementById('score').textContent=`प्राप्तांक: ${n} / 3`}
function showAnswers(){answers=[...examples];persist();render();check()}
function resetAll(){answers=['','',''];try{localStorage.removeItem(key)}catch(e){}render();document.getElementById('score').textContent='प्राप्तांक: 0 / 3'}render();
</script></body></html>
