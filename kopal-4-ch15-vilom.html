<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kopal 4 Chapter 15 Vilom</title><style>*{box-sizing:border-box}body{margin:0;background:#c9faff;font-family:"Noto Sans Devanagari","Mangal",sans-serif;color:#202b35}.wrap{width:min(1050px,95vw);margin:24px auto;background:#fff;border:3px solid #00aeed;border-radius:23px;padding:25px}h2{margin:0 0 18px;color:#00a8e6;font-size:25px}.q{background:#e9faff;border:1.5px solid #00b7fa;border-radius:12px;padding:14px;margin:10px 0}.prompt{font-size:18px;margin-bottom:10px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.opt{background:#fff;border:1px solid #8adcf9;border-radius:9px;padding:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:49px}.opt.sel{border:2px solid #008ff0;background:#d5f4ff}.opt.good,.slot.good{border:2px solid #22aa55!important;background:#e0ffe9!important}.opt.bad,.slot.bad{border:2px solid #f04747!important;background:#ffe2e2!important}.square{border:1.5px solid #00a9fa;border-radius:3px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:#0068d9;font-weight:800}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:23px 0 10px}button.action{border:0;border-radius:28px;background:#ff8000;color:#fff;padding:12px 20px;cursor:pointer;font-weight:bold}.marks{text-align:center;color:#0058bd;font-size:19px;font-weight:bold}.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#def8ff;padding:15px;border-radius:12px;margin-bottom:12px}.chip{background:#fff;border:1px solid #00a9ff;border-radius:8px;padding:9px 15px;cursor:grab;font-size:18px}.chip.chosen{background:#b6eefe;outline:2px solid #008cdb}.chip.used{opacity:.45}.slot{display:inline-flex;min-width:135px;min-height:43px;border:2px dashed #f87c62;border-radius:8px;background:#fff;align-items:center;justify-content:center;padding:5px 10px;cursor:pointer;font-size:18px}.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:700px){.wrap{padding:15px}.opts,.rows{grid-template-columns:1fr}h2{font-size:21px}}</style><main class="wrap"><h2>निम्नलिखित शब्दों के विलोम शब्द पाठ में से छाँटकर लिखिए–</h2><div class="bank" id="bank"></div><div class="rows" id="rows"></div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="showAnswer()">Show Answer</button><button class="action" onclick="resetAll()">Reset</button></div><div class="marks" id="marks"></div></main><script>const words=["जन्म", "शांति", "निर्बल", "प्रकाश", "शिक्षा", "मित्र"],answers=["मृत्यु", "अशांति", "प्रबल", "अंधेरा", "अशिक्षा", "शत्रु"],key='kopal-4-ch15-vilom-v1';let slots;try{slots=JSON.parse(localStorage.getItem(key))}catch(e){}if(!Array.isArray(slots)||slots.length!==words.length)slots=Array(words.length).fill(null);let active=null;function save(){localStorage.setItem(key,JSON.stringify(slots))}function render(){const used=new Set(slots.filter(x=>x!==null));document.getElementById('bank').innerHTML=answers.map((w,i)=>`<button class="chip ${active===i?'chosen':''} ${used.has(i)?'used':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain',${i})" onclick="pick(${i})">${w}</button>`).join('');document.getElementById('rows').innerHTML=words.map((w,i)=>`<div class="q line"><strong>(${['क','ख','ग','घ','ङ','च'][i]}) ${w} ×</strong><div class="slot" ondragover="event.preventDefault()" ondrop="event.preventDefault();place(${i},Number(event.dataTransfer.getData('text/plain')))" onclick="place(${i},active)">${slots[i]===null?'यहाँ रखें':answers[slots[i]]}</div><button onclick="clearSlot(${i})" style="background:none;border:0;cursor:pointer" aria-label="Remove">✕</button></div>`).join('')}function pick(i){active=i;render()}function place(i,j){if(j===null||j<0||j>=answers.length)return;slots=slots.map((v,k)=>k!==i&&v===j?null:v);slots[i]=j;active=null;save();render()}function clearSlot(i){slots[i]=null;save();render()}function submit(){render();let n=0;document.querySelectorAll('#rows .slot').forEach((el,i)=>{if(slots[i]!==null){const ok=slots[i]===i;if(ok)n++;el.classList.add(ok?'good':'bad')}});document.getElementById('marks').textContent=`Marks: ${n} / ${words.length}`}function showAnswer(){slots=words.map((_,i)=>i);save();submit()}function resetAll(){slots=Array(words.length).fill(null);active=null;save();render();document.getElementById('marks').textContent=`Marks: 0 / ${words.length}`}render();document.getElementById('marks').textContent=`Marks: 0 / ${words.length}`;</script></html>
