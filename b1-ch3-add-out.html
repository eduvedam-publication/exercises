<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Odd One Out</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;
 background:linear-gradient(135deg,#dff8ff,#fff,#fff0f8);
 display:flex;justify-content:center;align-items:center;padding:14px;color:#253642
}
.game{
 width:min(100%,1200px);background:#fff;border:6px solid #17c5eb;border-radius:34px;
 padding:24px 28px 26px;box-shadow:0 15px 35px rgba(0,0,0,.13);overflow:hidden
}
.title{
 display:inline-block;background:linear-gradient(#ff5fa5,#f72585);color:#fff;
 font-size:clamp(25px,3vw,42px);font-weight:900;padding:13px 35px;border-radius:45% 55% 48% 52% / 55% 43% 57% 45%;
 box-shadow:0 6px 0 #dc1972,0 10px 16px rgba(0,0,0,.14);margin:0 0 24px 45px
}
.row{
 display:grid;grid-template-columns:60px repeat(4,1fr);gap:18px;align-items:center;
 background:#f7fcff;border:3px solid #d0f4fc;border-radius:28px;padding:14px 18px;margin-bottom:12px
}
.num{
 width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 color:#fff;font-size:25px;font-weight:900;background:linear-gradient(#ff5ba5,#f4147a);
 box-shadow:inset 0 2px 3px rgba(255,255,255,.5),0 4px 8px rgba(244,20,122,.2)
}
.oval{
 min-height:62px;border:3px solid #ff3b91;background:#fff;color:#263b45;
 font-size:clamp(16px,1.8vw,23px);font-weight:800;cursor:pointer;padding:10px 15px;
 border-radius:46% 54% 45% 55% / 55% 44% 56% 45%;
 box-shadow:0 5px 10px rgba(0,0,0,.09);transition:.18s
}
.oval:nth-child(even){border-radius:55% 45% 56% 44% / 45% 55% 44% 56%}
.oval:hover{transform:translateY(-2px) scale(1.02);background:#fff4f9}
.oval.correct{background:#d9f8dd;border-color:#28a745;color:#176b2a}
.oval.wrong{background:#ffdce4;border-color:#dc3545;color:#a31327}
.oval:disabled{cursor:default}
.result{text-align:center;font-size:30px;font-weight:900;color:#075ee6;margin:18px 0 12px}
.controls{text-align:center}
.reset{
 border:4px solid #fff;background:linear-gradient(#ffab25,#ff7600);color:#fff;
 border-radius:34px;padding:12px 38px;font-size:22px;font-weight:900;cursor:pointer;
 box-shadow:0 5px 9px rgba(0,0,0,.22)
}
@media(max-width:800px){
 body{padding:7px;align-items:flex-start}.game{padding:16px 10px;border-radius:24px}
 .title{margin:0 0 18px 10px;padding:10px 22px}
 .row{grid-template-columns:45px repeat(2,1fr);gap:10px;padding:12px 10px}
 .num{grid-row:span 2;width:40px;height:40px;font-size:20px}
 .oval{min-height:52px;font-size:15px}.result{font-size:24px}
}
@media(max-width:440px){
 .row{grid-template-columns:38px 1fr}.num{grid-row:span 4;width:34px;height:34px;font-size:17px}
 .oval{min-height:46px}.reset{width:100%;font-size:18px}
}
</style>
</head>
<body>
<div class="game">
 <div class="title">Find the odd one out.</div>
 <div id="quiz"></div>
 <div class="result" id="result">Score: 0 / 4</div>
 <div class="controls"><button class="reset" onclick="resetQuiz()">↻ Reset</button></div>
</div>
<script>
const questions=[
 {options:["Teacher","Student","Doctor","Blackboard"],answer:"Blackboard"},
 {options:["Book","Pencil","Banana","Eraser"],answer:"Banana"},
 {options:["School","Classroom","Playground","Kitchen"],answer:"Kitchen"},
 {options:["Read","Sleep","Count","Write"],answer:"Sleep"}
];
let score=0;

function loadQuiz(){
 const quiz=document.getElementById("quiz"); quiz.innerHTML="";
 questions.forEach((q,i)=>{
  const row=document.createElement("div"); row.className="row";
  const num=document.createElement("div"); num.className="num"; num.textContent=i+1;
  row.appendChild(num);
  q.options.forEach(opt=>{
   const b=document.createElement("button"); b.className="oval"; b.textContent=opt;
   b.dataset.value=opt;
   b.onclick=()=>check(b,opt,q.answer,row);
   row.appendChild(b);
  });
  quiz.appendChild(row);
 });
}
function check(button,selected,correct,row){
 const buttons=row.querySelectorAll(".oval");
 buttons.forEach(b=>{b.disabled=true;if(b.dataset.value===correct)b.classList.add("correct")});
 if(selected===correct)score++;else button.classList.add("wrong");
 document.getElementById("result").textContent=`Score: ${score} / 4`;
}
function resetQuiz(){
 score=0;document.getElementById("result").textContent="Score: 0 / 4";loadQuiz();
}
loadQuiz();
</script>
</body>
</html>
