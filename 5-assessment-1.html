<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial;color:#111}.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{color:#00a5dc;font-size:25px;margin:0 0 25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:28px}.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:white;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}input,select{border:2px solid #ff3b30;background:#fff;height:40px;font-size:18px;padding:5px 8px}.q{font:20px Georgia;margin-bottom:22px}.opts{display:flex;flex-wrap:wrap;gap:10px 18px;margin:10px 0 0 24px}.opt{border:2px solid #ff1680;border-radius:11px;background:white;padding:9px 14px;font-size:17px;color:#111;min-width:110px}.q:first-of-type .opt{flex:1 1 45%;text-align:left}.sel{background:#fff0f6}</style></head><body><main class="ex"><h1>Choose the correct option.</h1><div class="q" data-a="1"><div>a. Which of the following is the formula to check division?</div><div class="opts"><button class="opt" data-v="0">i. Dividend = Remainder × Quotient + Divisor</button><button class="opt" data-v="1">ii. Dividend = Quotient × Divisor + Remainder</button><button class="opt" data-v="2">iii. Dividend = Quotient + Divisor × Remainder</button><button class="opt" data-v="3">iv. Quotient = Dividend + Divisor × Remainder</button></div></div><div class="q" data-a="0"><div>b. What is the dividend in the expression 56 ÷ 7?</div><div class="opts"><button class="opt" data-v="0">i. 56</button><button class="opt" data-v="1">ii. 8</button><button class="opt" data-v="2">iii. 7</button><button class="opt" data-v="3">iv. 0</button></div></div><div class="q" data-a="2"><div>c. Which one has a different remainder?</div><div class="opts"><button class="opt" data-v="0">i. 73 ÷ 8</button><button class="opt" data-v="1">ii. 37 ÷ 9</button><button class="opt" data-v="2">iii. 45 ÷ 5</button><button class="opt" data-v="3">iv. 70 ÷ 3</button></div></div><div class="q" data-a="0"><div>d. When you divide 78 by 3, then the quotient is ______.</div><div class="opts"><button class="opt" data-v="0">i. 26</button><button class="opt" data-v="1">ii. 36</button><button class="opt" data-v="2">iii. 16</button><button class="opt" data-v="3">iv. 6</button></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score"></div><script>score.textContent="Score: 0 / 4";document.querySelectorAll(".q").forEach(q=>q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{q.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel","ok","bad"));b.classList.add("sel");q.dataset.p=b.dataset.v}));function check(){let s=0;document.querySelectorAll(".q").forEach(q=>{let p=q.dataset.p;q.querySelectorAll(".opt").forEach(b=>{b.classList.remove("ok","bad");if(b.dataset.v===p)b.classList.add(p===q.dataset.a?"ok":"bad")});if(p===q.dataset.a)s++});score.textContent=`Score: ${s} / 4`}function resetAll(){document.querySelectorAll(".q").forEach(q=>{delete q.dataset.p;q.querySelectorAll(".opt").forEach(b=>b.className="opt")});score.textContent="Score: 0 / 4"}</script></main></body></html>
