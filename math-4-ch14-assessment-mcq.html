<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 Chapter 14 Assessment - MCQ</title><style>*{box-sizing:border-box}body{margin:0;background:#d4faff;font-family:Georgia,'Times New Roman',serif;color:#172536}.sheet{max-width:1050px;margin:24px auto;padding:25px 28px 22px;background:white;border:3px solid #00afe8;border-radius:22px}h2{color:#00a8e2;margin:0 0 18px;font-size:26px}.question{background:#eafaff;border:1px solid #00b6f5;border-radius:12px;padding:12px;margin:10px 0}.prompt{font-size:17px;margin-bottom:10px;line-height:1.45}.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.opt{border:1px solid #9bdcf6;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 9px;min-height:48px;cursor:pointer;font:16px Georgia,'Times New Roman',serif;text-align:left}.opt:hover{border-color:#00a8e2}.opt .sq{width:22px;height:22px;border:2px solid #00b7ff;flex-shrink:0;display:grid;place-items:center;color:#fff;font:bold 16px Arial}.opt.selected{background:#dff3ff;border-color:#008cce}.opt.selected .sq{background:#008cce}.opt.correct{background:#dcfce7;border-color:#16a34a}.opt.correct .sq{background:#16a34a;border-color:#16a34a}.opt.wrong{background:#fee2e2;border-color:#ef4444;animation:blink .65s 2}.opt.wrong .sq{background:#dc2626;border-color:#dc2626}@keyframes blink{50%{opacity:.48}}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:22px}button.action{background:#ff8000;color:#fff;border:0;border-radius:24px;padding:12px 21px;font:bold 14px Arial;cursor:pointer}button.action:hover{background:#e56c00}@media(max-width:720px){.sheet{margin:10px;padding:15px}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}h2{font-size:22px}}@media(max-width:390px){.opts{grid-template-columns:1fr}}</style></head><body><main class="sheet"><h2>Choose the correct option.</h2><div id="questions"></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="showAnswers()">Show Answer</button><button class="action" onclick="resetAnswers()">Reset</button></div></main><script>
const data=[
{q:'Side of a square = ____ × (Perimeter of square)',options:['½','¼','⅙','⅛'],answer:1},
{q:'A playground is 180 m long and 20 m broad, which is to be fenced with the wire. The length of wire required is ______.',options:['400 m','360 m','230 m','200 m'],answer:0},
{q:'The perimeter of a square whose each side measures 24 cm is ______.',options:['86 cm','48 cm','96 cm','72 cm'],answer:2},
{q:'A rectangle has a perimeter of 88 m. It is 18 meters long. Its breadth is ______.',options:['60 m','26 m','44 m','36 m'],answer:1}
];
const key='math-4-ch14-assessment-mcq-v1';let selected=[];try{let saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved))selected=saved}catch(e){}const letters=['a','b','c','d'];const roman=['i','ii','iii','iv'];const root=document.getElementById('questions');function render(){root.innerHTML='';data.forEach((item,i)=>{const box=document.createElement('section');box.className='question';const prompt=document.createElement('div');prompt.className='prompt';prompt.innerHTML='<strong>'+letters[i]+'.</strong> '+item.q;box.appendChild(prompt);const options=document.createElement('div');options.className='opts';item.options.forEach((label,j)=>{const opt=document.createElement('button');opt.type='button';opt.className='opt'+(selected[i]===j?' selected':'');opt.innerHTML='<span>'+roman[j]+'. '+label+'</span><span class="sq">'+(selected[i]===j?'✓':'')+'</span>';opt.onclick=()=>{selected[i]=j;save();render()};options.appendChild(opt)});box.appendChild(options);root.appendChild(box)})}function save(){try{localStorage.setItem(key,JSON.stringify(selected))}catch(e){}}function check(){document.querySelectorAll('.question').forEach((q,i)=>{q.querySelectorAll('.opt').forEach((opt,j)=>{opt.classList.remove('correct','wrong');if(selected[i]===j){opt.classList.add(j===data[i].answer?'correct':'wrong')}})})}function showAnswers(){selected=data.map(d=>d.answer);save();render();check()}function resetAnswers(){selected=[];save();render()}render();
</script></body></html>
