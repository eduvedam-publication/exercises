<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 - Chapter 5 Exercise 5(a)</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;font-family:Georgia,'Times New Roman',serif;color:#181818}.exercise{max-width:980px;margin:24px auto;background:white;border:3px solid #00afe1;border-radius:25px;padding:24px}h1{font-size:25px;color:#00a8df;margin:0 0 18px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th{background:#5c91c7;color:#fff;font-size:19px}td,th{border:1.5px solid #2838b5;text-align:center;padding:7px 5px}td{font-size:20px}th:first-child{width:12%}th:nth-child(2){width:26%}th:nth-child(3),th:nth-child(4){width:31%}input{width:100%;min-width:60px;height:39px;font:20px Georgia,serif;padding:4px 8px;border:2px solid #ff4d59;background:white;outline:none}input.good{border-color:#15a568;background:#e5fff0}input.bad{border-color:#e52d36;background:#ffe4e4;animation:blink .45s 3}@keyframes blink{50%{background:#ff8585}}.actions{display:flex;justify-content:center;gap:14px;margin-top:24px}button{background:#ff8100;color:white;border:0;border-radius:24px;padding:11px 20px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#034cc3;font:bold 22px Arial,sans-serif;margin-top:14px}@media(max-width:650px){.exercise{margin:8px;padding:12px;border-radius:16px}h1{font-size:21px}th{font-size:14px}td{font-size:15px}td,th{padding:5px 3px}input{font-size:16px;height:34px;padding:2px 4px}}</style></head><body><main class="exercise"><h1>Solve the following:</h1><div class="table-wrap"><table><thead><tr><th>S. No.</th><th>Division</th><th>Quotient</th><th>Remainder</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button type="button" onclick="checkAnswers()">Check Answers</button><button type="button" onclick="resetExercise()">Reset</button></div></main><script>const data=[[3568,7],[85472,5],[25436,3],[3926,9],[54218,7]];const key='math-4-ch5-5a-division-v1';const rows=document.getElementById('rows');data.forEach(([n,d],i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${i+1}.</td><td>${n} ÷ ${d}</td><td><input aria-label="Question ${i+1} quotient" id="q${i}" inputmode="numeric" autocomplete="off"></td><td><input aria-label="Question ${i+1} remainder" id="r${i}" inputmode="numeric" autocomplete="off"></td>`;rows.appendChild(tr)});const fields=[...document.querySelectorAll('input')];function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}catch(e){}}try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(saved))fields.forEach((x,i)=>x.value=saved[i]||'')}catch(e){}fields.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('good','bad');save()}));function checkAnswers(){let count=0;data.forEach(([n,d],i)=>{const expected=[Math.floor(n/d),n%d];['q','r'].forEach((p,j)=>{const x=document.getElementById(p+i);const ok=x.value.trim()!==''&&Number(x.value.trim())===expected[j];x.classList.remove('good','bad');void x.offsetWidth;x.classList.add(ok?'good':'bad');if(ok)count++})});document.getElementById('score').textContent=`Score: ${count} / 10`;save()}function resetExercise(){fields.forEach(x=>{x.value='';x.classList.remove('good','bad')});document.getElementById('score').textContent='Score: 0 / 10';try{localStorage.removeItem(key)}catch(e){}}</script></body></html>
