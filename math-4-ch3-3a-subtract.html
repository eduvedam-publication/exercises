<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 Chapter 3 Exercise 3(a) - Subtraction</title><style>
*{box-sizing:border-box}body{margin:0;background:#e3faff;font-family:Arial,sans-serif;color:#222}.exercise{max-width:940px;margin:20px auto;padding:24px;background:white;border:3px solid #05a9d9;border-radius:24px}h1{margin:0 0 20px;color:#00a8d8;font:bold 24px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.problem{display:flex;gap:12px;align-items:flex-start}.num{font:21px Georgia,serif;padding-top:10px}.tablebox{background:#ffddb8;padding:9px;min-width:0;flex:1}.place{border-collapse:collapse;width:100%;table-layout:fixed;font:19px Georgia,serif}.place td{height:35px;border:1px solid #d6c1a4;text-align:center}.place .header td{color:#ff2583}.place td:first-child{width:24px;border-left:0}.answer-row{padding-top:8px;display:grid;grid-template-columns:24px repeat(6,minmax(0,1fr));gap:0}.answer-row .answer{min-width:0;width:100%;border-radius:0;padding:0;font-size:18px}.answer-row .equals{display:flex;align-items:center;justify-content:center;background:#fff;font:17px Georgia,serif}.answer{width:100%;height:36px;border:2px solid #ff5360;background:white;text-align:center;font-size:19px;outline:none}.answer.ok{background:#dff9e7;border-color:#13a653}.answer.bad{background:#ffe0e3;border-color:#e33;animation:flash .4s 3}@keyframes flash{50%{background:#ff9ea6}}.actions{display:flex;justify-content:center;gap:12px;margin-top:26px}button{border:0;border-radius:22px;background:#ff8500;color:#fff;font-weight:bold;padding:11px 21px;cursor:pointer}#score{text-align:center;color:#0753b7;font-size:21px;font-weight:bold;margin-top:14px}@media(max-width:660px){.exercise{margin:8px;padding:12px}.grid{grid-template-columns:1fr}.place{font-size:17px}h1{font-size:21px}}
</style></head><body><main class="exercise"><h1>Subtract the following:</h1><div class="grid" id="problems"></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 4</div></main><script>
const exercises=[['984756','752523','232233'],['728529','509607','218922'],['298427','075215','223212'],['537519','359490','178029']];const host=document.getElementById('problems');exercises.forEach(([top,bottom],i)=>{const section=document.createElement('section');section.className='problem';const digits=s=>s.split('').map(d=>`<td>${d==='0'&&s===bottom&&i===2&&s.indexOf(d)===0?'':d}</td>`).join('');section.innerHTML=`<span class="num">${i+1}.</span><div class="tablebox"><table class="place"><tr class="header"><td></td>${['L','TTh','Th','H','T','O'].map(x=>`<td>${x}</td>`).join('')}</tr><tr><td></td>${digits(top)}</tr><tr><td>−</td>${digits(bottom)}</tr></table><div class="answer-row"><span class="equals">=</span>${Array.from({length:6},(_,j)=>`<input class="answer" id="a${i}-${j}" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Question ${i+1}, digit ${j+1}">`).join('')}</div></div>`;host.appendChild(section)});const fields=[...document.querySelectorAll('.answer')],key='math-4-ch3-3a-subtract-digits';
function save(){try{localStorage.setItem(key,JSON.stringify({values:fields.map(x=>x.value),score:document.getElementById('score').textContent}))}catch(e){}}
function checkAnswers(){let n=0;exercises.forEach((ex,i)=>{const answer=ex[2];let complete=true;for(let j=0;j<6;j++){const f=document.getElementById(`a${i}-${j}`),ok=f.value.trim()===answer[j];f.classList.toggle('ok',ok);f.classList.toggle('bad',!ok);if(!ok)complete=false;}if(complete)n++;});document.getElementById('score').textContent=`Score: ${n} / 4`;save()}
function resetExercise(){fields.forEach(f=>{f.value='';f.className='answer'});document.getElementById('score').textContent='Score: 0 / 4';save()}
fields.forEach((f,i)=>{f.addEventListener('input',()=>{f.value=f.value.replace(/\D/g,'').slice(-1);f.className='answer';if(f.value&&fields[i+1]&&i%6!==5)fields[i+1].focus();save()});f.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!f.value&&i%6!==0)fields[i-1].focus()})});
try{const old=JSON.parse(localStorage.getItem(key)||'null');if(old){fields.forEach((f,i)=>f.value=old.values?.[i]||'');document.getElementById('score').textContent=old.score||'Score: 0 / 4'}}catch(e){}
</script></body></html>
