<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>रिक्त स्थान पूर्ति कीजिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#dff9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#172d39}.exercise{max-width:920px;margin:14px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 24px;min-height: min(650px,96vh);display:flex;flex-direction:column}h1{font-size:23px;color:#00a9e0;margin:0 0 15px}.items{flex:1}.item{background:#f1fbff;border:1.5px solid #00c9ee;border-radius:12px;padding:12px 15px;margin:9px 0;font-size:19px}.opts{display:flex;flex-wrap:wrap;gap:9px 18px;margin-top:9px}.opt{background:#fff;border:1.5px solid #ff2780;border-radius:9px;padding:7px 12px;font-size:17px;cursor:pointer;color:#142d38}.opt.selected{background:#d9f8eb;border-color:#00a875}.opt.correct{background:#c9f4d7}.opt.wrong{background:#ffe2e2}.actions{display:flex;gap:10px;justify-content:center;margin-top:15px}.actions button{background:#ff8400;border:0;color:white;border-radius:22px;padding:10px 20px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0070c6;font-size:19px;font-weight:bold;margin:10px 0 0}.bank{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;background:#e3f9ff;border-radius:10px;padding:12px;margin-bottom:15px}.word{border:1.5px solid #00a9e0;border-radius:7px;background:white;padding:6px 13px;font-size:18px;cursor:grab}.word.active{background:#c8f4ed;border-color:#ff3480}.blank{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:110px;min-height:35px;border:2px dashed #ff624d;border-radius:7px;background:white;padding:2px 7px;cursor:pointer;color:#222}.blank.filled{border-style:solid;background:#eafff7}.blank.correct{background:#d9f8e1}.blank.wrong{background:#ffe4e4}.tf{display:flex;align-items:center;justify-content:space-between;gap:15px}.tf .opts{flex-shrink:0;margin:0}@media(max-width:600px){.exercise{margin:0;border-radius:0;padding:13px;min-height:100dvh}h1{font-size:20px}.item{font-size:17px}.opt{font-size:16px}.tf{align-items:flex-start;flex-direction:column}}</style></head><body><main class="exercise"><h1>रिक्त स्थान पूर्ति कीजिए–</h1><div class="bank" id="bank"></div><section class="items"><div class="item"><b>(</b> एक समान अर्थ देने वाले शब्द <span class="blank" data-i="0" onclick="place(0)" ondragover="event.preventDefault()" ondrop="drop(event,0)"></span> कहलाते हैं।</div><div class="item"><b>क</b> शेर का पर्यायवाची <span class="blank" data-i="1" onclick="place(1)" ondragover="event.preventDefault()" ondrop="drop(event,1)"></span> है।</div><div class="item"><b>ख</b> <span class="blank" data-i="2" onclick="place(2)" ondragover="event.preventDefault()" ondrop="drop(event,2)"></span> को समीर भी कहते हैं।</div><div class="item"><b>ग</b> लड़की का दूसरा नाम <span class="blank" data-i="3" onclick="place(3)" ondragover="event.preventDefault()" ondrop="drop(event,3)"></span> है।</div></section><div class="actions"><button onclick="submit()">Submit</button><button onclick="resetAll()">Reset</button></div><div id="score">Score: 0 / 4</div></main><script>const words=["समानार्थी", "सिंह", "हवा", "बिटिया"];const key="gyandhara-2-ch11-drag-drop";let state=JSON.parse(localStorage.getItem(key)||"[null,null,null,null]"),selected=null;function save(){localStorage.setItem(key,JSON.stringify(state))}function draw(){document.getElementById("bank").innerHTML=words.map((w,i)=>`<button class="word ${selected===i?'active':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain',${i})" onclick="select(${i})">${w}</button>`).join("");document.querySelectorAll(".blank").forEach(b=>{let i=+b.dataset.i;b.textContent=state[i]===null?'________':words[state[i]];b.classList.toggle('filled',state[i]!==null)})}function select(i){selected=i;draw()}function place(i){if(selected!==null){let old=state.indexOf(selected);if(old>=0)state[old]=null;state[i]=selected;selected=null;save();draw()}else if(state[i]!==null){state[i]=null;save();draw()}}function drop(e,i){e.preventDefault();let n=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(n)&&n>=0&&n<4){selected=n;place(i)}}function submit(){let n=0;state.forEach((v,i)=>{if(v===i)n++});document.getElementById('score').textContent=`Score: ${n} / 4`}function resetAll(){state=[null,null,null,null];selected=null;save();draw();document.getElementById('score').textContent='Score: 0 / 4'}draw();</script></body></html>
