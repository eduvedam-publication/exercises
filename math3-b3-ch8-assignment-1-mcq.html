<script>
const ans=[0,2,2,1], chosen={};
function pick(el){let q=el.dataset.q;document.querySelectorAll('[data-q="'+q+'"]').forEach(x=>x.classList.remove('sel','correct','wrong'));el.classList.add('sel');chosen[q]=+el.dataset.v}
function check(){let s=0;for(let q=0;q<4;q++){document.querySelectorAll('[data-q="'+q+'"]').forEach(el=>{el.classList.remove('correct','wrong');if(el.classList.contains('sel')){let ok=+el.dataset.v===ans[q];el.classList.add(ok?'correct':'wrong');if(ok)s++}})}document.getElementById('score').textContent='Score: '+s+' / 4'}
