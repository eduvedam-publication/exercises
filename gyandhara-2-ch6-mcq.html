<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gyandhara-2-ch6-mcq</title><style>*{box-sizing:border-box}body{margin:0;background:#def8ff;font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;color:#142b3c}.sheet{width:min(920px,96vw);margin:12px auto;background:#fff;border:3px solid #08abd4;border-radius:22px;padding:18px 24px;min-height:min(620px,94vh);display:flex;flex-direction:column}h1{font-size:clamp(19px,2.6vw,27px);color:#00a7dc;margin:0 0 16px}.content{flex:1}.q{border:1.5px solid #04c5ee;background:#f1fbff;border-radius:12px;padding:12px 15px;margin:9px 0;font-size:19px}.options{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:9px}.opt,.word{font:inherit;border:1.5px solid #ff2680;background:white;border-radius:9px;padding:7px 12px;cursor:pointer}.opt.selected,.word.selected{background:#d9f9e7;border-color:#12ad71}.opt.good,.slot.good{background:#d6f9e1;border-color:#15b47a}.opt.bad,.slot.bad{background:#ffe1e1;border-color:#ec4343;animation:wrongBlink .35s 3}@keyframes wrongBlink{50%{background:#ff8888}}.actions{display:flex;justify-content:center;gap:8px;margin-top:14px}.actions button{border:1.5px solid #ff007b;border-radius:10px;background:white;padding:8px 17px;cursor:pointer;font-size:15px}.score{text-align:center;color:#0070b8;font-size:19px;font-weight:bold;margin-top:8px}.bank{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding:10px;background:#e4f8ff;border-radius:12px;margin-bottom:15px}.word{border-color:#00b9e7}.slot{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:105px;min-height:37px;border:2px dashed #ff664f;border-radius:7px;background:#fff;cursor:pointer;padding:2px 8px;margin:0 3px}.sentence{line-height:2.5}.tfrow{display:flex;align-items:center;gap:15px}.tfrow .sentence{flex:1;line-height:1.6}.tfopts{display:flex;gap:7px;margin-left:auto}.tfopts .opt{font-size:16px;min-width:55px}@media(max-width:650px){.sheet{padding:12px;min-height:96vh}.q{font-size:16px;padding:9px}.options{gap:7px}.opt,.word{padding:6px}.tfrow{flex-wrap:wrap}.tfopts{margin-left:0}}</style></head><body><main class="sheet"><h1>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h1><div class="content" id="content"></div><div class="actions"><button id="submit">Submit</button><button id="reset">Reset</button></div><div class="score" id="score">Score: 0 / 4</div></main><script>const key='gyandhara-2-ch6-mcq';function load(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}let a=load();function save(){localStorage.setItem(key,JSON.stringify(a))}const labels=['(क)','(ख)','(ग)','(घ)'];const data=[
['स्त्री जाति का बोध कराने वाले संज्ञा शब्दों को कहते हैं–',['लिंग','पुल्लिंग','स्त्रीलिंग'],2],
['‘बेटा’ का स्त्रीलिंग शब्द है–',['सुत्ता','बेटी','आत्मजा'],1],
['‘हथिनी’ का पुल्लिंग शब्द है–',['हाथी','करि','गज'],0],
['‘पानी’ का लिंग है–',['स्त्रीलिंग व पुल्लिंग दोनों','स्त्रीलिंग','पुल्लिंग'],2]
];function render(){content.innerHTML=data.map((q,i)=>`<div class="q"><div>${labels[i]} ${q[0]}</div><div class="options">${q[1].map((o,j)=>`<button class="opt ${a[i]===j?'selected':''}" onclick="choose(${i},${j})">${['(अ)','(ब)','(स)'][j]} ${o}</button>`).join('')}</div></div>`).join('')}function choose(i,j){a[i]=j;save();render();score.textContent=`Score: 0 / ${data.length}` }submit.onclick=()=>{let n=0;document.querySelectorAll('.q').forEach((q,i)=>{if(a[i]===data[i][2])n++;q.querySelectorAll('.opt').forEach((b,j)=>{if(a[i]===j)b.classList.add(a[i]===data[i][2]?'good':'bad')})});score.textContent=`Score: ${n} / 4`};reset.onclick=()=>{a={};save();score.textContent='Score: 0 / 4';render()};render();</script></body></html>
