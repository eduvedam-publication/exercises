<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>7 Assessment 2</title><style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}
.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}
.ok{background:#dcf8df!important;border-color:#009b8e!important}
.bad{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:700px){body{padding:0}.exercise{border-radius:0;padding:16px}}

.unitrow{display:grid;grid-template-columns:minmax(240px,1.5fr) 2fr;align-items:center;gap:25px;padding:10px 5px;font:20px Georgia,"Times New Roman",serif}
.unitopts{display:grid;grid-template-columns:repeat(3,100px);gap:15px 25px}
.unit{border:2px solid transparent;border-radius:22px;background:#fff;padding:7px 13px;font:19px Georgia,"Times New Roman",serif;cursor:pointer}
.unit.sel{border-color:#ff1680;background:#fff3f7}
@media(max-width:700px){.unitrow{grid-template-columns:1fr}.unitopts{grid-template-columns:repeat(3,minmax(70px,1fr));gap:8px}}
</style></head><body><main class="exercise">
<h1>Circle the suitable unit to measure each of the following:</h1><div class="unitrow" data-a="gm"><div class="label">a. A slab of chocolate</div><div class="unitopts"><button class="unit" data-v="gm">gm</button><button class="unit" data-v="kg">kg</button><button class="unit" data-v="mL">mL</button></div></div><div class="unitrow" data-a="gm"><div class="label">b. Mass of a knife</div><div class="unitopts"><button class="unit" data-v="L">L</button><button class="unit" data-v="gm">gm</button><button class="unit" data-v="kg">kg</button></div></div><div class="unitrow" data-a="mL"><div class="label">c. A tube of paint</div><div class="unitopts"><button class="unit" data-v="gm">gm</button><button class="unit" data-v="mL">mL</button><button class="unit" data-v="kg">kg</button></div></div><div class="unitrow" data-a="m"><div class="label">d. Length of a brick</div><div class="unitopts"><button class="unit" data-v="m">m</button><button class="unit" data-v="cm">cm</button><button class="unit" data-v="kg">kg</button></div></div><div class="unitrow" data-a="m"><div class="label">e. Length of an LED</div><div class="unitopts"><button class="unit" data-v="L">L</button><button class="unit" data-v="cm">cm</button><button class="unit" data-v="m">m</button></div></div><div class="unitrow" data-a="L"><div class="label">f. A bath tub full of water</div><div class="unitopts"><button class="unit" data-v="L">L</button><button class="unit" data-v="mL">mL</button><button class="unit" data-v="kg">kg</button></div></div><div class="unitrow" data-a="m"><div class="label">g. Length of your hand-span</div><div class="unitopts"><button class="unit" data-v="m">m</button><button class="unit" data-v="cm">cm</button><button class="unit" data-v="L">L</button></div></div>
<div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div>
<div id="score" class="score">Score: 0 / 7</div></main>
<script>
document.querySelectorAll(".unitrow").forEach(q=>q.querySelectorAll(".unit").forEach(b=>b.onclick=()=>{
 q.querySelectorAll(".unit").forEach(x=>x.classList.remove("sel","ok","bad"));b.classList.add("sel");q.dataset.pick=b.dataset.v;
}));
function check(){let s=0;document.querySelectorAll(".unitrow").forEach(q=>{let p=q.dataset.pick;q.querySelectorAll(".unit").forEach(b=>{b.classList.remove("ok","bad");if(b.dataset.v===p)b.classList.add(p===q.dataset.a?"ok":"bad")});if(p===q.dataset.a)s++});score.textContent=`Score: ${s} / 7`;}
function resetAll(){document.querySelectorAll(".unitrow").forEach(q=>{delete q.dataset.pick;q.querySelectorAll(".unit").forEach(b=>b.className="unit")});score.textContent="Score: 0 / 7";}
</script></body></html>
