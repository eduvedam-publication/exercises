<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find the place value of coloured digits in each number.</title><style>*{box-sizing:border-box}body{margin:0;background:#e8faff;color:#18283a;font-family:Arial,sans-serif}.exercise{width:min(960px,calc(100% - 22px));margin:20px auto;padding:22px 25px;background:#fff;border:3px solid #04a8d9;border-radius:22px}h1{font:700 23px Georgia,serif;color:#00a7dc;margin:0 0 18px}.questions{display:grid;gap:10px}.q{display:flex;align-items:center;gap:12px;padding:8px 11px;background:#f1fbfe;border:1.5px solid #00c5ee;border-radius:10px;font:18px Georgia,serif}.letter{width:23px;flex:none}.number{min-width:135px}.equals{font-weight:bold}input{flex:1;min-width:0;height:37px;border:2px solid #ff4b55;padding:4px 9px;font:17px Arial,sans-serif;outline:none}.example{background:#e4f8e8;border:2px solid #16aa63;border-radius:6px;padding:7px 10px;flex:1;font:16px Arial,sans-serif}.correct{background:#e4f8e8;border-color:#1aaf5b}.incorrect{background:#ffe5e7;border-color:#f04450;animation:flash .45s 2}@keyframes flash{50%{background:#ff9ca6}}.actions{display:flex;justify-content:center;gap:12px;margin-top:24px}button{background:#ff8400;color:white;border:0;border-radius:24px;padding:11px 20px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0756b8;font-size:20px;font-weight:bold;margin:14px 0 2px}@media(max-width:650px){.exercise{padding:13px 10px;margin:10px auto}h1{font-size:19px}.q{gap:6px;padding:7px 5px;font-size:15px}.number{min-width:85px}input{font-size:14px}.example{font-size:12px}}</style></head><body><main class="exercise"><h1>Find the place value of coloured digits in each number.</h1><div class="questions"><div class="q"><span class="letter">a.</span><span class="number">49,32,081</span><span class="equals">=</span><div class="example">2000 <small>(Example)</small></div></div><div class="q"><span class="letter">b.</span><span class="number">2,38,41,356</span><span class="equals">=</span><input id="a1" aria-label="Answer b." autocomplete="off" spellcheck="false"></div><div class="q"><span class="letter">c.</span><span class="number">6,32,18,470</span><span class="equals">=</span><input id="a2" aria-label="Answer c." autocomplete="off" spellcheck="false"></div><div class="q"><span class="letter">d.</span><span class="number">17,24,980</span><span class="equals">=</span><input id="a3" aria-label="Answer d." autocomplete="off" spellcheck="false"></div><div class="q"><span class="letter">e.</span><span class="number">62,03,45,179</span><span class="equals">=</span><input id="a4" aria-label="Answer e." autocomplete="off" spellcheck="false"></div><div class="q"><span class="letter">f.</span><span class="number">8,70,421</span><span class="equals">=</span><input id="a5" aria-label="Answer f." autocomplete="off" spellcheck="false"></div><div class="q"><span class="letter">g.</span><span class="number">1,028,346</span><span class="equals">=</span><input id="a6" aria-label="Answer g." autocomplete="off" spellcheck="false"></div><div class="q"><span class="letter">h.</span><span class="number">14,520,368</span><span class="equals">=</span><input id="a7" aria-label="Answer h." autocomplete="off" spellcheck="false"></div></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 7</div></main><script>
const answers={"a1": "800000", "a2": "8000", "a3": "700000", "a4": "300000", "a5": "1", "a6": "40", "a7": "20000"}, key="math-4-ch1-1g-place-value";const inputs=[...document.querySelectorAll('input')];const score=document.getElementById('score');
function normalize(s){return s.replace(/[\s,]/g,'').replace(/\++/g,'+').replace(/^\+|\+$/g,'').replace(/\+0(?=\+|$)/g,'').trim()}
function save(){try{localStorage.setItem(key,JSON.stringify({values:Object.fromEntries(inputs.map(x=>[x.id,x.value])),score:score.textContent}))}catch(e){}}
function checkAnswers(){let n=0;inputs.forEach(x=>{let ok=normalize(x.value)===normalize(answers[x.id]);x.classList.toggle('correct',ok);x.classList.toggle('incorrect',!ok);if(ok)n++});score.textContent=`Score: ${n} / ${inputs.length}`;save()}
function resetExercise(){inputs.forEach(x=>{x.value='';x.classList.remove('correct','incorrect')});score.textContent=`Score: 0 / ${inputs.length}`;save()}
inputs.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('correct','incorrect');save()}));try{const d=JSON.parse(localStorage.getItem(key)||'null');if(d){inputs.forEach(x=>x.value=d.values?.[x.id]||'');score.textContent=d.score||score.textContent}}catch(e){}
</script></body></html>
