<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who am I?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);
  display:flex;justify-content:center;align-items:center;padding:18px;color:#333
}
.quiz-box{
  width:min(100%,1000px);background:#fff;border:5px solid #00b8f0;
  border-radius:28px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.12)
}
.heading{font-size:28px;font-weight:700;color:#00a6d6;margin-bottom:22px}
.hint-title{text-align:center;font-size:15px;font-weight:700;color:#666;margin-bottom:8px}
.hint-box{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.hint{background:#ffe3f0;color:#5c2a42;padding:9px 18px;border-radius:14px;font-size:18px;font-weight:600}
.question-box{
  background:#f9fcff;border:2px solid #c9efff;border-radius:20px;
  padding:17px 20px;margin-bottom:14px
}
.question{font-size:20px;font-weight:500;line-height:1.7}
.blank-input{
  width:230px;border:none;border-bottom:3px solid #888;background:transparent;
  font-size:19px;font-weight:700;color:#d81b60;text-align:center;
  outline:none;padding:4px 6px;margin-left:8px
}
.blank-input:focus{border-color:#00b8f0}
.blank-input.correct{border-color:#2e7d32;color:#1b5e20}
.blank-input.wrong{border-color:#c62828;color:#b71c1c}
.buttons{text-align:center;margin-top:20px}
button{
  border:0;border-radius:32px;padding:12px 26px;margin:6px;font-size:16px;
  font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9800,#ff6f00);cursor:pointer
}
.result{text-align:center;margin-top:16px;font-size:24px;font-weight:700;color:#0047ab}
@media(max-width:650px){
 body{padding:8px;align-items:flex-start}
 .quiz-box{padding:16px 12px;border-radius:20px}
 .heading{font-size:22px}.hint{font-size:15px;padding:8px 12px}
 .question-box{padding:14px}.question{font-size:16px}
 .blank-input{display:block;width:100%;margin:8px 0 0;font-size:16px}
 button{width:100%;margin:6px 0}.result{font-size:21px}
}
</style>
</head>
<body>
<div class="quiz-box">
  <div class="heading">Who am I?</div>

  <div class="hint-title">Reference words</div>
  <div class="hint-box">
    <div class="hint">Mother</div>
    <div class="hint">Father</div>
    <div class="hint">Parents</div>
  </div>

  <div class="question-box"><div class="question">1. I cook food and help you study. <input id="q1" class="blank-input" type="text"></div></div>
  <div class="question-box"><div class="question">2. I work for the family. <input id="q2" class="blank-input" type="text"></div></div>
  <div class="question-box"><div class="question">3. They love and care for me. <input id="q3" class="blank-input" type="text"></div></div>
  <div class="question-box"><div class="question">4. They teach me good manners. <input id="q4" class="blank-input" type="text"></div></div>

  <div class="buttons">
    <button onclick="checkAnswers()">Check Answers</button>
    <button onclick="resetQuiz()">Reset</button>
  </div>
  <div class="result" id="result">Score: 0 / 4</div>
</div>

<script>
const answers={q1:"mother",q2:"father",q3:"parents",q4:"parents"};

function checkAnswers(){
  let score=0;
  Object.entries(answers).forEach(([id,answer])=>{
    const input=document.getElementById(id);
    const value=input.value.trim().toLowerCase();
    input.classList.remove("correct","wrong");
    if(value===answer){input.classList.add("correct");score++}
    else{input.classList.add("wrong")}
  });
  document.getElementById("result").textContent=`Score: ${score} / 4`;
}
function resetQuiz(){
  Object.keys(answers).forEach(id=>{
    const input=document.getElementById(id);
    input.value="";input.classList.remove("correct","wrong");
  });
  document.getElementById("result").textContent="Score: 0 / 4";
}
</script>
</body>
</html>
