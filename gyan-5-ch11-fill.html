<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GYANDHARA Class 5 Chapter 11 fill — 2026–27</title><style>*{box-sizing:border-box}body{margin:0;background:#d0faff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#202020}.wrap{max-width:990px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a9e9;margin:0 0 16px;font-size:25px}.q{background:#ebfaff;border:1px solid #00b9ed;border-radius:11px;padding:13px;margin:9px 0}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:9px}.opt{background:white;border:1px solid #9bdfff;border-radius:7px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}.opt.selected{border:2px solid #008ad1;background:#d7f4ff}.correct{background:#d6ffe5!important;border-color:#0baf54!important}.wrong{background:#ffe0e0!important;border-color:#e33!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.5}}.buttons{text-align:center;margin-top:24px}button{background:#ff8000;color:white;border:0;border-radius:22px;padding:11px 19px;margin:3px;cursor:pointer;font-weight:bold}.score{text-align:center;color:#0051b8;font-size:19px;font-weight:bold;margin:12px}.bank{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;background:#dff7ff;padding:13px;border-radius:10px;margin:12px 0}.chip{color:#202020;font-family:inherit;font-weight:normal;line-height:1.5;appearance:none;border:1px solid #00aeec;background:white;border-radius:7px;padding:9px 14px;cursor:grab;font-size:18px}.chip.active{outline:3px solid orange}.slot{display:inline-flex;min-width:125px;min-height:37px;border:2px dashed #ff724d;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;padding:4px 10px;cursor:pointer;background:white}.slot.filled{border-style:solid}.statement{display:flex;gap:10px;justify-content:space-between;align-items:center}.choices{display:flex;gap:6px;flex-shrink:0}.choice{color:#202020;font-family:Arial,sans-serif;font-size:21px;font-weight:bold;min-width:40px;min-height:37px;line-height:1;appearance:none;border:1px solid #00aeec;background:white;border-radius:7px;padding:7px 13px;cursor:pointer}.choice.selected{background:#ccefff;border-width:2px}@media(max-width:650px){.wrap{margin:7px;padding:14px}.options{grid-template-columns:1fr}.q{font-size:16px}.statement{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><h2>रिक्त स्थानों की पूर्ति कीजिए–</h2><div class="bank" id="bank"></div><div id="questions"></div><div class="buttons"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Marks: 0 / 4</div></main><script>const data=[["किसी काम के करने या होने का बोध कराने वाले शब्द __________ कहलाते हैं।", ["क्रिया"]], ["खा, पी, चल, पढ़ आदि क्रिया के __________ रूप हैं।", ["मूल"]], ["सकर्मक क्रिया के साथ __________ होता जबकि __________ क्रिया के साथ कर्म नहीं होता।", ["कर्म", "अकर्मक"]], ["क्रिया के धातु रूप में ‘ना’ जोड़ देने से क्रिया का __________ रूप बन जाता है।", ["सामान्य"]]];
const key='gyan-5-ch11-fill-v1',expected=data.flatMap(q=>q[1]),words=[...expected],order=[2,0,4,1,3];
let answers=Array(expected.length).fill(null),selected=null;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(saved)&&saved.length===expected.length)answers=saved.map(v=>Number.isInteger(v)&&v>=0&&v<words.length?v:null)}catch(e){}
function persist(){try{localStorage.setItem(key,JSON.stringify(answers))}catch(e){}}
function render(){document.getElementById('bank').innerHTML=order.map(j=>`<button class="chip ${selected===j?'active':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${j}')" onclick="selected=${j};render()">${words[j]}</button>`).join('');let index=0;document.getElementById('questions').innerHTML=data.map((q,i)=>`<div class="q">(${['क','ख','ग','घ'][i]}) ${q[0].replace(/__________/g,()=>{const k=index++;return `<span class="slot ${answers[k]!==null?'filled':''}" data-i="${k}" role="button" tabindex="0" aria-label="उत्तर ${k+1}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" ondragover="event.preventDefault()" ondrop="event.preventDefault();put(${k},+event.dataTransfer.getData('text/plain'))" onclick="if(selected!==null)put(${k},selected);else clearSlot(${k})">${answers[k]===null?'&nbsp;':words[answers[k]]}</span>`})}</div>`).join('')}
function put(i,j){if(!Number.isInteger(j)||j<0||j>=words.length)return;const old=answers.indexOf(j);if(old>=0)answers[old]=null;answers[i]=j;selected=null;persist();render()}
function clearSlot(i){answers[i]=null;persist();render()}
function check(){document.querySelectorAll('.slot').forEach(el=>{const i=+el.dataset.i;el.classList.remove('correct','wrong');if(answers[i]!==null)el.classList.add(words[answers[i]]===expected[i]?'correct':'wrong')});let offset=0,n=0;data.forEach(q=>{if(q[1].every((w,j)=>words[answers[offset+j]]===w))n++;offset+=q[1].length});document.getElementById('score').textContent=`Marks: ${n} / 4`}
function showAnswers(){answers=expected.map((_,i)=>i);selected=null;persist();render();check()}
function resetAll(){answers=Array(expected.length).fill(null);selected=null;try{localStorage.removeItem(key)}catch(e){}render();document.getElementById('score').textContent='Marks: 0 / 4'}render();</script></body></html>
