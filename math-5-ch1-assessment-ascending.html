<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrange in ascending order.</title><style>
*{box-sizing:border-box}body{margin:0;background:#b9fbff;font-family:Georgia,'Times New Roman',serif;color:#172735;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px}.sheet{width:min(1050px,100%);background:white;border:3px solid #00a9f4;border-radius:20px;padding:22px 24px}h1{font:700 clamp(23px,3vw,32px) Arial,sans-serif;color:#009ff0;margin:0 0 18px}.question{background:#e0f9ff;border:1.5px solid #00a9ff;border-radius:11px;margin:9px 0;padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:clamp(16px,1.7vw,20px)}.qnum{min-width:26px}.question label{flex:0 1 auto}.question input{width:190px;max-width:100%;padding:9px;border:2px solid #ff685d;border-radius:5px;font:inherit;color:#173c4d;background:white}.question input.correct{border-color:#20a953;background:#e8fff0}.question input.wrong{border-color:#e62c38;background:#fff0f0}.feedback{font:700 14px Arial,sans-serif}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:12px 19px;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #006bff;outline-offset:2px}#score{text-align:center;color:#003bea;font:700 21px Arial,sans-serif;margin:13px 0 2px}@media(max-width:620px){.sheet{padding:16px 12px}.question{align-items:flex-start}.question label{width:calc(100% - 40px)}.question input{margin-left:35px;width:min(260px,calc(100% - 35px))}}
 .question{padding:11px 14px}.question input{padding:7px}.options{display:flex;flex-wrap:wrap;gap:8px 20px;width:100%;padding-left:36px}.options label{display:flex;gap:7px;align-items:center;cursor:pointer}.options input{width:18px;height:18px;accent-color:#009ff0}.prompt{flex:1 1 100%}.words{width:100%!important}.order input{width:150px}.order .prompt{margin-bottom:3px}.question.correct{border-color:#20a953}.question.wrong{border-color:#e62c38}h1{font-size:27px}@media(max-height:700px) and (min-width:800px){.sheet{padding:16px 20px}.question{padding:9px 12px;margin:7px 0}h1{margin-bottom:12px}.actions{margin-top:14px}}</style></head><body><main class="sheet"><h1>Arrange in ascending order.</h1><section><div class="question order" id="q0"><span class="qnum">a.</span><span class="prompt">7656789, 4426789, 4826749, 8256589</span><input id="a0_0" aria-label="a position 1" inputmode="numeric" placeholder="1" autocomplete="off"><input id="a0_1" aria-label="a position 2" inputmode="numeric" placeholder="2" autocomplete="off"><input id="a0_2" aria-label="a position 3" inputmode="numeric" placeholder="3" autocomplete="off"><input id="a0_3" aria-label="a position 4" inputmode="numeric" placeholder="4" autocomplete="off"><span class="feedback" id="f0" aria-live="polite"></span></div><div class="question order" id="q1"><span class="qnum">b.</span><span class="prompt">3564785, 2567785, 2867785, 3567725</span><input id="a1_0" aria-label="b position 1" inputmode="numeric" placeholder="1" autocomplete="off"><input id="a1_1" aria-label="b position 2" inputmode="numeric" placeholder="2" autocomplete="off"><input id="a1_2" aria-label="b position 3" inputmode="numeric" placeholder="3" autocomplete="off"><input id="a1_3" aria-label="b position 4" inputmode="numeric" placeholder="4" autocomplete="off"><span class="feedback" id="f1" aria-live="polite"></span></div></section><div class="actions"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 2</p></main><script>const questions=[{"text": "7656789, 4426789, 4826749, 8256589", "answer": ["4426789", "4826749", "7656789", "8256589"]}, {"text": "3564785, 2567785, 2867785, 3567725", "answer": ["2567785", "2867785", "3564785", "3567725"]}],mode="order",key="exercise:math-5-ch1-assessment-ascending.html",score=document.getElementById('score');const inputs=[...document.querySelectorAll('input')];function norm(v){v=String(v).replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c));if(mode==='words')return v.toLowerCase().replace(/\band\b/g,'').replace(/lakhs/g,'lakh').replace(/crores/g,'crore').replace(/[^a-z]/g,'');return v.toLowerCase().replace(/[,\s]/g,'').replace(/^0+(?=\d)/,'')}function values(i){if(mode==='mcq')return document.querySelector('input[name="q'+i+'"]:checked')?.value||'';if(mode==='order')return questions[i].answer.map((_,j)=>document.getElementById('a'+i+'_'+j).value);return document.getElementById('a'+i).value}function clearMarks(){questions.forEach((_,i)=>{document.getElementById('q'+i).classList.remove('correct','wrong');const f=document.getElementById('f'+i);f.textContent='';f.className='feedback'});inputs.forEach(x=>x.classList.remove('correct','wrong'));score.textContent='Marks: 0 / '+questions.length}function save(){try{localStorage.setItem(key,JSON.stringify(inputs.map(x=>x.type==='radio'?x.checked:x.value)))}catch(e){}}try{const a=JSON.parse(localStorage.getItem(key)||'[]');inputs.forEach((x,i)=>{if(x.type==='radio')x.checked=a[i]===true;else x.value=typeof a[i]==='string'?a[i]:''})}catch(e){}inputs.forEach(x=>x.addEventListener('input',()=>{clearMarks();save()}));document.getElementById('submit').onclick=()=>{let marks=0;questions.forEach((q,i)=>{const v=values(i);const ok=mode==='order'?q.answer.every((a,j)=>norm(a)===norm(v[j])):[q.answer,...(q.accept||[])].some(a=>norm(a)===norm(v));marks+=ok;const box=document.getElementById('q'+i);box.classList.toggle('correct',ok);box.classList.toggle('wrong',!ok);box.querySelectorAll('input:not([type="radio"])').forEach(x=>{x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok)});const f=document.getElementById('f'+i);f.textContent=ok?'✓ Correct':'✗ Wrong';f.className='feedback '+(ok?'ok':'no')});score.textContent='Marks: '+marks+' / '+questions.length;save();const detail={exerciseType:mode==='mcq'?'MCQ':'FILL_BLANK',exerciseId:"math-5-ch1-assessment-ascending.html",response:Object.fromEntries(questions.map((_,i)=>['question'+(i+1),values(i)])),marks,total:questions.length};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'V"math-5-ch1-assessment-ascending.html"YALAYA_EXERCISE_SUBMIT',...detail},'*')};document.getElementById('show').onclick=()=>{questions.forEach((q,i)=>{if(mode==='mcq')document.querySelectorAll('input[name="q'+i+'"]').forEach(x=>x.checked=x.value===String(q.answer));else if(mode==='order')q.answer.forEach((a,j)=>document.getElementById('a'+i+'_'+j).value=a);else document.getElementById('a'+i).value=q.answer});clearMarks();save()};document.getElementById('reset').onclick=()=>{inputs.forEach(x=>{if(x.type==='radio')x.checked=false;else x.value=''});clearMarks();save()};</script></body></html>
