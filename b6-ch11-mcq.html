<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiple choice questions.</title><style>*{box-sizing:border-box}body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#111}.w{max-width:980px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px;min-height:90vh}h1{color:#009ed2;font-size:28px;margin:4px 0 26px}.q{background:#f7fbfd;border:2px solid #a9e9fb;border-radius:18px;padding:15px 18px;margin:14px 0;font-size:18px;line-height:1.55}.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.opt,button{border:2px solid #ff3c91;background:#fff;border-radius:10px;padding:9px 14px;font-size:16px;cursor:pointer}.sel{background:#ffe5f1!important}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}.actions{display:flex;justify-content:center;gap:14px;margin-top:25px}.actions button{background:#ff8500;color:#fff;border-color:#ff8500;font-weight:bold}#result{text-align:center;font-size:22px;font-weight:bold;color:#064bb4;margin-top:20px}input{border:0;border-bottom:2px solid #777;padding:6px 8px;font-size:17px;min-width:140px;background:#fff}.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px 65px}.match .opt{border-color:#a9e9fb;text-align:left;border-radius:18px}.match .R{text-align:right}@media(max-width:650px){.w{margin:0;border-radius:0;padding:15px}.match{gap:14px 25px}h1{font-size:23px}}</style></head><body><main class="w"><h1>Multiple choice questions.</h1><div class=q>1. Abraham Lincoln was born in a:<div class=opts><button class=opt data-q="0" data-v="0" onclick="pick(this)">i. log cabin</button><button class=opt data-q="0" data-v="1" onclick="pick(this)">ii. palace</button><button class=opt data-q="0" data-v="2" onclick="pick(this)">iii. mansion</button></div></div><div class=q>2. Lincoln had less than a year of formal schooling, yet he:<div class=opts><button class=opt data-q="1" data-v="0" onclick="pick(this)">i. stopped working</button><button class=opt data-q="1" data-v="1" onclick="pick(this)">ii. gave up learning</button><button class=opt data-q="1" data-v="2" onclick="pick(this)">iii. educated himself</button></div></div><div class=q>3. Lincoln strongly opposed ________.<div class=opts><button class=opt data-q="2" data-v="0" onclick="pick(this)">i. education</button><button class=opt data-q="2" data-v="1" onclick="pick(this)">ii. slavery</button><button class=opt data-q="2" data-v="2" onclick="pick(this)">iii. farming</button></div></div><div class=q>4. Which quality helped Lincoln continue despite failures?<div class=opts><button class=opt data-q="3" data-v="0" onclick="pick(this)">i. Carelessness</button><button class=opt data-q="3" data-v="1" onclick="pick(this)">ii. Perseverance</button><button class=opt data-q="3" data-v="2" onclick="pick(this)">iii. Pride</button></div></div><div class=q>5. Lincoln is called a self-made man because he:<div class=opts><button class=opt data-q="4" data-v="0" onclick="pick(this)">i. inherited great wealth</button><button class=opt data-q="4" data-v="1" onclick="pick(this)">ii. achieved success through his own efforts</button><button class=opt data-q="4" data-v="2" onclick="pick(this)">iii. became successful without difficulties</button></div></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="location.reload()">Reset</button></div><div id="result">Score: 0 / 0</div></main><script>const A=[0, 2, 1, 1, 1],S={};result.textContent=`Score: 0 / ${A.length}`;function pick(e){document.querySelectorAll(`[data-q="${e.dataset.q}"]`).forEach(x=>x.classList.remove('sel'));e.classList.add('sel');S[e.dataset.q]=+e.dataset.v}function check(){let n=0;A.forEach((a,i)=>{document.querySelectorAll(`[data-q="${i}"]`).forEach(x=>{x.classList.remove('ok','bad');if(+x.dataset.v===a)x.classList.add('ok');else if(x.classList.contains('sel'))x.classList.add('bad')});if(S[i]===a)n++});result.textContent=`Score: ${n} / ${A.length}`}</script></body></html>
