<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circle the suitable unit to measure each of the following.</title><style>*{box-sizing:border-box}body{margin:0;background:#e2f8fc;font-family:Georgia,'Times New Roman',serif}
.card{width:min(1080px,calc(100% - 24px));min-height:430px;margin:14px auto;background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:30px 42px;display:flex;flex-direction:column}
h1{font:700 25px Arial;color:#00a1db;margin:0 0 28px}.content{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 55px}
.q{font-size:20px;line-height:1.55}.opts{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 0 25px}
.opt{border:2px solid #ff1680;background:#fff;border-radius:12px;padding:8px 15px;cursor:pointer;font:16px Arial}.opt.sel{background:#fff0f6}.opt.ok{background:#dff7df;border-color:#198c3d}.opt.bad{background:#ffe1e1;border-color:#d92c2c}
input{width:90px;height:36px;border:2px solid #ff2b22;padding:4px 6px;font:17px Arial}input.ok{background:#dff7df;border-color:#198c3d}input.bad{background:#ffe1e1;border-color:#d92c2c}
.footer{margin-top:auto;padding-top:28px;text-align:center}button.action{border:0;border-radius:24px;background:#ff7b00;color:#fff;padding:13px 22px;margin:0 6px;font:bold 14px Arial;cursor:pointer}
.score{margin-top:13px;color:#064bb4;font:bold 22px Arial}@media(max-width:700px){.card{padding:24px 18px}.grid{grid-template-columns:1fr}.q{font-size:18px}}</style></head>
<body><main class="card"><h1>Circle the suitable unit to measure each of the following.</h1><div class="content"><div class="q" style="margin-bottom:18px"><b>a.</b> Distance from school to home<div class="opts"><button class="opt" data-q="0" data-v="0" onclick="pick(this)">m</button><button class="opt" data-q="0" data-v="1" onclick="pick(this)">cm</button><button class="opt" data-q="0" data-v="2" onclick="pick(this)">km</button></div></div><div class="q" style="margin-bottom:18px"><b>b.</b> Medicine in a syringe<div class="opts"><button class="opt" data-q="1" data-v="0" onclick="pick(this)">l</button><button class="opt" data-q="1" data-v="1" onclick="pick(this)">ml</button></div></div><div class="q" style="margin-bottom:18px"><b>c.</b> The length of chocolate bar<div class="opts"><button class="opt" data-q="2" data-v="0" onclick="pick(this)">m</button><button class="opt" data-q="2" data-v="1" onclick="pick(this)">cm</button><button class="opt" data-q="2" data-v="2" onclick="pick(this)">km</button></div></div><div class="q" style="margin-bottom:18px"><b>d.</b> The length of your foot<div class="opts"><button class="opt" data-q="3" data-v="0" onclick="pick(this)">m</button><button class="opt" data-q="3" data-v="1" onclick="pick(this)">cm</button><button class="opt" data-q="3" data-v="2" onclick="pick(this)">km</button></div></div></div><div class="footer"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button><div class="score" id="score">Score: 0 / 4</div></div></main><script>const C=[2, 1, 1, 1],sel={};function pick(e){document.querySelectorAll(`[data-q="${e.dataset.q}"]`).forEach(x=>x.classList.remove('sel'));e.classList.add('sel');sel[e.dataset.q]=+e.dataset.v}function check(){let s=0;C.forEach((c,i)=>{document.querySelectorAll(`[data-q="${i}"]`).forEach(x=>x.classList.remove('ok','bad'));let v=sel[i];if(v!==undefined){let e=document.querySelector(`[data-q="${i}"][data-v="${v}"]`);if(v===c){e.classList.add('ok');s++}else e.classList.add('bad')}});score.textContent=`Score: ${s} / 4`}function resetAll(){Object.keys(sel).forEach(k=>delete sel[k]);document.querySelectorAll('.opt').forEach(x=>x.className='opt');score.textContent='Score: 0 / 4'}</script></body></html>
