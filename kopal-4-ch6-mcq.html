<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOPAL Hindi 4 Chapter 6 MCQ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e4f8ff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#263b44}.wrap{max-width:1000px;margin:22px auto;background:#fff;border:3px solid #00bde8;border-radius:18px;padding:24px}h2{margin:0 0 8px;color:#ff3988;font-size:25px}.meta{color:#527783;margin:0 0 18px}.q{background:#effbff;border:1px solid #8cdef4;border-radius:12px;padding:15px;margin:12px 0;font-size:18px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid #ff8bb7;border-radius:8px;padding:10px;cursor:pointer}.opt.sel{background:#ffe5ef;border-color:#ff3988}.opt.correct{background:#dcf8e5!important;border-color:#20a653!important}.opt.wrong{background:#ffe0e0!important;border-color:#e43d3d!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.5}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button{border:0;border-radius:24px;padding:11px 21px;background:#ff3988;color:white;font-weight:bold;cursor:pointer;font-size:15px}#score{text-align:center;color:#087fa7;font-weight:bold;font-size:19px;margin-top:15px}@media(max-width:650px){.wrap{margin:8px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}
</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ–</h2><p class="meta">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 4</p><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 4</div></main>
<script>
const data=[
["बाबा भारती के घोड़े का क्या नाम था?",["पहलवान","राजा","सुल्तान"],2],
["बाबा भारती को अपाहिज के रूप में कौन मिला?",["दुर्गादत्त","खड्ग सिंह","सुल्तान"],1],
["घोड़े को यह नहीं कहते हैं–",["हय","तुरंग","तरंग"],2],
["स्वामित्व : स्वामिल :: ममता : ?",["ममत्व","ममित्व","ममच"],0]
];
const key='kopal-4-ch6-mcq';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const root=document.getElementById('questions');
function render(){root.innerHTML=data.map((q,i)=>`<div class="q" id="q${i}"><b>(${'कखगघ'[i]}) ${q[0]}</b><div class="opts">${q[1].map((o,j)=>`<div class="opt ${answers[i]===j?'sel':''}" id="o${i}-${j}" role="button" tabindex="0" onclick="pick(${i},${j})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(${i},${j})}"><span>(${'i ii iii'.split(' ')[j]}) ${o}</span><span>${answers[i]===j?'☑':'□'}</span></div>`).join('')}</div></div>`).join('')}
function pick(i,j){answers[i]=j;localStorage.setItem(key,JSON.stringify(answers));render()}
function check(){let score=0;data.forEach((q,i)=>{document.querySelectorAll(`#q${i} .opt`).forEach(el=>el.classList.remove('correct','wrong'));if(answers[i]!==undefined){let el=document.getElementById('o'+i+'-'+answers[i]);let ok=answers[i]===q[2];el.classList.add(ok?'correct':'wrong');if(ok)score++}});document.getElementById('score').textContent=`प्राप्तांक: ${score} / 4`}
function showAnswers(){answers={};data.forEach((q,i)=>answers[i]=q[2]);localStorage.setItem(key,JSON.stringify(answers));render();check()}
function resetAll(){answers={};localStorage.removeItem(key);render();document.getElementById('score').textContent='प्राप्तांक: 0 / 4'}render();
</script></body></html>
