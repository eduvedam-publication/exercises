<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chapter 13 Assessment MCQ</title><style>*{box-sizing:border-box}body{margin:0;background:#d3faff;font-family:Georgia,'Times New Roman',serif;color:#182332}.wrap{max-width:1050px;margin:25px auto;background:white;border:3px solid #00aeeb;border-radius:22px;padding:24px 28px}h2{color:#00a7df;margin:0 0 17px;font-size:25px}.q{background:#eafaff;border:1px solid #00b7f4;border-radius:12px;padding:13px;margin:10px 0;font-size:17px}.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:10px}.opt{border:1px solid #9adcf6;border-radius:7px;background:white;padding:9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:5px}.opt.selected{border:2px solid #00a5e4;background:#dff7ff}.opt.correct,.q.correct{background:#d8ffe8!important;border-color:#25b86a!important}.opt.wrong,.q.wrong{background:#ffe1e1!important;border-color:#ed5050!important;animation:flash .6s 2}@keyframes flash{50%{opacity:.48}}.actions{text-align:center;margin-top:23px}button{border:0;background:#ff8000;color:white;padding:11px 19px;border-radius:30px;font-weight:bold;margin:4px;cursor:pointer}.inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.blank{width:105px;max-width:100%;border:2px solid #ff6654;border-radius:3px;padding:6px;font:inherit;background:white}.blank.correct{background:#d8ffe8;border-color:#25b86a}.blank.wrong{background:#ffe1e1;border-color:#ed5050;animation:flash .6s 2}.choice{border:1px solid #00aeeb;border-radius:8px;background:white;padding:7px 14px;cursor:pointer}.choice.selected{background:#bdeeff}.choice.correct{background:#d8ffe8}.choice.wrong{background:#ffe1e1;animation:flash .6s 2}.statement{flex:1;min-width:200px}@media(max-width:720px){.wrap{margin:8px;padding:16px}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}h2{font-size:22px}}</style></head><body><main class="wrap"><h2>Choose the correct option.</h2><section id="questions"></section><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAnswers()">Reset</button></div></main><script>const questions=[["Which of the following has only one vertex?", ["Cube", "Cuboid", "Cone", "Cylinder"], 2], ["The point of contact between two or more faces is called ________.", ["Edge", "Side", "Vertex", "Face"], 2], ["________ is the mirror image of a figure.", ["Reflection", "Symmetry", "Edge", "Face"], 0], ["In tessellation, each vertex of the tile must appear ________.", ["Smaller", "Greater", "Same", "None of these"], 2]],key='math-4-ch13-assessment-mcq';let answers=JSON.parse(localStorage.getItem(key)||'{}');const root=document.getElementById('questions');function save(){localStorage.setItem(key,JSON.stringify(answers))}function render(){root.innerHTML='';questions.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const p=document.createElement('div');p.textContent=String.fromCharCode(97+i)+'. '+q[0];card.append(p);const opts=document.createElement('div');opts.className='opts';q[1].forEach((v,j)=>{const b=document.createElement('div');b.className='opt'+(answers[i]===j?' selected':'');b.textContent=['i. ','ii. ','iii. ','iv. '][j]+v;const mark=document.createElement('span');mark.textContent=answers[i]===j?'✓':'□';b.append(mark);b.onclick=()=>{answers[i]=j;save();render()};opts.append(b)});card.append(opts);root.append(card)})}function checkAnswers(){root.querySelectorAll('.q').forEach((card,i)=>{card.querySelectorAll('.opt').forEach((o,j)=>{o.classList.remove('correct','wrong');if(answers[i]===j)o.classList.add(j===questions[i][2]?'correct':'wrong')})})}function showAnswers(){questions.forEach((q,i)=>answers[i]=q[2]);save();render();checkAnswers()}function resetAnswers(){answers={};save();render()}render();</script></body></html>
