<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gyandhara-2-ch1-drag-drop.html</title><style>*{box-sizing:border-box}body{margin:0;background:#def8ff;font-family:"Noto Sans Devanagari",Arial,sans-serif;color:#142b3c}.sheet{width:min(920px,96vw);margin:12px auto;background:white;border:3px solid #08abd4;border-radius:22px;padding:18px 24px;min-height:min(620px,94vh);display:flex;flex-direction:column}h1{font-size:clamp(19px,2.6vw,27px);color:#00a7dc;margin:0 0 16px;font-weight:700}.content{flex:1}.q{border:1.5px solid #04c5ee;background:#f1fbff;border-radius:12px;padding:12px 15px;margin:9px 0;font-size:19px}.options{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:9px}.opt,.word{font:inherit;border:1.5px solid #ff2680;background:white;border-radius:9px;padding:7px 12px;cursor:pointer}.opt.selected,.word.selected{background:#d9f9e7;border-color:#12ad71}.opt.good,.slot.good{background:#d6f9e1;border-color:#15b47a}.opt.bad,.slot.bad{background:#ffe1e1;border-color:#ec4343}.actions{display:flex;justify-content:center;gap:8px;margin-top:14px}.actions button{border:1.5px solid #ff007b;border-radius:10px;background:white;padding:8px 17px;cursor:pointer;font-size:15px}.score{text-align:center;color:#0070b8;font-size:19px;font-weight:bold;margin-top:8px}.bank{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding:10px;background:#e4f8ff;border-radius:12px;margin-bottom:15px}.word{border-color:#00b9e7}.word.used{opacity:.4}.slot{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:115px;min-height:37px;border:2px dashed #ff664f;border-radius:7px;background:white;cursor:pointer;padding:2px 8px;margin:0 3px}.sentence{line-height:2.5}.tfopts{display:flex;gap:7px;margin-left:auto}.tfopts .opt{font-size:16px;min-width:55px}.tfrow{display:flex;align-items:center;gap:15px}.tfrow .sentence{flex:1;line-height:1.6}@media(max-width:650px){.sheet{padding:12px;min-height:96vh}.q{font-size:16px;padding:9px}.options{gap:7px}.opt,.word{padding:6px}.tfrow{flex-wrap:wrap}.tfopts{margin-left:0}}</style></head><body><main class="sheet"><h1>रिक्त स्थान पूर्ति कीजिए–</h1><div class="content" id="content"></div><div class="actions"><button id="submit">Submit</button><button id="reset">Reset</button></div><div class="score" id="score">Score: 0 / 4</div></main><script>const data=[["हिंदी वर्णमाला में कुल मिलाकर", "वर्ण हैं।", "52"], ["वर्णों के क्रमानुसार समूह को", "कहते हैं।", "वर्णमाला"], ["स्वर वर्णों की संख्या", "है।", "11"], ["स्वर रहित और स्वर सहित व्यंजन वर्णों से बने वर्ण", "कहलाते हैं।", "संयुक्त व्यंजन"]];const key='gyandhara-2-ch1-drag-drop';const words=['52','39','वर्ण','वर्णमाला','11','अयोगवाह','संयुक्त व्यंजन'];let chosen=JSON.parse(localStorage.getItem(key)||'{}'),active=null;const labels=['(क)','(ख)','(ग)','(घ)'];function render(){content.innerHTML=`<div class="bank">${words.map((w,i)=>`<button draggable="true" ondragstart="drag(event,${i})" onclick="pick(${i})" class="word ${active===i?'selected':''} ${Object.values(chosen).includes(i)?'used':''}">${w}</button>`).join('')}</div>`+data.map((r,i)=>`<div class="q sentence">${labels[i]} ${r[0]} <span class="slot" ondragover="event.preventDefault()" ondrop="drop(event,${i})" onclick="place(${i})">${chosen[i]===undefined?'________':words[chosen[i]]}</span> ${r[1]}</div>`).join('')}function pick(i){active=i;render()}function place(i){if(active!==null){for(let k in chosen)if(chosen[k]===active)delete chosen[k];chosen[i]=active;active=null}else if(chosen[i]!==undefined)delete chosen[i];localStorage.setItem(key,JSON.stringify(chosen));render()}function drag(e,i){e.dataTransfer.setData('text/plain',String(i))}function drop(e,i){e.preventDefault();active=Number(e.dataTransfer.getData('text/plain'));place(i)}submit.onclick=()=>{let n=0;document.querySelectorAll('.slot').forEach((el,i)=>{let ok=words[chosen[i]]===data[i][2];if(ok)n++;el.classList.add(ok?'good':'bad')});score.textContent=`Score: ${n} / 4`};reset.onclick=()=>{chosen={};active=null;localStorage.removeItem(key);score.textContent='Score: 0 / 4';render()};render();</script></body></html>
