<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add the following sums</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1050px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 24px;color:#009ed2;font-size:27px}

/* Every item gets exactly the same width and position */
.grid{
  display:grid;
  grid-template-columns:repeat(4, 140px);
  justify-content:space-between;
  align-items:start;
  column-gap:20px;
  row-gap:24px;
  padding:0 18px;
}
.item{
  width:140px;
  display:grid;
  grid-template-columns:24px 112px;
  column-gap:4px;
  align-items:start;
}
.letter{
  width:24px;
  text-align:left;
  font-family:Georgia,serif;
  font-size:19px;
  line-height:1;
  padding-top:10px;
}
.sum{
  width:112px;
  height:140px;
  background:#e0eff9;
  padding:7px;
  overflow:hidden;
}
.place{
  width:98px;
  height:36px;
  display:grid;
  grid-template-columns:49px 49px;
  align-items:start;
  text-align:center;
  color:#ff4050;
  font-family:Georgia,serif;
  font-size:20px;
}
.numrow{
  width:98px;
  height:29px;
  display:grid;
  grid-template-columns:24px 37px 37px;
  align-items:center;
  text-align:center;
  font-family:Georgia,serif;
  font-size:20px;
}
.addrow{border-bottom:2px solid #222}
.answer{
  display:block;
  width:98px;
  height:34px;
  margin:3px 0 0 0;
  border:2px solid #ff3b30;
  background:#fff;
  padding:3px 6px;
  font-size:18px;
  outline:none;
}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:28px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}

@media(max-width:760px){
 .grid{grid-template-columns:repeat(2,140px);justify-content:space-around}
}
@media(max-width:380px){
 .exercise{margin:0;border-radius:0;padding:14px}
 .grid{grid-template-columns:140px;justify-content:center;padding:0}
 h1{font-size:22px}
}
</style></head>
<body><main class="exercise">
<h1>Add the following sums:</h1>
<div class="grid" id="grid"></div>
<div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div>
<div id="result">Score: 0 / 8</div>
</main>
<script>
const data=[
["a",2,5,1,6],["b",6,4,1,7],["c",4,7,2,8],["d",3,6,1,6],
["e",7,9,1,3],["f",6,3,1,9],["g",5,8,2,7],["h",4,4,3,9]
];
const grid=document.getElementById("grid");
data.forEach((x,i)=>grid.insertAdjacentHTML("beforeend",`
<div class="item"><div class="letter">${x[0]}.</div><div class="sum">
<div class="place"><span>T</span><span>O</span></div>
<div class="numrow"><span></span><span>${x[1]}</span><span>${x[2]}</span></div>
<div class="numrow addrow"><span>+</span><span>${x[3]}</span><span>${x[4]}</span></div>
<input id="ans${i}" class="answer" inputmode="numeric"></div></div>`));
const answers=[41,81,75,52,92,82,85,83];
function checkAnswers(){let n=0;answers.forEach((v,i)=>{let e=document.getElementById("ans"+i),ok=e.value.trim()===String(v);e.className="answer "+(ok?"ok":"bad");if(ok)n++});result.textContent=`Score: ${n} / 8`}
function resetExercise(){document.querySelectorAll(".answer").forEach(e=>{e.value="";e.className="answer"});result.textContent="Score: 0 / 8"}
</script></body></html>
