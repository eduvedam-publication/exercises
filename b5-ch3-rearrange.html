<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rearrange the words to make meaningful sentences.</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;font-family:Arial,sans-serif;background:#eaf8ff;color:#292929}.wrap{max-width:1000px;margin:auto;background:#fff;border:5px solid #08b6e8;border-radius:24px;padding:20px}h1{color:#ff0878;font-size:24px;margin:0 0 16px}.card{background:#f9fcff;border:2px solid #c9efff;border-radius:17px;padding:14px 17px;margin:10px 0}.q{font-size:17px;font-weight:600;margin-bottom:8px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.opt,.choice{padding:10px;border:2px solid #ff4fa0;border-radius:13px;background:#fff;font-size:15px;cursor:pointer}.correct{background:#dff7df!important;border-color:#27843a!important}.wrong{background:#ffdede!important;border-color:#c62828!important}.score{text-align:center;color:#064bad;font-size:21px;font-weight:bold;margin:13px}.actions{text-align:center}.btn{padding:10px 22px;border:0;border-radius:22px;background:#ff7b00;color:white;font-weight:bold;margin:4px;cursor:pointer}.row{font-size:17px;line-height:2}.ans{padding:7px;border:2px solid #ff4fa0;border-radius:7px;font-size:15px}.tf{display:flex;gap:8px;flex-wrap:wrap}.sentence{width:100%;padding:8px;border:2px solid #ff4fa0;border-radius:8px;font-size:15px}@media(max-width:650px){.wrap{padding:10px;border-width:3px}.opts{grid-template-columns:1fr}h1{font-size:20px}.q,.row{font-size:15px}}</style></head><body><div class="wrap"><h1>Rearrange the words to make meaningful sentences.</h1><div id="x"></div><div id="score" class="score"></div><div class="actions"><button class="btn" onclick="check()">Check Answers</button><button class="btn" onclick="load()">Reset</button></div></div><script>const Q=[["1. intelligent / Sakshi / was / girl / an", "Sakshi was an intelligent girl"], ["2. teacher / loved / her / Sakshi / too", "Sakshi loved her teacher too"], ["3. words / powerful / are / our", "Our words are powerful"], ["4. teacher / future / our / moulds / our", "Our teacher moulds our future"], ["5. gossiping / stopped / Sakshi / after / lesson / the / learning", "Sakshi stopped gossiping after learning the lesson"], ["6. teacher / a / guide / good / is / our", "Our teacher is a good guide"], ["7. always / others / speak / we / should / kindly / to", "We should always speak kindly to others"], ["8. mistakes / learn / from / we / should / our", "We should learn from our mistakes"]];function load(){x.innerHTML='';Q.forEach((z,i)=>{let c=document.createElement('div');c.className='card';c.innerHTML='<div class="q">'+z[0]+'</div><input class="sentence" id="s'+i+'">';x.append(c)});score.textContent='Score: 0 / '+Q.length}function check(){let s=0;Q.forEach((z,i)=>{let a=document.getElementById('s'+i);a.classList.remove('correct','wrong');let norm=v=>v.trim().toLowerCase().replace(/[.]+$/,'');if(norm(a.value)===norm(z[1])){a.classList.add('correct');s++}else a.classList.add('wrong')});score.textContent='Score: '+s+' / '+Q.length}load();</script></body></html>
