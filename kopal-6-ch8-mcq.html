<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का निशान लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#bdfaff;color:#24313a;font-family:"Noto Serif Devanagari","Nirmala UI",sans-serif}.wrap{max-width:1020px;margin:18px auto;background:white;border:3px solid #00aeef;border-radius:20px;padding:24px}h2{color:#00a8ee;font-size:clamp(21px,3vw,28px);margin:0 0 18px}.q{background:#e1f9ff;border:1.5px solid #00aeef;border-radius:11px;padding:13px 15px;margin:10px 0;font-size:18px;line-height:1.9}.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:7px}.opt,.chip{font:inherit;background:#fff;border:1px solid #00aeef;border-radius:8px;padding:7px 12px;color:#1d3038;cursor:pointer}.opt.selected,.chip.active{background:#a5e9ff}.opt:focus-visible,.chip:focus-visible,.slot:focus-visible{outline:3px solid #ff7900}.good{border:2px solid #14a34a!important;background:#e4ffec!important}.bad{border:2px solid #d83131!important;background:#ffe6e6!important}.bank{background:#d2f7ff;border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.chip.used{opacity:.45}.slot{display:inline-flex;min-width:145px;min-height:42px;vertical-align:middle;align-items:center;justify-content:center;border:2px dashed #ff786a;border-radius:7px;padding:4px 9px;background:#fff;cursor:pointer;margin:0 5px}.slot.active{background:#fff1c2}.slot .placeholder{color:#71909b}.answer{display:none;color:#087a38;font-size:15px;margin-top:5px}.actions{text-align:center;margin-top:22px}.action{background:#ff7900;border:0;border-radius:25px;color:#fff;font-weight:bold;padding:11px 18px;margin:4px;cursor:pointer}.marks{text-align:center;color:#004bd1;font-size:21px;font-weight:bold;margin-top:10px}.hint{font-size:15px;color:#425c68;margin:0 0 12px}@media(max-width:650px){.wrap{margin:6px;padding:13px}.q{font-size:16px}.slot{min-width:105px}}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाइए–</h2><section class="q" id="q0"><div>(क) फोन करने वाली महिला कौन थी?</div><div class="opts"><button type="button" class="opt" data-i="0" data-j="0">(i) लिल मिलर</button><button type="button" class="opt" data-i="0" data-j="1">(ii) मिरेज क्लास</button><button type="button" class="opt" data-i="0" data-j="2">(iii) मिस्टर कारवास्की</button></div><div class="answer">उत्तर: लिल मिलर</div></section><section class="q" id="q1"><div>(ख) बैंक की मशीन के पास कारवास्की को कितने डॉलर मिले?</div><div class="opts"><button type="button" class="opt" data-i="1" data-j="0">(i) 200</button><button type="button" class="opt" data-i="1" data-j="1">(ii) 400</button><button type="button" class="opt" data-i="1" data-j="2">(iii) 300</button></div><div class="answer">उत्तर: 300</div></section><section class="q" id="q2"><div>(ग) कारवास्की को लिफाफा सौंपने के बाद कितने डॉलर मिले?</div><div class="opts"><button type="button" class="opt" data-i="2" data-j="0">(i) 100</button><button type="button" class="opt" data-i="2" data-j="1">(ii) 200</button><button type="button" class="opt" data-i="2" data-j="2">(iii) 80</button></div><div class="answer">उत्तर: 100</div></section><section class="q" id="q3"><div>(घ) ‘मजाक’ (उर्दू) शब्द का हिंदी शब्द है—</div><div class="opts"><button type="button" class="opt" data-i="3" data-j="0">(i) परिहास</button><button type="button" class="opt" data-i="3" data-j="1">(ii) हास्यस्पद</button><button type="button" class="opt" data-i="3" data-j="2">(iii) हँसनीय</button></div><div class="answer">उत्तर: परिहास</div></section><div class="actions"><button type="button" class="action" id="submit">Submit</button><button type="button" class="action" id="show">Show Answer</button><button type="button" class="action" id="reset">Reset</button></div><div class="marks" id="marks">Marks: 0 / 4</div></main><script>const KEY='kopal-6-ch8-mcq';const answers=[0, 2, 0, 0];let values={};try{values=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify(values))}catch(e){}}function render(){document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('selected',values[b.dataset.i]===Number(b.dataset.j)))}document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{values[b.dataset.i]=Number(b.dataset.j);save();document.getElementById('q'+b.dataset.i).classList.remove('good','bad');render()}));document.getElementById('submit').onclick=()=>{let n=0;answers.forEach((a,i)=>{const e=document.getElementById('q'+i);e.classList.remove('good','bad');if(values[i]!==undefined){const ok=values[i]===a;if(ok)n++;e.classList.add(ok?'good':'bad')}});document.getElementById('marks').textContent=`Marks: ${n} / ${answers.length}`};document.getElementById('show').onclick=()=>document.querySelectorAll('.answer').forEach(e=>e.style.display='block');document.getElementById('reset').onclick=()=>{values={};save();document.querySelectorAll('.q').forEach(e=>e.classList.remove('good','bad'));document.querySelectorAll('.answer').forEach(e=>e.style.display='none');document.getElementById('marks').textContent=`Marks: 0 / ${answers.length}`;render()};render();</script></body></html>
