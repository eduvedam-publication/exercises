<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-2-ch9-drag-drop.html</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:440px;display:flex;flex-direction:column}h2{font-size:23px;color:#ff0066;margin:0 0 16px}.q{background:#effaff;border:1.5px solid #00c4ed;border-radius:12px;padding:12px 15px;margin:6px 0;font-size:18px;line-height:1.9}.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#e2f8ff;padding:12px;border-radius:10px;margin-bottom:14px}.chip{border:1.5px solid #00a9dc;border-radius:7px;background:#fff;padding:6px 12px;font-size:18px;cursor:grab;font-family:inherit}.chip.sel{background:#c8eaff}.chip.used{opacity:.4}.blank{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:125px;min-height:35px;border:2px dashed #ff5b52;border-radius:6px;padding:2px 7px;cursor:pointer;background:#fff}.ok{background:#d9f8dc!important;border-color:#24ad54!important}.bad{background:#ffe2e2!important;border-color:#f33!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff8080}}.options{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.opt{font:inherit;font-size:16px;border:1.5px solid #ff0066;background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}.opt.selected{background:#dcefff}.actions{display:flex;justify-content:center;gap:12px;margin-top:auto;padding-top:24px}button.action{background:#ff8700;color:white;border:0;border-radius:18px;padding:9px 21px;font-weight:bold;cursor:pointer}#result{text-align:center;color:#0755af;font-weight:bold;margin-top:12px}.answer{border:1.5px solid #ff6b59;border-radius:7px;padding:7px;font:18px Arial,"Noto Sans Devanagari",sans-serif;width:100%;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:16px;color:#555}@media(max-width:650px){.wrap{margin:4px;padding:14px;min-height:calc(100vh - 8px)}h2{font-size:21px}.q{font-size:16px}.two{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h2>चुनिए और लिखिए–</h2><div class="bank"><button class="chip" draggable="true" data-word="विकेटकीपर">विकेटकीपर</button><button class="chip" draggable="true" data-word="अंपायरों">अंपायरों</button><button class="chip" draggable="true" data-word="बल्लेबाज़ों">बल्लेबाज़ों</button></div><div class="q">(क) प्रत्येक टीम में एक <span class="blank" data-i="0"></span>, और तीन-चार गेंदबाज़ व अन्य बल्लेबाज़ होते हैं।</div><div class="q">(ख) एक टीम <span class="blank" data-i="1"></span>, दूसरी टीम फील्डिंग करती है।</div><div class="q">(ग) मैदान में खेल का निर्णय दो <span class="blank" data-i="2"></span> द्वारा किया जाता है।</div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="resetExercise()">Reset</button></div><div id="result">Score: 0 / 3</div></main><script>const key='kopal-2-ch9-drag-drop',answers=['विकेटकीपर','बल्लेबाज़ों','अंपायरों'],blanks=[...document.querySelectorAll('.blank')];let selected=null;function save(){localStorage.setItem(key,JSON.stringify(blanks.map(b=>b.textContent)));document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('used',blanks.some(b=>b.textContent===c.dataset.word)))}function set(b,w){if(!w)return;blanks.forEach(x=>{if(x!==b&&x.textContent===w)x.textContent=''});b.textContent=w;b.classList.remove('ok','bad');save()}document.querySelectorAll('.chip').forEach(c=>{c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.word);c.onclick=()=>{selected=c.dataset.word;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===c))}});blanks.forEach(b=>{b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();set(b,e.dataTransfer.getData('text/plain'))};b.onclick=()=>{if(selected){set(b,selected);selected=null;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'))}else{b.textContent='';b.classList.remove('ok','bad');save()}}});function submit(){let score=0;blanks.forEach((b,i)=>{let ok=b.textContent===answers[i];b.classList.remove('ok','bad');void b.offsetWidth;b.classList.add(ok?'ok':'bad');if(ok)score++});document.getElementById('result').textContent=`Score: ${score} / 3`;save()}function resetExercise(){blanks.forEach(b=>{b.textContent='';b.className='blank'});document.getElementById('result').textContent='Score: 0 / 3';save()}try{JSON.parse(localStorage.getItem(key)||'[]').forEach((v,i)=>{if(blanks[i])blanks[i].textContent=v||''});save()}catch(e){}</script></body></html>
