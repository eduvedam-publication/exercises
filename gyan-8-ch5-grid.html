<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>अभ्यास</title><style>*{box-sizing:border-box}body{margin:0;background:#d0faff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#202020}.wrap{max-width:990px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a9e9;margin:0 0 16px;font-size:25px}.q{background:#ebfaff;border:1px solid #00b9ed;border-radius:11px;padding:13px;margin:9px 0}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:9px}.opt{background:white;border:1px solid #9bdfff;border-radius:7px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}.opt.selected{border:2px solid #008ad1;background:#d7f4ff}.correct{background:#d6ffe5!important;border-color:#0baf54!important}.wrong{background:#ffe0e0!important;border-color:#e33!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.5}}.buttons{text-align:center;margin-top:24px}button{background:#ff8000;color:white;border:0;border-radius:22px;padding:11px 19px;margin:3px;cursor:pointer;font-weight:bold}.bank{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;background:#dff7ff;padding:13px;border-radius:10px;margin:12px 0}.chip{color:#202020;font-family:inherit;font-weight:normal;line-height:1.5;appearance:none;border:1px solid #00aeec;background:white;border-radius:7px;padding:9px 14px;cursor:grab;font-size:18px}.chip.active{outline:3px solid orange}.slot{display:inline-flex;min-width:125px;min-height:37px;border:2px dashed #ff724d;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;padding:4px 10px;cursor:pointer;background:white}.slot.filled{border-style:solid}.statement{display:flex;gap:10px;justify-content:space-between;align-items:center}.choices{display:flex;gap:6px;flex-shrink:0}.choice{color:#202020;font-family:Arial,sans-serif;font-size:21px;font-weight:bold;min-width:40px;min-height:37px;line-height:1;appearance:none;border:1px solid #00aeec;background:white;border-radius:7px;padding:7px 13px;cursor:pointer}.choice.selected{background:#ccefff;border-width:2px}@media(max-width:650px){.wrap{margin:7px;padding:14px}.options{grid-template-columns:1fr}.q{font-size:16px}.statement{align-items:flex-start;flex-direction:column}}.chip{max-width:100%;text-align:left;white-space:normal;overflow-wrap:anywhere}.slot{max-width:100%;overflow-wrap:anywhere}.q{line-height:1.9}
.slot{font:inherit;color:inherit;margin:0}
.fields{display:flex;flex-wrap:wrap;gap:8px}
.fields label{display:flex;flex-direction:column;gap:2px}
.fields label span{font-size:.9em}
.slot[data-feedback]::after{content:attr(data-feedback);margin-inline-start:6px}

#questions{display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;gap:16px}
.puzzle{display:grid;gap:2px}
.puzzle .slot,.given{display:grid;place-items:center;min-width:0;width:100%;height:44px;margin:0;padding:2px;font-size:17px}
.given{border:1px solid #00aeec;border-radius:7px;background:#ebfaff}
.puzzle .slot[data-feedback]::after{position:absolute;right:2px;top:0;font-size:12px}
.puzzle .slot{position:relative}
</style></head><body><main class="wrap"><h2>विलोम शब्दों के जोड़े बनाइए–</h2><div class="bank" id="bank"></div><div id="questions"></div><div class="buttons"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div></main><script>
const data = [
  ['', ['नि', 'स', 'जी']],
  ['', ['आ', 'या', 'नि']],
  ['', ['उ', 'प', 'का', 'अ', 'प', 'का']]
];
const words = ['का', 'स', 'आ', 'प', 'नि', 'उ', 'जी', 'अ', 'या'];
const key = 'gyan-8-ch5-grid';
const layouts = [
  [[2,0,0],[2,1,'जी'],[0,2,1],[1,2,2],[2,2,'व']],
  [[2,0,0],[2,1,1],[0,2,2],[1,2,'र्या'],[2,2,'त']],
  [[3,0,0],[3,1,1],[3,2,2],[0,3,3],[1,3,4],[2,3,5],[3,3,'र']]
];
let selected=null;
const empty=()=>data.map(([, correct])=>correct.map(()=>null));
let answers=empty();
try {
  const saved=JSON.parse(localStorage.getItem(key));
  if(Array.isArray(saved) && saved.length===data.length){
    answers=empty().map((row,i)=>row.map((_,j)=>words.includes(saved[i]?.[j])?saved[i][j]:null));
  }
} catch {}
function save(){
  try { localStorage.setItem(key,JSON.stringify(answers)); } catch {}
}
function put(i,j,word){
  if(word!==null && !words.includes(word)) return;
  answers[i][j]=word;
  selected=null;
  save();
  render();
  document.querySelector(`[data-slot="${i}-${j}"]`).focus();
}
function render(){
  const bank=document.getElementById('bank');
  bank.replaceChildren();
  words.forEach((word,index)=>{
    const chip=document.createElement('button');
    chip.className='chip'+(word===selected?' active':'');
    chip.textContent=word;
    chip.draggable=true;
    chip.setAttribute('aria-pressed',String(word===selected));
    chip.ondragstart=e=>e.dataTransfer.setData('text/plain',word);
    chip.onclick=()=>{
      selected=selected===word?null:word;
      render();
      bank.children[index].focus();
    };
    bank.append(chip);
  });
  const questions=document.getElementById('questions');
  questions.replaceChildren();
  layouts.forEach((cells,i)=>{
    const grid=document.createElement('div');
    grid.className='q puzzle';
    grid.style.gridTemplateColumns='repeat('+ (i===2?4:3) +', 44px)';
    grid.setAttribute('role','group');
    grid.setAttribute('aria-label','जोड़ी '+(i+1));
    cells.forEach(([column,row,value])=>{
      const given=typeof value==='string';
      const cell=document.createElement(given?'span':'button');
      cell.style.gridColumn=column+1;
      cell.style.gridRow=row+1;
      if(given){
        cell.className='given';
        cell.textContent=value;
      }else{
        cell.type='button';
        cell.className='slot'+(answers[i][value]?' filled':'');
        cell.dataset.slot=i+'-'+value;
        cell.textContent=answers[i][value] || '';
        cell.setAttribute('aria-label','रिक्त स्थान '+(value+1)+' '+(answers[i][value]||'खाली'));
        cell.onclick=()=>put(i,value,selected);
        cell.ondragover=e=>e.preventDefault();
        cell.ondrop=e=>{e.preventDefault();put(i,value,e.dataTransfer.getData('text/plain'));};
      }
      grid.append(cell);
    });
    questions.append(grid);
  });
}
function check(){
  data.forEach(([,correct],i)=>{
    answers[i].forEach((word,j)=>{
      if(word===null) return;
      const slot=document.querySelector(`[data-slot="${i}-${j}"]`);
      const ok=word===correct[j];
      slot.classList.remove('correct','wrong');
      slot.classList.add(ok?'correct':'wrong');
      slot.dataset.feedback=ok?'✓':'✗';
      slot.setAttribute('aria-label',slot.getAttribute('aria-label').replace(/, (सही|गलत)$/,'')+(ok?', सही':', गलत'));
    });
  });
}
function showAnswers(){
  answers=data.map(([,correct])=>[...correct]);
  selected=null;
  save();
  render();
  check();
}
function resetAll(){
  answers=empty();
  selected=null;
  save();
  render();
}
render();
</script></body></html>
