<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiple choice questions.</title><style>*{box-sizing:border-box}body{margin:0;background:#dff6ff;font-family:Arial,sans-serif;color:#171717}.w{max-width:1000px;margin:auto;min-height:100vh;background:#fff;border:5px solid #08a9dc;border-radius:24px;padding:24px}h1{font-size:25px;color:#ff0072;margin:0 0 18px}.q{background:#f6fbfe;border:2px solid #a8eaff;border-radius:17px;padding:13px 16px;margin:10px 0;font-size:17px;font-weight:600;line-height:1.55}.o{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}.opt,button{border:2px solid #ff2581;background:#fff;border-radius:11px;padding:8px 12px;font-size:16px;cursor:pointer}.sel{background:#ffe4f0!important}.ok{background:#dcf8df!important;border-color:#23a443!important}.bad{background:#ffe0e0!important;border-color:#d33!important}.actions{display:flex;justify-content:center;gap:10px;margin-top:18px}#result{text-align:center;font-weight:bold;margin-top:12px}input{border:2px solid #ff5a3d;border-radius:6px;padding:7px 9px;font-size:16px;min-width:140px}@media(max-width:650px){.w{border-width:3px;border-radius:0;padding:14px}h1{font-size:21px}input{min-width:115px}}</style></head><body><main class="w"><h1>Multiple choice questions.</h1><div class="q">1. Why did Kartikeye want to visit his mother?<div class="o"><button class="opt" data-q="0" data-v="0" onclick="pick(this)">i. She was poor</button><button class="opt" data-q="0" data-v="1" onclick="pick(this)">ii. She was travelling</button><button class="opt" data-q="0" data-v="2" onclick="pick(this)">iii. She was alone</button></div></div><div class="q">2. Who offered to take Kartikeye’s place in prison?<div class="o"><button class="opt" data-q="1" data-v="0" onclick="pick(this)">i. The king</button><button class="opt" data-q="1" data-v="1" onclick="pick(this)">ii. A guard</button><button class="opt" data-q="1" data-v="2" onclick="pick(this)">iii. Madhavan</button></div></div><div class="q">3. What made Kartikeye’s return journey difficult?<div class="o"><button class="opt" data-q="2" data-v="0" onclick="pick(this)">i. A cyclone</button><button class="opt" data-q="2" data-v="1" onclick="pick(this)">ii. Heavy snowfall</button><button class="opt" data-q="2" data-v="2" onclick="pick(this)">iii. A desert storm</button></div></div><div class="q">4. Why did Madhavan trust Kartikeye?<div class="o"><button class="opt" data-q="3" data-v="0" onclick="pick(this)">i. He knew Kartikeye would return</button><button class="opt" data-q="3" data-v="1" onclick="pick(this)">ii. The king promised to help him</button><button class="opt" data-q="3" data-v="2" onclick="pick(this)">iii. He wanted to escape</button></div></div><div class="q">5. What did the king do at the end?<div class="o"><button class="opt" data-q="4" data-v="0" onclick="pick(this)">i. Released both friends</button><button class="opt" data-q="4" data-v="1" onclick="pick(this)">ii. Punished Madhavan</button><button class="opt" data-q="4" data-v="2" onclick="pick(this)">iii. Kept Kartikeye in prison</button></div></div><div class="actions"><button onclick="check()">Submit</button><button onclick="location.reload()">Reset</button></div><div id="result"></div></main><script>const A=[2, 2, 0, 0, 0],S={};function pick(e){document.querySelectorAll(`[data-q="${e.dataset.q}"]`).forEach(x=>x.classList.remove('sel'));e.classList.add('sel');S[e.dataset.q]=+e.dataset.v}function check(){let n=0;A.forEach((a,i)=>{document.querySelectorAll(`[data-q="${i}"]`).forEach(x=>{x.classList.remove('ok','bad');if(+x.dataset.v===a)x.classList.add('ok');else if(x.classList.contains('sel'))x.classList.add('bad')});if(S[i]===a)n++});result.textContent=`Score: ${n} / ${A.length}`;}</script></body></html>
