const key="gyandhara-2-ch14-matching";let selected=null,pairs={};const board=document.getElementById('board'),svg=document.getElementById('lines');function save(){localStorage.setItem(key,JSON.stringify(pairs))}function paint(){document.querySelectorAll('.item').forEach(e=>{e.classList.remove('paired','active','wrong');if(e.classList.contains('pic')&&pairs[e.dataset.id]!==undefined)e.classList.add('paired');if(e.classList.contains('word')&&Object.values(pairs).includes(e.dataset.id))e.classList.add('paired')});svg.innerHTML='';const br=board.getBoundingClientRect();Object.entries(pairs).forEach(([a,b])=>{const l=document.querySelector('.pic[data-id="'+a+'"]'),r=document.querySelector('.word[data-id="'+b+'"]');if(!l||!r)return;const x=l.getBoundingClientRect(),y=r.getBoundingClientRect();const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',x.right-br.left);line.setAttribute('y1',x.top+x.height/2-br.top);line.setAttribute('x2',y.left-br.left);line.setAttribute('y2',y.top+y.height/2-br.top);line.setAttribute('stroke','#f24e88');line.setAttribute('stroke-width','3');svg.appendChild(line)})}function choose(e){const el=e.currentTarget,id=el.dataset.id;if(el.classList.contains('pic')){selected=id;document.querySelectorAll('.pic').forEach(p=>p.classList.toggle('active',p===el))}else if(selected!==null){for(const k in pairs)if(pairs[k]===id)delete pairs[k];pairs[selected]=id;selected=null;save();paint();document.getElementById('score').textContent='Score: 0 / 8'}}document.querySelectorAll('.item').forEach(el=>{el.addEventListener('click',choose);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}})});function check(){let s=0;Object.entries(pairs).forEach(([a,b])=>{if(a===b)s++;else document.querySelector('.pic[data-id="'+a+'"]').classList.add('wrong')});document.getElementById('score').textContent=`Score: ${s} / 8`;save()}function resetAll(){pairs={};selected=null;localStorage.removeItem(key);paint();document.getElementById('score').textContent='Score: 0 / 8'}try{pairs=JSON.parse(localStorage.getItem(key))||{}}catch(e){pairs={}}paint();window.addEventListener('resize',paint);
