<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find the Products</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#222}
.exercise{max-width:900px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}
.questions{display:grid;grid-template-columns:1fr 1fr;column-gap:100px;row-gap:14px;padding:0 25px}
.q{display:flex;align-items:center;gap:9px;font-family:Georgia,"Times New Roman",serif;font-size:21px}
.letter{width:25px}
.answer{width:48px;height:38px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:3px 5px;outline:none;text-align:center}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:600px){.questions{grid-template-columns:1fr;gap:14px}.exercise{margin:0;border-radius:0;padding:16px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Use number line to find the following products.</h1>

<div class="questions">
 <div class="q"><span class="letter">a.</span><span>5 × 6</span><input id="a0" class="answer" inputmode="numeric"></div>
 <div class="q"><span class="letter">b.</span><span>4 × 5</span><input id="a1" class="answer" inputmode="numeric"></div>
 <div class="q"><span class="letter">c.</span><span>2 × 6</span><input id="a2" class="answer" inputmode="numeric"></div>
 <div class="q"><span class="letter">d.</span><span>3 × 8</span><input id="a3" class="answer" inputmode="numeric"></div>
</div>

<div class="actions">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetExercise()">Reset</button>
</div>

</main>

<script>
const answers=["30","20","12","24"];
function checkAnswers(){
 let score=0;
 answers.forEach((v,i)=>{
  const e=document.getElementById("a"+i);
  const ok=e.value.trim()===v;
  e.className="answer "+(ok?"ok":"bad");
  if(ok)score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 4`;
}
function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{e.value="";e.className="answer"});
 document.getElementById("result").textContent="Score: 0 / 4";
}
</script>
</body>
</html>
