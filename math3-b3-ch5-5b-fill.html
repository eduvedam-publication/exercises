<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#e5f9fd;font-family:Arial,sans-serif}.exercise{max-width:1080px;min-height:400px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:30px 42px;display:flex;flex-direction:column}h1{margin:0 0 30px;color:#00a3dc;font-size:25px}.content{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:27px 42px}.item{display:flex;align-items:center;gap:8px;font:20px Georgia,serif;white-space:nowrap}.ans{height:38px;width:82px;border:2px solid red;font-size:18px;text-align:center}.qrgrid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:15px 30px}.qrrow{display:contents}.expr{font:20px Georgia,serif;display:flex;align-items:center;gap:8px}.label{font:20px Georgia,serif;display:flex;align-items:center;gap:8px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}.controls{margin-top:auto;padding-top:34px;display:flex;justify-content:center;gap:14px}.controls button{border:0;border-radius:24px;background:#ff7d00;color:#fff;font-weight:bold;padding:12px 22px;cursor:pointer}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:15px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.qrgrid{grid-template-columns:1fr}.qrrow{display:block;margin-bottom:18px}.exercise{padding:22px}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="exercise"><h1>Fill in the blanks.</h1><section class="content"><div class="qrgrid"><div class="expr"><b>a.</b>847 ÷ 5</div><div class="label">Quotient = <input class="ans" id="q0" inputmode="numeric"></div><div class="label">Remainder = <input class="ans" id="r0" inputmode="numeric"></div><div class="expr"><b>b.</b>6725 ÷ 10</div><div class="label">Quotient = <input class="ans" id="q1" inputmode="numeric"></div><div class="label">Remainder = <input class="ans" id="r1" inputmode="numeric"></div><div class="expr"><b>c.</b>2670 ÷ 10</div><div class="label">Quotient = <input class="ans" id="q2" inputmode="numeric"></div><div class="label">Remainder = <input class="ans" id="r2" inputmode="numeric"></div><div class="expr"><b>d.</b>2109 ÷ 6</div><div class="label">Quotient = <input class="ans" id="q3" inputmode="numeric"></div><div class="label">Remainder = <input class="ans" id="r3" inputmode="numeric"></div></div></section><div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div class="score" id="score">Score: 0 / 8</div></main><script>const A=['169', '2', '672', '5', '267', '0', '351', '3'],IDS=['q0', 'r0', 'q1', 'r1', 'q2', 'r2', 'q3', 'r3'];function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById(IDS[i]),g=e.value.trim().replace(/\s/g,'')===a;e.classList.remove('ok','bad');e.classList.add(g?'ok':'bad');if(g)s++});score.textContent='Score: '+s+' / 8'}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});score.textContent='Score: 0 / 8'}</script></body></html>
