<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiple choice questions.</title><style>*{box-sizing:border-box}body{margin:0;background:#dff6ff;font-family:Arial;color:#171717}.w{max-width:1000px;margin:auto;min-height:100vh;background:#fff;border:5px solid #08a9dc;border-radius:24px;padding:24px}h1{font-size:25px;color:#ff0072}.q{background:#f6fbfe;border:2px solid #a8eaff;border-radius:17px;padding:13px 16px;margin:10px 0;font-size:17px;font-weight:600}.o{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}.opt,button{border:2px solid #ff2581;background:#fff;border-radius:11px;padding:8px 12px;font-size:16px;cursor:pointer}.sel{background:#ffe4f0!important}.ok{background:#dcf8df!important}.bad{background:#ffe0e0!important}.actions{display:flex;justify-content:center;gap:10px;margin-top:18px}#result{text-align:center;font-weight:bold;margin-top:12px}input,select{border:2px solid #ff5a3d;padding:7px;border-radius:6px;font-size:16px}@media(max-width:650px){.w{border-width:3px;border-radius:0;padding:14px}}</style></head><body><main class="w"><h1>Multiple choice questions.</h1><div class="q">1. Who came to inspect Mohan&#x27;s class?<div class="o"><button class="opt" data-q="0" data-v="0" onclick="pick(this)">i. Principal</button><button class="opt" data-q="0" data-v="1" onclick="pick(this)">ii. Inspector</button><button class="opt" data-q="0" data-v="2" onclick="pick(this)">iii. Doctor</button></div></div><div class="q">2. Which word did Mohandas spell incorrectly?<div class="o"><button class="opt" data-q="1" data-v="0" onclick="pick(this)">i. Family</button><button class="opt" data-q="1" data-v="1" onclick="pick(this)">ii. Kitchen</button><button class="opt" data-q="1" data-v="2" onclick="pick(this)">iii. Kettle</button></div></div><div class="q">3. Why did Mohandas not copy from his neighbour?<div class="o"><button class="opt" data-q="2" data-v="0" onclick="pick(this)">i. He could not see</button><button class="opt" data-q="2" data-v="1" onclick="pick(this)">ii. He wanted to be honest</button><button class="opt" data-q="2" data-v="2" onclick="pick(this)">iii. He did not know the answer</button></div></div><div class="q">4. Honesty helps us earn ________.<div class="o"><button class="opt" data-q="3" data-v="0" onclick="pick(this)">i. trust</button><button class="opt" data-q="3" data-v="1" onclick="pick(this)">ii. fear</button><button class="opt" data-q="3" data-v="2" onclick="pick(this)">iii. anger</button></div></div><div class="q">5. What happens when people lie again and again?<div class="o"><button class="opt" data-q="4" data-v="0" onclick="pick(this)">i. Everyone trusts them more</button><button class="opt" data-q="4" data-v="1" onclick="pick(this)">ii. Nobody trusts them</button><button class="opt" data-q="4" data-v="2" onclick="pick(this)">iii. They become famous</button></div></div><div class="actions"><button onclick="check()">Submit</button><button onclick="location.reload()">Reset</button></div><div id="result"></div></main><script>const A=[1, 2, 1, 0, 1],S={};function pick(e){document.querySelectorAll(`[data-q="${e.dataset.q}"]`).forEach(x=>x.classList.remove('sel'));e.classList.add('sel');S[e.dataset.q]=+e.dataset.v}function check(){let n=0;A.forEach((a,i)=>{document.querySelectorAll(`[data-q="${i}"]`).forEach(x=>{x.classList.remove('ok','bad');if(+x.dataset.v===a)x.classList.add('ok');else if(x.classList.contains('sel'))x.classList.add('bad')});if(S[i]===a)n++});result.textContent=`Score: ${n} / ${A.length}`}</script></body></html>
