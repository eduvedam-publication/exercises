<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#dff8ff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:5px solid #08a6d1;border-radius:22px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;color:#ff0072;font-size:clamp(22px,3vw,30px);font-weight:800}.content{flex:1}.question{margin:12px 0;padding:13px 16px;border:2px solid #69dfff;border-radius:16px;background:#f3fbfe;font-size:clamp(16px,2vw,19px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option{border:2px solid #ff0072;background:#fff;border-radius:10px;padding:8px 13px;font-size:16px;cursor:pointer}.option.selected{background:#ffe7f1}.option.correct,.answer.correct,.order.correct{background:#dff7e4!important}.option.wrong,.answer.wrong,.order.wrong{background:#ffe2e2!important}.answer{border:2px solid #ff4c39;border-radius:5px;background:#fff;padding:6px 8px;font-size:17px;min-width:125px;max-width:190px;margin:2px 4px}.orderrow{display:flex;justify-content:space-between;align-items:center;gap:15px}.order{width:58px;border:2px solid #ff0072;border-radius:7px;padding:7px;text-align:center;font-size:17px;background:#fff}.bottom{text-align:center;margin-top:22px}.btn{border:2px solid #ff0072;border-radius:10px;background:#fff;color:#111;font-size:16px;padding:8px 14px;margin:4px;cursor:pointer}.score{margin-top:9px;color:#087fc2;font-weight:800;font-size:18px}@media(max-width:650px){body{padding:7px}.exercise{padding:15px 11px}.options{flex-direction:column}.option{width:100%;text-align:left}.answer{min-width:100px;max-width:145px}}</style><main class=exercise><h1 class=title>Arrange the statements in the correct order.</h1><div class=content id=content></div><div class=bottom><button class=btn onclick=check()>Submit</button><button class=btn onclick=resetEx()>Reset</button><div class=score id=score>Score: 0 / 6</div></div></main><script>function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function save(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){const p={exerciseType:t,response:r};try{parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}try{window.ReactNativeWebView&&window.ReactNativeWebView.postMessage(JSON.stringify({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p}))}catch(e){}}const K='b7-ch15-order',D=['Sekhon took off in his Gnat.', 'The air raid siren sounded.', "Sekhon's aircraft was badly hit.", 'Enemy Sabres attacked Srinagar airfield.', 'Sekhon engaged the enemy aircraft in aerial combat.', 'Sekhon was eventually overcome by the enemy aircraft.'],A=[3, 1, 5, 2, 4, 6];let s=load(K);s.v=s.v||{};s.score=s.score||0;function draw(){content.innerHTML=D.map((x,i)=>`<div class="question orderrow"><span><b>${i+1}.</b> ${x}</span><input class=order id=o${i} type=number min=1 max=6 value="${s.v[i]||''}" oninput="upd(${i},this.value)"></div>`).join('');score.textContent=`Score: ${s.score} / 6`}function upd(i,v){s.v[i]=v;save(K,s)}function check(){let n=0;A.forEach((a,i)=>{let e=document.getElementById('o'+i),ok=Number(e.value)===a;e.classList.toggle('correct',ok);e.classList.toggle('wrong',!ok&&!!e.value);if(ok)n++});s.score=n;save(K,s);score.textContent=`Score: ${n} / 6`;send('FILL_BLANK',{answers:s.v,score:n,total:6,completed:Object.keys(s.v).length===6})}function resetEx(){s={v:{},score:0};save(K,s);draw()}draw()</script>
