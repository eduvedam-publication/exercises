<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOPAL Class 8 Chapter 18 Idioms — 2026–27</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#17333b}.wrap{max-width:1000px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a7dd;margin:0 0 8px;font-size:26px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:13px;margin:10px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.opt{border:1px solid #93dcf5;background:white;border-radius:8px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}.opt.sel{background:#d8f3ff;border-color:#009be0}.opt.correct{background:#dcfce5!important;border-color:#22aa55!important}.opt.wrong{background:#ffe3e3!important;border-color:#ff4545!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.actions button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}@media(max-width:620px){.wrap{margin:7px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}.opt{align-items:flex-start}@media(max-width:620px){.opts{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h2>दिए गए मुहावरों के सही अर्थ और वाक्य चुनिए–</h2><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div></main><script>
const data=[["दाने-दाने को मोहताज होना", ["<b>अर्थ</b> पूरी तरह तैयार होना।<br><b>वाक्य</b> परीक्षा में सफलता पाने के लिए विद्यार्थियों ने कमर कस ली।", "<b>अर्थ</b> बहुत अधिक निर्धन हो जाना।<br><b>वाक्य</b> विपत्ति के कारण व्यापारी दाने-दाने को मोहताज हो गया।", "<b>अर्थ</b> सहायता करना।<br><b>वाक्य</b> बहन ने घर के काम में माँ का हाथ बँटाया।", "<b>अर्थ</b> हार जाना।<br><b>वाक्य</b> घमंडी खिलाड़ी को प्रतियोगिता में मुँह की खानी पड़ी।"], 1], ["कमर कसना", ["<b>अर्थ</b> पूरी तरह तैयार होना।<br><b>वाक्य</b> परीक्षा में सफलता पाने के लिए विद्यार्थियों ने कमर कस ली।", "<b>अर्थ</b> सहायता करना।<br><b>वाक्य</b> बहन ने घर के काम में माँ का हाथ बँटाया।", "<b>अर्थ</b> हार जाना।<br><b>वाक्य</b> घमंडी खिलाड़ी को प्रतियोगिता में मुँह की खानी पड़ी।", "<b>अर्थ</b> बहुत अधिक निर्धन हो जाना।<br><b>वाक्य</b> विपत्ति के कारण व्यापारी दाने-दाने को मोहताज हो गया।"], 0], ["हाथ बँटाना", ["<b>अर्थ</b> हार जाना।<br><b>वाक्य</b> घमंडी खिलाड़ी को प्रतियोगिता में मुँह की खानी पड़ी।", "<b>अर्थ</b> बहुत अधिक निर्धन हो जाना।<br><b>वाक्य</b> विपत्ति के कारण व्यापारी दाने-दाने को मोहताज हो गया।", "<b>अर्थ</b> पूरी तरह तैयार होना।<br><b>वाक्य</b> परीक्षा में सफलता पाने के लिए विद्यार्थियों ने कमर कस ली।", "<b>अर्थ</b> सहायता करना।<br><b>वाक्य</b> बहन ने घर के काम में माँ का हाथ बँटाया।"], 3], ["मुँह की खाना", ["<b>अर्थ</b> बहुत अधिक निर्धन हो जाना।<br><b>वाक्य</b> विपत्ति के कारण व्यापारी दाने-दाने को मोहताज हो गया।", "<b>अर्थ</b> पूरी तरह तैयार होना।<br><b>वाक्य</b> परीक्षा में सफलता पाने के लिए विद्यार्थियों ने कमर कस ली।", "<b>अर्थ</b> हार जाना।<br><b>वाक्य</b> घमंडी खिलाड़ी को प्रतियोगिता में मुँह की खानी पड़ी।", "<b>अर्थ</b> सहायता करना।<br><b>वाक्य</b> बहन ने घर के काम में माँ का हाथ बँटाया।"], 2]],key='kopal-8-ch18-idioms';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const root=document.getElementById('questions');
function render(){root.innerHTML=data.map((q,i)=>`<div class="q" id="q${i}"><b>${'कखगघङ'[i]}. ${q[0]}</b><div class="opts">${q[1].map((o,j)=>`<div class="opt ${answers[i]===j?'sel':''}" id="o${i}-${j}" role="button" tabindex="0" onclick="pick(${i},${j})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(${i},${j})}"><span>(${['i','ii','iii','iv'][j]}) ${o}</span><span>${answers[i]===j?'☑':'□'}</span></div>`).join('')}</div></div>`).join('')}
function pick(i,j){answers[i]=j;try{localStorage.setItem(key,JSON.stringify(answers))}catch(e){}render()}
function check(){data.forEach((q,i)=>{document.querySelectorAll(`#q${i} .opt`).forEach(el=>el.classList.remove('correct','wrong'));const el=document.getElementById('o'+i+'-'+answers[i]);if(el){const ok=answers[i]===q[2];el.classList.add(ok?'correct':'wrong');el.lastElementChild.textContent=ok?'✓':'✗';}});}
function showAnswers(){data.forEach((q,i)=>answers[i]=q[2]);try{localStorage.setItem(key,JSON.stringify(answers))}catch(e){}render();check()}
function resetAll(){answers={};try{localStorage.removeItem(key)}catch(e){}render();}render();</script></body></html>
