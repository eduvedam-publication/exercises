<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Tick (✓) the correct statements.</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#dff6ff;font-family:Arial,sans-serif;color:#171717}
.wrap{max-width:1000px;margin:auto;min-height:100vh;background:#fff;border:5px solid #08a9dc;border-radius:24px;padding:24px}
h1{font-size:25px;color:#ff0072;margin:0 0 18px}
.q{background:#f6fbfe;border:2px solid #a8eaff;border-radius:17px;padding:13px 16px;margin:10px 0;font-size:17px;font-weight:600;line-height:1.55}
.opts{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}
.opt,button{border:2px solid #ff2581;background:#fff;border-radius:11px;padding:8px 12px;font-size:16px;cursor:pointer}
.sel{background:#ffe4f0!important}.ok{background:#dcf8df!important;border-color:#23a443!important}.bad{background:#ffe0e0!important;border-color:#d33!important}
.actions{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:20px}
#result{text-align:center;font-weight:bold;margin-top:12px}
input{border:2px solid #ff5a3d;border-radius:6px;padding:7px 9px;font-size:16px;min-width:135px}
@media(max-width:650px){.wrap{border-width:3px;border-radius:0;padding:14px}h1{font-size:21px}input{min-width:110px}}
</style></head><body><main class="wrap"><h1>Tick (✓) the correct statements.</h1><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:12px"><span style="flex:1 1 500px">1. Ahmed Rizvi was an expert in embroidery.</span><div class="opts" style="margin:0"><button class="opt" data-q="0" data-v="0" onclick="pick(this)">✓</button><button class="opt" data-q="0" data-v="1" onclick="pick(this)">×</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:12px"><span style="flex:1 1 500px">2. Ahmed&#x27;s sons always helped him with his work.</span><div class="opts" style="margin:0"><button class="opt" data-q="1" data-v="0" onclick="pick(this)">✓</button><button class="opt" data-q="1" data-v="1" onclick="pick(this)">×</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:12px"><span style="flex:1 1 500px">3. Faraz chose the house.</span><div class="opts" style="margin:0"><button class="opt" data-q="2" data-v="0" onclick="pick(this)">✓</button><button class="opt" data-q="2" data-v="1" onclick="pick(this)">×</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:12px"><span style="flex:1 1 500px">4. Faiz chose the houseboat.</span><div class="opts" style="margin:0"><button class="opt" data-q="3" data-v="0" onclick="pick(this)">✓</button><button class="opt" data-q="3" data-v="1" onclick="pick(this)">×</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:12px"><span style="flex:1 1 500px">5. Fahad received his father&#x27;s embroidery skill.</span><div class="opts" style="margin:0"><button class="opt" data-q="4" data-v="0" onclick="pick(this)">✓</button><button class="opt" data-q="4" data-v="1" onclick="pick(this)">×</button></div></div><div class="q" style="display:flex;align-items:center;flex-wrap:wrap;gap:12px"><span style="flex:1 1 500px">6. Fahad&#x27;s business became successful.</span><div class="opts" style="margin:0"><button class="opt" data-q="5" data-v="0" onclick="pick(this)">✓</button><button class="opt" data-q="5" data-v="1" onclick="pick(this)">×</button></div></div>
<div class="actions"><button onclick="check()">Submit</button><button onclick="location.reload()">Reset</button></div>
<div id="result"></div></main><script>const A=[0, 1, 0, 0, 0, 0],S={};
function pick(e){document.querySelectorAll(`[data-q="${e.dataset.q}"]`).forEach(x=>x.classList.remove('sel'));e.classList.add('sel');S[e.dataset.q]=+e.dataset.v}
function check(){let n=0;A.forEach((a,i)=>{document.querySelectorAll(`[data-q="${i}"]`).forEach(x=>{x.classList.remove('ok','bad');if(+x.dataset.v===a)x.classList.add('ok');else if(x.classList.contains('sel'))x.classList.add('bad')});if(S[i]===a)n++});result.textContent=`Score: ${n} / ${A.length}`;}</script></body></html>
