<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fill in the blanks</title><style>
*{box-sizing:border-box}body{margin:0;background:#d2faff;font-family:Georgia,'Times New Roman',serif;color:#172b39}.sheet{max-width:980px;margin:3vh auto;background:#fff;border:3px solid #00aee8;border-radius:22px;padding:24px 28px;min-height:280px}h2{color:#00a8df;margin:0 0 18px;font-size:26px}.items{display:grid;grid-template-columns:1fr 1fr;gap:17px 28px}.q{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:20px;padding:9px 10px;background:#e9faff;border:1px solid #00b7ee;border-radius:10px}.q .letter{font-weight:bold;margin-right:4px}.q input{width:145px;max-width:45%;height:36px;border:2px solid #ff684f;border-radius:3px;padding:4px 7px;font-size:18px;color:#172b39;background:white}.q input.correct{border-color:#12a45b;background:#e6fff0}.q input.wrong{border-color:#f04444;background:#fff0f0;animation:blink .8s 3}@keyframes blink{50%{border-color:transparent}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}button{background:#ff8200;color:white;border:0;border-radius:30px;padding:11px 19px;font-weight:bold;cursor:pointer}button:hover{background:#e96e00}@media(max-width:650px){.sheet{margin:10px;padding:18px 12px}.items{grid-template-columns:1fr;gap:10px}h2{font-size:23px}.q{font-size:18px}}
</style></head><body><main class="sheet"><h2>Fill in the blanks.</h2><div class="items" id="items"></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div></main><script>
const questions=[["₹ 90.26 × 16 =", "1444.16"], ["₹ 314.00 × 43 =", "13502"], ["₹ 154.63 × 19 =", "2937.97"], ["₹ 493.23 × 23 =", "11344.29"]];
const storageKey="math-4-ch11-11c";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch{return []}})();
const root=document.getElementById('items');
questions.forEach(([question,answer],i)=>{let box=document.createElement('label');box.className='q';let letter=document.createElement('span');letter.className='letter';letter.textContent='abcd'[i]+'.';let txt=document.createElement('span');txt.textContent=question;let inp=document.createElement('input');inp.type='text';inp.setAttribute('aria-label','Answer '+(i+1));inp.autocomplete='off';inp.value=saved[i]||'';inp.addEventListener('input',()=>{inp.classList.remove('correct','wrong');save()});box.append(letter,txt,inp);root.append(box)});
function inputs(){return [...document.querySelectorAll('.q input')]}
function save(){localStorage.setItem(storageKey,JSON.stringify(inputs().map(x=>x.value)))}
function norm(s){return String(s).replace(/rs\.?|₹|,/gi,'').replace(/\s/g,'').trim().replace(/^0+(?=\d)/,'')}
function check(){inputs().forEach((inp,i)=>{inp.classList.remove('correct','wrong');if(!inp.value.trim())return;let ok=norm(inp.value)===norm(questions[i][1]) || (Number.isFinite(Number(norm(inp.value)))&&Math.abs(Number(norm(inp.value))-Number(norm(questions[i][1])))<0.000001);inp.classList.add(ok?'correct':'wrong')})}
function showAnswers(){inputs().forEach((inp,i)=>{inp.value=questions[i][1];inp.classList.remove('wrong');inp.classList.add('correct')});save()}
function resetAll(){inputs().forEach(inp=>{inp.value='';inp.classList.remove('correct','wrong')});save()}
</script></body></html>
