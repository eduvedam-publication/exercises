<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiple choice questions.</title><style>
*{box-sizing:border-box} body{margin:0;background:#dff6ff;font-family:Arial,sans-serif;color:#151515}
.wrap{max-width:1000px;margin:0 auto;min-height:100vh;background:#fff;border:5px solid #08a9dc;border-radius:24px;padding:24px}
h1{font-size:25px;color:#ff0072;margin:0 0 18px}.q{background:#f6fbfe;border:2px solid #a8eaff;border-radius:18px;padding:14px 17px;margin:10px 0;font-size:17px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}.opt,button{border:2px solid #ff2581;background:white;border-radius:12px;padding:9px 13px;cursor:pointer;font-size:16px}
.opt.sel{background:#ffe4f0}.opt.ok{background:#dcf8df;border-color:#23a443}.opt.bad{background:#ffe0e0}
input{border:2px solid #ff4b35;padding:7px;border-radius:4px;font-size:16px;min-width:150px}
.actions{margin-top:18px;display:flex;gap:10px}.result{font-weight:bold;margin-top:12px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 80px;position:relative}.mitem{border:2px solid #ff8a3d;border-radius:12px;padding:12px;background:#fff;cursor:pointer}.mitem.active{outline:4px solid #ffd3e5}.mitem.done{background:#e4f8e7}
@media(max-width:650px){.wrap{border-width:3px;border-radius:0;padding:14px}.match{gap:10px 18px}h1{font-size:21px}}
</style></head>
<body><main class="wrap"><h1>Multiple choice questions.</h1><section class="q">1. The Spanish Civil War was fought between:<div class="opts"><button class="opt" data-q="0" data-v="0" onclick="pick(this)">i. two foreign countries</button><button class="opt" data-q="0" data-v="1" onclick="pick(this)">ii. left- and right-wing factions</button><button class="opt" data-q="0" data-v="2" onclick="pick(this)">iii. Spain and France</button></div></section><section class="q">2. Toledo was protected by:<div class="opts"><button class="opt" data-q="1" data-v="0" onclick="pick(this)">i. inner and outer walls</button><button class="opt" data-q="1" data-v="1" onclick="pick(this)">ii. a river only</button><button class="opt" data-q="1" data-v="2" onclick="pick(this)">iii. mountains only</button></div></section><section class="q">3. The right-wing commander threatened to:<div class="opts"><button class="opt" data-q="2" data-v="0" onclick="pick(this)">i. free Moscardo&#x27;s son</button><button class="opt" data-q="2" data-v="1" onclick="pick(this)">ii. execute Moscardo&#x27;s son</button><button class="opt" data-q="2" data-v="2" onclick="pick(this)">iii. send Moscardo&#x27;s son home</button></div></section><section class="q">4. Moscardo asked his son to:<div class="opts"><button class="opt" data-q="3" data-v="0" onclick="pick(this)">i. die bravely for his motherland</button><button class="opt" data-q="3" data-v="1" onclick="pick(this)">ii. surrender</button><button class="opt" data-q="3" data-v="2" onclick="pick(this)">iii. escape</button></div></section><section class="q">5. According to the passage, students can serve their country by:<div class="opts"><button class="opt" data-q="4" data-v="0" onclick="pick(this)">i. avoiding studies</button><button class="opt" data-q="4" data-v="1" onclick="pick(this)">ii. becoming soldiers</button><button class="opt" data-q="4" data-v="2" onclick="pick(this)">iii. working hard in their studies</button></div></section><div class="actions"><button onclick="check()">Submit</button><button onclick="location.reload()">Reset</button></div><div id="result" class="result"></div></main><script>const ans=[1, 0, 1, 0, 2],sel={};function pick(b){document.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel[b.dataset.q]=+b.dataset.v}function check(){let s=0;ans.forEach((a,i)=>{let bs=document.querySelectorAll(`[data-q="${i}"]`);bs.forEach(x=>{x.classList.remove('ok','bad');if(+x.dataset.v===a)x.classList.add('ok');else if(x.classList.contains('sel'))x.classList.add('bad')});if(sel[i]===a)s++});result.textContent=`Score: ${s} / ${ans.length}`;}</script></body></html>
