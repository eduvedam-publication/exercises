mit</button><button type="button" id="show">Show Answer</button><button type="button" id="reset">Reset</button></div></main><script>const questions=[{"answer": "3"}, {"answer": "16"}, {"answer": "8"}, {"answer": "0"}, {"answer": "5"}, {"answer": "17"}],key='exercise:math-1-ch4-4b-cross-out-lines.html';const fields=questions.map((_,i)=>document.getElementById('a'+i));function norm(v){return String(v).replace(/\s+/g,'').replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c))}function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}catch(e){}}function clear(){fields.forEach(x=>x.classList.remove('correct','wrong'))}fields.forEach(x=>x.addEventListener('input',()=>{clear();save()}));try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))fields.forEach((x,i)=>{if(typeof a[i]==='string')x.value=a[i]})}catch(e){}document.getElementById('submit').addEventListener('click',()=>{fields.forEach((x,i)=>{const ok=norm(x.value)===questions[i].answer;x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok)});save();const detail={exerciseType:'FILL_BLANK',exerciseId:'math-1-ch4-4b-cross-out-lines.html',response:Object.fromEntries(fields.map((x,i)=>['question'+(i+1),x.value]))};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')});document.getElementById('show').addEventListener('click',()=>{fields.forEach((x,i)=>x.value=questions[i].answer);clear();save()});document.getElementById('reset').addEventListener('click',()=>{fields.forEach(x=>x.value='');clear();save()});
const removals=[9,3,10,10,8,0],stickKey='lines:math-1-ch4-4b-cross-out-lines.html';const sticks=[...document.querySelectorAll('.stick')];function saveSticks(){try{localStorage.setItem(stickKey,JSON.stringify(sticks.map(s=>s.classList.contains('crossed'))))}catch(e){}}function cross(s,on){s.classList.toggle('crossed',on);s.setAttribute('aria-pressed',String(on))}try{const saved=JSON.parse(localStorage.getItem(stickKey)||'[]');sticks.forEach((s,i)=>cross(s,saved[i]===true))}catch(e){}sticks.forEach(s=>s.addEventListener('click',()=>{cross(s,!s.classList.contains('crossed'));saveSticks()}));document.getElementById('reset').addEventListener('click',()=>{sticks.forEach(s=>cross(s,false));saveSticks()});document.getElementById('show').addEventListener('click',()=>{sticks.forEach(s=>cross(s,+s.dataset.stick<removals[+s.dataset.row]));saveSticks()});
