<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>अभ्यास</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#17333b}.wrap{max-width:1000px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a7dd;margin:0 0 8px;font-size:26px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:13px;margin:10px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.opt{border:1px solid #93dcf5;background:white;border-radius:8px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}.opt.sel{background:#d8f3ff;border-color:#009be0}.opt.correct{background:#dcfce5!important;border-color:#22aa55!important}.opt.wrong{background:#ffe3e3!important;border-color:#ff4545!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.actions button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}@media(max-width:620px){.wrap{margin:7px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h2><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div></main><script>
const data=[["एकार्थक प्रतीत होने वाले शब्दों को कहते हैं–", ["अनेकार्थी", "समरूपी भिन्नार्थक", "समानार्थक भी"], 2], ["एकार्थक प्रतीत होने वाले शब्दों में अर्थ और प्रयोग की दृष्टि से होता है–", ["अंतर", "सूक्ष्म अंतर", "अत्यधिक अंतर"], 1], ["किसी विशेष विषय के अच्छे ज्ञाता या जानकार को कहते हैं–", ["विज्ञ", "भिज्ञ", "अनभिज्ञ"], 0], ["शुभ या धार्मिक कार्य प्रारंभ करना को कहते हैं–", ["शुरू करना", "श्री गणेश करना", "आरंभ करना"], 1]],key='gyan-7-ch9-mcq-v1';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const root=document.getElementById('questions');
function render(){root.innerHTML=data.map((q,i)=>`<div class="q" id="q${i}"><b>${'कखगघङ'[i]}. ${q[0]}</b><div class="opts">${q[1].map((o,j)=>`<div class="opt ${answers[i]===j?'sel':''}" id="o${i}-${j}" role="button" tabindex="0" onclick="pick(${i},${j})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(${i},${j})}"><span>(${['i','ii','iii','iv'][j]}) ${o}</span><span>${answers[i]===j?'☑':'□'}</span></div>`).join('')}</div></div>`).join('')}
function pick(i,j){answers[i]=j;try{localStorage.setItem(key,JSON.stringify(answers))}catch(e){}render()}
function check(){data.forEach((q,i)=>{document.querySelectorAll(`#q${i} .opt`).forEach(el=>el.classList.remove('correct','wrong'));const el=document.getElementById('o'+i+'-'+answers[i]);if(el){const ok=answers[i]===q[2];el.classList.add(ok?'correct':'wrong');el.lastElementChild.textContent=ok?'✓':'✗';}});}
function showAnswers(){data.forEach((q,i)=>answers[i]=q[2]);try{localStorage.setItem(key,JSON.stringify(answers))}catch(e){}render();check()}
function resetAll(){answers={};try{localStorage.removeItem(key)}catch(e){}render();}render();</script></body></html>
