<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gyandhara 4 Chapter 6 – सही या गलत</title><style>*{box-sizing:border-box}body{margin:0;background:#ccfaff;font-family:'Noto Sans Devanagari','Mangal',sans-serif;color:#222;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}.sheet{width:min(100%,1050px);background:white;border:3px solid #00aeed;border-radius:21px;padding:25px}h2{color:#00a9ed;margin:0 0 17px;font-size:clamp(21px,3vw,29px)}.question{display:flex;align-items:center;gap:12px;background:#e8faff;border:1.5px solid #00b5ff;border-radius:12px;margin:9px 0;padding:13px;font-size:clamp(15px,2vw,19px)}.question .statement{flex:1}.choices{display:flex;gap:9px;flex-shrink:0}.choice{background:white;border:1.5px solid #00aeed;border-radius:8px;min-width:43px;min-height:40px;font-size:22px;cursor:pointer;color:#222}.choice.active{background:#a9f1e6;border-color:#008bd0}.choice.correct{background:#d5f9d6;border-color:#30a34b}.choice.wrong{background:#ffe0e0;border-color:#e14848}.footer{text-align:center;margin-top:23px}button.action{background:#ff7900;color:white;border:0;border-radius:25px;padding:12px 18px;font-weight:bold;margin:3px;cursor:pointer}.marks{color:#0057ca;font-size:20px;font-weight:bold;margin-top:10px}@media(max-width:550px){.sheet{padding:14px}.question{flex-wrap:wrap}.choices{margin-left:auto}}</style></head><body><main class="sheet"><h2>सही (✓) या गलत (✗) का चिह्न लगाइए–</h2><div id="questions"></div><div class="footer"><button class="action" onclick="submitAnswers()">Submit</button><button class="action" onclick="showAnswers()">Show Answer</button><button class="action" onclick="resetAnswers()">Reset</button><div class="marks" id="marks">Marks: 0 / 4</div></div></main><script>
const questions=[['(क) संज्ञा के मुख्य तीन भेद हैं।','true'],['(ख) जातिवाचक और भाववाचक संज्ञा में कोई अंतर नहीं है।','false'],['(ग) द्रव्यवाचक और समुदायवाचक संज्ञा को जातिवाचक के अंतर्गत माना जाता है।','true'],['(घ) व्यक्तिवाचक संज्ञा शब्दों से संपूर्ण जाति का बोध होता है।','false']];
const storageKey='Gyandhara-4-ch6-tick-v1';let selections=JSON.parse(localStorage.getItem(storageKey)||'{}');const area=document.getElementById('questions');function save(){localStorage.setItem(storageKey,JSON.stringify(selections))}function render(){area.innerHTML='';questions.forEach(([q,ans],i)=>{const row=document.createElement('div');row.className='question';const label=document.createElement('span');label.className='statement';label.textContent=q;row.appendChild(label);const choices=document.createElement('div');choices.className='choices';[['true','✓'],['false','✗']].forEach(([value,symbol])=>{const b=document.createElement('button');b.className='choice'+(selections[i]===value?' active':'');b.textContent=symbol;b.setAttribute('aria-label',value==='true'?'सही':'गलत');b.onclick=()=>{selections[i]=value;save();render()};choices.appendChild(b)});row.appendChild(choices);area.appendChild(row)})}function submitAnswers(){let score=0;questions.forEach((q,i)=>{if(selections[i]===q[1])score++});document.getElementById('marks').textContent=`Marks: ${score} / ${questions.length}`;}function showAnswers(){questions.forEach((q,i)=>selections[i]=q[1]);save();render();submitAnswers()}function resetAnswers(){selections={};save();render();document.getElementById('marks').textContent='Marks: 0 / 4'}render();
</script></body></html>
