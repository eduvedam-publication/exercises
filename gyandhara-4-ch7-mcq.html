<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>gyandhara-4-ch7-mcq.html</title><style>*{box-sizing:border-box}body{margin:0;background:#cff8ff;font-family:"Noto Sans Devanagari",Mangal,Arial,sans-serif;color:#202b38}.sheet{max-width:950px;min-height:560px;margin:12px auto;padding:22px 26px;background:#fff;border:3px solid #00afe0;border-radius:22px;display:flex;flex-direction:column}h1{margin:0 0 15px;color:#00a9d9;font-size:clamp(20px,3vw,27px)}.content{flex:1}.q{border:1.5px solid #00bff1;background:#edfbff;border-radius:11px;margin:9px 0;padding:12px 14px;font-size:18px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}.opt{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:7px;border:1px solid #7dd9ef;background:#fff;border-radius:8px;padding:10px;cursor:pointer;font:inherit;color:inherit}.square{width:22px;height:22px;border:2px solid #00b7f0;flex-shrink:0}.opt.selected{background:#d7f4ff;border-color:#008fdd}.correct{background:#d7f8df!important;border-color:#17a04b!important}.incorrect{background:#ffe1e1!important;border-color:#ed3c3c!important}.bank{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;background:#e0f7ff;border-radius:10px;padding:13px;margin:8px 0 15px}.word{font:inherit;font-size:18px;background:white;border:1.5px solid #00b8f0;border-radius:8px;padding:8px 16px;cursor:grab}.word.used{opacity:.4}.slot{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:37px;vertical-align:middle;border:2px dashed #ff684b;border-radius:7px;background:white;cursor:pointer;padding:2px 10px}.slot.active{background:#e6f7ff;border-color:#0089d6}.sentence{line-height:2.2}.tfrow{display:flex;align-items:center;gap:14px}.tfrow .sentence{flex:1;line-height:1.6}.tfopts{display:flex;gap:8px}.tfbtn{border:1.5px solid #00b8ef;border-radius:7px;background:#fff;font-size:20px;min-width:43px;min-height:37px;cursor:pointer}.tfbtn.selected{background:#d7f4ff}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button{border:0;border-radius:24px;background:#ff8000;color:white;padding:10px 19px;font-size:15px;font-weight:bold;cursor:pointer}.score{text-align:center;color:#0058c9;font-weight:bold;font-size:19px;margin-top:11px}@media(max-width:620px){.sheet{padding:14px;margin:4px}.opts{grid-template-columns:1fr}.q{font-size:16px}.tfrow{flex-wrap:wrap}.tfopts{margin-left:auto}}</style></head><body><main class="sheet"><h1>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h1><section class="content" id="content"></section><div class="actions"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div class="score" id="score">Score: 0 / 4</div></main><script>const TYPE="mcq";const ANS=[2, 2, 0, 1];const DATA=[["स्त्री या पुरुष जाति का बोध कराने वाले संज्ञा शब्दों को कहते हैं–", ["कारक", "वचन", "लिंग"], 2], ["पुरुष जाति का बोध कराने वाले संज्ञा शब्द होते हैं–", ["नपुंसकलिंग", "स्त्रीलिंग", "पुल्लिंग"], 2], ["मंत्री शब्द का प्रयोग होता है–", ["दोनों लिंगों में", "पुल्लिंग में", "स्त्रीलिंग में"], 0], ["पुल्लिंग पशु के नाम को स्त्रीलिंग बनाने के लिए नाम से पहले लगाया जाता है–", ["नर", "मादा", "स्त्री"], 1]];const KEY='gyandhara-4-ch7-'+TYPE;let responses=JSON.parse(localStorage.getItem(KEY)||'{}');const content=document.getElementById('content');function save(){localStorage.setItem(KEY,JSON.stringify(responses))}function clearFeedback(){document.querySelectorAll('.correct,.incorrect').forEach(x=>x.classList.remove('correct','incorrect'))}function updateScore(){let n=0;ANS.forEach((a,i)=>{if(responses[i]===a)n++});document.getElementById('score').textContent='Score: '+n+' / '+ANS.length}document.getElementById('reset').onclick=()=>{responses={};save();render();document.getElementById('score').textContent='Score: 0 / '+ANS.length};document.getElementById('show').onclick=()=>{ANS.forEach((a,i)=>responses[i]=a);save();render();check()};document.getElementById('submit').onclick=check;function render(){content.innerHTML='';DATA.forEach((q,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<strong>'+('कखगघ'[i])+') '+q[0]+'</strong>';let o=document.createElement('div');o.className='opts';q[1].forEach((v,j)=>{let b=document.createElement('button');b.className='opt'+(responses[i]===j?' selected':'');b.innerHTML='<span>('+['अ','ब','स'][j]+') '+v+'</span><span class="square"></span>';b.onclick=()=>{responses[i]=j;save();render()};o.append(b)});d.append(o);content.append(d)})}function check(){clearFeedback();document.querySelectorAll('.q').forEach((q,i)=>{let j=responses[i];if(j!==undefined)q.querySelectorAll('.opt')[j].classList.add(j===ANS[i]?'correct':'incorrect')});updateScore()}render();</script></body></html>
