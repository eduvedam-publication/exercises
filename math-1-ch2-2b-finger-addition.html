<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Count on your fingers and add the following:</title><style>*{box-sizing:border-box}body{margin:0;background:#b9fbff;font-family:Georgia,serif;color:#172735;padding:16px}.sheet{width:min(1120px,100%);margin:auto;background:white;border:3px solid #00a9f4;border-radius:20px;padding:24px}h1{font:700 clamp(22px,3vw,29px) Arial;color:#009ff0;margin:0 0 20px;line-height:1.4}.viewport{overflow-x:auto;padding:2px}.board{position:relative;margin:0 auto 15px;max-width:100%}.board img{display:block;width:100%;height:auto}.answer{position:absolute;box-sizing:border-box;background:white;border:1.5px solid #ff685d;border-radius:0;padding:0 2px;text-align:center;color:#17333b;font-family:Georgia;line-height:1}.answer.correct{border-color:#20a953;background:#e8fff0}.answer.wrong{border-color:#e62c38;background:#fff0f0}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:12px 19px;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #006bff;outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:620px){.sheet{padding:16px 12px}body{padding:8px}}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.question{background:#eafaff;border:1px solid #00b9ed;border-radius:11px;padding:18px;font-size:24px;line-height:1.6}.question label{display:block;margin-bottom:10px}.question input{width:100%;min-height:48px;border:2px solid #ff685d;border-radius:5px;padding:8px 12px;font:23px Georgia;color:#17333b;background:white}.question input.correct{background:#e8fff0;border-color:#20a953}.question input.wrong{background:#fff0f0;border-color:#e62c38}.example{background:#f0fbea;border:1px solid #a7d998;border-radius:10px;padding:16px 18px;font-size:24px;margin:0 0 18px}.short label{display:inline;margin:0 8px 0 0}.short input{width:90px;max-width:100%;text-align:center}.example-tag{font:14px Arial;color:#426b38;display:block;margin-bottom:6px}@media(max-width:650px){.questions{grid-template-columns:1fr}.question{font-size:22px;padding:15px}.example{font-size:21px}}</style></head><body><main class="sheet"><h1>Count on your fingers and add the following:</h1><section class="questions"><div class="question short"><label for="a0">a. &nbsp; 1 + 0 =</label><input id="a0" aria-label="Answer a" autocomplete="off" spellcheck="false" inputmode="numeric"></div><div class="question short"><label for="a1">b. &nbsp; 7 + 1 =</label><input id="a1" aria-label="Answer b" autocomplete="off" spellcheck="false" inputmode="numeric"></div><div class="question short"><label for="a2">c. &nbsp; 2 + 1 =</label><input id="a2" aria-label="Answer c" autocomplete="off" spellcheck="false" inputmode="numeric"></div><div class="question short"><label for="a3">d. &nbsp; 3 + 3 =</label><input id="a3" aria-label="Answer d" autocomplete="off" spellcheck="false" inputmode="numeric"></div><div class="question short"><label for="a4">e. &nbsp; 0 + 5 =</label><input id="a4" aria-label="Answer e" autocomplete="off" spellcheck="false" inputmode="numeric"></div><div class="question short"><label for="a5">f. &nbsp; 6 + 0 =</label><input id="a5" aria-label="Answer f" autocomplete="off" spellcheck="false" inputmode="numeric"></div></section><div class="actions"><button type="button" id="submit">Submit</button><button type="button" id="show">Show Answer</button><button type="button" id="reset">Reset</button></div></main><script>const questions=[{"answer": "1"}, {"answer": "8"}, {"answer": "3"}, {"answer": "6"}, {"answer": "5"}, {"answer": "6"}],key='exercise:math-1-ch2-2b-finger-addition.html';const fields=questions.map((_,i)=>document.getElementById('a'+i));function norm(v){return String(v).replace(/\s+/g,'').replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c))}function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}catch(e){}}function clear(){fields.forEach(x=>x.classList.remove('correct','wrong'))}fields.forEach(x=>x.addEventListener('input',()=>{clear();save()}));try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))fields.forEach((x,i)=>{if(typeof a[i]==='string')x.value=a[i]})}catch(e){}document.getElementById('submit').addEventListener('click',()=>{fields.forEach((x,i)=>{const ok=norm(x.value)===questions[i].answer;x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok)});save();const detail={exerciseType:'FILL_BLANK',exerciseId:'math-1-ch2-2b-finger-addition.html',response:Object.fromEntries(fields.map((x,i)=>['question'+(i+1),x.value]))};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')});document.getElementById('show').addEventListener('click',()=>{fields.forEach((x,i)=>x.value=questions[i].answer);clear();save()});document.getElementById('reset').addEventListener('click',()=>{fields.forEach(x=>x.value='');clear();save()});</script></body></html>
