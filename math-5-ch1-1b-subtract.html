<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2. Subtract</title><style>
*{box-sizing:border-box}body{margin:0;background:#b9fbff;font-family:Georgia,'Times New Roman',serif;color:#172735;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px}.sheet{width:min(1050px,100%);background:white;border:3px solid #00a9f4;border-radius:20px;padding:22px 24px}h1{font:700 clamp(23px,3vw,32px) Arial,sans-serif;color:#009ff0;margin:0 0 18px}.question{background:#e0f9ff;border:1.5px solid #00a9ff;border-radius:11px;margin:9px 0;padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:clamp(16px,1.7vw,20px)}.qnum{min-width:26px}.question label{flex:0 1 auto}.question input{width:190px;max-width:100%;padding:9px;border:2px solid #ff685d;border-radius:5px;font:inherit;color:#173c4d;background:white}.question input.correct{border-color:#20a953;background:#e8fff0}.question input.wrong{border-color:#e62c38;background:#fff0f0}.feedback{font:700 14px Arial,sans-serif}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:12px 19px;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #006bff;outline-offset:2px}#score{text-align:center;color:#003bea;font:700 21px Arial,sans-serif;margin:13px 0 2px}@media(max-width:620px){.sheet{padding:16px 12px}.question{align-items:flex-start}.question label{width:calc(100% - 40px)}.question input{margin-left:35px;width:min(260px,calc(100% - 35px))}}
</style></head><body><main class="sheet"><h1>2. Subtract</h1><section><div class="question"><span class="qnum">a.</span><label for="a0">52,89,843 from 94,95,368</label><input id="a0" inputmode="numeric" autocomplete="off" aria-label="Answer a." placeholder="Answer"><span class="feedback" id="f0"></span></div>
<div class="question"><span class="qnum">b.</span><label for="a1">12,47,98,326 from 19,68,56,547</label><input id="a1" inputmode="numeric" autocomplete="off" aria-label="Answer b." placeholder="Answer"><span class="feedback" id="f1"></span></div>
<div class="question"><span class="qnum">c.</span><label for="a2">15,45,24,257 from 27,09,39,511</label><input id="a2" inputmode="numeric" autocomplete="off" aria-label="Answer c." placeholder="Answer"><span class="feedback" id="f2"></span></div>
<div class="question"><span class="qnum">d.</span><label for="a3">2,098,431,097 from 9,023,267,109</label><input id="a3" inputmode="numeric" autocomplete="off" aria-label="Answer d." placeholder="Answer"><span class="feedback" id="f3"></span></div></section><div class="actions"><button type="button" id="submit">Submit</button><button type="button" id="show">Show Answer</button><button type="button" id="reset">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 4</p></main><script>
const questions=[{"answer": "42,05,525", "question": "52,89,843 from 94,95,368"}, {"answer": "07,20,58,221", "question": "12,47,98,326 from 19,68,56,547"}, {"answer": "11,64,15,254", "question": "15,45,24,257 from 27,09,39,511"}, {"answer": "6,924,836,012", "question": "2,098,431,097 from 9,023,267,109"}];const key='exercise:math-5-ch1-1b-subtract.html';const inputs=questions.map((_,i)=>document.getElementById('a'+i));const score=document.getElementById('score');function normalize(s){return String(s).replace(/[,\s०-९]/g,c=>{const digits='०१२३४५६७८९';return digits.includes(c)?String(digits.indexOf(c)):''})}function save(){try{localStorage.setItem(key,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}function clearMarks(){inputs.forEach((x,i)=>{x.classList.remove('correct','wrong');document.getElementById('f'+i).textContent='';document.getElementById('f'+i).className='feedback'});score.textContent='Marks: 0 / 4'}inputs.forEach(x=>x.addEventListener('input',()=>{save();clearMarks()}));try{const old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old))old.forEach((v,i)=>{if(inputs[i]&&typeof v==='string')inputs[i].value=v})}catch(e){}
document.getElementById('submit').addEventListener('click',()=>{let marks=0;inputs.forEach((x,i)=>{const good=normalize(x.value)===normalize(questions[i].answer);if(good)marks++;x.classList.toggle('correct',good);x.classList.toggle('wrong',!good);const f=document.getElementById('f'+i);f.textContent=good?'✓ Correct':'✗ Wrong';f.className='feedback '+(good?'ok':'no')});score.textContent=`Marks: ${marks} / ${questions.length}`;save();const detail={exerciseType:'FILL_BLANK',exerciseId:'math-5-ch1-1b-subtract.html',response:Object.fromEntries(inputs.map((x,i)=>['question'+(i+1),x.value])),marks,total:questions.length};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')});document.getElementById('show').addEventListener('click',()=>{inputs.forEach((x,i)=>x.value=questions[i].answer);save();clearMarks()});document.getElementById('reset').addEventListener('click',()=>{inputs.forEach(x=>x.value='');save();clearMarks()});
</script></body></html>
