<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 - Chapter 2 - 2a Sum</title><style>*{box-sizing:border-box}body{margin:0;background:#d8f8ff;font-family:Arial,sans-serif;color:#18243c}.exercise{width:min(94vw,940px);margin:20px auto;background:white;border:3px solid #00a7d8;border-radius:23px;padding:22px 26px}h2{font:700 23px Georgia,serif;color:#00a7dc;margin:0 0 18px}.question{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:8px 0;background:#f0fbff;border:1.5px solid #39c4ec;border-radius:10px;font:18px Georgia,serif}.num{width:26px;flex:none}.expression{flex:0 1 auto}.eq{font-weight:bold}.answer{width:165px;max-width:45%;min-width:90px;height:36px;border:2px solid #ff515e;padding:5px 8px;font:17px Arial,sans-serif}.answer.ok{background:#dff9e4;border-color:#21a34b}.answer.bad{background:#ffe4e4;border-color:#e12626;animation:blink .35s 3}@keyframes blink{50%{background:#ffaaaa}}.actions{display:flex;justify-content:center;gap:12px;margin-top:22px}button{border:0;border-radius:20px;background:#ff8500;color:white;padding:10px 22px;font-weight:700;cursor:pointer}#score{text-align:center;font-weight:700;color:#0051b4;font-size:20px;margin-top:12px}@media(max-width:600px){.exercise{padding:15px 10px;margin:8px auto}h2{font-size:20px}.question{gap:5px;padding:9px 6px;font-size:15px}.num{width:18px}.answer{min-width:72px;width:100px;font-size:15px}}</style></head><body><main class="exercise"><h2>Find the sum of the following:</h2><div class="question"><span class="num">1.</span><span class="expression">12 thousands + 15 hundreds + 12 tens</span><span class="eq">=</span><input class="answer" inputmode="numeric" data-i="0" aria-label="Answer 1" autocomplete="off"></div><div class="question"><span class="num">2.</span><span class="expression">56349 + 34763</span><span class="eq">=</span><input class="answer" inputmode="numeric" data-i="1" aria-label="Answer 2" autocomplete="off"></div><div class="question"><span class="num">3.</span><span class="expression">210503 + 95876 + 73053 + 5678</span><span class="eq">=</span><input class="answer" inputmode="numeric" data-i="2" aria-label="Answer 3" autocomplete="off"></div><div class="question"><span class="num">4.</span><span class="expression">1896 + 64524 + 709876 + 876572</span><span class="eq">=</span><input class="answer" inputmode="numeric" data-i="3" aria-label="Answer 4" autocomplete="off"></div><div class="question"><span class="num">5.</span><span class="expression">49786 + 14000 + 234567 + 137654</span><span class="eq">=</span><input class="answer" inputmode="numeric" data-i="4" aria-label="Answer 5" autocomplete="off"></div><div class="actions"><button id="check">Check Answers</button><button id="reset">Reset</button></div><div id="score">Score: 0 / 5</div></main><script>const KEY='math-4-ch2-2a-sum-v1',answers=['13512','91112','385110','1652868','436007'];const inputs=[...document.querySelectorAll('.answer')];function save(){try{localStorage.setItem(KEY,JSON.stringify(Object.fromEntries(inputs.map(e=>[e.dataset.i,e.value]))))}catch(e){}}try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');inputs.forEach(e=>e.value=old[e.dataset.i]||'')}catch(e){}inputs.forEach(e=>e.addEventListener('input',()=>{e.classList.remove('ok','bad');save()}));document.getElementById('check').onclick=()=>{let score=0;inputs.forEach(e=>{const ok=e.value.replace(/[ ,]/g,'')===answers[Number(e.dataset.i)];e.classList.toggle('ok',ok);e.classList.toggle('bad',!ok);if(ok)score++});document.getElementById('score').textContent=`Score: ${score} / 5`;save();if(window.parent!==window)window.parent.postMessage({exerciseType:'FILL_BLANK',response:Object.fromEntries(inputs.map(e=>[e.dataset.i,e.value]))},'*')};document.getElementById('reset').onclick=()=>{inputs.forEach(e=>{e.value='';e.classList.remove('ok','bad')});document.getElementById('score').textContent='Score: 0 / 5';localStorage.removeItem(KEY)};</script></body></html>
