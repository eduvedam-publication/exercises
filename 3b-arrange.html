<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arrange in column and find the difference</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#222}
.exercise{max-width:1050px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 27px;color:#00a5dc;font-size:25px}
.questions{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:28px;
 padding:0 18px;
}
.q{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:8px;
 font-family:Georgia,"Times New Roman",serif;
 font-size:21px;
 white-space:nowrap;
}
.answer{
 width:48px;
 height:38px;
 border:2px solid #ff3b30;
 background:#fff;
 font-size:18px;
 padding:3px 5px;
 outline:none;
}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:32px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:760px){.questions{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.exercise{margin:0;border-radius:0;padding:15px}.questions{grid-template-columns:1fr}.q{justify-content:flex-start}h1{font-size:21px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Arrange the following in column and find the difference.</h1>

<div class="questions">
 <div class="q"><span>a.</span><span>78 − 25</span><input id="a0" class="answer" inputmode="numeric"></div>
 <div class="q"><span>b.</span><span>54 − 29</span><input id="a1" class="answer" inputmode="numeric"></div>
 <div class="q"><span>c.</span><span>85 − 72</span><input id="a2" class="answer" inputmode="numeric"></div>
 <div class="q"><span>d.</span><span>40 − 28</span><input id="a3" class="answer" inputmode="numeric"></div>
</div>

<div class="actions">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetExercise()">Reset</button>
</div>
<div id="result">Score: 0 / 4</div>
</main>

<script>
const answers=["53","25","13","12"];

function checkAnswers(){
 let score=0;
 answers.forEach((v,i)=>{
  const e=document.getElementById("a"+i);
  const ok=e.value.trim()===v;
  e.className="answer "+(ok?"ok":"bad");
  if(ok)score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 4`;
}

function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{
  e.value="";
  e.className="answer";
 });
 document.getElementById("result").textContent="Score: 0 / 4";
}
</script>
</body>
</html>
