<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-6-ch3-fill</title><style>*{box-sizing:border-box}body{margin:0;background:#c9faff;font-family:"Noto Sans Devanagari",Mangal,Arial,sans-serif;color:#202d39}.wrap{max-width:1020px;margin:22px auto;background:white;border:3px solid #00aeef;border-radius:20px;padding:24px}h2{color:#00a8ec;font-size:25px;margin:0 0 18px}.q{background:#e7faff;border:1.5px solid #00aeef;border-radius:11px;margin:9px 0;padding:13px;font-size:18px}.opts{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:10px}.opt{background:white;border:1px solid #94dfff;border-radius:9px;padding:8px 12px;cursor:pointer}.opt:has(input:checked){background:#b9ecff;border-color:#008ed1}.opt input{accent-color:#00a8ed}.bank{background:#d8f7ff;padding:12px;border-radius:12px;display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}.chip{border:1px solid #00aeef;border-radius:8px;background:white;padding:8px 12px;cursor:grab;font-size:17px}.chip.used{opacity:.35}.slot{display:inline-flex;min-width:145px;min-height:37px;border:2px dashed #ff7861;border-radius:7px;align-items:center;justify-content:center;padding:4px 9px;cursor:pointer;background:white;color:#0879a5}.slot.active{background:#fff4bd}.bottom{text-align:center;margin-top:23px}button.action{background:#ff7900;border:0;color:white;border-radius:30px;padding:11px 17px;margin:3px;cursor:pointer;font-weight:bold}.marks{color:#074ad4;font-weight:bold;font-size:21px;margin-top:10px}.feedback{font-size:14px;margin-top:4px}.good{border-color:#22a85c!important}.bad{border-color:#e44!important}@media(max-width:650px){.wrap{margin:6px;padding:12px}.q{font-size:16px}h2{font-size:21px}}</style><style>.q.correct,.q.good{border:2px solid #19a65a!important;background:#eafff0!important}.q.wrong,.q.bad{border:2px solid #e53935!important;background:#fff0f0!important}.q .opt.correct,.q .slot.good{border-color:#19a65a!important;background:#e7ffed!important}.q .opt.wrong,.q .slot.bad{border-color:#e53935!important;background:#ffe2e2!important}.q textarea{width:100%;min-height:48px;resize:vertical;border:1.5px solid #ff7861;border-radius:7px;font:inherit;padding:9px;margin-top:7px}.q .slot{vertical-align:middle;margin:2px 3px}.q{line-height:1.9}.opt{transition:background .15s}</style></head><body><main class="wrap"><h2>रिक्त स्थान की पूर्ति कीजिए–</h2><div class="bank" id="bank"></div><div id="questions"></div><div class="bottom"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="showAnswer()">Show Answer</button><button class="action" onclick="resetAll()">Reset</button><div class="marks" id="marks">Marks: 0 / 4</div></div></div><script>const KEY='kopal-6-ch3-fill';const JOINER="";const DATA=[["सवेरे श्यामू ___ नींद खुली।", ["की"]], ["जवाहिर भइया ___ मैं एक कागज़ ___ काकी लिखवा लूँगा।", ["पर", "से"]], ["श्यामू भैया ___ रस्सी और पतंग मँगाने ___ पैसे निकाले थे।", ["ने", "के लिए"]], ["यदि पतंग उड़ती, काकी इसी डोर ___ पकड़कर नीचे उतरतीं।", ["को"]]];const BANK=["की", "पर", "से", "ने", "के लिए", "को", "तक", "इनमें से कोई नहीं"];let chosen=JSON.parse(localStorage.getItem(KEY)||'{}'),selected=null;function render(){document.getElementById('bank').innerHTML=BANK.map((v,i)=>`<button class="chip" draggable="true" ondragstart="event.dataTransfer.setData('text/plain',${i})" onclick="selected=${i};document.querySelectorAll('.chip').forEach(e=>e.classList.remove('active'));this.classList.add('active')">${v}</button>`).join('');document.getElementById('questions').innerHTML=DATA.map((q,i)=>`<div class="q">(${['क','ख','ग','घ','ङ'][i]}) ${q[0]} ${q[1].map((ans,j)=>`<span class="slot" ondragover="event.preventDefault()" ondrop="event.preventDefault();setSlot(${i},${j},Number(event.dataTransfer.getData('text/plain')))" onclick="setSlot(${i},${j},selected)">${chosen[i+'-'+j]===undefined?'________':BANK[chosen[i+'-'+j]]}</span>`).join(' '+(JOINER||' ')+' ')}</div>`).join('')}function setSlot(i,j,k){if(k===null||!BANK[k])return;chosen[i+'-'+j]=k;selected=null;localStorage.setItem(KEY,JSON.stringify(chosen));render()}function submit(){let n=0;DATA.forEach((q,i)=>{if(q[1].every((v,j)=>BANK[chosen[i+'-'+j]]===v))n++});document.getElementById('marks').textContent=`Marks: ${n} / ${DATA.length}`;window.parent.postMessage({exerciseType:'DRAG_DROP',response:Object.fromEntries(DATA.map((q,i)=>['question'+(i+1),q[1].map((a,j)=>BANK[chosen[i+'-'+j]]||'')]))},'*')}function showAnswer(){DATA.forEach((q,i)=>q[1].forEach((a,j)=>chosen[i+'-'+j]=BANK.indexOf(a)));localStorage.setItem(KEY,JSON.stringify(chosen));render();submit()}function resetAll(){chosen={};localStorage.removeItem(KEY);render();document.getElementById('marks').textContent='Marks: 0 / '+DATA.length}render();
const originalRender=render;
render=function(){originalRender();document.querySelectorAll('#questions .q').forEach((box,i)=>{const slots=[...box.querySelectorAll('.slot')];if(!slots.length)return;const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())if(walker.currentNode.textContent.includes('___'))nodes.push(walker.currentNode);let index=0;for(const node of nodes){const parts=node.textContent.split(/_{3,}/);const frag=document.createDocumentFragment();parts.forEach((part,k)=>{frag.appendChild(document.createTextNode(part));if(k<parts.length-1&&slots[index])frag.appendChild(slots[index++])});node.replaceWith(frag)};slots.slice(index).forEach(x=>x.remove())})};

const originalSubmit=submit;
submit=function(){originalSubmit();document.querySelectorAll('#questions .q').forEach((box,i)=>{box.classList.remove('correct','wrong');let ok=false;
ok=DATA[i][1].every((a,j)=>BANK[chosen[i+"-"+j]]===a);box.classList.add(ok?'correct':'wrong');if(!ok){box.querySelectorAll('.slot').forEach((el,j)=>{el.classList.add('bad')})}})};
const originalReset=resetAll;resetAll=function(){originalReset();document.querySelectorAll('.q').forEach(e=>e.classList.remove('correct','wrong'))};
render();
</script></body></html>
