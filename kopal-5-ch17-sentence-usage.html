<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOPAL Class 5 Chapter 17 sentence-usage — 2026–27</title><style>*{box-sizing:border-box}body{margin:0;background:#d0faff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#202020}.wrap{max-width:990px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a9e9;margin:0 0 16px;font-size:25px}.q{background:#ebfaff;border:1px solid #00b9ed;border-radius:11px;padding:13px;margin:9px 0}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:9px}.opt{background:white;border:1px solid #9bdfff;border-radius:7px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}.opt.selected{border:2px solid #008ad1;background:#d7f4ff}.correct{background:#d6ffe5!important;border-color:#0baf54!important}.wrong{background:#ffe0e0!important;border-color:#e33!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.5}}.buttons{text-align:center;margin-top:24px}button{background:#ff8000;color:white;border:0;border-radius:22px;padding:11px 19px;margin:3px;cursor:pointer;font-weight:bold}.score{text-align:center;color:#0051b8;font-size:19px;font-weight:bold;margin:12px}.bank{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;background:#dff7ff;padding:13px;border-radius:10px;margin:12px 0}.chip{color:#202020;font-family:inherit;font-weight:normal;line-height:1.5;appearance:none;border:1px solid #00aeec;background:white;border-radius:7px;padding:9px 14px;cursor:grab;font-size:18px}.chip.active{outline:3px solid orange}.slot{display:inline-flex;min-width:125px;min-height:37px;border:2px dashed #ff724d;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;padding:4px 10px;cursor:pointer;background:white}.slot.sentence-usageed{border-style:solid}.statement{display:flex;gap:10px;justify-content:space-between;align-items:center}.choices{display:flex;gap:6px;flex-shrink:0}.choice{color:#202020;font-family:Arial,sans-serif;font-size:21px;font-weight:bold;min-width:40px;min-height:37px;line-height:1;appearance:none;border:1px solid #00aeec;background:white;border-radius:7px;padding:7px 13px;cursor:pointer}.choice.selected{background:#ccefff;border-width:2px}@media(max-width:650px){.wrap{margin:7px;padding:14px}.options{grid-template-columns:1fr}.q{font-size:16px}.statement{align-items:flex-start;flex-direction:column}}.chip{max-width:100%;text-align:left;white-space:normal;overflow-wrap:anywhere}.slot{max-width:100%;overflow-wrap:anywhere}.q{line-height:1.9}</style></head><body><main class="wrap"><h2>वाक्य बनाइए–</h2><div class="bank" id="bank"></div><div id="questions"></div><div class="buttons"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Marks: 0 / 6</div></main><script>const data=[["प्रतीक्षा — __________", "मुन्नू भैया की प्रतीक्षा कर रहा था।"], ["जीवन — __________", "जल ही जीवन है।"], ["राष्ट्रीय — __________", "पानी हमारा राष्ट्रीय धन है।"], ["बिजली — __________", "हमें बिजली बचाना चाहिए।"], ["किसान — __________", "किसान अन्न उपजाते हैं।"], ["परिवार — __________", "हमारे परिवार में सब मिलजुलकर रहते हैं।"]];const key='kopal-5-ch17-sentence-usage-v1';let answers=JSON.parse(localStorage.getItem(key)||'[null, null, null, null, null, null]');let selected=null;function persist(){localStorage.setItem(key,JSON.stringify(answers))}function render(){let words=data.map(x=>x[1]);document.getElementById('bank').innerHTML=words.map((w,i)=>({w,i})).sort((a,b)=>[2, 3, 4, 5, 0, 1].indexOf(a.i)-[2, 3, 4, 5, 0, 1].indexOf(b.i)).map(({w,i})=>`<button class="chip ${selected===i?'active':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')" onclick="selected=${i};render()">${w}</button>`).join('');document.getElementById('questions').innerHTML=data.map((q,i)=>`<div class="q">(${["क", "ख", "ग", "घ", "ङ", "च"][i]}) ${q[0].replace('__________',`<span class="slot ${answers[i]!==null?'sentence-usageed':''}" data-i="${i}" role="button" tabindex="0" aria-label="उत्तर ${i+1}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" ondragover="event.preventDefault()" ondrop="event.preventDefault();put(${i},+event.dataTransfer.getData('text/plain'))" onclick="if(selected!==null)put(${i},selected);else clearSlot(${i})">${answers[i]===null?'&nbsp;':words[answers[i]]}</span>`)}</div>`).join('')}function put(i,j){if(!Number.isInteger(j)||j<0||j>=data.length)return;let old=answers.indexOf(j);if(old>=0)answers[old]=null;answers[i]=j;selected=null;persist();render()}function clearSlot(i){answers[i]=null;persist();render()}function check(){let n=0;document.querySelectorAll('.slot').forEach(el=>{let i=+el.dataset.i;if(answers[i]!==null){let ok=data[answers[i]][1]===data[i][1];el.classList.remove('correct','wrong');el.classList.add(ok?'correct':'wrong');if(ok)n++}});document.getElementById('score').textContent=`Marks: ${n} / 6`}function showAnswers(){answers=[0, 1, 2, 3, 4, 5];persist();render();check()}function resetAll(){answers=[null, null, null, null, null, null];selected=null;persist();render();document.getElementById('score').textContent='Marks: 0 / 6'}render();</script></body></html>
