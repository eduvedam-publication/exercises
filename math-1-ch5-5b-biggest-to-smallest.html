<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write from biggest to smallest number in the space provided. One has been done for you.</title><style>*{box-sizing:border-box}body{margin:0;background:#b9fbff;font-family:Georgia,serif;color:#172735;padding:16px}.sheet{width:min(1120px,100%);margin:auto;background:white;border:3px solid #00a9f4;border-radius:20px;padding:24px}h1{font:700 clamp(22px,3vw,29px) Arial;color:#009ff0;margin:0 0 20px;line-height:1.4}.viewport{overflow-x:auto;padding:2px}.board{position:relative;margin:0 auto 15px;max-width:100%}.board img{display:block;width:100%;height:auto}.answer{position:absolute;box-sizing:border-box;background:white;border:1.5px solid #ff685d;border-radius:0;padding:0 2px;text-align:center;color:#17333b;font-family:Georgia;line-height:1}.answer.correct{border-color:#20a953;background:#e8fff0}.answer.wrong{border-color:#e62c38;background:#fff0f0}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:12px 19px;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #006bff;outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:620px){.sheet{padding:16px 12px}body{padding:8px}}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{border:1.5px solid #00a9f4;border-radius:10px;background:#eafaff;overflow:hidden;min-width:0}.card-label{display:block;padding:8px 12px 0;color:#417181;font:16px Arial}.number-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;gap:8px;padding:12px}.given{font-size:26px;padding:6px 0;border-bottom:1px solid #a9daec}.slot input{display:block;width:100%;min-width:0;height:48px;border:2px solid #ff685d;background:white;border-radius:5px;padding:4px;text-align:center;font:24px Georgia;color:#17333b}.slot input.correct{border-color:#20a953;background:#e8fff0}.slot input.wrong{border-color:#e62c38;background:#fff0f0}.example-value{display:flex;justify-content:center;align-items:center;height:48px;border:2px solid #a7ceae;border-radius:5px;background:#f3fff1;font-size:24px;font-weight:bold}.example-tag{float:right;font:13px Arial;color:#477447}.card.example{background:#f0faed}@media(max-width:950px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.cards{grid-template-columns:1fr}.given{font-size:27px}.slot input{height:52px;font-size:25px}}</style></head><body><main class="sheet"><h1>Write from biggest to smallest number in the space provided. One has been done for you.</h1><section class="cards"><div class="card example"><span class="card-label">a.<span class="example-tag">Example</span></span><div class="number-grid"><span class="given">13</span><span class="given">15</span><span class="given">10</span><span class="example-value">15</span><span class="example-value">13</span><span class="example-value">10</span></div></div><div class="card"><span class="card-label">b.</span><div class="number-grid"><span class="given">12</span><span class="given">22</span><span class="given">28</span><span class="slot"><input id="a0" inputmode="numeric" autocomplete="off" aria-label="Row b, position 1"></span><span class="slot"><input id="a1" inputmode="numeric" autocomplete="off" aria-label="Row b, position 2"></span><span class="slot"><input id="a2" inputmode="numeric" autocomplete="off" aria-label="Row b, position 3"></span></div></div><div class="card"><span class="card-label">c.</span><div class="number-grid"><span class="given">31</span><span class="given">23</span><span class="given">40</span><span class="slot"><input id="a3" inputmode="numeric" autocomplete="off" aria-label="Row c, position 1"></span><span class="slot"><input id="a4" inputmode="numeric" autocomplete="off" aria-label="Row c, position 2"></span><span class="slot"><input id="a5" inputmode="numeric" autocomplete="off" aria-label="Row c, position 3"></span></div></div><div class="card"><span class="card-label">d.</span><div class="number-grid"><span class="given">49</span><span class="given">19</span><span class="given">30</span><span class="slot"><input id="a6" inputmode="numeric" autocomplete="off" aria-label="Row d, position 1"></span><span class="slot"><input id="a7" inputmode="numeric" autocomplete="off" aria-label="Row d, position 2"></span><span class="slot"><input id="a8" inputmode="numeric" autocomplete="off" aria-label="Row d, position 3"></span></div></div><div class="card"><span class="card-label">e.</span><div class="number-grid"><span class="given">26</span><span class="given">16</span><span class="given">36</span><span class="slot"><input id="a9" inputmode="numeric" autocomplete="off" aria-label="Row e, position 1"></span><span class="slot"><input id="a10" inputmode="numeric" autocomplete="off" aria-label="Row e, position 2"></span><span class="slot"><input id="a11" inputmode="numeric" autocomplete="off" aria-label="Row e, position 3"></span></div></div><div class="card"><span class="card-label">f.</span><div class="number-grid"><span class="given">41</span><span class="given">45</span><span class="given">43</span><span class="slot"><input id="a12" inputmode="numeric" autocomplete="off" aria-label="Row f, position 1"></span><span class="slot"><input id="a13" inputmode="numeric" autocomplete="off" aria-label="Row f, position 2"></span><span class="slot"><input id="a14" inputmode="numeric" autocomplete="off" aria-label="Row f, position 3"></span></div></div><div class="card"><span class="card-label">g.</span><div class="number-grid"><span class="given">20</span><span class="given">30</span><span class="given">50</span><span class="slot"><input id="a15" inputmode="numeric" autocomplete="off" aria-label="Row g, position 1"></span><span class="slot"><input id="a16" inputmode="numeric" autocomplete="off" aria-label="Row g, position 2"></span><span class="slot"><input id="a17" inputmode="numeric" autocomplete="off" aria-label="Row g, position 3"></span></div></div><div class="card"><span class="card-label">h.</span><div class="number-grid"><span class="given">15</span><span class="given">18</span><span class="given">14</span><span class="slot"><input id="a18" inputmode="numeric" autocomplete="off" aria-label="Row h, position 1"></span><span class="slot"><input id="a19" inputmode="numeric" autocomplete="off" aria-label="Row h, position 2"></span><span class="slot"><input id="a20" inputmode="numeric" autocomplete="off" aria-label="Row h, position 3"></span></div></div></section><div class="actions"><button type="button" id="submit">Submit</button><button type="button" id="show">Show Answer</button><button type="button" id="reset">Reset</button></div></main><script>const questions=[{"answer": "28"}, {"answer": "22"}, {"answer": "12"}, {"answer": "40"}, {"answer": "31"}, {"answer": "23"}, {"answer": "49"}, {"answer": "30"}, {"answer": "19"}, {"answer": "36"}, {"answer": "26"}, {"answer": "16"}, {"answer": "45"}, {"answer": "43"}, {"answer": "41"}, {"answer": "50"}, {"answer": "30"}, {"answer": "20"}, {"answer": "18"}, {"answer": "15"}, {"answer": "14"}],key='exercise:math-1-ch5-5b-biggest-to-smallest.html';const fields=questions.map((_,i)=>document.getElementById('a'+i));function norm(v){return String(v).trim().replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c))}function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}catch(e){}}function clear(){fields.forEach(x=>x.classList.remove('correct','wrong'))}fields.forEach(x=>x.addEventListener('input',()=>{clear();save()}));try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))fields.forEach((x,i)=>{if(typeof a[i]==='string')x.value=a[i]})}catch(e){}document.getElementById('submit').addEventListener('click',()=>{fields.forEach((x,i)=>{const ok=norm(x.value)===questions[i].answer;x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok)});save();const detail={exerciseType:'FILL_BLANK',exerciseId:'math-1-ch5-5b-biggest-to-smallest.html',response:Object.fromEntries(fields.map((x,i)=>['question'+(i+1),x.value]))};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')});document.getElementById('show').addEventListener('click',()=>{fields.forEach((x,i)=>x.value=questions[i].answer);clear();save()});document.getElementById('reset').addEventListener('click',()=>{fields.forEach(x=>x.value='');clear();save()});</script></body></html>
