<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose the correct option.</title><style>*{box-sizing:border-box}body{margin:0;background:#baf9fb;font-family:Georgia,"Times New Roman",serif;color:#162a36}.sheet{max-width:1020px;margin:20px auto;padding:24px;background:#fff;border:3px solid #00aaff;border-radius:20px}h1{font-size:clamp(22px,2.7vw,30px);color:#00a8ef;margin:0 0 18px}.q{background:#def8fc;border:1.5px solid #00aaff;border-radius:12px;padding:13px 15px;margin:10px 0;font-size:19px}.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid #37c5ff;border-radius:8px;padding:9px 13px;background:white;cursor:pointer;font-size:18px;min-height:42px}.opt:has(input:checked){background:#a8ebff;border-color:#00aaff}.opt input{accent-color:#00aaff}.answer{display:inline-block;border:2px dashed #ff7878;background:#fff;border-radius:7px;padding:8px;min-width:120px;font-size:18px;max-width:100%}.answer:focus{outline:2px solid #00aaff}.correct{border-color:#20a55c!important;background:#e2ffe8!important}.wrong{border-color:#e33434!important;background:#ffe5e5!important}.controls{text-align:center;margin:24px auto 5px}.controls button{border:0;border-radius:24px;background:#ff7400;color:white;font-weight:bold;padding:12px 17px;margin:3px;cursor:pointer}.controls button:hover{background:#e56500}#marks{font:700 22px Arial;color:#003ddd;margin-top:9px}.pair{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}.pair label{display:inline-flex;align-items:center;gap:7px}.pair input{width:145px}.hint{color:#586975;font-size:14px;margin-top:7px}@media(max-width:600px){.sheet{margin:5px;padding:14px}.q{font-size:17px}.opt{font-size:16px}.answer{min-width:95px;width:135px}}</style></head><body><main class="sheet"><h1>Choose the correct option.</h1><section class="q" id="q0"><div><b>a.</b> The HCF of two consecutive even numbers is _____.</div><div class="opts"><label class="opt"><input type="radio" name="q0" value="2"> (1) 2</label><label class="opt"><input type="radio" name="q0" value="1"> (2) 1</label><label class="opt"><input type="radio" name="q0" value="0"> (3) 0</label><label class="opt"><input type="radio" name="q0" value="8"> (4) 8</label></div></section><section class="q" id="q1"><div><b>b.</b> The LCM of 36 and 12 is _____.</div><div class="opts"><label class="opt"><input type="radio" name="q1" value="12"> (1) 12</label><label class="opt"><input type="radio" name="q1" value="3"> (2) 3</label><label class="opt"><input type="radio" name="q1" value="36"> (3) 36</label><label class="opt"><input type="radio" name="q1" value="108"> (4) 108</label></div></section><section class="q" id="q2"><div><b>c.</b> The HCF of two prime numbers is _____.</div><div class="opts"><label class="opt"><input type="radio" name="q2" value="0"> (1) 0</label><label class="opt"><input type="radio" name="q2" value="1"> (2) 1</label><label class="opt"><input type="radio" name="q2" value="Smallest of the two"> (3) Smallest of the two</label><label class="opt"><input type="radio" name="q2" value="Greatest of the two"> (4) Greatest of the two</label></div></section><section class="q" id="q3"><div><b>d.</b> The only common factor for all co-prime numbers _____.</div><div class="opts"><label class="opt"><input type="radio" name="q3" value="0"> (1) 0</label><label class="opt"><input type="radio" name="q3" value="1"> (2) 1</label><label class="opt"><input type="radio" name="q3" value="Product of the numbers"> (3) Product of the numbers</label><label class="opt"><input type="radio" name="q3" value="Numbers themselves"> (4) Numbers themselves</label></div></section><div class="controls"><button id="submit" type="button">Submit</button><button id="show" type="button">Show Answer</button><button id="reset" type="button">Reset</button><div id="marks">Marks: 0 / 4</div></div></main><script>const DATA=[["The HCF of two consecutive even numbers is _____.", ["2", "1", "0", "8"], "2"], ["The LCM of 36 and 12 is _____.", ["12", "3", "36", "108"], "36"], ["The HCF of two prime numbers is _____.", ["0", "1", "Smallest of the two", "Greatest of the two"], "1"], ["The only common factor for all co-prime numbers _____.", ["0", "1", "Product of the numbers", "Numbers themselves"], "1"]],MODE="mcq",KEY='exercise:'+location.pathname;let submitted=false;function $$(s){return [...document.querySelectorAll(s)]}function normalize(s){return String(s??'').trim().toLowerCase().replace(/[–—−]/g,'-').replace(/\s+/g,'').replace(/,/g,'')}function getValues(){return DATA.map((_,i)=>MODE==='mcq'?(document.querySelector('input[name="q'+i+'"]:checked')?.value??''):MODE==='pair'?[$$('input[data-i="'+i+'"]')[0]?.value??'',$$('input[data-i="'+i+'"]')[1]?.value??'']:(document.querySelector('input[data-i="'+i+'"]')?.value??''))}function save(){try{localStorage.setItem(KEY,JSON.stringify(getValues()))}catch(e){}}function clearMarks(){ $$('.q,.opt,.answer').forEach(el=>el.classList.remove('correct','wrong'));document.getElementById('marks').textContent='Marks: 0 / '+DATA.length;submitted=false}function restore(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(!Array.isArray(v))return;v.forEach((x,i)=>{if(MODE==='mcq'){const r=$$('input[name="q'+i+'"]');r.forEach(el=>el.checked=el.value===x)}else if(MODE==='pair'){$$('input[data-i="'+i+'"]').forEach((el,j)=>el.value=x?.[j]??'')}else{const el=document.querySelector('input[data-i="'+i+'"]');if(el)el.value=x??''}})}catch(e){}}function check(){let score=0;DATA.forEach((d,i)=>{const box=document.getElementById('q'+i);let ok=false;if(MODE==='mcq'){const sel=box.querySelector('input:checked');ok=!!sel&&sel.value===d[2];if(sel)sel.closest('.opt').classList.add(ok?'correct':'wrong')}else if(MODE==='pair'){const a=box.querySelectorAll('.answer');ok=normalize(a[0].value)===normalize(d[1])&&normalize(a[1].value)===normalize(d[2]);a.forEach((el,j)=>el.classList.add(normalize(el.value)===normalize(d[j+1])?'correct':'wrong'))}else{const el=box.querySelector('.answer');ok=normalize(el.value)===normalize(d[1]);el.classList.add(ok?'correct':'wrong')}if(ok)score++});document.getElementById('marks').textContent='Marks: '+score+' / '+DATA.length;submitted=true;save();try{window.parent?.postMessage({exerciseType:MODE==='mcq'?'OPTION':'FILL_BLANK',response:{answers:getValues(),score,total:DATA.length}},'*')}catch(e){}}function showAnswer(){DATA.forEach((d,i)=>{const box=document.getElementById('q'+i);if(MODE==='mcq')box.querySelectorAll('input').forEach(el=>el.checked=el.value===d[2]);else if(MODE==='pair')box.querySelectorAll('.answer').forEach((el,j)=>el.value=d[j+1]);else box.querySelector('.answer').value=d[1]});clearMarks();save()}function reset(){DATA.forEach((_,i)=>{const box=document.getElementById('q'+i);box.querySelectorAll('input').forEach(el=>{if(el.type==='radio')el.checked=false;else el.value=''})});clearMarks();save()}document.getElementById('submit').addEventListener('click',check);document.getElementById('show').addEventListener('click',showAnswer);document.getElementById('reset').addEventListener('click',reset);document.querySelector('.sheet').addEventListener('input',()=>{if(submitted)clearMarks();save()});document.querySelector('.sheet').addEventListener('change',()=>{if(submitted)clearMarks();save()});restore();</script></body></html>
