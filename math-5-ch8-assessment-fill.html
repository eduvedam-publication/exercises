<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fill in the Blanks.</title><style>*{box-sizing:border-box}body{margin:0;padding:22px 12px;background:#d1faff;color:#17333b;font-family:Georgia,serif}.wrap{max-width:1000px;margin:auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h1{font-size:26px;color:#00a7dd;margin:0 0 20px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:18px;margin:12px 0;font-size:20px;line-height:1.6}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}button{font:inherit;cursor:pointer}.opt{border:1px solid #93dcf5;background:white;border-radius:8px;padding:10px;text-align:left;color:inherit}.sel{background:#d8f3ff;border-color:#009be0}.correct{background:#dcfce5!important;border:2px solid #22aa55!important}.wrong{background:#ffe3e3!important;border:2px solid #e44848!important}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.actions button{border:0;border-radius:24px;background:#ff8200;color:white;font-family:Arial,sans-serif;font-weight:bold;padding:11px 19px;font-size:15px}.slot{display:inline-flex;vertical-align:middle;min-width:120px;min-height:45px;align-items:center;justify-content:center;border:2px dashed #00aee8;border-radius:7px;background:white;font:inherit;color:inherit}.bank{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;background:#eafaff;padding:16px;border-radius:12px}.chip{padding:9px 18px;background:white;border:2px solid #00aee8;border-radius:9px;font-size:22px;color:inherit}.active{outline:3px solid #ff8200}.feedback{display:block;min-height:25px;font-size:16px;margin-top:9px;color:#47717e}.hint{text-align:center;color:#47717e}button:focus-visible{outline:3px solid #ff8200;outline-offset:3px}@media(max-width:600px){body{padding:7px}.wrap{padding:14px}.opts{grid-template-columns:1fr}.q{font-size:18px}h1{font-size:24px}}</style></head><body><main class="wrap"><h1>Fill in the Blanks.</h1><section id="questions"></section><p class="hint">Drag each answer into a blank, or tap an answer and then a blank.</p><div class="bank" id="bank" role="group" aria-label="Answers"></div><div class="actions"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div></main><script>const mode="fill",data=[["₹36.50 + ₹18.75 = ₹", ".", "55.25"], ["A pen costs ₹24. If 5 such pens are purchased, the total cost will be ₹", ".", "120"], ["If an article is bought for ₹750 and sold for ₹820, the profit is ₹", ".", "70"], ["₹500 − ₹267.50 = ₹", ".", "232.50"]];let answers=Array(data.length).fill(null),selected=null;const root=document.getElementById("questions");const choices=['120','232.50','55.25','70'];function select(value){selected=value;document.querySelectorAll('.chip').forEach(el=>{el.classList.toggle('active',el.dataset.value===value);el.setAttribute('aria-pressed',String(el.dataset.value===value))})}function place(i,value){if(!choices.includes(value))return;answers[i]=value;selected=null;render()}function render(){root.innerHTML=data.map((q,i)=>`<article class="q">${'abcd'[i]}. ${q[0]}<button class="slot" id="slot${i}" aria-label="Answer ${i+1}">${answers[i]??''}</button>${q[1]}<span class="feedback" id="f${i}" aria-live="polite"></span></article>`).join('');data.forEach((q,i)=>{const el=document.getElementById('slot'+i);el.onclick=()=>{if(selected!==null)place(i,selected);else{answers[i]=null;render()}};el.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'};el.ondrop=e=>{e.preventDefault();place(i,e.dataTransfer.getData('text/plain'))}});document.getElementById('bank').innerHTML=choices.map(v=>`<button class="chip" draggable="true" data-value="${v}" aria-pressed="false">${v}</button>`).join('');document.querySelectorAll('.chip').forEach(el=>{el.onclick=()=>select(selected===el.dataset.value?null:el.dataset.value);el.ondragstart=e=>{select(el.dataset.value);e.dataTransfer.setData('text/plain',el.dataset.value);e.dataTransfer.effectAllowed='copy'}})}function check(){data.forEach((q,i)=>{const f=document.getElementById('f'+i);if(answers[i]===null){f.textContent='Please complete this answer.';return}const ok=answers[i]===q[2];const target=mode==='mcq'?document.getElementById('o'+i+'-'+answers[i]):document.getElementById('slot'+i);target.classList.remove('correct','wrong');target.classList.add(ok?'correct':'wrong');f.textContent=ok?'✓ Correct!':'Try again.'})}function showAnswers(){data.forEach((q,i)=>answers[i]=q[2]);render();check()}function resetAll(){answers=Array(data.length).fill(null);selected=null;render()}document.getElementById('submit').onclick=check;document.getElementById('show').onclick=showAnswers;document.getElementById('reset').onclick=resetAll;render();</script></body></html>
