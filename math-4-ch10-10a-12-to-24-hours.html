<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change the 12-hour clock time to 24-hour clock time.</title><style>
*{box-sizing:border-box}body{margin:0;background:#d0faff;color:#171717;font-family:Georgia,'Times New Roman',serif}.sheet{width:min(1050px,96vw);margin:20px auto;padding:24px 28px;background:#fff;border:3px solid #00aee9;border-radius:22px}h2{font-size:clamp(21px,2.6vw,27px);color:#00a9e5;margin:0 0 18px}.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{background:#eafaff;border:1px solid #00b5f4;border-radius:11px;padding:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px;min-height:78px}.letter{font-weight:bold}.answer{width:130px;max-width:100%;padding:7px 8px;font-size:17px;border:2px solid #ff654c;border-radius:5px;background:white;color:#111}.answer.correct{border-color:#14a44d;background:#e3ffe9}.answer.wrong{border-color:#e22;background:#ffe6e6;animation:flash .65s linear 3}@keyframes flash{50%{background:#ff9494}}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}button{border:0;border-radius:24px;padding:11px 19px;background:#ff8000;color:white;font-weight:bold;cursor:pointer;font-size:14px}button:hover{background:#e36f00}.score{font:700 20px Arial,sans-serif;text-align:center;color:#0050ba;margin-top:12px}.hint{font-size:14px;color:#555;text-align:center;margin-top:10px}@media(max-width:750px){.questions{grid-template-columns:repeat(2,minmax(0,1fr))}.sheet{padding:18px}}@media(max-width:480px){.questions{grid-template-columns:1fr}.item{min-height:64px}}
</style></head><body><main class="sheet"><h2>Change the 12-hour clock time to 24-hour clock time.</h2><div class="questions" id="questions"></div><div class="controls"><button id="check">Check Answers</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div class="score" id="score">Score: 0 / 6</div></main><script>
const data=[["6:30 a.m.", "0630 hours"], ["12:30 a.m.", "0030 hours"], ["2:30 p.m.", "1430 hours"], ["6:30 p.m.", "1830 hours"], ["12:30 p.m.", "1230 hours"], ["3:30 a.m.", "0330 hours"]];const key='exercise:'+location.pathname.split('/').pop();const q=document.getElementById('questions');let stored=[];try{stored=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){};data.forEach(([question,answer],i)=>{const box=document.createElement('label');box.className='item';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(97+i)+'.';const prompt=document.createElement('span');prompt.textContent=question;const input=document.createElement('input');input.className='answer';input.type='text';input.autocomplete='off';input.setAttribute('aria-label','Answer for '+question);input.value=stored[i]||'';input.addEventListener('input',()=>{input.classList.remove('correct','wrong');save()});box.append(letter,prompt,input);q.append(box)});function inputs(){return [...document.querySelectorAll('.answer')]}function save(){localStorage.setItem(key,JSON.stringify(inputs().map(x=>x.value)))}function normal(s){return s.toLowerCase().replace(/\s+/g,'').replace(/\./g,'').replace(/hours?/g,'').replace(/^0+(?=\d)/,'')}function check(){let count=0;inputs().forEach((el,i)=>{el.classList.remove('correct','wrong');void el.offsetWidth;if(normal(el.value)===normal(data[i][1])){count++;el.classList.add('correct')}else{el.classList.add('wrong')}});document.getElementById('score').textContent='Score: '+count+' / '+data.length;save()}document.getElementById('check').onclick=check;document.getElementById('show').onclick=()=>{inputs().forEach((el,i)=>{el.value=data[i][1];el.classList.remove('wrong');el.classList.add('correct')});document.getElementById('score').textContent='Score: '+data.length+' / '+data.length;save()};document.getElementById('reset').onclick=()=>{inputs().forEach(el=>{el.value='';el.classList.remove('wrong','correct')});document.getElementById('score').textContent='Score: 0 / '+data.length;save()};
</script></body></html>
