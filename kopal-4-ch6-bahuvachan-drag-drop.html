<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOPAL Hindi 4 Chapter 6 Plural Words</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e4f8ff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#263b44}.wrap{max-width:1000px;margin:22px auto;background:#fff;border:3px solid #00bde8;border-radius:18px;padding:24px}h2{margin:0 0 8px;color:#ff3988;font-size:25px}.meta{color:#527783;margin:0 0 18px}.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;background:#fff6cc;border-radius:12px;padding:14px;margin:14px 0}.word{font:inherit;font-size:17px;background:#fff;border:1px solid #dfc95e;border-radius:8px;padding:8px 14px;cursor:grab}.word.selected{background:#ffe5ef;outline:2px solid #ff3988}.word.used{opacity:.45}.q{background:#effbff;border:1px solid #8cdef4;border-radius:12px;padding:14px;margin:12px 0;font-size:19px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.slot{min-width:165px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;border:2px dashed #ff8bb7;border-radius:8px;background:#fff;padding:5px 12px;cursor:pointer}.slot.filled{border-style:solid}.slot.correct{background:#dcf8e5;border-color:#20a653}.slot.wrong{background:#ffe0e0;border-color:#e43d3d;animation:blink .6s 2}@keyframes blink{50%{opacity:.5}}.hint{text-align:center;color:#527783;font-size:14px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button{border:0;border-radius:24px;padding:11px 21px;background:#ff3988;color:white;font-weight:bold;cursor:pointer;font-size:15px}#score{text-align:center;color:#087fa7;font-weight:bold;font-size:19px;margin-top:15px}@media(max-width:650px){.wrap{margin:8px;padding:14px}.q{font-size:17px}}
</style></head><body><main class="wrap"><h2>यहाँ कुछ शब्द दिए गए हैं, उनके बहुवचन रूप लिखिए–</h2><p class="meta">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 6</p><div class="bank" id="bank"></div><p class="hint">शब्द को खींचकर खाली स्थान पर छोड़ें, या शब्द और फिर खाली स्थान पर क्लिक करें।</p><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 6</div></main>
<script>
const data=[["खुशी","खुशियाँ"],["पत्ती","पत्तियाँ"],["कपड़ा","कपड़े"],["कँगला","कँगलाएँ"],["कली","कलियाँ"],["रात","रातें"]];
const words=["खुशियाँ","कलियाँ","कँगलाएँ","पत्तियाँ","कपड़े","रातें"];const key='kopal-4-ch6-plurals';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let selected=null;
function save(){localStorage.setItem(key,JSON.stringify(answers))}
function choose(w){if(Object.values(answers).includes(w))return;selected=selected===w?null:w;render()}
function put(i,w){if(!words.includes(w))return;Object.keys(answers).forEach(k=>{if(answers[k]===w)delete answers[k]});answers[i]=w;selected=null;save();render()}
function place(i){if(selected!==null)put(i,selected);else if(answers[i]){delete answers[i];save();render()}}
function render(){document.getElementById('bank').innerHTML=words.map(w=>`<button class="word ${selected===w?'selected':''} ${Object.values(answers).includes(w)?'used':''}" draggable="${!Object.values(answers).includes(w)}" ondragstart="event.dataTransfer.setData('text/plain',${JSON.stringify(w)})" onclick="choose(${JSON.stringify(w)})">${w}</button>`).join('');document.getElementById('questions').innerHTML=data.map((q,i)=>`<div class="q">(${'कखगघङच'[i]}) <b>${q[0]}</b> — <span id="slot${i}" class="slot ${answers[i]?'filled':''}" onclick="place(${i})" ondragover="event.preventDefault()" ondrop="event.preventDefault();put(${i},event.dataTransfer.getData('text/plain'))">${answers[i]||'रिक्त स्थान'}</span></div>`).join('')}
function check(){let score=0;data.forEach((q,i)=>{let el=document.getElementById('slot'+i);el.classList.remove('correct','wrong');if(answers[i]){let ok=answers[i]===q[1];el.classList.add(ok?'correct':'wrong');if(ok)score++}});document.getElementById('score').textContent=`प्राप्तांक: ${score} / 6`}
function showAnswers(){answers={};data.forEach((q,i)=>answers[i]=q[1]);selected=null;save();render();check()}
function resetAll(){answers={};selected=null;localStorage.removeItem(key);render();document.getElementById('score').textContent='प्राप्तांक: 0 / 6'}render();
</script></body></html>
