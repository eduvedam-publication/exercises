<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 - Chapter 9 - Exercise 9A</title><style>
*{box-sizing:border-box}body{margin:0;background:#d7f9fd;font-family:Georgia,'Times New Roman',serif;color:#16212b}.sheet{width:min(960px,96vw);margin:18px auto;background:white;border:3px solid #00a9de;border-radius:22px;padding:24px 26px 20px}h2{color:#00a5d7;font-size:25px;margin:0 0 18px}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.q{background:#eefaff;border:1px solid #00b9f3;border-radius:12px;padding:15px;display:flex;flex-wrap:wrap;align-items:center;gap:9px;font-size:18px;min-width:0}.q label{flex:1 1 190px}.q input{width:165px;max-width:100%;padding:8px 10px;border:2px solid #ff6767;border-radius:5px;font:18px Georgia;background:#fff;outline:none}.q input.correct{border-color:#18ad5b;background:#e4f9eb;color:#13783a}.q input.wrong{border-color:#ed2525;background:#ffe5e5;color:#b90000;animation:blink .45s 3}@keyframes blink{50%{background:#ffabab}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}button{background:#ff8200;color:white;border:0;border-radius:25px;padding:11px 20px;font-weight:700;cursor:pointer}button.show{background:#009fd4}.message{text-align:center;margin-top:12px;font-weight:bold;color:#0655c5;min-height:20px}@media(max-width:620px){.sheet{padding:17px 12px}.questions{grid-template-columns:1fr}.q{font-size:16px}h2{font-size:21px}}
</style></head><body><main class="sheet"><h2>Add the following:</h2><div id="questions" class="questions"></div><div class="actions"><button id="check">Check Answers</button><button class="show" id="show">Show Answer</button><button id="reset">Reset</button></div><div class="message" id="message" aria-live="polite"></div></main><script>
const items=[["a. 5 km 765 m and 2 km 86 m", "7 km 851 m"], ["b. 54 km 476 m and 6 km 367 m", "60 km 843 m"]],key='math-4-ch9-9a-add-lengths';const host=document.getElementById('questions');let saved=[];try{saved=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){};
function norm(v){return v.toLowerCase().replace(/\s+/g,'').replace(/metres?|meters?/g,'m').replace(/centimetres?|centimeters?/g,'cm').replace(/millimetres?|millimeters?/g,'mm').replace(/kilometres?|kilometers?/g,'km')}
items.forEach(([question,answer],i)=>{const row=document.createElement('div');row.className='q';const label=document.createElement('label');label.textContent=question;label.htmlFor='answer'+i;const input=document.createElement('input');input.id='answer'+i;input.type='text';input.autocomplete='off';input.setAttribute('aria-label',question);input.value=saved[i]||'';input.addEventListener('input',()=>{input.classList.remove('correct','wrong');store();document.getElementById('message').textContent='' });row.append(label,input);host.append(row)});
function inputs(){return [...document.querySelectorAll('.q input')]}function store(){localStorage.setItem(key,JSON.stringify(inputs().map(el=>el.value)))}
document.getElementById('check').onclick=()=>{let correct=0;inputs().forEach((el,i)=>{el.classList.remove('correct','wrong');if(norm(el.value)===norm(items[i][1])){el.classList.add('correct');correct++}else{el.classList.add('wrong');void el.offsetWidth;el.style.animation='none';void el.offsetWidth;el.style.animation=''}});document.getElementById('message').textContent=correct===items.length?'All answers are correct!':'Correct answers: '+correct+' of '+items.length;store()};
document.getElementById('show').onclick=()=>{inputs().forEach((el,i)=>{el.value=items[i][1];el.classList.remove('wrong');el.classList.add('correct')});store();document.getElementById('message').textContent='Answers filled in.'};
document.getElementById('reset').onclick=()=>{inputs().forEach(el=>{el.value='';el.classList.remove('correct','wrong')});localStorage.removeItem(key);document.getElementById('message').textContent=''};
</script></body></html>
