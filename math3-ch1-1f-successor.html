<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif}.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{color:#00a5dc;font-size:25px;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 24px}.q{display:flex;align-items:center;gap:8px;font:19px Georgia,serif;white-space:nowrap}.q input{width:105px;height:39px;border:2px solid #ff3b30;font-size:18px;padding:5px}.actions{text-align:center;margin-top:30px}.actions button{border:0;border-radius:24px;padding:12px 22px;margin:0 6px;background:#ff8200;color:#fff;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){body{padding:0}.ex{padding:15px;border-radius:0}.grid{grid-template-columns:1fr}}</style></head><body><main class="ex"><h1>Write the successor of each of the following numbers.</h1><div class="grid"><div class="q"><span>a.</span><span>1207</span><input id="a0" inputmode="numeric"></div><div class="q"><span>b.</span><span>499</span><input id="a1" inputmode="numeric"></div><div class="q"><span>c.</span><span>379</span><input id="a2" inputmode="numeric"></div><div class="q"><span>d.</span><span>5082</span><input id="a3" inputmode="numeric"></div><div class="q"><span>e.</span><span>4981</span><input id="a4" inputmode="numeric"></div><div class="q"><span>f.</span><span>1269</span><input id="a5" inputmode="numeric"></div><div class="q"><span>g.</span><span>7000</span><input id="a6" inputmode="numeric"></div><div class="q"><span>h.</span><span>1099</span><input id="a7" inputmode="numeric"></div></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 8</div></main><script>const ans=['1208', '500', '380', '5083', '4982', '1270', '7001', '1100'];function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=e.value.trim()===a;e.className=ok?"ok":"bad";if(ok)s++});score.textContent=`Score: ${s} / 8`}function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.className=""});score.textContent="Score: 0 / 8"}</script></body></html>
