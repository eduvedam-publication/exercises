<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fill the missing numerals.</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;font-family:Georgia,"Times New Roman",serif;color:#222}.exercise{max-width:1040px;margin:18px auto;padding:26px 30px 30px;background:white;border:3px solid #00a9dd;border-radius:25px}h2{color:#00a7db;font-size:25px;margin:0 0 20px}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 26px}.q{padding:13px 14px;background:#eefbff;border:1px solid #05b6ee;border-radius:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:22px}.q strong{font-size:18px;margin-right:8px}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;justify-content:center;min-width:31px;line-height:1.1}.frac .top{border-bottom:1.5px solid #222;padding:2px 4px 3px;min-width:100%;text-align:center}.frac .bottom{padding:3px 4px 2px;text-align:center}.frac input{width:48px;height:33px;border:2px solid #ff5360;text-align:center;font:20px Georgia;background:white;outline:none;border-radius:3px}.frac input.correct{border-color:#20a05d;background:#d9f8e5}.frac input.incorrect{border-color:#e43c3c;background:#ffe5e5;animation:blink .45s linear 3}@keyframes blink{50%{background:#ff7b7b}}.equals{font-size:22px}.actions{display:flex;justify-content:center;gap:12px;margin-top:28px}button{background:#ff8100;color:white;border:0;border-radius:25px;padding:12px 22px;font-weight:bold;cursor:pointer}.feedback{text-align:center;min-height:22px;margin-top:13px;font:16px Arial;color:#155bb3}@media(max-width:680px){.exercise{margin:0;border-radius:0;padding:18px 12px}.questions{grid-template-columns:1fr;gap:12px}.q{gap:5px;padding:10px;font-size:18px}.frac input{width:40px;height:30px;font-size:17px}h2{font-size:21px}}</style></head><body data-exercise="math-4-ch7-7a-missing-numerals.html"><main class="exercise"><h2>Fill the missing numerals.</h2><div class="questions"><div class="q"><strong>a.</strong><span class="frac"><span class="top">3</span><span class="bottom">4</span></span><span class="equals">=</span><span class="frac"><span class="top"><input id="atop" data-answer="12" inputmode="numeric" aria-label="top for a"></span><span class="bottom">16</span></span></div><div class="q"><strong>b.</strong><span class="frac"><span class="top">32</span><span class="bottom">72</span></span><span class="equals">=</span><span class="frac"><span class="top">40</span><span class="bottom"><input id="bbottom" data-answer="90" inputmode="numeric" aria-label="bottom for b"></span></span></div><div class="q"><strong>c.</strong><span class="frac"><span class="top">5</span><span class="bottom">7</span></span><span class="equals">=</span><span class="frac"><span class="top">40</span><span class="bottom"><input id="cbottom" data-answer="56" inputmode="numeric" aria-label="bottom for c"></span></span></div><div class="q"><strong>d.</strong><span class="frac"><span class="top">54</span><span class="bottom">63</span></span><span class="equals">=</span><span class="frac"><span class="top">6</span><span class="bottom"><input id="dbottom" data-answer="7" inputmode="numeric" aria-label="bottom for d"></span></span></div></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div class="feedback" aria-live="polite"></div></main><script>const key='math4-ch7-'+document.body.dataset.exercise;function save(){const data={};document.querySelectorAll('input').forEach(x=>data[x.id]=x.value);localStorage.setItem(key,JSON.stringify(data))}function restore(){try{const data=JSON.parse(localStorage.getItem(key)||'{}');document.querySelectorAll('input').forEach(x=>{x.value=data[x.id]||''})}catch(e){}}function checkAnswers(){let correct=0;let total=0;document.querySelectorAll('input').forEach(x=>{total++;const ok=x.value.trim()!==''&&Number(x.value)===Number(x.dataset.answer);x.classList.remove('correct','incorrect');x.classList.add(ok?'correct':'incorrect');if(ok)correct++});document.querySelector('.feedback').textContent=correct===total?'All answers are correct!':'Check the highlighted answers and try again.';save()}function resetExercise(){document.querySelectorAll('input').forEach(x=>{x.value='';x.classList.remove('correct','incorrect')});document.querySelector('.feedback').textContent='';localStorage.removeItem(key)}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',()=>{x.classList.remove('correct','incorrect');document.querySelector('.feedback').textContent='';save()}));restore();</script></body></html>
