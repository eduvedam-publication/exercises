<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiple Choice Questions</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);padding:18px;color:#333}
.quiz-box{width:min(100%,1000px);margin:auto;background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:26px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.heading{color:#00a6d6;font-size:28px;font-weight:700;margin-bottom:20px}
.question-box{background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:18px 20px;margin-bottom:15px}
.result{text-align:center;margin:20px 0 14px;font-size:25px;font-weight:700;color:#0047ab}
.buttons{text-align:center}
.reset{border:0;border-radius:32px;padding:12px 30px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9800,#ff6f00);cursor:pointer}

.question{font-size:20px;line-height:1.45;font-weight:600;margin-bottom:13px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.option{width:100%;background:#fff;border:2px solid #ff4fa0;border-radius:16px;padding:11px 16px;text-align:left;font-size:16px;cursor:pointer}
.option.correct{background:#d4f8d4;border-color:#2e7d32;color:#1b5e20;font-weight:700}
.option.wrong{background:#ffd9dd;border-color:#c62828;color:#b71c1c;font-weight:700}.option:disabled{cursor:default}
@media(max-width:650px){body{padding:8px}.quiz-box{padding:16px 12px}.heading{font-size:21px}.question{font-size:17px}.options{grid-template-columns:1fr}.reset{width:100%}}
</style></head><body><div class="quiz-box"><div class="heading">Multiple choice questions.</div><div id="quiz"></div>
<div class="result" id="result">Score: 0 / 4</div><div class="buttons"><button class="reset" onclick="resetQuiz()">Reset Quiz</button></div></div>
<script>
const qs=[
{q:"1. Mahesh could not find his ________.",o:["i. Shoes","ii. Pencil and eraser","iii. Lunch box"],a:"ii. Pencil and eraser"},
{q:"2. Minoo was looking for her ________.",o:["i. Glasses","ii. Water bottle","iii. Notebook"],a:"i. Glasses"},
{q:"3. Mahesh's father could not find his ________.",o:["i. Car keys","ii. Wallet","iii. Watch"],a:"i. Car keys"},
{q:"4. Everyone got late because the house was ________.",o:["i. Clean","ii. Organised","iii. Chaotic"],a:"iii. Chaotic"}
];let score=0;
function load(){let x=document.getElementById("quiz");x.innerHTML="";qs.forEach(q=>{let b=document.createElement("div");b.className="question-box";let t=document.createElement("div");t.className="question";t.textContent=q.q;let o=document.createElement("div");o.className="options";q.o.forEach(v=>{let z=document.createElement("button");z.className="option";z.textContent=v;z.onclick=()=>check(z,v,q.a,o);o.append(z)});b.append(t,o);x.append(b)})}
function check(btn,val,a,c){c.querySelectorAll(".option").forEach(x=>{x.disabled=true;if(x.textContent===a)x.classList.add("correct")});if(val===a)score++;else btn.classList.add("wrong");document.getElementById("result").textContent=`Score: ${score} / 4`;}
function resetQuiz(){score=0;document.getElementById("result").textContent="Score: 0 / 4";load()}load();
</script></body></html>
