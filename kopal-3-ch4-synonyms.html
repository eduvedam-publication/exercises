<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>वर्ग पहेली में से पर्यायवाची शब्द ढूँढ़कर लिखिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:450px;display:flex;flex-direction:column}h2{font-size:23px;color:#00a9e5;margin:0 0 18px}.q{border:1.5px solid #00c7ee;border-radius:12px;background:#f0fbfe;padding:12px;margin:7px 0}.opts{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}.opt,.chip{border:1.5px solid #ff0070;border-radius:9px;background:white;padding:7px 12px;font-size:17px;cursor:pointer;color:#222}.opt.selected,.chip.selected{background:#d7efff;border-color:#007fdb}.ok{background:#d9f9dc!important;border-color:#0a9b55!important}.bad{background:#ffe3e3!important;border-color:#e32b2b!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff5d5d}}.actions{display:flex;gap:9px;justify-content:center;margin-top:auto;padding-top:24px}.actions button{background:#ff8500;color:white;border:0;border-radius:20px;padding:10px 19px;cursor:pointer}#result{text-align:center;color:#0061b4;font-weight:bold;margin:12px}.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;background:#e7f8fc;border-radius:12px;margin-bottom:14px}.chip{border-color:#00a9e5}.slot{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:110px;min-height:38px;border:2px dashed #ff5656;border-radius:6px;background:#fff;cursor:pointer;padding:5px 8px}.line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.wordrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0}.field{border:1.5px solid #ff5b5b;border-radius:5px;padding:7px;font-size:18px;max-width:220px} @media(max-width:600px){.wrap{margin:0;border-radius:0;padding:14px;min-height:100vh}.opts{gap:5px}.opt{font-size:15px;padding:6px}}</style></head><body><main class="wrap"><h2>वर्ग पहेली में से पर्यायवाची शब्द ढूँढ़कर लिखिए–</h2><p>वर्ग पहेली में से दिए गए शब्दों का एक-एक पर्यायवाची शब्द ढूँढ़कर लिखिए–</p><div style="display:flex;gap:20px;flex-wrap:wrap"><div style="flex:1;min-width:240px"><div class="wordrow"><b>(क) जग — </b><input class="field" data-i="0" aria-label="जग का पर्यायवाची"></div><div class="wordrow"><b>(ख) अर्थ — </b><input class="field" data-i="1" aria-label="अर्थ का पर्यायवाची"></div><div class="wordrow"><b>(ग) कर — </b><input class="field" data-i="2" aria-label="कर का पर्यायवाची"></div><div class="wordrow"><b>(घ) नर — </b><input class="field" data-i="3" aria-label="नर का पर्यायवाची"></div><div class="wordrow"><b>(ङ) विधान — </b><input class="field" data-i="4" aria-label="विधान का पर्यायवाची"></div></div><div style="display:grid;grid-template-columns:repeat(4,43px);align-content:start"><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">नि</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">य</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">म</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">प</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">न</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">मा</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">स</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">सं</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">ध</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">न</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">हा</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">सा</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">आ</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">व</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">थ</span><span style="border:1px solid #ff4c88;text-align:center;padding:10px 2px">र</span></div></div><div class="actions"><button onclick="submit()">Submit</button><button onclick="resetAll()">Reset</button></div><div id="result"></div></main><script>const key='kopal-2-ch4-synonyms';const fields=[...document.querySelectorAll('.field')];let saved=JSON.parse(localStorage.getItem(key)||'[]');fields.forEach((e,i)=>{e.value=saved[i]||'';e.addEventListener('input',()=>localStorage.setItem(key,JSON.stringify(fields.map(f=>f.value))))});function submit(){localStorage.setItem(key,JSON.stringify(fields.map(f=>f.value)));document.getElementById('result').textContent='उत्तर सुरक्षित हैं।'}function resetAll(){fields.forEach(e=>e.value='');localStorage.removeItem(key);document.getElementById('result').textContent=''}</script></body></html>
