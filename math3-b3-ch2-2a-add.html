<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial}.ex{max-width:1100px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{color:#00a5dc;font-size:25px;margin:0 0 22px}.problems{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 48px}.problem{display:grid;grid-template-columns:26px 1fr;font:19px Georgia}.card{background:#fdebef;padding:8px;width:170px}.cols{display:grid;grid-template-columns:repeat(var(--cols),1fr);text-align:center}.head{color:#ff1769;border-bottom:1px solid #75d8ef;padding:4px 0}.digits{padding:5px 0;border-bottom:1px solid #75d8ef;min-height:31px}.last{position:relative}.last:before{content:"+";position:absolute;left:-2px}.answer{width:100%;height:37px;border:2px solid #ff3b30;font-size:18px;padding:4px}.actions{text-align:center;margin-top:30px}.actions button{border:0;border-radius:24px;padding:12px 22px;margin:0 6px;background:#ff8200;color:#fff;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:800px){.problems{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){body{padding:0}.ex{padding:15px;border-radius:0}.problems{grid-template-columns:1fr}}</style></head><body><main class="ex"><h1>Add the following:</h1><div class="problems"><div class="problem"><span>1.</span><div class="card"><div class="cols head" style="--cols:3"><span>H</span><span>T</span><span>O</span></div><div class="cols digits " style="--cols:3"><span>2</span><span>6</span><span>7</span></div><div class="cols digits last" style="--cols:3"><span>6</span><span>1</span><span>2</span></div><input class="answer" id="a0" inputmode="numeric"></div></div><div class="problem"><span>2.</span><div class="card"><div class="cols head" style="--cols:4"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="cols digits " style="--cols:4"><span>4</span><span>2</span><span>5</span><span>3</span></div><div class="cols digits last" style="--cols:4"><span>2</span><span>1</span><span>4</span><span>2</span></div><input class="answer" id="a1" inputmode="numeric"></div></div><div class="problem"><span>3.</span><div class="card"><div class="cols head" style="--cols:3"><span>H</span><span>T</span><span>O</span></div><div class="cols digits " style="--cols:3"><span>8</span><span>5</span><span>2</span></div><div class="cols digits last" style="--cols:3"><span>1</span><span>3</span><span>4</span></div><input class="answer" id="a2" inputmode="numeric"></div></div><div class="problem"><span>4.</span><div class="card"><div class="cols head" style="--cols:4"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="cols digits " style="--cols:4"><span>3</span><span>5</span><span>4</span><span>7</span></div><div class="cols digits last" style="--cols:4"><span>5</span><span>3</span><span>5</span><span>2</span></div><input class="answer" id="a3" inputmode="numeric"></div></div><div class="problem"><span>5.</span><div class="card"><div class="cols head" style="--cols:4"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="cols digits " style="--cols:4"><span>2</span><span>3</span><span>5</span><span>4</span></div><div class="cols digits " style="--cols:4"><span>1</span><span>0</span><span>2</span><span>3</span></div><div class="cols digits last" style="--cols:4"><span></span><span>4</span><span>2</span><span>2</span></div><input class="answer" id="a4" inputmode="numeric"></div></div><div class="problem"><span>6.</span><div class="card"><div class="cols head" style="--cols:4"><span>Th</span><span>H</span><span>T</span><span>O</span></div><div class="cols digits " style="--cols:4"><span>3</span><span>4</span><span>2</span><span>2</span></div><div class="cols digits " style="--cols:4"><span>5</span><span>2</span><span>6</span><span>3</span></div><div class="cols digits last" style="--cols:4"><span></span><span>3</span><span>1</span><span>3</span></div><input class="answer" id="a5" inputmode="numeric"></div></div></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 6</div></main><script>const ans=['879', '6395', '986', '8899', '3799', '8998'];function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=e.value.trim()===a;e.className="answer "+(ok?"ok":"bad");if(ok)s++});score.textContent=`Score: ${s} / 6`}function resetAll(){document.querySelectorAll(".answer").forEach(e=>{e.value="";e.className="answer"});score.textContent="Score: 0 / 6"}</script></body></html>
