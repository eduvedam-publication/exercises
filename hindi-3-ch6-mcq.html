<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>हिंदी 3 • पाठ 6 • सही विकल्प पर सही (✓) का चिह्न लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);font-family:Arial,"Nirmala UI",sans-serif;color:#333;display:flex;align-items:center;justify-content:center;padding:18px}.quiz-box{width:min(100%,950px);background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:28px;box-shadow:0 12px 35px #0002}h1{font-size:27px;color:#00a6d6;margin:0 0 22px}.question-box{background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:17px 20px;margin-bottom:14px;font-size:21px;line-height:1.8}.options{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}button{font:inherit;cursor:pointer}.option,.word,.blank{border:2px solid #ff4fa0;border-radius:12px;background:white;padding:8px 18px;font-size:20px;color:#333}.selected{background:#fff0f7;outline:3px solid #ff4fa0}.correct{background:#d4f8d4!important;border-color:#2e7d32!important;color:#1b5e20}.wrong{background:#ffd9dd!important;border-color:#c62828!important;color:#b71c1c}.actions{text-align:center;margin-top:20px}.actions button{border:0;border-radius:32px;padding:12px 28px;margin:6px;font-size:18px;font-weight:bold;color:white;background:linear-gradient(135deg,#ff9800,#ff6f00)}#result{text-align:center;margin:18px 0 0;font-size:24px;font-weight:bold;color:#0047ab}.help-box{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;background:linear-gradient(135deg,#fff,#d8f36b,#fff);padding:15px;border-radius:16px;margin-bottom:20px;min-height:75px}.word{touch-action:none;user-select:none}.blank{min-width:150px;min-height:48px;border-style:dashed;margin:4px;vertical-align:middle;color:#d81b60}.hint{font-size:16px;margin:0 0 18px}.feedback{font-size:16px;margin-left:10px}button:focus-visible{outline:3px solid #0047ab;outline-offset:3px}.dragging{opacity:.55}.hover{outline:3px solid #00b8f0}@media(max-width:650px){body{padding:8px;align-items:flex-start}.quiz-box{padding:16px 12px;border-radius:20px}h1{font-size:22px}.question-box{padding:13px;font-size:18px}.option,.word,.blank{font-size:18px}.actions button{width:100%;margin:6px 0}}</style></head><body><main class="quiz-box"><h1>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h1><div id="quiz"></div><div class="actions"><button onclick="check()">उत्तर जाँचें</button><button onclick="reset()">फिर से करें</button></div><div id="result" role="status" aria-live="polite"></div></main><script>const data=[{"q": "‘युवक’ शब्द का स्त्रीलिंग शब्द है–", "opts": ["युविका", "युवकी", "युवती"], "a": 2}, {"q": "‘घोड़ी’ शब्द का पुल्लिंग शब्द है–", "opts": ["घोड़", "घोड़ा", "घोड़िया"], "a": 1}, {"q": "‘मछली’ शब्द का प्रयोग होता है सदा–", "opts": ["स्त्रीलिंग में", "पुल्लिंग में", "दोनों में"], "a": 0}, {"q": "सभी महीनों और दिनों के नाम होते हैं–", "opts": ["पुल्लिंग", "स्त्रीलिंग", "दोनों"], "a": 0}];const quiz=document.querySelector('#quiz'),result=document.querySelector('#result');const letters=['क','ख','ग','घ'];let selected=Array(data.length).fill(null);function render(){quiz.innerHTML='';data.forEach((q,i)=>{let row=document.createElement('div');row.className='question-box';let label=document.createElement('div');label.textContent=`(${letters[i]}) ${q.q}`;row.append(label);let opts=document.createElement('div');opts.className='options';q.opts.forEach((o,j)=>{let b=document.createElement('button');b.className='option';b.textContent=o;b.setAttribute('aria-label',`${letters[i]}: ${o==='✓'?'सही':o==='✕'?'गलत':o}`);b.setAttribute('aria-pressed','false');b.onclick=()=>{selected[i]=j;document.querySelectorAll('.correct,.wrong').forEach(x=>x.classList.remove('correct','wrong'));document.querySelectorAll('.feedback').forEach(x=>x.remove());opts.querySelectorAll('button').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});b.classList.add('selected');b.setAttribute('aria-pressed','true');result.textContent='उत्तर जाँचने के लिए बटन दबाएँ।'};opts.append(b)});row.append(opts);quiz.append(row)});result.textContent=`अंक: 0 / ${data.length}`}function check(){let n=0;quiz.querySelectorAll('.question-box').forEach((row,i)=>{row.querySelectorAll('.feedback').forEach(x=>x.remove());row.querySelectorAll('button').forEach((b,j)=>{b.classList.remove('correct','wrong');if(j===data[i].a)b.classList.add('correct');else if(j===selected[i])b.classList.add('wrong')});let f=document.createElement('span');f.className='feedback';f.textContent=selected[i]===data[i].a?'✓ सही':selected[i]===null?'उत्तर नहीं चुना':'✕ गलत';row.append(f);if(selected[i]===data[i].a)n++});result.textContent=`अंक: ${n} / ${data.length}`}function reset(){selected.fill(null);render()}render();</script></body></html>
