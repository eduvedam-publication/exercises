<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#e2f8fc;font-family:Georgia,"Times New Roman",serif}
.card{width:min(1080px,calc(100% - 24px));min-height:500px;margin:14px auto;background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:34px 42px;display:flex;flex-direction:column}
h1{font:700 25px Arial;color:#00a1db;margin:0 0 26px}.qs{display:grid;gap:18px;flex:1}.q{font-size:20px;line-height:1.55}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:7px}.letter{width:28px;flex:0 0 28px}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;margin:8px 0 0 28px}.opt{border:2px solid #ff1680;border-radius:11px;background:#fff;color:#111;padding:8px 14px;font:18px Georgia;cursor:pointer}
.opt.sel{background:#fff0f7}.opt.correct{background:#dff7df;border-color:#198c3d}.opt.wrong{background:#ffe1e1;border-color:#d92c2c}
input{height:38px;border:2px solid #ff2b22;padding:4px 8px;font:18px Arial;background:#fff;width:145px}
input.ok{background:#dff7df;border-color:#198c3d}input.bad{background:#ffe1e1;border-color:#d92c2c}
.footer{margin-top:auto;text-align:center;padding-top:30px}.footer button{border:0;border-radius:25px;background:#ff7b00;color:#fff;padding:13px 22px;margin:0 6px;font:bold 14px Arial;cursor:pointer}.score{margin-top:14px;color:#064bb4;font:bold 22px Arial}
.figure{display:inline-flex;align-items:center;margin-right:8px}.figure svg{width:130px;height:55px}
@media(max-width:650px){.card{padding:24px 18px}.q{font-size:18px}.opts{margin-left:0}input{width:115px}}
</style></head><body><main class="card">
<h1>Choose the correct option.</h1><div class="qs"><div class="q"><div class="row"><span class="letter">a.</span><span>The straight path between two points A and B is known as ________.</span></div><div class="opts"><button class="opt" data-q="0" data-v="0" onclick="pick(this)">i. Line</button><button class="opt" data-q="0" data-v="1" onclick="pick(this)">ii. Ray</button><button class="opt" data-q="0" data-v="2" onclick="pick(this)">iii. Line segment</button><button class="opt" data-q="0" data-v="3" onclick="pick(this)">iv. Plane</button></div></div><div class="q"><div class="row"><span class="letter">b.</span><span>Which of the following has a definite length?</span></div><div class="opts"><button class="opt" data-q="1" data-v="0" onclick="pick(this)">i. A line</button><button class="opt" data-q="1" data-v="1" onclick="pick(this)">ii. A ray</button><button class="opt" data-q="1" data-v="2" onclick="pick(this)">iii. A line segment</button><button class="opt" data-q="1" data-v="3" onclick="pick(this)">iv. A plane</button></div></div><div class="q"><div class="row"><span class="letter">c.</span><span><span class="figure"><svg viewBox="0 0 130 55"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7z" fill="#222"/></marker></defs><line x1="12" y1="45" x2="116" y2="10" stroke="#222" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><circle cx="42" cy="35" r="2.5" fill="#00a6df"/><circle cx="87" cy="20" r="2.5" fill="#00a6df"/><text x="36" y="27" fill="#00a6df" font-size="15">A</text><text x="84" y="14" fill="#00a6df" font-size="15">B</text></svg></span>The given figure is __________.</span></div><div class="opts"><button class="opt" data-q="2" data-v="0" onclick="pick(this)">i. A line</button><button class="opt" data-q="2" data-v="1" onclick="pick(this)">ii. A ray</button><button class="opt" data-q="2" data-v="2" onclick="pick(this)">iii. A line segment</button><button class="opt" data-q="2" data-v="3" onclick="pick(this)">iv. A plane</button></div></div><div class="q"><div class="row"><span class="letter">d.</span><span>Which of the following continues the pattern given below.<br>AB, AAB, AAAB, __________</span></div><div class="opts"><button class="opt" data-q="3" data-v="0" onclick="pick(this)">i. AABB</button><button class="opt" data-q="3" data-v="1" onclick="pick(this)">ii. ABB</button><button class="opt" data-q="3" data-v="2" onclick="pick(this)">iii. AAABB</button><button class="opt" data-q="3" data-v="3" onclick="pick(this)">iv. AAAAB</button></div></div></div>
<div class="footer"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button><div class="score" id="score">Score: 0 / 4</div></div></main>
<script>const A=[2, 2, 0, 3];function pick(e){document.querySelectorAll('[data-q="'+e.dataset.q+'"]').forEach(x=>x.classList.remove('sel','correct','wrong'));e.classList.add('sel')}
function check(){let s=0;A.forEach((a,q)=>{const e=document.querySelector('[data-q="'+q+'"].sel');if(e){let ok=+e.dataset.v===a;e.classList.add(ok?'correct':'wrong');if(ok)s++}});score.textContent='Score: '+s+' / 4'}
function resetAll(){document.querySelectorAll('.opt').forEach(e=>e.classList.remove('sel','correct','wrong'));score.textContent='Score: 0 / 4'}</script></body></html>
