<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1080px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:30px 38px}
h1{margin:0 0 26px;color:#00a3dc;font-size:25px}.questions{display:grid;width:100%;gap:22px 55px}.two{grid-template-columns:repeat(2,1fr)}.four{grid-template-columns:repeat(4,1fr)}
.q{display:flex;align-items:center;gap:8px;font:20px Georgia,serif}.nowrap{white-space:nowrap}.ans{width:95px;height:37px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:4px 7px}
.mcq{margin-bottom:24px;font:19px Georgia,serif}.prompt{margin-bottom:10px}.opts{display:flex;flex-wrap:wrap;gap:10px 20px;margin-left:28px}.opt{border:2px solid #ff1680;background:#fff;border-radius:11px;padding:9px 16px;font:17px Georgia,serif;cursor:pointer}.opt.sel{background:#ffe2ef}.opt.ok{background:#dcf8df;border-color:#009b8e}.opt.bad{background:#ffe1e1;border-color:#e43d30}
.controls{display:flex;justify-content:center;gap:14px;width:100%;margin-top:38px}.controls button{border:0;border-radius:24px;background:#ff7d00;color:#fff;font-weight:bold;padding:12px 22px;cursor:pointer}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}
.okI{background:#dcf8df!important;border-color:#009b8e!important}.badI{background:#ffe1e1!important;border-color:#e43d30!important}
@media(max-width:900px){.four{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){body{padding:0}.exercise{border-radius:0;padding:18px}.two,.four{grid-template-columns:1fr}}
</style></head><body><main class="exercise"><h1>Choose the correct option.</h1><div class="mcq" data-c="2"><div class="prompt">a. &nbsp;900 − ____ tens = 650</div><div class="opts"><button class="opt" onclick="pick(this,0,0)">i. 35</button><button class="opt" onclick="pick(this,0,1)">ii. 250</button><button class="opt" onclick="pick(this,0,2)">iii. 25</button><button class="opt" onclick="pick(this,0,3)">iv. None of these</button></div></div><div class="mcq" data-c="0"><div class="prompt">b. &nbsp;The number with more digits is ____________.</div><div class="opts"><button class="opt" onclick="pick(this,1,0)">i. Always greater</button><button class="opt" onclick="pick(this,1,1)">ii. Always smaller</button><button class="opt" onclick="pick(this,1,2)">iii. Sometimes greater</button><button class="opt" onclick="pick(this,1,3)">iv. Can’t say</button></div></div><div class="mcq" data-c="0"><div class="prompt">c. &nbsp;In the month of November, there are 15 working days. How many days were holidays?</div><div class="opts"><button class="opt" onclick="pick(this,2,0)">i. 16</button><button class="opt" onclick="pick(this,2,1)">ii. 14</button><button class="opt" onclick="pick(this,2,2)">iii. 15</button><button class="opt" onclick="pick(this,2,3)">iv. 4</button></div></div><div class="mcq" data-c="3"><div class="prompt">d. &nbsp;67 + ____ = 189</div><div class="opts"><button class="opt" onclick="pick(this,3,0)">i. 256</button><button class="opt" onclick="pick(this,3,1)">ii. 126</button><button class="opt" onclick="pick(this,3,2)">iii. 257</button><button class="opt" onclick="pick(this,3,3)">iv. 122</button></div></div><div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div></main><script>let picks=[-1,-1,-1,-1];function pick(b,q,v){picks[q]=v;b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}function check(){let s=0;document.querySelectorAll('.mcq').forEach((q,i)=>{let c=+q.dataset.c;q.querySelectorAll('.opt').forEach((b,j)=>{b.classList.remove('ok','bad');if(j===c)b.classList.add('ok');else if(j===picks[i])b.classList.add('bad')});if(picks[i]===c)s++});score.textContent='Score: '+s+' / 4'}function resetAll(){picks=[-1,-1,-1,-1];document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel','ok','bad'));score.textContent='Score: 0 / 4'}</script></body></html>
