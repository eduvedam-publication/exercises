<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>State true or false.</title><style>*{box-sizing:border-box}body{margin:0;background:#d0faff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#202020}.wrap{max-width:990px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a9e9;margin:0 0 16px;font-size:25px}.q{background:#ebfaff;border:1px solid #00b9ed;border-radius:11px;padding:13px;margin:9px 0}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:9px}.opt{background:white;border:1px solid #9bdfff;border-radius:7px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}.opt.selected{border:2px solid #008ad1;background:#d7f4ff}.correct{background:#d6ffe5!important;border-color:#0baf54!important}.wrong{background:#ffe0e0!important;border-color:#e33!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.5}}.buttons{text-align:center;margin-top:24px}button{background:#ff8000;color:white;border:0;border-radius:22px;padding:11px 19px;margin:3px;cursor:pointer;font-weight:bold}.score{text-align:center;color:#0051b8;font-size:19px;font-weight:bold;margin:12px}.bank{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;background:#dff7ff;padding:13px;border-radius:10px;margin:12px 0}.chip{color:#202020;font-family:inherit;font-weight:normal;line-height:1.5;appearance:none;border:1px solid #00aeec;background:white;border-radius:7px;padding:9px 14px;cursor:grab;font-size:18px}.chip.active{outline:3px solid orange}.slot{display:inline-flex;min-width:125px;min-height:37px;border:2px dashed #ff724d;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;padding:4px 10px;cursor:pointer;background:white}.slot.filled{border-style:solid}.statement{display:flex;gap:10px;justify-content:space-between;align-items:center}.choices{display:flex;gap:6px;flex-shrink:0}.choice{color:#202020;font-family:Arial,sans-serif;font-size:21px;font-weight:bold;min-width:40px;min-height:37px;line-height:1;appearance:none;border:1px solid #00aeec;background:white;border-radius:7px;padding:7px 13px;cursor:pointer}.choice.selected{background:#ccefff;border-width:2px}@media(max-width:650px){.wrap{margin:7px;padding:14px}.options{grid-template-columns:1fr}.q{font-size:16px}.statement{align-items:flex-start;flex-direction:column}}.opt{font:inherit;color:inherit;text-align:left;width:100%}.opts{grid-template-columns:repeat(4,minmax(0,1fr))}.feedback{display:block;font:14px Arial;margin-top:7px}.feedback.ok{color:#16833b}.feedback.no{color:#c62634}.statement{flex-wrap:wrap}.statement .feedback{flex-basis:100%}.choice:focus-visible,.opt:focus-visible,button:focus-visible{outline:3px solid #006bff;outline-offset:3px}@media(max-width:620px){.opts{grid-template-columns:1fr 1fr}}.picture-feedback,.feedback{display:none!important}.sheet{width:min(1120px,100%)}.wrap{max-width:1120px}.q{font-size:21px}.opt{font-size:20px}</style></head><body><main class="wrap"><h2>State true or false.</h2><section id="questions"></section><div class="actions buttons"><button type="button" onclick="check()">Submit</button><button type="button" onclick="showAnswers()">Show Answer</button><button type="button" onclick="resetAll()">Reset</button></div></main><script>
const data=[["The number name for 74 is seventy-four.", ["\u2713", "\u2717"], 0], ["The number next to the number 95 is 59.", ["\u2713", "\u2717"], 1], ["The number just before the number 39 is 38.", ["\u2713", "\u2717"], 0], ["The number greatest out of the numbers 51 and 61 is 61.", ["\u2713", "\u2717"], 0]],key='exercise:revised-v2:math-1-ch6-assessment-true-false.html';let answers={};try{const a=JSON.parse(localStorage.getItem(key)||'{}');if(a&&typeof a==='object'&&!Array.isArray(a))answers=a}catch(e){}const root=document.getElementById('questions');
function persist(){try{localStorage.setItem(key,JSON.stringify(answers))}catch(e){}}
function render(){root.innerHTML=data.map((q,i)=>`<div class="q ${"tf"==='tf'?'statement':''}" id="q${i}"><span>${String.fromCharCode(97+i)}. ${q[0]}</span><div class="${"tf"==='tf'?'choices':'opts'}">${q[1].map((o,j)=>`<button type="button" class="${"tf"==='tf'?'choice':'opt'} ${answers[i]===j?'selected sel':''}" id="o${i}-${j}" aria-label="${"tf"==='tf'?(j===0?'True':'False'):o}" aria-pressed="${answers[i]===j}" onclick="pick(${i},${j})"><span>${o}</span>${"tf"==='tf'?'':`<span aria-hidden="true">${answers[i]===j?'☑':'□'}</span>`}</button>`).join('')}</div><span class="feedback" id="f${i}" aria-live="polite" hidden hidden></span></div>`).join('')}
function pick(i,j){answers[i]=j;persist();render()}
function check(){data.forEach((q,i)=>{q[1].forEach((_,j)=>document.getElementById('o'+i+'-'+j).classList.remove('correct','wrong'));const el=document.getElementById('o'+i+'-'+answers[i]);const f=document.getElementById('f'+i);const ok=answers[i]===q[2];if(el)el.classList.add(ok?'correct':'wrong');f.textContent='';f.className='feedback '+(ok?'ok':'no')});const detail={exerciseType:"tf"==='tf'?'TRUE_FALSE':'MCQ',exerciseId:'math-1-ch6-assessment-true-false.html',response:{...answers}};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')}
function showAnswers(){data.forEach((q,i)=>answers[i]=q[2]);persist();render();check()}
function resetAll(){answers={};persist();render()}
render();
</script></body></html>
