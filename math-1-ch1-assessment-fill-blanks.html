<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fill in the Blanks</title><style>
*{box-sizing:border-box}body{margin:0;background:#b9fbff;font-family:Georgia,'Times New Roman',serif;color:#172735;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px}.sheet{width:min(1050px,100%);background:white;border:3px solid #00a9f4;border-radius:20px;padding:22px 24px}h1{font:700 clamp(23px,3vw,32px) Arial,sans-serif;color:#009ff0;margin:0 0 18px}.question{background:#e0f9ff;border:1.5px solid #00a9ff;border-radius:11px;margin:9px 0;padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:clamp(16px,1.7vw,20px)}.qnum{min-width:26px}.question label{flex:0 1 auto}.question input{width:190px;max-width:100%;padding:9px;border:2px solid #ff685d;border-radius:5px;font:inherit;color:#173c4d;background:white}.question input.correct{border-color:#20a953;background:#e8fff0}.question input.wrong{border-color:#e62c38;background:#fff0f0}.feedback{font:700 14px Arial,sans-serif}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:12px 19px;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #006bff;outline-offset:2px}@media(max-width:620px){.sheet{padding:16px 12px}.question{align-items:flex-start}.question label{width:calc(100% - 40px)}.question input{margin-left:35px;width:min(260px,calc(100% - 35px))}}
.question{display:block;line-height:1.6}.prompt{display:block;margin-bottom:8px}.options{display:flex;gap:12px 24px;flex-wrap:wrap}.options label{display:flex;gap:7px;align-items:center;cursor:pointer}.options input{width:20px;height:20px;margin:0;accent-color:#009ff0}.question select{border:2px solid #ff685d;border-radius:5px;background:white;font:inherit;padding:9px;min-width:100px;max-width:100%}.question select.correct{border-color:#20a953;background:#e8fff0}.question select.wrong{border-color:#e62c38;background:#fff0f0}.feedback{display:block;min-height:22px;margin-top:6px}.question.correct{border-color:#20a953}.question.wrong{border-color:#e62c38}.comparison-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}.comparison-grid .question{margin:0;text-align:center}.comparison-grid .question select{margin:0 12px;min-width:65px}.instruction{font-size:21px;line-height:1.5}.example{background:#effbe9;padding:12px 18px;border-radius:10px;margin:16px 0;font-size:22px}.question input[type=text]{margin:0}.question label{width:auto}@media(max-width:550px){.comparison-grid{grid-template-columns:1fr}.question input[type=text]{width:100%}.options{gap:10px 18px}.options label{width:auto}.instruction{font-size:18px}}.simple-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.simple-card{background:#eafaff;border:1px solid #00b9ed;border-radius:11px;padding:16px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center;align-items:center}.three input,.next-pair input,.order-new input{width:100%;min-width:0;border:2px solid #ff685d;border-radius:5px;background:white;padding:10px 4px;font:22px Georgia;text-align:center}.three .given{padding:10px 4px;background:#d1efca;border-radius:6px;font-size:23px}.three .hint{font:14px Arial;color:#52606d}.three .feedback{font-size:12px}.next-pair{display:grid;grid-template-columns:1fr 30px 1fr;gap:10px;align-items:center;text-align:center;font-size:26px}.next-pair .feedback{grid-column:1/4}.order-new{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.source-numbers{font-size:26px;word-spacing:20px;margin-bottom:20px}.new-input.correct{background:#e8fff0;border-color:#20a953}.new-input.wrong{background:#fff0f0;border-color:#e62c38}h1{font-size:clamp(22px,3vw,29px);line-height:1.4}body{align-items:flex-start}.sheet{margin:14px 0}@media(max-width:560px){.simple-grid{grid-template-columns:1fr}.three{gap:6px}.three input{font-size:18px}.order-new{gap:7px}.order-new input{font-size:21px}}.picture-feedback,.feedback{display:none!important}.sheet{width:min(1120px,100%)}.wrap{max-width:1120px}.q{font-size:21px}.opt{font-size:20px}</style></head><body><main class="sheet"><h1>Fill in the blanks.</h1><section><div class="question" id="q0"><label class="prompt" id="p0" for="a0">a. The number name of 10 is</label><input type="text" id="a0" autocomplete="off" spellcheck="false" placeholder="Answer"><span id="f0" class="feedback" aria-live="polite" hidden></span></div><div class="question" id="q1"><label class="prompt" id="p1" for="a1">b. The number that comes just after 13 is</label><input type="text" id="a1" autocomplete="off" spellcheck="false" placeholder="Answer" inputmode="numeric"><span id="f1" class="feedback" aria-live="polite" hidden></span></div><div class="question" id="q2"><label class="prompt" id="p2" for="a2">c. The number that comes just before ten is</label><input type="text" id="a2" autocomplete="off" spellcheck="false" placeholder="Answer" inputmode="numeric"><span id="f2" class="feedback" aria-live="polite" hidden></span></div><div class="question" id="q3"><label class="prompt" id="p3" for="a3">d. The number that comes after 16 and before 18 is</label><input type="text" id="a3" autocomplete="off" spellcheck="false" placeholder="Answer" inputmode="numeric"><span id="f3" class="feedback" aria-live="polite" hidden></span></div></section><div class="actions"><button type="button" id="submit">Submit</button><button type="button" id="show">Show Answer</button><button type="button" id="reset">Reset</button></div></main><script>
const questions=[{"type": "text", "text": "The number name of 10 is", "answer": "Ten"}, {"type": "text", "text": "The number that comes just after 13 is", "answer": "14"}, {"type": "text", "text": "The number that comes just before ten is", "answer": "9"}, {"type": "text", "text": "The number that comes after 16 and before 18 is", "answer": "17"}],key='exercise:revised-v2:math-1-ch1-assessment-fill-blanks.html';const fields=questions.map((_,i)=>document.getElementById('a'+i));
function norm(v){return String(v).trim().toLowerCase().replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c))}
function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}catch(e){}}
function clearFeedback(){fields.forEach((x,i)=>{x.classList.remove('correct','wrong');const f=document.getElementById('f'+i);f.textContent='';f.className='feedback'})}
fields.forEach(x=>x.addEventListener('input',()=>{clearFeedback();save()}));
try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))fields.forEach((x,i)=>{if(typeof a[i]==='string')x.value=a[i]})}catch(e){}
document.getElementById('submit').addEventListener('click',()=>{fields.forEach((x,i)=>{const ok=norm(x.value)===norm(questions[i].answer);x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok);const f=document.getElementById('f'+i);f.textContent='';f.className='feedback '+(ok?'ok':'no')});save();const detail={exerciseType:'FILL_BLANK',exerciseId:'math-1-ch1-assessment-fill-blanks.html',response:Object.fromEntries(fields.map((x,i)=>['question'+(i+1),x.value]))};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')});
document.getElementById('show').addEventListener('click',()=>{fields.forEach((x,i)=>x.value=questions[i].answer);clearFeedback();save()});document.getElementById('reset').addEventListener('click',()=>{fields.forEach(x=>x.value='');clearFeedback();save()});
</script></body></html>
