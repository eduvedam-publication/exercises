<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Circle the Correct Word</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);display:flex;justify-content:center;align-items:center;padding:18px;color:#333}
.quiz-box{width:min(100%,950px);background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.heading{font-size:27px;font-weight:700;color:#00a6d6;margin-bottom:20px}
.question-box{background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:17px 20px;margin-bottom:14px}
.result{text-align:center;margin:20px 0 14px;font-size:24px;font-weight:700;color:#0047ab}
.buttons{text-align:center}
.reset,.action{border:0;border-radius:32px;padding:12px 28px;margin:5px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9800,#ff6f00);cursor:pointer}

.question{font-size:20px;line-height:1.7;font-weight:600}
.option{display:inline-block;background:#fff;border:2px solid #ff4fa0;border-radius:50%;padding:6px 13px;margin:0 4px;cursor:pointer;font-size:18px;font-weight:700}
.option:hover{background:#fff0f7}.option.correct{background:#d4f8d4;border-color:#2e7d32;color:#1b5e20}.option.wrong{background:#ffd9dd;border-color:#c62828;color:#b71c1c}.option.disabled{pointer-events:none}
@media(max-width:650px){body{padding:8px;align-items:flex-start}.quiz-box{padding:16px 12px}.heading{font-size:21px}.question{font-size:16px}.option{font-size:15px;padding:5px 10px}.reset{width:100%}}
</style></head><body><div class="quiz-box">
<div class="heading">Circle the correct word.</div><div id="quiz"></div>
<div class="result" id="result">Score: 0 / 5</div><div class="buttons"><button class="reset" onclick="resetQuiz()">Reset Quiz</button></div>
</div><script>
const questions=[
{before:"1. God gives us ",a:"light",b:"darkness",after:".",answer:"light"},
{before:"2. We should ",a:"love",b:"hate",after:" others.",answer:"love"},
{before:"3. We should speak the ",a:"truth",b:"lie",after:".",answer:"truth"},
{before:"4. We should be ",a:"kind",b:"rude",after:".",answer:"kind"},
{before:"5. We pray for ",a:"everyone",b:"nobody",after:".",answer:"everyone"}
];let score=0;
function loadQuiz(){const quiz=document.getElementById("quiz");quiz.innerHTML="";questions.forEach(q=>{const box=document.createElement("div");box.className="question-box";const line=document.createElement("div");line.className="question";line.append(document.createTextNode(q.before));const a=document.createElement("span");a.className="option";a.textContent=q.a;const slash=document.createTextNode(" / ");const b=document.createElement("span");b.className="option";b.textContent=q.b;line.append(a,slash,b,document.createTextNode(q.after));a.onclick=()=>check(a,q.a,q.answer,[a,b]);b.onclick=()=>check(b,q.b,q.answer,[a,b]);box.append(line);quiz.append(box)})}
function check(sel,val,ans,opts){opts.forEach(o=>{o.classList.add("disabled");if(o.textContent===ans)o.classList.add("correct")});if(val===ans)score++;else sel.classList.add("wrong");document.getElementById("result").textContent=`Score: ${score} / 5`;}
function resetQuiz(){score=0;document.getElementById("result").textContent="Score: 0 / 5";loadQuiz()}loadQuiz();
</script></body></html>
