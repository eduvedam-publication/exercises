<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>रिक्त स्थान पूर्ति कीजिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#cef9ff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#142434}.wrap{max-width:1000px;margin:22px auto;padding:25px;border:3px solid #00aeeb;border-radius:22px;background:white}h1{color:#00a8e6;font-size:27px;margin:0 0 20px}.q{background:#e9faff;border:1.5px solid #00b5f8;border-radius:12px;padding:13px 16px;margin:9px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px solid #8cdfff;border-radius:9px;padding:10px;cursor:pointer;min-height:48px}.opt input{accent-color:#00a8e6;width:19px;height:19px}.opt.good,.good{background:#d9fbe7!important;border-color:#21ad58!important}.opt.bad,.bad{background:#ffe0e0!important;border-color:#f44336!important}.actions{text-align:center;margin-top:25px}button{background:#ff8000;color:white;border:0;border-radius:22px;padding:11px 20px;margin:4px;cursor:pointer;font-weight:bold;font-size:15px}.marks{text-align:center;color:#0049be;font-weight:bold;font-size:19px;margin-top:10px}.bank{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;background:#dcf7ff;padding:16px;border-radius:12px;margin-bottom:14px}.chip{background:white;border:1.5px solid #00b7f9;border-radius:9px;padding:8px 15px;font-size:19px;cursor:grab}.chip.used{opacity:.35}.blank{display:inline-flex;min-width:125px;min-height:40px;vertical-align:middle;border:2px dashed #ff684b;border-radius:7px;align-items:center;justify-content:center;padding:4px 9px;cursor:pointer;color:#12426c}.blank:empty:before{content:' ';white-space:pre}.truth{display:flex;gap:8px;margin-left:auto}.truth button{border:2px solid #00b5f8;border-radius:7px;background:white;color:#006a94;padding:5px 12px;font-size:22px;margin:0}.truth button.selected{background:#c9efff}.qline{display:flex;align-items:center;gap:14px}.qline span{flex:1}@media(max-width:620px){.wrap{margin:8px;padding:14px}h1{font-size:22px}.q{font-size:16px}.opts{grid-template-columns:1fr}.truth button{padding:4px 8px}}
.opt.selected{border:2px solid #00a8e6;background:#d9f5ff}.truth button{min-width:44px;min-height:40px;font-family:Arial,sans-serif;font-weight:bold}.truth button.good{background:#d9fbe7;color:#087a34}.truth button.bad{background:#ffe0e0;color:#c32424}.chip.selected{outline:3px solid #ff8700}.chip.used{opacity:.45}@media(max-width:650px){.qline{align-items:flex-start}.truth{flex-shrink:0}}</style></head><body><main class="wrap"><h1>रिक्त स्थान पूर्ति कीजिए–</h1><div class="bank" id="bank"><button type="button" class="chip" id="chip0" draggable="true" onclick="choose(0)" ondragstart="drag(event,0)">की अशुद्धियाँ</button><button type="button" class="chip" id="chip1" draggable="true" onclick="choose(1)" ondragstart="drag(event,1)">सुधार करना</button><button type="button" class="chip" id="chip2" draggable="true" onclick="choose(2)" ondragstart="drag(event,2)">दो</button><button type="button" class="chip" id="chip3" draggable="true" onclick="choose(3)" ondragstart="drag(event,3)">बोलते हैं</button></div><section class="q" id="row0">(क) शुद्ध उच्चारण द्वारा भाषा <span class="blank" id="blank0" onclick="place(0)" ondragover="event.preventDefault()" ondrop="drop(event,0)"></span> दूर की जा सकती हैं।</section><section class="q" id="row1">(ख) शोधन का अर्थ है <span class="blank" id="blank1" onclick="place(1)" ondragover="event.preventDefault()" ondrop="drop(event,1)"></span> ।</section><section class="q" id="row2">(ग) मुख्य रूप से <span class="blank" id="blank2" onclick="place(2)" ondragover="event.preventDefault()" ondrop="drop(event,2)"></span> प्रकार की होती हैं।</section><section class="q" id="row3">(घ) हिंदी भाषा में हम जैसा <span class="blank" id="blank3" onclick="place(3)" ondragover="event.preventDefault()" ondrop="drop(event,3)"></span> वैसा ही लिखते हैं।</section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswer()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="marks" class="marks">Marks: 0 / 4</div></main><script>const KEY="gyandhara-4-ch15-fill",answers=["की अशुद्धियाँ", "सुधार करना", "दो", "बोलते हैं"];let state=[null,null,null,null],selected=null;try{let a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a)&&a.length===4)state=a}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function choose(i){selected=i;render()}function drag(e,i){selected=i;e.dataTransfer.setData('text/plain',String(i))}function drop(e,i){e.preventDefault();selected=Number(e.dataTransfer.getData('text/plain'));place(i)}function place(i){if(selected===null){if(state[i]!==null)state[i]=null}else{state=state.map(v=>v===selected?null:v);state[i]=selected;selected=null}save();render()}function render(){for(let i=0;i<4;i++){let b=document.getElementById('blank'+i);b.textContent=state[i]===null?'':answers[state[i]];b.classList.remove('good','bad');let chip=document.getElementById('chip'+i);chip.classList.toggle('used',state.includes(i));chip.classList.toggle('selected',selected===i)}}function check(){let n=0;for(let i=0;i<4;i++){let b=document.getElementById('blank'+i);b.classList.remove('good','bad');if(state[i]!==null){let ok=state[i]===i;b.classList.add(ok?'good':'bad');if(ok)n++}}document.getElementById('marks').textContent=`Marks: ${n} / 4`}function showAnswer(){state=[0,1,2,3];selected=null;save();render();check()}function resetAll(){state=[null,null,null,null];selected=null;localStorage.removeItem(KEY);render();document.getElementById('marks').textContent='Marks: 0 / 4'}render();</script></body></html>
