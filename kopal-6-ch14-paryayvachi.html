<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>निम्नलिखित शब्दों के दो-दो पर्यायवाची शब्द लिखिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#bafaff;color:#173044;font-family:Arial,"Noto Sans Devanagari",sans-serif}.wrap{max-width:1020px;margin:14px auto;padding:24px;background:#fff;border:3px solid #00aeff;border-radius:20px}h1{color:#00a5ed;font-size:clamp(21px,3vw,29px);margin:0 0 16px}.q{background:#e0f9ff;border:1.5px solid #00aeff;border-radius:12px;padding:12px 14px;margin:9px 0;font-size:19px;line-height:1.9}.opts,.bank{display:flex;flex-wrap:wrap;gap:9px}.opts{margin-top:6px}.bank{background:#d1f7ff;padding:12px;border-radius:11px;margin-bottom:12px}.opt,.chip,.slot,.match{font:inherit;border:1px solid #00aeff;border-radius:9px;background:white;padding:8px 13px;color:#173044;cursor:pointer;min-height:40px}.opt.sel,.chip.sel,.match.sel{background:#9feaff}.slot{border:2px dashed #ff867b;min-width:125px;vertical-align:middle;white-space:normal}.good{background:#d6f8df!important;border-color:#16a34a!important;color:#176534!important}.bad{background:#ffe0e0!important;border-color:#e03131!important;color:#a11!important}.controls{text-align:center;margin-top:24px}.controls button{border:0;background:#ff7300;color:white;border-radius:25px;padding:11px 18px;margin:3px;cursor:pointer;font-weight:bold}.score{text-align:center;color:#0039dc;font-weight:bold;font-size:22px;margin-top:10px}.matchgrid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px 25%;padding:5px}.matchcol{display:flex;flex-direction:column;gap:10px;z-index:1}.match{min-height:52px;text-align:left}.matchsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.hint{font-size:15px;color:#456}@media(max-width:600px){.wrap{margin:5px;padding:12px}.q{font-size:17px}.slot{min-width:90px}.matchgrid{gap:10px 10%}}</style></head><body><main class="wrap"><h1>निम्नलिखित शब्दों के दो-दो पर्यायवाची शब्द लिखिए–</h1><section id="questions"></section><div class="controls"><button id="submit">Submit</button><button id="answer">Show Answer</button><button id="reset">Reset</button></div><div class="score" id="score">Marks: 0 / 3</div></main><script>const TYPE="paryayvachi";const TOTAL=3;const root=document.getElementById('questions'), score=document.getElementById('score');const key='KOPAL_6_CH14_'+TYPE;let answers=[];try{answers=JSON.parse(localStorage.getItem(key))||[]}catch(e){};function save(){localStorage.setItem(key,JSON.stringify(answers))}function mark(el,correct){el.classList.remove('good','bad');el.classList.add(correct?'good':'bad')}function clearMarks(){document.querySelectorAll('.good,.bad').forEach(x=>x.classList.remove('good','bad'))}function controls(check,show,reset){document.getElementById('submit').onclick=check;document.getElementById('answer').onclick=show;document.getElementById('reset').onclick=()=>{answers=[];save();reset();score.textContent='Marks: 0 / '+TOTAL}}function result(n){score.textContent='Marks: '+n+' / '+TOTAL}const letters=['क','ख','ग','घ','ङ','च'];const DATA=[["सूर्य — ", "", "दिनकर, दिवाकर"], ["पेड़ — ", "", "वृक्ष, तरु"], ["पानी — ", "", "जल, नीर"]];const BANK=["जल, नीर", "दिनकर, दिवाकर", "वृक्ष, तरु"];let selected=null;function render(){root.innerHTML='<div class="bank">'+BANK.map((v,i)=>`<button draggable="true" class="chip" data-v="${v}">${v}</button>`).join('')+'</div>'+DATA.map((q,i)=>`<div class="q">(${letters[i]}) ${q[0]}<button class="slot" data-i="${i}">${answers[i]||'__________'}</button>${q[1]}</div>`).join('');root.querySelectorAll('.chip').forEach(b=>{b.onclick=()=>{selected=b.dataset.v;root.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===b))};b.ondragstart=e=>{selected=b.dataset.v;e.dataTransfer.setData('text/plain',selected)}});root.querySelectorAll('.slot').forEach(b=>{b.onclick=()=>{if(selected!==null){answers[+b.dataset.i]=selected;selected=null;save();render()}else if(answers[+b.dataset.i]){answers[+b.dataset.i]=null;save();render()}};b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();answers[+b.dataset.i]=e.dataTransfer.getData('text/plain')||selected;selected=null;save();render()}})}controls(()=>{let n=0;DATA.forEach((q,i)=>{if(answers[i]===q[2])n++;if(answers[i])mark(root.querySelectorAll('.slot')[i],answers[i]===q[2])});result(n)},()=>{answers=DATA.map(q=>q[2]);save();render();root.querySelectorAll('.slot').forEach(x=>mark(x,true));result(TOTAL)},render);render();</script></body></html>
