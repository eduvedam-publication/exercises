<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find the LCM of the following numbers by prime factorisation method.</title><style>
*{box-sizing:border-box}body{margin:0;background:#bafaff;font-family:Georgia,'Times New Roman',serif;color:#172333}.shell{width:min(1000px,96vw);margin:16px auto;background:white;border:3px solid #00a8ff;border-radius:20px;padding:22px}h1{font-size:clamp(21px,3vw,30px);color:#00a7f5;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.q{background:#dff9ff;border:1.5px solid #00aeff;border-radius:11px;padding:15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:20px}.q label{min-width:145px}.q input{width:170px;max-width:100%;font:inherit;border:2px solid #ff6b66;border-radius:5px;padding:8px;color:#172333;background:white}.q input.correct{border-color:#17a34a;background:#eaffef}.q input.wrong{border-color:#ed3434;background:#ffe6e6}.feedback{font-size:15px;font-weight:bold}.feedback.good{color:#168b3e}.feedback.bad{color:#d22}.actions{text-align:center;margin-top:22px}button{background:#ff7200;color:white;border:0;border-radius:22px;padding:12px 19px;margin:3px;cursor:pointer;font-weight:bold}button:hover{filter:brightness(.93)}#marks{text-align:center;color:blue;font:bold 22px Arial;margin:10px 0 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.shell{padding:15px}.q{font-size:18px}}
</style></head><body><main class="shell"><h1>Find the LCM of the following numbers by prime factorisation method.</h1><section class="grid" id="questions"></section><div class="actions"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div id="marks">Marks: 0 / 4</div></main><script>
const questions=[["40 and 32", "160"], ["20 and 28", "140"], ["30, 45 and 60", "180"], ["25, 50 and 70", "350"]];const key='math-5-ch2-2c-prime-factorisation-answers';const host=document.getElementById('questions');let answers=[];try{const old=JSON.parse(localStorage.getItem(key));if(Array.isArray(old))answers=old}catch(e){};
function save(){localStorage.setItem(key,JSON.stringify([...document.querySelectorAll('.q input')].map(x=>x.value)))}
questions.forEach(([prompt,answer],i)=>{const card=document.createElement('div');card.className='q';const label=document.createElement('label');label.htmlFor='ans'+i;label.textContent=String.fromCharCode(97+i)+'.  '+prompt;const inp=document.createElement('input');inp.id='ans'+i;inp.type='text';inp.inputMode='numeric';inp.autocomplete='off';inp.setAttribute('aria-label','LCM of '+prompt);inp.value=answers[i]||'';const fb=document.createElement('span');fb.className='feedback';inp.addEventListener('input',()=>{inp.classList.remove('correct','wrong');fb.textContent='';save()});card.append(label,inp,fb);host.append(card)});
const inputs=[...document.querySelectorAll('.q input')];const fbs=[...document.querySelectorAll('.feedback')];
document.getElementById('submit').onclick=()=>{let score=0;inputs.forEach((inp,i)=>{const value=inp.value.trim().replace(/[,\s]/g,'');const good=value===questions[i][1];score+=good?1:0;inp.classList.toggle('correct',good);inp.classList.toggle('wrong',!good);fbs[i].textContent=good?'✓ Correct':'✗ Incorrect';fbs[i].className='feedback '+(good?'good':'bad')});document.getElementById('marks').textContent='Marks: '+score+' / '+questions.length;save();try{if(typeof window.submitExercise==='function')window.submitExercise({exerciseType:'FILL_BLANK',response:Object.fromEntries(inputs.map((x,i)=>['question'+(i+1),x.value])),score,total:questions.length})}catch(e){console.warn(e)}};
document.getElementById('show').onclick=()=>{inputs.forEach((inp,i)=>{inp.value=questions[i][1];inp.classList.remove('wrong');inp.classList.add('correct');fbs[i].textContent='✓ Correct';fbs[i].className='feedback good'});document.getElementById('marks').textContent='Marks: 4 / 4';save()};
document.getElementById('reset').onclick=()=>{inputs.forEach((inp,i)=>{inp.value='';inp.classList.remove('correct','wrong');fbs[i].textContent=''});document.getElementById('marks').textContent='Marks: 0 / 4';save()};
</script></body></html>
