<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fill in the blanks.</title><style>*{box-sizing:border-box}body{margin:0;background:#d8faff;font-family:Georgia,"Times New Roman",serif;color:#182334}.sheet{max-width:1020px;margin:16px auto;padding:25px 28px;background:white;border:3px solid #00aee9;border-radius:22px}h2{margin:0 0 18px;color:#00a6df;font-size:25px}.item{background:#effaff;border:1.5px solid #00b6f1;border-radius:12px;margin:10px 0;padding:12px}.question{font-size:18px;margin-bottom:10px}.options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.opt{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid #9ddff7;border-radius:8px;padding:9px;cursor:pointer;font-size:16px;min-width:0}.opt input{appearance:none;flex:none;width:24px;height:24px;border:2px solid #00aeef;background:white;margin:0;cursor:pointer}.opt:has(input:checked){background:#dff4ff;border-color:#00a8ef}.opt input:checked:after{content:'✓';display:block;text-align:center;font-size:20px;line-height:20px;color:#0075c8}.answer{border:2px solid #ff604c;padding:7px 8px;font:18px Georgia;min-width:95px;width:155px;max-width:100%;background:white}.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:19px}.line .answer{width:130px}.good{border-color:#1bb65b!important;background:#e5f9e9!important}.bad{border-color:#f33!important;background:#fff0f0!important;animation:flash .35s 3}@keyframes flash{50%{background:#ff9999;border-color:#c00}}.actions{text-align:center;margin-top:24px}button{border:0;border-radius:25px;background:#ff8100;color:white;font-weight:bold;padding:12px 22px;cursor:pointer;margin:0 5px}button:hover{background:#ed7300}.score{text-align:center;color:#0056c6;font:bold 21px Arial;margin:14px 0 0}@media(max-width:700px){.sheet{margin:8px;padding:15px}.options{grid-template-columns:repeat(2,minmax(0,1fr))}.question{font-size:17px}}</style></head><body><main class="sheet"><h2>Fill in the blanks.</h2><section class="item" data-answer="7"><div class="line"><b>a.</b><span>4.7 = 4 +</span><input class="answer" data-id="q0" aria-label="Answer 1" autocomplete="off"><span>tenths.</span></div></section><section class="item" data-answer="5"><div class="line"><b>b.</b><span>6.35 = 6 ones + 3 tenths +</span><input class="answer" data-id="q1" aria-label="Answer 2" autocomplete="off"><span>hundredths.</span></div></section><section class="item" data-answer="0.85"><div class="line"><b>c.</b><span>The decimal number for 8 tenths and 5 hundredths is</span><input class="answer" data-id="q2" aria-label="Answer 3" autocomplete="off"><span>.</span></div></section><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div class="score" id="score">Score: 0 / 3</div></main><script>const key='math4_'+location.pathname.split('/').pop();const stored=JSON.parse(localStorage.getItem(key)||'{}');function save(){const obj={};document.querySelectorAll('[data-id]').forEach(el=>{obj[el.dataset.id]=el.type==='radio'?(el.checked?el.value:undefined):el.value});const vals={};document.querySelectorAll('input[type=radio]:checked').forEach(el=>vals[el.name]=el.value);document.querySelectorAll('input:not([type=radio])').forEach(el=>vals[el.dataset.id]=el.value);localStorage.setItem(key,JSON.stringify(vals))}document.querySelectorAll('input').forEach(el=>{if(el.type==='radio')el.checked=stored[el.name]===el.value;else el.value=stored[el.dataset.id]||'';el.addEventListener('change',save);el.addEventListener('input',save)});function check(){let count=0;document.querySelectorAll('.item').forEach(card=>{const inputs=[...card.querySelectorAll('input')];inputs.forEach(i=>i.classList.remove('good','bad'));if(inputs[0]?.type==='radio'){const sel=inputs.find(i=>i.checked);if(sel){let ok=sel.value===card.dataset.answer;sel.classList.add(ok?'good':'bad');sel.closest('.opt').classList.add(ok?'good':'bad');count+=+ok}}else{const inp=inputs[0];if(inp&&inp.value.trim()){let ok=inp.value.trim().toLowerCase().replace(/\s+/g,'')===card.dataset.answer.toLowerCase().replace(/\s+/g,'');inp.classList.add(ok?'good':'bad');count+=+ok}}});document.getElementById('score').textContent='Score: '+count+' / '+document.querySelectorAll('.item').length;save()}function resetAll(){document.querySelectorAll('input').forEach(el=>{if(el.type==='radio')el.checked=false;else el.value='';el.classList.remove('good','bad')});document.querySelectorAll('.opt').forEach(el=>el.classList.remove('good','bad'));document.getElementById('score').textContent='Score: 0 / '+document.querySelectorAll('.item').length;localStorage.removeItem(key)}</script></body></html>
