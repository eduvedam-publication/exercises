<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 Chapter 6 Exercise 6(f)</title><style>*{box-sizing:border-box}body{margin:0;background:#defaff;font-family:Georgia,'Times New Roman',serif;color:#171717}.exercise{max-width:1040px;margin:22px auto;background:white;border:3px solid #00ace1;border-radius:25px;padding:26px}h2{font-size:25px;color:#00a9e4;margin:0 0 22px}.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 15px}.question{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:19px}.answer{width:92px;height:38px;border:2px solid #ff5260;border-radius:3px;font:18px Arial;text-align:center;background:#fff;outline:none}.answer.correct{background:#dcf8df;border-color:#17a05b}.answer.incorrect{background:#ffe3e3;border-color:#e11d48;animation:blink .4s 3}@keyframes blink{50%{background:#ff9a9a}}.actions{display:flex;justify-content:center;gap:14px;margin-top:35px}button{background:#ff8300;border:0;border-radius:25px;padding:12px 20px;color:#fff;font-weight:bold;cursor:pointer}#score{text-align:center;font:700 22px Arial;color:#004db6;margin-top:16px}@media(max-width:750px){.exercise{margin:8px;padding:17px}.questions{grid-template-columns:repeat(2,minmax(0,1fr))}h2{font-size:21px}}@media(max-width:440px){.questions{grid-template-columns:1fr}}</style></head><body><main class="exercise"><h2>Are the following divisible by 2 and 10?</h2><section class="questions" id="questions"></section><div class="actions"><button type="button" onclick="checkAnswers()">Check Answers</button><button type="button" onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 5</div></main><script>const items=[['a.','46475','NO'],['b.','286380','YES'],['c.','76470','YES'],['d.','42234','NO'],['e.','12838','NO']];const key='math-4-ch6-6f-divisibility-v1';const container=document.getElementById('questions');items.forEach(([letter,num],i)=>{let div=document.createElement('div');div.className='question';div.innerHTML=`<span>${letter}</span><span>${num}</span><input class="answer" id="a${i}" aria-label="Answer for ${num}, YES or NO" autocomplete="off" spellcheck="false" maxlength="3" placeholder="">`;container.appendChild(div)});function save(){try{localStorage.setItem(key,JSON.stringify(items.map((_,i)=>document.getElementById('a'+i).value)))}catch(e){}}function restore(){try{let data=JSON.parse(localStorage.getItem(key)||'[]');data.forEach((v,i)=>{let el=document.getElementById('a'+i);if(el)el.value=v})}catch(e){}}document.querySelectorAll('.answer').forEach(el=>el.addEventListener('input',()=>{el.classList.remove('correct','incorrect');save()}));function checkAnswers(){let score=0;items.forEach((item,i)=>{let el=document.getElementById('a'+i);let ok=el.value.trim().toUpperCase()===item[2];el.classList.remove('correct','incorrect');void el.offsetWidth;el.classList.add(ok?'correct':'incorrect');if(ok)score++});document.getElementById('score').textContent=`Score: ${score} / 5`;save()}function resetExercise(){document.querySelectorAll('.answer').forEach(el=>{el.value='';el.classList.remove('correct','incorrect')});document.getElementById('score').textContent='Score: 0 / 5';save()}restore();</script></body></html>
