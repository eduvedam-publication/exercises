<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose the correct option. — Class 5 Chapter 15</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;background:#b9fbff;color:#172735;font-family:Georgia,'Times New Roman',serif}.sheet{width:min(1050px,100%);padding:18px 22px;background:white;border:3px solid #00a9f4;border-radius:20px}h1{font:700 clamp(22px,3vw,31px) Arial,sans-serif;color:#009ff0;margin:0 0 12px}.bar{height:14px;border-radius:30px;background:#bff5fb;margin-bottom:10px}.row{background:#d9f8ff;border:1.5px solid #00a9ff;border-radius:11px;padding:9px 12px;margin:7px 0;font-size:clamp(17px,1.7vw,20px);width:100%;line-height:1.65}.row label{display:block}.row input,.row select{border:1.5px solid #009ff0;border-radius:7px;background:white;padding:6px 9px;font:inherit;width:clamp(75px,14vw,145px);max-width:80%;height:40px;vertical-align:middle;margin:2px 4px}.row select{width:auto;max-width:100%}.row input.correct,.choice.correct,.row select.correct{background:#e4ffed;border-color:#20a953}.row input.wrong,.choice.wrong,.row select.wrong{background:#fff0f0;border-color:#e62c38}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{background:#fff;border:1.5px solid #00a9ff;border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer;min-height:40px}.choice.selected{background:#9deaf7;border-color:#008ed0}.feedback{font:700 13px Arial,sans-serif;margin-left:8px}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px}.actions button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:10px 18px;font-weight:700;cursor:pointer}#score{text-align:center;color:#003bea;font:700 20px Arial,sans-serif;margin:9px 0 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #005ac0;outline-offset:2px}@media(max-width:620px){.sheet{padding:13px 10px}.row{padding:8px}.choice{padding:6px}}.instruction{font:16px/1.5 Arial,sans-serif;color:#34516a}.row input{width:170px}.row:first-of-type input{max-width:100%}</style></head><body><main class="sheet"><h1>Choose the correct option.</h1><div class="bar" aria-hidden="true"></div><section class="row"><div>a. Each side of a square measures 7.5 cm. Its perimeter is _____.</div><div class="choices" role="group" aria-label="Question a choices"><button type="button" class="choice" data-q="0" data-opt="0" aria-pressed="false">(i) 30 cm</button><button type="button" class="choice" data-q="0" data-opt="1" aria-pressed="false">(ii) 75 cm</button><button type="button" class="choice" data-q="0" data-opt="2" aria-pressed="false">(iii) 32 cm²</button><button type="button" class="choice" data-q="0" data-opt="3" aria-pressed="false">(iv) 15 cm</button></div><span class="feedback" id="f0" aria-live="polite"></span></section><section class="row"><div>b. The measure of amount of space occupied by solids is called _____.</div><div class="choices" role="group" aria-label="Question b choices"><button type="button" class="choice" data-q="1" data-opt="0" aria-pressed="false">(i) Area</button><button type="button" class="choice" data-q="1" data-opt="1" aria-pressed="false">(ii) Volume</button><button type="button" class="choice" data-q="1" data-opt="2" aria-pressed="false">(iii) Perimeter</button><button type="button" class="choice" data-q="1" data-opt="3" aria-pressed="false">(iv) None</button></div><span class="feedback" id="f1" aria-live="polite"></span></section><section class="row"><div>c. Side of a square = _____ × (Perimeter of square).</div><div class="choices" role="group" aria-label="Question c choices"><button type="button" class="choice" data-q="2" data-opt="0" aria-pressed="false">(i) 1/2</button><button type="button" class="choice" data-q="2" data-opt="1" aria-pressed="false">(ii) 1/4</button><button type="button" class="choice" data-q="2" data-opt="2" aria-pressed="false">(iii) 1/6</button><button type="button" class="choice" data-q="2" data-opt="3" aria-pressed="false">(iv) 1/8</button></div><span class="feedback" id="f2" aria-live="polite"></span></section><section class="row"><div>d. The volume of a cube whose each edge measures 11 cm is _____.</div><div class="choices" role="group" aria-label="Question d choices"><button type="button" class="choice" data-q="3" data-opt="0" aria-pressed="false">(i) 1331 cm³</button><button type="button" class="choice" data-q="3" data-opt="1" aria-pressed="false">(ii) 1133 cm³</button><button type="button" class="choice" data-q="3" data-opt="2" aria-pressed="false">(iii) 1330 cm³</button><button type="button" class="choice" data-q="3" data-opt="3" aria-pressed="false">(iv) 3113 cm³</button></div><span class="feedback" id="f3" aria-live="polite"></span></section><div class="actions"><button id="submit" type="button">Submit</button><button id="show" type="button">Show Answer</button><button id="reset" type="button">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 4</p></main><script>const answers=[0, 1, 1, 0],key='exercise:math-5-ch15-assessment-mcq.html',selected=Array(answers.length).fill(null),buttons=[...document.querySelectorAll('.choice')],score=document.getElementById('score');function paint(){buttons.forEach(b=>{let on=selected[+b.dataset.q]===+b.dataset.opt;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on?'true':'false')})}function save(){try{localStorage.setItem(key,JSON.stringify(selected))}catch(e){}}function clear(){buttons.forEach(b=>b.classList.remove('correct','wrong'));answers.forEach((_,i)=>{let f=document.getElementById('f'+i);f.textContent='';f.className='feedback'});score.textContent='Marks: 0 / '+answers.length}try{let old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old)&&old.length===answers.length)old.forEach((v,i)=>{if(v===null||Number.isInteger(v))selected[i]=v})}catch(e){}paint();buttons.forEach(b=>b.onclick=()=>{selected[+b.dataset.q]=+b.dataset.opt;paint();clear();save()});document.getElementById('submit').onclick=()=>{let marks=0;answers.forEach((a,i)=>{let good=selected[i]===a;marks+=good;let f=document.getElementById('f'+i);f.textContent=good?'✓ Correct':'✗ Wrong';f.className='feedback '+(good?'ok':'no');let b=buttons.find(x=>+x.dataset.q===i&&+x.dataset.opt===selected[i]);if(b)b.classList.add(good?'correct':'wrong')});score.textContent=`Marks: ${marks} / ${answers.length}`;save();let detail={exerciseType:'MCQ',exerciseId:'math-5-ch15-assessment-mcq.html',response:Object.fromEntries(selected.map((v,i)=>['question'+(i+1),v===null?'':String(v)])),marks,total:answers.length};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')};document.getElementById('show').onclick=()=>{answers.forEach((v,i)=>selected[i]=v);paint();clear();save()};document.getElementById('reset').onclick=()=>{selected.fill(null);paint();clear();save()};</script></body></html>
