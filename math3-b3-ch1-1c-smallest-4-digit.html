<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{margin:0 0 24px;color:#00a5dc;font-size:25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:28px}.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:700px){body{padding:0}.ex{padding:15px;border-radius:0}}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 38px}.row{display:grid;grid-template-columns:28px minmax(210px,auto) minmax(180px,1fr);align-items:center;gap:8px;font:19px Georgia,serif}.row input{height:42px;border:2px solid #ff3b30;font-size:17px;padding:6px 8px;width:100%}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:25px 1fr}.row input{grid-column:2}}</style></head><body><main class="ex"><h1>Write the smallest 4-digit number formed by using the digits.</h1><div class="grid"><div class="row"><span>a.</span><span>5, 8, 4, 0</span><input id="a0" autocomplete="off"></div><div class="row"><span>b.</span><span>9, 6, 8, 3</span><input id="a1" autocomplete="off"></div><div class="row"><span>c.</span><span>1, 6, 5, 2</span><input id="a2" autocomplete="off"></div><div class="row"><span>d.</span><span>3, 5, 4, 7</span><input id="a3" autocomplete="off"></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div></main><script>const ans=['4058', '3689', '1256', '3457'];const norm=s=>s.trim().replace(/\s+/g," ").replace(/\s*,\s*/g,",");function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=norm(e.value)===norm(a);e.className=ok?"ok":"bad";if(ok)s++});score.textContent=`Score: ${s} / ${ans.length}`}function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.className=""});score.textContent="Score: 0 / "+ans.length}</script></body></html>
