<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tick (✓) the correct option.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);padding:18px;color:#333}
.quiz{width:min(100%,1000px);margin:auto;background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:26px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
h1{font-size:27px;color:#00a6d6;margin-bottom:20px}
.card{background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:17px 20px;margin-bottom:14px}
.q{font-size:20px;font-weight:600;line-height:1.5;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.opt{background:#fff;border:2px solid #ff4fa0;border-radius:16px;padding:11px 16px;text-align:left;font-size:16px;cursor:pointer}
.opt.correct{background:#d4f8d4;border-color:#2e7d32;color:#1b5e20;font-weight:700}.opt.wrong{background:#ffd9dd;border-color:#c62828;color:#b71c1c;font-weight:700}
.score{text-align:center;margin:18px 0;font-size:24px;font-weight:700;color:#0047ab}
.actions{text-align:center}.reset,.check{border:0;border-radius:30px;padding:12px 28px;margin:5px;background:linear-gradient(135deg,#ff9800,#ff6f00);color:#fff;font-weight:700;cursor:pointer}
@media(max-width:650px){body{padding:8px}.quiz{padding:15px 11px}h1{font-size:21px}.q{font-size:16px}.opts{grid-template-columns:1fr}.opt{font-size:15px}.reset,.check{width:100%;margin:5px 0}}
.line{font-size:19px;font-weight:600;line-height:1.8}.choice{display:inline-block;border:2px solid #ff4fa0;border-radius:50px;padding:5px 12px;margin:2px 4px;cursor:pointer;background:#fff}.choice.correct{background:#d4f8d4;border-color:#2e7d32;color:#1b5e20}.choice.wrong{background:#ffd9dd;border-color:#c62828;color:#b71c1c}.disabled{pointer-events:none}</style></head><body><div class="quiz"><h1>Tick (✓) the correct option.</h1><div id="tick"></div><div class="score" id="score">Score: 0 / 5</div><div class="actions"><button class="reset" onclick="load()">Reset Quiz</button></div></div><script>const qs=[('1. Mohan lived in a ', 'bungalow', 'multi-storeyed building', '.', 'multi-storeyed building'), ('2. Mohan tried to put out the fire with ', 'water', 'sand', '.', 'water'), ('3. Mohan was ', 'courageous', 'coward', '.', 'courageous'), ('4. When you face any adverse situation you should ', 'face it bravely', 'get panic', '.', 'face it bravely'), ('5. Mohan took his little sister to a ', 'safe place', 'alone in the house', '.', 'safe place')];let score=0;function load(){score=0;document.getElementById('score').textContent='Score: 0 / 5';let r=document.getElementById('tick');r.innerHTML='';qs.forEach(x=>{let c=document.createElement('div');c.className='card line';c.append(document.createTextNode(x[0]));let a=document.createElement('span');a.className='choice';a.textContent=x[1];let slash=document.createTextNode(' / ');let b=document.createElement('span');b.className='choice';b.textContent=x[2];c.append(a,slash,b,document.createTextNode(x[3]));[a,b].forEach(z=>z.onclick=()=>{if(a.classList.contains('disabled'))return;a.classList.add('disabled');b.classList.add('disabled');let val=z.textContent;if(a.textContent===x[4])a.classList.add('correct');if(b.textContent===x[4])b.classList.add('correct');if(val===x[4])score++;else z.classList.add('wrong');document.getElementById('score').textContent='Score: '+score+' / 5'});r.append(c)})}load();</script></body></html>
