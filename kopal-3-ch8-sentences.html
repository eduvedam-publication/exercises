<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kopal 2 Chapter 8 – वाक्य प्रयोग</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:440px;display:flex;flex-direction:column}h2{font-size:23px;color:#ff0066;margin:0 0 17px}.q{background:#effaff;border:1.5px solid #00c4ed;border-radius:12px;padding:13px 15px;margin:7px 0;font-size:19px;line-height:2}.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#e2f8ff;padding:12px;border-radius:10px;margin-bottom:14px}.chip{border:1.5px solid #00a9dc;border-radius:7px;background:#fff;padding:6px 12px;font-size:18px;cursor:grab;font-family:inherit}.chip.sel{background:#c8eaff}.chip.used{opacity:.4}.blank{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:125px;min-height:35px;border:2px dashed #ff5b52;border-radius:6px;padding:2px 7px;cursor:pointer;background:#fff}.blank.ok{background:#d9f8dc;border-color:#24ad54}.blank.bad{background:#ffe2e2;border-color:#f33;animation:blink .5s 3}@keyframes blink{50%{background:#ff8080}}.actions{display:flex;justify-content:center;gap:12px;margin-top:auto;padding-top:24px}button.action{background:#ff8700;color:white;border:0;border-radius:18px;padding:9px 21px;font-weight:bold;cursor:pointer}#result{text-align:center;color:#0755af;font-weight:bold;margin-top:12px}.textanswer{display:block;width:100%;min-height:74px;border:1.5px solid #ff6b59;border-radius:8px;padding:10px;font:18px Arial,"Noto Sans Devanagari",sans-serif;resize:vertical;background:white}.hint{color:#777;font-size:14px;margin-top:8px}@media(max-width:650px){.wrap{margin:4px;padding:14px;min-height:calc(100vh - 8px)}h2{font-size:21px}.q{font-size:17px}.blank{min-width:100px}}</style></head><body><main class="wrap"><h2>शब्दों का अपने वाक्यों में प्रयोग कीजिए–</h2><div class="q">(क) मुनि<textarea class="textanswer" data-i="0" placeholder="अपना वाक्य लिखिए..."></textarea></div><div class="q">(ख) प्रसन्न<textarea class="textanswer" data-i="1" placeholder="अपना वाक्य लिखिए..."></textarea></div><div class="q">(ग) शोक<textarea class="textanswer" data-i="2" placeholder="अपना वाक्य लिखिए..."></textarea></div><div class="q">(घ) स्पर्श<textarea class="textanswer" data-i="3" placeholder="अपना वाक्य लिखिए..."></textarea></div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="reset()">Reset</button></div><div id="result"></div></main><script>const key='kopal-2-ch8-sentences-v1',fields=[...document.querySelectorAll('textarea')];function save(){localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}fields.forEach(f=>f.addEventListener('input',save));function submit(){save();document.getElementById('result').textContent='उत्तर सुरक्षित हैं।'}function reset(){fields.forEach(f=>f.value='');localStorage.removeItem(key);document.getElementById('result').textContent=''}try{JSON.parse(localStorage.getItem(key)||'[]').forEach((v,i)=>{if(fields[i])fields[i].value=v})}catch(e){}</script></body></html>
