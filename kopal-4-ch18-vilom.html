<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>विलोम शब्द लिखिए—</title><style>*{box-sizing:border-box}body{margin:0;background:#ccfaff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#183039}.wrap{max-width:1050px;margin:16px auto;padding:24px;background:white;border:3px solid #00aeeb;border-radius:22px}h2{color:#00a8e7;margin:0 0 16px;font-size:25px}.q{background:#e9faff;border:1px solid #00aeeb;border-radius:12px;padding:12px;margin:9px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.opt{padding:10px;border:1px solid #9ddaf8;background:#fff;border-radius:8px;text-align:left;font:inherit;cursor:pointer}.opt.sel{background:#cbf7e7;border:2px solid #00a8e8}.bank{background:#e1faff;padding:12px;border-radius:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{font:inherit;padding:8px 14px;border:1px solid #00aeeb;background:white;border-radius:8px;cursor:grab}.chip.used{opacity:.45}.line{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.sentence{flex:1;min-width:200px}.drop{min-width:135px;min-height:42px;border:2px dashed #ff805d;background:white;border-radius:8px;padding:8px;cursor:pointer;font:inherit;color:#222}.drop.ok,.opt.ok{background:#c9f6d7}.drop.bad,.opt.bad{background:#ffdddd}.controls{text-align:center;margin-top:24px}.controls button{border:0;border-radius:24px;padding:12px 20px;background:#ff8000;color:white;font-weight:bold;margin:4px;cursor:pointer}#marks{color:#0045c0;font-size:20px;font-weight:bold;text-align:center;margin:12px} @media(max-width:650px){.wrap{margin:5px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}</style></head><body><main class="wrap"><h2>विलोम शब्द लिखिए—</h2><section id="area"></section><div class="controls"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div id="marks">Marks: 0 / 6</div></main><script>const DATA={"rows": ["जीवन", "खुशी", "अंदर", "रुचि", "अधीर", "गुरु"], "answers": ["मृत्यु", "दुःख", "बाहर", "अरुचि", "धीर", "शिष्य"], "kind": "drag", "bank": ["मृत्यु", "दुःख", "बाहर", "अरुचि", "धीर", "शिष्य"]};let vals=Array(DATA.answers.length).fill('');const KEY='kopal18:'+location.pathname.split('/').pop();try{let x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length===vals.length)vals=x}catch(e){}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(vals))}function set(i,v){if(DATA.kind==='drag'){let prev=vals.indexOf(v);if(prev>=0&&prev!==i)vals[prev]=''}vals[i]=v;save();render()}function render(){let a=document.getElementById('area');a.innerHTML='';if(DATA.kind==='drag'){let b=document.createElement('div');b.className='bank';DATA.bank.forEach(word=>{let c=document.createElement('button');c.className='chip'+(vals.includes(word)?' used':'');c.textContent=word;c.draggable=true;c.onclick=()=>{let idx=vals.findIndex(v=>!v);if(idx>=0)set(idx,word)};c.ondragstart=e=>e.dataTransfer.setData('text/plain',word);b.append(c)});a.append(b)}DATA.rows.forEach((r,i)=>{let q=document.createElement('div');q.className='q';if(DATA.kind==='mcq'){let t=document.createElement('div');t.textContent='('+['क','ख','ग','घ','ङ','च'][i]+') '+r[0];q.append(t);let opts=document.createElement('div');opts.className='opts';r[1].forEach((s,j)=>{let el=document.createElement('button');el.className='opt'+(vals[i]===String(j)?' sel':'');el.textContent=['(i) ','(ii) ','(iii) '][j]+s;el.onclick=()=>set(i,String(j));opts.append(el)});q.append(opts)}else{let line=document.createElement('div');line.className='line';let t=document.createElement('span');t.className='sentence';t.textContent='('+['क','ख','ग','घ','ङ','च'][i]+') '+r;line.append(t);let d=document.createElement('button');d.className='drop';d.textContent=vals[i]||'________';d.onclick=()=>{if(vals[i])set(i,'')};d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();let v=e.dataTransfer.getData('text/plain');if(DATA.bank.includes(v))set(i,v)};line.append(d);q.append(line)}a.append(q)})}function grade(show){if(show){vals=DATA.answers.slice();save();render()}let n=0;document.querySelectorAll('.q').forEach((q,i)=>{let ok=vals[i]===DATA.answers[i];if(ok)n++;let el=DATA.kind==='mcq'?q.querySelector('.opt.sel'):q.querySelector('.drop');if(el)el.classList.add(ok?'ok':'bad')});document.getElementById('marks').textContent='Marks: '+n+' / '+vals.length}document.getElementById('submit').onclick=()=>grade(false);document.getElementById('show').onclick=()=>grade(true);document.getElementById('reset').onclick=()=>{vals.fill('');save();document.getElementById('marks').textContent='Marks: 0 / '+vals.length;render()};render();</script></body></html>
