<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-2-ch14-mcq.html</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#172a36}.exercise{max-width:900px;margin:14px auto;background:white;border:3px solid #05a9d5;border-radius:20px;padding:20px 25px;min-height:440px;display:flex;flex-direction:column}h2{color:#ff0062;font-size:23px;margin:0 0 16px;font-weight:600}.q{border:1.5px solid #00c8ee;background:#f1fbfd;border-radius:12px;padding:12px 15px;margin-bottom:10px;font-size:18px}.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.opt,.chip{border:1.5px solid #ff0062;border-radius:8px;background:#fff;padding:7px 12px;font-size:17px;cursor:pointer}.opt.sel,.chip.sel{background:#c7f5ef}.ok{background:#d2f5d7!important;border-color:#15a344!important}.bad{background:#ffdddd!important;border-color:red!important;animation:blink .45s 3}@keyframes blink{50%{background:#ff5555}}.actions{display:flex;justify-content:center;gap:8px;margin-top:auto;padding-top:20px}button{background:#fff;border:2px solid #ff0062;border-radius:9px;padding:8px 16px;cursor:pointer;font-size:15px}.score{text-align:center;color:#0072b9;font-weight:bold;margin-top:9px}.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:#e4faff;border-radius:10px;padding:12px;margin-bottom:16px}.blank{display:inline-flex;vertical-align:middle;min-width:120px;min-height:36px;align-items:center;justify-content:center;border:2px dashed #ff644b;border-radius:7px;padding:3px 9px;cursor:pointer;background:white}.blank:empty:after{content:'________';color:#aaa}.line{border:1px solid #00c8ee;background:#f3fcfe;border-radius:9px;padding:11px;margin:10px 0}.writing{width:42%;min-width:130px;border:0;border-bottom:1px solid #8e9ca4;font:18px inherit;padding:5px;outline:none;background:transparent}.saved{color:#168044;text-align:center;margin-top:8px}@media(max-width:650px){.exercise{margin:0;border-radius:0;padding:15px;min-height:100vh}.opts{gap:5px}.opt{font-size:15px}.q{font-size:16px}.writing{width:65%}}</style></head><body><main class="exercise"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ–</h2><div id="questions"></div><div class="actions"><button onclick="submit()">Submit</button><button onclick="resetAll()">Reset</button></div><div class="score" id="result">Score: 0 / 3</div></main><script>const questions=[["किसान के कितने बेटे थे?",["तीन","चार","पाँच"],0],["बड़े होने पर बेटों ने किसान से क्या कहा?",["तीर्थ पर जाएँ","आराम करें","बाग की रखवाली करें"],1],["गाँववाले किसान को क्या कहते थे?",["चाचा","बाबा","दादा"],2]];const key="kopal-2-ch14-mcq";let values=JSON.parse(localStorage.getItem(key)||"[null,null,null]");const root=document.getElementById("questions");function draw(){root.innerHTML="";questions.forEach((q,i)=>{const box=document.createElement("div");box.className="q";box.innerHTML=`<div>${["(क)","(ख)","(ग)"][i]} ${q[0]}</div>`;const opts=document.createElement("div");opts.className="opts";q[1].forEach((v,j)=>{const b=document.createElement("button");b.className="opt"+(values[i]===j?" sel":"");b.textContent=["(i)","(ii)","(iii)"][j]+" "+v;b.onclick=()=>{values[i]=j;localStorage.setItem(key,JSON.stringify(values));draw()};opts.appendChild(b)});box.appendChild(opts);root.appendChild(box)})}function submit(){let s=0;root.querySelectorAll(".q").forEach((q,i)=>{const a=values[i],right=questions[i][2];if(a===right)s++;if(a!==null)q.querySelectorAll(".opt")[a].classList.add(a===right?"ok":"bad")});document.getElementById("result").textContent=`Score: ${s} / 3`}function resetAll(){values=[null,null,null];localStorage.removeItem(key);draw();document.getElementById("result").textContent="Score: 0 / 3"}draw();</script></body></html>
