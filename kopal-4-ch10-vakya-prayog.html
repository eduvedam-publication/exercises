<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOPAL Hindi 4 Chapter 10 Sentence Usage</title><style>
*{box-sizing:border-box}body{margin:0;background:#e4f8ff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#263b44}.wrap{max-width:1000px;margin:22px auto;background:#fff;border:3px solid #00bde8;border-radius:18px;padding:24px}h2{margin:0 0 8px;color:#ff3988;font-size:25px}.meta{color:#527783;margin:0 0 18px}.q{background:#effbff;border:1px solid #8cdef4;border-radius:12px;padding:15px;margin:12px 0;font-size:18px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid #ff8bb7;border-radius:8px;padding:10px;cursor:pointer}.opt.sel{background:#ffe5ef;border-color:#ff3988}.correct{background:#dcf8e5!important;border-color:#20a653!important}.wrong{background:#ffe0e0!important;border-color:#e43d3d!important}.q select{font:inherit;width:100%;margin-top:12px;padding:10px;border:1.5px solid #00bde8;border-radius:8px;background:#fff}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button{border:0;border-radius:24px;padding:11px 21px;background:#ff3988;color:white;font-weight:bold;cursor:pointer;font-size:15px}#score{text-align:center;color:#087fa7;font-weight:bold;font-size:19px;margin-top:15px}@media(max-width:650px){.wrap{margin:8px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}
</style></head><body><main class="wrap"><h2>नीचे दिए गए शब्दों का वाक्य में प्रयोग करिए–</h2><p class="meta">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 4</p><section id="questions"></section><script>
const data=[["कर्तव्य पथ", ["अपने कर्तव्य पथ पर चलते हुए तुम्हें कभी रुकना नहीं चाहिए।", "बिजली का आविष्कार ही वास्तव में अन्य आविष्कारों के लिए वरदान है।", "पिता की गोद छोड़ जाने की कल्पना मात्र से ही मेरा हृदय विह्वल हो गया।", "मैं कल-कल निनाद करती हुई पिता की गोद छोड़कर धीमी गति से निकल पड़ी।"], 0], ["विह्वल", ["मैं कल-कल निनाद करती हुई पिता की गोद छोड़कर धीमी गति से निकल पड़ी।", "पिता की गोद छोड़ जाने की कल्पना मात्र से ही मेरा हृदय विह्वल हो गया।", "अपने कर्तव्य पथ पर चलते हुए तुम्हें कभी रुकना नहीं चाहिए।", "बिजली का आविष्कार ही वास्तव में अन्य आविष्कारों के लिए वरदान है।"], 1], ["निनाद", ["पिता की गोद छोड़कर जाने की कल्पना मात्र से ही मेरा हृदय विह्वल हो गया।", "अपने कर्तव्य पथ पर चलते हुए तुम्हें कभी रुकना नहीं चाहिए।", "मैं कल-कल निनाद करती हुई पिता की गोद छोड़कर धीमी गति से निकल पड़ी।", "बिजली का आविष्कार ही वास्तव में अन्य आविष्कारों के लिए वरदान है।"], 2], ["आविष्कार", ["अपने कर्तव्य पथ पर चलते हुए तुम्हें कभी रुकना नहीं चाहिए।", "बिजली का आविष्कार ही वास्तव में अन्य आविष्कारों के लिए वरदान है।", "पिता की गोद छोड़ जाने की कल्पना मात्र से ही मेरा हृदय विह्वल हो गया।", "मैं कल-कल निनाद करती हुई पिता की गोद छोड़कर धीमी गति से निकल पड़ी।"], 1]];let answers={};const root=document.getElementById('questions');
function render(){root.innerHTML=data.map((q,i)=>`<div class="q" id="q${i}"><b>(${'कखगघ'[i]}) ${q[0]}</b><select id="s${i}" onchange="answers[${i}]=this.value"><option value="">— सही वाक्य चुनें —</option>${q[1].map((o,j)=>`<option value="${j}" ${String(answers[i])===String(j)?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}
function check(){let s=0;data.forEach((q,i)=>{let e=document.getElementById('s'+i);e.classList.remove('correct','wrong');if(answers[i]!==undefined&&answers[i]!==''){let ok=Number(answers[i])===q[2];e.classList.add(ok?'correct':'wrong');if(ok)s++}});document.getElementById('score').textContent=`प्राप्तांक: ${s} / 4`}
function showAnswers(){answers={};data.forEach((q,i)=>answers[i]=String(q[2]));render();check()}
function resetAll(){answers={};render();document.getElementById('score').textContent='प्राप्तांक: 0 / 4'}render();
</script><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 4</div></main></body></html>
