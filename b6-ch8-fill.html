"], ["crown"], ["branches"], ["trunk"], ["sad"], ["stump"]];function check(){let n=0,t=0;A.forEach((r,i)=>r.forEach((a,j)=>{t++;let e=document.getElementById(`f${i}_${j}`),k=e.value.trim().toLowerCase()===a.toLowerCase();e.className=k?'ok':'bad';if(k)n++}));result.textContent=`Score: ${n} / ${t}`;}</script></body></html>
