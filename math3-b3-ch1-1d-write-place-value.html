<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif}.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{margin:0 0 25px;color:#00a5dc;font-size:25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 42px}.q{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font:20px Georgia,serif}.q input{height:40px;border:2px solid #ff3b30;font-size:18px;padding:5px 8px;min-width:145px;flex:1}.hl{background:#f5a9c5;padding:0 2px}.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:white;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:700px){body{padding:0}.ex{padding:15px;border-radius:0}.grid{grid-template-columns:1fr}}</style></head><body><main class="ex"><h1>Write the place value of the highlighted digit of the following numbers.</h1><div class="grid"><div class="q"><span>a.</span><span>56<span class="hl">8</span>4</span><input id="a0" autocomplete="off"></div><div class="q"><span>b.</span><span><span class="hl">4</span>93</span><input id="a1" autocomplete="off"></div><div class="q"><span>c.</span><span>98<span class="hl">6</span>4</span><input id="a2" autocomplete="off"></div><div class="q"><span>d.</span><span><span class="hl">2</span>845</span><input id="a3" autocomplete="off"></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 4</div></main><script>const ans=['80', '400', '60', '2000'];const norm=s=>s.trim().replace(/\s+/g,"").toLowerCase();function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=norm(e.value)===norm(a);e.className=ok?"ok":"bad";if(ok)s++});score.textContent=`Score: ${s} / ${ans.length}`}function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.className=""});score.textContent="Score: 0 / "+ans.length}</script></body></html>
