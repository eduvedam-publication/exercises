<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gyandhara 2 Chapter 13 - Write</title><style>*{box-sizing:border-box}body{margin:0;background:#dcfaff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#152c3a}.wrap{max-width:900px;margin:16px auto;background:white;border:3px solid #06a9d7;border-radius:22px;padding:22px 26px;min-height:340px}h2{font-size:23px;color:#00a8e0;margin:0 0 20px}.q{background:#effbff;border:1.5px solid #00c9ef;border-radius:13px;padding:13px 16px;margin:12px 0;font-size:20px;line-height:2.1}.blank{min-width:125px;width:150px;display:inline-block;vertical-align:middle;border:2px dashed #ff654b;border-radius:7px;padding:4px 7px;min-height:38px;background:white;text-align:center;color:#123}.blank:empty:before{content:'________';color:#9daab0}.wordbank{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;background:#e2f8ff;padding:12px;border-radius:12px;margin:10px 0 18px}.word{font-size:19px;border:1.5px solid #00a9e7;border-radius:8px;padding:6px 14px;background:white;cursor:grab}.word.selected{background:#b6f1db}.actions{display:flex;gap:12px;justify-content:center;margin-top:26px}button.action{background:#ff8700;color:white;border:0;border-radius:20px;padding:10px 18px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0652bb;font-size:19px;font-weight:bold;margin:12px}.line{width:100%;font:19px 'Noto Sans Devanagari',Arial,sans-serif;padding:8px;border:1px solid #ff795e;border-radius:6px;min-height:42px}.note{color:#51646d;text-align:center;font-size:14px}@media(max-width:600px){.wrap{margin:5px;padding:15px;border-radius:15px}.q{font-size:17px}h2{font-size:20px}.blank{width:125px}}</style></head><body><main class="wrap"><h2>सोचिए और लिखिए–</h2><div class="q">(क) गर्मियों का कोई एक महीना लिखिए।<input class="line" id="a0" aria-label="उत्तर 1" autocomplete="off"></div><div class="q">(ख) वर्ष का अंतिम महीना लिखिए।<input class="line" id="a1" aria-label="उत्तर 2" autocomplete="off"></div><div class="q">(ग) सर्दियों के किसी एक महीने का नाम लिखिए।<input class="line" id="a2" aria-label="उत्तर 3" autocomplete="off"></div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="resetAll()">Reset</button></div><p class="note" id="status"></p></main><script>function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}const key='gyandhara-2-ch13-write';let saved=load(key)||['','',''];document.querySelectorAll('.line').forEach((e,i)=>{e.value=saved[i]||'';e.addEventListener('input',()=>{save(key,Array.from(document.querySelectorAll('.line'),x=>x.value));document.getElementById('status').textContent='उत्तर अपने आप सुरक्षित हो रहे हैं।'})});function submit(){save(key,Array.from(document.querySelectorAll('.line'),x=>x.value));document.getElementById('status').textContent='उत्तर सुरक्षित कर दिए गए हैं।'}function resetAll(){document.querySelectorAll('.line').forEach(x=>x.value='');save(key,['','','']);document.getElementById('status').textContent='उत्तर साफ़ कर दिए गए हैं।'}</script></body></html>
