<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arrange in column and find the difference</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#222}
.exercise{max-width:1000px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 28px;color:#00a5dc;font-size:25px}
.questions{display:grid;grid-template-columns:repeat(3,1fr);gap:45px;padding:0 20px}
.q{display:flex;align-items:center;justify-content:center;gap:10px;font-family:Georgia,"Times New Roman",serif;font-size:21px;white-space:nowrap}
.answer{width:110px;height:40px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:4px 6px;outline:none}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:32px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:650px){.questions{grid-template-columns:1fr;gap:18px}.exercise{margin:0;border-radius:0;padding:16px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Arrange the following in column and find the difference.</h1>
<div class="questions">
 <div class="q"><span>a.</span><span>30 − 5</span><input id="a0" class="answer" inputmode="numeric"></div>
 <div class="q"><span>b.</span><span>62 − 9</span><input id="a1" class="answer" inputmode="numeric"></div>
 <div class="q"><span>c.</span><span>23 − 2</span><input id="a2" class="answer" inputmode="numeric"></div>
</div>
<div class="actions">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetExercise()">Reset</button>
</div>
<div id="result">Score: 0 / 3</div>
</main>
<script>
const answers=["25","53","21"];
function checkAnswers(){
 let score=0;
 answers.forEach((v,i)=>{
  const e=document.getElementById("a"+i);
  const ok=e.value.trim()===v;
  e.className="answer "+(ok?"ok":"bad");
  if(ok) score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 3`;
}
function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{e.value="";e.className="answer"});
 document.getElementById("result").textContent="Score: 0 / 3";
}
</script>
</body>
</html>
