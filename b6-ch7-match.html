<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match the following.</title><style>*{box-sizing:border-box}body{margin:0;background:#dff6ff;font-family:Arial,sans-serif;color:#171717}.w{max-width:1000px;margin:auto;min-height:100vh;background:#fff;border:5px solid #08a9dc;border-radius:24px;padding:24px}h1{font-size:25px;color:#ff0072;margin:0 0 18px}.q{background:#f6fbfe;border:2px solid #a8eaff;border-radius:17px;padding:13px 16px;margin:10px 0;font-size:17px;font-weight:600;line-height:1.55}.o{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}.opt,button{border:2px solid #ff2581;background:#fff;border-radius:11px;padding:8px 12px;font-size:16px;cursor:pointer}.sel{background:#ffe4f0!important}.ok{background:#dcf8df!important;border-color:#23a443!important}.bad{background:#ffe0e0!important;border-color:#d33!important}.actions{display:flex;justify-content:center;gap:10px;margin-top:18px}#result{text-align:center;font-weight:bold;margin-top:12px}input{border:2px solid #ff5a3d;border-radius:6px;padding:7px 9px;font-size:16px;min-width:140px}@media(max-width:650px){.w{border-width:3px;border-radius:0;padding:14px}h1{font-size:21px}input{min-width:115px}}</style></head><body><main class="w"><h1>Match the following.</h1><div id="matchbox" style="position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px 60px;padding:10px"><svg id="lines" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg><button class="opt L" id="L0" onclick="leftPick(0)">1. King</button><button class="opt R" id="R0" onclick="rightPick(0)">i. Felt betrayed</button><button class="opt L" id="L1" onclick="leftPick(1)">2. People</button><button class="opt R" id="R1" onclick="rightPick(1)">ii. Stopped the reward</button><button class="opt L" id="L2" onclick="leftPick(2)">3. Queen</button><button class="opt R" id="R2" onclick="rightPick(2)">iii. Wanted to extend the kingdom</button><button class="opt L" id="L3" onclick="leftPick(3)">4. Battle</button><button class="opt R" id="R3" onclick="rightPick(3)">iv. Money or land</button><button class="opt L" id="L4" onclick="leftPick(4)">5. Reward</button><button class="opt R" id="R4" onclick="rightPick(4)">v. Was fought and won</button></div><div class="actions"><button onclick="check()">Submit</button><button onclick="location.reload()">Reset</button></div><div id="result"></div></main><script>const A=[2, 0, 1, 4, 3],M={};let cur=null;function leftPick(i){cur=i;document.querySelectorAll('.L').forEach(x=>x.classList.remove('sel'));document.getElementById('L'+i).classList.add('sel')}function rightPick(j){if(cur===null)return;Object.keys(M).forEach(k=>{if(M[k]===j)delete M[k]});M[cur]=j;cur=null;document.querySelectorAll('.L').forEach(x=>x.classList.remove('sel'));draw()}function draw(){let s=document.getElementById('lines'),box=document.getElementById('matchbox').getBoundingClientRect();s.innerHTML='';Object.entries(M).forEach(([i,j])=>{let a=document.getElementById('L'+i).getBoundingClientRect(),b=document.getElementById('R'+j).getBoundingClientRect();s.innerHTML+=`<line x1="${a.right-box.left}" y1="${a.top+a.height/2-box.top}" x2="${b.left-box.left}" y2="${b.top+b.height/2-box.top}" stroke="#ff3b30" stroke-width="2"/>`;})}window.onresize=draw;function check(){let n=0;A.forEach((a,i)=>{if(M[i]===a)n++});result.textContent=`Score: ${n} / ${A.length}`;}</script></body></html>
