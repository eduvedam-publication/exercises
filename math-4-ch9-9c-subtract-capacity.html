<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Subtract the following: - Math 4</title><style>*{box-sizing:border-box}body{margin:0;background:#d9faff;font-family:Georgia,"Times New Roman",serif;color:#142838}.sheet{width:min(960px,96vw);margin:12px auto;padding:22px 26px 18px;background:#fff;border:3px solid #00a9d7;border-radius:22px;min-height:min(540px,94vh);display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}h1{font-size:clamp(21px,2.6vw,28px);color:#00a9da;margin:0 0 22px}.tag{background:#00b5e8;color:#fff;border-radius:6px;padding:6px 15px;font:13px Arial,sans-serif}.questions{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start}.question{border:1.5px solid #00bbed;background:#eefaff;border-radius:11px;padding:15px 13px;font-size:19px;line-height:1.6;display:flex;align-items:center;flex-wrap:wrap;gap:8px}.number{font-weight:bold}.answer{width:150px;max-width:100%;border:2px solid #ff5875;background:#fff;border-radius:4px;padding:8px 9px;font:17px Arial,sans-serif;color:#182c39}.answer.good{border-color:#17ae68;background:#e4fbe9}.answer.bad{border-color:#f03d42;background:#ffe4e4;animation:blink .55s ease-in-out 3}@keyframes blink{50%{background:#ffaaaa;border-color:#e00000}}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:28px}.actions button{border:0;border-radius:24px;background:#ff8100;color:white;font-weight:bold;padding:11px 18px;cursor:pointer}.actions button:focus-visible,.answer:focus-visible{outline:3px solid #00a9d7;outline-offset:2px}.status{text-align:center;color:#0069c7;font:bold 16px Arial,sans-serif;min-height:24px;margin-top:12px}@media(max-width:620px){.sheet{padding:15px;min-height:94vh}.questions{grid-template-columns:1fr}.question{font-size:17px}.tag{font-size:11px;padding:6px 8px}.answer{width:135px}}</style></head><body><main class="sheet"><div class="head"><h1>Subtract the following:</h1><span class="tag">Analysing</span></div><div id="questions" class="questions"></div><div class="actions"><button type="button" id="check">Check Answers</button><button type="button" id="show">Show Answer</button><button type="button" id="reset">Reset</button></div><div id="status" class="status" aria-live="polite"></div></main><script>
const data=[["25 kl 128 l from 50 kl 845 l", "25 kl 717 l"], ["782 l 865 ml from 895 l 999 ml", "113 l 134 ml"]];const storageKey="math-4-ch9-9c-subtract-capacity.html";let answers=[];try{const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(saved))answers=saved}catch(e){};const box=document.getElementById('questions');const status=document.getElementById('status');const normalize=s=>String(s).toLowerCase().replace(/\s+/g,'').replace(/,/g,'');function persist(){localStorage.setItem(storageKey,JSON.stringify(answers))}function render(){box.innerHTML='';data.forEach(([question,correct],i)=>{const row=document.createElement('div');row.className='question';const label=document.createElement('label');label.htmlFor='ans'+i;label.textContent=String.fromCharCode(97+i)+'.  '+question;const input=document.createElement('input');input.className='answer';input.id='ans'+i;input.type='text';input.autocomplete='off';input.setAttribute('aria-label','Answer for '+question);input.value=answers[i]||'';input.addEventListener('input',()=>{answers[i]=input.value;input.classList.remove('good','bad');status.textContent='';persist()});row.append(label,input);box.append(row)})}document.getElementById('check').onclick=()=>{let count=0;document.querySelectorAll('.answer').forEach((input,i)=>{input.classList.remove('good','bad');if(!input.value.trim())return;const correct=normalize(input.value)===normalize(data[i][1]);if(correct)count++;input.classList.add(correct?'good':'bad')});status.textContent='Correct answers: '+count+' / '+data.length};document.getElementById('show').onclick=()=>{answers=data.map(x=>x[1]);persist();render();document.querySelectorAll('.answer').forEach(el=>el.classList.add('good'));status.textContent='All answers shown'};document.getElementById('reset').onclick=()=>{answers=[];persist();render();status.textContent=''};render();
</script></body></html>
