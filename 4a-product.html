<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiplication as Repeated Addition</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#222}
.exercise{max-width:900px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 24px;color:#00a5dc;font-size:25px}
.questions{display:flex;flex-direction:column;gap:13px;padding-left:25px}
.q{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-family:Georgia,"Times New Roman",serif;font-size:21px}
.letter{width:25px}
.answer{height:38px;border:2px solid #ff3b30;background:#fff;font-size:18px;padding:3px 6px;outline:none}
.repeated{width:180px}
.product{width:52px}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:520px){.exercise{margin:0;border-radius:0;padding:16px}.questions{padding-left:0}.q{font-size:18px}.repeated{width:150px}h1{font-size:21px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Find the product using multiplication as repeated addition.</h1>

<div class="questions">
 <div class="q"><span class="letter">a.</span><span>2 × 3 =</span><input id="a0" class="answer repeated"><span>= 6</span></div>
 <div class="q"><span class="letter">b.</span><span>3 × 4 =</span><input id="a1" class="answer repeated"><span>= 12</span></div>
 <div class="q"><span class="letter">c.</span><span>5 × 3 =</span><input id="a2" class="answer repeated"><span>= 15</span></div>
 <div class="q"><span class="letter">d.</span><span>3 × 6 =</span><input id="a3" class="answer repeated"><span>=</span><input id="a4" class="answer product" inputmode="numeric"></div>
</div>

<div class="actions">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetExercise()">Reset</button>
</div>
<div id="result">Score: 0 / 5</div>
</main>

<script>
const answers=[
 ["2+2+2","2 + 2 + 2"],
 ["3+3+3+3","3 + 3 + 3 + 3"],
 ["5+5+5","5 + 5 + 5"],
 ["3+3+3+3+3+3","3 + 3 + 3 + 3 + 3 + 3"],
 ["18"]
];

function normalize(v){return v.replace(/\s+/g,"").trim();}
function checkAnswers(){
 let score=0;
 answers.forEach((vals,i)=>{
  const e=document.getElementById("a"+i);
  const val=normalize(e.value);
  const ok=vals.some(x=>normalize(x)===val);
  e.classList.remove("ok","bad");
  e.classList.add(ok?"ok":"bad");
  if(ok)score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 5`;
}
function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{
  e.value="";
  e.classList.remove("ok","bad");
 });
 document.getElementById("result").textContent="Score: 0 / 5";
}
</script>
</body>
</html>
