<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>नीचे दिए गए शब्दों के पर्यायवाची लिखिए</title><style>*{box-sizing:border-box}body{margin:0;background:#c9faff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#18222c}.wrap{width:min(1050px,94vw);margin:3vh auto;background:white;border:3px solid #00aeeb;border-radius:22px;padding:26px;min-height:65vh;display:flex;flex-direction:column}h2{color:#00a9e8;margin:0 0 18px;font-size:clamp(20px,2.6vw,29px)}.questions{flex:1}.q{padding:13px 15px;background:#e9faff;border:1.5px solid #00b9fa;border-radius:12px;margin:10px 0;font-size:18px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.opt{background:#fff;border:1px solid #83d9ff;border-radius:8px;padding:12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:7px}.opt.selected{background:#c8f9e7;border:2px solid #00a7d4}.opt input{accent-color:#00a7d4;width:19px;height:19px}.wordrow{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.wordrow input{border:2px solid #ff6585;border-radius:5px;font:inherit;padding:8px;width:min(350px,55vw)}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0 10px}button{border:0;border-radius:30px;background:#ff7900;color:#fff;padding:12px 20px;font-weight:bold;cursor:pointer}.marks{text-align:center;color:#0052c9;font-size:20px;font-weight:bold}.feedback{text-align:center;min-height:20px;color:#0052c9}@media(max-width:600px){.wrap{padding:14px;margin:8px auto}.opts{grid-template-columns:1fr}.q{font-size:16px;padding:10px}}</style></head><body><main class="wrap"><h2>नीचे दिए गए शब्दों के पर्यायवाची लिखिए</h2><section class="questions" id="questions"></section><footer><div class="buttons"><button onclick="submit()">Submit</button><button onclick="show()">Show Answer</button><button onclick="reset()">Reset</button></div><div class="marks" id="marks">Marks: 0 / 4</div><div class="feedback" id="feedback"></div></footer></main><script>const data=[["गहना", "आभूषण, भूषण"], ["चाह", "इच्छा, अभिलाषा"], ["सम्राट", "राजा, बादशाह"], ["शीश", "सिर, शीर्ष"]],key='exercise:'+location.pathname;let answers=JSON.parse(localStorage.getItem(key)||'{}');function save(){localStorage.setItem(key,JSON.stringify(answers))}function render(){document.getElementById('questions').innerHTML=data.map((q,i)=>`<div class="q wordrow"><b>(${'कखगघ'[i]}) ${q[0]}</b><input aria-label="उत्तर ${i+1}" value="${(answers[i]||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" oninput="answers[${i}]=this.value;save()"></div>`).join('')}function normalize(s){return s.replace(/[\s।,，]/g,'').trim()}function submit(){let score=data.reduce((s,q,i)=>s+(normalize(answers[i]||'')===normalize(q[1])),0);document.getElementById('marks').textContent=`Marks: ${score} / ${data.length}`;document.getElementById('feedback').textContent='उत्तर जाँच लिए गए हैं।';send(score)}function show(){data.forEach((q,i)=>answers[i]=q[1]);save();render();submit()}function reset(){answers={};save();render();document.getElementById('marks').textContent=`Marks: 0 / ${data.length}`;document.getElementById('feedback').textContent=''}
function send(score){try{window.parent.postMessage({exerciseType:'OPTION',response:{...answers},score,total:data.length},'*')}catch(e){}}render();</script></body></html>
