<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOPAL Hindi 4 Chapter 11 Idioms</title><style>
*{box-sizing:border-box}body{margin:0;background:#e3f8ff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#263b44}.wrap{max-width:1000px;margin:22px auto;background:#fff;border:3px solid #00bde8;border-radius:18px;padding:24px}h2{margin:0 0 8px;color:#ff3988;font-size:25px}.meta{color:#527783;margin:0 0 18px}.q{background:#effbff;border:1px solid #8cdef4;border-radius:12px;padding:15px;margin:12px 0;font-size:18px}.q select{font:inherit;width:100%;margin-top:12px;padding:9px;border:1.5px solid #00bde8;border-radius:8px;background:#fff}.correct{background:#dcf8e5!important;border-color:#20a653!important}.wrong{background:#ffe0e0!important;border-color:#e43d3d!important}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button{border:0;border-radius:24px;padding:11px 21px;background:#ff3988;color:white;font-weight:bold;cursor:pointer;font-size:15px}#score{text-align:center;color:#087fa7;font-weight:bold;font-size:19px;margin-top:15px}@media(max-width:650px){.wrap{margin:8px;padding:14px}.q{font-size:17px}}
</style></head><body><main class="wrap"><h2>पाठ में दिए गए मुहावरों के अर्थ के साथ वाक्य-प्रयोग चुनिए–</h2><p class="meta">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 4</p><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 4</div></main><script>
const data=[["पैरों तले ज़मीन खिसकना", ["बहुत परेशान होना — लाला ने वीणा की माँग की तो नारद जी के पैरों तले ज़मीन खिसक गई।", "बहुत गुस्सा आना — लाला वीणा न मिलने पर आग बबूला हो गया।", "बिना मतलब की बात — लाला, नारद जी से बे सिर-पैर की बातें कर रहा था।", "क्रोध या ईर्ष्या से दुखी होना — नारद जी के उल्टे जवाब से लाला जल-भुन गया।"], 0], ["जल-भुन जाना", ["क्रोध या ईर्ष्या से दुखी होना — नारद जी के उल्टे जवाब से लाला जल-भुन गया।", "बहुत परेशान होना — लाला ने वीणा की माँग की तो नारद जी के पैरों तले ज़मीन खिसक गई।", "बहुत गुस्सा आना — लाला वीणा न मिलने पर आग बबूला हो गया।", "बिना मतलब की बात — लाला, नारद जी से बे सिर-पैर की बातें कर रहा था।"], 0], ["बे सिर-पैर की बातें करना", ["बिना मतलब की बात — लाला, नारद जी से बे सिर-पैर की बातें कर रहा था।", "क्रोध या ईर्ष्या से दुखी होना — नारद जी के उल्टे जवाब से लाला जल-भुन गया।", "बहुत परेशान होना — लाला ने वीणा की माँग की तो नारद जी के पैरों तले ज़मीन खिसक गई।", "बहुत गुस्सा आना — लाला वीणा न मिलने पर आग बबूला हो गया।"], 0], ["आग बबूला होना", ["बहुत गुस्सा आना — लाला वीणा न मिलने पर आग बबूला हो गया।", "बिना मतलब की बात — लाला, नारद जी से बे सिर-पैर की बातें कर रहा था।", "क्रोध या ईर्ष्या से दुखी होना — नारद जी के उल्टे जवाब से लाला जल-भुन गया।", "बहुत परेशान होना — लाला ने वीणा की माँग की तो नारद जी के पैरों तले ज़मीन खिसक गई।"], 0]];let answers={};const root=document.getElementById('questions');
function render(){root.innerHTML=data.map((q,i)=>`<div class="q" id="q${i}"><b>(${'कखगघ'[i]}) ${q[0]}</b><select id="s${i}" onchange="answers[${i}]=this.value"><option value="">— सही अर्थ और वाक्य चुनें —</option>${q[1].map((o,j)=>`<option value="${j}" ${String(answers[i])===String(j)?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}
function check(){let s=0;data.forEach((q,i)=>{let e=document.getElementById('s'+i);e.classList.remove('correct','wrong');if(answers[i]!==undefined&&answers[i]!==''){let ok=Number(answers[i])===q[2];e.classList.add(ok?'correct':'wrong');if(ok)s++}});document.getElementById('score').textContent=`प्राप्तांक: ${s} / 4`}
function showAnswers(){answers={};data.forEach((q,i)=>answers[i]=String(q[2]));render();check()}
function resetAll(){answers={};render();document.getElementById('score').textContent='प्राप्तांक: 0 / 4'}render();
</script></body></html>
