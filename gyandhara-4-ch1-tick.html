<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही (✓) या गलत (✗) का चिह्न लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#17333b}.wrap{max-width:1000px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a7dd;margin:0 0 20px;font-size:26px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:13px;margin:10px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.opt{border:1px solid #93dcf5;background:white;border-radius:8px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}.opt.sel{background:#d8f3ff;border-color:#009be0}.opt.correct,.q.correct{background:#dcfce5!important;border-color:#22aa55!important}.opt.wrong,.q.wrong{background:#ffe3e3!important;border-color:#ff4545!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}input.blank{border:2px dashed #ff654b;border-radius:5px;width:155px;padding:8px;font-size:18px;margin:0 6px;background:white}input.correct{border:2px solid #19a34a;background:#e4ffe9}input.wrong{border:2px solid red;background:#ffe8e8;animation:blink .6s 2}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}.tf{display:flex;gap:8px;margin-top:8px}.tf button{background:white;border:1px solid #00aeec;color:#333;border-radius:8px;padding:7px 19px}.tf button.sel{background:#c8eeff}.tf button.correct{background:#d9fbe3;border-color:#13a34c}.tf button.wrong{background:#ffdada;border-color:red}@media(max-width:620px){.wrap{margin:7px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}input.blank{width:125px}}</style></head><body><main class="wrap"><h2>सही (✓) या गलत (✗) का चिह्न लगाइए–</h2><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div></main><script>const data=[["भाषा के मुख्य तीन रूप हैं।", false], ["लिखने के ढंग को लिपि कहते हैं।", true], ["व्याकरण शुद्ध भाषा का ज्ञान कराता है।", true], ["पंजाब में गुजराती भाषा बोली जाती है।", false]],key='gyandhara-4-ch1-tick';let answers=JSON.parse(localStorage.getItem(key)||'{}');const root=document.getElementById('questions');function render(){root.innerHTML=data.map((q,i)=>`<div class="q"><div>(${'कखगघ'[i]}) ${q[0]}</div><div class="tf"><button id="t${i}" class="${answers[i]===true?'sel':''}" onclick="pick(${i},true)">✓ सही</button><button id="f${i}" class="${answers[i]===false?'sel':''}" onclick="pick(${i},false)">✗ गलत</button></div></div>`).join('')}function pick(i,v){answers[i]=v;localStorage.setItem(key,JSON.stringify(answers));render()}function check(){data.forEach((q,i)=>{if(answers[i]===undefined)return;document.getElementById((answers[i]?'t':'f')+i).classList.add(answers[i]===q[1]?'correct':'wrong')})}function showAnswers(){data.forEach((q,i)=>answers[i]=q[1]);localStorage.setItem(key,JSON.stringify(answers));render();check()}function resetAll(){answers={};localStorage.removeItem(key);render()}render();</script></body></html>
