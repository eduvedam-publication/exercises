<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Math 1 Chapter 6 – Number Names</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,Arial,sans-serif;color:#17333b}.wrap{max-width:900px;margin:24px auto;background:#fff;border:3px solid #00aee8;border-radius:20px;padding:25px}h2{color:#00a7dd;margin:0 0 8px}.sub{color:#47717e;margin-bottom:20px}.q{display:flex;align-items:center;gap:16px;background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:15px;margin:12px 0;font-size:20px}.q label{min-width:70px;font-weight:bold}.q input{flex:1;min-width:0;border:2px solid #93dcf5;border-radius:8px;background:white;padding:12px;font-size:19px;color:#17333b}.q input.correct{background:#dcfce5;border-color:#22aa55}.q input.wrong{background:#ffe3e3;border-color:#ff4545}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}button{border:0;border-radius:24px;background:#ff8200;color:#fff;font-weight:bold;padding:12px 22px;cursor:pointer;font-size:16px}#score{text-align:center;color:#0073bd;font-size:19px;font-weight:bold;margin-top:15px;min-height:24px}@media(max-width:600px){.wrap{margin:8px;padding:14px}.q{gap:9px;font-size:17px}.q label{min-width:55px}.q input{font-size:16px;padding:10px}}</style></head><body><main class="wrap"><h2>Write the number names for the following numbers.</h2><section id="questions"></section><div class="actions"><button onclick="submitAnswers()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score" aria-live="polite"></div></main><script>const questions=[['a.',49,'forty nine'],['b.',69,'sixty nine'],['c.',73,'seventy three'],['d.',86,'eighty six'],['e.',94,'ninety four']];const key='math-1-ch6-number-names-v1';const root=document.getElementById('questions');const score=document.getElementById('score');let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){root.innerHTML=questions.map(([letter,num],i)=>`<div class="q"><label for="a${i}">${letter} ${num}</label><input id="a${i}" type="text" autocomplete="off" placeholder="Write number name" value="${esc(answers[i]||'')}" aria-label="Number name for ${num}"></div>`).join('');questions.forEach((_,i)=>document.getElementById('a'+i).addEventListener('input',e=>{answers[i]=e.target.value;localStorage.setItem(key,JSON.stringify(answers));e.target.classList.remove('correct','wrong');score.textContent=''}))}function normalize(s){return String(s).toLowerCase().trim().replace(/[-\s]+/g,' ')}function submitAnswers(){let total=0;questions.forEach((q,i)=>{const el=document.getElementById('a'+i);const good=normalize(el.value)===q[2];el.classList.remove('correct','wrong');if(el.value.trim()){el.classList.add(good?'correct':'wrong')}if(good)total++});score.textContent=`Score: ${total} / ${questions.length}`}function showAnswers(){questions.forEach((q,i)=>answers[i]=q[2]);localStorage.setItem(key,JSON.stringify(answers));render();submitAnswers()}function resetAll(){answers={};localStorage.removeItem(key);render();score.textContent=''}render();</script></body></html>
