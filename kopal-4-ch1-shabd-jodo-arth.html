<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kopal Hindi 4 Chapter 1 Shabd Jodo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8f8ff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#20343c}.wrap{max-width:1000px;margin:22px auto;background:#fff;border:3px solid #36bce7;border-radius:18px;padding:24px}h2{color:#e84b8a;margin:0 0 8px;font-size:25px}.meta{color:#55727b;margin:0 0 18px}.q{background:#f2fbff;border:1px solid #9bdff2;border-radius:12px;padding:14px;margin:12px 0;font-size:19px}.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}.slot{min-width:150px;min-height:39px;border:2px dashed #ff91b9;border-radius:8px;background:#fff;padding:5px 10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.slot.filled{border-style:solid}.slot.correct{background:#dff9e7;border-color:#22a653}.slot.wrong{background:#ffe1e1;border-color:#ed3434;animation:blink .6s 2}@keyframes blink{50%{opacity:.5}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}.actions button{border:0;border-radius:22px;padding:11px 20px;background:#e84b8a;color:white;font-weight:bold;cursor:pointer;font-size:15px}#score{text-align:center;color:#087da8;font-weight:bold;font-size:19px;margin-top:15px}@media(max-width:650px){.wrap{margin:7px;padding:14px}.q{font-size:17px}}

select{font:inherit;font-size:16px;max-width:100%;min-width:220px;padding:9px 38px 9px 12px;border:1.5px solid #28b8e8;border-radius:9px;background-color:#fff;color:#20343c;box-shadow:0 2px 5px rgba(0,120,160,.08);cursor:pointer;outline:none}
select:focus{border-color:#e84b8a;box-shadow:0 0 0 3px rgba(232,75,138,.16)}
select.correct{background-color:#dff9e7;border-color:#22a653}
select.wrong{background-color:#ffe1e1;border-color:#ed3434}
.line{gap:12px}
.line span{font-weight:600;color:#145b75}
@media(max-width:650px){select{min-width:0;width:100%;font-size:15px}.line{display:grid;grid-template-columns:1fr;gap:7px}.line span{margin-top:4px}}
</style></head><body><main class="wrap"><h2>नीचे लिखे शब्दों को पढ़िए, जोड़कर लिखिए और अर्थ बताइए–</h2><p class="meta">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 5</p><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 5</div></main>
<script>
const data=[
["हिम + आलय =", "हिमालय", "बर्फ़ का घर",["हिमालय - बर्फ़ का घर","विद्यालय - पढ़ाई करने का स्थान","पुस्तकालय - किताब घर","भोजनालय - भोजन करने की जगह","औषधालय - औषधि रखने की जगह"]],
["विद्या + आलय =", "विद्यालय", "पढ़ाई करने का स्थान",["विद्यालय - पढ़ाई करने का स्थान","हिमालय - बर्फ़ का घर","पुस्तकालय - किताब घर","भोजनालय - भोजन करने की जगह","औषधालय - औषधि रखने की जगह"]],
["पुस्तक + आलय =", "पुस्तकालय", "किताब घर",["पुस्तकालय - किताब घर","हिमालय - बर्फ़ का घर","विद्यालय - पढ़ाई करने का स्थान","भोजनालय - भोजन करने की जगह","औषधालय - औषधि रखने की जगह"]],
["भोजन + आलय =", "भोजनालय", "भोजन करने की जगह",["भोजनालय - भोजन करने की जगह","हिमालय - बर्फ़ का घर","विद्यालय - पढ़ाई करने का स्थान","पुस्तकालय - किताब घर","औषधालय - औषधि रखने की जगह"]],
["औषधि + आलय =", "औषधालय", "औषधि रखने की जगह",["औषधालय - औषधि रखने की जगह","हिमालय - बर्फ़ का घर","विद्यालय - पढ़ाई करने का स्थान","पुस्तकालय - किताब घर","भोजनालय - भोजन करने की जगह"]]],key='kopal-4-ch1-word-join';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const root=document.getElementById('questions');
function render(){root.innerHTML=data.map((q,i)=>`<div class="q">(${'कखगघङ'[i]}) <b>${q[0]}</b><div class="line"><span>शब्द चुनें:</span><select id="w${i}" onchange="pick(${i},'word',this.value)"><option value="">— शब्द चुनें —</option>${q[3].map(x=>{let p=x.split(' - ');return `<option value="${p[0]}" ${answers[i]?.word===p[0]?'selected':''}>${p[0]}</option>`}).join('')}</select><span>अर्थ चुनें:</span><select id="m${i}" onchange="pick(${i},'meaning',this.value)"><option value="">— अर्थ चुनें —</option>${q[3].map(x=>{let p=x.split(' - ');return `<option value="${p[1]}" ${answers[i]?.meaning===p[1]?'selected':''}>${p[1]}</option>`}).join('')}</select></div></div>`).join('')}
function pick(i,k,v){answers[i]=answers[i]||{};answers[i][k]=v;localStorage.setItem(key,JSON.stringify(answers))}
function check(){let score=0;data.forEach((q,i)=>{let w=document.getElementById('w'+i),m=document.getElementById('m'+i);w.classList.remove('correct','wrong');m.classList.remove('correct','wrong');let wordOK=answers[i]?.word===q[1],meaningOK=answers[i]?.meaning===q[2];if(answers[i]?.word)w.classList.add(wordOK?'correct':'wrong');if(answers[i]?.meaning)m.classList.add(meaningOK?'correct':'wrong');if(wordOK&&meaningOK)score++});document.getElementById('score').textContent=`प्राप्तांक: ${score} / 5`}
function showAnswers(){answers={};data.forEach((q,i)=>answers[i]={word:q[1],meaning:q[2]});localStorage.setItem(key,JSON.stringify(answers));render();check()}
function resetAll(){answers={};localStorage.removeItem(key);render();document.getElementById('score').textContent='प्राप्तांक: 0 / 5'}render();
</script></body></html>
