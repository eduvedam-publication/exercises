<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compare and encircle the bigger number</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#111}.card{max-width:950px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{margin:0 0 24px;color:#009ed2;font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}.q{background:#f7fbfd;border:2px solid #a9e9fb;border-radius:18px;padding:18px;font-size:20px;display:flex;align-items:center;gap:14px}.num{min-width:82px;padding:9px 14px;border:2px solid #ff3c91;background:#fff;border-radius:999px;font-size:20px;cursor:pointer}.sel{background:#ffe5f1}.ok{background:#dcf8df;border-color:#009b8e}.bad{background:#ffe1e1;border-color:#e43d30}.actions{display:flex;justify-content:center;gap:14px;margin-top:26px}.actions button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:bold;cursor:pointer}#result{text-align:center;font-size:22px;font-weight:bold;color:#064bb4;margin-top:20px}@media(max-width:650px){.card{margin:0;border-radius:0;padding:14px}.grid{grid-template-columns:1fr}h1{font-size:22px}}
</style>
<main class=card>
<h1>Compare and encircle the bigger number.</h1>
<div class=grid>
<div class=q>a. <button class=num data-q=0 data-v=252 onclick=pick(this)>252</button><button class=num data-q=0 data-v=246 onclick=pick(this)>246</button></div>
<div class=q>b. <button class=num data-q=1 data-v=186 onclick=pick(this)>186</button><button class=num data-q=1 data-v=178 onclick=pick(this)>178</button></div>
<div class=q>c. <button class=num data-q=2 data-v=233 onclick=pick(this)>233</button><button class=num data-q=2 data-v=432 onclick=pick(this)>432</button></div>
<div class=q>d. <button class=num data-q=3 data-v=262 onclick=pick(this)>262</button><button class=num data-q=3 data-v=259 onclick=pick(this)>259</button></div>
</div>
<div class=actions><button onclick=check()>Check Answers</button><button onclick=resetAll()>Reset</button></div>
<div id=result>Score: 0 / 4</div>
</main>
<script>
const A=[252,186,432,262],S={};
function pick(e){document.querySelectorAll(`[data-q="${e.dataset.q}"]`).forEach(x=>x.classList.remove("sel"));e.classList.add("sel");S[e.dataset.q]=+e.dataset.v}
function check(){let n=0;A.forEach((a,i)=>{document.querySelectorAll(`[data-q="${i}"]`).forEach(x=>{x.classList.remove("ok","bad");if(+x.dataset.v===a)x.classList.add("ok");else if(x.classList.contains("sel"))x.classList.add("bad")});if(S[i]===a)n++});result.textContent=`Score: ${n} / 4`}
function resetAll(){Object.keys(S).forEach(k=>delete S[k]);document.querySelectorAll(".num").forEach(x=>x.className="num");result.textContent="Score: 0 / 4"}
</script>
