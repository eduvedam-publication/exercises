<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colour to compare. Also put > or < in the box.</title><style>*{box-sizing:border-box}body{margin:0;background:#defaff;font-family:Georgia,serif;color:#222}.exercise{max-width:1000px;margin:18px auto;padding:24px;border:3px solid #00a9dc;border-radius:24px;background:white}h1{font-size:24px;color:#00a9dc;margin:0 0 20px}.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.q{background:#edfbff;border:1px solid #00b6ed;border-radius:12px;padding:14px;min-width:0}.qhead{font-size:18px;margin-bottom:10px}.fraction{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;min-width:30px;font-size:21px}.fraction span:first-child{border-bottom:1.5px solid #222;padding:0 4px 3px}.fraction span:last-child{padding-top:3px}.compare{display:flex;align-items:center;gap:8px;justify-content:center}.answer{width:48px;height:40px;border:2px solid #ff5262;background:#fff;text-align:center;font-size:25px;border-radius:4px}.answer.ok{border-color:#20a65b;background:#dff8e6}.answer.bad{border-color:#e73535;background:#ffe0e0;animation:blink .45s 3}@keyframes blink{50%{background:#ff7777}}.actions{display:flex;gap:12px;justify-content:center;margin-top:25px}button{border:0;background:#ff8500;color:white;border-radius:24px;padding:11px 21px;font-weight:bold;cursor:pointer}.status{text-align:center;color:#0056b9;font-size:16px;margin-top:12px;min-height:20px}.pictures{display:flex;gap:12px;justify-content:center;margin-bottom:12px}.circle{width:105px;height:105px;max-width:46%;touch-action:none;cursor:pointer}.slice{fill:#fff;stroke:#222;stroke-width:1.4;transition:fill .12s}.slice.coloured{fill:#ffca62}.tip{font:13px Arial;color:#566;text-align:center;margin:0 0 15px}@media(max-width:720px){.exercise{margin:0;border-radius:0;padding:14px}.questions{grid-template-columns:1fr}h1{font-size:21px}.circle{width:115px;height:115px}}</style></head><body><main class="exercise"><h1>Colour to compare. Also put > or < in the box.</h1><p class="tip">Click the parts of each shape to colour them, then compare the fractions.</p><section class="questions"><div class="q"><div class="qhead"><b>a.</b></div><div class="pictures"><svg class="circle" viewBox="0 0 110 110" aria-label="Colourable fraction shape"><path class="slice" data-id="0a-0" d="M 55 55 L 55.00 8.00 A 47 47 0 0 1 95.70 31.50 Z"/><path class="slice" data-id="0a-1" d="M 55 55 L 95.70 31.50 A 47 47 0 0 1 95.70 78.50 Z"/><path class="slice" data-id="0a-2" d="M 55 55 L 95.70 78.50 A 47 47 0 0 1 55.00 102.00 Z"/><path class="slice" data-id="0a-3" d="M 55 55 L 55.00 102.00 A 47 47 0 0 1 14.30 78.50 Z"/><path class="slice" data-id="0a-4" d="M 55 55 L 14.30 78.50 A 47 47 0 0 1 14.30 31.50 Z"/><path class="slice" data-id="0a-5" d="M 55 55 L 14.30 31.50 A 47 47 0 0 1 55.00 8.00 Z"/></svg><svg class="circle" viewBox="0 0 110 110" aria-label="Colourable fraction shape"><path class="slice" data-id="0b-0" d="M 55 55 L 55.00 8.00 A 47 47 0 0 1 95.70 31.50 Z"/><path class="slice" data-id="0b-1" d="M 55 55 L 95.70 31.50 A 47 47 0 0 1 95.70 78.50 Z"/><path class="slice" data-id="0b-2" d="M 55 55 L 95.70 78.50 A 47 47 0 0 1 55.00 102.00 Z"/><path class="slice" data-id="0b-3" d="M 55 55 L 55.00 102.00 A 47 47 0 0 1 14.30 78.50 Z"/><path class="slice" data-id="0b-4" d="M 55 55 L 14.30 78.50 A 47 47 0 0 1 14.30 31.50 Z"/><path class="slice" data-id="0b-5" d="M 55 55 L 14.30 31.50 A 47 47 0 0 1 55.00 8.00 Z"/></svg></div><div class="compare"><span class="fraction"><span>5</span><span>6</span></span><input class="answer" data-id="q0" maxlength="1" aria-label="Comparison for a" autocomplete="off"><span class="fraction"><span>4</span><span>6</span></span></div></div><div class="q"><div class="qhead"><b>b.</b></div><div class="pictures"><svg class="circle" viewBox="0 0 110 110" aria-label="Colourable fraction shape"><path class="slice" data-id="1a-0" d="M 55 55 L 55.00 8.00 A 47 47 0 0 1 99.70 40.48 Z"/><path class="slice" data-id="1a-1" d="M 55 55 L 99.70 40.48 A 47 47 0 0 1 82.63 93.02 Z"/><path class="slice" data-id="1a-2" d="M 55 55 L 82.63 93.02 A 47 47 0 0 1 27.37 93.02 Z"/><path class="slice" data-id="1a-3" d="M 55 55 L 27.37 93.02 A 47 47 0 0 1 10.30 40.48 Z"/><path class="slice" data-id="1a-4" d="M 55 55 L 10.30 40.48 A 47 47 0 0 1 55.00 8.00 Z"/></svg><svg class="circle" viewBox="0 0 110 110" aria-label="Colourable fraction shape"><path class="slice" data-id="1b-0" d="M 55 55 L 55.00 8.00 A 47 47 0 0 1 99.70 40.48 Z"/><path class="slice" data-id="1b-1" d="M 55 55 L 99.70 40.48 A 47 47 0 0 1 82.63 93.02 Z"/><path class="slice" data-id="1b-2" d="M 55 55 L 82.63 93.02 A 47 47 0 0 1 27.37 93.02 Z"/><path class="slice" data-id="1b-3" d="M 55 55 L 27.37 93.02 A 47 47 0 0 1 10.30 40.48 Z"/><path class="slice" data-id="1b-4" d="M 55 55 L 10.30 40.48 A 47 47 0 0 1 55.00 8.00 Z"/></svg></div><div class="compare"><span class="fraction"><span>2</span><span>5</span></span><input class="answer" data-id="q1" maxlength="1" aria-label="Comparison for b" autocomplete="off"><span class="fraction"><span>3</span><span>5</span></span></div></div><div class="q"><div class="qhead"><b>c.</b></div><div class="pictures"><svg class="circle" viewBox="0 0 110 110" aria-label="Colourable fraction shape"><path class="slice" data-id="2a-0" d="M 55 55 L 55.00 8.00 A 47 47 0 0 1 91.75 25.70 Z"/><path class="slice" data-id="2a-1" d="M 55 55 L 91.75 25.70 A 47 47 0 0 1 100.82 65.46 Z"/><path class="slice" data-id="2a-2" d="M 55 55 L 100.82 65.46 A 47 47 0 0 1 75.39 97.35 Z"/><path class="slice" data-id="2a-3" d="M 55 55 L 75.39 97.35 A 47 47 0 0 1 34.61 97.35 Z"/><path class="slice" data-id="2a-4" d="M 55 55 L 34.61 97.35 A 47 47 0 0 1 9.18 65.46 Z"/><path class="slice" data-id="2a-5" d="M 55 55 L 9.18 65.46 A 47 47 0 0 1 18.25 25.70 Z"/><path class="slice" data-id="2a-6" d="M 55 55 L 18.25 25.70 A 47 47 0 0 1 55.00 8.00 Z"/></svg><svg class="circle" viewBox="0 0 110 110" aria-label="Colourable fraction shape"><path class="slice" data-id="2b-0" d="M 55 55 L 55.00 8.00 A 47 47 0 0 1 91.75 25.70 Z"/><path class="slice" data-id="2b-1" d="M 55 55 L 91.75 25.70 A 47 47 0 0 1 100.82 65.46 Z"/><path class="slice" data-id="2b-2" d="M 55 55 L 100.82 65.46 A 47 47 0 0 1 75.39 97.35 Z"/><path class="slice" data-id="2b-3" d="M 55 55 L 75.39 97.35 A 47 47 0 0 1 34.61 97.35 Z"/><path class="slice" data-id="2b-4" d="M 55 55 L 34.61 97.35 A 47 47 0 0 1 9.18 65.46 Z"/><path class="slice" data-id="2b-5" d="M 55 55 L 9.18 65.46 A 47 47 0 0 1 18.25 25.70 Z"/><path class="slice" data-id="2b-6" d="M 55 55 L 18.25 25.70 A 47 47 0 0 1 55.00 8.00 Z"/></svg></div><div class="compare"><span class="fraction"><span>2</span><span>7</span></span><input class="answer" data-id="q2" maxlength="1" aria-label="Comparison for c" autocomplete="off"><span class="fraction"><span>4</span><span>7</span></span></div></div></section><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div class="status" id="status" aria-live="polite"></div></main><script>const KEY="math4-ch7-7b-colour";const expected={"q0": ">", "q1": "<", "q2": "<"};let state={answers:{},colored:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function update(e){state.answers[e.dataset.id]=e.value;save();e.classList.remove('ok','bad');document.getElementById('status').textContent=''}document.querySelectorAll('.answer').forEach(e=>{e.value=state.answers[e.dataset.id]||'';e.addEventListener('input',()=>update(e))});document.querySelectorAll('.slice').forEach(s=>{if(state.colored[s.dataset.id])s.classList.add('coloured');s.addEventListener('click',()=>{s.classList.toggle('coloured');state.colored[s.dataset.id]=s.classList.contains('coloured');save()})});function checkAnswers(){let ok=0;document.querySelectorAll('.answer').forEach(e=>{const good=e.value.trim()===expected[e.dataset.id];e.classList.remove('ok','bad');e.classList.add(good?'ok':'bad');if(good)ok++});document.getElementById('status').textContent=ok===Object.keys(expected).length?'All answers are correct!':'Please correct the red highlighted answers.';save()}function resetExercise(){state={answers:{},colored:{}};save();document.querySelectorAll('.answer').forEach(e=>{e.value='';e.classList.remove('ok','bad')});document.querySelectorAll('.slice').forEach(s=>s.classList.remove('coloured'));document.getElementById('status').textContent=''}</script></body></html>
