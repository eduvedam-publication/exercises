<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kopal 4 Chapter 14 स्त्रीलिंग</title><style>*{box-sizing:border-box}body{margin:0;background:#c9faff;font-family:"Noto Sans Devanagari","Mangal",sans-serif;color:#202b35}.wrap{width:min(1050px,95vw);margin:24px auto;background:#fff;border:3px solid #00aeed;border-radius:23px;padding:25px}h2{margin:0 0 18px;color:#00a8e6;font-size:25px}.q{background:#e9faff;border:1.5px solid #00b7fa;border-radius:12px;padding:14px;margin:10px 0}.prompt{font-size:18px;margin-bottom:10px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.opt{background:#fff;border:1px solid #8adcf9;border-radius:9px;padding:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:49px}.opt.sel{border:2px solid #008ff0;background:#d5f4ff}.opt.good,.slot.good{border:2px solid #22aa55!important;background:#e0ffe9!important}.opt.bad,.slot.bad{border:2px solid #f04747!important;background:#ffe2e2!important}.square{border:1.5px solid #00a9fa;border-radius:3px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:#0068d9;font-weight:800}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:23px 0 10px}button.action{border:0;border-radius:28px;background:#ff8000;color:#fff;padding:12px 20px;cursor:pointer;font-weight:bold}.marks{text-align:center;color:#0058bd;font-size:19px;font-weight:bold}.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#def8ff;padding:15px;border-radius:12px;margin-bottom:12px}.chip{background:#fff;border:1px solid #00a9ff;border-radius:8px;padding:9px 15px;cursor:grab;font-size:18px}.chip.chosen{background:#b6eefe;outline:2px solid #008cdb}.chip.used{opacity:.45}.slot{display:inline-flex;min-width:135px;min-height:43px;border:2px dashed #f87c62;border-radius:8px;background:#fff;align-items:center;justify-content:center;padding:5px 10px;cursor:pointer;font-size:18px}.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:700px){.wrap{padding:15px}.opts,.rows{grid-template-columns:1fr}h2{font-size:21px}}</style><main class="wrap"><h2>दिए गए शब्दों के स्त्रीलिंग रूप लिखिए–</h2><div class="bank" id="bank"></div><div class="rows" id="rows"></div><div class="actions"><button class="action" onclick="submit()">Submit</button><button class="action" onclick="showAnswer()">Show Answer</button><button class="action" onclick="resetAll()">Reset</button></div><div class="marks" id="marks">Marks: 0 / 6</div></main><script>const words=["रानी", "सरदारिन", "पत्नी", "बुद्धिमती", "बगिया", "सेविका"],labels=["राजा", "सरदार", "पति", "बुद्धिमान", "बगीचा", "सेवक"],key='kopal-4-ch14-striling-v1';let filled=JSON.parse(localStorage.getItem(key)||'null')||Array(6).fill(null),selected=null;function save(){localStorage.setItem(key,JSON.stringify(filled))}function render(){document.getElementById('bank').innerHTML=words.map((w,i)=>`<button draggable="true" ondragstart="drag(event,${i})" onclick="selectWord(${i})" class="chip ${selected===i?'chosen':''} ${filled.includes(i)?'used':''}">${w}</button>`).join('');document.getElementById('rows').innerHTML=labels.map((w,i)=>`<div class="q line"><b>${w}</b><span>—</span><span class="slot" ondragover="event.preventDefault()" ondrop="drop(event,${i})" onclick="place(${i})">${filled[i]===null?'________':words[filled[i]]}</span></div>`).join('')}function selectWord(i){selected=i;render()}function place(i){if(selected===null){filled[i]=null}else{filled=filled.map((v,k)=>v===selected?null:v);filled[i]=selected;selected=null}save();render()}function drag(e,i){e.dataTransfer.setData('text/plain',String(i))}function drop(e,i){e.preventDefault();selected=Number(e.dataTransfer.getData('text/plain'));place(i)}function submit(){render();let n=0;document.querySelectorAll('.slot').forEach((s,i)=>{if(filled[i]===i)n++;if(filled[i]!==null)s.classList.add(filled[i]===i?'good':'bad')});document.getElementById('marks').textContent=`Marks: ${n} / 6`}function showAnswer(){filled=words.map((_,i)=>i);selected=null;save();submit()}function resetAll(){filled=Array(6).fill(null);selected=null;save();render();document.getElementById('marks').textContent='Marks: 0 / 6'}render();</script></html>
