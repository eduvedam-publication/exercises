<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What is the LCM of 2 and 5?</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;color:#222;font-family:Georgia,'Times New Roman',serif}.exercise{max-width:980px;margin:20px auto;padding:25px 30px;background:white;border:3px solid #00afe2;border-radius:25px}h2{margin:0 0 20px;color:#00a7db;font-size:23px}.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 22px}.question{font-size:19px;display:flex;align-items:center;gap:8px;white-space:nowrap}.answer{width:85px;height:34px;border:2px solid #ff5665;background:white;text-align:center;font:19px Georgia;outline:none}.answer.correct,.choice.correct{border-color:#15a64b;background:#d9f8e1}.answer.wrong,.choice.wrong{border-color:#e32b39;background:#ffe3e6;animation:blink .55s 3}@keyframes blink{50%{background:#ff9098}}.actions{display:flex;justify-content:center;gap:12px;margin-top:30px}button{border:0;border-radius:22px;background:#ff8300;color:white;padding:11px 22px;font-weight:bold;cursor:pointer}#result{text-align:center;color:#064bb4;font:bold 21px Arial;margin-top:15px}.line{font-size:19px;line-height:2.6}.line .answer{width:58px;vertical-align:middle}.choices{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.choice{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid #92dcf6;border-radius:9px;background:#edfbff;cursor:pointer;font-size:19px}.choice input{accent-color:#00a9df;width:19px;height:19px}.choice.selected{border-color:#00a9df;background:#d6f5ff}@media(max-width:700px){.exercise{margin:8px;padding:18px 14px}.questions{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 8px}.question{font-size:16px}.answer{width:65px}h2{font-size:20px}}</style></head><body><main class="exercise"><h2>What is the LCM of 2 and 5?</h2><p class="line">First five multiples of 2 : 2, 4, <input class="answer" inputmode="numeric" aria-label="Third multiple of 2">, 8, <input class="answer" inputmode="numeric" aria-label="Fifth multiple of 2"></p><p class="line">First five multiples of 5 : 5, <input class="answer" inputmode="numeric" aria-label="Second multiple of 5">, 15, <input class="answer" inputmode="numeric" aria-label="Fourth multiple of 5">, 25</p><p style="font-size:19px">Put a tick mark on the correct LCM:</p><div class="choices"><label class="choice"><span>2</span><input type="radio" name="lcm" value="2"></label><label class="choice"><span>4</span><input type="radio" name="lcm" value="4"></label><label class="choice"><span>5</span><input type="radio" name="lcm" value="5"></label><label class="choice"><span>8</span><input type="radio" name="lcm" value="8"></label><label class="choice"><span>10</span><input type="radio" name="lcm" value="10"></label></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div></main><script>const answers=['6','10','10','20'];function checkAnswers(){let score=0;document.querySelectorAll('.answer').forEach((e,i)=>{let ok=e.value.trim()===answers[i];e.className='answer '+(ok?'correct':'wrong');if(ok)score++});let chosen=document.querySelector('input[name="lcm"]:checked');document.querySelectorAll('.choice').forEach(e=>{let c=e.querySelector('input');e.className='choice'+(c.checked?(c.value==='10'?' correct':' wrong'):'')});if(chosen?.value==='10')score++;document.getElementById('result').textContent='Score: '+score+' / 5';save()}const key='math4-ch6-6e-'+location.pathname.split('/').pop();function save(){localStorage.setItem(key,JSON.stringify({values:[...document.querySelectorAll('.answer')].map(e=>e.value),selected:document.querySelector('input[name="lcm"]:checked')?.value||'',score:document.getElementById('result').textContent}))}function restore(){try{let x=JSON.parse(localStorage.getItem(key)||'{}');(x.values||[]).forEach((v,i)=>{let e=document.querySelectorAll('.answer')[i];if(e)e.value=v});if(x.selected){let e=document.querySelector('input[name="lcm"][value="'+x.selected+'"]');if(e)e.checked=true}if(x.score)document.getElementById('result').textContent=x.score}catch(e){}}function resetExercise(){document.querySelectorAll('.answer').forEach(e=>{e.value='';e.className='answer'});document.querySelectorAll('.choice').forEach(e=>e.className='choice');document.querySelectorAll('input[name="lcm"]').forEach(e=>e.checked=false);document.getElementById('result').textContent='Score: 0 / 5';localStorage.removeItem(key)}document.querySelectorAll('.answer').forEach(e=>e.addEventListener('input',()=>{e.className='answer';save()}));document.querySelectorAll('input[name="lcm"]').forEach(e=>e.addEventListener('change',()=>{document.querySelectorAll('.choice').forEach(c=>c.className='choice'+(c.querySelector('input').checked?' selected':''));save()}));restore();</script></body></html>
