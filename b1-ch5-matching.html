<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match the Following</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);padding:14px;color:#333}
.game{width:min(100%,1050px);margin:auto;background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:22px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.heading{font-size:28px;font-weight:700;color:#00a6d6;margin-bottom:16px}
.note{text-align:center;font-size:15px;color:#666;margin-bottom:12px}
.match-area{position:relative;display:grid;grid-template-columns:1fr 230px 1fr;gap:22px;align-items:center}
.column{display:flex;flex-direction:column;gap:18px}
.card{height:150px;background:#f9fcff;border:2px solid #c9efff;border-radius:20px;display:flex;justify-content:center;align-items:center;padding:8px;position:relative}
.card img{max-width:100%;max-height:132px;object-fit:contain;border-radius:12px}
.label{height:68px;border:2px solid #ff4fa0;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;cursor:pointer;position:relative;z-index:3;transition:.2s}
.label:hover{background:#fff0f7;transform:scale(1.02)}
.label.selected{background:#fff0f7;box-shadow:0 0 0 3px rgba(255,79,160,.15)}
.label.correct{background:#d4f8d4;border-color:#2e7d32;color:#1b5e20}
.label.wrong{background:#ffd9dd;border-color:#c62828;color:#b71c1c}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.result{text-align:center;margin:18px 0 10px;font-size:24px;font-weight:700;color:#0047ab}
.buttons{text-align:center}
button{border:0;border-radius:32px;padding:12px 28px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9800,#ff6f00);cursor:pointer}
@media(max-width:720px){
 .game{padding:14px 10px} .heading{font-size:21px}
 .match-area{grid-template-columns:1fr 135px 1fr;gap:8px}
 .card{height:105px;padding:4px} .card img{max-height:94px}
 .label{height:52px;font-size:14px;padding:4px}
}
</style>
</head>

  <svg id="lines"></svg>
 </div>
 <div class="result" id="result">Score: 0 / 6</div>
 <div class="buttons"><button onclick="resetGame()">Reset</button></div>
</div>
<script>
let selectedFlower=null, score=0, done=0;
const area=document.getElementById("area"), svg=document.getElementById("lines");

document.querySelectorAll(".flower").forEach(f=>{
 f.style.cursor="pointer";
 f.onclick=()=>{
   if(f.dataset.done) return;
   document.querySelectorAll(".flower").forEach(x=>x.style.outline="none");
   selectedFlower=f;
   f.style.outline="4px solid #00b8f0";
 };
});
document.querySelectorAll(".label").forEach(l=>{
 l.onclick=()=>{
   if(!selectedFlower || l.dataset.done) return;
   const ok=selectedFlower.dataset.answer===l.dataset.name;
   if(ok){
     score++;done++;l.classList.add("correct");l.dataset.done="1";selectedFlower.dataset.done="1";
     drawLine(selectedFlower,l,true);
   }else{
     l.classList.add("wrong");setTimeout(()=>l.classList.remove("wrong"),500);
   }
   selectedFlower.style.outline="none";selectedFlower=null;
   document.getElementById("result").textContent=`Score: ${score} / 6`;
 };
});

function drawLine(a,b,ok){
 const ar=area.getBoundingClientRect(), ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
 const ax = ra.left < rb.left ? ra.right-ar.left : ra.left-ar.left;
 const ay = ra.top-ar.top+ra.height/2;
 const bx = rb.left < ra.left ? rb.right-ar.left : rb.left-ar.left;
 const by = rb.top-ar.top+rb.height/2;
 const line=document.createElementNS("http://www.w3.org/2000/svg","line");
 line.setAttribute("x1",ax);line.setAttribute("y1",ay);line.setAttribute("x2",bx);line.setAttribute("y2",by);
 line.setAttribute("stroke",ok?"#2e7d32":"#c62828");line.setAttribute("stroke-width","3");line.setAttribute("stroke-linecap","round");
 svg.appendChild(line);
}
function resetGame(){
 score=0;done=0;selectedFlower=null;svg.innerHTML="";
 document.querySelectorAll(".flower").forEach(f=>{delete f.dataset.done;f.style.outline="none"});
 document.querySelectorAll(".label").forEach(l=>{delete l.dataset.done;l.classList.remove("correct","wrong","selected")});
 document.getElementById("result").textContent="Score: 0 / 6";
}
window.addEventListener("resize",()=>{ if(done){ svg.innerHTML=""; document.querySelectorAll(".flower[data-done]").forEach(f=>{ const l=[...document.querySelectorAll(".label")].find(x=>x.dataset.name===f.dataset.answer); if(l)drawLine(f,l,true); }); } });
</script>
