<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match the following.</title><style>*{box-sizing:border-box}body{margin:0;background:#b9f8fb;font-family:Georgia,'Noto Sans Devanagari',serif;color:#17212d}.wrap{max-width:1050px;margin:18px auto;padding:22px 25px;background:white;border:3px solid #00a9f5;border-radius:20px}h1{font-size:clamp(21px,3vw,30px);color:#00a4ef;margin:0 0 20px}.q{background:#def8ff;border:1.5px solid #00a9ff;border-radius:12px;margin:10px 0;padding:13px 16px;font-size:18px}.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.opt,.chip{border:1px solid #00b4ff;background:white;border-radius:8px;padding:9px 15px;font-size:17px;cursor:pointer;color:#17212d}.opt.selected,.chip.selected{background:#a7ebff;border-color:#008fe4}.opt.correct,.chip.correct{background:#b9f3c9;border-color:#159747}.opt.wrong,.chip.wrong{background:#ffc4c4;border-color:#df3333}.actions{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:22px}button.action{border:0;border-radius:24px;background:#ff7100;color:white;padding:12px 17px;font-weight:bold;cursor:pointer}.marks{text-align:center;font:700 21px Arial;color:#0646d5;margin-top:12px}.hint{font-size:14px;color:#555;margin:8px 0}.answer{color:#087f36;font-size:15px;margin-top:6px;display:none}.answer.visible{display:block}@media(max-width:650px){.wrap{margin:5px;padding:14px}.q{padding:10px}.opt{font-size:15px}}</style></head><body><main class="wrap"><h1>Match the following.</h1><p class="hint">Click a question in Column 1, then its matching answer in Column 2.</p><div id="matcharea" style="position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><b>Column 1</b><div class="q"><button class="chip left" data-i="0">12 − (5 × 2) − 2 = ?</button></div><div class="q"><button class="chip left" data-i="1">8 ÷ 2 + (4 × 5) = ?</button></div><div class="q"><button class="chip left" data-i="2">2 − (8 ÷ 8) + 3 = ?</button></div></div><div><b>Column 2</b><div class="q"><button class="chip right" data-i="0">4</button></div><div class="q"><button class="chip right" data-i="1">0</button></div><div class="q"><button class="chip right" data-i="2">24</button></div></div><svg id="lines" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg></div><div class="actions"><button class="action" id="submit">Submit</button><button class="action" id="show">Show Answer</button><button class="action" id="reset">Reset</button></div><div class="marks" id="marks">Marks: 0 / 3</div></main><script>const KEY='math-5-ch3-assessment-matching';const correct=[1,2,0];let selected=JSON.parse(localStorage.getItem(KEY)||'{}');let active=null;const store=KEY;const save=()=>localStorage.setItem(store,JSON.stringify(selected));function report(score,total){document.getElementById('marks').textContent=`Marks: ${score} / ${total}`;}function draw(){document.querySelectorAll('.chip').forEach(b=>b.classList.remove('selected','correct','wrong'));if(active!==null)document.querySelector(`.left[data-i="${active}"]`).classList.add('selected');let svg=document.getElementById('lines');svg.innerHTML='';let rect=document.getElementById('matcharea').getBoundingClientRect();Object.entries(selected).forEach(([a,b])=>{let l=document.querySelector(`.left[data-i="${a}"]`).getBoundingClientRect(),r=document.querySelector(`.right[data-i="${b}"]`).getBoundingClientRect();let line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',l.right-rect.left);line.setAttribute('y1',l.top+l.height/2-rect.top);line.setAttribute('x2',r.left-rect.left);line.setAttribute('y2',r.top+r.height/2-rect.top);line.setAttribute('stroke','#098fdd');line.setAttribute('stroke-width','3');svg.appendChild(line)})}document.querySelectorAll('.left').forEach(b=>b.onclick=()=>{active=+b.dataset.i;draw()});document.querySelectorAll('.right').forEach(b=>b.onclick=()=>{if(active===null)return;Object.keys(selected).forEach(k=>{if(selected[k]===+b.dataset.i)delete selected[k]});selected[active]=+b.dataset.i;active=null;save();draw()});document.getElementById('submit').onclick=()=>{let score=0;correct.forEach((v,i)=>{if(selected[i]===v)score++;else if(selected[i]!==undefined)document.querySelector(`.left[data-i="${i}"]`).classList.add('wrong')});report(score,3)};document.getElementById('show').onclick=()=>{selected={0:1,1:2,2:0};save();draw();document.querySelectorAll('.left').forEach(b=>b.classList.add('correct'))};document.getElementById('reset').onclick=()=>{selected={};active=null;localStorage.removeItem(KEY);draw();report(0,3)};window.addEventListener('resize',draw);draw();report(0,3);</script></body></html>
