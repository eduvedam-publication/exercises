<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convert the following into grams.</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e2f8fc;font-family:Georgia,"Times New Roman",serif}
.exercise{width:min(1080px,calc(100% - 24px));min-height:400px;margin:14px auto;background:#fff;border:4px solid #08a6d6;border-radius:28px;padding:34px 42px;display:flex;flex-direction:column}
h1{font:700 25px Arial,sans-serif;color:#00a1db;margin:0 0 38px}
.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 75px;align-content:start;flex:1}
.q{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:22px;line-height:1.6}
.letter{min-width:27px}
input{width:88px;height:39px;border:2px solid #ff2b22;background:#fff;padding:4px 7px;font:18px Arial}
input.correct{background:#dff7df;border-color:#198c3d}
input.wrong{background:#ffe1e1;border-color:#d92c2c}
.controls{margin-top:auto;padding-top:35px;text-align:center}
button{border:0;border-radius:25px;background:#ff7b00;color:#fff;padding:13px 22px;margin:0 6px;font:bold 14px Arial;cursor:pointer}
.score{margin-top:14px;color:#064bb4;font:bold 22px Arial}
@media(max-width:700px){.exercise{padding:25px 20px}.questions{grid-template-columns:1fr;gap:18px}.q{font-size:19px}}
</style></head>
<body><main class="exercise"><h1>Convert the following into grams.</h1><div class="questions"><div class="q"><span class="letter">a.</span><span>4 kg =</span><input id="a0" inputmode="numeric" autocomplete="off"><span>g</span></div><div class="q"><span class="letter">b.</span><span>78 kg =</span><input id="a1" inputmode="numeric" autocomplete="off"><span>g</span></div><div class="q"><span class="letter">c.</span><span>6 kg 675 g =</span><input id="a2" inputmode="numeric" autocomplete="off"><span>g</span></div><div class="q"><span class="letter">d.</span><span>2 kg 200 g =</span><input id="a3" inputmode="numeric" autocomplete="off"><span>g</span></div></div>
<div class="controls"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button>
<div class="score" id="score">Score: 0 / 4</div></div></main>
<script>
const answers=['4000', '78000', '6675', '2200'];
function checkAnswers(){
 let score=0;
 answers.forEach((answer,i)=>{
   const el=document.getElementById('a'+i);
   const good=el.value.trim().toLowerCase()===answer.toLowerCase();
   el.classList.remove('correct','wrong');
   el.classList.add(good?'correct':'wrong');
   if(good) score++;
 });
 document.getElementById('score').textContent=`Score: ${score} / 4`;
}
function resetExercise(){
 answers.forEach((_,i)=>{const el=document.getElementById('a'+i);el.value='';el.classList.remove('correct','wrong');});
 document.getElementById('score').textContent='Score: 0 / 4';
}
</script></body></html>
