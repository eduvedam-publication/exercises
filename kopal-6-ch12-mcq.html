<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का निशान लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#bafaff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#173044}.wrap{max-width:1020px;margin:16px auto;padding:24px;background:white;border:3px solid #00aeff;border-radius:20px}h1{color:#00a5ed;font-size:clamp(21px,3vw,29px);margin:0 0 17px}.q{background:#e0f9ff;border:1.5px solid #00aeff;border-radius:12px;padding:12px 14px;margin:9px 0;font-size:19px;line-height:2}.opts,.bank{display:flex;flex-wrap:wrap;gap:9px}.opts{margin-top:6px}.bank{background:#d1f7ff;padding:12px;border-radius:11px;margin-bottom:12px}.opt,.chip{font:inherit;border:1px solid #00aeff;border-radius:9px;background:white;padding:5px 13px;color:#173044;cursor:pointer}.opt.sel,.chip.sel{background:#8be5ff}.opt.good,.slot.good{background:#dcfce7;border:2px solid #16a34a}.opt.bad,.slot.bad{background:#fee2e2;border:2px solid #ef4444}.slot{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:125px;min-height:39px;border:2px dashed #ff7364;border-radius:8px;background:#fff;cursor:pointer;padding:2px 8px;font:inherit;color:inherit}.chip.used{opacity:.4}.actions{text-align:center;margin:24px 0 8px}.actions button{border:0;background:#ff7400;color:white;padding:11px 18px;border-radius:24px;margin:3px;cursor:pointer;font-weight:bold}#score{text-align:center;color:blue;font-size:21px;font-weight:bold}.hint{font-size:15px;color:#425b68;margin:0 0 10px}@media(max-width:600px){.wrap{margin:5px;padding:12px}.q{font-size:17px}.slot{min-width:98px}}</style></head><body><main class="wrap"><h1>सही विकल्प पर सही (✓) का निशान लगाइए–</h1><p class="hint">सही विकल्प चुनिए।</p><section id="questions"></section><div class="actions"><button id="submit">Submit</button><button id="answer">Show Answer</button><button id="reset">Reset</button></div><div id="score"></div></main><script>const DATA=[["काँटे और फूल का उदाहरण देकर कवि क्या कहना चाहता है?", ["अंतरविरोध", "विरोधी स्वभाव", "समान स्वभाव"], "विरोधी स्वभाव"], ["कुल की बड़ाई कब काम नहीं आती है?", ["बड़प्पन नहीं होने से", "औछापन होने से", "गंभीरता न होने से"], "बड़प्पन नहीं होने से"], ["प्रकृति सबके साथ कैसा व्यवहार करती है?", ["अलग-अलग", "एक-सा", "दोनों"], "एक-सा"], ["इनमें से यह ‘श्याम’ का अर्थ नहीं है–", ["साँवला", "श्रीकृष्ण", "मुख"], "मुख"], ["यदि पेड़ : पौधा, तो बकरी : ___ ?", ["बच्चा", "बकरा", "मेमना"], "मेमना"]],TYPE="mcq",KEY='exercise:'+location.pathname;let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let checked=false,selected=null;const root=document.getElementById('questions'),score=document.getElementById('score');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function set(i,v){state[i]=v;checked=false;save();render()}function render(){root.innerHTML='';if(TYPE==='drag'){const bank=document.createElement('div');bank.className='bank';[...new Set(DATA.map(x=>x[1]))].forEach(w=>{const b=document.createElement('button');b.type='button';b.className='chip'+(selected===w?' sel':'')+(Object.values(state).includes(w)?' used':'');b.textContent=w;b.draggable=true;b.onclick=()=>{selected=w;render()};b.ondragstart=e=>{selected=w;e.dataTransfer.setData('text/plain',w)};bank.appendChild(b)});root.appendChild(bank)}DATA.forEach((it,i)=>{const q=document.createElement('div');q.className='q';const letter=['क','ख','ग','घ','ङ','च'][i]||i+1;if(TYPE==='mcq'){const text=document.createElement('div');text.textContent='('+letter+') '+it[0];q.appendChild(text);const opts=document.createElement('div');opts.className='opts';it[1].forEach((v,j)=>{const b=document.createElement('button');b.type='button';b.className='opt'+(state[i]===v?' sel':'');b.textContent='('+(j+1)+') '+v;b.onclick=()=>set(i,v);if(checked&&v===it[2])b.classList.add('good');else if(checked&&state[i]===v)b.classList.add('bad');opts.appendChild(b)});q.appendChild(opts)}else{const pieces=it[0].split('___');const line=document.createElement('div');line.append(document.createTextNode('('+letter+') '+pieces[0]));const slot=document.createElement('button');slot.type='button';slot.className='slot';slot.textContent=state[i]||'________';slot.title='ऊपर शब्द चुनें, फिर यहाँ क्लिक करें';slot.onclick=()=>{if(selected!==null)set(i,selected);else if(state[i])set(i,'')};slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();const w=e.dataTransfer.getData('text/plain');if(w)set(i,w)};if(checked)slot.classList.add(state[i]===it[1]?'good':'bad');line.append(slot,document.createTextNode(pieces.slice(1).join('___')));q.appendChild(line)}root.appendChild(q)});score.textContent='Marks: '+(checked?DATA.filter((it,i)=>state[i]===(TYPE==='mcq'?it[2]:it[1])).length:0)+' / '+DATA.length}document.getElementById('submit').onclick=()=>{checked=true;render()};document.getElementById('answer').onclick=()=>{DATA.forEach((it,i)=>state[i]=TYPE==='mcq'?it[2]:it[1]);save();checked=true;render()};document.getElementById('reset').onclick=()=>{state={};selected=null;checked=false;save();render()};render();</script></body></html>
