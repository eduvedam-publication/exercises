<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare the following fractions and put > or < in the box.</title><style>*{box-sizing:border-box}body{margin:0;background:#defaff;font-family:Georgia,serif;color:#222}.exercise{max-width:1000px;margin:18px auto;padding:24px;border:3px solid #00a9dc;border-radius:24px;background:white}h1{font-size:24px;color:#00a9dc;margin:0 0 20px}.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.q{background:#edfbff;border:1px solid #00b6ed;border-radius:12px;padding:14px;min-width:0}.qhead{font-size:18px;margin-bottom:10px}.fraction{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;min-width:30px;font-size:21px}.fraction span:first-child{border-bottom:1.5px solid #222;padding:0 4px 3px}.fraction span:last-child{padding-top:3px}.compare{display:flex;align-items:center;gap:8px;justify-content:center}.answer{width:48px;height:40px;border:2px solid #ff5262;background:#fff;text-align:center;font-size:25px;border-radius:4px}.answer.ok{border-color:#20a65b;background:#dff8e6}.answer.bad{border-color:#e73535;background:#ffe0e0;animation:blink .45s 3}@keyframes blink{50%{background:#ff7777}}.actions{display:flex;gap:12px;justify-content:center;margin-top:25px}button{border:0;background:#ff8500;color:white;border-radius:24px;padding:11px 21px;font-weight:bold;cursor:pointer}.status{text-align:center;color:#0056b9;font-size:16px;margin-top:12px;min-height:20px}.pictures{display:flex;gap:12px;justify-content:center;margin-bottom:12px}.circle{width:105px;height:105px;max-width:46%;touch-action:none;cursor:pointer}.slice{fill:#fff;stroke:#222;stroke-width:1.4;transition:fill .12s}.slice.coloured{fill:#ffca62}.tip{font:13px Arial;color:#566;text-align:center;margin:0 0 15px}@media(max-width:720px){.exercise{margin:0;border-radius:0;padding:14px}.questions{grid-template-columns:1fr}h1{font-size:21px}.circle{width:115px;height:115px}}</style></head><body><main class="exercise"><h1>Compare the following fractions and put > or < in the box.</h1><section class="questions"><div class="q"><div class="qhead"><b>a.</b></div><div class="compare"><span class="fraction"><span>4</span><span>5</span></span><input class="answer" data-id="q0" maxlength="1" aria-label="Comparison for a" autocomplete="off"><span class="fraction"><span>3</span><span>5</span></span></div></div><div class="q"><div class="qhead"><b>b.</b></div><div class="compare"><span class="fraction"><span>8</span><span>9</span></span><input class="answer" data-id="q1" maxlength="1" aria-label="Comparison for b" autocomplete="off"><span class="fraction"><span>4</span><span>9</span></span></div></div><div class="q"><div class="qhead"><b>c.</b></div><div class="compare"><span class="fraction"><span>9</span><span>14</span></span><input class="answer" data-id="q2" maxlength="1" aria-label="Comparison for c" autocomplete="off"><span class="fraction"><span>13</span><span>14</span></span></div></div><div class="q"><div class="qhead"><b>d.</b></div><div class="compare"><span class="fraction"><span>33</span><span>35</span></span><input class="answer" data-id="q3" maxlength="1" aria-label="Comparison for d" autocomplete="off"><span class="fraction"><span>34</span><span>35</span></span></div></div><div class="q"><div class="qhead"><b>e.</b></div><div class="compare"><span class="fraction"><span>8</span><span>11</span></span><input class="answer" data-id="q4" maxlength="1" aria-label="Comparison for e" autocomplete="off"><span class="fraction"><span>6</span><span>11</span></span></div></div><div class="q"><div class="qhead"><b>f.</b></div><div class="compare"><span class="fraction"><span>45</span><span>51</span></span><input class="answer" data-id="q5" maxlength="1" aria-label="Comparison for f" autocomplete="off"><span class="fraction"><span>49</span><span>51</span></span></div></div></section><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div class="status" id="status" aria-live="polite"></div></main><script>const KEY="math4-ch7-7b-compare";const expected={"q0": ">", "q1": ">", "q2": "<", "q3": "<", "q4": ">", "q5": "<"};let state={answers:{},colored:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function update(e){state.answers[e.dataset.id]=e.value;save();e.classList.remove('ok','bad');document.getElementById('status').textContent=''}document.querySelectorAll('.answer').forEach(e=>{e.value=state.answers[e.dataset.id]||'';e.addEventListener('input',()=>update(e))});document.querySelectorAll('.slice').forEach(s=>{if(state.colored[s.dataset.id])s.classList.add('coloured');s.addEventListener('click',()=>{s.classList.toggle('coloured');state.colored[s.dataset.id]=s.classList.contains('coloured');save()})});function checkAnswers(){let ok=0;document.querySelectorAll('.answer').forEach(e=>{const good=e.value.trim()===expected[e.dataset.id];e.classList.remove('ok','bad');e.classList.add(good?'ok':'bad');if(good)ok++});document.getElementById('status').textContent=ok===Object.keys(expected).length?'All answers are correct!':'Please correct the red highlighted answers.';save()}function resetExercise(){state={answers:{},colored:{}};save();document.querySelectorAll('.answer').forEach(e=>{e.value='';e.classList.remove('ok','bad')});document.querySelectorAll('.slice').forEach(s=>s.classList.remove('coloured'));document.getElementById('status').textContent=''}</script></body></html>
