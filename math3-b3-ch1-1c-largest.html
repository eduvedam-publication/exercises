<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}.ex{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{margin:0 0 24px;color:#00a5dc;font-size:25px}.actions{display:flex;justify-content:center;gap:14px;margin-top:28px}.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:700px){body{padding:0}.ex{padding:15px;border-radius:0}}.largest{display:grid;grid-template-columns:35px 1fr;gap:10px;margin:18px 0}.lab{font:20px Georgia}.nums{display:flex;flex-wrap:wrap;gap:18px 30px}.nums button{min-width:110px;border:2px solid transparent;border-radius:50%;background:#fff;padding:13px 18px;font:20px Georgia;cursor:pointer}.nums button.sel{border-color:#ff1680;background:#fff4f8}</style></head><body><main class="ex"><h1>Encircle the largest number.</h1><div class="largest" data-a="8349"><span class="lab">a.</span><div class="nums"><button data-v="6981">6981</button><button data-v="8349">8349</button><button data-v="7110">7110</button><button data-v="8126">8126</button></div></div><div class="largest" data-a="8126"><span class="lab">b.</span><div class="nums"><button data-v="5074">5074</button><button data-v="2683">2683</button><button data-v="6590">6590</button><button data-v="6001">6001</button><button data-v="8126">8126</button><button data-v="5646">5646</button></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 2</div></main><script>document.querySelectorAll(".largest").forEach(q=>q.querySelectorAll("button").forEach(b=>b.onclick=()=>{q.querySelectorAll("button").forEach(x=>x.classList.remove("sel","ok","bad"));b.classList.add("sel");q.dataset.p=b.dataset.v}));function check(){let s=0;document.querySelectorAll(".largest").forEach(q=>{let p=q.dataset.p;q.querySelectorAll("button").forEach(b=>{b.classList.remove("ok","bad");if(b.dataset.v===p)b.classList.add(p===q.dataset.a?"ok":"bad")});if(p===q.dataset.a)s++});score.textContent=`Score: ${s} / 2`}function resetAll(){document.querySelectorAll(".largest").forEach(q=>{delete q.dataset.p;q.querySelectorAll("button").forEach(b=>b.className="")});score.textContent="Score: 0 / 2"}</script></body></html>
