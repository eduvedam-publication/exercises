<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 - Chapter 8 - Exercise 8(b)</title><style>
*{box-sizing:border-box}body{margin:0;background:#dffaff;font-family:Arial,sans-serif;color:#292929}.exercise{max-width:1000px;margin:24px auto;padding:26px 30px;background:white;border:3px solid #00ade0;border-radius:25px}h1{font:700 25px Georgia,serif;color:#00a9dc;margin:0 0 23px}.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px 16px}.question{display:flex;align-items:center;gap:7px;font:20px Georgia,serif;white-space:nowrap;min-width:0}.num{min-width:21px}.mixed{display:inline-flex;align-items:center;gap:5px}.fraction{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;min-width:33px;vertical-align:middle}.fraction .top{border-bottom:1.5px solid #222;padding:0 5px 4px;text-align:center;width:100%}.fraction .bottom{padding:4px 5px 0;text-align:center}.answer{width:91px;min-width:0;border:2px solid #ff5161;background:white;border-radius:3px;padding:7px 5px;font:18px Arial,sans-serif;outline:none}.answer:focus{border-color:#00a9dc}.answer.correct{border-color:#12a451;background:#dff9e8}.answer.incorrect{border-color:#ef303c;background:#ffe3e6;animation:blink .32s linear 3}@keyframes blink{50%{background:#ff9da7}}.actions{display:flex;justify-content:center;gap:12px;margin-top:35px}button{background:#ff8200;color:#fff;border:0;border-radius:25px;padding:12px 22px;font-weight:bold;cursor:pointer}.score{text-align:center;color:#0055b8;font-size:21px;font-weight:bold;margin-top:15px}@media(max-width:800px){.questions{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:530px){.exercise{margin:8px;padding:19px 15px}.questions{grid-template-columns:1fr;gap:17px}.question{font-size:19px}h1{font-size:23px}}
</style></head><body><main class="exercise"><h1>Express as decimals.</h1><div class="questions" id="questions"></div><div class="actions"><button type="button" onclick="checkAnswers()">Check Answers</button><button type="button" onclick="resetExercise()">Reset</button></div><div class="score" id="score">Score: 0 / 10</div></main><script>
const data=[['a','',6,10,'0.6'],['b','',9,100,'0.09'],['c','',79,100,'0.79'],['d','',48,1000,'0.048'],['e','2',2,100,'2.02'],['f','3',345,1000,'3.345'],['g','',11,100,'0.11'],['h','3',125,1000,'3.125'],['i','3',11,1000,'3.011'],['j','2',279,1000,'2.279']];
const wrap=document.getElementById('questions');data.forEach(([letter,whole,top,bottom,answer])=>{const row=document.createElement('label');row.className='question';row.innerHTML=`<span class="num">${letter}.</span><span class="mixed">${whole?`<span>${whole}</span>`:''}<span class="fraction"><span class="top">${top}</span><span class="bottom">${bottom}</span></span></span><input class="answer" data-answer="${answer}" inputmode="decimal" autocomplete="off" aria-label="Answer ${letter}">`;wrap.appendChild(row)});
const KEY='math-4-ch8-8b-express-decimals-v1',inputs=[...document.querySelectorAll('.answer')];function save(){try{localStorage.setItem(KEY,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}function restore(){try{const values=JSON.parse(localStorage.getItem(KEY)||'[]');inputs.forEach((x,i)=>x.value=values[i]||'')}catch(e){}}inputs.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('correct','incorrect');save()}));function checkAnswers(){let score=0;inputs.forEach(x=>{const ok=x.value.trim()===x.dataset.answer;x.classList.remove('correct','incorrect');void x.offsetWidth;x.classList.add(ok?'correct':'incorrect');if(ok)score++});document.getElementById('score').textContent=`Score: ${score} / ${inputs.length}`;save()}function resetExercise(){inputs.forEach(x=>{x.value='';x.classList.remove('correct','incorrect')});document.getElementById('score').textContent='Score: 0 / 10';try{localStorage.removeItem(KEY)}catch(e){}}restore();
</script></body></html>
