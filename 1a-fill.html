<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#e9faff;font-family:Arial}.card{max-width:950px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{color:#009ed2}.table{border:2px solid #a9e9fb;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:90px 180px 1fr;background:#f7fbfd;border-bottom:2px solid #a9e9fb;min-height:64px}.row:last-child{border:0}.head{background:#fff0c9;font-weight:bold}.cell{display:flex;align-items:center;padding:12px;border-right:2px solid #a9e9fb;font-size:18px}.cell:last-child{border:0}.c{justify-content:center}input{width:100%;border:0;border-bottom:2px solid #777;padding:7px;font-size:18px}.ok{background:#dcf8df}.bad{background:#ffe1e1}.actions{display:flex;justify-content:center;gap:14px;margin-top:25px}button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:bold}#result{text-align:center;font-size:22px;font-weight:bold;color:#064bb4;margin-top:20px}@media(max-width:650px){.card{margin:0;border-radius:0;padding:14px}.row{grid-template-columns:55px 110px 1fr}.cell,input{font-size:15px;padding:8px}}
</style>
<main class=card><h1>Fill in the blanks.</h1><div class=table>
<div class="row head"><div class="cell c">S. No.</div><div class="cell c">Numeral</div><div class="cell c">Number Name</div></div>
<div class=row><div class="cell c">a.</div><div class="cell c">203</div><div class=cell><input id=a0></div></div>
<div class=row><div class="cell c">b.</div><div class=cell><input id=a1></div><div class=cell>One hundred sixty-three</div></div>
<div class=row><div class="cell c">c.</div><div class=cell><input id=a2></div><div class=cell>Three hundred fourteen</div></div>
<div class=row><div class="cell c">d.</div><div class="cell c">401</div><div class=cell><input id=a3></div></div>
</div><div class=actions><button onclick=check()>Check Answers</button><button onclick=resetAll()>Reset</button></div><div id=result>Score: 0 / 4</div></main>
<script>
const A=["Two hundred three","163","314","Four hundred one"];
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");
function check(){let n=0;A.forEach((a,i)=>{let e=document.getElementById("a"+i),k=norm(e.value)==norm(a);e.className=k?"ok":"bad";if(k)n++});result.textContent=`Score: ${n} / 4`}
function resetAll(){A.forEach((_,i)=>{let e=document.getElementById("a"+i);e.value="";e.className=""});result.textContent="Score: 0 / 4"}
</script>
