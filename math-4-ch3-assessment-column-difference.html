<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write in column and find the difference.</title><style>*{box-sizing:border-box}body{margin:0;background:#e1faff;font-family:Georgia,serif}.page{max-width:1000px;margin:18px auto;background:white;border:3px solid #00a9da;border-radius:22px;padding:24px}h2{color:#00a9da;font-size:24px;margin:0 0 15px}.q{margin:13px 0;line-height:1.5}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:7px}.opt{background:#fff;border:1px solid #92d9ec;border-radius:7px;text-align:left;padding:9px;cursor:pointer;font:17px Georgia}.opt.sel{background:#dcf5ff;border-color:#00a9da}.ok{background:#d9f9df!important;border-color:#16a852!important}.bad{background:#ffe1e1!important;border-color:red!important;animation:blink .35s 2}@keyframes blink{50%{background:#ff9ca0}}.sums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.sum{display:flex;align-items:flex-start;gap:8px}.tag{font-weight:bold;padding-top:12px}.board{background:#ffdbb8;padding:8px;flex:1;min-width:0}.board table{border-collapse:collapse;width:100%;table-layout:fixed;text-align:center;font-size:18px}.board td,.board th{border:1px solid #e4bfa3;height:35px;font-weight:normal}.board th{color:#ff1267}.board .result td{border-top:2px solid #00aee4;background:#f0ffff}.digit{width:100%;height:32px;border:2px solid #ff424f;text-align:center;font:19px Georgia;min-width:0}.inline{width:155px;max-width:45vw;height:34px;border:2px solid #ff4754;padding:3px 7px;font:17px Georgia}.textq{padding:8px 2px;font-size:18px}.actions{display:flex;justify-content:center;gap:12px;margin-top:24px}.actions button{background:#ff8500;color:#fff;border:0;border-radius:24px;padding:11px 19px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0050bc;font:700 21px Arial;margin-top:14px}@media(max-width:680px){.page{padding:12px;margin:6px}.sums,.opts{grid-template-columns:1fr}.board table{font-size:16px}.board td,.board th{height:30px}}</style></head><body><main class="page"><h2>Write in column and find the difference.</h2><div class="textq">a. 75488 − 54886 <input class="inline" data-id="0" data-group="0" inputmode="numeric" aria-label="Answer a"></div><div class="textq">b. 658545 − 254499 <input class="inline" data-id="1" data-group="1" inputmode="numeric" aria-label="Answer b"></div><div class="textq">c. 15475 − 9999 <input class="inline" data-id="2" data-group="2" inputmode="numeric" aria-label="Answer c"></div><div class="textq">d. 35846 − 18548 <input class="inline" data-id="3" data-group="3" inputmode="numeric" aria-label="Answer d"></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="reset()">Reset</button></div><div id="score">Score: 0 / 4</div></main><script>const answers={"0": "20602", "1": "404046", "2": "5476", "3": "17298"},kind="fill",key="math-4-ch3-assessment-column-difference";let picks={};const all=[...document.querySelectorAll('input[data-id]')];function save(){try{localStorage.setItem(key,JSON.stringify({values:Object.fromEntries(all.map(e=>[e.dataset.id,e.value])),picks,score:document.getElementById('score').textContent}))}catch(e){}}function pick(q,v){picks[q]=v;document.querySelectorAll('[data-q="'+q+'"]').forEach(e=>{e.classList.toggle('sel',+e.dataset.v===v);e.classList.remove('ok','bad')});save()}function check(){let correct=0;Object.keys(answers).forEach(q=>{let a=answers[q];if(kind==='mcq'){let yes=picks[q]===a;if(yes)correct++;document.querySelectorAll('[data-q="'+q+'"]').forEach(e=>{e.classList.remove('ok','bad');if(+e.dataset.v===picks[q])e.classList.add(yes?'ok':'bad')})}else{let cells=all.filter(e=>e.dataset.group===q),value=cells.map(e=>e.value.trim()).join('').replace(/[\s,]/g,'');let yes=value===String(a);if(yes)correct++;cells.forEach(e=>{e.classList.toggle('ok',yes);e.classList.toggle('bad',!yes)})}});document.getElementById('score').textContent='Score: '+correct+' / '+Object.keys(answers).length;save();window.parent?.postMessage({exerciseType:kind==='mcq'?'OPTION':'FILL_BLANK',response:kind==='mcq'?picks:Object.fromEntries(all.map(e=>[e.dataset.id,e.value]))},'*')}function reset(){all.forEach(e=>{e.value='';e.classList.remove('ok','bad')});picks={};document.querySelectorAll('.opt').forEach(e=>e.classList.remove('sel','ok','bad'));document.getElementById('score').textContent='Score: 0 / '+Object.keys(answers).length;localStorage.removeItem(key)}all.forEach(e=>e.addEventListener('input',()=>{e.classList.remove('ok','bad');if(e.maxLength===1&&e.value.length===1){let cells=all.filter(x=>x.dataset.group===e.dataset.group),i=cells.indexOf(e);if(i>=0&&i<cells.length-1)cells[i+1].focus()}save()}));try{let d=JSON.parse(localStorage.getItem(key)||'null');if(d){all.forEach(e=>e.value=d.values?.[e.dataset.id]||'');Object.entries(d.picks||{}).forEach(([q,v])=>pick(q,+v));if(d.score)document.getElementById('score').textContent=d.score}}catch(e){}</script></body></html>
