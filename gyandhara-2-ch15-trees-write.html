t blanks=[...document.querySelectorAll('.blank')],inputs=[...document.querySelectorAll('input')];function persist(){localStorage.setItem(KEY,JSON.stringify({blanks:blanks.map(b=>b.textContent),inputs:inputs.map(x=>x.value)}))}function put(b,v){if(!b||!v)return;b.textContent=v;b.classList.add('filled');chosen=null;document.querySelectorAll('.word').forEach(w=>w.classList.remove('selected'));persist()}document.querySelectorAll('.word').forEach(w=>{w.draggable=true;w.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',w.textContent));w.addEventListener('click',()=>{chosen=w.textContent;document.querySelectorAll('.word').forEach(x=>x.classList.toggle('selected',x===w))})});blanks.forEach(b=>{b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();put(b,e.dataTransfer.getData('text/plain'))});b.addEventListener('click',()=>{if(chosen)put(b,chosen);else{b.textContent='';b.classList.remove('filled');persist()}})});inputs.forEach(i=>i.addEventListener('input',persist));function save(){persist();document.querySelector('.status').textContent='उत्तर सुरक्षित हैं।'}function resetAll(){blanks.forEach(b=>{b.textContent='';b.classList.remove('filled')});inputs.forEach(i=>i.value='');localStorage.removeItem(KEY);document.querySelector('.status').textContent=''}try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');blanks.forEach((b,i)=>{b.textContent=s.blanks?.[i]||'';b.classList.toggle('filled',!!b.textContent)});inputs.forEach((x,i)=>x.value=s.inputs?.[i]||'')}catch(e){}</script></body></html>
