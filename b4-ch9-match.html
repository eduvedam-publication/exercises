<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match the following.</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;font-family:Arial;background:#eaf8ff;color:#292929}.wrap{max-width:1000px;margin:auto;background:white;border:5px solid #08b6e8;border-radius:24px;padding:20px}h1{color:#ff0878;font-size:24px;margin:0 0 8px}.hint{text-align:center;color:#666;margin-bottom:12px}.board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:110px;padding:10px 25px;min-height:360px}.col{display:flex;flex-direction:column;justify-content:space-around;gap:14px;z-index:2}.item{position:relative;border:2px solid #ff7b32;border-radius:14px;background:#fff;padding:13px 35px 13px 14px;font-size:17px;min-height:50px;display:flex;align-items:center;cursor:pointer;user-select:none}.right .item{padding:13px 14px 13px 35px}.dot{position:absolute;width:18px;height:18px;border:3px solid #08b6e8;background:#fff;border-radius:50%;top:50%;transform:translateY(-50%)}.left .dot{right:-10px}.right .dot{left:-10px}.selected{box-shadow:0 0 0 4px #b9e9ff}.used{background:#f0fbff}.correct{background:#dcf7dc!important;border-color:#27843a!important}.wrong{background:#ffdede!important;border-color:#c62828!important}svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}line{stroke:#ff3b1f;stroke-width:3;stroke-linecap:round}.score{text-align:center;color:#064bad;font-size:21px;font-weight:bold;margin:12px}.actions{text-align:center}.btn{border:0;border-radius:22px;padding:11px 22px;margin:4px;background:#ff7b00;color:white;font-weight:bold;cursor:pointer}@media(max-width:650px){.wrap{padding:10px;border-width:3px}.board{gap:38px;padding:5px 8px;min-height:390px}h1{font-size:19px}.item{font-size:13px;padding:9px 23px 9px 8px}.right .item{padding:9px 8px 9px 23px}.dot{width:14px;height:14px}.left .dot{right:-8px}.right .dot{left:-8px}}
</style></head><body><div class="wrap"><h1>Match the following.</h1><div class="hint">Tap an item on the left, then tap its matching item on the right.</div><div class="board" id="board"><svg id="svg"></svg><div class="col left" id="L"></div><div class="col right" id="R"></div></div><div class="score" id="score">Score: 0 / 5</div><div class="actions"><button class="btn" onclick="check()">Check Answers</button><button class="btn" onclick="reset()">Reset</button></div></div>
<script>
const Q=[["1. Wilma's father", "iii. railway porter"], ["2. Wilma's mother", "i. worked as a maid"], ["3. Metal brace", "v. helped Wilma walk"], ["4. Athletic coach", "ii. noticed her athletic talent"], ["5. Perseverance", "iv. helps us achieve our goals"]], O=["i. worked as a maid", "ii. noticed her athletic talent", "iii. railway porter", "iv. helps us achieve our goals", "v. helped Wilma walk"];let pick=null,M={};
function e(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){L.innerHTML='';R.innerHTML='';Q.forEach((p,i)=>{let d=document.createElement('div');d.className='item';d.dataset.i=i;d.innerHTML='<span>'+e(p[0])+'</span><i class="dot"></i>';d.onclick=()=>left(i);L.append(d)});O.forEach((v,i)=>{let d=document.createElement('div');d.className='item';d.dataset.i=i;d.innerHTML='<i class="dot"></i><span>'+e(v)+'</span>';d.onclick=()=>right(i);R.append(d)});requestAnimationFrame(lines)}
function left(i){pick=i;document.querySelectorAll('.left .item').forEach(x=>x.classList.toggle('selected',+x.dataset.i===i))}
function right(j){if(pick===null)return;Object.keys(M).forEach(k=>{if(M[k]===j)delete M[k]});M[pick]=j;pick=null;document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected','correct','wrong','used'));Object.entries(M).forEach(([a,b])=>{document.querySelector('.left .item[data-i="'+a+'"]').classList.add('used');document.querySelector('.right .item[data-i="'+b+'"]').classList.add('used')});lines()}
function lines(){svg.innerHTML='';let br=board.getBoundingClientRect();Object.entries(M).forEach(([a,b])=>{let x=document.querySelector('.left .item[data-i="'+a+'"] .dot').getBoundingClientRect(),y=document.querySelector('.right .item[data-i="'+b+'"] .dot').getBoundingClientRect(),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',x.left+x.width/2-br.left);l.setAttribute('y1',x.top+x.height/2-br.top);l.setAttribute('x2',y.left+y.width/2-br.left);l.setAttribute('y2',y.top+y.height/2-br.top);svg.append(l)})}
function check(){let s=0;document.querySelectorAll('.item').forEach(x=>x.classList.remove('correct','wrong'));Q.forEach((p,i)=>{if(M[i]===undefined)return;let ok=O[M[i]]===p[1],a=document.querySelector('.left .item[data-i="'+i+'"]'),b=document.querySelector('.right .item[data-i="'+M[i]+'"]');a.classList.add(ok?'correct':'wrong');b.classList.add(ok?'correct':'wrong');if(ok)s++});score.textContent='Score: '+s+' / '+Q.length}
function reset(){pick=null;M={};score.textContent='Score: 0 / '+Q.length;render()}window.addEventListener('resize',lines);render();
</script></body></html>
