<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match the following.</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;background:#f5faff;color:#183248;font-family:Arial,sans-serif}.sheet{width:min(980px,100%);padding:26px 30px;background:#fff;border:1px solid #dce8f2;border-radius:18px;box-shadow:0 8px 26px #164d7811}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(24px,3vw,31px);color:#008deb;margin:0}.badge{border:1px solid #a9ddff;background:#ecf8ff;border-radius:24px;padding:7px 13px;white-space:nowrap;color:#006eaf;font-weight:700}.hint{font-size:14px;color:#5c7182;margin:8px 0 14px;padding-bottom:15px;border-bottom:1px solid #e8f0f6}.matchbox{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:clamp(75px,16vw,170px);padding-top:4px}.column{display:grid;grid-template-rows:repeat(var(--count),minmax(44px,auto));gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:2;width:100%;min-height:54px;border:1.5px solid #d8e5ef;border-radius:13px;background:#f8fbfe;padding:8px 14px;font:700 clamp(15px,1.65vw,19px) Arial,sans-serif;text-align:left;color:#17334a;cursor:pointer}.item.right{flex-direction:row;text-align:right}.item:hover,.item.pending{border-color:#00a9ff;background:#eaf8ff}.item.correct{border-color:#55c89e;background:#f0fff8}.item.wrong{border-color:#e52c3b;background:#ffeded}.item.blink{animation:redblink .34s 6 alternate}@keyframes redblink{from{background:#fff;border-color:#e52c3b}to{background:#ff7777;border-color:#b60000}}.port{flex:none;width:17px;height:17px;border:2px solid #bed4e4;border-radius:50%;background:white}.item.pending .port{border-color:#008eff;background:#008eff}.item.correct .port{border-color:#079d70;background:#079d70}.item.wrong .port{border-color:#e52c3b;background:#e52c3b}.item .label{color:#567790;font-weight:600}.item.right .content{flex:1}.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}.lines path{fill:none;stroke:#1674e8;stroke-width:3;stroke-linecap:round}.lines path.correct{stroke:#079d70}.lines path.wrong{stroke:#e52c3b}.lines path.blink{animation:lineblink .34s 6 alternate}@keyframes lineblink{from{opacity:.12}to{opacity:1}}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:19px}.actions button{background:#ff7300;color:white;border:0;border-radius:23px;padding:10px 19px;font-weight:700;cursor:pointer}#score{text-align:center;color:#005ad9;font-weight:700;margin:10px 0 0}.item:focus-visible,.actions button:focus-visible{outline:3px solid #005ac0;outline-offset:2px}@media(max-width:640px){.sheet{padding:18px 12px}.matchbox{column-gap:52px}.column{gap:6px}.item{min-height:45px;padding:6px;font-size:13px}.port{width:13px;height:13px}.hint{font-size:12px}}@media(max-height:800px) and (min-width:640px){.sheet{padding:16px 24px}.column{gap:5px}.item{min-height:44px;padding:6px 11px}.hint{padding-bottom:8px}.actions{margin-top:12px}}</style></head><body><main class="sheet"><div class="head"><h1>Match the following.</h1><span class="badge" id="badge">Pairs: 0 / 4</span></div><p class="hint">Click an item on the left, then click its match on the right. Wrong matches blink red.</p><div class="matchbox" style="--count:4"><svg class="lines" aria-hidden="true"></svg><div class="column"><button type="button" class="item left" data-side="left" data-index="0" aria-label="Left 1: Bigger of 5.6 and 6.5"><span class="content"><span class="label">(a)</span> Bigger of 5.6 and 6.5</span><span class="port"></span></button><button type="button" class="item left" data-side="left" data-index="1" aria-label="Left 2: Decimal of 65/1000"><span class="content"><span class="label">(b)</span> Decimal of 65/1000</span><span class="port"></span></button><button type="button" class="item left" data-side="left" data-index="2" aria-label="Left 3: 0.22 × 10000"><span class="content"><span class="label">(c)</span> 0.22 × 10000</span><span class="port"></span></button><button type="button" class="item left" data-side="left" data-index="3" aria-label="Left 4: 124.32 ÷ 10"><span class="content"><span class="label">(d)</span> 124.32 ÷ 10</span><span class="port"></span></button></div><div class="column"><button type="button" class="item right" data-side="right" data-index="0" aria-label="Right 1: 0.065"><span class="port"></span><span class="content">0.065 <span class="label">(i)</span></span></button><button type="button" class="item right" data-side="right" data-index="1" aria-label="Right 2: 12.432"><span class="port"></span><span class="content">12.432 <span class="label">(ii)</span></span></button><button type="button" class="item right" data-side="right" data-index="2" aria-label="Right 3: 6.5"><span class="port"></span><span class="content">6.5 <span class="label">(iii)</span></span></button><button type="button" class="item right" data-side="right" data-index="3" aria-label="Right 4: 2200"><span class="port"></span><span class="content">2200 <span class="label">(iv)</span></span></button></div></div><div class="actions"><button id="submit" type="button">Submit</button><button id="show" type="button">Show Answer</button><button id="reset" type="button">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 4</p></main><script>const answer=[2, 0, 3, 1],key='exercise:math-5-ch5-assessment-matching.html',pairs=Array(answer.length).fill(null),left=[...document.querySelectorAll('.item.left')],right=[...document.querySelectorAll('.item.right')],box=document.querySelector('.matchbox'),svg=document.querySelector('.lines'),score=document.getElementById('score'),badge=document.getElementById('badge');let pending=null,submitted=false;function save(){try{localStorage.setItem(key,JSON.stringify(pairs))}catch(e){}}function clearGrade(){submitted=false;score.textContent='Marks: 0 / '+answer.length}function redraw(){svg.replaceChildren();let rect=box.getBoundingClientRect();pairs.forEach((j,i)=>{if(j===null)return;let a=left[i].querySelector('.port').getBoundingClientRect(),b=right[j].querySelector('.port').getBoundingClientRect(),x1=a.left+a.width/2-rect.left,y1=a.top+a.height/2-rect.top,x2=b.left+b.width/2-rect.left,y2=b.top+b.height/2-rect.top,path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x1} ${y1} C ${x1+(x2-x1)*.48} ${y1}, ${x2-(x2-x1)*.48} ${y2}, ${x2} ${y2}`);path.dataset.left=i;if(j===answer[i])path.classList.add('correct');else if(submitted)path.classList.add('wrong');svg.appendChild(path)})}function paint(){left.forEach((b,i)=>{b.classList.toggle('pending',pending===i);b.classList.toggle('correct',pairs[i]===answer[i]);b.classList.toggle('wrong',submitted&&pairs[i]!==null&&pairs[i]!==answer[i])});right.forEach((b,j)=>{let i=pairs.indexOf(j);b.classList.toggle('correct',i>=0&&answer[i]===j);b.classList.toggle('wrong',submitted&&i>=0&&answer[i]!==j)});badge.textContent='Pairs: '+pairs.filter((v,i)=>v===answer[i]).length+' / '+answer.length;redraw()}function flash(i,j){let a=left[i],b=right[j];[a,b].forEach(x=>{x.classList.remove('blink');void x.offsetWidth;x.classList.add('wrong','blink')});let path=[...svg.children].find(x=>+x.dataset.left===i);if(path)path.classList.add('wrong','blink');setTimeout(()=>{[a,b].forEach(x=>x.classList.remove('blink','wrong'));paint()},2100)}try{let old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old)&&old.length===answer.length)old.forEach((v,i)=>{if(v===null||Number.isInteger(v)&&v>=0&&v<answer.length)pairs[i]=v})}catch(e){}left.forEach((b,i)=>b.onclick=()=>{pending=i;paint()});right.forEach((b,j)=>b.onclick=()=>{if(pending===null)return;let i=pending;pairs.forEach((v,k)=>{if(v===j)pairs[k]=null});pairs[i]=j;pending=null;clearGrade();paint();save();if(answer[i]!==j)flash(i,j)});window.addEventListener('resize',redraw);if(window.ResizeObserver)new ResizeObserver(redraw).observe(box);paint();document.getElementById('submit').onclick=()=>{let marks=pairs.filter((v,i)=>v===answer[i]).length;submitted=true;paint();pairs.forEach((j,i)=>{if(j!==null&&j!==answer[i])flash(i,j)});score.textContent=`Marks: ${marks} / ${answer.length}`;save();let detail={exerciseType:'MATCHING',exerciseId:'math-5-ch5-assessment-matching.html',response:Object.fromEntries(pairs.map((j,i)=>['question'+(i+1),j===null?'':String(j)])),marks,total:answer.length};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')};document.getElementById('show').onclick=()=>{answer.forEach((v,i)=>pairs[i]=v);pending=null;clearGrade();paint();save()};document.getElementById('reset').onclick=()=>{pairs.fill(null);pending=null;clearGrade();paint();save()};</script></body></html>
