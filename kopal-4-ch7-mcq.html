<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का निशान लगाएँ–</title><style>*{box-sizing:border-box}body{margin:0;background:#cff9ff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#19212b}.wrap{max-width:980px;margin:24px auto;padding:24px;border:3px solid #00aeed;border-radius:22px;background:white}h2{color:#00a5e6;margin:0 0 20px;font-size:27px}.q{background:#ebfaff;border:1.5px solid #00b7ff;border-radius:12px;margin:9px 0;padding:14px;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.opt{background:white;border:1px solid #92dfff;border-radius:9px;padding:11px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:18px}.opt.selected{background:#dbf2ff;border:2px solid #00a6ef}.correct{background:#d9ffe8!important;border-color:#19a65a!important}.wrong{background:#ffe4e4!important;border-color:#f34d4d!important}.controls{text-align:center;margin-top:24px}button.action{border:0;border-radius:24px;background:#ff7900;color:white;font-weight:bold;padding:11px 19px;margin:3px;cursor:pointer}.marks{text-align:center;color:#0048bf;font-weight:bold;font-size:19px;margin-top:10px}.bank{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;background:#dff8ff;border-radius:12px;padding:14px;margin-bottom:14px}.chip{background:white;border:1.5px solid #00aaff;border-radius:9px;padding:8px 13px;cursor:grab;font-size:19px}.chip.active{background:#ffe6c2;border-color:#ff7b00}.chip.used{opacity:.35}.blank{display:inline-flex;min-width:140px;min-height:39px;align-items:center;justify-content:center;border:2px dashed #ff704d;border-radius:8px;vertical-align:middle;margin:0 5px;padding:4px 9px;cursor:pointer;background:white;font-size:18px}.example{background:#d6ffea;border:2px solid #13a65e;border-radius:7px;padding:5px 10px}.rowq{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.word{min-width:105px;font-weight:bold}@media(max-width:650px){.wrap{margin:6px;padding:13px}.opts{grid-template-columns:1fr}h2{font-size:23px}.q{font-size:17px}}
.opts{grid-template-columns:repeat(3,minmax(0,1fr))}.opt{font-family:inherit;text-align:left}.opt .square{width:24px;height:24px;border:2px solid #00b5f5;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.opt.selected .square::after{content:'✓';color:#005dc2}.question{font-size:19px;margin-bottom:9px}.sub{font-size:16px;color:#555} @media(max-width:650px){.opts{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ–</h2><div id="questions"></div><div class="controls"><button class="action" onclick="check()">Submit</button><button class="action" onclick="showAnswer()">Show Answer</button><button class="action" onclick="resetAll()">Reset</button></div><div class="marks" id="marks">Marks: 0 / 5</div><script>const KEY="kopal-4-ch7-mcq.html",data=[["जगदीश चंद्र बसु का जन्म हुआ था–", ["बंगाल में", "मद्रास में", "पंजाब में"], 0], ["जगदीश चंद्र बसु के पिता का नाम था–", ["भगवती चंद्र बसु", "भगवान चंद्र बसु", "भवानी चंद्र बसु"], 1], ["बचपन में जगदीश चंद्र बसु की रुचि किसमें थी?", ["खेल-कूद में", "पेड़-पौधों में", "शस्त्र चलाने में"], 1], ["अहसास का अर्थ है–", ["अनुभूति", "हर्ष", "लकड़ी"], 0], ["यह बेमेल है–", ["असंभव", "अनुचित", "अपमान"], 1]];let state=JSON.parse(localStorage.getItem(KEY)||'{}');function save(){localStorage.setItem(KEY,JSON.stringify(state))}function render(){let box=document.getElementById('questions');box.innerHTML='';data.forEach((q,i)=>{let d=document.createElement('div');d.className='q';let p=document.createElement('div');p.className='question';p.textContent='('+['क','ख','ग','घ'][i]+') '+q[0];d.append(p);let opts=document.createElement('div');opts.className='opts';q[1].forEach((o,j)=>{let b=document.createElement('button');b.type='button';b.className='opt'+(state[i]===j?' selected':'');b.innerHTML='<span>'+['(i)','(ii)','(iii)'][j]+' '+o+'</span><span class="square"></span>';b.onclick=()=>{state[i]=j;save();render()};opts.append(b)});d.append(opts);box.append(d)})}function check(){let n=0;document.querySelectorAll('.q').forEach((q,i)=>{q.querySelectorAll('.opt').forEach((o,j)=>{o.classList.remove('correct','wrong');if(state[i]===j){let ok=j===data[i][2];o.classList.add(ok?'correct':'wrong');if(ok)n++}})});document.getElementById('marks').textContent='Marks: '+n+' / 5'}function showAnswer(){data.forEach((q,i)=>state[i]=q[2]);save();render();check()}function resetAll(){state={};save();render();document.getElementById('marks').textContent='Marks: 0 / 5'}render();</script></main></body></html>
