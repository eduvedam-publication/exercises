<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#e8faff;font-family:Arial,sans-serif}.ex{max-width:1100px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:26px;padding:28px}h1{color:#00a5dc;font-size:24px;margin:0 0 22px}.actions{text-align:center;margin-top:28px}.actions button{border:0;border-radius:22px;padding:11px 20px;margin:5px;background:#ff8200;color:#fff;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:21px;font-weight:bold;margin-top:12px}.ans{border:2px solid #ff3b30;height:36px;font-size:17px;padding:4px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:700px){body{padding:0}.ex{padding:15px;border-radius:0}}.simplegrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 60px}.q{display:flex;align-items:center;gap:7px;font:20px Georgia,serif}.q .ans{width:100px}@media(max-width:650px){.simplegrid{grid-template-columns:1fr}}</style></head><body><main class="ex"><h1>Find the difference.</h1><div class="simplegrid"><div class="q"><span>a. &nbsp; 5654 − 4230 =</span><input class="ans" id="a0"></div><div class="q"><span>b. &nbsp; 3906 −</span><input class="ans" id="a1"><span>= 1303</span></div><div class="q"><span>c. &nbsp; 8438 − 6217 =</span><input class="ans" id="a2"></div><div class="q"><span>d. &nbsp; 4256 −</span><input class="ans" id="a3"><span>= 2134</span></div><div class="q"><span>e. &nbsp; 9741 − 7620 =</span><input class="ans" id="a4"></div><div class="q"><span>f. &nbsp; 8357 −</span><input class="ans" id="a5"><span>= 2123</span></div></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 6</div></main><script>const ans=['1424', '2603', '2221', '2122', '2121', '6234'];function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById('a'+i),ok=e.value.trim()===a;e.className='ans '+(ok?'ok':'bad');if(ok)s++});score.textContent=`Score: ${s} / 6`}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.className='ans'});score.textContent='Score: 0 / 6'}</script></body></html>
