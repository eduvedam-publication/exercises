<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>True or False.</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;background:#b9fbff;color:#172735;font-family:Georgia,'Times New Roman',serif}.sheet{width:min(1050px,100%);padding:22px 24px;background:white;border:3px solid #00a9f4;border-radius:20px}h1{font:700 clamp(23px,3vw,32px) Arial,sans-serif;color:#009ff0;margin:0 0 17px}.bar{height:20px;border-radius:30px;background:#bff5fb;margin:0 0 12px}.question{background:#d9f8ff;border:1.5px solid #00a9ff;border-radius:11px;padding:12px 14px;margin:9px 0;font-size:clamp(16px,1.7vw,20px)}.prompt{margin:0 0 9px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{background:white;border:1.5px solid #00a9ff;border-radius:9px;padding:9px 12px;font:inherit;color:#172735;cursor:pointer;min-height:44px}.choice:hover{background:#eafdff}.choice.selected{background:#9deaf7;border-color:#008ed0;box-shadow:inset 0 0 0 1px #008ed0}.choice.correct{background:#e4ffed;border-color:#20a953}.choice.wrong{background:#fff0f0;border-color:#e62c38}.choice:focus-visible,button:focus-visible{outline:3px solid #005ac0;outline-offset:2px}.feedback{display:inline-block;font:700 14px Arial,sans-serif;margin-top:8px}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:21px}.actions button{background:#ff7000;color:white;border:0;border-radius:24px;padding:11px 19px;font-weight:700;cursor:pointer}#score{text-align:center;color:#003bea;font:700 21px Arial,sans-serif;margin:11px 0 0}.note{font:13px Arial;color:#565d65;margin:10px 0 0}@media(max-width:620px){.sheet{padding:16px 12px}.question{padding:10px}.choice{padding:8px 10px}}@media(max-height:700px) and (min-width:800px){.sheet{padding:16px 20px}.question{padding:9px 12px;margin:7px 0}.bar{height:13px}.actions{margin-top:13px}}</style></head><body><main class="sheet"><h1>True or False.</h1><div class="bar" aria-hidden="true"></div><section class="question" aria-labelledby="prompt0"><p class="prompt" id="prompt0">a. +9 = −9</p><div class="choices" role="group" aria-label="Choices for question a"><button type="button" class="choice" data-question="0" data-choice="0" aria-pressed="false">True</button><button type="button" class="choice" data-question="0" data-choice="1" aria-pressed="false">False</button></div><span class="feedback" id="f0" aria-live="polite"></span></section><section class="question" aria-labelledby="prompt1"><p class="prompt" id="prompt1">b. +93 = 93</p><div class="choices" role="group" aria-label="Choices for question b"><button type="button" class="choice" data-question="1" data-choice="0" aria-pressed="false">True</button><button type="button" class="choice" data-question="1" data-choice="1" aria-pressed="false">False</button></div><span class="feedback" id="f1" aria-live="polite"></span></section><section class="question" aria-labelledby="prompt2"><p class="prompt" id="prompt2">c. 76 + 3 = −79</p><div class="choices" role="group" aria-label="Choices for question c"><button type="button" class="choice" data-question="2" data-choice="0" aria-pressed="false">True</button><button type="button" class="choice" data-question="2" data-choice="1" aria-pressed="false">False</button></div><span class="feedback" id="f2" aria-live="polite"></span></section><section class="question" aria-labelledby="prompt3"><p class="prompt" id="prompt3">d. 31 is the opposite of −31</p><div class="choices" role="group" aria-label="Choices for question d"><button type="button" class="choice" data-question="3" data-choice="0" aria-pressed="false">True</button><button type="button" class="choice" data-question="3" data-choice="1" aria-pressed="false">False</button></div><span class="feedback" id="f3" aria-live="polite"></span></section><section class="question" aria-labelledby="prompt4"><p class="prompt" id="prompt4">e. Loss in a deal is shown by a negative integer</p><div class="choices" role="group" aria-label="Choices for question e"><button type="button" class="choice" data-question="4" data-choice="0" aria-pressed="false">True</button><button type="button" class="choice" data-question="4" data-choice="1" aria-pressed="false">False</button></div><span class="feedback" id="f4" aria-live="polite"></span></section><div class="actions"><button id="submit" type="button">Submit</button><button id="show" type="button">Show Answer</button><button id="reset" type="button">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 5</p></main><script>const answers=[[1], [0], [1], [0], [0]],key='exercise:math-5-ch11-11e-true-false.html',selected=Array(answers.length).fill(null),score=document.getElementById('score');const buttons=[...document.querySelectorAll('.choice')];function paint(){buttons.forEach(b=>{const on=selected[Number(b.dataset.question)]===Number(b.dataset.choice);b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on?'true':'false')})}function save(){try{localStorage.setItem(key,JSON.stringify(selected))}catch(e){}}function clearMarks(){buttons.forEach(b=>b.classList.remove('correct','wrong'));answers.forEach((_,i)=>{const f=document.getElementById('f'+i);f.textContent='';f.className='feedback'});score.textContent='Marks: 0 / '+answers.length}try{let old=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(old)&&old.length===answers.length&&old.every(x=>x===null||Number.isInteger(x)))old.forEach((v,i)=>selected[i]=v);else if(Array.isArray(old)&&old.length===buttons.length){answers.forEach((_,i)=>{const j=old.slice(i*4,i*4+4).findIndex(x=>x===true);if(j>=0)selected[i]=j})}}catch(e){}paint();buttons.forEach(b=>b.addEventListener('click',()=>{selected[Number(b.dataset.question)]=Number(b.dataset.choice);paint();clearMarks();save()}));document.getElementById('submit').onclick=()=>{let marks=0;answers.forEach((valid,i)=>{const good=valid.includes(selected[i]);marks+=good;const f=document.getElementById('f'+i);f.textContent=good?'✓ Correct':'✗ Wrong';f.className='feedback '+(good?'ok':'no');const choice=buttons.find(b=>Number(b.dataset.question)===i&&Number(b.dataset.choice)===selected[i]);if(choice)choice.classList.add(good?'correct':'wrong')});score.textContent=`Marks: ${marks} / ${answers.length}`;save();const detail={exerciseType:'MCQ',exerciseId:'math-5-ch11-11e-true-false.html',response:Object.fromEntries(selected.map((x,i)=>['question'+(i+1),x===null?'':String(x)])),marks,total:answers.length};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')};document.getElementById('show').onclick=()=>{answers.forEach((valid,i)=>selected[i]=valid[0]);paint();clearMarks();save()};document.getElementById('reset').onclick=()=>{selected.fill(null);paint();clearMarks();save()};</script></body></html>
