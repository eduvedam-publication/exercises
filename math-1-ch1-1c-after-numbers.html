function save(){try{localStorage.setItem(key,JSON.stringify(fields.map(x=>x.value)))}catch(e){}}

document.getElementById('submit').addEventListener('click',()=>{fields.forEach((x,i)=>{const ok=norm(x.value)===norm(questions[i].answer);x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok);const f=document.getElementById('f'+i);f.textContent='';f.className='feedback '+(ok?'ok':'no')});save();const detail={exerciseType:'FILL_BLANK',exerciseId:'math-1-ch1-1c-after-numbers.html',response:Object.fromEntries(fields.map((x,i)=>['question'+(i+1),x.value]))};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')});
