<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eefcff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:2px solid #27bddd;border-radius:18px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;text-align:center;color:#08aeca;font-size:clamp(22px,3vw,31px)}.content{flex:1}.question{margin:13px 0;padding:13px 15px;border-radius:13px;background:#fff6f8;font-size:clamp(16px,2vw,20px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option{border:2px solid #28b9dc;background:#fff;border-radius:10px;padding:9px 13px;font-size:16px;cursor:pointer}.selected{background:#dff8ff!important}.correct{background:#dff7e4!important;border-color:#39a95b!important}.wrong{background:#ffe2e2!important;border-color:#e84b4b!important}.bottom{text-align:center;margin-top:22px}.btn{border:0;border-radius:24px;background:#f7941d;color:#fff;font-weight:800;font-size:17px;padding:11px 25px;margin:5px;cursor:pointer}.score{margin-top:8px;color:#087fc2;font-weight:800;font-size:19px}@media(max-width:650px){body{padding:8px}.exercise{padding:16px 12px}.options{flex-direction:column}.option{width:100%;text-align:left}}.matcharea{position:relative;margin:5px auto 0;max-width:900px}.mrow{display:grid;grid-template-columns:1fr 1fr;gap:90px;min-height:62px;align-items:center;position:relative;z-index:2}.item{background:#fff6f8;border:2px solid transparent;border-radius:11px;padding:10px 14px;font-size:18px;cursor:pointer}.item.active{border-color:#28b9dc;background:#dff8ff}.item.done{border-color:#39a95b}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#28b9dc;margin:0 7px}svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}@media(max-width:650px){.mrow{gap:28px;grid-template-columns:1fr 1fr}.item{font-size:14px;padding:9px 7px}}</style><main class="exercise"><h1 class="title">Match the following.</h1><div class="content"><div class="matcharea" id="area"><svg id="lines"></svg><div id="rows"></div></div></div><div class="bottom"><button class="btn" onclick="check()">Check Answers</button><button class="btn" onclick="resetEx()">Reset</button><div class="score" id="score">Score: 0 / 6</div></div></main><script>function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function save(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){let p={exerciseType:t,response:r};try{window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}try{window.ReactNativeWebView&&window.ReactNativeWebView.postMessage(JSON.stringify({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p}))}catch(e){}}
const K='b7-ch2-match',L=['Amma','Boutique owner','Eldest son','Youngest son','Second son','Daughters'],R=['Learned driving','Lived on the pavement','Taught Amma stitching','Helped Amma with stitching','Got a government job','Became a peon'],ANS=[1,2,5,0,4,3];
let s=load(K);s.m=s.m||{};s.score=s.score||0;let active=null;
function draw(){rows.innerHTML=L.map((x,i)=>`<div class="mrow"><button id="l${i}" class="item ${active===i?'active':''} ${s.m[i]!=null?'done':''}" onclick="left(${i})">${i+1}. ${x} <span class="dot"></span></button><button id="r${i}" class="item" onclick="right(${i})"><span class="dot"></span>${['i.','ii.','iii.','iv.','v.','vi.'][i]} ${R[i]}</button></div>`).join('');score.textContent=`Score: ${s.score} / 6`;requestAnimationFrame(linesDraw)}
function left(i){active=i;draw()}function right(j){if(active===null)return;s.m[active]=j;active=null;save(K,s);draw()}
function linesDraw(){lines.innerHTML='';let ar=area.getBoundingClientRect();Object.entries(s.m).forEach(([i,j])=>{let a=document.getElementById('l'+i).getBoundingClientRect(),b=document.getElementById('r'+j).getBoundingClientRect();let x1=a.right-ar.left-8,y1=a.top+a.height/2-ar.top,x2=b.left-ar.left+8,y2=b.top+b.height/2-ar.top;lines.innerHTML+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f04b36" stroke-width="3" stroke-linecap="round"/>`})}
function check(){let n=0;Object.entries(s.m).forEach(([i,j])=>{if(ANS[+i]===+j)n++});s.score=n;save(K,s);score.textContent=`Score: ${n} / 6`;send('MATCHING',{matches:s.m,score:n,total:6,completed:Object.keys(s.m).length===6})}function resetEx(){s={m:{},score:0};active=null;save(K,s);draw()}window.addEventListener('resize',linesDraw);draw()</script>
