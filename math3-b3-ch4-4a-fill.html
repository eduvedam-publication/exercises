<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#e8faff;font-family:Arial,sans-serif}.exercise{max-width:1080px;margin:auto;background:white;border:4px solid #08a8d8;border-radius:28px;padding:30px 38px}h1{margin:0 0 30px;color:#00a3dc;font-size:25px}.questions{display:grid;grid-template-columns:repeat(4,1fr);gap:25px}.q{display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font:21px Georgia,serif}.ans{width:58px;height:38px;border:2px solid red;font-size:18px;text-align:center}.controls{display:flex;justify-content:center;gap:14px;margin-top:38px}.controls button{border:0;border-radius:24px;background:#ff7d00;color:white;font-weight:bold;padding:12px 22px}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df;border-color:#009b8e}.bad{background:#ffe1e1;border-color:#e43d30}@media(max-width:800px){.questions{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.questions{grid-template-columns:1fr}.q{justify-content:flex-start}}</style></head><body><main class="exercise"><h1>Fill the missing numerals.</h1><div class="questions"><div class="q"><span>a.</span><span>9 × 9 =</span><input class="ans" id="a0" inputmode="numeric"></div><div class="q"><span>b.</span><span>5 × 7 =</span><input class="ans" id="a1" inputmode="numeric"></div><div class="q"><span>c.</span><span>8 × 5 =</span><input class="ans" id="a2" inputmode="numeric"></div><div class="q"><span>d.</span><span>4 × 4 =</span><input class="ans" id="a3" inputmode="numeric"></div></div><div class="controls"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div class="score" id="score">Score: 0 / 4</div></main><script>const A=['81', '35', '40', '16'];function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById('a'+i),g=e.value.trim()===a;e.classList.remove('ok','bad');e.classList.add(g?'ok':'bad');if(g)s++});score.textContent='Score: '+s+' / 4'}function resetAll(){document.querySelectorAll('.ans').forEach(e=>{e.value='';e.classList.remove('ok','bad')});score.textContent='Score: 0 / 4'}</script></body></html>
