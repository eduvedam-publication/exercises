const questions=[['Total number of pink balls','6','number'],['Total number of blue balls','7','number'],['Total number of green balls','5','number'],['Total number of orange balls','10','number'],['How many more blue balls are there than green balls?','2','number'],['Which coloured ball is most in number?','orange','text'],['Which coloured ball is least in number?','green','text']];const key='math-1-ch12-assessment-balls';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};const root=document.getElementById('questions');root.innerHTML=questions.map((q,i)=>`<div class="q"><label for="a${i}"><b>${'abcdefg'[i]}.</b> ${q[0]}</label><input id="a${i}" type="${q[2]==='number'?'number':'text'}" inputmode="${q[2]==='number'?'numeric':'text'}" autocomplete="off" placeholder="Your answer" aria-label="Answer ${i+1}"><span class="feedback" id="f${i}"></span></div>`).join('');questions.forEach((q,i)=>{const el=document.getElementById('a'+i);el.value=saved[i]||'';el.addEventListener('input',()=>{saved[i]=el.value;localStorage.setItem(key,JSON.stringify(saved));el.classList.remove('correct','wrong');document.getElementById('f'+i).textContent='';document.getElementById('score').textContent=''})});function normal(s){return String(s).trim().toLowerCase().replace(/\s+balls?$/,'').trim()}function submitAnswers(){let score=0;questions.forEach((q,i)=>{const el=document.getElementById('a'+i),val=normal(el.value),ok=val===q[1];el.classList.toggle('correct',ok);el.classList.toggle('wrong',!ok);document.getElementById('f'+i).textContent=ok?'✓':'✗';if(ok)score++});document.getElementById('score').textContent=`Score: ${score} / ${questions.length}`}function showAnswers(){questions.forEach((q,i)=>{document.getElementById('a'+i).value=q[1];saved[i]=q[1]});localStorage.setItem(key,JSON.stringify(saved));submitAnswers()}function resetAll(){saved={};localStorage.removeItem(key);questions.forEach((q,i)=>{const el=document.getElementById('a'+i);el.value='';el.classList.remove('correct','wrong');document.getElementById('f'+i).textContent=''});document.getElementById('score').textContent=''}
