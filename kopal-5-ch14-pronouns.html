<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOPAL Class 5 Chapter 14 pronouns — 2026–27</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#17333b}.wrap{max-width:1000px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a7dd;margin:0 0 8px;font-size:26px}.marks{color:#47717e;font-size:15px;margin:0 0 18px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:13px;margin:10px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.opt{border:1px solid #93dcf5;background:white;border-radius:8px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}.opt.sel{background:#d8f3ff;border-color:#009be0}.opt.correct{background:#dcfce5!important;border-color:#22aa55!important}.opt.wrong{background:#ffe3e3!important;border-color:#ff4545!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.actions button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}#score{text-align:center;color:#0073bd;font-size:19px;font-weight:bold;margin-top:14px}@media(max-width:620px){.wrap{margin:7px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}.sentence{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;line-height:1.8}.token{font:inherit;color:inherit;cursor:pointer;border:2px solid transparent;border-radius:50%;padding:5px 10px;background:transparent}.token.sel{border-color:#ec1677;background:#fff1f7}.token.correct{background:#dcfce5;border-color:#22aa55}.token.wrong{background:#ffe3e3;border-color:#ff4545}.token.missed{border:2px dashed #22aa55}.token:focus-visible{outline:3px solid #008ad1}#score{min-height:28px}</style></head><body><main class="wrap"><h2>नीचे लिखी पंक्तियों में सर्वनाम शब्दों पर गोला लगाइए–</h2><p class="marks">प्रत्येक प्रश्न 1 अंक का है। कुल अंक: 4</p><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">प्राप्तांक: 0 / 4</div></main><script>const key='kopal-5-ch14-pronouns';
const data=[['फिर जब उनके पर निकलेंगे।',[2]],['वे बया बनकर उड़ जाएँगे।',[0]],['हम सब तेरे पास रहेंगे।',[0,2]],['तू मत रोना चिड़िया रानी।',[0]]];
let answers=data.map(()=>[]);try{let saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.length===4)answers=saved.map((a,i)=>Array.isArray(a)?[...new Set(a.filter(j=>Number.isInteger(j)&&j>=0&&j<data[i][0].split(' ').length))]:[])}catch(e){}
function persist(){try{localStorage.setItem(key,JSON.stringify(answers))}catch(e){}}
function render(){document.getElementById('questions').innerHTML=data.map((q,i)=>`<div class="q"><b>(${'कखगघ'[i]})</b><div class="sentence">${q[0].split(' ').map((w,j)=>`<button class="token ${answers[i].includes(j)?'sel':''}" aria-pressed="${answers[i].includes(j)}" onclick="pick(${i},${j})">${w}</button>`).join('')}</div></div>`).join('')}
function pick(i,j){answers[i]=answers[i].includes(j)?answers[i].filter(x=>x!==j):[...answers[i],j];persist();render();document.getElementById('score').textContent='प्राप्तांक: — / 4'}
function check(){let n=0;document.querySelectorAll('.sentence').forEach((row,i)=>{row.querySelectorAll('.token').forEach((el,j)=>{el.classList.remove('correct','wrong','missed');if(answers[i].includes(j))el.classList.add(data[i][1].includes(j)?'correct':'wrong');else if(data[i][1].includes(j))el.classList.add('missed')});if(answers[i].length===data[i][1].length&&answers[i].every(j=>data[i][1].includes(j)))n++});document.getElementById('score').textContent=`प्राप्तांक: ${n} / 4`}
function showAnswers(){answers=data.map(q=>[...q[1]]);persist();render();check()}
function resetAll(){answers=data.map(()=>[]);try{localStorage.removeItem(key)}catch(e){}render();document.getElementById('score').textContent='प्राप्तांक: 0 / 4'}render();</script></body></html>
