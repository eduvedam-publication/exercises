<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#dff8ff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:5px solid #08a6d1;border-radius:22px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;color:#ff0072;font-size:clamp(22px,3vw,30px);font-weight:800}.content{flex:1}.question{margin:12px 0;padding:13px 16px;border:2px solid #69dfff;border-radius:16px;background:#f3fbfe;font-size:clamp(16px,2vw,19px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option{border:2px solid #ff0072;background:#fff;border-radius:10px;padding:8px 13px;font-size:16px;cursor:pointer}.option.selected{background:#ffe7f1}.option.correct,.order.correct{background:#dff7e4!important}.option.wrong,.order.wrong{background:#ffe2e2!important}.bottom{text-align:center;margin-top:22px}.btn{border:2px solid #ff0072;border-radius:10px;background:#fff;color:#111;font-size:16px;padding:8px 14px;margin:4px;cursor:pointer}.score{margin-top:9px;color:#087fc2;font-weight:800;font-size:18px}.orderrow{display:flex;justify-content:space-between;align-items:center;gap:15px}.order{width:58px;border:2px solid #ff0072;border-radius:7px;padding:7px;text-align:center;font-size:17px;background:#fff}.matcharea{position:relative}.mrow{display:grid;grid-template-columns:1fr 1fr;gap:85px;min-height:62px;align-items:center;position:relative;z-index:2}.item{border:2px solid #69dfff;background:#f3fbfe;border-radius:12px;padding:10px 13px;font-size:17px;text-align:left;cursor:pointer}.item.active{border-color:#ff0072;background:#ffe7f1}.item.done{border-color:#08a6d1}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#ff0072;margin:0 7px}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}@media(max-width:650px){body{padding:7px}.exercise{padding:15px 11px}.options{flex-direction:column}.option{width:100%;text-align:left}.mrow{gap:24px}.item{font-size:14px;padding:8px 6px}}</style><main class=exercise><h1 class=title>Match the following.</h1><div class=content><div class=matcharea id=area><svg id=lines></svg><div id=rows></div></div></div><div class=bottom><button class=btn onclick=check()>Submit</button><button class=btn onclick=resetEx()>Reset</button><div class=score id=score>Score: 0 / 6</div></div></main><script>function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function save(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){const p={exerciseType:t,response:r};try{parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}try{window.ReactNativeWebView&&window.ReactNativeWebView.postMessage(JSON.stringify({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p}))}catch(e){}}const K='b7-ch7-match',L=['King Phillip', 'Aristotle', 'Alexander', 'Black horse', 'White star', 'Bravery'],R=['Great philosopher', "Alexander's father", 'Afraid of its shadow', 'Courage and wisdom', 'Determination and confidence', "On the horse's forehead"],A=[1, 0, 4, 2, 5, 3];let s=load(K);s.m=s.m||{};s.score=s.score||0;let active=null;function draw(){rows.innerHTML=L.map((x,i)=>`<div class=mrow><button id=l${i} class="item ${active===i?'active':''} ${s.m[i]!=null?'done':''}" onclick="left(${i})">${i+1}. ${x} <span class=dot></span></button><button id=r${i} class=item onclick="right(${i})"><span class=dot></span>${['i.','ii.','iii.','iv.','v.','vi.'][i]} ${R[i]}</button></div>`).join('');score.textContent=`Score: ${s.score} / 6`;requestAnimationFrame(drawLines)}function left(i){active=i;draw()}function right(j){if(active===null)return;s.m[active]=j;active=null;save(K,s);draw()}function drawLines(){lines.innerHTML='';let ar=area.getBoundingClientRect();Object.entries(s.m).forEach(([i,j])=>{let a=document.getElementById('l'+i).getBoundingClientRect(),b=document.getElementById('r'+j).getBoundingClientRect();lines.innerHTML+=`<line x1="${a.right-ar.left-7}" y1="${a.top+a.height/2-ar.top}" x2="${b.left-ar.left+7}" y2="${b.top+b.height/2-ar.top}" stroke="#ff4c39" stroke-width="3" stroke-linecap="round"/>`})}function check(){let n=0;Object.entries(s.m).forEach(([i,j])=>{if(A[+i]===+j)n++});s.score=n;save(K,s);score.textContent=`Score: ${n} / 6`;send('MATCHING',{matches:s.m,score:n,total:6,completed:Object.keys(s.m).length===6})}function resetEx(){s={m:{},score:0};active=null;save(K,s);draw()}addEventListener('resize',drawLines);draw()</script>
