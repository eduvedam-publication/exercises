<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#dff8ff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:5px solid #08a6d1;border-radius:22px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;color:#ff0072;font-size:clamp(22px,3vw,30px)}.content{flex:1}.question{margin:12px 0;padding:13px 16px;border:2px solid #69dfff;border-radius:16px;background:#f3fbfe;font-size:clamp(16px,2vw,19px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option,.btn{border:2px solid #ff0072;background:#fff;border-radius:10px;padding:8px 13px;font-size:16px;cursor:pointer}.option.selected{background:#ffe7f1}.option.correct,.answer.correct,.order.correct{background:#dff7e4}.option.wrong,.answer.wrong,.order.wrong{background:#ffe2e2}.answer{border:2px solid #ff4c39;border-radius:5px;padding:6px 8px;font-size:17px;min-width:125px;max-width:205px;margin:2px 4px}.orderrow{display:flex;justify-content:space-between;align-items:center;gap:15px}.order{width:58px;border:2px solid #ff0072;border-radius:7px;padding:7px;text-align:center;font-size:17px}.bottom{text-align:center;margin-top:22px}.score{margin-top:9px;color:#087fc2;font-weight:800;font-size:18px}@media(max-width:650px){body{padding:7px}.exercise{padding:15px 11px}.options{flex-direction:column}.option{width:100%;text-align:left}.answer{min-width:100px;max-width:145px}}
.rowq{font-size:22px;line-height:2.15;margin:18px 0}
.choices{display:inline-flex;gap:9px;margin-left:12px;vertical-align:middle}
.word{border:2px solid #ff0060;background:white;border-radius:10px;padding:7px 13px;cursor:grab;font-size:19px}
.drop{display:inline-flex;min-width:180px;height:40px;border:2px dashed #00bfe7;border-radius:8px;vertical-align:middle;align-items:center;justify-content:center;margin:0 7px;background:white}
.drop.filled{border-style:solid}
</style>
<main class=exercise><h1 class=title>चुनिए और लिखिए–</h1><div class=content id=c></div>
<div class=bottom><button class=btn onclick=check()>Submit</button><button class=btn onclick=reset()>Reset</button><div class=score id=sc></div></div></main>
<script>function L(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function S(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){let p={exerciseType:t,response:r};try{parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}}
const K='kopal-hindi2-ch6-drag-drop',R=[["त्योहार मनुष्य के जीवन में", "भर देते हैं।", ["आलस्य", "उल्लास"], "उल्लास"], ["ईद रोज़े रखने के", "दिन बाद मनाते हैं।", ["बीस", "तीस"], "तीस"], ["इस दिन विशेष रूप से", "बनाई जाती हैं।", ["गुझिया", "सेवइयाँ"], "सेवइयाँ"]];let s=L(K);s.a=s.a||{};s.score=s.score||0;let chosen=null;
function draw(){c.innerHTML=R.map((r,i)=>`<div class=rowq><b>${['(क)','(ख)','(ग)'][i]}</b> ${r[0]} <span class="drop ${s.a[i]?'filled':''}" ondragover="event.preventDefault()" ondrop="drop(event,${i})" onclick="place(${i})">${s.a[i]||''}</span> ${r[1]} <span class=choices>${r[2].map(w=>`<span class=word draggable=true ondragstart="event.dataTransfer.setData('text/plain','${w}')" onclick="choose('${w}')">${w}</span>`).join('')}</span></div>`).join('');sc.textContent=`Score: ${s.score} / 3`}
function choose(w){chosen=w}function place(i){if(chosen){s.a[i]=chosen;chosen=null;S(K,s);draw()}}
function drop(e,i){e.preventDefault();s.a[i]=e.dataTransfer.getData('text/plain');S(K,s);draw()}
function check(){let n=0;R.forEach((r,i)=>{let el=c.children[i].querySelector('.drop'),ok=s.a[i]===r[3];el.classList.toggle('correct',ok);el.classList.toggle('wrong',!!s.a[i]&&!ok);if(ok)n++});s.score=n;S(K,s);sc.textContent=`Score: ${n} / 3`;let resp={};R.forEach((_,i)=>resp['question'+(i+1)]=s.a[i]||'');send('DRAG_DROP',resp)}
function reset(){s={a:{},score:0};chosen=null;S(K,s);draw()}draw()</script>
