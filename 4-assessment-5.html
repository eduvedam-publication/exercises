<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1050px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 26px;color:#00a5dc;font-size:25px}
.actions{display:flex;justify-content:center;gap:14px;margin-top:30px}
.action{border:0;border-radius:24px;padding:12px 22px;background:#ff8200;color:#fff;font-weight:700;cursor:pointer}
.score{text-align:center;margin-top:17px;color:#064bb4;font-size:22px;font-weight:700}
.ok{background:#dcf8df!important;border-color:#009b8e!important}
.bad{background:#ffe1e1!important;border-color:#e43d30!important}
input{border:2px solid #ff3b30;background:#fff;height:40px;font-size:18px;padding:5px 8px;outline:none}
@media(max-width:700px){body{padding:0}.exercise{border-radius:0;padding:16px}}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 45px}.fill{display:flex;align-items:center;gap:7px;font:20px Georgia,serif;white-space:nowrap}.fill input{width:95px}
@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><main class="exercise"><h1>Find the value of the following:</h1><div class="grid"><div class="fill"><span>a. 49 × 10 =</span><input id="a0"><span></span></div><div class="fill"><span>b. 78 × 1 =</span><input id="a1"><span></span></div><div class="fill"><span>c. 34 × 10 =</span><input id="a2"><span></span></div><div class="fill"><span>d. 5 × 100 =</span><input id="a3"><span></span></div><div class="fill"><span>e. 289 × 0 =</span><input id="a4"><span></span></div><div class="fill"><span>f. 391 × 1 =</span><input id="a5"><span></span></div></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 6</div>
<script>const ans=['490', '78', '340', '500', '0', '391'];function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=e.value.trim()===a;e.className=ok?"ok":"bad";if(ok)s++});score.textContent=`Score: ${s} / ${ans.length}`}function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.className=""});score.textContent=`Score: 0 / ${ans.length}`}</script></main></body></html>
