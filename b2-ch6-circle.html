<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circle the Correct Word</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);padding:18px;color:#333}
.quiz-box{width:min(100%,1000px);margin:auto;background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:26px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.heading{color:#00a6d6;font-size:28px;font-weight:700;margin-bottom:20px}
.question-box{background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:18px 20px;margin-bottom:15px}
.result{text-align:center;margin:20px 0 14px;font-size:25px;font-weight:700;color:#0047ab}
.buttons{text-align:center}
.reset{border:0;border-radius:32px;padding:12px 30px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9800,#ff6f00);cursor:pointer}

.question{font-size:20px;line-height:1.7;font-weight:600}
.option{display:inline-block;background:#fff;border:2px solid #ff4fa0;border-radius:50%;padding:6px 13px;margin:0 4px;cursor:pointer;font-size:18px;font-weight:700}
.option:hover{background:#fff0f7}.option.correct{background:#d4f8d4;border-color:#2e7d32;color:#1b5e20}
.option.wrong{background:#ffd9dd;border-color:#c62828;color:#b71c1c}.option.disabled{pointer-events:none}
@media(max-width:650px){body{padding:8px}.quiz-box{padding:16px 12px}.heading{font-size:21px}.question{font-size:16px;line-height:1.9}.option{font-size:15px;padding:5px 10px}.reset{width:100%}}
</style></head><body><div class="quiz-box"><div class="heading">Circle the correct word.</div><div id="quiz"></div>
<div class="result" id="result">Score: 0 / 4</div><div class="buttons"><button class="reset" onclick="resetQuiz()">Reset Quiz</button></div></div>
<script>
const qs=[
{before:"1. Raju was a ",a:"kind",b:"rude",after:" boy.",answer:"kind"},
{before:"2. The injured boy felt ",a:"relief",b:"anger",after:".",answer:"relief"},
{before:"3. Helping others makes everyone ",a:"happy",b:"sad",after:".",answer:"happy"},
{before:"4. Friends should ",a:"care",b:"fight",after:".",answer:"care"}
];let score=0;
function load(){let q=document.getElementById("quiz");q.innerHTML="";qs.forEach(x=>{let box=document.createElement("div");box.className="question-box";let line=document.createElement("div");line.className="question";line.append(document.createTextNode(x.before));let a=document.createElement("span");a.className="option";a.textContent=x.a;let slash=document.createTextNode(" / ");let b=document.createElement("span");b.className="option";b.textContent=x.b;line.append(a,slash,b,document.createTextNode(x.after));a.onclick=()=>check(a,x.a,x.answer,[a,b]);b.onclick=()=>check(b,x.b,x.answer,[a,b]);box.append(line);q.append(box)})}
function check(btn,val,ans,opts){opts.forEach(o=>{o.classList.add("disabled");if(o.textContent===ans)o.classList.add("correct")});if(val===ans)score++;else btn.classList.add("wrong");document.getElementById("result").textContent=`Score: ${score} / 4`;}
function resetQuiz(){score=0;document.getElementById("result").textContent="Score: 0 / 4";load()}load();
</script></body></html>
