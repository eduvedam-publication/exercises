<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write the opposite numbers.</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;background:#b9fbff;color:#172735;font-family:Georgia,'Times New Roman',serif}.sheet{width:min(1050px,100%);padding:22px 24px;background:white;border:3px solid #00a9f4;border-radius:20px}h1{font:700 clamp(23px,3vw,32px) Arial,sans-serif;color:#009ff0;margin:0 0 17px}.bar{height:20px;border-radius:30px;background:#bff5fb;margin:0 0 12px}.question{background:#d9f8ff;border:1.5px solid #00a9ff;border-radius:11px;padding:12px 14px;margin:9px 0;font-size:clamp(16px,1.7vw,20px)}.prompt{margin:0 0 9px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{background:white;border:1.5px solid #00a9ff;border-radius:9px;padding:9px 12px;font:inherit;color:#172735;cursor:pointer;min-height:44px}.choice:hover{background:#eafdff}.choice.selected{background:#9deaf7;border-color:#008ed0;box-shadow:inset 0 0 0 1px #008ed0}.choice.correct{background:#e4ffed;border-color:#20a953}.choice.wrong{background:#fff0f0;border-color:#e62c38}.choice:focus-visible,button:focus-visible{outline:3px solid #005ac0;outline-offset:2px}.feedback{display:inline-block;font:700 14px Arial,sans-serif;margin-top:8px}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:21px}.actions button{background:#ff7000;color:white;border:0;border-radius:24px;padding:11px 19px;font-weight:700;cursor:pointer}#score{text-align:center;color:#003bea;font:700 21px Arial,sans-serif;margin:11px 0 0}.note{font:13px Arial;color:#565d65;margin:10px 0 0}@media(max-width:620px){.sheet{padding:16px 12px}.question{padding:10px}.choice{padding:8px 10px}}@media(max-height:700px) and (min-width:800px){.sheet{padding:16px 20px}.question{padding:9px 12px;margin:7px 0}.bar{height:13px}.actions{margin-top:13px}}.work{display:grid;grid-template-columns:1fr;gap:7px}.row{background:#d9f8ff;border:1.5px solid #00a9ff;border-radius:11px;padding:10px 13px;font-size:19px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row label{min-width:0}.row input{width:150px;padding:8px;border:2px solid #ff685d;border-radius:5px;font:inherit;color:#172735;background:white}.row input.correct{border-color:#20a953;background:#e8fff0}.row input.wrong{border-color:#e62c38;background:#fff0f0}.row .feedback{margin:0}@media(max-width:620px){.row{font-size:17px;padding:9px}.row input{width:130px}} .row{display:block;padding:10px 13px}.row label{display:block;line-height:1.35;margin-bottom:6px}.row input{width:190px}.row input.order-input{width:100%;max-width:100%;font-size:18px}.row .feedback{display:inline-block;margin:7px 0 0}.note{line-height:1.45}.instructions{font:14px Arial;color:#555;margin:4px 0 12px}</style></head><body><main class="sheet"><h1>Write the opposite numbers.</h1><div class="bar" aria-hidden="true"></div><div class="work"><div class="row"><label for="a0">a. 17</label><input id="a0" class="" inputmode="text" aria-label="Answer a" autocomplete="off" placeholder="Answer"><span class="feedback" id="f0" aria-live="polite"></span></div><div class="row"><label for="a1">b. −30</label><input id="a1" class="" inputmode="text" aria-label="Answer b" autocomplete="off" placeholder="Answer"><span class="feedback" id="f1" aria-live="polite"></span></div><div class="row"><label for="a2">c. 100</label><input id="a2" class="" inputmode="text" aria-label="Answer c" autocomplete="off" placeholder="Answer"><span class="feedback" id="f2" aria-live="polite"></span></div><div class="row"><label for="a3">d. 86</label><input id="a3" class="" inputmode="text" aria-label="Answer d" autocomplete="off" placeholder="Answer"><span class="feedback" id="f3" aria-live="polite"></span></div><div class="row"><label for="a4">e. −813</label><input id="a4" class="" inputmode="text" aria-label="Answer e" autocomplete="off" placeholder="Answer"><span class="feedback" id="f4" aria-live="polite"></span></div></div><div class="actions"><button id="submit" type="button">Submit</button><button id="show" type="button">Show Answer</button><button id="reset" type="button">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 5</p></main><script>const data=["−17", "30", "−100", "−86", "813"],key="exercise:math-5-ch11-11a-opposites.html",mode="number",inputs=[...document.querySelectorAll('.row input')],score=document.getElementById('score');function norm(v){return String(v).trim().replace(/[−–]/g,'-').replace(/[०-९]/g,c=>String('०१२३४५६७८९'.indexOf(c))).replace(/\s/g,'').replace(/^\+(?=\d)/,'').replace(/^0+(?=\d)/,'')}function valid(v,a){if(mode==='order'){const left=String(v).split(/[,;]+/).map(norm),right=String(a).split(',').map(norm);return left.length===right.length&&left.every((x,i)=>x===right[i])}return norm(v)===norm(a)}function save(){try{localStorage.setItem(key,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}function clearMarks(){inputs.forEach((x,i)=>{x.classList.remove('correct','wrong');let f=document.getElementById('f'+i);f.textContent='';f.className='feedback'});score.textContent='Marks: 0 / '+data.length}inputs.forEach(x=>x.addEventListener('input',()=>{save();clearMarks()}));try{const old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old))old.forEach((v,i)=>{if(inputs[i]&&typeof v==='string')inputs[i].value=v})}catch(e){}document.getElementById('submit').onclick=()=>{let marks=0;inputs.forEach((x,i)=>{const ok=valid(x.value,data[i]);marks+=ok;x.classList.toggle('correct',ok);x.classList.toggle('wrong',!ok);const f=document.getElementById('f'+i);f.textContent=ok?'✓ Correct':'✗ Wrong';f.className='feedback '+(ok?'ok':'no')});score.textContent=`Marks: ${marks} / ${data.length}`;save();const detail={exerciseType:'FILL_BLANK',exerciseId:"math-5-ch11-11a-opposites.html",response:Object.fromEntries(inputs.map((x,i)=>['question'+(i+1),x.value])),marks,total:data.length};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'V"math-5-ch11-11a-opposites.html"YALAYA_EXERCISE_SUBMIT',...detail},'*')};document.getElementById('show').onclick=()=>{inputs.forEach((x,i)=>x.value=data[i]);save();clearMarks()};document.getElementById('reset').onclick=()=>{inputs.forEach(x=>x.value='');save();clearMarks()};</script></body></html>
