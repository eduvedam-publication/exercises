<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 – Chapter 7 Exercise 7(c)</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;color:#222;font-family:Georgia,'Times New Roman',serif}.exercise{max-width:1050px;margin:20px auto;padding:25px 30px 24px;background:#fff;border:3px solid #00a9df;border-radius:26px}h1{font-size:23px;color:#00a8dc;margin:0 0 22px}.questions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.question{display:flex;align-items:center;gap:9px;min-width:0;font-size:20px}.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;min-width:22px}.frac .top{border-bottom:1.5px solid #222;padding:0 4px 3px}.frac .bottom{padding:3px 4px 0}.mixed{display:flex;align-items:center;gap:5px}.answer-frac{display:flex;flex-direction:column;width:75px;gap:0}.answer-frac input{width:100%;height:34px;text-align:center;border:2px solid #ff5364;border-radius:2px;font-size:18px;background:#fff;outline:0}.answer-frac .num{border-bottom:1px solid #444}.answer-frac input.ok{background:#d7f9e0;border-color:#18a64e}.answer-frac input.bad{background:#ffe1e1;border-color:#f33;animation:blink .55s 3}@keyframes blink{50%{background:#ff8080}}.actions{display:flex;justify-content:center;gap:14px;margin-top:34px}button{border:0;background:#ff8300;color:white;border-radius:24px;padding:12px 20px;font-weight:bold;cursor:pointer}#feedback{text-align:center;color:#0060a8;font:700 17px Arial,sans-serif;margin-top:14px;min-height:20px}@media(max-width:720px){.exercise{margin:8px;padding:18px}.questions{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:20px}}@media(max-width:390px){.questions{grid-template-columns:1fr}}</style></head><body><main class="exercise"><h1>Convert each of the following mixed fractions into improper fractions.</h1><section class="questions" id="questions"></section><div class="actions"><button type="button" onclick="checkAnswers()">Check Answers</button><button type="button" onclick="resetExercise()">Reset</button></div><div id="feedback" aria-live="polite"></div></main><script>
const data=[['a.',11,3,9,102,9],['b.',3,3,4,15,4],['c.',1,2,7,9,7],['d.',16,4,6,100,6]];const key='math-4-ch7-7c-improper-fractions-v1';const root=document.getElementById('questions');data.forEach((q,i)=>{const el=document.createElement('div');el.className='question';el.innerHTML=`<span>${q[0]}</span><span class="mixed">${q[1]} <span class="frac"><span class="top">${q[2]}</span><span class="bottom">${q[3]}</span></span></span><span>=</span><span class="answer-frac"><input aria-label="Question ${q[0]} numerator" inputmode="numeric" id="n${i}" class="num" autocomplete="off"><input aria-label="Question ${q[0]} denominator" inputmode="numeric" id="d${i}" autocomplete="off"></span>`;root.appendChild(el)});function save(){localStorage.setItem(key,JSON.stringify(data.map((_,i)=>[document.getElementById('n'+i).value,document.getElementById('d'+i).value])))}function restore(){try{const s=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(s))s.forEach((v,i)=>{if(i<data.length){document.getElementById('n'+i).value=v[0]||'';document.getElementById('d'+i).value=v[1]||''}})}catch(e){}}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',()=>{e.classList.remove('ok','bad');document.getElementById('feedback').textContent='';save()}));function checkAnswers(){let correct=0;data.forEach((q,i)=>{let n=document.getElementById('n'+i),d=document.getElementById('d'+i);const ok=Number(n.value)===q[4]&&Number(d.value)===q[5]&&n.value.trim()!==''&&d.value.trim()!=='';[n,d].forEach(e=>{e.classList.remove('ok','bad');e.classList.add(ok?'ok':'bad')});if(ok)correct++});document.getElementById('feedback').textContent=correct===data.length?'All answers are correct!':'Please check the red highlighted answers.';save()}function resetExercise(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('ok','bad')});document.getElementById('feedback').textContent='';localStorage.removeItem(key)}restore();</script></body></html>
