<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>नीचे दिए गए शब्दों के दो-दो पर्यायवाची शब्द लिखिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#bafaff;color:#173044;font-family:Arial,"Noto Sans Devanagari",sans-serif}.wrap{max-width:1020px;margin:16px auto;padding:24px;background:#fff;border:3px solid #00aeff;border-radius:20px}h1{color:#00a5ed;font-size:clamp(21px,3vw,29px);margin:0 0 17px}.q{background:#e0f9ff;border:1.5px solid #00aeff;border-radius:12px;padding:12px 14px;margin:9px 0;font-size:19px;line-height:1.8}.opts,.bank{display:flex;flex-wrap:wrap;gap:9px}.opts{margin-top:6px}.bank{background:#d1f7ff;padding:12px;border-radius:11px;margin-bottom:12px}.opt,.chip,.slot{font:inherit;border:1px solid #00aeff;border-radius:9px;background:white;padding:8px 13px;color:#173044;cursor:pointer;min-height:40px}.opt.sel,.chip.sel{background:#9feaff}.chip.used{opacity:.55}.slot{border:2px dashed #ff867b;min-width:130px;margin:0 5px;vertical-align:middle;color:#173044}.good{background:#d6f8df!important;border-color:#16a34a!important;color:#176534!important}.bad{background:#ffe0e0!important;border-color:#e03131!important;color:#a11!important}.controls{text-align:center;margin-top:25px}.controls button{border:0;background:#ff7300;color:white;border-radius:25px;padding:11px 18px;margin:3px;cursor:pointer;font-weight:bold}.score{text-align:center;color:#0039dc;font-weight:bold;font-size:22px;margin-top:10px}.hint{font-size:15px;color:#456;margin:4px 0 12px}@media(max-width:600px){.wrap{margin:5px;padding:12px}.q{font-size:17px}.slot{min-width:95px}}</style></head><body><main class="wrap"><h1>नीचे दिए गए शब्दों के दो-दो पर्यायवाची शब्द लिखिए–</h1><p class="hint">ऊपर से उत्तर चुनें और रिक्त स्थान पर क्लिक करें, या उत्तर खींचकर रखें।</p><section id="questions"></section><div class="controls"><button id="submit">Submit</button><button id="answer">Show Answer</button><button id="reset">Reset</button></div><div class="score" id="score">Marks: 0 / 2</div></main><script>const DATA=[["भारत – ___", "हिंदुस्तान, इंडिया", ["हिंदुस्तान, इंडिया", "दया, कृपा"]], ["करुणा – ___", "दया, कृपा", ["हिंदुस्तान, इंडिया", "दया, कृपा"]]],TYPE="drag",KEY='exercise:'+location.pathname;let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let checked=false,selected=null;const root=document.getElementById('questions'),score=document.getElementById('score');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function set(i,v){state[i]=v;checked=false;save();render()}function correct(it,i){return TYPE==='mcq'?state[i]===it[2]:state[i]===it[1]}function render(){root.innerHTML='';if(TYPE==='drag'){const bank=document.createElement('div');bank.className='bank';[...new Set(DATA.flatMap(x=>x[2]||[x[1]]))].forEach(w=>{const b=document.createElement('button');b.type='button';b.className='chip'+(selected===w?' sel':'')+(Object.values(state).includes(w)?' used':'');b.textContent=w;b.draggable=true;b.onclick=()=>{selected=w;render()};b.ondragstart=e=>{selected=w;e.dataTransfer.setData('text/plain',w)};bank.appendChild(b)});root.appendChild(bank)}DATA.forEach((it,i)=>{const q=document.createElement('div');q.className='q';const letter=['क','ख','ग','घ','ङ','च'][i]||i+1;if(TYPE==='mcq'){const text=document.createElement('div');text.textContent='('+letter+') '+it[0];q.appendChild(text);const opts=document.createElement('div');opts.className='opts';it[1].forEach((v,j)=>{const b=document.createElement('button');b.type='button';b.className='opt'+(state[i]===v?' sel':'');b.textContent='('+(j+1)+') '+v;b.onclick=()=>set(i,v);if(checked&&v===it[2])b.classList.add('good');else if(checked&&state[i]===v)b.classList.add('bad');opts.appendChild(b)});q.appendChild(opts)}else{const pieces=it[0].split('___');const line=document.createElement('div');line.append(document.createTextNode('('+letter+') '+pieces[0]));const slot=document.createElement('button');slot.type='button';slot.className='slot';slot.textContent=state[i]||'________';slot.title='ऊपर शब्द चुनें, फिर यहाँ क्लिक करें';slot.onclick=()=>{if(selected!==null)set(i,selected);else if(state[i])set(i,'')};slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();const w=e.dataTransfer.getData('text/plain');if(w)set(i,w)};if(checked)slot.classList.add(correct(it,i)?'good':'bad');line.append(slot,document.createTextNode(pieces.slice(1).join('___')));q.appendChild(line)}root.appendChild(q)});score.textContent='Marks: '+(checked?DATA.filter((it,i)=>correct(it,i)).length:0)+' / '+DATA.length}document.getElementById('submit').onclick=()=>{checked=true;render()};document.getElementById('answer').onclick=()=>{DATA.forEach((it,i)=>state[i]=TYPE==='mcq'?it[2]:it[1]);save();checked=true;render()};document.getElementById('reset').onclick=()=>{state={};selected=null;checked=false;save();render()};render();</script></body></html>
