<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare and circle the bigger number in red.</title><style>*{box-sizing:border-box}body{margin:0;background:#e3faff;font-family:Georgia,serif;color:#243547}.wrap{max-width:920px;margin:22px auto;background:white;border:3px solid #00a8d9;border-radius:22px;padding:24px 30px}h1{color:#00a8d9;font-size:24px;margin:0 0 20px}.item{background:#effbff;border:1.5px solid #21c8e7;border-radius:12px;padding:13px 16px;margin:10px 0}.prompt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:19px}.letter{font-weight:bold;color:#045fa0;min-width:23px}.nums{display:flex;flex-wrap:wrap;gap:8px}.num{font-size:19px;border:2px solid #a7d9eb;background:white;border-radius:10px;padding:8px 13px;cursor:pointer;color:#26384b}.num.selected{border-color:#ef324c;color:#d21e39;box-shadow:inset 0 0 0 1px #ef324c}.entry{font:18px Georgia,serif;border:2px solid #ff6570;border-radius:7px;padding:8px;width:min(100%,440px);min-width:160px}.small{width:190px}.entry.good,.num.good{border-color:#18a45b;background:#e4fae9;color:#137b40}.entry.bad,.num.bad{border-color:#e43c3c;background:#ffe6e6;animation:blink .35s 3}@keyframes blink{50%{background:#fff}}.hint{font-size:14px;color:#63758b;margin-top:6px}.actions{display:flex;justify-content:center;gap:12px;margin-top:24px}button.action{background:#ff8500;color:white;border:0;border-radius:22px;padding:11px 22px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0755b3;font:bold 20px Arial;margin-top:12px}.pair{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px}.pair label{display:flex;align-items:center;gap:8px;font-size:16px}@media(max-width:600px){.wrap{margin:5px;padding:15px;border-radius:16px}h1{font-size:20px}.prompt{font-size:17px}.num{font-size:17px;padding:7px}.entry{width:100%}}</style></head><body><main class="wrap"><h1>Compare and circle the bigger number in red.</h1><div id="questions"></div><div class="actions"><button class="action" onclick="check()">Check Answers</button><button class="action" onclick="reset()">Reset</button></div><div id="score">Score: 0 / 4</div></main><script>const DATA=[["736478", "785637"], ["464771", "425351"], ["533567", "524357"], ["56756", "678398"]],MODE="compare",KEY='math-4-ch1-1c-'+"compare";let state=JSON.parse(localStorage.getItem(KEY)||'{}');const root=document.getElementById('questions');const letters='abcdefghijklmnopqrstuvwxyz';function save(){localStorage.setItem(KEY,JSON.stringify(state))}function expected(row){if(MODE==='compare')return String(Math.max(...row.map(Number)));if(MODE==='order')return row.map(Number).sort((a,b)=>MODE==='order'?(SORT==='asc'?a-b:b-a):0).join(', ');const digits=row.map(Number);const greatest=[...digits].sort((a,b)=>b-a).join('');const asc=[...digits].sort((a,b)=>a-b);if(asc[0]===0){let idx=asc.findIndex(x=>x!==0);[asc[0],asc[idx]]=[asc[idx],asc[0]]}return [greatest,asc.join('')]}const SORT="asc";DATA.forEach((row,i)=>{const card=document.createElement('section');card.className='item';const p=document.createElement('div');p.className='prompt';const mark=document.createElement('span');mark.className='letter';mark.textContent=letters[i]+'.';p.append(mark);if(MODE==='compare'){const opts=document.createElement('div');opts.className='nums';row.forEach(n=>{const b=document.createElement('button');b.className='num';b.textContent=n;b.dataset.value=n;if(state[i]===n)b.classList.add('selected');b.onclick=()=>{state[i]=n;save();opts.querySelectorAll('.num').forEach(x=>x.classList.toggle('selected',x===b))};opts.append(b)});p.append(opts)}else if(MODE==='order'){const nums=document.createElement('span');nums.textContent=row.join(', ');p.append(nums);const inp=document.createElement('input');inp.className='entry';inp.placeholder='Write numbers separated by commas';inp.value=state[i]||'';inp.oninput=()=>{state[i]=inp.value;save()};p.append(inp)}else{const nums=document.createElement('span');nums.textContent=row.join(', ');p.append(nums);const pair=document.createElement('div');pair.className='pair';['Greatest number','Smallest number'].forEach((label,j)=>{const wrap=document.createElement('label');wrap.textContent=label+': ';const inp=document.createElement('input');inp.className='entry small';inp.inputMode='numeric';inp.value=(state[i]||[])[j]||'';inp.oninput=()=>{state[i]=state[i]||['',''];state[i][j]=inp.value;save()};wrap.append(inp);pair.append(wrap)});card.append(p,pair);root.append(card);return}card.append(p);root.append(card)});function check(){let correct=0,total=MODE==='digits'?DATA.length*2:DATA.length;DATA.forEach((row,i)=>{const card=root.children[i],want=expected(row);if(MODE==='compare'){card.querySelectorAll('.num').forEach(el=>{el.classList.remove('good','bad');if(el.dataset.value===state[i]){const ok=state[i]===want;el.classList.add(ok?'good':'bad');if(ok)correct++}})}else{const inputs=card.querySelectorAll('input');inputs.forEach((el,j)=>{let ok;if(MODE==='digits')ok=el.value.trim()===want[j];else ok=el.value.split(/[ ,，]+/).filter(Boolean).join(',')===want.replace(/ /g,'').split(',').join(',');el.classList.toggle('good',ok);el.classList.toggle('bad',!ok);if(ok)correct++})}});document.getElementById('score').textContent=`Score: ${correct} / ${total}`;save()}function reset(){state={};localStorage.removeItem(KEY);location.reload()}</script></body></html>
