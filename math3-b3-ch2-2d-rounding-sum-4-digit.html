<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8faff;font-family:Arial,sans-serif}.ex{max-width:1100px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}h1{color:#00a5dc;font-size:24px;margin:0 0 24px}.actions{text-align:center;margin-top:30px}.actions button{border:0;border-radius:24px;padding:12px 22px;margin:0 6px;background:#ff8200;color:#fff;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:22px;font-weight:bold;margin-top:16px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:650px){body{padding:0}.ex{padding:15px;border-radius:0}}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 24px}.q{display:flex;align-items:center;gap:7px;font:19px Georgia,serif;white-space:nowrap}.q input{width:92px;height:39px;border:2px solid #ff3b30;font-size:17px;padding:4px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="ex"><h1>Estimate the sum by rounding each number to the nearest tens.</h1><div class="grid"><div class="q"><span>a.</span><span>1782 + 546</span><input id="a0" inputmode="numeric"></div><div class="q"><span>b.</span><span>5708 + 382</span><input id="a1" inputmode="numeric"></div><div class="q"><span>c.</span><span>5216 + 1834</span><input id="a2" inputmode="numeric"></div><div class="q"><span>d.</span><span>2856 + 4663</span><input id="a3" inputmode="numeric"></div><div class="q"><span>e.</span><span>6554 + 2627</span><input id="a4" inputmode="numeric"></div><div class="q"><span>f.</span><span>1451 + 2509</span><input id="a5" inputmode="numeric"></div><div class="q"><span>g.</span><span>3745 + 3882</span><input id="a6" inputmode="numeric"></div><div class="q"><span>h.</span><span>4821 + 3555</span><input id="a7" inputmode="numeric"></div></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 8</div>
<script>const ans=['2330', '6090', '7050', '7520', '9180', '3960', '7630', '8380'];function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById("a"+i),ok=e.value.trim()===a;e.classList.remove("ok","bad");e.classList.add(ok?"ok":"bad");if(ok)s++});score.textContent=`Score: ${s} / 8`}function resetAll(){document.querySelectorAll("input").forEach(e=>{e.value="";e.classList.remove("ok","bad")});score.textContent="Score: 0 / 8"}</script></main></body></html>
