<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर निशान लगाएँ</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,'Noto Serif Devanagari',serif;color:#17333b}.wrap{max-width:1000px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a7dd;margin:0 0 8px;font-size:26px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:13px;margin:10px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.opt{border:1px solid #93dcf5;background:white;border-radius:8px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}.opt.sel{background:#d8f3ff;border-color:#009be0}.opt.correct{background:#dcfce5!important;border-color:#22aa55!important}.opt.wrong{background:#ffe3e3!important;border-color:#ff4545!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.actions button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}@media(max-width:620px){.wrap{margin:7px;padding:14px}.opts{grid-template-columns:1fr}.q{font-size:17px}}.opt{font:inherit;color:inherit;text-align:left;width:100%}.opt:focus-visible,.chip:focus-visible,.slot:focus-visible{outline:3px solid #ff8200;outline-offset:3px}.feedback{display:block;color:#47717e;font-size:16px;min-height:24px;margin-top:10px}.fillrow{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:center}.sentence{line-height:2.2}.row-options{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.chip{font:inherit;color:inherit;border:2px solid #00aee8;border-radius:8px;background:white;padding:8px 13px;cursor:grab}.chip.active{outline:3px solid #ff8200;background:#d8f3ff}.slot{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:110px;min-height:44px;border:2px dashed #00aee8;border-radius:7px;background:white;font:inherit;color:inherit;padding:3px 8px;cursor:pointer}.slot.correct{background:#dcfce5;border-color:#22aa55}.slot.wrong{background:#ffe3e3;border-color:#ff4545}.slot.over{outline:3px solid #ff8200}button{touch-action:manipulation}.hint{color:#47717e;line-height:1.6;font-size:16px}@media(max-width:760px){.fillrow{grid-template-columns:1fr;gap:12px}.row-options{justify-content:flex-start}.slot{min-width:95px}}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ–</h2><section id="questions"></section><div class="actions"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div></main><script>const data=[["कोयल का स्वर कैसा है?", ["कड़वा", "मस्ताना", "चंचल"], 1], ["गाना कौन गाते हैं?", ["भौंरे", "हवा", "मन"], 0], ["‘खुश’ का विलोम शब्द है–", ["दुखी", "क्रोधित", "अचंभित"], 0], ["‘गाना’ से मिलता-जुलता शब्द है–", ["पाना", "तारा", "मोर"], 0]];let answers=Array(data.length).fill(null);const root=document.getElementById('questions');function pick(i,j){answers[i]=j;render()}function render(){root.innerHTML=data.map((q,i)=>`<article class="q" id="q${i}"><b>${'कखगघ'[i]}. ${q[0]}</b><div class="opts">${q[1].map((o,j)=>`<button type="button" class="opt ${answers[i]===j?'sel':''}" id="o${i}-${j}" aria-pressed="${answers[i]===j}" onclick="pick(${i},${j})"><span>(${['i','ii','iii'][j]}) ${o}</span><span aria-hidden="true">${answers[i]===j?'☑':'□'}</span></button>`).join('')}</div><span class="feedback" id="f${i}" role="status"></span></article>`).join('')}function check(){render();data.forEach((q,i)=>{const f=document.getElementById('f'+i);if(answers[i]===null){f.textContent='कृपया एक उत्तर चुनिए।';return}const ok=answers[i]===q[2];document.getElementById('o'+i+'-'+answers[i]).classList.add(ok?'correct':'wrong');f.textContent=ok?'✓ सही उत्तर!':'फिर से प्रयास कीजिए।'})}function showAnswers(){answers=data.map(q=>q[2]);check()}function resetAll(){answers.fill(null);render()}document.getElementById('submit').onclick=check;document.getElementById('show').onclick=showAnswers;document.getElementById('reset').onclick=resetAll;render();</script></body></html>
