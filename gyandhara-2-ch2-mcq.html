<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gyandhara-2-ch1-mcq.html</title><style>*{box-sizing:border-box}body{margin:0;background:#def8ff;font-family:"Noto Sans Devanagari",Arial,sans-serif;color:#142b3c}.sheet{width:min(920px,96vw);margin:12px auto;background:white;border:3px solid #08abd4;border-radius:22px;padding:18px 24px;min-height:min(620px,94vh);display:flex;flex-direction:column}h1{font-size:clamp(19px,2.6vw,27px);color:#00a7dc;margin:0 0 16px;font-weight:700}.content{flex:1}.q{border:1.5px solid #04c5ee;background:#f1fbff;border-radius:12px;padding:12px 15px;margin:9px 0;font-size:19px}.options{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:9px}.opt,.word{font:inherit;border:1.5px solid #ff2680;background:white;border-radius:9px;padding:7px 12px;cursor:pointer}.opt.selected,.word.selected{background:#d9f9e7;border-color:#12ad71}.opt.good,.slot.good{background:#d6f9e1;border-color:#15b47a}.opt.bad,.slot.bad{background:#ffe1e1;border-color:#ec4343}.actions{display:flex;justify-content:center;gap:8px;margin-top:14px}.actions button{border:1.5px solid #ff007b;border-radius:10px;background:white;padding:8px 17px;cursor:pointer;font-size:15px}.score{text-align:center;color:#0070b8;font-size:19px;font-weight:bold;margin-top:8px}.bank{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding:10px;background:#e4f8ff;border-radius:12px;margin-bottom:15px}.word{border-color:#00b9e7}.word.used{opacity:.4}.slot{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:115px;min-height:37px;border:2px dashed #ff664f;border-radius:7px;background:white;cursor:pointer;padding:2px 8px;margin:0 3px}.sentence{line-height:2.5}.tfopts{display:flex;gap:7px;margin-left:auto}.tfopts .opt{font-size:16px;min-width:55px}.tfrow{display:flex;align-items:center;gap:15px}.tfrow .sentence{flex:1;line-height:1.6}@media(max-width:650px){.sheet{padding:12px;min-height:96vh}.q{font-size:16px;padding:9px}.options{gap:7px}.opt,.word{padding:6px}.tfrow{flex-wrap:wrap}.tfopts{margin-left:0}}</style></head><body><main class="sheet"><h1>सही विकल्प पर सही (✓) का चिह्न लगाइए–</h1><div class="content" id="content"></div><div class="actions"><button id="submit">Submit</button><button id="reset">Reset</button></div><div class="score" id="score">Score: 0 / 4</div></main><script>const data=[["भाषा की सबसे छोटी इकाई को कहते हैं–", ["वाक्य", "शब्द", "वर्ण"], 2], ["वर्णों के क्रमानुसार समूह को कहते हैं–", ["पुष्पमाला", "वर्णमाला", "पर्वतमाला"], 1], ["हिंदी वर्णमाला में कुल वर्ण हैं–", ["बावन (52)", "उनतालीस (39)", "पच्चीस (25)"], 0], ["अं और अः वर्णों को कहते हैं–", ["विसर्ग", "अनुस्वार", "अयोगवाह"], 2]];const key='gyandhara-2-ch1-mcq';let selected=JSON.parse(localStorage.getItem(key)||'{}');const labels=['(क)','(ख)','(ग)','(घ)'];function render(){content.innerHTML=data.map((q,i)=>`<div class="q"><div>${labels[i]} ${q[0]}</div><div class="options">${q[1].map((o,j)=>`<button class="opt ${selected[i]===j?'selected':''}" onclick="choose(${i},${j})">(${['अ','ब','स'][j]}) ${o}</button>`).join('')}</div></div>`).join('')}function choose(i,j){selected[i]=j;localStorage.setItem(key,JSON.stringify(selected));render()}submit.onclick=()=>{let n=0;document.querySelectorAll('.q').forEach((el,i)=>{if(selected[i]===data[i][2])n++;el.querySelectorAll('.opt').forEach((b,j)=>{if(selected[i]===j)b.classList.add(j===data[i][2]?'good':'bad')})});score.textContent=`Score: ${n} / 4`};reset.onclick=()=>{selected={};localStorage.removeItem(key);score.textContent='Score: 0 / 4';render()};render();</script></body></html>
