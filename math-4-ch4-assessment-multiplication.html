<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solve the following multiplication using standard method.</title><style>*{box-sizing:border-box}body{margin:0;background:#e2faff;font-family:Georgia,serif;color:#222}.wrap{max-width:980px;margin:18px auto;background:#fff;border:3px solid #00a8db;border-radius:24px;padding:22px 27px}h2{color:#00a6dc;font-size:24px;margin:0 0 20px}.question{padding:11px 12px;border:1px solid #61c8e9;border-radius:10px;background:#f0fbff;margin:10px 0;font-size:18px}.options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:12px}.option{font:17px Georgia,serif;display:flex;align-items:center;justify-content:space-between;gap:7px;text-align:left;border:1px solid #b7dce9;border-radius:7px;padding:8px;background:white;cursor:pointer}.square{width:24px;height:24px;border:2px solid #00b3ee;flex:none}.selected{background:#d7f3ff;border-color:#009cce}.good{background:#ddf9e3!important;border-color:#14a44d!important}.bad{background:#ffe1e1!important;border-color:#e93636!important;animation:blink .4s 2}@keyframes blink{50%{background:#ff9b9b}}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.item{background:#effbff;border:1px solid #63d2ed;border-radius:9px;padding:12px;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.item input{width:110px;height:37px;border:2px solid #ff5360;background:#fff;font-size:17px;text-align:center;max-width:100%}.actions{display:flex;justify-content:center;gap:13px;margin-top:23px}.actions button{background:#ff8500;border:0;border-radius:24px;color:white;font-weight:bold;padding:11px 19px;cursor:pointer}#score{font:bold 21px Arial;color:#0750b6;text-align:center;margin-top:14px}@media(max-width:700px){.wrap{padding:15px;margin:7px}.options{grid-template-columns:repeat(2,minmax(0,1fr))}.items{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.options,.items{grid-template-columns:1fr}h2{font-size:21px}}</style></head><body><main class="wrap"><h2>Solve the following multiplication using standard method.</h2><div class="items"><div class="item"><b>a.</b><span>185 × 278 =</span><input class="answer" inputmode="numeric" aria-label="Answer a"></div><div class="item"><b>b.</b><span>659 × 189 =</span><input class="answer" inputmode="numeric" aria-label="Answer b"></div><div class="item"><b>c.</b><span>4324 × 3 =</span><input class="answer" inputmode="numeric" aria-label="Answer c"></div><div class="item"><b>d.</b><span>9292 × 2 =</span><input class="answer" inputmode="numeric" aria-label="Answer d"></div><div class="item"><b>e.</b><span>4444 × 44 =</span><input class="answer" inputmode="numeric" aria-label="Answer e"></div><div class="item"><b>f.</b><span>2326 × 42 =</span><input class="answer" inputmode="numeric" aria-label="Answer f"></div></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 6</div></main><script>const answers=[51430, 124551, 12972, 18584, 195536, 97692],mode="fill",key="math-4-ch4-assessment-multiplication",selected={};function choose(q,v){selected[q]=v;document.querySelectorAll('[data-q="'+q+'"]').forEach(b=>{b.classList.toggle('selected',+b.dataset.v===v);b.classList.remove('good','bad')});save()}function save(){try{localStorage.setItem(key,JSON.stringify({selected,values:[...document.querySelectorAll('.answer')].map(x=>x.value),score:document.getElementById('score').textContent}))}catch(e){}}function checkAnswers(){let count=0;if(mode==='mcq'){answers.forEach((correct,i)=>{let ok=selected[i]===correct;if(ok)count++;document.querySelectorAll('[data-q="'+i+'"]').forEach(b=>{b.classList.remove('good','bad');if(+b.dataset.v===selected[i])b.classList.add(ok?'good':'bad')})})}else{document.querySelectorAll('.answer').forEach((el,i)=>{let ok=el.value.trim().replace(/,/g,'')===String(answers[i]);el.classList.toggle('good',ok);el.classList.toggle('bad',!ok);if(ok)count++})}document.getElementById('score').textContent='Score: '+count+' / '+answers.length;save()}function resetExercise(){Object.keys(selected).forEach(k=>delete selected[k]);document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected','good','bad'));document.querySelectorAll('.answer').forEach(x=>{x.value='';x.classList.remove('good','bad')});document.getElementById('score').textContent='Score: 0 / '+answers.length;save()}document.querySelectorAll('.answer').forEach(el=>el.addEventListener('input',()=>{el.classList.remove('good','bad');save()}));try{const d=JSON.parse(localStorage.getItem(key)||'null');if(d){(d.values||[]).forEach((v,i)=>{let e=document.querySelectorAll('.answer')[i];if(e)e.value=v});Object.entries(d.selected||{}).forEach(([q,v])=>choose(+q,+v));if(d.score)document.getElementById('score').textContent=d.score}}catch(e){}</script></body></html>
