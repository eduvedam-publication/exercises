<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#dff8ff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:5px solid #08a6d1;border-radius:22px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;color:#ff0072;font-size:clamp(22px,3vw,30px)}.content{flex:1}.question{margin:12px 0;padding:13px 16px;border:2px solid #69dfff;border-radius:16px;background:#f3fbfe;font-size:clamp(16px,2vw,19px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option,.btn{border:2px solid #ff0072;background:#fff;border-radius:10px;padding:8px 13px;font-size:16px;cursor:pointer}.option.selected{background:#ffe7f1}.option.correct,.answer.correct,.order.correct{background:#dff7e4}.option.wrong,.answer.wrong,.order.wrong{background:#ffe2e2}.answer{border:2px solid #ff4c39;border-radius:5px;padding:6px 8px;font-size:17px;min-width:125px;max-width:205px;margin:2px 4px}.orderrow{display:flex;justify-content:space-between;align-items:center;gap:15px}.order{width:58px;border:2px solid #ff0072;border-radius:7px;padding:7px;text-align:center;font-size:17px}.bottom{text-align:center;margin-top:22px}.score{margin-top:9px;color:#087fc2;font-weight:800;font-size:18px}@media(max-width:650px){body{padding:7px}.exercise{padding:15px 11px}.options{flex-direction:column}.option{width:100%;text-align:left}.answer{min-width:100px;max-width:145px}}</style><main class=exercise><h1 class=title>Multiple choice questions.</h1><div class=content id=c></div><div class=bottom><button class=btn onclick=check()>Submit</button><button class=btn onclick=reset()>Reset</button><div class=score id=sc></div></div></main><script>function L(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function S(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){let p={exerciseType:t,response:r};try{parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}}const K='b8-ch9-mcq',D=[["What was John's occupation?", ['Farmer', 'Fisherman', 'Carpenter'], 1], ['Why did Jenny go out during the storm?', ['To visit the market', 'To look for her husband and check the lighthouse', 'To collect firewood'], 1], ['Whom did Jenny find in the old cabin?', ['A fisherman and his family', 'A sick old man', 'A dead widow and her two children'], 2], ["What were the names of the widow's children?", ['William and Madeline', 'John and Jenny', 'William and Jenny'], 0], ['What did John decide to do for the orphaned children?', ['Send them away', 'Bring them up with his own children', 'Ask someone else to care for them'], 1]];let s=L(K);s.a=s.a||{};s.score=s.score||0;function draw(){c.innerHTML=D.map((q,i)=>`<div class=question><b>${i+1}.</b> ${q[0]}<div class=options>${q[1].map((o,j)=>`<button class="option ${s.a[i]===j?'selected':''}" onclick="pick(${i},${j})">${['i.','ii.','iii.'][j]} ${o}</button>`).join('')}</div></div>`).join('');sc.textContent=`Score: ${s.score} / 5`}function pick(i,j){s.a[i]=j;S(K,s);draw()}function check(){let n=0;document.querySelectorAll('.question').forEach((r,i)=>{r.querySelectorAll('.option').forEach((b,j)=>{b.classList.remove('correct','wrong');if(j===D[i][2])b.classList.add('correct');if(s.a[i]===j&&j!==D[i][2])b.classList.add('wrong')});if(s.a[i]===D[i][2])n++});s.score=n;S(K,s);sc.textContent=`Score: ${n} / 5`;send('OPTION',{question1:s.a[0],question2:s.a[1],question3:s.a[2],question4:s.a[3],question5:s.a[4]})}function reset(){s={a:{},score:0};S(K,s);draw()}draw()</script>
