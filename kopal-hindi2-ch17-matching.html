<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-hindi2-ch17-matching</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#dff6ff,#fff,#e8f5e9);font-family:Arial,"Nirmala UI",sans-serif;color:#333;display:flex;align-items:center;justify-content:center;padding:18px}.quiz-box{width:min(100%,950px);background:#fff;border:5px solid #00b8f0;border-radius:28px;padding:28px;box-shadow:0 12px 35px #0002}h1{font-size:27px;color:#00a6d6;margin:0 0 22px}.question-box{background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:17px 20px;margin-bottom:14px;font-size:21px;line-height:1.8}.options{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}button{font:inherit;cursor:pointer}.option,.word,.blank{border:2px solid #ff4fa0;border-radius:12px;background:white;padding:8px 18px;font-size:20px;color:#333}.selected{background:#fff0f7;outline:3px solid #ff4fa0}.correct{background:#d4f8d4!important;border-color:#2e7d32!important;color:#1b5e20}.wrong{background:#ffd9dd!important;border-color:#c62828!important;color:#b71c1c}.actions{text-align:center;margin-top:20px}.actions button{border:0;border-radius:32px;padding:12px 28px;margin:6px;font-size:18px;font-weight:bold;color:white;background:linear-gradient(135deg,#ff9800,#ff6f00)}#result{text-align:center;margin:18px 0 0;font-size:24px;font-weight:bold;color:#0047ab}.help-box{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;background:linear-gradient(135deg,#fff,#d8f36b,#fff);padding:15px;border-radius:16px;margin-bottom:20px;min-height:75px}.word{touch-action:none;user-select:none}.blank{min-width:150px;min-height:48px;border-style:dashed;margin:4px;vertical-align:middle;color:#d81b60}.hint{font-size:16px;margin:0 0 18px}.feedback{font-size:16px;margin-left:10px}button:focus-visible{outline:3px solid #0047ab;outline-offset:3px}.dragging{opacity:.55}.hover{outline:3px solid #00b8f0}@media(max-width:650px){body{padding:8px;align-items:flex-start}.quiz-box{padding:16px 12px;border-radius:20px}h1{font-size:22px}.question-box{padding:13px;font-size:18px}.option,.word,.blank{font-size:18px}.actions button{width:100%;margin:6px 0}}.match{position:relative}.cols{display:grid;grid-template-columns:1fr 1fr;gap:90px}.item{height:58px;display:flex;align-items:center;justify-content:space-between}.dot{width:20px;height:20px;border:3px solid #ff4fa0;border-radius:50%;background:#fff}.active .dot{background:#ff4fa0}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}line{stroke:#ff4fa0;stroke-width:3}</style></head><body><main class="quiz-box"><h1>प्रकृति की ध्वनि पहचानिए, आवाज मिलाइए–</h1><div class="question-box match" id="box"><svg id="svg"></svg><div class="cols"><div id="left"></div><div id="right"></div></div></div><div class="actions"><button onclick="check()">उत्तर जाँचें</button><button onclick="reset()">फिर से करें</button></div><div id="result"></div></main><script>
const L=[["बादल","☁️"],["बारिश","☔"],["नदी","🏞️"],["पत्ते","🍃"]],R=["टिप-टिप","गरजना","सरसराहट","कलकल"],C={"बादल":"गरजना","बारिश":"टिप-टिप","नदी":"कलकल","पत्ते":"सरसराहट"},KEY="kopal-hindi2-ch17-matching";let A=JSON.parse(localStorage.getItem(KEY)||"{}"),active="";function save(){localStorage.setItem(KEY,JSON.stringify(A))}
function draw(){left.innerHTML=L.map((x,i)=>`<div class="item ${active===x[0]?'active':''}"><span>(${['क','ख','ग','घ'][i]}) ${x[0]} ${x[1]}</span><button class=dot onclick="active='${x[0]}';draw()"></button></div>`).join('');right.innerHTML=R.map((x,i)=>`<div class=item><button class=dot onclick="if(active){A[active]='${x}';active='';save();draw()}"></button><span>${x}</span></div>`).join('');requestAnimationFrame(lines);result.textContent="अंक: 0 / 4"}
function lines(){svg.innerHTML='';let br=box.getBoundingClientRect();Object.entries(A).forEach(([l,r])=>{let li=L.findIndex(x=>x[0]===l),ri=R.indexOf(r);if(li<0||ri<0)return;let a=left.children[li].querySelector('.dot').getBoundingClientRect(),b=right.children[ri].querySelector('.dot').getBoundingClientRect();svg.innerHTML+=`<line x1="${a.left+a.width/2-br.left}" y1="${a.top+a.height/2-br.top}" x2="${b.left+b.width/2-br.left}" y2="${b.top+b.height/2-br.top}"/>`})}
function check(){let n=Object.keys(C).filter(k=>A[k]===C[k]).length;result.textContent=`अंक: ${n} / 4`;parent.postMessage({type:"VIDYALAYA_EXERCISE_SUBMIT",payload:{exerciseType:"MATCHING",response:A}},"*")}function reset(){A={};active="";save();draw()}addEventListener('resize',lines);draw();</script></body></html>
