<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOPAL Class 5 Chapter 8 tick — 2026–27</title><style>*{box-sizing:border-box}body{margin:0;background:#d0faff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#202020}.wrap{max-width:990px;margin:22px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{color:#00a9e9;margin:0 0 16px;font-size:25px}.q{background:#ebfaff;border:1px solid #00b9ed;border-radius:11px;padding:13px;margin:9px 0}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:9px}.opt{background:white;border:1px solid #9bdfff;border-radius:7px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}.opt.selected{border:2px solid #008ad1;background:#d7f4ff}.correct{background:#d6ffe5!important;border-color:#0baf54!important}.wrong{background:#ffe0e0!important;border-color:#e33!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.5}}.buttons{text-align:center;margin-top:24px}button{background:#ff8000;color:white;border:0;border-radius:22px;padding:11px 19px;margin:3px;cursor:pointer;font-weight:bold}.score{text-align:center;color:#0051b8;font-size:19px;font-weight:bold;margin:12px}.bank{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;background:#dff7ff;padding:13px;border-radius:10px;margin:12px 0}.chip{color:#202020;font-family:inherit;font-weight:normal;line-height:1.5;appearance:none;border:1px solid #00aeec;background:white;border-radius:7px;padding:9px 14px;cursor:grab;font-size:18px}.chip.active{outline:3px solid orange}.slot{display:inline-flex;min-width:125px;min-height:37px;border:2px dashed #ff724d;border-radius:7px;vertical-align:middle;align-items:center;justify-content:center;padding:4px 10px;cursor:pointer;background:white}.slot.filled{border-style:solid}.statement{display:flex;gap:10px;justify-content:space-between;align-items:center}.choices{display:flex;gap:6px;flex-shrink:0}.choice{color:#202020;font-family:Arial,sans-serif;font-size:21px;font-weight:bold;min-width:40px;min-height:37px;line-height:1;appearance:none;border:1px solid #00aeec;background:white;border-radius:7px;padding:7px 13px;cursor:pointer}.choice.selected{background:#ccefff;border-width:2px}@media(max-width:650px){.wrap{margin:7px;padding:14px}.options{grid-template-columns:1fr}.q{font-size:16px}.statement{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><h2>दिए गए वाक्यों के आगे ‘सही’ या ‘गलत’ लिखिए।</h2><div id="questions"></div><div class="buttons"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Marks: 0 / 4</div></main><script>const data=[["हेलन केलर में माँ का नाम हेलन और पुत्री का नाम केलर था।", false], ["हेलन केलर में पुत्री का नाम हेलन और माँ का नाम केलर था।", true], ["केलर की मुलाकात डॉ. माइकल एनेग्नास से हुई।", true], ["हेलन की अध्यापिका का नाम एनी सुलिवान नहीं था।", false]];const key='kopal-5-ch8-tick-v1';let answers=JSON.parse(localStorage.getItem(key)||'[null,null,null,null]');function persist(){localStorage.setItem(key,JSON.stringify(answers))}function render(){document.getElementById('questions').innerHTML=data.map((q,i)=>`<div class="q statement"><span>(${['क','ख','ग','घ'][i]}) ${q[0]}</span><span class="choices"><button class="choice ${answers[i]===true?'selected':''}" data-q="${i}" data-v="true" onclick="pick(${i},true)" aria-label="सही">✓</button><button class="choice ${answers[i]===false?'selected':''}" data-q="${i}" data-v="false" onclick="pick(${i},false)" aria-label="गलत">✗</button></span></div>`).join('')}function pick(i,v){answers[i]=v;persist();render()}function check(){let n=0;document.querySelectorAll('.choice').forEach(el=>{let i=+el.dataset.q,v=el.dataset.v==='true';if(answers[i]===v)el.classList.add(v===data[i][1]?'correct':'wrong')});data.forEach((q,i)=>{if(answers[i]===q[1])n++});document.getElementById('score').textContent=`Marks: ${n} / 4`}function showAnswers(){answers=data.map(q=>q[1]);persist();render();check()}function resetAll(){answers=[null,null,null,null];persist();render();document.getElementById('score').textContent='Marks: 0 / 4'}render();</script></body></html>
