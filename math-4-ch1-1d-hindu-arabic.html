<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write the Hindu-Arabic numerals of the given Roman numbers.</title><style>*{box-sizing:border-box}body{margin:0;background:#def8ff;font-family:Arial,sans-serif;color:#263548}.sheet{max-width:930px;margin:20px auto;background:white;border:3px solid #00a9db;border-radius:22px;padding:25px 30px;min-height:320px}h1{font-size:23px;color:#00a8dc;margin:0 0 23px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.item{background:#effaff;border:1.5px solid #08bfe7;border-radius:12px;padding:15px 12px;display:flex;align-items:center;gap:9px;white-space:nowrap;font-size:18px}.item label{font-weight:600}.item input{width:90px;min-width:0;padding:8px 4px;text-align:center;border:2px solid #ff5868;border-radius:5px;font-size:17px;background:white;outline:none}.item input.correct{background:#dcfce7;border-color:#22a06b}.item input.wrong{background:#ffe3e6;border-color:#ff3353;animation:blink .35s 3}@keyframes blink{50%{background:#fff}}.actions{display:flex;justify-content:center;gap:12px;margin-top:30px}button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}.score{text-align:center;color:#0756b7;font-size:20px;font-weight:700;margin-top:14px}@media(max-width:600px){.sheet{margin:8px;padding:17px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:10px 6px;gap:5px;font-size:15px}.item input{width:68px;font-size:15px}h1{font-size:20px}}</style></head><body><main class="sheet"><h1>Write the Hindu-Arabic numerals of the given Roman numbers.</h1><div class="grid"><div class="item"><label>a.</label><span>LV</span><input id="a0" autocomplete="off" aria-label="Answer 1"></div><div class="item"><label>b.</label><span>XXXIX</span><input id="a1" autocomplete="off" aria-label="Answer 2"></div><div class="item"><label>c.</label><span>LXIV</span><input id="a2" autocomplete="off" aria-label="Answer 3"></div><div class="item"><label>d.</label><span>LXXVIII</span><input id="a3" autocomplete="off" aria-label="Answer 4"></div></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div class="score" id="score">Score: 0 / 4</div></main><script>const TYPE='arabic';const ANSWERS=['55', '39', '64', '78'];const KEY='math-4-ch1-1d-'+TYPE;const inputs=[...document.querySelectorAll('input')];function save(){localStorage.setItem(KEY,JSON.stringify(inputs.map(e=>e.value)))}function checkAnswers(){let score=0;inputs.forEach((e,i)=>{let good=e.value.trim().toUpperCase().replace(/\s/g,'')===ANSWERS[i].toUpperCase();e.className=good?'correct':'wrong';if(good)score++});document.getElementById('score').textContent=`Score: ${score} / ${ANSWERS.length}`;save()}function resetExercise(){inputs.forEach(e=>{e.value='';e.className=''});document.getElementById('score').textContent=`Score: 0 / ${ANSWERS.length}`;localStorage.removeItem(KEY)}try{let saved=JSON.parse(localStorage.getItem(KEY)||'[]');inputs.forEach((e,i)=>{e.value=saved[i]||'';e.addEventListener('input',()=>{e.className='';save()})})}catch(e){}</script></body></html>
