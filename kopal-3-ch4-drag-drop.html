<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रकृति द्वारा तथा मनुष्य द्वारा बनाई गई चीजों को छाँटकर अलग-अलग लिखिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:450px;display:flex;flex-direction:column}h2{font-size:23px;color:#00a9e5;margin:0 0 18px}.q{border:1.5px solid #00c7ee;border-radius:12px;background:#f0fbfe;padding:12px;margin:7px 0}.opts{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}.opt,.chip{border:1.5px solid #ff0070;border-radius:9px;background:white;padding:7px 12px;font-size:17px;cursor:pointer;color:#222}.opt.selected,.chip.selected{background:#d7efff;border-color:#007fdb}.ok{background:#d9f9dc!important;border-color:#0a9b55!important}.bad{background:#ffe3e3!important;border-color:#e32b2b!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff5d5d}}.actions{display:flex;gap:9px;justify-content:center;margin-top:auto;padding-top:24px}.actions button{background:#ff8500;color:white;border:0;border-radius:20px;padding:10px 19px;cursor:pointer}#result{text-align:center;color:#0061b4;font-weight:bold;margin:12px}.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;background:#e7f8fc;border-radius:12px;margin-bottom:14px}.chip{border-color:#00a9e5}.slot{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:110px;min-height:38px;border:2px dashed #ff5656;border-radius:6px;background:#fff;cursor:pointer;padding:5px 8px}.line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.wordrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0}.field{border:1.5px solid #ff5b5b;border-radius:5px;padding:7px;font-size:18px;max-width:220px} @media(max-width:600px){.wrap{margin:0;border-radius:0;padding:14px;min-height:100vh}.opts{gap:5px}.opt{font-size:15px;padding:6px}}</style></head><body><main class="wrap"><h2>प्रकृति द्वारा तथा मनुष्य द्वारा बनाई गई चीजों को छाँटकर अलग-अलग लिखिए–</h2><div class="bank"><button class="chip" data-word="बादल" onclick="pick(this)">बादल</button><button class="chip" data-word="पहाड़" onclick="pick(this)">पहाड़</button><button class="chip" data-word="कुर्सी" onclick="pick(this)">कुर्सी</button><button class="chip" data-word="नदियाँ" onclick="pick(this)">नदियाँ</button><button class="chip" data-word="पेंसिल" onclick="pick(this)">पेंसिल</button><button class="chip" data-word="कार" onclick="pick(this)">कार</button><button class="chip" data-word="सूरज" onclick="pick(this)">सूरज</button><button class="chip" data-word="हवाई-जहाज" onclick="pick(this)">हवाई-जहाज</button><button class="chip" data-word="मनुष्य" onclick="pick(this)">मनुष्य</button><button class="chip" data-word="घर" onclick="pick(this)">घर</button></div><section class="q"><div class="line"><b>प्रकृति द्वारा</b> <span class="slot" data-group="प्रकृति द्वारा" data-i="0" onclick="place(this)"></span><span class="slot" data-group="प्रकृति द्वारा" data-i="1" onclick="place(this)"></span><span class="slot" data-group="प्रकृति द्वारा" data-i="2" onclick="place(this)"></span><span class="slot" data-group="प्रकृति द्वारा" data-i="3" onclick="place(this)"></span><span class="slot" data-group="प्रकृति द्वारा" data-i="4" onclick="place(this)"></span></div></section><section class="q"><div class="line"><b>मनुष्य द्वारा</b> <span class="slot" data-group="मनुष्य द्वारा" data-i="0" onclick="place(this)"></span><span class="slot" data-group="मनुष्य द्वारा" data-i="1" onclick="place(this)"></span><span class="slot" data-group="मनुष्य द्वारा" data-i="2" onclick="place(this)"></span><span class="slot" data-group="मनुष्य द्वारा" data-i="3" onclick="place(this)"></span><span class="slot" data-group="मनुष्य द्वारा" data-i="4" onclick="place(this)"></span></div></section><div class="actions"><button onclick="submit()">Submit</button><button onclick="resetAll()">Reset</button></div><div id="result"></div></main><script>const key='kopal-2-ch4-drag-drop';let selected='',slots=JSON.parse(localStorage.getItem(key)||'{}');function pick(e){selected=e.dataset.word;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('selected',c.dataset.word===selected))}function place(e){let id=e.dataset.group+e.dataset.i;if(selected){let old=Object.keys(slots).find(k=>slots[k]===selected);if(old)delete slots[old];slots[id]=selected;selected=''}else delete slots[id];localStorage.setItem(key,JSON.stringify(slots));draw()}function draw(){document.querySelectorAll('.slot').forEach(e=>{e.textContent=slots[e.dataset.group+e.dataset.i]||'';e.classList.remove('ok','bad')});document.querySelectorAll('.chip').forEach(c=>{c.style.opacity=Object.values(slots).includes(c.dataset.word)?'.4':'1';c.classList.remove('selected')})}function submit(){let correct={'बादल':'प्रकृति द्वारा','पहाड़':'प्रकृति द्वारा','नदियाँ':'प्रकृति द्वारा','सूरज':'प्रकृति द्वारा','मनुष्य':'प्रकृति द्वारा','कुर्सी':'मनुष्य द्वारा','पेंसिल':'मनुष्य द्वारा','कार':'मनुष्य द्वारा','हवाई-जहाज':'मनुष्य द्वारा','घर':'मनुष्य द्वारा'},n=0;document.querySelectorAll('.slot').forEach(e=>{let v=slots[e.dataset.group+e.dataset.i];if(v){let ok=correct[v]===e.dataset.group;e.classList.add(ok?'ok':'bad');if(ok)n++}});document.getElementById('result').textContent=`Score: ${n} / 10`;}function resetAll(){slots={};selected='';localStorage.removeItem(key);document.getElementById('result').textContent='';draw()}draw();</script></body></html>
