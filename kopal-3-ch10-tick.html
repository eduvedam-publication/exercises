<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kopal-2-ch10-tick.html</title><style>*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#222}.wrap{max-width:900px;margin:12px auto;background:white;border:3px solid #00a9d6;border-radius:22px;padding:20px 25px;min-height:440px;display:flex;flex-direction:column}h2{font-size:23px;color:#ff0066;margin:0 0 16px}.q{background:#effaff;border:1.5px solid #00c4ed;border-radius:12px;padding:11px 15px;margin:6px 0;font-size:18px;line-height:1.7}.options{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px}.opt{font:inherit;font-size:16px;border:1.5px solid #ff0066;background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}.opt.selected{background:#dcefff}.ok{background:#d9f8dc!important;border-color:#24ad54!important}.bad{background:#ffe2e2!important;border-color:#f33!important;animation:blink .5s 3}@keyframes blink{50%{background:#ff8080}}.actions{display:flex;justify-content:center;gap:12px;margin-top:auto;padding-top:24px}button.action{background:#ff8700;color:white;border:0;border-radius:18px;padding:9px 21px;font-weight:bold;cursor:pointer}#result{text-align:center;color:#0755af;font-weight:bold;margin-top:12px}.answer{border:1.5px solid #ff6b59;border-radius:7px;padding:8px;font:18px Arial,"Noto Sans Devanagari",sans-serif;width:100%;margin-top:7px} @media(max-width:650px){.wrap{margin:4px;padding:14px;min-height:calc(100vh - 8px)}h2{font-size:21px}.q{font-size:16px}}</style></head><body><main class="wrap"><h2>सही (✓) या गलत (✗) का चिह्न लगाएँ–</h2><div class="q">(क) मिनी और नितिन आज पटाखे और फुलझड़ी लेने जा रहे थे।<div class="options"><button class="opt" data-q="0" data-o="1" onclick="choose(0,1)">✓ सही</button><button class="opt" data-q="0" data-o="0" onclick="choose(0,0)">✗ गलत</button></div></div><div class="q">(ख) फाल्गुन मास की पूर्णिमा को होलिका जलाई जाती है।<div class="options"><button class="opt" data-q="1" data-o="1" onclick="choose(1,1)">✓ सही</button><button class="opt" data-q="1" data-o="0" onclick="choose(1,0)">✗ गलत</button></div></div><div class="q">(ग) सब लोगों पर कीचड़, ग्रीस या अन्य गंदी चीजें डालनी चाहिए।<div class="options"><button class="opt" data-q="2" data-o="1" onclick="choose(2,1)">✓ सही</button><button class="opt" data-q="2" data-o="0" onclick="choose(2,0)">✗ गलत</button></div></div><div class="q">(घ) कीचड़, ग्रीस लगाने से आँखों को नुकसान पहुँचता है।<div class="options"><button class="opt" data-q="3" data-o="1" onclick="choose(3,1)">✓ सही</button><button class="opt" data-q="3" data-o="0" onclick="choose(3,0)">✗ गलत</button></div></div><div class="q">(ङ) होली का त्योहार भेदभाव मिटाता है।<div class="options"><button class="opt" data-q="4" data-o="1" onclick="choose(4,1)">✓ सही</button><button class="opt" data-q="4" data-o="0" onclick="choose(4,0)">✗ गलत</button></div></div><div class="actions"><button class="action" onclick="submitAnswers()">Submit</button><button class="action" onclick="resetExercise()">Reset</button></div><div id="result"></div></main><script>const key='kopal-2-ch10-tick',correct=[1,1,0,1,1];let values=JSON.parse(localStorage.getItem(key)||'[null,null,null,null,null]');function paint(){document.querySelectorAll('.opt').forEach(b=>{b.classList.toggle('selected',values[+b.dataset.q]===+b.dataset.o);b.classList.remove('ok','bad')})}function choose(q,o){values[q]=o;localStorage.setItem(key,JSON.stringify(values));paint()}function submitAnswers(){let score=0;correct.forEach((c,i)=>{let b=document.querySelector(`.opt[data-q="${i}"][data-o="${values[i]}"]`);if(b){let ok=values[i]===c;b.classList.add(ok?'ok':'bad');if(ok)score++}});document.getElementById('result').textContent=`Score: ${score} / 5`}function resetExercise(){values=[null,null,null,null,null];localStorage.removeItem(key);paint();document.getElementById('result').textContent=''}paint();</script></body></html>
