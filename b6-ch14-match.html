<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match the following.</title><style>*{box-sizing:border-box}body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#111}.w{max-width:980px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px;min-height:90vh}h1{color:#009ed2;font-size:28px;margin:4px 0 26px}.q{background:#f7fbfd;border:2px solid #a9e9fb;border-radius:18px;padding:15px 18px;margin:14px 0;font-size:18px;line-height:1.55}.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.opt,button{border:2px solid #ff3c91;background:#fff;border-radius:10px;padding:9px 14px;font-size:16px;cursor:pointer}.sel{background:#ffe5f1!important}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}.actions{display:flex;justify-content:center;gap:14px;margin-top:25px}.actions button{background:#ff8500;color:#fff;border-color:#ff8500;font-weight:bold}#result{text-align:center;font-size:22px;font-weight:bold;color:#064bb4;margin-top:20px}input{border:0;border-bottom:2px solid #777;padding:6px 8px;font-size:17px;min-width:140px;background:#fff}.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px 65px}.match .opt{border-color:#a9e9fb;text-align:left;border-radius:18px}.match .R{text-align:right}@media(max-width:650px){.w{margin:0;border-radius:0;padding:15px}.match{gap:14px 25px}h1{font-size:23px}}</style></head><body><main class="w"><h1>Match the following.</h1><div class=match id=mb><svg id=svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg><button class="opt L" id=L0 onclick=lp(0)>1. Kargil</button><button class="opt R" id=R0 onclick=rp(0)>i. Peacekeeping</button><button class="opt L" id=L1 onclick=lp(1)>2. Soldier</button><button class="opt R" id=R1 onclick=rp(1)>ii. War</button><button class="opt L" id=L2 onclick=lp(2)>3. United Nations</button><button class="opt R" id=R2 onclick=rp(2)>iii. Brave</button><button class="opt L" id=L3 onclick=lp(3)>4. Natural calamity</button><button class="opt R" id=R3 onclick=rp(3)>iv. Peace</button><button class="opt L" id=L4 onclick=lp(4)>5. Reward</button><button class="opt R" id=R4 onclick=rp(4)>v. Rescue mission</button></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="location.reload()">Reset</button></div><div id="result">Score: 0 / 0</div></main><script>const A=[1, 2, 0, 4, 3],M={};let c=null;result.textContent=`Score: 0 / ${A.length}`;function lp(i){c=i;document.querySelectorAll('.L').forEach(x=>x.classList.remove('sel'));L=document.getElementById('L'+i);L.classList.add('sel')}function rp(j){if(c===null)return;Object.keys(M).forEach(k=>{if(M[k]===j)delete M[k]});M[c]=j;c=null;document.querySelectorAll('.L').forEach(x=>x.classList.remove('sel'));draw()}function draw(){let s=document.getElementById('svg'),z=document.getElementById('mb').getBoundingClientRect();s.innerHTML='';Object.entries(M).forEach(([i,j])=>{let a=document.getElementById('L'+i).getBoundingClientRect(),b=document.getElementById('R'+j).getBoundingClientRect();s.innerHTML+=`<line x1="${a.right-z.left}" y1="${a.top+a.height/2-z.top}" x2="${b.left-z.left}" y2="${b.top+b.height/2-z.top}" stroke="#009b8e" stroke-width="4"/>`;})}window.onresize=draw;function check(){let n=0;A.forEach((a,i)=>{if(M[i]===a)n++});result.textContent=`Score: ${n} / ${A.length}`}</script></body></html>
