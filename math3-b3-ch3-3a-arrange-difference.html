<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#e8faff;font-family:Arial,sans-serif}.ex{max-width:1100px;margin:auto;background:#fff;border:4px solid #08a9dc;border-radius:26px;padding:28px}h1{color:#00a5dc;font-size:24px;margin:0 0 22px}.actions{text-align:center;margin-top:28px}.actions button{border:0;border-radius:22px;padding:11px 20px;margin:5px;background:#ff8200;color:#fff;font-weight:bold}.score{text-align:center;color:#064bb4;font-size:21px;font-weight:bold;margin-top:12px}.ans{border:2px solid #ff3b30;height:36px;font-size:17px;padding:4px}.ok{background:#dcf8df!important;border-color:#009b8e!important}.bad{background:#ffe1e1!important;border-color:#e43d30!important}@media(max-width:700px){body{padding:0}.ex{padding:15px;border-radius:0}}.simplegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 32px}.q{display:flex;align-items:center;gap:7px;font:20px Georgia,serif;white-space:nowrap}.q .ans{width:105px}@media(max-width:850px){.simplegrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.simplegrid{grid-template-columns:1fr}}</style></head><body><main class="ex"><h1>Arrange in column and find the difference.</h1><div class="simplegrid"><div class="q"><span>a. &nbsp; 6305 − 3302</span><input class="ans" id="a0" inputmode="numeric"></div><div class="q"><span>b. &nbsp; 3918 − 1605</span><input class="ans" id="a1" inputmode="numeric"></div><div class="q"><span>c. &nbsp; 2985 − 1564</span><input class="ans" id="a2" inputmode="numeric"></div><div class="q"><span>d. &nbsp; 7908 − 603</span><input class="ans" id="a3" inputmode="numeric"></div><div class="q"><span>e. &nbsp; 5632 − 3511</span><input class="ans" id="a4" inputmode="numeric"></div><div class="q"><span>f. &nbsp; 6548 − 5437</span><input class="ans" id="a5" inputmode="numeric"></div></div><div class="actions"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 6</div></main><script>const ans=['3003', '2313', '1421', '7305', '2121', '1111'];function check(){let s=0;ans.forEach((a,i)=>{let e=document.getElementById('a'+i),ok=e.value.trim()===a;e.className='ans '+(ok?'ok':'bad');if(ok)s++});score.textContent=`Score: ${s} / 6`}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.className='ans'});score.textContent='Score: 0 / 6'}</script></body></html>
