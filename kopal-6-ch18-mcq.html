<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सही विकल्प पर सही (✓) का निशान लगाइए–</title><style>*{box-sizing:border-box}body{margin:0;background:#bafaff;font-family:"Noto Sans Devanagari",Arial,sans-serif;color:#15303c}.wrap{width:min(1000px,96vw);margin:20px auto;background:white;border:3px solid #00a9f5;border-radius:20px;padding:24px}h1{font-size:clamp(20px,2.5vw,30px);color:#00a9f5;margin:0 0 16px}.card{background:#dffaff;border:1.5px solid #00a9f5;border-radius:11px;padding:13px 15px;margin:10px 0;font-size:18px}.opts{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}.opt,.bankbtn{border:1px solid #04b5ff;border-radius:8px;background:white;padding:9px 14px;font:inherit;cursor:pointer;color:#172c36}.opt.selected,.bankbtn.active{background:#a4eaff;border-color:#008eea}.correct{background:#c9f5d0!important;border-color:#19a54c!important}.wrong{background:#ffd5d5!important;border-color:#ef3333!important}.blank{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:130px;min-height:42px;border:2px dashed #ff7777;border-radius:8px;background:#fff;cursor:pointer;padding:6px 10px;margin:0 5px}.bank{background:#cff7fc;padding:10px;border-radius:10px;display:flex;flex-wrap:wrap;gap:8px}.bankbtn{font-size:17px}.answer{width:min(100%,660px);border:1.5px solid #00a9f5;border-radius:7px;font:inherit;font-size:18px;padding:10px;margin-top:8px}.actions{text-align:center;margin-top:25px} .actions button{background:#ff7600;color:white;border:0;border-radius:30px;padding:12px 18px;margin:3px;cursor:pointer;font-weight:bold}#score{text-align:center;color:blue;font-size:20px;font-weight:bold;margin-top:8px}.tag{font-size:15px;color:#376477} @media(max-width:600px){.wrap{padding:13px}.card{font-size:16px}.opt{padding:8px}}</style></head><body><main class="wrap"><h1>सही विकल्प पर सही (✓) का निशान लगाइए–</h1><div id="bank" class="bank" style="display:none"></div><div id="questions"></div><div class="actions"><button onclick="submit()">Submit</button><button onclick="showAnswer()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="score">Marks: 0 / 4</div></main><script>const DATA=[["काँटे और फूल का उदाहरण देकर कवि क्या कहना चाहता है?", ["अंतरविरोध", "विरोधी स्वभाव", "समान स्वभाव"], 2], ["कुल की बड़ाई कब काम नहीं आती है?", ["बड़प्पन नहीं होने से", "ओछापन होने से", "गंभीरता न होने से"], 0], ["प्रकृति सबके साथ कैसा व्यवहार करती है?", ["अलग-अलग", "एक-सा", "दोनों"], 1], ["इनमें से यह ‘श्याम’ का अर्थ नहीं है–", ["साँवला", "श्रीकृष्ण", "मुख"], 2]],TYPE="mcq",KEY='kopal-6-ch18-'+TYPE;let values=JSON.parse(localStorage.getItem(KEY)||'{}'),active=null;const root=document.getElementById('questions');function persist(){localStorage.setItem(KEY,JSON.stringify(values))}function clean(s){return String(s||'').replace(/[।,\s]/g,'').normalize('NFC')}function render(){root.innerHTML='';if(TYPE==='mcq'){DATA.forEach((q,i)=>{let c=document.createElement('div');c.className='card';c.innerHTML='<div>('+ 'कखगघ'[i] +') '+q[0]+'</div>';let o=document.createElement('div');o.className='opts';q[1].forEach((s,j)=>{let b=document.createElement('button');b.className='opt'+(values[i]===j?' selected':'');b.textContent='('+['i','ii','iii'][j]+') '+s;b.onclick=()=>{values[i]=j;persist();render()};o.append(b)});c.append(o);root.append(c)})}else{let bank=document.getElementById('bank');bank.innerHTML='';bank.style.display='flex';let opts=[...new Set(DATA.map(q=>q[1]))];opts.forEach((s,j)=>{let b=document.createElement('button');b.className='bankbtn'+(active===j?' active':'');b.textContent=s;b.draggable=true;b.onclick=()=>{active=j;render()};b.ondragstart=e=>e.dataTransfer.setData('text/plain',s);bank.append(b)});DATA.forEach((q,i)=>{let c=document.createElement('div');c.className='card';let label=document.createElement('span');label.textContent='('+ 'कखगघङच'[i]+') '+q[0]+'  – ';c.append(label);if(TYPE==='vakya-shuddhi'){let inp=document.createElement('input');inp.className='answer';inp.value=values[i]||'';inp.placeholder='शुद्ध वाक्य लिखिए';inp.oninput=()=>{values[i]=inp.value;persist()};c.append(inp)}else{let slot=document.createElement('button');slot.className='blank';slot.textContent=values[i]||'________';slot.onclick=()=>{if(active!==null){values[i]=opts[active];persist();active=null;render()}else{delete values[i];persist();render()}};slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();values[i]=e.dataTransfer.getData('text/plain');persist();render()};c.append(slot)}root.append(c)})}}function submit(){let score=0;[...root.children].forEach((c,i)=>{let ok=TYPE==='mcq'?values[i]===DATA[i][2]:clean(values[i])===clean(DATA[i][1]);if(ok)score++;let node=TYPE==='mcq'?c.querySelector('.selected'):c.querySelector('.blank,.answer');if(node){node.classList.remove('correct','wrong');node.classList.add(ok?'correct':'wrong')}});document.getElementById('score').textContent='Marks: '+score+' / '+DATA.length;window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',exerciseType:TYPE==='mcq'?'OPTION':'DRAG_DROP',response:{answers:values,score,total:DATA.length}},'*')}function showAnswer(){DATA.forEach((q,i)=>values[i]=TYPE==='mcq'?q[2]:q[1]);persist();document.getElementById('bank').innerHTML='';render();submit()}function resetAll(){values={};active=null;persist();document.getElementById('bank').innerHTML='';render();document.getElementById('score').textContent='Marks: 0 / '+DATA.length}render();</script></body></html>
