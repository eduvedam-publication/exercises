<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kopal 6 Chapter 18 – सही विकल्प</title><style>*{box-sizing:border-box}body{margin:0;background:#b9faff;font-family:'Nirmala UI','Mangal',sans-serif;color:#15344a}.wrap{width:min(1020px,96vw);margin:18px auto;background:white;border:3px solid #00aeff;border-radius:21px;padding:22px 24px}h1{color:#00a5ed;font-size:clamp(22px,2.4vw,30px);margin:0 0 18px}.q{background:#e0f9ff;border:1.5px solid #00aeff;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:19px}.options{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}.opt{background:white;border:1px solid #56c9ff;border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit;color:inherit;min-height:43px}.opt.selected{background:#a9ecff;border-color:#009ee8}.opt.correct{background:#d6ffe1;border:2px solid #24a452}.opt.wrong{background:#ffe0e0;border:2px solid #ed4545}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px}.actions button{background:#ff7000;border:0;border-radius:22px;color:white;padding:12px 18px;font-weight:bold;cursor:pointer}#marks{text-align:center;color:#0038df;font-size:21px;font-weight:bold;margin:10px 0 0}.note{text-align:center;color:#6b7280;font-size:13px;margin:9px 0 0}@media(max-width:600px){.wrap{padding:14px}.q{font-size:17px}.opt{font-size:16px}}</style></head><body><main class="wrap"><h1>सही विकल्प पर सही (✓) का निशान लगाइए–</h1><div id="questions"></div><div class="actions"><button id="submit">Submit</button><button id="answer">Show Answer</button><button id="reset">Reset</button></div><p id="marks">Marks: 0 / 4</p></main><script>
const qs=[{q:'(क) बालिका सबसे होना __________ चाहती है।',o:['बड़ी','मोटी','छोटी'],a:0},{q:'(ख) जब बच्चे __________ हो जाते हैं, तब माँ उनका हाथ पकड़कर नहीं चलती।',o:['बड़े','बूढ़े','शैतान'],a:0},{q:'(ग) कविता में ‘परियों की बात’ से तात्पर्य है __________।',o:['परियों की बात सुनना','परियों के पास जाना','परियों की कहानी सुनाना'],a:0},{q:'(घ) पेड़ : छाया :: चाँद : __________।',o:['साँवला','श्रीकृष्ण','मुख'],a:2}];
const key='kopal-6-ch-18-tick_2', root=document.getElementById('questions');let selected=Array(qs.length).fill(null),mode='';try{let v=JSON.parse(localStorage.getItem(key));if(Array.isArray(v?.selected)&&v.selected.length===qs.length){selected=v.selected;mode=v.mode||''}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify({selected,mode}))}catch(e){}}
function render(){root.innerHTML='';qs.forEach((item,i)=>{const card=document.createElement('section');card.className='q';const prompt=document.createElement('div');prompt.textContent=item.q;card.append(prompt);const opts=document.createElement('div');opts.className='options';item.o.forEach((label,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=`(${['i','ii','iii'][j]}) ${label}`;if(selected[i]===j)b.classList.add('selected');if(mode==='checked'&&selected[i]===j)b.classList.add(j===item.a?'correct':'wrong');if(mode==='answers'&&j===item.a)b.classList.add('correct');b.addEventListener('click',()=>{selected[i]=j;mode='';save();render()});opts.append(b)});card.append(opts);root.append(card)});document.getElementById('marks').textContent=`Marks: ${mode==='checked'?qs.reduce((n,q,i)=>n+(selected[i]===q.a?1:0),0):0} / ${qs.length}`}
document.getElementById('submit').onclick=()=>{mode='checked';save();render();const response=Object.fromEntries(selected.map((v,i)=>['question'+(i+1),v===null?null:qs[i].o[v]]));try{window.parent?.postMessage({exerciseType:'OPTION',response},'*')}catch(e){};if(typeof window.submitExercise==='function')window.submitExercise({exerciseType:'OPTION',response})};document.getElementById('answer').onclick=()=>{mode='answers';save();render()};document.getElementById('reset').onclick=()=>{selected.fill(null);mode='';save();render()};render();
</script></body></html>
