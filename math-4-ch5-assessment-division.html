<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Divide the following. Also, mention the remainder, if any.</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;font-family:Georgia,'Times New Roman',serif;color:#202020}.exercise{max-width:1020px;margin:20px auto;padding:24px 28px 22px;background:white;border:3px solid #00a9dc;border-radius:24px}h1{font-size:25px;color:#00a5d7;margin:0 0 20px}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}.question{background:#ecfaff;border:1px solid #00b7ff;border-radius:10px;padding:12px;font-size:18px;min-width:0}.question p{margin:0 0 8px}.answer{width:108px;max-width:100%;height:35px;border:2px solid #ff5968;background:white;font:18px Georgia;padding:4px 6px;outline:none}.answer.good,.choice.good{border-color:#1eaa56!important;background:#dcffe7!important}.answer.bad,.choice.bad{border-color:#f44336!important;background:#ffe2e2!important;animation:blink .42s 3}@keyframes blink{50%{background:#ff7777}}.actions{display:flex;justify-content:center;gap:14px;margin-top:24px}button{background:#ff8200;color:white;border:0;border-radius:22px;padding:11px 20px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0750b8;font:700 21px Arial;margin-top:15px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.choice{border:1px solid #9adff6;background:white;border-radius:7px;padding:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;font-size:16px}.choice .square{height:23px;width:23px;border:2px solid #00b5f3;flex-shrink:0}.choice.selected .square{background:#b5f1ff}.choice.selected .square:after{content:'✓';display:block;text-align:center;color:#00549a;line-height:19px}.pair{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pair label{display:flex;gap:5px;align-items:center}.pair input{width:100px}.onecol{grid-template-columns:1fr}.onecol .question{padding:13px 15px}@media(max-width:650px){.exercise{margin:0;border-radius:0;padding:16px}.questions{grid-template-columns:1fr}.options{grid-template-columns:1fr 1fr}.choice{font-size:14px;padding:6px}.question{font-size:16px}}</style></head><body><main class="exercise"><h1>Divide the following. Also, mention the remainder, if any.</h1><div class="questions"><div class="question"><p>a. &nbsp;8542 ÷ 7</p><div class="pair"><label>Quotient: <input class="answer" inputmode="numeric" aria-label="Quotient 1"></label><label>Remainder: <input class="answer" inputmode="numeric" aria-label="Remainder 1"></label></div></div><div class="question"><p>b. &nbsp;8125 ÷ 15</p><div class="pair"><label>Quotient: <input class="answer" inputmode="numeric" aria-label="Quotient 2"></label><label>Remainder: <input class="answer" inputmode="numeric" aria-label="Remainder 2"></label></div></div><div class="question"><p>c. &nbsp;64387 ÷ 14</p><div class="pair"><label>Quotient: <input class="answer" inputmode="numeric" aria-label="Quotient 3"></label><label>Remainder: <input class="answer" inputmode="numeric" aria-label="Remainder 3"></label></div></div><div class="question"><p>d. &nbsp;77664 ÷ 56</p><div class="pair"><label>Quotient: <input class="answer" inputmode="numeric" aria-label="Quotient 4"></label><label>Remainder: <input class="answer" inputmode="numeric" aria-label="Remainder 4"></label></div></div></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 8</div></main><script>const KEY="math-4-ch5-assessment-division";const answers=["1220", "2", "541", "10", "4599", "1", "1386", "48"];function save(){localStorage.setItem(KEY,JSON.stringify([...document.querySelectorAll('.answer')].map(x=>x.value)))}function restore(){try{const vals=JSON.parse(localStorage.getItem(KEY)||'[]');document.querySelectorAll('.answer').forEach((e,i)=>e.value=vals[i]||'')}catch(e){}}document.querySelectorAll('.answer').forEach(x=>x.addEventListener('input',()=>{x.classList.remove('good','bad');save()}));function checkAnswers(){let n=0;document.querySelectorAll('.answer').forEach((e,i)=>{let good=e.value.trim().replace(/[, ]/g,'').toLowerCase()===String(answers[i]).replace(/[, ]/g,'').toLowerCase();e.classList.toggle('good',good);e.classList.toggle('bad',!good);if(good)n++});document.getElementById('score').textContent='Score: '+n+' / '+answers.length;save()}function resetExercise(){document.querySelectorAll('.answer').forEach(e=>{e.value='';e.classList.remove('good','bad')});document.getElementById('score').textContent='Score: 0 / '+answers.length;localStorage.removeItem(KEY)}restore();</script></body></html>
