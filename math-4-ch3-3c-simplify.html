<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 - Chapter 3 - 3(c) Simplify</title><style>
*{box-sizing:border-box}body{margin:0;background:#dcf9ff;font-family:Arial,sans-serif}.exercise{max-width:940px;margin:24px auto;background:#fff;border:3px solid #00a8da;border-radius:24px;padding:24px 28px}h1{font:700 25px Georgia,serif;color:#00a8dc;margin:0 0 24px}.questions{display:grid;grid-template-columns:1fr 1fr;gap:22px}.question{display:flex;align-items:center;gap:9px;font:20px Georgia,serif;white-space:nowrap}.answer{width:116px;min-width:0;height:39px;border:2px solid #ff5360;background:white;font:19px Arial,sans-serif;text-align:center;outline:0}.answer.ok{background:#ddf9e4;border-color:#19a74b}.answer.bad{background:#ffe0e0;border-color:#e33;animation:blink .4s 2}@keyframes blink{50%{background:#ff9d9d}}.actions{display:flex;justify-content:center;gap:13px;margin-top:35px}button{background:#ff8500;color:white;border:0;border-radius:24px;padding:11px 21px;font-weight:bold;cursor:pointer}#score{text-align:center;color:#0050b9;font-size:21px;font-weight:bold;margin-top:16px}@media(max-width:620px){.exercise{margin:10px;padding:18px}.questions{grid-template-columns:1fr}.question{font-size:18px}h1{font-size:22px}}
</style></head><body><main class="exercise"><h1>Simplify:</h1><div class="questions"><div class="question"><label for="a0">a. &nbsp;124598 − 124598</label><input id="a0" class="answer" inputmode="numeric" aria-label="Answer a"></div><div class="question"><label for="a1">b. &nbsp;542585 − 0</label><input id="a1" class="answer" inputmode="numeric" aria-label="Answer b"></div></div><div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 2</div></main><script>
const key='math-4-ch3-3c-simplify',answers=['0','542585'];const fields=answers.map((_,i)=>document.getElementById('a'+i));const score=document.getElementById('score');function save(){try{localStorage.setItem(key,JSON.stringify({values:fields.map(f=>f.value),score:score.textContent}))}catch(e){}}function checkAnswers(){let n=0;fields.forEach((f,i)=>{const ok=f.value.trim().replace(/,/g,'')===answers[i];f.classList.toggle('ok',ok);f.classList.toggle('bad',!ok);if(ok)n++});score.textContent=`Score: ${n} / 2`;save()}function resetExercise(){fields.forEach(f=>{f.value='';f.classList.remove('ok','bad')});score.textContent='Score: 0 / 2';save()}fields.forEach(f=>f.addEventListener('input',()=>{f.classList.remove('ok','bad');save()}));try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved){fields.forEach((f,i)=>f.value=saved.values?.[i]||'');score.textContent=saved.score||'Score: 0 / 2'}}catch(e){}
</script></body></html>
