<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>रिक्त स्थान पूर्ति कीजिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#cef9ff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#142434}.wrap{max-width:1000px;margin:22px auto;padding:25px;border:3px solid #00aeeb;border-radius:22px;background:white}h1{color:#00a8e6;font-size:27px;margin:0 0 20px}.q{background:#e9faff;border:1.5px solid #00b5f8;border-radius:12px;padding:13px 16px;margin:9px 0;font-size:19px}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px solid #8cdfff;border-radius:9px;padding:10px;cursor:pointer;min-height:48px}.opt input{accent-color:#00a8e6;width:19px;height:19px}.opt.good,.good{background:#d9fbe7!important;border-color:#21ad58!important}.opt.bad,.bad{background:#ffe0e0!important;border-color:#f44336!important}.actions{text-align:center;margin-top:25px}button{background:#ff8000;color:white;border:0;border-radius:22px;padding:11px 20px;margin:4px;cursor:pointer;font-weight:bold;font-size:15px}.marks{text-align:center;color:#0049be;font-weight:bold;font-size:19px;margin-top:10px}.bank{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;background:#dcf7ff;padding:16px;border-radius:12px;margin-bottom:14px}.chip{background:white;border:1.5px solid #00b7f9;border-radius:9px;padding:8px 15px;font-size:19px;cursor:grab}.chip.used{opacity:.35}.blank{display:inline-flex;min-width:125px;min-height:40px;vertical-align:middle;border:2px dashed #ff684b;border-radius:7px;align-items:center;justify-content:center;padding:4px 9px;cursor:pointer;color:#12426c}.blank:empty:before{content:' ';white-space:pre}.truth{display:flex;gap:8px;margin-left:auto}.truth button{border:2px solid #00b5f8;border-radius:7px;background:white;color:#006a94;padding:5px 12px;font-size:22px;margin:0}.truth button.selected{background:#c9efff}.qline{display:flex;align-items:center;gap:14px}.qline span{flex:1}@media(max-width:620px){.wrap{margin:8px;padding:14px}h1{font-size:22px}.q{font-size:16px}.opts{grid-template-columns:1fr}.truth button{padding:4px 8px}}</style></head><body><main class="wrap"><h1>रिक्त स्थान पूर्ति कीजिए–</h1><div class="bank" id="bank"></div><section class="q">(क) सर्वनाम शब्दों का प्रयोग होता <span class="blank" id="blank0" ondragover="event.preventDefault()" ondrop="dropWord(event,0)" onclick="put(0)"></span> शब्दों के स्थान पर।</section><section class="q">(ख)  <span class="blank" id="blank1" ondragover="event.preventDefault()" ondrop="dropWord(event,1)" onclick="put(1)"></span> के छह भेद हैं।</section><section class="q">(ग) ‘जो जैसा करेगा, वह वैसा भरेगा’ वाक्य उदाहरण है <span class="blank" id="blank2" ondragover="event.preventDefault()" ondrop="dropWord(event,2)" onclick="put(2)"></span> ।</section><section class="q">(घ) ‘कौन’ एवं ‘क्या’ शब्द <span class="blank" id="blank3" ondragover="event.preventDefault()" ondrop="dropWord(event,3)" onclick="put(3)"></span> सर्वनाम हैं।</section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswer()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="marks" class="marks">Marks: 0 / 4</div></main><script>const KEY="gyandhara-4-ch10-fill";const words=["संज्ञा", "सर्वनाम", "संबंधवाचक", "प्रश्नवाचक"];const answers=[0,1,2,3];let state={};let selected=null;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function restore(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object')state=v}catch(e){}}function score(correct){document.getElementById('marks').textContent='Marks: '+correct+' / 4'}function draw(){let bank=document.getElementById('bank');bank.innerHTML='';words.forEach((w,i)=>{let b=document.createElement('button');b.className='chip'+(Object.values(state).includes(i)?' used':'');b.textContent=w;b.draggable=true;b.type='button';b.onclick=()=>{selected=i;document.querySelectorAll('.chip').forEach(x=>x.style.outline='');b.style.outline='3px solid #ff8700'};b.ondragstart=e=>e.dataTransfer.setData('text/plain',String(i));bank.appendChild(b)});for(let i=0;i<4;i++){let el=document.getElementById('blank'+i);el.textContent=state[i]===undefined?'':words[state[i]]}}function assign(i,w){if(w===null||w===undefined)return;Object.keys(state).forEach(k=>{if(state[k]===w)delete state[k]});state[i]=w;save();draw()}function put(i){if(selected!==null){assign(i,selected);selected=null}else if(state[i]!==undefined){delete state[i];save();draw()}}function dropWord(e,i){e.preventDefault();let w=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(w)&&w>=0&&w<4)assign(i,w)}function check(){let n=0;for(let i=0;i<4;i++){let el=document.getElementById('blank'+i);el.classList.remove('good','bad');if(state[i]!==undefined){let ok=state[i]===answers[i];el.classList.add(ok?'good':'bad');if(ok)n++}}score(n)}function showAnswer(){answers.forEach((v,i)=>state[i]=v);save();draw();check()}function resetAll(){state={};selected=null;localStorage.removeItem(KEY);draw();document.querySelectorAll('.blank').forEach(x=>x.classList.remove('good','bad'));score(0)}restore();draw();</script></body></html>
