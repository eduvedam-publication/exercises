<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#e5f9fd;font-family:Georgia,serif}.ex{max-width:1120px;min-height:620px;margin:auto;background:#fff;border:4px solid #08a8d8;border-radius:28px;padding:28px 42px;display:flex;flex-direction:column}h1{font:700 25px Arial;color:#00a3dc;margin:0 0 26px}.content{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:27px 80px}.q{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:20px}.frac{display:inline-flex;flex-direction:column;text-align:center;min-width:30px;line-height:1.05}.top{border-bottom:1.5px solid #111;padding:0 4px 3px}.bot{padding:3px 4px 0}.ans{width:84px;height:42px;border:2px solid red;border-radius:6px;font:18px Arial;padding:4px 7px}.small{width:48px;text-align:center}.good{background:#dcf7df;border-color:#159447}.bad{background:#ffe2e2}.ctrl{margin-top:auto;padding-top:30px;text-align:center}.ctrl button{border:0;border-radius:24px;background:#ff7d00;color:#fff;font-weight:bold;padding:13px 22px;margin:0 6px}.score{text-align:center;color:#064bb4;font:bold 22px Arial;margin-top:14px}@media(max-width:760px){.ex{padding:20px}.grid{grid-template-columns:1fr}.q{font-size:18px}}</style></head><body><main class="ex"><h1>Find the boxes.</h1><div class="content"><div class="grid"><div class="q"><span>a.</span><span class="frac"><span class="top">2</span><span class="bot">13</span></span> <b>+</b> <span class="frac"><span class="top">1</span><span class="bot">13</span></span><b>=</b><span class="frac"><span class="top"><input id="a0" class="ans small"></span><span class="bot">13</span></span></div><div class="q"><span>b.</span><span class="frac"><span class="top">5</span><span class="bot">11</span></span> <b>+</b> <span class="frac"><span class="top">3</span><span class="bot">11</span></span><b>=</b><span class="frac"><span class="top"><input id="a1" class="ans small"></span><span class="bot">11</span></span></div><div class="q"><span>c.</span><span class="frac"><span class="top">2</span><span class="bot">15</span></span> <b>+</b> <span class="frac"><span class="top">4</span><span class="bot">15</span></span><b>=</b><span class="frac"><span class="top"><input id="a2" class="ans small"></span><span class="bot">6</span></span></div><div class="q"><span>d.</span><span class="frac"><span class="top">6</span><span class="bot">11</span></span> <b>+</b> <span class="frac"><span class="top">4</span><span class="bot">11</span></span><b>=</b><span class="frac"><span class="top"><input id="a3" class="ans small"></span><span class="bot">10</span></span></div><div class="q"><span>e.</span><span class="frac"><span class="top">3</span><span class="bot">19</span></span> <b>+</b> <span class="frac"><span class="top">9</span><span class="bot">19</span></span><b>=</b><span class="frac"><span class="top"><input id="a4" class="ans small"></span><span class="bot">19</span></span></div><div class="q"><span>f.</span><span class="frac"><span class="top">9</span><span class="bot">14</span></span> <b>+</b> <span class="frac"><span class="top">4</span><span class="bot">14</span></span><b>=</b><span class="frac"><span class="top"><input id="a5" class="ans small"></span><span class="bot">14</span></span></div><div class="q"><span>g.</span><span class="frac"><span class="top">11</span><span class="bot">17</span></span> <b>+</b> <span class="frac"><span class="top">4</span><span class="bot">17</span></span><b>=</b><span class="frac"><span class="top"><input id="a6" class="ans small"></span><span class="bot">15</span></span></div><div class="q"><span>h.</span><span class="frac"><span class="top">12</span><span class="bot">19</span></span> <b>+</b> <span class="frac"><span class="top">6</span><span class="bot">19</span></span><b>=</b><span class="frac"><span class="top"><input id="a7" class="ans small"></span><span class="bot">19</span></span></div><div class="q"><span>i.</span><span class="frac"><span class="top">3</span><span class="bot">17</span></span> <b>+</b> <span class="frac"><span class="top">5</span><span class="bot">17</span></span> <b>+</b> <span class="frac"><span class="top">6</span><span class="bot">17</span></span><b>=</b><span class="frac"><span class="top"><input id="a8" class="ans small"></span><span class="bot">14</span></span></div><div class="q"><span>j.</span><span class="frac"><span class="top">2</span><span class="bot">19</span></span> <b>+</b> <span class="frac"><span class="top">3</span><span class="bot">19</span></span> <b>+</b> <span class="frac"><span class="top">12</span><span class="bot">19</span></span><b>=</b><span class="frac"><span class="top"><input id="a9" class="ans small"></span><span class="bot">19</span></span></div><div class="q"><span>k.</span><span class="frac"><span class="top">4</span><span class="bot">22</span></span> <b>+</b> <span class="frac"><span class="top">3</span><span class="bot">22</span></span> <b>+</b> <span class="frac"><span class="top">9</span><span class="bot">22</span></span><b>=</b><span class="frac"><span class="top"><input id="a10" class="ans small"></span><span class="bot">22</span></span></div><div class="q"><span>l.</span><span class="frac"><span class="top">6</span><span class="bot">18</span></span> <b>+</b> <span class="frac"><span class="top">7</span><span class="bot">18</span></span> <b>+</b> <span class="frac"><span class="top">4</span><span class="bot">18</span></span><b>=</b><span class="frac"><span class="top"><input id="a11" class="ans small"></span><span class="bot">18</span></span></div></div></div><div class="ctrl"><button onclick="check()">Check Answers</button><button onclick="resetAll()">Reset</button></div><div id="score" class="score">Score: 0 / 12</div></main><script>const A=['3', '8', '15', '11', '12', '13', '17', '18', '17', '17', '16', '16'];const norm=v=>v.trim().toLowerCase().replace(/\s+/g,'');function check(){let s=0;A.forEach((a,i)=>{let e=document.getElementById('a'+i),ok=norm(e.value)==norm(a);e.classList.remove('good','bad');e.classList.add(ok?'good':'bad');if(ok)s++});score.textContent='Score: '+s+' / 12'}function resetAll(){document.querySelectorAll('input').forEach(e=>{e.value='';e.classList.remove('good','bad')});score.textContent='Score: 0 / 12'}</script></body></html>
