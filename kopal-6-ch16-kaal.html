<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>निम्नलिखित वाक्यों का उचित काल लिखिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#b9faff;font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;color:#172d39}.sheet{width:min(1000px,calc(100% - 28px));margin:24px auto;padding:24px;background:white;border:3px solid #00a8fa;border-radius:20px}h1{font-size:clamp(21px,2.5vw,29px);color:#00a5f2;margin:0 0 17px}.q{background:#e0f9ff;border:1.5px solid #00adff;border-radius:11px;padding:14px;margin:10px 0;font-size:18px;line-height:1.7}.choices{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px}.choice{border:1px solid #55cbff;border-radius:8px;background:white;padding:8px 12px;cursor:pointer;font:inherit;font-size:17px;color:#152d3a}.choice.selected{background:#b5ebff;border-color:#009be6}.choice.correct,.slot.correct{background:#d7f8e0;border:2px solid #1caa52}.choice.wrong,.slot.wrong{background:#ffe0e0;border:2px solid #ed4545}.bank{background:#d0f7ff;padding:10px;border-radius:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{background:white;border:1px solid #00aaff;border-radius:7px;padding:8px 12px;cursor:grab;font:inherit;font-size:17px;color:#152d3a}.chip.active{background:#a8eaff;border:2px solid #008fdd}.chip:disabled{opacity:.4;cursor:default}.slot{display:inline-flex;min-width:160px;min-height:43px;border:2px dashed #ff7979;border-radius:7px;align-items:center;justify-content:center;background:#fff;padding:4px 10px;cursor:pointer;vertical-align:middle;color:#153448;font-size:17px}.slot:empty:after{content:'________';color:#0088b9}.actions{text-align:center;margin-top:24px}.actions button{background:#ff7300;border:0;border-radius:30px;color:white;font-weight:bold;padding:12px 17px;margin:3px;cursor:pointer}.marks{text-align:center;color:#003aff;font-size:21px;font-weight:bold;margin-top:9px}.hint{font-size:14px;color:#456} @media(max-width:550px){.sheet{margin:8px auto;padding:14px}.q{font-size:16px}.choice,.chip{font-size:15px}.slot{min-width:120px}}</style></head><body><main class="sheet"><h1>निम्नलिखित वाक्यों का उचित काल लिखिए–</h1><div id="bank" class="bank" hidden></div><div id="questions"></div><div class="actions"><button id="submit">Submit</button><button id="show">Show Answer</button><button id="reset">Reset</button></div><div id="marks" class="marks"></div></main><script>const DATA=[["वे एक संत महिला थीं।", "भूतकाल"], ["यह मेरा सौभाग्य होगा।", "भविष्यतकाल"], ["सीनेटर कैनेडी ने दौरा किया।", "भूतकाल"]], KIND="kaal", STORE='exercise-'+location.pathname.split('/').pop();let answers=Array(DATA.length).fill(null),picked=null,submitted=false;const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(STORE,JSON.stringify(answers))}catch(e){}}function load(){try{const v=JSON.parse(localStorage.getItem(STORE));if(Array.isArray(v)&&v.length===DATA.length)answers=v}catch(e){}}function bankWords(){return ['भूतकाल','वर्तमान काल','भविष्यतकाल']}function render(){let root=$('#questions');root.innerHTML='';if(KIND!=='mcq'){let bank=$('#bank');bank.hidden=false;bank.innerHTML='';bankWords().forEach((w,j)=>{let b=document.createElement('button');b.className='chip'+(picked===w?' active':'');b.textContent=w;b.draggable=true;b.type='button';b.disabled=false;b.onclick=()=>{picked=w;render()};b.ondragstart=e=>{picked=w;e.dataTransfer.setData('text/plain',w)};bank.append(b)})}DATA.forEach((item,i)=>{let div=document.createElement('div');div.className='q';if(KIND==='mcq'){let [question,opts]=item;div.innerHTML=`<div>(${['क','ख','ग','घ','ङ'][i]}) ${escapeHtml(question)}</div><div class="choices">${opts.map((o,j)=>`<button type="button" class="choice ${answers[i]===j?'selected':''}" data-i="${i}" data-j="${j}">(${['i','ii','iii'][j]}) ${escapeHtml(o)}</button>`).join('')}</div>`}else{div.innerHTML=`<span>(${['क','ख','ग','घ','ङ'][i]}) ${escapeHtml(item[0])} — </span><button type="button" class="slot" data-i="${i}">${answers[i]?escapeHtml(answers[i]):''}</button>`}root.append(div)});all('.choice').forEach(b=>b.onclick=()=>{answers[+b.dataset.i]=+b.dataset.j;submitted=false;save();render()});all('.slot').forEach(b=>{b.onclick=()=>{let i=+b.dataset.i;if(picked){answers[i]=picked;picked=null}else answers[i]=null;submitted=false;save();render()};b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();let w=e.dataTransfer.getData('text/plain');if(bankWords().includes(w)){answers[+b.dataset.i]=w;picked=null;submitted=false;save();render()}}});if(submitted)color();else $('#marks').textContent='Marks: 0 / '+DATA.length}function color(){let n=0;DATA.forEach((item,i)=>{let good=answers[i]=== (KIND==='mcq'?item[2]:item[1]);if(good)n++;if(KIND==='mcq'){all(`.choice[data-i="${i}"]`).forEach(b=>{b.classList.remove('correct','wrong');if(+b.dataset.j===answers[i])b.classList.add(good?'correct':'wrong')})}else{let b=$(`.slot[data-i="${i}"]`);b.classList.remove('correct','wrong');if(answers[i]!=null)b.classList.add(good?'correct':'wrong')}});$('#marks').textContent=`Marks: ${n} / ${DATA.length}`}$('#submit').onclick=()=>{submitted=true;color();window.parent.postMessage({type:'OPTION',exerciseType:KIND==='mcq'?'OPTION':'DRAG_DROP',response:{answers,score:DATA.reduce((n,x,i)=>n+(answers[i]===(KIND==='mcq'?x[2]:x[1])?1:0),0),total:DATA.length}},'*')};$('#show').onclick=()=>{answers=DATA.map(x=>KIND==='mcq'?x[2]:x[1]);submitted=true;save();render()};$('#reset').onclick=()=>{answers=Array(DATA.length).fill(null);picked=null;submitted=false;save();render()};load();render();</script></body></html>
