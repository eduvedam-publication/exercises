<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kopal 6 Chapter 4 — सही विकल्प पर सही (✓) का निशान लगाएँ-</title><style>*{box-sizing:border-box}body{margin:0;background:#c9faff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#182b35}.wrap{max-width:1000px;margin:24px auto;background:white;border:3px solid #00a8ee;border-radius:20px;padding:24px}h2{color:#00a8ee;margin:0 0 18px;font-size:26px}.q{background:#e6f9ff;border:1.5px solid #00a8ee;border-radius:11px;padding:14px;margin:10px 0;font-size:18px}.options{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.opt{background:white;border:1px solid #71c9ed;border-radius:8px;padding:8px 13px;cursor:pointer;min-width:120px}.opt.sel{background:#c6ecff;border-color:#008fe0}.opt.correct,.q.correct{border-color:#18a65d;background:#e8fff1}.opt.wrong,.q.wrong{border-color:#e64646;background:#fff0f0}textarea{width:100%;min-height:65px;resize:vertical;border:1px solid #00a8ee;border-radius:8px;padding:10px;font:inherit;margin-top:8px}.buttons{text-align:center;margin-top:24px}button{border:0;border-radius:24px;background:#ff7900;color:white;padding:11px 20px;margin:4px;cursor:pointer;font-weight:bold}#marks{text-align:center;color:#0056c8;font-weight:bold;font-size:21px;margin-top:12px}.answer{color:#087e47;font-size:15px;margin-top:8px;display:none}@media(max-width:600px){.wrap{margin:8px;padding:14px}h2{font-size:21px}.q{font-size:16px}.opt{min-width:95px}}</style><style>.q.correct,.q.good{border:2px solid #19a65a!important;background:#eafff0!important}.q.wrong,.q.bad{border:2px solid #e53935!important;background:#fff0f0!important}.q .opt.correct,.q .slot.good{border-color:#19a65a!important;background:#e7ffed!important}.q .opt.wrong,.q .slot.bad{border-color:#e53935!important;background:#ffe2e2!important}.q textarea{width:100%;min-height:48px;resize:vertical;border:1.5px solid #ff7861;border-radius:7px;font:inherit;padding:9px;margin-top:7px}.q .slot{vertical-align:middle;margin:2px 3px}.q{line-height:1.9}.opt{transition:background .15s}</style></head><body><main class="wrap"><h2>सही विकल्प पर सही (✓) का निशान लगाएँ-</h2><div id="questions"></div><div class="buttons"><button onclick="submit()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div><div id="marks">Marks: 0 / 5</div></main><script>const data=[["बिल्ली का नाम है–", ["कबरी", "अबरी", "शबरी"], 0], ["माँ जी ने मेहरी को भेजकर ______ बुलवाया।", ["वैद्य जी", "पंडित जी", "बहूरानी"], 1], ["पंडितजी ______ कद के आदमी थे।", ["छोटे", "बड़े", "मँझले"], 2], ["यदि दरवाज़ा : द्वार, तो फ़र्श : ______ ।", ["ज़मीन", "धरती", "छत"], 0], ["‘राम की माँ ने आँखे फाड़कर पंडित परमसुख को देखा। इसमें ‘आँखे फाड़कर’ का अर्थ है ।", ["आश्चर्य से", "खुशी से", "दुख से"], 0]], key='kopal6ch4_'+"mcq";let state=JSON.parse(localStorage.getItem(key)||'{}');const root=document.getElementById('questions');function save(){localStorage.setItem(key,JSON.stringify(state))}function render(){root.innerHTML='';data.forEach((item,i)=>{let box=document.createElement('div');box.className='q';box.id='q'+i;let p=document.createElement('div');p.textContent='('+('क ख ग घ ङ च'.split(' ')[i]||i+1)+') '+item[0];box.appendChild(p);if("mcq"==='mcq'){let opts=document.createElement('div');opts.className='options';item[1].forEach((v,j)=>{let b=document.createElement('button');b.className='opt'+(state[i]===j?' sel':'');b.textContent=['(i) ','(ii) ','(iii) '][j]+v;b.onclick=()=>{state[i]=j;save();render()};opts.appendChild(b)});box.appendChild(opts)}else{let inp=document.createElement('textarea');inp.placeholder='यहाँ उत्तर लिखिए';inp.value=state[i]||'';inp.oninput=()=>{state[i]=inp.value;save()};box.appendChild(inp)}let ans=document.createElement('div');ans.className='answer';ans.textContent='उत्तर: '+("mcq"==='mcq'?item[1][item[2]]:item[1]);box.appendChild(ans);root.appendChild(box)})}function submit(){let score=0;data.forEach((item,i)=>{let correct="mcq"==='mcq'?state[i]===item[2]:(state[i]||'').trim().replace(/[।\s,،]/g,'').includes(item[1].trim().replace(/[।\s,،]/g,''));if(correct)score++;document.getElementById('q'+i).classList.add(correct?'correct':'wrong')});document.getElementById('marks').textContent='Marks: '+score+' / '+data.length}function showAnswers(){document.querySelectorAll('.answer').forEach(a=>a.style.display='block')}function resetAll(){state={};save();render();document.getElementById('marks').textContent='Marks: 0 / '+data.length}render();
const previousSubmit=submit;
submit=function(){document.querySelectorAll('.q').forEach(el=>el.classList.remove('correct','wrong'));previousSubmit();document.querySelectorAll('.q').forEach((box,i)=>{if(box.classList.contains('wrong')){box.querySelectorAll('.opt.sel,textarea').forEach(el=>el.classList.add('bad'))}else if(box.classList.contains('correct')){box.querySelectorAll('.opt.sel,textarea').forEach(el=>el.classList.add('good'))}})};
</script></body></html>
