<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>दिए गए वाक्यों को शुद्ध करके लिखिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#bafaff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#183040}.wrap{max-width:1020px;margin:20px auto;padding:24px;background:white;border:3px solid #00aeff;border-radius:20px}h1{color:#00a5ed;font-size:28px;margin:0 0 18px}.q{background:#e0f9ff;border:1.5px solid #00aeff;border-radius:12px;padding:13px;margin:9px 0;font-size:19px;line-height:1.9}.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.opt,.chip{border:1px solid #00aeff;border-radius:9px;padding:6px 13px;background:white;color:#183040;cursor:pointer;font-size:17px}.opt.sel,.chip.sel{background:#8be5ff}.opt.good,.slot.good,input.good{border:2px solid #16a34a;background:#dcfce7}.opt.bad,.slot.bad,input.bad{border:2px solid #ef4444;background:#fee2e2}.bank{background:#d1f7ff;padding:12px;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap}.slot{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:135px;min-height:39px;border:2px dashed #ff7364;border-radius:8px;background:#fff;cursor:pointer;padding:2px 8px}.slot:focus{outline:2px solid #00aaff}.chip.used{opacity:.35}.actions{text-align:center;margin:24px 0 8px}.actions button{border:0;background:#ff7400;color:white;padding:11px 18px;border-radius:24px;margin:3px;cursor:pointer;font-weight:bold}#score{text-align:center;color:blue;font-size:21px;font-weight:bold}input{border:1.5px solid #00aeff;border-radius:7px;padding:8px;font-size:17px;max-width:160px;width:28%}@media(max-width:600px){.wrap{margin:5px;padding:12px}h1{font-size:22px}.q{font-size:17px}.slot{min-width:105px}}</style></head><body><main class="wrap"><h1>दिए गए वाक्यों को शुद्ध करके लिखिए–</h1><section id="questions"></section><div class="actions"><button id="submit">Submit</button><button id="answer">Show Answer</button><button id="reset">Reset</button></div><div id="score"></div></main><script>const DATA=[["कविता का साड़ी ठीक था।", "कविता की साड़ी ठीक थी।"], ["महेश सीटी बजाती है।", "महेश सीटी बजाता है।"], ["नितिन विद्यालय जाएगी।", "नितिन विद्यालय जाएगा।"], ["कड़ा धूप निकला हैं।", "कड़ी धूप निकली है।"]],TYPE="drag",KEY='exercise:'+location.pathname;let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};let revealed=false;const root=document.getElementById('questions');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function choose(i,v){state[i]=v;save();render()}function drop(i,v){state[i]=v;save();render()}function render(){root.innerHTML='';if(TYPE==='drag'){let bank=document.createElement('div');bank.className='bank';let words=[...new Set(DATA.map(x=>x[1]))];words.forEach(w=>{let b=document.createElement('button');b.className='chip'+(Object.values(state).includes(w)?' used':'');b.textContent=w;b.draggable=true;b.onclick=()=>{window.selected=w;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};b.ondragstart=e=>{window.selected=w;e.dataTransfer.setData('text/plain',w)};bank.appendChild(b)});root.appendChild(bank)}DATA.forEach((item,i)=>{let card=document.createElement('div');card.className='q';let letter='(क ख ग घ ङ च छ ज झ ञ)'.replace(/[()]/g,'').split(' ')[i]||String(i+1);if(TYPE==='mcq'){card.innerHTML='<div>('+letter+') '+esc(item[0])+'</div>';let opts=document.createElement('div');opts.className='opts';item[1].forEach((v,j)=>{let b=document.createElement('button');b.className='opt'+(state[i]===v?' sel':'');b.textContent='('+(j+1)+') '+v;b.onclick=()=>choose(i,v);if(revealed)b.classList.add(v===item[2]?'good':state[i]===v?'bad':'');opts.appendChild(b)});card.appendChild(opts)}else if(TYPE==='tf'){card.innerHTML='<div>('+letter+') '+esc(item[0])+'</div>';let opts=document.createElement('div');opts.className='opts';['सही','गलत'].forEach(v=>{let b=document.createElement('button');b.className='opt'+(state[i]===v?' sel':'');b.textContent=v==='सही'?'✓ सही':'✗ गलत';b.onclick=()=>choose(i,v);if(revealed)b.classList.add(v===item[1]?'good':state[i]===v?'bad':'');opts.appendChild(b)});card.appendChild(opts)}else if(TYPE==='drag'){let parts=item[0].split('___');let line=document.createElement('div');line.append(document.createTextNode('('+letter+') '+parts[0]));let slot=document.createElement('button');slot.className='slot';slot.textContent=state[i]||'________';slot.onclick=()=>{if(window.selected)drop(i,window.selected);else if(state[i])drop(i,'')};slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();drop(i,e.dataTransfer.getData('text/plain'))};if(revealed)slot.classList.add(state[i]===item[1]?'good':'bad');line.append(slot,document.createTextNode(parts.slice(1).join('___')));card.appendChild(line)}else{card.innerHTML='('+letter+') '+esc(item[0])+' — ';item[1].forEach((ans,j)=>{let inp=document.createElement('input');inp.placeholder='उत्तर '+(j+1);inp.value=(state[i]||[])[j]||'';inp.oninput=()=>{let a=state[i]||[];a[j]=inp.value;state[i]=a;save()};if(revealed)inp.classList.add(inp.value.trim()===ans?'good':'bad');card.appendChild(inp)})}root.appendChild(card)});if(revealed){let score=DATA.filter((it,i)=>TYPE==='mcq'?state[i]===it[2]:TYPE==='triple'?it[1].every((a,j)=>(state[i]||[])[j]?.trim()===a):state[i]===it[1]).length;document.getElementById('score').textContent='Marks: '+score+' / '+DATA.length}}document.getElementById('submit').onclick=()=>{revealed=true;render()};document.getElementById('answer').onclick=()=>{DATA.forEach((it,i)=>state[i]=TYPE==='mcq'?it[2]:it[1]);save();revealed=true;render()};document.getElementById('reset').onclick=()=>{state={};save();revealed=false;document.getElementById('score').textContent='Marks: 0 / '+DATA.length;render()};document.getElementById('score').textContent='Marks: 0 / '+DATA.length;render();</script></body></html>
