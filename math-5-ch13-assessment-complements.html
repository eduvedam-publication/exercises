<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find the complement of each angle.</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;background:#b9fbff;color:#172735;font-family:Georgia,'Times New Roman',serif}.sheet{width:min(1050px,100%);padding:18px 22px;background:white;border:3px solid #00a9f4;border-radius:20px}h1{font:700 clamp(22px,3vw,31px) Arial,sans-serif;color:#009ff0;margin:0 0 12px}.bar{height:14px;border-radius:30px;background:#bff5fb;margin-bottom:10px}.row{background:#d9f8ff;border:1.5px solid #00a9ff;border-radius:11px;padding:9px 12px;margin:7px 0;font-size:clamp(16px,1.6vw,19px);width:100%}.prompt{margin:0 0 7px}.row label{display:block;margin-bottom:5px}.row input,.row select{border:1.5px solid #009ff0;border-radius:7px;background:white;padding:7px 10px;font:inherit;min-width:120px;max-width:100%;height:40px}.row input.correct,.choice.correct,.row select.correct{background:#e4ffed;border-color:#20a953}.row input.wrong,.choice.wrong,.row select.wrong{background:#fff0f0;border-color:#e62c38}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{background:#fff;border:1.5px solid #00a9ff;border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer;min-height:40px}.choice.selected{background:#9deaf7;border-color:#008ed0}.choice svg{height:43px;width:48px;vertical-align:middle}.feedback{font:700 13px Arial,sans-serif;margin-left:8px}.feedback.ok{color:#16833b}.feedback.no{color:#d72634}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px}.actions button{background:#ff7000;color:#fff;border:0;border-radius:24px;padding:10px 18px;font-weight:700;cursor:pointer}#score{text-align:center;color:#003bea;font:700 20px Arial,sans-serif;margin:9px 0 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #005ac0;outline-offset:2px}@media(max-width:620px){.sheet{padding:13px 10px}.row{padding:8px}.choice{padding:6px}}</style></head><body><main class="sheet"><h1>Find the complement of each angle.</h1><div class="bar" aria-hidden="true"></div><div class="row"><label for="a0">a. Complement of 62° = ____°</label><input id="a0" data-answer="" autocomplete="off" aria-label="Answer a"><span class="feedback" id="f0" aria-live="polite"></span></div><div class="row"><label for="a1">b. Complement of 45° = ____°</label><input id="a1" data-answer="" autocomplete="off" aria-label="Answer b"><span class="feedback" id="f1" aria-live="polite"></span></div><div class="row"><label for="a2">c. Complement of 16° = ____°</label><input id="a2" data-answer="" autocomplete="off" aria-label="Answer c"><span class="feedback" id="f2" aria-live="polite"></span></div><div class="actions"><button id="submit" type="button">Submit</button><button id="show" type="button">Show Answer</button><button id="reset" type="button">Reset</button></div><p id="score" aria-live="polite">Marks: 0 / 0</p></main><script>const answer=["28", "45", "74"],key='exercise:math-5-ch13-assessment-complements.html',mode='text',nodes=[...document.querySelectorAll('[data-answer]')],score=document.getElementById('score');score.textContent='Marks: 0 / '+answer.length;function norm(x){return String(x).trim().toLowerCase().replace(/[°º]/g,'').replace(/\s+/g,' ').replace(/\.$/,'')}function correct(v,a){return Array.isArray(a)?a.some(x=>norm(x)===norm(v)):norm(v)===norm(a)}function save(){try{localStorage.setItem(key,JSON.stringify(nodes.map(n=>n.value)))}catch(e){}}function clear(){nodes.forEach((n,i)=>{n.classList.remove('correct','wrong');const f=document.getElementById('f'+i);f.textContent='';f.className='feedback'});score.textContent='Marks: 0 / '+answer.length}try{const old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old))old.forEach((v,i)=>{if(nodes[i]&&typeof v==='string')nodes[i].value=v})}catch(e){}nodes.forEach(n=>n.addEventListener('input',()=>{save();clear()}));document.getElementById('submit').onclick=()=>{let marks=0;nodes.forEach((n,i)=>{const good=correct(n.value,answer[i]);marks+=good;n.classList.toggle('correct',good);n.classList.toggle('wrong',!good);const f=document.getElementById('f'+i);f.textContent=good?'✓ Correct':'✗ Wrong';f.className='feedback '+(good?'ok':'no')});score.textContent=`Marks: ${marks} / ${answer.length}`;save();const detail={exerciseType:'FILL_BLANK',exerciseId:'math-5-ch13-assessment-complements.html',response:Object.fromEntries(nodes.map((n,i)=>['question'+(i+1),n.value])),marks,total:answer.length};window.dispatchEvent(new CustomEvent('exercise-submit',{detail}));if(window.parent!==window)window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',...detail},'*')};document.getElementById('show').onclick=()=>{nodes.forEach((n,i)=>n.value=Array.isArray(answer[i])?answer[i][0]:answer[i]);save();clear()};document.getElementById('reset').onclick=()=>{nodes.forEach(n=>n.value='');save();clear()};</script></body></html>
