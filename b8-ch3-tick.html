<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#dff8ff;color:#24323a}body{padding:16px}.exercise{width:min(1100px,100%);margin:auto;background:#fff;border:5px solid #08a6d1;border-radius:22px;padding:22px 26px;min-height:calc(100vh - 32px);display:flex;flex-direction:column}.title{margin:0 0 18px;color:#ff0072;font-size:clamp(22px,3vw,30px)}.content{flex:1}.question{margin:12px 0;padding:13px 16px;border:2px solid #69dfff;border-radius:16px;background:#f3fbfe;font-size:clamp(16px,2vw,19px);line-height:1.5}.options{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:9px}.option,.btn{border:2px solid #ff0072;background:#fff;border-radius:10px;padding:8px 13px;font-size:16px;cursor:pointer}.option.selected{background:#ffe7f1}.option.correct,.answer.correct,.order.correct{background:#dff7e4}.option.wrong,.answer.wrong,.order.wrong{background:#ffe2e2}.answer{border:2px solid #ff4c39;border-radius:5px;padding:6px 8px;font-size:17px;min-width:125px;max-width:205px;margin:2px 4px}.orderrow{display:flex;justify-content:space-between;align-items:center;gap:15px}.order{width:58px;border:2px solid #ff0072;border-radius:7px;padding:7px;text-align:center;font-size:17px}.bottom{text-align:center;margin-top:22px}.score{margin-top:9px;color:#087fc2;font-weight:800;font-size:18px}@media(max-width:650px){body{padding:7px}.exercise{padding:15px 11px}.options{flex-direction:column}.option{width:100%;text-align:left}.answer{min-width:100px;max-width:145px}}.tf{display:flex;justify-content:space-between;align-items:center;gap:12px}.choices{display:flex;gap:8px}</style><main class=exercise><h1 class=title>Write 'True' or 'False'.</h1><div class=content id=c></div><div class=bottom><button class=btn onclick=check()>Submit</button><button class=btn onclick=reset()>Reset</button><div class=score id=sc></div></div></main><script>function L(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function S(k,s){localStorage.setItem(k,JSON.stringify(s))}function send(t,r){let p={exerciseType:t,response:r};try{parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',payload:p},'*')}catch(e){}}const K='b8-ch3-tick',D=[["The little boy was standing outside a shoe shop.", true], ["Everyone in the market stopped to help the boy.", false], ["The teacher ignored the boy and entered the shop.", false], ["She washed and dried the boy's feet herself.", true], ["The narrator felt proud of his teacher.", true], ["The lesson teaches us to respect and appreciate our teachers.", true]];let s=L(K);s.a=s.a||{};s.score=s.score||0;function draw(){c.innerHTML=D.map((q,i)=>`<div class="question tf"><span><b>${i+1}.</b> ${q[0]}</span><span class=choices><button class="option ${s.a[i]===true?'selected':''}" onclick="pick(${i},true)">True</button><button class="option ${s.a[i]===false?'selected':''}" onclick="pick(${i},false)">False</button></span></div>`).join('');sc.textContent=`Score: ${s.score} / 6`}function pick(i,v){s.a[i]=v;S(K,s);draw()}function check(){let n=0;document.querySelectorAll('.question').forEach((r,i)=>{let b=r.querySelectorAll('.option');b.forEach(x=>x.classList.remove('correct','wrong'));if(s.a[i]===D[i][1]){n++;b[s.a[i]?0:1].classList.add('correct')}else if(s.a[i]!==undefined)b[s.a[i]?0:1].classList.add('wrong')});s.score=n;S(K,s);sc.textContent=`Score: ${n} / 6`;let r={};D.forEach((_,i)=>r['question'+(i+1)]=s.a[i]===undefined?[]:[s.a[i]?'True':'False']);send('TICK',r)}function reset(){s={a:{},score:0};S(K,s);draw()}draw()</script>
