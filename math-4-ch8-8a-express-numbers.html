<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 - Chapter 8 - Exercise 8(a)</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;font-family:Arial,sans-serif;color:#292929}.exercise{max-width:940px;margin:24px auto;padding:26px 32px;background:white;border:3px solid #00ade0;border-radius:25px}h1{font:700 25px Georgia,serif;color:#00a9dc;margin:0 0 22px}.questions{display:grid;gap:15px}.question{display:flex;align-items:center;flex-wrap:wrap;gap:9px;font:19px Georgia,serif}.num{width:28px}.answer{width:145px;max-width:100%;border:2px solid #ff5161;background:white;border-radius:3px;padding:7px 8px;font:19px Arial,sans-serif;outline:none}.answer:focus{border-color:#00a9dc}.answer.correct{border-color:#12a451;background:#dff9e8}.answer.incorrect{border-color:#ef303c;background:#ffe3e6;animation:blink .32s linear 3}@keyframes blink{50%{background:#ff9da7}}.actions{display:flex;justify-content:center;gap:12px;margin-top:30px}button{background:#ff8200;color:#fff;border:0;border-radius:25px;padding:12px 22px;font-weight:bold;cursor:pointer}.score{text-align:center;color:#0055b8;font-size:21px;font-weight:bold;margin-top:15px}@media(max-width:600px){.exercise{margin:8px;padding:19px 15px}.question{font-size:17px}.answer{width:118px;font-size:17px}h1{font-size:23px}}</style></head><body><main class="exercise"><h1>Express in numbers.</h1><div class="questions"><label class="question"><span class="num">a.</span><span>Three point three eight</span><input class="answer" data-answer="3.38" inputmode="decimal" autocomplete="off" aria-label="Answer a"></label><label class="question"><span class="num">b.</span><span>Zero point nine eight</span><input class="answer" data-answer="0.98" inputmode="decimal" autocomplete="off" aria-label="Answer b"></label><label class="question"><span class="num">c.</span><span>Twenty three point one eight six</span><input class="answer" data-answer="23.186" inputmode="decimal" autocomplete="off" aria-label="Answer c"></label><label class="question"><span class="num">d.</span><span>One hundred three point zero seven one</span><input class="answer" data-answer="103.071" inputmode="decimal" autocomplete="off" aria-label="Answer d"></label><label class="question"><span class="num">e.</span><span>Three hundred nine point four zero nine</span><input class="answer" data-answer="309.409" inputmode="decimal" autocomplete="off" aria-label="Answer e"></label></div><div class="actions"><button type="button" onclick="checkAnswers()">Check Answers</button><button type="button" onclick="resetExercise()">Reset</button></div><div class="score" id="score">Score: 0 / 5</div></main><script>const KEY='math-4-ch8-8a-express-numbers-v1';const inputs=[...document.querySelectorAll('.answer')];function save(){try{localStorage.setItem(KEY,JSON.stringify(inputs.map(x=>x.value)))}catch(e){}}function restore(){try{const values=JSON.parse(localStorage.getItem(KEY)||'[]');inputs.forEach((x,i)=>{x.value=values[i]||''})}catch(e){}}inputs.forEach(x=>x.addEventListener('input',()=>{x.classList.remove('correct','incorrect');save()}));function checkAnswers(){let score=0;inputs.forEach(x=>{const ok=x.value.trim()===x.dataset.answer;x.classList.remove('correct','incorrect');void x.offsetWidth;x.classList.add(ok?'correct':'incorrect');if(ok)score++});document.getElementById('score').textContent=`Score: ${score} / ${inputs.length}`;save()}function resetExercise(){inputs.forEach(x=>{x.value='';x.classList.remove('correct','incorrect')});document.getElementById('score').textContent='Score: 0 / 5';try{localStorage.removeItem(KEY)}catch(e){}}restore();</script></body></html>
