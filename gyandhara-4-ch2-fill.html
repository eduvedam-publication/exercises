<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gyandhara-4-ch2-fill.html</title><style>*{box-sizing:border-box}body{margin:0;background:#d1faff;font-family:Georgia,"Noto Serif Devanagari",serif;color:#17333b}.wrap{max-width:1000px;margin:18px auto;background:white;border:3px solid #00aee8;border-radius:20px;padding:24px}h2{margin:0 0 16px;color:#00a7dd;font-size:25px}.q{background:#eafaff;border:1px solid #00b9f3;border-radius:12px;padding:12px 15px;margin:10px 0;font-size:19px;line-height:1.8}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:7px}.opt{border:1px solid #a4ddf3;background:white;border-radius:8px;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font:inherit;font-size:18px;text-align:left}.opt.selected{background:#d2efff;border-color:#0089d4}.opt.correct,.slot.correct{background:#dcfce5!important;border-color:#22a552!important}.opt.wrong,.slot.wrong{background:#ffe0e0!important;border-color:#f33!important;animation:blink .6s 2}@keyframes blink{50%{opacity:.55}}.slot{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:38px;border:2px dashed #ff674b;border-radius:7px;background:#fff;vertical-align:middle;cursor:pointer;padding:2px 10px}.slot.filled{border-style:solid}.bank{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#ddf7ff;padding:12px;border-radius:12px;margin-bottom:14px}.word{border:1px solid #00aee8;border-radius:8px;background:#fff;padding:8px 14px;font:inherit;font-size:18px;cursor:grab}.word.used{opacity:.35}.word.selected{outline:2px solid #008dc7;background:#bdeeff}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button{border:0;border-radius:24px;background:#ff8200;color:white;font-weight:bold;padding:11px 19px;cursor:pointer;font-size:15px}.hint{text-align:center;font-size:14px;color:#47717e}.binary{display:flex;gap:12px;margin-top:8px}.binary button{border:1px solid #00b9f3;border-radius:8px;background:white;padding:6px 18px;font-size:20px;cursor:pointer}.binary button.selected{background:#c9edff}.binary button.correct{background:#dcfce5;border-color:#22a552}.binary button.wrong{background:#ffe0e0;border-color:#f33;animation:blink .6s 2}@media(max-width:650px){.wrap{margin:7px;padding:14px}h2{font-size:21px}.q{font-size:17px}.options{grid-template-columns:1fr}.opt{font-size:17px}.slot{min-width:90px}}</style></head><body><main class="wrap"><h2>रिक्त स्थान पूर्ति कीजिए–</h2><div class="bank" id="bank"></div><p class="hint">ऊपर दिए गए शब्दों को खींचकर या क्लिक करके रिक्त स्थान में रखें।</p><section id="questions"></section><div class="actions"><button onclick="check()">Submit</button><button onclick="showAnswers()">Show Answer</button><button onclick="resetAll()">Reset</button></div></main><script>const key="gyandhara-4-ch2-fill";let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(answers))}const data=[["भाषा की सबसे छोटी इकाई", "है।", "वर्ण"], ["स्वरों की संख्या", "होती है।", "11"], ["व्यंजनों की संख्या", "होती है।", "33"], ["अनुस्वार को उच्चारित करते समय", "का प्रयोग किया जाता है।", "नासिका"]];const words=["वर्ण", "11", "33", "नासिका"];let selected=null;function render(){document.getElementById('bank').innerHTML=words.map((w,i)=>`<button class="word ${selected===i?'selected':''} ${Object.values(answers).includes(w)?'used':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain',${i})" onclick="selectWord(${i})">${w}</button>`).join('');document.getElementById('questions').innerHTML=data.map((q,i)=>`<div class="q">(${['क','ख','ग','घ'][i]}) ${q[0]} <span class="slot ${answers[i]?'filled':''}" id="slot${i}" tabindex="0" onclick="place(${i})" ondragover="event.preventDefault()" ondrop="event.preventDefault();put(${i},Number(event.dataTransfer.getData('text/plain')))">${answers[i]||'________'}</span> ${q[1]}</div>`).join('')}function selectWord(i){if(Object.values(answers).includes(words[i]))return;selected=selected===i?null:i;render()}function put(i,j){if(!Number.isInteger(j)||j<0||j>=words.length)return;Object.keys(answers).forEach(k=>{if(answers[k]===words[j])delete answers[k]});answers[i]=words[j];selected=null;save();render()}function place(i){if(selected!==null)put(i,selected);else if(answers[i]){delete answers[i];save();render()}}function check(){data.forEach((q,i)=>{let el=document.getElementById('slot'+i);if(answers[i])el.classList.add(answers[i]===q[2]?'correct':'wrong')})}function showAnswers(){data.forEach((q,i)=>answers[i]=q[2]);save();render();check()}function resetAll(){answers={};selected=null;save();render()}render();</script></body></html>
