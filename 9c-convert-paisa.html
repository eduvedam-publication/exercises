<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convert to paise</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#222}
.exercise{max-width:1000px;margin:28px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:30px}
h1{margin:0 0 28px;color:#00a5dc;font-size:25px}
.questions{display:flex;flex-direction:column;gap:18px;padding:0 15px}
.q{display:grid;grid-template-columns:28px 130px 20px 105px 24px 22px 58px 24px 22px 105px 24px;align-items:center;gap:8px;font-family:Georgia,"Times New Roman",serif;font-size:20px;white-space:nowrap}
.answer{height:38px;border:2px solid #ff3b30;background:#fff;font-size:17px;padding:4px 7px;outline:none;width:100%}
.answer.ok{background:#dcf8df;border-color:#009b8e}
.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:32px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:18px}
@media(max-width:800px){
 .exercise{margin:0;border-radius:0;padding:16px;overflow-x:auto}
 .q{min-width:760px}
}
</style>
</head>
<body>
<main class="exercise">
<h1>Convert to paise.</h1>

<div class="questions">
 <div class="q">
  <span>a.</span><span>₹ 4 and 45 p</span><span>=</span>
  <input id="a0" class="answer"><span>p</span><span>+</span>
  <input id="a1" class="answer"><span>p</span><span>=</span>
  <input id="a2" class="answer"><span>p</span>
 </div>

 <div class="q">
  <span>b.</span><span>₹ 1 and 70 p</span><span>=</span>
  <input id="a3" class="answer"><span>p</span><span>+</span>
  <input id="a4" class="answer"><span>p</span><span>=</span>
  <input id="a5" class="answer"><span>p</span>
 </div>

 <div class="q">
  <span>c.</span><span>₹ 9 and 50 p</span><span>=</span>
  <input id="a6" class="answer"><span>p</span><span>+</span>
  <input id="a7" class="answer"><span>p</span><span>=</span>
  <input id="a8" class="answer"><span>p</span>
 </div>

 <div class="q">
  <span>d.</span><span>₹ 6 and 80 p</span><span>=</span>
  <input id="a9" class="answer"><span>p</span><span>+</span>
  <input id="a10" class="answer"><span>p</span><span>=</span>
  <input id="a11" class="answer"><span>p</span>
 </div>

 <div class="q">
  <span>e.</span><span>₹ 8 and 60 p</span><span>=</span>
  <input id="a12" class="answer"><span>p</span><span>+</span>
  <input id="a13" class="answer"><span>p</span><span>=</span>
  <input id="a14" class="answer"><span>p</span>
 </div>
</div>

<div class="actions">
 <button onclick="checkAnswers()">Check Answers</button>
 <button onclick="resetExercise()">Reset</button>
</div>
<div id="result">Score: 0 / 5</div>
</main>

<script>
const groups=[
 ["400","45","445"],
 ["100","70","170"],
 ["900","50","950"],
 ["600","80","680"],
 ["800","60","860"]
];

function clean(v){
 return v.toLowerCase().trim().replace(/\s+/g,"").replace(/paise|p/g,"");
}

function checkAnswers(){
 let score=0;
 groups.forEach((answers,row)=>{
   let rowOK=true;
   answers.forEach((ans,col)=>{
     const id=row*3+col;
     const e=document.getElementById("a"+id);
     const ok=clean(e.value)===ans;
     e.className="answer "+(ok?"ok":"bad");
     if(!ok) rowOK=false;
   });
   if(rowOK) score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 5`;
}

function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{
   e.value="";
   e.className="answer";
 });
 document.getElementById("result").textContent="Score: 0 / 5";
}
</script>
</body>
</html>
