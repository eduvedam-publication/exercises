<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math 4 Chapter 5 Exercise 5(c)</title><style>*{box-sizing:border-box}body{margin:0;background:#dffaff;color:#222;font-family:Georgia,'Times New Roman',serif}.exercise{max-width:980px;margin:24px auto;background:#fff;border:3px solid #00afe1;border-radius:25px;padding:25px}h1{font-size:25px;color:#00a8df;margin:0 0 22px}.questions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.question{display:flex;align-items:center;gap:8px;padding:12px;border:1.5px solid #00b5e9;border-radius:11px;background:#edfbff;min-width:0}.question label{font-size:18px;white-space:nowrap}.question input{width:100%;min-width:70px;height:36px;border:2px solid #ff5261;padding:4px 7px;font:18px Georgia,serif;background:#fff;outline:none}.question input.good{background:#e3ffe9;border-color:#15985d}.question input.bad{background:#ffe1e1;border-color:#df2636;animation:blink .45s 3}@keyframes blink{50%{background:#ff8686}}.actions{display:flex;justify-content:center;gap:14px;margin-top:27px}button{border:0;border-radius:22px;background:#ff8100;color:white;font-weight:bold;padding:11px 21px;cursor:pointer}#score{text-align:center;font:700 22px Arial,sans-serif;color:#064dc3;margin-top:15px}@media(max-width:850px){.questions{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:570px){.exercise{margin:8px;padding:15px;border-radius:16px}.questions{grid-template-columns:1fr}h1{font-size:21px}}</style></head><body><main class="exercise"><h1>Estimate the quotient of the following to the nearest 10.</h1><div class="questions"><div class="question"><label for="a0"><b>a.</b> 13484 ÷ 8 =</label><input id="a0" type="text" inputmode="numeric" autocomplete="off" aria-label="Answer a"></div><div class="question"><label for="a1"><b>b.</b> 8103 ÷ 2 =</label><input id="a1" type="text" inputmode="numeric" autocomplete="off" aria-label="Answer b"></div><div class="question"><label for="a2"><b>c.</b> 2403 ÷ 3 =</label><input id="a2" type="text" inputmode="numeric" autocomplete="off" aria-label="Answer c"></div><div class="question"><label for="a3"><b>d.</b> 3994 ÷ 6 =</label><input id="a3" type="text" inputmode="numeric" autocomplete="off" aria-label="Answer d"></div><div class="question"><label for="a4"><b>e.</b> 54558 ÷ 5 =</label><input id="a4" type="text" inputmode="numeric" autocomplete="off" aria-label="Answer e"></div></div><div class="actions"><button type="button" onclick="checkAnswers()">Check Answers</button><button type="button" onclick="resetExercise()">Reset</button></div><div id="score">Score: 0 / 5</div></main><script>
const answers=["1685", "4050", "800", "665", "10912"];const key='math-4-ch5-5c-nearest-10-v1';const inputs=[...document.querySelectorAll('.question input')];function save(){try{localStorage.setItem(key,JSON.stringify({values:inputs.map(e=>e.value),score:document.getElementById('score').textContent}))}catch(e){}}try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&Array.isArray(saved.values)){inputs.forEach((e,i)=>e.value=saved.values[i]??'');if(saved.score)document.getElementById('score').textContent=saved.score}}catch(e){}inputs.forEach(e=>e.addEventListener('input',()=>{e.classList.remove('good','bad');save()}));function checkAnswers(){let score=0;inputs.forEach((e,i)=>{const ok=e.value.trim()!==''&&Number(e.value.trim())===Number(answers[i]);e.classList.remove('good','bad');void e.offsetWidth;e.classList.add(ok?'good':'bad');if(ok)score++});document.getElementById('score').textContent=`Score: ${score} / 5`;save()}function resetExercise(){inputs.forEach(e=>{e.value='';e.classList.remove('good','bad')});document.getElementById('score').textContent='Score: 0 / 5';try{localStorage.removeItem(key)}catch(e){}}</script></body></html>
