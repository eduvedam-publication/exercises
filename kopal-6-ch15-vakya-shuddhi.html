<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>दिए गए वाक्यों को शुद्ध करके लिखिए–</title><style>*{box-sizing:border-box}body{margin:0;background:#b9faff;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#172a36}.wrap{max-width:1020px;margin:24px auto;background:white;border:3px solid #00a8ef;border-radius:20px;padding:24px}h1{color:#00a7f0;font-size:27px;margin:0 0 18px}.q{background:#e0f9ff;border:1.5px solid #00aeff;border-radius:11px;padding:13px;margin:9px 0;font-size:19px;line-height:1.7}.options,.bank{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}.opt,.chip,.slot{border:1px solid #00b0ff;background:white;border-radius:8px;padding:7px 12px;font-size:18px;cursor:pointer;color:#162734}.selected{background:#a8ebff;border-color:#008ee4}.correct{background:#d5f8df!important;border-color:#16a34a!important}.wrong{background:#ffe1e1!important;border-color:#ef4444!important}.slot{display:inline-flex;min-width:135px;min-height:41px;align-items:center;justify-content:center;border:2px dashed #ff776a;vertical-align:middle}.chip:disabled{opacity:.4;cursor:default}footer{text-align:center;margin-top:22px}footer button{border:0;background:#ff7300;color:white;padding:11px 17px;border-radius:24px;margin:3px;cursor:pointer;font-weight:bold}#score{color:#0045e9;font-size:21px;font-weight:bold;margin:10px}.line{display:inline-block;min-width:200px;border-bottom:1px solid #85939c;padding:4px 8px}input[type=text]{font:inherit;border:1px solid #00a8ef;border-radius:7px;padding:8px;max-width:100%;width:75%;background:white}input.correct{border-color:green}input.wrong{border-color:red}@media(max-width:650px){.wrap{margin:8px;padding:12px}h1{font-size:21px}.q{font-size:17px}.opt,.chip{font-size:16px}}</style></head><body><main class="wrap"><h1>दिए गए वाक्यों को शुद्ध करके लिखिए–</h1><div id="exercise"></div><footer><button onclick="submit()">Submit</button><button onclick="showAnswer()">Show Answer</button><button onclick="reset()">Reset</button><div id="score">Marks: 0 / 3</div></footer></main><script>const TYPE="text",DATA=[{"t": "(क) कामना/कवि/करते/हैं/सुख की — ", "a": "कवि सुख की कामना करते हैं।"}, {"t": "(ख) नई/वर्ष/आशाएँ/लाता/नया/है — ", "a": "नया वर्ष नई आशाएँ लाता है।"}, {"t": "(ग) हमें/लक्ष्य/चाहिए/बनाना/अपने — ", "a": "हमें अपने लक्ष्य बनाना चाहिए।"}],BANK=[];const KEY='kopal-6-ch15-'+TYPE;let answers={};try{answers=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};function save(){localStorage.setItem(KEY,JSON.stringify(answers))}function select(i,v){answers[i]=v;save();render()}function render(){document.querySelectorAll('[data-q]').forEach(el=>{let i=el.dataset.q;el.querySelectorAll('[data-value]').forEach(b=>b.classList.toggle('selected',answers[i]===b.dataset.value));let inp=el.querySelector('input');if(inp)inp.value=answers[i]||'';let slot=el.querySelector('.slot');if(slot)slot.textContent=answers[i]||'यहाँ छोड़ें'});document.querySelectorAll('.chip').forEach(b=>b.disabled=TYPE==='drag'&&Object.values(answers).includes(b.dataset.value))}function submit(){let n=0;document.querySelectorAll('[data-q]').forEach(el=>{let i=el.dataset.q,ok=answers[i]===DATA[i].a;if(ok)n++;el.querySelectorAll('.opt,.slot,input').forEach(x=>{x.classList.remove('correct','wrong');if(answers[i])x.classList.add(ok?'correct':'wrong')})});document.getElementById('score').textContent='Marks: '+n+' / '+DATA.length;window.parent.postMessage({type:'VIDYALAYA_EXERCISE_SUBMIT',exerciseType:TYPE==='mcq'?'OPTION':TYPE==='drag'?'DRAG_DROP':'FILL_BLANK',response:{answers,score:n,total:DATA.length}},'*')}function showAnswer(){DATA.forEach((q,i)=>answers[i]=q.a);save();render();submit()}function reset(){answers={};save();render();document.getElementById('score').textContent='Marks: 0 / '+DATA.length;document.querySelectorAll('.correct,.wrong').forEach(x=>x.classList.remove('correct','wrong'))}function dragstart(e,v){e.dataTransfer.setData('text/plain',v)}function drop(e,i){e.preventDefault();let v=e.dataTransfer.getData('text/plain');if(v)select(i,v)}let root=document.getElementById('exercise');if(TYPE==='drag'){let b=document.createElement('div');b.className='bank';BANK.forEach(v=>{let x=document.createElement('button');x.className='chip';x.textContent=v;x.dataset.value=v;x.draggable=true;x.ondragstart=e=>dragstart(e,v);x.onclick=()=>{let i=DATA.findIndex((q,j)=>!answers[j]);if(i>=0)select(i,v)};b.append(x)});root.append(b)}DATA.forEach((q,i)=>{let el=document.createElement('div');el.className='q';el.dataset.q=i;if(TYPE==='mcq'){el.append(document.createTextNode(q.t));let opts=document.createElement('div');opts.className='options';q.o.forEach((v,j)=>{let b=document.createElement('button');b.className='opt';b.dataset.value=v;b.textContent=['(i) ','(ii) ','(iii) '][j]+v;b.onclick=()=>select(i,v);opts.append(b)});el.append(opts)}else if(TYPE==='drag'){let parts=q.t.split('___');el.append(document.createTextNode(parts[0]));let s=document.createElement('button');s.className='slot';s.ondragover=e=>e.preventDefault();s.ondrop=e=>drop(e,i);s.onclick=()=>{if(answers[i]){delete answers[i];save();render()}};el.append(s,document.createTextNode(parts[1]||''))}else{el.append(document.createTextNode(q.t));let inp=document.createElement('input');inp.type='text';inp.placeholder='उत्तर लिखें';inp.oninput=e=>{answers[i]=e.target.value.trim();save()};el.append(inp)}root.append(el)});render();</script></body></html>
