<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add or Subtract</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9faff;font-family:Arial,sans-serif;color:#111}
.exercise{max-width:1080px;margin:25px auto;background:#fff;border:4px solid #08a9dc;border-radius:28px;padding:28px 32px}
h1{margin:0 0 18px;color:#00a5dc;font-size:25px}
.section{margin:12px 0 20px}
.visual-row{display:flex;align-items:center;gap:12px;margin:0 0 8px 5px}
.label{font-family:Georgia,serif;font-size:21px;width:24px}
.shapes{display:flex;gap:3px;flex-wrap:nowrap}
.triangle{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:24px solid #fff;filter:drop-shadow(0 0 0.6px #222)}
.triangle.filled{border-bottom-color:#347eb8}
.diamond{width:17px;height:25px;background:#fff;border:1px solid #444;transform:skewY(0deg) rotate(0deg);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.diamond.filled{background:#347eb8}
.cards{display:grid;grid-template-columns:repeat(4,115px);justify-content:space-between;padding:0 22px 0 28px}
.card{width:115px;height:140px;background:#dceefa;padding:7px}
.place{height:32px;display:grid;grid-template-columns:1fr 1fr;text-align:center;align-items:center;color:#ff4050;font-family:Georgia,serif;font-size:20px}
.row{height:31px;display:grid;grid-template-columns:25px 1fr 1fr;align-items:center;text-align:center;font-family:Georgia,serif;font-size:20px}
.op{border-bottom:2px solid #00aee8}
.answer{width:108px;height:30px;margin:2px -4px 0;border:2px solid #ff3b30;background:#fff;font-size:17px;padding:2px 5px;outline:none}
.answer.ok{background:#dcf8df;border-color:#009b8e}.answer.bad{background:#ffe1e1;border-color:#e43d30}
.actions{display:flex;justify-content:center;gap:14px;margin-top:26px}
button{border:0;border-radius:22px;padding:11px 20px;background:#ff8500;color:#fff;font-weight:700;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:700;color:#064bb4;margin-top:16px}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,115px);gap:18px;justify-content:space-around}.shapes{flex-wrap:wrap}.visual-row{align-items:flex-start}}
@media(max-width:400px){.exercise{margin:0;border-radius:0;padding:14px}.cards{grid-template-columns:115px;justify-content:center}h1{font-size:21px}}
</style>
</head>
<body>
<main class="exercise">
<h1>Add or Subtract. Complete each of the facts.</h1>

<section class="section">
 <div class="visual-row">
  <span class="label">a.</span>
  <div class="shapes" id="triangles"></div>
 </div>
 <div class="cards">
  <div class="card"><div class="place"><span>T</span><span>O</span></div><div class="row"><span></span><span>1</span><span>7</span></div><div class="row op"><span>+</span><span></span><span>7</span></div><input id="a0" class="answer"></div>
  <div class="card"><div class="place"><span>T</span><span>O</span></div><div class="row"><span></span><span></span><span>7</span></div><div class="row op"><span>+</span><span>1</span><span>7</span></div><input id="a1" class="answer"></div>
  <div class="card"><div class="place"><span>T</span><span>O</span></div><div class="row"><span></span><span>2</span><span>4</span></div><div class="row op"><span>−</span><span></span><span>7</span></div><input id="a2" class="answer"></div>
  <div class="card"><div class="place"><span>T</span><span>O</span></div><div class="row"><span></span><span>2</span><span>4</span></div><div class="row op"><span>−</span><span>1</span><span>7</span></div><input id="a3" class="answer"></div>
 </div>
</section>

<section class="section">
 <div class="visual-row">
  <span class="label">b.</span>
  <div class="shapes" id="diamonds"></div>
 </div>
 <div class="cards">
  <div class="card"><div class="place"><span>T</span><span>O</span></div><div class="row"><span></span><span>1</span><span>8</span></div><div class="row op"><span>+</span><span>1</span><span>2</span></div><input id="a4" class="answer"></div>
  <div class="card"><div class="place"><span>T</span><span>O</span></div><div class="row"><span></span><span>1</span><span>2</span></div><div class="row op"><span>+</span><span>1</span><span>8</span></div><input id="a5" class="answer"></div>
  <div class="card"><div class="place"><span>T</span><span>O</span></div><div class="row"><span></span><span>3</span><span>0</span></div><div class="row op"><span>−</span><span>1</span><span>2</span></div><input id="a6" class="answer"></div>
  <div class="card"><div class="place"><span>T</span><span>O</span></div><div class="row"><span></span><span>3</span><span>0</span></div><div class="row op"><span>−</span><span>1</span><span>8</span></div><input id="a7" class="answer"></div>
 </div>
</section>

<div class="actions"><button onclick="checkAnswers()">Check Answers</button><button onclick="resetExercise()">Reset</button></div>
<div id="result">Score: 0 / 8</div>
</main>

<script>
const tri=document.getElementById("triangles");
for(let i=0;i<24;i++){const s=document.createElement("span");s.className="triangle"+(i<7?" filled":"");tri.appendChild(s)}
const dia=document.getElementById("diamonds");
for(let i=0;i<30;i++){const s=document.createElement("span");s.className="diamond"+(i<18?" filled":"");dia.appendChild(s)}

const answers=["24","24","17","7","30","30","18","12"];
function checkAnswers(){
 let score=0;
 answers.forEach((v,i)=>{
  const e=document.getElementById("a"+i),ok=e.value.trim()===v;
  e.className="answer "+(ok?"ok":"bad"); if(ok)score++;
 });
 document.getElementById("result").textContent=`Score: ${score} / 8`;
}
function resetExercise(){
 document.querySelectorAll(".answer").forEach(e=>{e.value="";e.className="answer"});
 document.getElementById("result").textContent="Score: 0 / 8";
}
</script>
</body>
</html>
